name: Visual benchmark

# The reference pictures, rendered the same way every time and compared with the committed baseline. A change to the
# renderer is judged by what the pictures look like and how long they take, not by whether they merely came out.
on:
  pull_request:
    paths:
      - "pinneapple_tools/visualization/studio/**"
      - "data/benchmark/**"
      - "data/geometries/**"
      - "data/hdri/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.1"

jobs:
  gate:
    name: Reference pictures match the baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Blender (the renderer the baseline was recorded with)
        id: blender
        run: |
          dir="$RUNNER_TOOL_CACHE/blender-$BLENDER_VERSION"
          if [ ! -x "$dir/blender" ]; then
            curl -fsSL -o /tmp/blender.tar.xz \
              "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-$BLENDER_VERSION-linux-x64.tar.xz"
            tmp=$(mktemp -d)
            tar -xf /tmp/blender.tar.xz -C "$tmp"
            src=$(find "$tmp" -maxdepth 1 -mindepth 1 -type d | head -1)   # the tarball holds one folder
            mkdir -p "$dir"
            cp -a "$src"/. "$dir"/
            rm -rf "$tmp" /tmp/blender.tar.xz
          fi
          echo "BLENDER=$dir/blender" >> "$GITHUB_ENV"
          "$dir/blender" --version | head -1

      - name: Render the reference cases and compare them with the baseline
        run: |
          python -m pinneapple_tools.visualization.studio.benchmark \
            --out "$RUNNER_TEMP/benchmark" --gate --device cpu \
            --baseline data/benchmark/baseline.json

      - name: Keep the pictures, a failing gate is something to look at
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: ${{ runner.temp }}/benchmark
          if-no-files-found: ignore
          retention-days: 14
