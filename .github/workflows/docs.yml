name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Refresh the open-issues snapshot of the contribute page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/issues/build.py || echo "kept the committed snapshot"

      # The Playground (apps/playground) is published under <docs site>/playground/ only when the repository
      # variable PLAYGROUND_PAGES is "true" (Settings > Secrets and variables > Actions > Variables).
      - name: Add the Playground to the site (opt-in)
        if: ${{ vars.PLAYGROUND_PAGES == 'true' }}
        run: python apps/playground/build.py --out docs/playground

      - name: Build docs
        run: |
          mkdocs build --clean

      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --clean --force