name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PINNEAPPLE_DOCS_STRICT: "1"     # a generated page that fails to render fails the build (and the deploy)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The package itself (CPU torch) renders the generated pages: tools/gen_flow_docs.py writes
      # flow_studio/COVERAGE.md and flow_studio/EXAMPLES_AS_FLOWS.md into the site (they are not committed).
      - name: Install docs dependencies and the package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[flow]" -r requirements-docs.txt

      - name: Refresh the open-issues snapshot of the contribute page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/issues/build.py || echo "kept the committed snapshot"

      # The Playground (apps/playground) is published under <docs site>/playground/ only when the repository
      # variable PLAYGROUND_PAGES is "true" (Settings > Secrets and variables > Actions > Variables).
      - name: Add the Playground to the site (opt-in)
        if: ${{ vars.PLAYGROUND_PAGES == 'true' }}
        run: python apps/playground/build.py --out docs/playground

      - name: Build docs
        run: |
          mkdocs build --clean

      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --clean --force