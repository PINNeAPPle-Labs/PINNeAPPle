name: Draft PDF

on:
  push:
    branches: ["main"]
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml
  pull_request:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          # Path to the paper within the repository.
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: paper
          # Pandoc writes the PDF next to paper.md.
          path: paper/paper.pdf
          archive: false
