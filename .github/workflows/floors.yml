name: Dependency floors

# The minimum version each dependency promises, installed and run (#96). `numpy>=1.24` in pyproject.toml is a claim;
# this job is what makes it true. `constraints/floors.txt` pins every core floor with `==` and is generated by
# `scripts/licensing/supply_chain.py --record`, so the file cannot drift from the declaration without the audit
# saying so first.
#
# It runs on the lowest supported Python, because that is where a floor is under the most pressure: a wheel that
# does not exist for 3.10 is exactly the kind of thing a floor at the latest release hides.

on:
  push:
    branches: ["main"]
    paths: ["pyproject.toml", "constraints/floors.txt", "docs/dev/dependency_floors.json",
            "scripts/licensing/supply_chain.py", ".github/workflows/floors.yml"]
  pull_request:
    paths: ["pyproject.toml", "constraints/floors.txt", "docs/dev/dependency_floors.json",
            "scripts/licensing/supply_chain.py", ".github/workflows/floors.yml"]
  schedule:
    - cron: "41 4 * * 1"          # weekly: a floor that stops being installable is news even if nothing changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"      # requires-python's floor, recorded in docs/dev/dependency_floors.json
      - name: The declaration and the records agree
        run: |
          python -m pip install --upgrade pip
          python scripts/licensing/supply_chain.py --check
      - name: Install the tested minimum
        run: |
          python -m pip install -c constraints/floors.txt -e ".[dev]"
          python -c "import importlib.metadata as m, sys; print(sys.version); \
            print({n: m.version(n) for n in ['numpy', 'scipy', 'pandas', 'torch', 'xarray', 'zarr']})"
      - name: The fast suite runs on the floors
        run: |
          pytest tests/test_public_api.py tests/test_front_door.py tests/test_onboarding.py \
                 tests/test_agents_md.py tests/test_licensing_policy.py tests/test_supply_chain_audit.py \
                 tests/test_stability.py -q -p no:warnings
