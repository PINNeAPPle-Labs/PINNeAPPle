name: Observatory (browser tests)

on:
  push:
    branches: ["main"]
    paths:
      - "apps/observatory/**"
      - "apps/_shared/**"
      - "pinneapple_physics/astro/**"
      - "tests/test_observatory*.py"
      - ".github/workflows/observatory.yml"
  pull_request:
    paths:
      - "apps/observatory/**"
      - "apps/_shared/**"
      - "pinneapple_physics/astro/**"
      - "tests/test_observatory*.py"
      - ".github/workflows/observatory.yml"
  workflow_dispatch:

jobs:
  browser:
    # Serves the app offline (a local ISS TLE, no warm-up) and drives it in Chromium: languages, panels.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/observatory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the app (CPU torch) and the test runner
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "../..[sky]" -r requirements.txt pytest
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Interface catalogues and the hard-coded text lint
        run: pytest ../../tests/test_observatory_i18n.py -q -p no:warnings
      - name: Browser tests (Playwright)
        env:
          CI: "1"
        run: npx playwright test
