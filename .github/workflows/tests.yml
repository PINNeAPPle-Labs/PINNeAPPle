name: Tests (audit + core suite)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package + core test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pyvista,cost,fmi,hub,mcp,geometry]"
          pip install pytest datasets
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: App runtime and data contracts (must pass)
        run: |
          pip install fastapi httpx python-multipart pyarrow h5py
          pytest tests/pinneapple_data/test_contracts.py tests/pinneapple_core/test_service.py tests/test_appkit_runtime.py tests/pinneapple_core/test_workflows.py tests/test_simulation_runner_app.py -q
          pytest tests/pinneapple_data/test_doe.py tests/pinneapple_simulation/test_campaign_cases.py tests/test_app_campaign.py -q

      - name: Tier C — public API, cost validation, PyVista and CalculiX bridges (must pass)
        run: xvfb-run -a pytest tests/test_public_api.py tests/test_cost_validation.py tests/test_pyvista_bridge.py tests/test_calculix_bridge.py tests/test_example_imports.py tests/test_app_helpers.py tests/test_release_version.py tests/test_model_zoo.py tests/test_zoo_hub_formats.py tests/test_geometry_library.py tests/test_multiscale.py tests/test_aero_panel.py tests/test_benchmark_api.py tests/test_equal_budget.py tests/test_inverse_heat_budget.py tests/test_operator_benchmarks.py tests/test_fault_injection.py tests/test_validation_arena.py tests/test_inverse_core.py tests/test_design_intent.py tests/test_design_intent_entry_points.py -q

      - name: Validation arena — replay the stored escapes and false alarms (must pass)
        run: pinneapple check --arena-cases

      - name: Near-random forecasting — predictability, surrogates, purged splits, DM tests, forecaster zoo (must pass)
        run: |
          pip install scikit-learn statsmodels
          pytest tests/test_near_random_forecasting.py tests/test_near_random_visuals.py -q -p no:warnings

      - name: Experiment manifests — every examples/* folder and Lab run has a valid experiment.json (must pass)
        run: |
          python scripts/check_experiment_manifests.py
          pytest tests/test_experiment_manifests.py tests/test_experiments_site.py -q -p no:warnings

      - name: Agents — AGENTS.md examples and the MCP server (must pass)
        run: pytest tests/test_agents_md.py tests/test_mcp_server.py -q

      - name: Distributions — sdist and wheel contain every package, the sdist installs and imports (must pass)
        run: |
          pip install build
          python -m build --outdir /tmp/dist
          python scripts/check_dist.py /tmp/dist --install --no-deps

      - name: Astronomy accuracy (USNO NOVAS, JPL Horizons, USNO almanac, NASA eclipses) and the Observatory app (must pass)
        run: |
          pip install ".[sky]" fastapi httpx "uvicorn[standard]"
          pytest tests/test_astro_accuracy.py tests/test_astro_ai.py tests/test_astro_facts.py tests/test_astro_observing.py tests/test_astro_journey.py tests/test_observatory.py tests/test_observatory_i18n.py -q -p no:warnings

      - name: Tier B — manufactured-solution physics-correctness tests (must pass)
        run: pytest tests/test_manufactured_solutions.py -q

      - name: Electromagnetics — references, solvers, Maxwell checks, machines, topology optimisation (must pass)
        run: |
          pip install ".[em]"
          pytest tests/test_em_core.py tests/test_maxwell_checks.py tests/test_em_verification.py tests/test_emachine_pmsm.py tests/test_fdtd.py tests/test_motor_magnetics.py tests/test_topology_optimization.py tests/test_inspection.py tests/test_solver_exact_solutions_batch4.py -q -p no:warnings

      # `continue-on-error: true` (not `|| true` in the shell command) is
      # deliberate: it keeps the workflow from blocking on pre-existing,
      # untriaged failures (see AUDIT_REPORT.md) while still reporting
      # this step's real pass/fail status in the GitHub UI (a yellow
      # warning, not a false green checkmark) -- `|| true` was hiding
      # regressions by always exiting 0, this doesn't.
      - name: Tier A — full-library breadth audit (informational; see AUDIT_REPORT.md)
        run: pytest tests/test_full_library_matrix.py -q --tb=line
        continue-on-error: true

      - name: Rest of the test suite (pre-existing failures not yet triaged — see AUDIT_REPORT.md)
        run: pytest tests/ -q --ignore=tests/test_full_library_matrix.py --ignore=tests/test_manufactured_solutions.py
        continue-on-error: true

      - name: Model hub governance — reject any model card missing validation_metrics/reference_source
        run: python scripts/validate_model_card.py

  first-example:
    # A clean `pip install` of the built wheel runs the first example end to end (#44): no repo on the path,
    # CPU only. The job prints the wall time; the example is sized for about a minute on a laptop.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/dist
      - name: Clean venv, install the wheel (CPU torch), run the example outside the repo
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/clean/bin/pip install -q /tmp/dist/*.whl
          cp examples/first_example/first_example.py /tmp/run_first_example.py
          cd /tmp && time MPLBACKEND=Agg /tmp/clean/bin/python run_first_example.py
          test -s /tmp/first_example.png

  colab-notebooks:
    # The Colab notebooks run top to bottom on a CPU with tiny sizes (PINNEAPPLE_NB_SMOKE=1), and the committed
    # copies carry no outputs.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install (CPU torch) and the notebook runner
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . nbclient nbformat ipykernel imageio
      - name: Committed notebooks have no outputs
        run: python scripts/run_colab_notebooks.py --check-clean
      - name: Run every notebook in smoke mode
        run: python scripts/run_colab_notebooks.py --smoke --out /tmp/colab_out
