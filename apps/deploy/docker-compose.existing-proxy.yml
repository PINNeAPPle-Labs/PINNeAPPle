# Use when the server already runs a reverse proxy (e.g. another Caddy) on 80/443.
# Starts only the two apps and attaches them to that proxy's Docker network:
#
#   PROXY_NETWORK=<network of the existing proxy> \
#   docker compose -f docker-compose.yml -f docker-compose.existing-proxy.yml up -d --build heatsink pcb datahealth standardizer simmeta udr inverse \
#       preflight mesh compare lineage interop aero lab observatory playground evidence validate sensitivity uncertainty campaign meshless rom runner inverse-studio identifiability calibration models arena surrogate twin anomaly control optimize design
#
# Then point the proxy at pinneapple-heatsink:8080, pinneapple-pcb:8081, pinneapple-datahealth:8082,
# pinneapple-standardizer:8083, pinneapple-simmeta:8084 pinneapple-udr:8085, pinneapple-inverse:8086,
# pinneapple-preflight:8087, pinneapple-mesh:8088, pinneapple-compare:8089, pinneapple-lineage:8090 and
# pinneapple-interop:8091 and pinneapple-aero:8092 and pinneapple-lab:8093 and pinneapple-observatory:8094
# and pinneapple-playground:8095, pinneapple-campaign:8096, pinneapple-evidence:8113, pinneapple-validate:8107 and pinneapple-campaign:8096 and pinneapple-uncertainty:8098 and pinneapple-sensitivity:8099 (see pinneapple-runner:8110README.md).
# The Engineering Design Optimizer answers on pinneapple-optimize:8100.
# The Physics Design Optimizer answers on pinneapple-design:8106.
# The optional Engineering GUI Agent (heavy image) is started by name and answers on pinneapple-guiagent:8115.
services:
  caddy:                       # the server already has a proxy on 80/443: never start this project's own
    profiles: [own-proxy]
  heatsink:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-heatsink]
  pcb:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-pcb]

  datahealth:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-datahealth]
  standardizer:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-standardizer]
  simmeta:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-simmeta]
  udr:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-udr]
  inverse:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-inverse]
  preflight:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-preflight]
  mesh:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-mesh]
  compare:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-compare]
  lineage:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-lineage]
  interop:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-interop]
  aero:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-aero]
  lab:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-lab]
  observatory:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-observatory]
  playground:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-playground]
  runner:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-runner]
  campaign:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-campaign]
  uncertainty:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-uncertainty]
  sensitivity:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-sensitivity]
  validate:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-validate]
  evidence:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-evidence]
  calibration:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-calibration]
  identifiability:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-identifiability]
  inverse-studio:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-inverse-studio]
  guiagent:                    # optional heavy image: start it by name (... up -d --build --no-deps guiagent)
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-guiagent]
  rom:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-rom]
  meshless:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-meshless]
  surrogate:
