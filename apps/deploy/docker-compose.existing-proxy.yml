# Use when the server already runs a reverse proxy (e.g. another Caddy) on 80/443.
# Starts only the two apps and attaches them to that proxy's Docker network:
#
#   PROXY_NETWORK=<network of the existing proxy> \
#   docker compose -f docker-compose.yml -f docker-compose.existing-proxy.yml up -d --build heatsink pcb datahealth standardizer simmeta udr inverse \
#       preflight mesh compare lineage interop
#
# Then point the proxy at pinneapple-heatsink:8080, pinneapple-pcb:8081, pinneapple-datahealth:8082,
# pinneapple-standardizer:8083, pinneapple-simmeta:8084 pinneapple-udr:8085, pinneapple-inverse:8086,
# pinneapple-preflight:8087, pinneapple-mesh:8088, pinneapple-compare:8089, pinneapple-lineage:8090 and
# pinneapple-interop:8091 (see README.md).
services:
  heatsink:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-heatsink]
  pcb:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-pcb]

  datahealth:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-datahealth]
  standardizer:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-standardizer]
  simmeta:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-simmeta]
  udr:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-udr]
  inverse:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-inverse]
  preflight:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-preflight]
  mesh:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-mesh]
  compare:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-compare]
  lineage:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-lineage]
  interop:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-interop]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the existing proxy's Docker network}
