        aliases: [pinneapple-optimize]
  design:
    networks:
      default: {}
      proxy:
        aliases: [pinneapple-design]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the existing proxy's Docker network}
