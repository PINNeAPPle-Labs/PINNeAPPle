# The PINNeAPPle apps (HeatSink Sizer, PCB Hotspot, Data Health, Data Standardizer,
# Simulation Metadata) on one server, behind one Caddy (automatic HTTPS).
#
#   cp .env.example .env      # set the domains, logins and e-mail
#   docker compose up -d --build
#
# Needs ports 80 and 443 open and a DNS A record for each domain pointing at
# this server. See README.md for the full walkthrough.
name: pinneapple-apps

# Container hardening shared by every app (apps/deploy/README.md, docs/security/server.md): an unprivileged user
# (the images set uid 10001 too), a read-only root filesystem with /tmp in memory, no Linux capabilities, no
# privilege escalation, process / CPU limits and rotated logs. Only Caddy publishes ports.
x-app-hardening: &app-hardening
  user: "10001:0"
  read_only: true
  tmpfs:
    - /tmp:size=${APP_TMP_SIZE:-1g},mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: ${APP_PIDS_LIMIT:-512}
  cpus: ${APP_CPUS:-2}
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

# The same without the read-only root filesystem, for images that write outside /data and /tmp (the GUI agent's
# FreeCAD/X11 stack) or run as their own user (Ollama).
x-base-hardening: &base-hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: ${APP_PIDS_LIMIT:-512}
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  heatsink:
    <<: *app-hardening
    build:
      context: ../..                          # repository root
      dockerfile: apps/heatsink_sizer/Dockerfile
    image: pinneapple/heatsink-sizer:latest
    restart: unless-stopped
    environment:
      HSS_USER: ${HSS_USER:-}
      HSS_PASSWORD: ${HSS_PASSWORD:-}
      HSS_PASSWORD_HASH: ${HSS_PASSWORD_HASH:-}   # preferred: python -m pinneapple_security hash-password
      HSS_RATE_LIMIT: ${HSS_RATE_LIMIT:-}
      HSS_MAX_SIZING: ${HSS_MAX_SIZING:-2}
    expose: ["8080"]
    mem_limit: ${HSS_MEM_LIMIT:-2g}

