# Auth events the apps log as JSON on stderr (pinneapple_security.web.AuthAudit), read from Docker's json-file logs:
# failed logins, lockouts, refused cross-site posts and invalid API keys.
[Definition]
failregex = \\"event\\": \\"(?:login_failed|login_locked|csrf_blocked|api_key_lockout)\\", \\"ip\\": \\"<HOST>\\"
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
