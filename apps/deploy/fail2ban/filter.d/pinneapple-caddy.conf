# Repeated 401 (failed or missing login) and 429 (locked out, rate limited) answers in Caddy's JSON access log
# (apps/deploy/Caddyfile writes it to the caddy_data volume). client_ip is the address Caddy saw.
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"status":(?:401|429)\b
ignoreregex =
datepattern = "ts":{EPOCH}
