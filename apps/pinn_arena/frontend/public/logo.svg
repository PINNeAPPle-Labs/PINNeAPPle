<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Pineapple body (rhombus / diamond pattern) -->
  <ellipse cx="32" cy="38" rx="14" ry="18" fill="#f59e0b"/>

  <!-- Pineapple texture (diamond hatching) -->
  <line x1="18" y1="32" x2="46" y2="32" stroke="#d97706" stroke-width="1" opacity="0.6"/>
  <line x1="18" y1="38" x2="46" y2="38" stroke="#d97706" stroke-width="1" opacity="0.6"/>
  <line x1="18" y1="44" x2="46" y2="44" stroke="#d97706" stroke-width="1" opacity="0.6"/>
  <line x1="25" y1="22" x2="25" y2="56" stroke="#d97706" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="20" x2="32" y2="56" stroke="#d97706" stroke-width="1" opacity="0.6"/>
  <line x1="39" y1="22" x2="39" y2="56" stroke="#d97706" stroke-width="1" opacity="0.6"/>

  <!-- Pineapple crown (leaves) -->
  <path d="M24 22 Q20 14 26 10 Q27 18 30 22Z" fill="#10b981"/>
  <path d="M32 20 Q30 10 34 6 Q36 14 36 20Z" fill="#059669"/>
  <path d="M38 22 Q40 12 46 12 Q42 18 36 22Z" fill="#10b981"/>
  <path d="M29 22 Q26 12 20 14 Q24 18 28 22Z" fill="#34d399" opacity="0.8"/>
  <path d="M35 22 Q38 12 44 14 Q40 18 34 22Z" fill="#34d399" opacity="0.8"/>

  <!-- Atom orbit ring 1 (tilted ellipse) -->
  <ellipse cx="32" cy="36" rx="20" ry="8" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.75" transform="rotate(-30 32 36)"/>

  <!-- Atom orbit ring 2 -->
  <ellipse cx="32" cy="36" rx="20" ry="8" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.75" transform="rotate(30 32 36)"/>

  <!-- Atom nucleus -->
  <circle cx="32" cy="36" r="3" fill="#6366f1"/>

  <!-- Small electron dots -->
  <circle cx="14" cy="34" r="2" fill="#a5b4fc" opacity="0.9"/>
  <circle cx="50" cy="38" r="2" fill="#a5b4fc" opacity="0.9"/>
  <circle cx="32" cy="20" r="2" fill="#a5b4fc" opacity="0.9"/>
</svg>
