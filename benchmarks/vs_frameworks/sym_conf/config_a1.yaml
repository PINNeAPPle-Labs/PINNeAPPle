# Track A1 variant (constant learning rate) of the PhysicsNeMo-Sym 2.4.0 configuration of the cross-framework benchmark (composed by track_a_physicsnemo_sym.py
# with physicsnemo.sym.hydra.utils.compose). The defaults list is the one of the official examples
# examples/helmholtz/conf/config.yaml and examples/wave_equation/conf/config.yaml (NVIDIA/physicsnemo-sym v2.4.0);
# the runner overrides only what the protocol fixes (A1) or what the example sets (A2).
defaults:
  - physicsnemo_default
  - arch:
      - fully_connected
  - scheduler: exponential_lr
  - optimizer: adam
  - loss: sum
  - _self_

scheduler:
  gamma: 1.0

training:
  rec_results_freq: 1000000
  rec_constraint_freq: 1000000
  save_network_freq: 1000000
  print_stats_freq: ${oc.env:SYM_PRINT_FREQ,100}
  summary_freq: 1000000
  max_steps: 20000

batch_size:
  wall: 800
  interior: 4000
  IC: 315
  BC: 200
