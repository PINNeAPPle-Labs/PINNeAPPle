0b7 A table with measured \u2026"},{"n":181,"t":"[S32] Rocket nozzle benchmark with mesh-independence and isentropic checks","l":["roadmap","priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: owner's list of ideas (2026-10-06): \"realistic CFD example for a rocket\". The library already has the rocketnozzlecfd preset ([E16]); the realistic version is CFD-06 in PINNeAPPle-CFD (phase 1 approved mesh-independence check, phase 2 plume and pad, pending). Port the CFD-06 acceptance checks into the library benchmark: mesh-independence (Mach and shock position between a base and a 1.5\u00d7 refined mesh, target \u2026"},{"n":180,"t":"[S31] Process optimization with operating-limit guards","l":["roadmap","priority: P2","effort: L","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: owner's list of ideas (2026-10-06): \"modules for optimization and data analysis of industrial plant processes with ML and process automation\". Extends [G9] (process optimizer) and [H1] (sensor adapters already exist). The optimizer suggests setpoints; it never writes to a controller. Every suggestion is checked against operating limits (hard constraints from [S23]) and the twin's validity domain from [D7]. \u2026"},{"n":179,"t":"[S30] Stirred exothermic reactor as a digital-twin benchmark case","l":["roadmap","priority: P2","effort: M","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: LinkedIn post by Gabriel Hernandez Rozo: a 2D Python/Numba CFD model of an exothermic reactor with a three-blade impeller and a five-tube cooling system. Claimed: without agitation, conversion stalls near 20 percent with hotspots near 75 \u00b0C; with the impeller, conversion reaches about 75 percent and temperature about 48 \u00b0C, with mass conservation checked. Author's numbers, not verified. Candidate case for \u2026"},{"n":178,"t":"[S29] Public industrial surrogate benchmarks in the protocol","l":["roadmap","priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: Hodges, \"Database of code benchmarks\". The post lists runnable tutorials for surrogates (Transolver, Physics Transformers, DoMINO, GeoPT, PINNs, Mamba-based models) on DrivAerML, AirfRANS, HiLiftAeroML and structural datasets. Add at least two of these public datasets to the benchmark protocol from [B3] and [D5], with the same metrics, cost columns from [D4] and the extrapolation column from [D7]. Acceptance \u2026"},{"n":177,"t":"[S28] Inverse identification of structural parameters from measured displacements","l":["roadmap","priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: owner's list of ideas (2026-10-06): \"inverse modelling with structural mechanics\". Overlaps [K10] and [G5]; this issue is the structural case. Given displacements measured at a few points, identify the unknown parameters (e.g. Young's modulus, load) of the cantilever in examples/calculixcantilever/. Depends on [F1]. Tasks \u00b7 Generate synthetic measurements from CalculiX with known parameters, plus noise. \u00b7 \u2026"},{"n":176,"t":"[S27] One-shot trajectory surrogate for transient structural simulation","l":["roadmap","priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: LinkedIn post by Ben Chang on transformer surrogates for crash FEM. The post says the model is not yet as accurate as FEM and that contact and failure are open problems; no paper with numbers was accessible. Idea: predict the whole transient event in one forward pass instead of rolling out step by step, so errors do not compound over many time steps. Depends on [F1] (CalculiX in the benchmark). Tasks \u00b7 \u2026"},{"n":175,"t":"[S26] Physics-aware field tokenizer (research)","l":["roadmap","priority: P3","effort: L","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: camlab-ethz/Phaedra, paper arXiv:2602.03915, code on GitHub, models on Hugging Face. Phaedra factorizes field data into morphology tokens (finite scalar quantization of spatial structure) and amplitude tokens (approximately continuous magnitudes), to keep dynamic range and conservation properties at high compression. Reported: neural operators on its tokens have 16 to 43 percent lower error than on FSQ \u2026"},{"n":174,"t":"[S25] Preconditioned loss for physics-informed neural operators","l":["roadmap","priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: arXiv:2609.36216, Wen, Mishra, Zeinhofer, \"Preconditioned Physics-Informed Neural Operator Training\". The paper reports that the physics residual loss becomes ill-conditioned as the mesh is refined, and proposes a preconditioned residual loss (geometric and algebraic multigrid) that is architecture-agnostic and adds no inference cost. Claimed results (abstract only, not reproduced here): 4 to 25 times more \u2026"},{"n":173,"t":"[S24] Expert corrections become persistent checks","l":["roadmap","priority: P2","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: notes shared by the owner (2026-10-06); relates to [S8], [S23] and [D7]. Engineers correct or guide automated work. Each correction should become a check that future generated designs must pass, instead of being lost in a chat. Tasks \u00b7 Store a correction as a rule: the case it applies to, the condition, the reviewer, and the date. \u00b7 Run stored rules as part of the trust report from [S8] (status supports / \u2026"},{"n":172,"t":"[S23] Typed design constraints checked in stages","l":["roadmap","priority: P1","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: notes shared by the owner (2026-10-06); relates to [S10], [S13] and [B7]. Separate three kinds of requirements and check them in a fixed order: \u00b7 Hard constraints: must never be violated (e.g. thickness 2 mm, mass 5 mm, T < Tmax). \u00b7 Physics constraints: must hold for the physics (mass and energy conservation, boundary conditions, symmetry, known physical behaviour). \u00b7 Soft objectives: optimized, not enforced \u2026"},{"n":171,"t":"[S22] Dataset coverage and regime audit","l":["roadmap","priority: P1","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: notes shared by the owner (2026-10-06), extending [B8] and [S4]. Before training, measure whether a dataset is good enough to trust: \u00b7 Coverage: does the dataset cover the design space? \u00b7 Diversity: are the simulations actually different, or near-duplicates? \u00b7 Physical regimes: laminar/turbulent, low/high Reynolds, attached/separated flow, low/high pressure, thermal regimes. \u00b7 Information density: which \u2026"},{"n":170,"t":"[S21] Tracking issue: five reference demonstrations","l":["roadmap","priority: P1","effort: L","area: apps"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Track the five demonstrations from the strategy (\u00a76): \u00b7 1. Aerospace: wing STEP \u2192 CFD \u2192 operator \u2192 drag/lift \u2192 optimization \u2192 validation \u00b7 2. Automotive: 10k-design factory \u2192 operator \u2192 OOD \u2192 optimization \u00b7 3. Structural: bracket \u2192 FEA \u2192 surrogate \u2192 stress \u2192 mass optimization \u2192 UQ \u00b7 4. Industrial digital twin: surrogate \u2192 sensor stream \u2192 EnKF \u2192 anomaly \u00b7 5. Agentic engineering: cooling-system intent \u2192 five validated \u2026"},{"n":169,"t":"[S20] Geometry as a first-class layer (CAD, B-Rep, SDF, point cloud, mesh, graph)","l":["roadmap","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Cross-cutting, from the strategy's problem 13 and geometric AI. Geometry representations should be interchangeable inputs to the models. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":168,"t":"[S19] Multi-fidelity training from cheap, medium and high-fidelity data","l":["roadmap","priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Cross-cutting, from the strategy's problem 12. Train on a mix of fidelities with explicit weighting. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":167,"t":"[S18] Reproducibility: lineage of commit, environment, seeds and hardware","l":["roadmap","priority: P1","effort: M","area: release-quality"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Cross-cutting, from the strategy's problem 11. Every result records its commit, environment, seeds, hardware and inputs. Acceptance \u00b7 A command reproduces a stored result from its record. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":166,"t":"[S17] Physics foundation and world models (research program)","l":["roadmap","priority: P3","effort: L","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 9. Research program, not a near-term deliverable. Overlaps with [K18] and [K19]; keep the scope there and reference this issue for the strategy. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":165,"t":"[S16] Digital twin runtime with continuous validation and drift monitoring","l":["roadmap","priority: P2","effort: L","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 8. Serve a trained model with sensor input, state estimation and drift alarms tied to the trust envelope. Acceptance \u00b7 A replayed sensor stream triggers a drift alarm when inputs leave the validity domain. Overlaps with the existing issue [K15]; link there. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":164,"t":"[S15] Intent-to-problem compiler (natural language or CAD \u2192 universal problem)","l":["roadmap","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 7 (depends on [S2]). Map engineering intent to physics, geometry, materials and boundary conditions, asking for confirmation where the input is missing. Acceptance \u00b7 Ambiguous inputs produce explicit questions, not silent defaults. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":163,"t":"[S14] Engineering agent over the platform's typed APIs","l":["roadmap","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 7. The agent calls typed, audited tools (problem, simulate, train, validate, optimize, report). It must not bypass the trust layer. Acceptance \u00b7 An end-to-end run from an intent string to a validated report, with every tool call logged. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":162,"t":"[S13] Design loop: requirements \u2192 candidates \u2192 surrogate \u2192 validation \u2192 Pareto","l":["roadmap","priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 6. Connect optimization to the surrogate and to high-fidelity validation of the chosen candidates. Acceptance \u00b7 Given objectives and constraints, the loop returns a Pareto set where each candidate is validated by the solver. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":161,"t":"[S12] Adaptive fidelity: decide surrogate versus solver per request","l":["roadmap","priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 5. Use the surrogate when trust is APPROVED; otherwise call the high-fidelity solver and record why. Acceptance \u00b7 The routing decision and its reason are stored with each request. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":160,"t":"[S11] Generalization suite: geometry, physics, resolution and regime OOD","l":["roadmap","priority: P1","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 4. A model should be tested separately on each kind of out-of-distribution shift: geometry, physics parameters, resolution, regime. Acceptance \u00b7 For each shift type, a train/test split and a reported error, with the suite runnable from the benchmark arena. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":159,"t":"[S10] Automatic conservation and boundary-condition checks","l":["roadmap","priority: P1","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 4. Today these checks are booleans supplied by the caller. Compute them from the physics spec and the model's prediction. Acceptance \u00b7 Mass or energy conservation and boundary-condition violation are computed, not supplied, for at least two benchmark problems. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":158,"t":"[S9] Calibrate trust limits on real surrogates (decision D3)","l":["roadmap","priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 4. The 0.80 score, 60% coverage and 0.7 sub-score limits are provisional. Calibrate them on surrogates with measured error (CFD product: 0.23% to about 10%). Acceptance \u00b7 A calibration note with the data used, the limits chosen and the false approve/reject rates on that data. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":156,"t":"[S7] Physical Data Graph: lineage from problem to prediction","l":["roadmap","priority: P1","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 3. Registry stores exist separately (problem, dataset, model, experiment). Link them. Acceptance \u00b7 Given a prediction, the graph returns problem, geometry, simulation runs, dataset version, model version and validation record. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":155,"t":"[S6] Common PhysicsModel interface over PINN, operator, GNN, ROM and hybrids","l":["roadmap","priority: P1","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 3. One interface for fit, predict, uncertainty and export, independent of architecture. Acceptance \u00b7 The existing PINN, neural operator and ROM implementations satisfy the interface, with contract tests. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":154,"t":"[S5] Model selector: compare PINN, operator, GNN and ROM on a benchmark","l":["roadmap","priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 3. Today the user picks the architecture. The selector should benchmark candidates on the same data and report the winner with its validity domain. Acceptance \u00b7 For one problem, the selector returns a ranked table with error, cost and domain of validity for each candidate. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":153,"t":"[S4] Active learning: choose the next simulations from uncertainty","l":["roadmap","priority: P1","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 2. Train, find uncertainty and out-of-distribution regions, run the expensive simulation there, retrain. Tasks \u00b7 Acquisition function over the surrogate's uncertainty. \u00b7 Loop wired to the factory from [S3]. Acceptance \u00b7 On a benchmark case, the loop reaches a target error with fewer simulations than a random design (measured, not assumed). Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":152,"t":"[S3] Generic simulation factory (CAD \u2192 DOE \u2192 solver \u2192 dataset \u2192 QC)","l":["roadmap","priority: P1","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 2. The CFD product runs this pipeline only for pipe erosion. Generalize it. Tasks \u00b7 Parameterize geometry, DOE, solver choice and dataset writer behind interfaces. \u00b7 Add quality control: failed runs, convergence and mesh checks recorded as proofs (supports/contradicts/notrun). Acceptance \u00b7 The pipe-erosion case runs through the generic factory with the same results as the current pipeline. Source: \u2026"},{"n":151,"t":"[S2] Universal physical problem as a fa\u00e7ade over the reconciled spec","l":["roadmap","priority: P0","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 1 (depends on [S1]). Single entry point that describes a physical problem: objectives, constraints, geometry reference, physics, boundary conditions, outputs, fidelity. Tasks \u00b7 Implement the fa\u00e7ade on top of the reconciled spec from [S1]. \u00b7 Serialize to and from JSON. Acceptance \u00b7 A problem created in one place can be compiled into the PDE spec and into the elicited spec without re-entering data. Source: \u2026"},{"n":150,"t":"[S1] Reconcile the three problem specifications (decision D1)","l":["roadmap","priority: P0","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 1 of the strategy. Three overlapping specs exist: pinneappleproblemdesign/schema.py::ProblemSpec (elicited problems), pinneapplephysics/pdeenvironment/spec.py::ProblemSpec (PDEs), and pinneappledata/updtypes.py::ConditionSpec. Tasks \u00b7 Write a decision record listing the fields of each and the overlaps. \u00b7 Define explicit converters between them, with round-trip tests. \u00b7 Do not add a new class in this issue. \u2026"},{"n":142,"t":"[J8] Job queue and metering for the reference apps","l":["help wanted","roadmap","priority: P3","effort: L","area: apps"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Queueing and usage metering in the apps are stubs. Implement them only once real usage shows which tasks repeat; until then keep the stubs documented as such. Done when Decision recorded after real usage data; if implemented, a queue with limits and per-job usage records. | Priority | Effort | Target | |---|---|---| | P3 | L | unscheduled | Roadmap item J8 (plan of 2026-10-03). Contributions welcome: comment \u2026"},{"n":141,"t":"[J5] Document the \"simulation to surrogate in a day\" reference workflow","l":["help wanted","roadmap","priority: P2","effort: M","area: apps"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Write the end-to-end workflow with its deliverables (surrogate, validation report, inference API, benchmark table), expected time and limits, using only open data. Done when A tutorial reproduces the workflow from a public case and produces all four deliverables. | Priority | Effort | Target | |---|---|---| | P2 | M | unscheduled | Roadmap item J5 (plan of 2026-10-03). Contributions welcome: comment here \u2026"},{"n":140,"t":"[J4] Public leaderboard tied to the benchmark protocol","l":["roadmap","priority: P1","effort: L","area: apps"],"m":"v0.8.0","c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context A leaderboard should only accept results that follow the benchmark protocol and carry provenance, so entries are reproducible and comparable. Done when A submission without the required provenance or protocol fields is rejected with a clear message; accepted entries link to their evidence record. | Priority | Effort | Target | |---|---|---| | P1 | L | 0.8.0 | Roadmap item J4 (plan of 2026-10-03). \u2026"},{"n":139,"t":"[J3] Decide how the reference apps consume the library","l":["help wanted","roadmap","priority: P2","effort: S","area: apps"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context The apps live in the same repository as the library. Decide whether they stay there or depend on the published package, to avoid coupling release cycles. Done when The decision is recorded and applied (dependency pinned to a released version, or an explicit monorepo policy). | Priority | Effort | Target | |---|---|---| | P2 | S | unscheduled | Roadmap item J3 (plan of 2026-10-03). Contributions welcome: \u2026"},{"n":138,"t":"[J2] Build the reference-app Docker images in CI with a smoke test","l":["roadmap","priority: P1","effort: M","area: apps"],"m":"v0.8.0","c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context The images could not be built in the development environment because the PyTorch package index was unreachable there. Build them in CI and run a smoke test per app. Done when CI builds every app image and a smoke test hits each health endpoint. | Priority | Effort | Target | |---|---|---| | P1 | M | 0.8.0 | Roadmap item J2 (plan of 2026-10-03). Contributions welcome: comment here before starting so work is \u2026"},{"n":137,"t":"[J1] Reference apps in production: measure usage and tune limits","l":["roadmap","priority: P1","effort: S","area: apps"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context The data apps under apps/ are deployable. Add basic usage metrics, document upload and concurrency limits, and note what to tune after a week of real use. Done when A short operations note with measured o anyone with a host can repeat it. | Priority | Effort | Target | |---|---|---| | P2 | M | unscheduled | Roadmap item F7 (plan of 2026-10-03). Contributions \u2026"},{"n":133,"t":"[F6] Wall prism layers and target y+ in the OpenFOAM case generator","l":["help wanted","roadmap","priority: P2","effort: L","area: solvers"],"m":"v0.9.0","c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Isotropic meshes never reach the asymptotic range of a grid-convergence study for wall-driven quantities such as erosion. The case generator needs prism layers at walls with a target y+. Done when A generated case with prism layers reaches the asymptotic range in a grid-convergence (GCI) study on a reference case. | Priority | Effort | Target | |---|---|---| | P2 | L | 0.9.0 | Roadmap item F6 (plan of \u2026"},{"n":132,"t":"[F5] OpenFOAM connector: document and test the known numerical limits","l":["help wanted","roadmap","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context buoyantSimpleFoam, buoyantPimpleFoam and interIsoFoam hit real numerical limits in earlier case campaigns, and free-surface flow with k-omega SST was never run for real. Decide for each whether to accept the limit (and document it in the connector) or change the numerical approach. Done when A decision per solver is recorded in the docs, the free-surface SST case runs or is documented as unsupported, and a \u2026"},{"n":131,"t":"[D8] Feed measured cost into resource-aware scheduling","l":["help wanted","roadmap","priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Operations are tagged by resource kind (CPU light, CPU heavy, GPU preferred, I/O bound) with static labels. Derive the kind and the expected cost from measurements made with pinneappleanalysis.cost. Done when A scheduler or job profile table is generated from measured cost and records the machine it was measured on. | Priority | Effort | Target | |---|---|---| | P2 | M | unscheduled | Roadmap item D8 (plan \u2026"},{"n":119,"t":"[K20] Energy and emissions in the cost report","l":["help wanted","roadmap","priority: P3","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-03","up":"2026-10-03","p":null,"s":0,"a":false,"x":"Context Measure energy and emissions per operation in addition to time and FLOPs, with the cost module. A selling point for edge twins. Done when The report includes estimated joules with a declared method. | Priority | Effort | Target | |---|---|---| | P3 | M | unscheduled | Roadmap item K20 (plan of 2026-10-03; see the \"Standing requirements\" section of ROADMAP.md). Contributions welcome: comment here before \u2026"},{"n":118,"t":"[K19] Stochastic PDEs and rare events","l":["help wanted","roadmap","priority: P3","effort: L","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-03","up":"2026-10-03","p":null,"s":0,"a":false,"x":"Context Absent. Stochastic PDEs and rare-event (importance) sampling; useful for climate, finance and reliability. Done when A reference case with a known solution. | Priority | Effort | Target | |---|---|---| | P3 | L | unscheduled | Roadmap item K19 (plan of 2026-10-03; see the \"Standing requirements\" section of ROADMAP.md). Contributions welcome: comment here before starting so work is not duplicated. --- \u2026"},{"n":117,"t":"[K18] Physics foundation models and a fine-tuning recipe","l":["help wanted","roadmap","priority: P3","effort: L","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-03","up":"2026-10-03","p":null,"s":0,"a":false,"x":"Context Partial. Large-physics-model blocks and a hub with cards exist. A standard fine-tuning routine for small datasets and its benchmark evaluation are missing. Done when A pretrained model fine-tuned on 5% of the data reaches a defined error in the benchmark. | Priority | Effort | Target | |---|---|---| | P3 | L | unscheduled | Roadmap it const AREA_INTRO = {"area: core-api": "The public API, primitives and their stability.", "area: solvers": "Numerical solvers and their verification.",
  "area: surrogates-optimization": "Learned surrogates and design optimisation.", "area: benchmark-cost": "Fair benchmarks and the cost of each method.",

  "area: ecosystem": "Integrations with other tools and datasets.", "area: release-quality": "Packaging, CI and release hygiene.", "area: contributing": "Making it easier to contribute."};
const PRIO = {"priority: P0": ["P0", "Next release"], "priority: P1": ["P1", "Following release"], "priority: P2": ["P2", "Before 1.0"], "priority: P3": ["P3", "When there is demand"]};
const EFFORT = {"effort: S": ["S", "Up to a day"], "effort: M": ["M", "A few days"], "effort: L": ["L", "Weeks"]};

let ISSUES, BY;
function prepare() {
  ISSUES = SNAP.issues.map(i => {
    const text = i.t + " " + i.l.join(" ");
    const themes = THEMES.filter(t => t[3].test(text)).map(t => t[0]);
    const prio = i.l.find(l => l.startsWith("priority:")), eff = i.l.find(l => l.startsWith("effort:"));
    return {...i, themes: themes.length ? themes : ["other"], prio: prio ? PRIO[prio][0] : null, eff: eff ? EFFORT[eff][0] : null,
      areas: i.l.filter(l => l.startsWith("area:")),
      easy: i.l.includes("good first issue") || i.l.includes("help wanted") || eff === "effort: S"};
  });
  BY = Object.fromEntries(ISSUES.map(i => [i.n, i]));
}

/* ---------- filters ---------- */
const F = {q: "", prio: "", eff: "", easy: false, unassigned: false, sort: "priority"};
function pass(i) {
  if (F.prio && i.prio !== F.prio) return false;
  if (F.eff && i.eff !== F.eff) return false;
  if (F.easy && !i.easy) return false;
  if (F.unassigned && i.a) return false;
  if (F.q) {
    const q = F.q.toLowerCase().replace(/^#/, "");
    if (/^\d+$/.test(q)) return String(i.n).startsWith(q);
    return q.split(/\s+/).every(t => (i.t + " " + i.x + " " + i.l.join(" ")).toLowerCase().includes(t));
  }
  return true;
}
const PR = {P0: 0, P1: 1, P2: 2, P3: 3}, ER = {S: 0, M: 1, L: 2};
function sorted(list) {
  const k = F.sort;
  return [...list].sort((a, b) => k === "new" ? b.n - a.n : k === "updated" ? b.up.localeCompare(a.up) || b.n - a.n
    : k === "effort" ? (ER[a.eff] ?? 9) - (ER[b.eff] ?? 9) || (PR[a.prio] ?? 9) - (PR[b.prio] ?? 9) || b.n - a.n
    : (PR[a.prio] ?? 9) - (PR[b.prio] ?? 9) || (ER[a.eff] ?? 9) - (ER[b.eff] ?? 9) || b.n - a.n);
}

/* ---------- views: each returns [title, intro, groups:[{id,title,intro,items}]] ---------- */
function views() {
  const v = {};
  const live = ISSUES.filter(pass);
  const themed = id => live.filter(i => i.themes.includes(id));
  v.start = {title: "Where to start", intro: "Small, self-contained issues first: marked good first issue or help wanted, or estimated at up to a day.",
    groups: [
      {id: "s-small", title: "Up to a day", intro: "Effort S.", items: live.filter(i => i.eff === "S")},
      {id: "s-help", title: "Help wanted and good first issues", intro: "Explicitly open for contributors.", items: live.filter(i => i.l.includes("help wanted") || i.l.includes("good first issue"))},
      {id: "s-next", title: "Needed for the next release", intro: "Priority P0.", items: live.filter(i => i.prio === "P0")},
    ]};
  v.all = {title: "All open issues", intro: "Everything, in one list.", groups: [{id: "all", title: "Open issues", items: live}]};
  for (const [id, title, intro] of THEMES) v["theme/" + id] = {title, intro, groups: [{id: "t-" + id, title, items: themed(id)}]};
  v["theme/other"] = {title: "Other topics", intro: "Issues that match none of the themes.", groups: [{id: "t-other", title: "Other", items: themed("other")}]};
  v.themes = {title: "By theme", intro: "Themes are read from each issue's title and labels; an issue can sit in several. Use them to find what matches your field.",
    groups: [...THEMES.map(t => ({id: "t-" + t[0], title: t[1], intro: t[2], items: themed(t[0]), more: "theme/" + t[0]})),
             {id: "t-other", title: "Other topics", items: themed("other"), more: "theme/other"}]};
  const areas = [...new Set(ISSUES.flatMap(i => i.areas))].sort();
  v.areas = {title: "By area label", intro: "The roadmap's area labels (issues without one are listed at the end).",
    groups: [...areas.map(a => ({id: "a-" + a.slice(6), title: a.slice(6), intro: AREA_INTRO[a], items: live.filter(i => i.areas.includes(a))})),
             {id: "a-none", title: "No area label", items: live.filter(i => !i.areas.length)}]};
  const ms = [...new Set(ISSUES.map(i => i.m).filter(Boolean))].sort((a, b) => a.localeCompare(b, "en", {numeric: true}));
  v.releases = {title: "By release", intro: "Issues planned for a milestone, earliest first.",
    groups: [...ms.map(m => ({id: "r-" + m, title: m, items: live.filter(i => i.m === m)})), {id: "r-none", title: "Not scheduled", items: live.filter(i => !i.m)}]};
  v.priority = {title: "By priority", intro: "P0 is the next release, P3 is when there is demand.",
    groups: [...Object.values(PRIO).map(([p, d]) => ({id: "p-" + p, title: `${p} · ${d}`, items: live.filter(i => i.prio === p)})), {id: "p-none", title: "No priority yet", items: live.filter(i => !i.prio)}]};
  v.effort = {title: "By effort", intro: "Estimated size of the work.",
    groups: [...Object.values(EFFORT).map(([e, d]) => ({id: "e-" + e, title: `${e} · ${d}`, items: live.filter(i => i.eff === e)})), {id: "e-none", title: "Not estimated", items: live.filter(i => !i.eff)}]};
  const parents = ISSUES.filter(i => i.s > 0 || ISSUES.some(c => c.p === i.n));
  v.umbrellas = {title: "Umbrella issues", intro: "Large goals split into sub-issues. Pick a sub-issue; the umbrella explains why it matters.",
    groups: parents.map(p => ({id: "u-" + p.n, title: `#${p.n} ${p.t}`, items: live.filter(c => c.p === p.n), parent: p}))};
  return v;
}

/* ---------- rendering ---------- */
function issueHTML(i) {
  const tags = [];
  if (i.prio) tags.push(`<span class="tag p${i.prio[1]}">${i.prio}</span>`);
  if (i.eff) tags.push(`<span class="tag">effort ${i.eff}</span>`);
  if (i.easy && (i.l.includes("good first issue") || i.l.includes("help wanted"))) tags.push(`<span class="tag easy">${i.l.includes("good first issue") ? "good first issue" : "help wanted"}</span>`);
  if (i.m) tags.push(`<span class="tag rel">${esc(i.m)}</span>`);
  i.areas.forEach(a => tags.push(`<span class="tag">${esc(a.slice(6))}</span>`));
  const theme = i.themes[0] === "other" ? "" : (THEMES.find(t => t[0] === i.themes[0]) || [])[1];
  if (theme && !i.areas.length) tags.push(`<span class="tag" title="inferred from the title">${esc(theme)}</span>`);
  if (i.c) tags.push(`<span>${i.c} comment${i.c === 1 ? "" : "s"}</span>`);
  if (i.a) tags.push(`<span>assigned</span>`);
  const kids = ISSUES.filter(c => c.p === i.n);
  const parent = i.p && BY[i.p];
  return `<details class="issue" data-n="${i.n}"><summary><span class="num">#${i.n}</span><span class="ttl">${esc(i.t)}</span><span class="meta">${tags.join("")}</span></summary>
    <div class="body">${i.x ? `<p>${esc(i.x)}</p>` : ""}
    <div class="links"><a href="${GH}/issues/${i.n}">Open #${i.n} on GitHub</a>${parent ? `<span>part of <a href="#umbrellas" data-goto="${parent.n}">#${parent.n} ${esc(parent.t.slice(0, 60))}</a></span>` : ""}<span class="note">opened ${i.cr} · updated ${i.up}</span></div>
    ${kids.length ? `<div class="kids"><b>${kids.length} sub-issue${kids.length === 1 ? "" : "s"}</b>${kids.map(k => `<a href="${GH}/issues/${k.n}"><span>#${k.n}</span>${esc(k.t)}</a>`).join("")}</div>` : ""}</div></details>`;
}

function filtersHTML() {
  const opt = (o, v) => o.map(([val, lab]) => `<option value="${val}"${v === val ? " selected" : ""}>${lab}</option>`).join("");
  return `<div class="filters" role="group" aria-label="Filters">
    <label>Priority <select id="f-prio">${opt([["", "any"], ["P0", "P0"], ["P1", "P1"], ["P2", "P2"], ["P3", "P3"]], F.prio)}</select></label>
    <label>Effort <select id="f-eff">${opt([["", "any"], ["S", "S · a day"], ["M", "M · days"], ["L", "L · weeks"]], F.eff)}</select></label>
    <label>Sort <select id="f-sort">${opt([["priority", "priority"], ["effort", "smallest first"], ["new", "newest"], ["updated", "recently updated"]], F.sort)}</select></label>
    <button class="chip" id="f-easy" aria-pressed="${F.easy}">Good to start</button>
    <button class="chip" id="f-free" aria-pressed="${F.unassigned}">Unassigned</button>
    <button class="reset" id="f-reset">Clear</button></div>`;
}

function render() {
  const route = decodeURIComponent(location.hash.slice(1)) || "start";
  const v = views();
  const page = $("#page");
  if (route === "how") { page.innerHTML = howHTML(); after(route); return; }
  const view = v[route] || v.start;
  const total = ISSUES.length, shown = ISSUES.filter(pass).length;
  let h = `<div class="eyebrow">Contribute</div><h1>${esc(view.title)}</h1><p class="lede">${esc(view.intro)}</p>
    <div class="stats"><span><b>${total}</b> open issues</span><span><b>${shown}</b> match the filters</span><span><b>${ISSUES.filter(i => i.easy).length}</b> good to start</span><span class="note" id="fresh">snapshot ${esc(SNAP.taken)}</span></div>
    ${filtersHTML()}`;
  const overview = route === "themes" || route === "areas" || route === "releases" || route === "priority" || route === "effort" || route === "umbrellas" || route === "start";
  for (const g of view.groups) {
    const items = sorted(g.items);
    if (!items.length && overview && route !== "start") continue;
    const cap = overview && g.more ? 6 : Infinity;
    h += `<h2 id="${esc(g.id)}">${esc(g.title)} <span class="ct">${items.length}</span></h2>`;
    if (g.parent) h += `<p class="group-intro">${esc(g.parent.x.length > 260 ? g.parent.x.slice(0, 260).replace(/\s\S*$/, "") + " …" : g.parent.x)} <a href="${GH}/issues/${g.parent.n}">Open the umbrella</a></p>`;
    else if (g.intro) h += `<p class="group-intro">${esc(g.intro)}</p>`;
    h += items.length ? `<div class="list">${items.slice(0, cap).map(issueHTML).join("")}</div>` : `<p class="empty">Nothing here with these filters.</p>`;
    if (items.length > cap) h += `<p><a href="#${g.more}">All ${items.length} in ${esc(g.title)} →</a></p>`;
  }
  h += `<div class="foot">Issues from <a href="${GH}/issues">${REPO}</a>. Themes are inferred from the titles and labels, so an issue can be in more than one. New here? Read <a href="#how">how to contribute</a>.</div>`;
  page.innerHTML = h;
  after(route);
}

function howHTML() {
  return `<div class="eyebrow">Contribute</div><h1>How to contribute</h1><p class="lede">Pick an issue, say you are on it, and open a pull request that shows its evidence: a test, a check against a reference, or a figure.</p>
  <h2 id="steps">Steps</h2><div class="how">
  <div><b>Pick an issue</b>Start with <a href="#start">where to start</a> or your field in <a href="#themes">themes</a>. Comment on the issue so nobody duplicates the work.</div>
  <div><b>Set up</b><code>git clone ${GH}</code>, then <code>pip install -e ".[dev]"</code>. Python 3.10+.</div>
  <div><b>Branch and change</b>One issue per branch. Follow the style of the surrounding code; keep the change to what the issue needs.</div>
  <div><b>Show it works</b>Add a test with a number checked against a reference (closed form, manufactured solution, solver or paper). Run <code>pytest -q</code> and <code>ruff check</code>.</div>
  <div><b>Experiments go in the lab</b>A new case is an <code>Experiment</code> with checks; it then appears in the catalogue with its trust card.</div>
  <div><b>Open the pull request</b>Reference the issue (<code>Closes #123</code>), say what was checked and how, and add an entry to <code>CHANGELOG.md</code>.</div></div>
  <h2 id="links">Read next</h2><ul><li><a href="${GH}/blob/main/CONTRIBUTING.md">CONTRIBUTING.md</a></li><li><a href="../reference/">Module reference</a>: where things live in the code, with examples.</li><li><a href="../../lab/">Experiment catalogue</a></li><li><a href="${GH}/blob/main/CODE_OF_CONDUCT.md">Code of conduct</a></li></ul>`;
}

function navHTML(route) {
  const v = views(), n = k => v[k] ? v[k].groups.reduce((s, g) => s + g.items.length, 0) : 0;
  const link = (k, label, c) => `<a href="#${k}" class="${route === k ? "on" : ""}"><span>${esc(label)}</span>${c != null ? `<span class="ct">${c}</span>` : ""}</a>`;
  const live = ISSUES.filter(pass);
  let h = `<h4>Start</h4>${link("start", "Where to start", live.filter(i => i.eff === "S" || i.l.includes("help wanted") || i.l.includes("good first issue") || i.prio === "P0").length)}${link("how", "How to contribute")}${link("all", "All open issues", live.length)}`;
  h += `<details open><summary><h4>Themes</h4></summary>${link("themes", "Overview of themes")}${THEMES.map(t => link("theme/" + t[0], t[1], live.filter(i => i.themes.includes(t[0])).length)).join("")}${link("theme/other", "Other topics", live.filter(i => i.themes.includes("other")).length)}</details>`;
  h += `<details open><summary><h4>Organise by</h4></summary>${link("areas", "Area label")}${link("releases", "Release")}${link("priority", "Priority")}${link("effort", "Effort")}${link("umbrellas", "Umbrella issues", ISSUES.filter(i => i.s > 0 || ISSUES.some(c => c.p === i.n)).length)}</details>`;
  h += `<h4>Elsewhere</h4><a href="../"><span>PINNeAPPle Labs</span></a><a href="../reference/"><span>Module reference</span></a><a href="${GH}/issues/new/choose"><span>Open a new issue</span></a>`;
  return h;
}

let obs;
function after(route) {
  $("#nav").innerHTML = navHTML(route);
  const hs = [...document.querySelectorAll("#page h2[id]")];
  $("#toc").innerHTML = `<h4>On this page</h4>${hs.map(h => `<a href="#" data-id="${esc(h.id)}">${esc(h.childNodes[0].textContent.trim())}</a>`).join("") || `<p class="note">One list.</p>`}
    <div class="steps"><h4>Contributing in short</h4><ol><li>Pick an issue and comment on it.</li><li>Branch, change, add a test with a reference value.</li><li><code>pytest -q</code> and <code>ruff check</code>.</li><li>Pull request with <code>Closes #n</code>.</li></ol><p class="note"><a href="#how">More</a></p></div>`;
  $("#toc").querySelectorAll("a[data-id]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById(a.dataset.id)?.scrollIntoView({behavior: "smooth"}); closeDrawers(); }));
  if (obs) obs.disconnect();
  obs = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && $("#toc").querySelectorAll("a[data-id]").forEach(a => a.classList.toggle("on", a.dataset.id === e.target.id))), {rootMargin: "-70px 0px -70% 0px"});
  hs.forEach(h => obs.observe(h));
  const bind = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  bind("#f-prio", "change", e => { F.prio = e.target.value; rerender(); });
  bind("#f-eff", "change", e => { F.eff = e.target.value; rerender(); });
  bind("#f-sort", "change", e => { F.sort = e.target.value; rerender(); });
  bind("#f-easy", "click", () => { F.easy = !F.easy; rerender(); });
  bind("#f-free", "click", () => { F.unassigned = !F.unassigned; rerender(); });
  bind("#f-reset", "click", () => { Object.assign(F, {q: "", prio: "", eff: "", easy: false, unassigned: false, sort: "priority"}); $("#q").value = ""; rerender(); });
  document.querySelectorAll("[data-goto]").forEach(a => a.addEventListener("click", () => setTimeout(() => document.getElementById("u-" + a.dataset.goto)?.scrollIntoView(), 50)));
  try { localStorage.setItem("contrib-filters", JSON.stringify(F)); } catch {}
}
function rerender() { const y = scrollY; render(); scrollTo(0, y); }

/* ---------- drawers ---------- */
function setDrawer(w, open) { document.body.classList.toggle(w + "-open", open); $(`#${w}-btn`).setAttribute("aria-expanded", String(open)); }
function closeDrawers() { if (innerWidth <= 900) setDrawer("nav", false); if (innerWidth <= 1240) setDrawer("toc", false); }
$("#nav-btn").addEventListener("click", () => {
  if (innerWidth > 900) { const hid = document.body.classList.toggle("nav-hidden"); $("#nav").hidden = hid; document.querySelector(".layout").style.gridTemplateColumns = hid ? (innerWidth > 1240 ? "0 minmax(0,1fr) var(--toc-w)" : "0 minmax(0,1fr)") : ""; $("#nav-btn").setAttribute("aria-expanded", String(!hid)); return; }
  setDrawer("nav", !document.body.classList.contains("nav-open")); setDrawer("toc", false);
});
$("#toc-btn").addEventListener("click", () => { setDrawer("toc", !document.body.classList.contains("toc-open")); if (innerWidth <= 900) setDrawer("nav", false); });
$("#overlay").addEventListener("click", () => { setDrawer("nav", false); setDrawer("toc", false); });
addEventListener("keydown", e => { if (e.key === "Escape") { setDrawer("nav", false); setDrawer("toc", false); } if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } });
if (innerWidth > 900) $("#nav-btn").setAttribute("aria-expanded", "true");
let qt;
$("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value.trim(); if (F.q && location.hash.slice(1) !== "all") location.hash = "all"; else rerender(); }, 180); });
addEventListener("hashchange", () => { closeDrawers(); render(); scrollTo(0, 0); });
try { Object.assign(F, JSON.parse(localStorage.getItem("contrib-filters") || "{}"), {q: ""}); } catch {}

/* ---------- live refresh from the public API (falls back to the snapshot silently) ---------- */
async function refresh() {
  try {
    const all = [];
    for (let page = 1; page < 10; page++) {
      const r = await fetch(`https://api.github.com/repos/${REPO}/issues?state=open&per_page=100&page=${page}`, {headers: {Accept: "application/vnd.github+json"}});
      if (!r.ok) return;
      const b = await r.json(); all.push(...b); if (b.length < 100) break;
    }
    const clean = t => (t || "").replace(/```[\s\S]*?```/g, " ").replace(/<!--[\s\S]*?-->|<[^>]+>/g, " ").replace(/!\[[^\]]*\]\([^)]*\)/g, " ").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/^\s*#+\s*/gm, "").replace(/^\s*[-*]\s+\[[ xX]\]\s*/gm, "· ").replace(/^\s*[-*]\s+/gm, "· ").replace(/[*_`>]/g, "").replace(/\s+/g, " ").trim();
    const ex = t => { const c = clean(t); return c.length <= 420 ? c : c.slice(0, 420).replace(/\s\S*$/, "") + " …"; };
    SNAP = {...SNAP, taken: "live", issues: all.filter(i => !i.pull_request).map(i => ({n: i.number, t: i.title, l: i.labels.map(l => l.name), m: i.milestone && i.milestone.title, c: i.comments,
      cr: i.created_at.slice(0, 10), up: i.updated_at.slice(0, 10), p: i.parent_issue_url ? +i.parent_issue_url.split("/").pop() : null,
      s: (i.sub_issues_summary || {}).total || 0, a: !!(i.assignees && i.assignees.length), x: ex(i.body)})).sort((a, b) => b.n - a.n)};
    prepare(); rerender();
    const f = $("#fresh"); if (f) f.textContent = "live from GitHub";
  } catch {}
}
prepare();
render();
refresh();
</script>
</body>
</html>
