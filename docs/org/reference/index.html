<style>

  --bg: #12150f; --surface: #181c14; --sunk: #1d2219; --fg: #ecebdf; --muted: #a3a796; --faint: #7b8072;

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h) + 12px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }

button { font: inherit; color: inherit; }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; height: var(--top-h); display: flex; align-items: center; gap: 10px;
  padding-inline: 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.burger { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.burger svg { width: 18px; height: 18px; }
.burger[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--fg); min-width: 0; white-space: nowrap; }
.brand b { font: 600 1.05rem Fraunces, Georgia, serif; }
.brand span { color: var(--muted); font-size: 0.85rem; }
.search { flex: 1; max-width: 460px; margin-left: auto; position: relative; min-width: 0; }
.search input { width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 12px 0 34px; font: inherit; color: var(--fg); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search svg { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; color: var(--faint); }
.results { position: absolute; top: 44px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.12); max-height: 60vh; overflow: auto; padding: 6px; }
.results a { display: grid; gap: 1px; padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--fg); }
.results a:hover, .results a.on { background: var(--sunk); }
.results small { color: var(--muted); font-size: 0.78rem; overflow-wrap: anywhere; }
.results .none { padding: 10px; color: var(--muted); }

/* layout */
.layout { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--toc-w); }
.nav, .toc { position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; }
.nav { border-right: 1px solid var(--line); padding: 14px 10px 40px; background: var(--bg); }
.toc { border-left: 1px solid var(--line); padding: 20px 16px 40px; }
main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 80px; }
.page { max-width: 860px; margin: 0 auto; }
.overlay { display: none; }

/* left navigation */
.nav h4 { margin: 18px 8px 6px; font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.nav h4:first-child { margin-top: 2px; }
.nav details { margin: 0; }
.nav summary { list-style: none; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.nav summary::-webkit-details-marker { display: none; }
.nav summary .chev { width: 14px; flex: none; color: var(--faint); transition: transform .15s; }
.nav details[open] > summary .chev { transform: rotate(90deg); }
.nav .leaf { padding-left: 28px; }
.nav a.item { display: block; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); font-size: 0.92rem; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav summary a.item { padding: 0; }
.nav summary:hover, .nav a.item:hover { background: var(--sunk); }
.nav .on, .nav summary.on { background: var(--accent-soft); }
.nav .on > a.item, .nav a.item.on { color: var(--accent-ink); font-weight: 600; }
.nav .kids { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 4px; }
.nav .kids a.item { font-family: "JetBrains Mono", monospace; font-size: 0.8rem; }
.nav .kids > a.item { padding-left: 28px; }
.page p code, .page li code { background: var(--sunk); padding: 0 4px; border-radius: 4px; font-size: 0.86em; }

/* right toc */
.toc h4 { margin: 0 0 10px; font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }

.toc a:hover { color: var(--fg); }
.toc a.on { color: var(--accent-ink); border-left-color: var(--accent); }

/* content */
.crumbs { font-size: 0.82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.crumbs a { color: var(--muted); }
.eyebrow { font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); margin: 6px 0 6px; }
h1 code { font-size: 0.6em; font-weight: 500; color: var(--muted); display: block; margin-top: 6px; font-family: "JetBrains Mono", monospace; overflow-wrap: anywhere; }
.tagline { font-size: 1.12rem; color: var(--muted); margin: 0 0 18px; max-width: 40em; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }
h2 { font-size: 1.5rem; margin: 44px 0 12px; padding-top: 4px; }
h3 { font-size: 1.12rem; margin: 30px 0 10px; }
.page p { max-width: 68ch; }
.page > ul { max-width: 68ch; }
.use { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--leaf); border-radius: 8px; padding: 12px 16px 12px 34px; margin: 0; }
.use li + li { margin-top: 4px; }
.shim { background: var(--accent-soft); border-radius: 8px; padding: 12px 16px; }

.example { margin: 18px 0 30px; }
.example h3 { margin-top: 0; display: flex; gap: 10px; align-items: baseline; }

.out-label { font: 600 0.7rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 12px 0 4px; display: flex; justify-content: space-between; }

.figs { display: grid; gap: 12px; margin-top: 12px; }
.figs img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.k { color: var(--kw); } .s { color: var(--str); } .m { color: var(--num); } .c { color: var(--com); font-style: italic; } .f { color: var(--fn); }

.mods { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

.mods a:hover { border-color: var(--accent); }
.mods code { font-size: 0.8rem; overflow-wrap: anywhere; }
.mods small { color: var(--muted); font-size: 0.8rem; line-height: 1.4; }
.mods .kind { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }

.sym { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 12px 0; overflow: hidden; }
.sym > header { padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sunk); }
.sym > header .tag { font: 600 0.66rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-right: 6px; }
.sym > header code { font-size: 0.84rem; overflow-wrap: anywhere; }
.sym > header code b { color: var(--fn); }
.sym .body { padding: 10px 14px; font-size: 0.9rem; }
.sym .body p { margin: 0 0 8px; }
.sym .meth { border-top: 1px solid var(--line); padding: 8px 0; }
.sym .meth code { font-size: 0.8rem; overflow-wrap: anywhere; }
.sym .meth div { color: var(--muted); font-size: 0.85rem; }
.doc pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; font-size: 0.8rem; margin: 8px 0; }
.doc h5 { margin: 12px 0 4px; font: 600 0.75rem Inter, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.doc code { background: var(--sunk); padding: 0 4px; border-radius: 4px; font-size: 0.86em; }
.doc ul { padding-left: 20px; margin: 6px 0; }
.fields { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
.filter { width: 100%; max-width: 320px; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--surface); color: var(--fg); font: inherit; font-size: 0.88rem; }

.home-groups { display: grid; gap: 22px; }
.grp h3 { margin: 0 0 8px; font-size: 1rem; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.cards a { display: grid; gap: 4px; align-content: start; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--fg); min-width: 0; }
.cards a:hover { border-color: var(--accent); }
.cards b { font-family: Fraunces, Georgia, serif; font-size: 1.02rem; }
.cards small { color: var(--muted); line-height: 1.45; }
.cards .meta { font-size: 0.75rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.loading { color: var(--muted); padding: 30px 0; }
.foot { margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--faint); font-size: 0.82rem; }

/* drawers */
@media (max-width: 1240px) {
  .layout { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  .toc { position: fixed; right: 0; top: var(--top-h); z-index: 25; width: min(300px, 86vw); background: var(--bg);
    transform: translateX(100%); transition: transform .2s ease, visibility .2s; visibility: hidden; }

}

  .layout { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; left: 0; top: var(--top-h); z-index: 25; width: min(320px, 88vw); transform: translateX(-100%);
    transition: transform .2s ease, visibility .2s; visibility: hidden; }
  body.nav-open .nav { transform: none; visibility: visible; box-shadow: 12px 0 30px rgba(0,0,0,.12); }
  .brand span { display: none; }
}
@media (max-width: 1240px) {
  body.nav-open .overlay, body.toc-open .overlay { display: block; position: fixed; inset: var(--top-h) 0 0 0; z-index: 20; background: var(--overlay); }
}
@media (min-width: 901px) { body.nav-open .overlay { display: none; } body.nav-open.toc-open .overlay { display: block; } }
@media (min-width: 1241px) { #toc-btn { display: none; } }
@media (max-width: 560px) { .brand b { font-size: 0.95rem; } main { padding-top: 20px; } .search input { padding-left: 30px; } }
</style>

<script>
const INDEX = {"groups":[{"id":"foundations","title":"Foundations"},{"id":"physics","title":"Physics and simulation"},{"id":"learning","title":"Learning"},{"id":"trust","title":"Trust and analysis"},{"id":"data","title":"Data"},{"id":"systems","title":"Systems and design"},{"id":"show","title":"Visualisation"},{"id":"workflow","title":"Workflow and infrastructure"},{"id":"frontier","title":"Research modules"},{"id":"legacy","title":"Compatibility shims"}],"packages":[{"name":"pinneapple","group":"foundations","title":"pinneapple","tagline":"The short front door: one import for the most used entry points.","about":["`import pinneapple as pp` gives the shortcuts that most scripts need without remembering which subpackage holds them: solve and compare physics problems, run solvers, train models, render and export results, and `pp.fea` for CalculiX studies built in Python.","Everything it exposes lives in one of the packages below; the shortcut and the full path are the same object, so you can start short and move to the full path when you need the details."],"use_when":["You are writing a script or notebook and want the common entry points.","You want to see what the library covers before choosing a subpackage."],"shim":null,"examples":[{"title":"What the front door exposes","code":"import pinneapple as pp\n\nnames = [n for n in dir(pp) if not n.startswith(\"_\")]\nprint(len(names), \"public names, e.g.:\")\nprint(\", \".join(sorted(names)[:40]))\nprint(\"pp.fea ->\", pp.fea.__name__)","output":"197 public names, e.g.:\nAFNO, ActiveLearningConfig, AdaptiveCollocationTrainer, Backend, BenchmarkConfig, BenchmarkResult, BenchmarkTaskBase, BoxConstraint, CADToCFDPipeline, CFDMesh, CSGCircle, CSGDifference, CSGEllipse, CSGIntersection, CSGPolygon, CSGRectangle, CSGUnion, CauchyMisfit, CausalPINNTrainer, CausalWeightScheduler, ChannelDomain2D, ChannelWithObstacleDomain2D, CollocationConfig, CollocationSampler, Comparison, ComposedObsOperator, CompositeObjective, CompositeRegularizer, ConformalPredictor, ConstraintSet, ContinuousAdjointSolver, DDPPINNTrainer, DDPTrainerConfig, DEFAULT_MODELS, DesignOptConfig, DesignOptLoop, DesignOptResult, DesignOptimizerConfig, DigitalTwin, DigitalTwinConfig\npp.fea -> pinneapple_simulation.external_solvers.calculix.study","figures":[],"seconds":78.3}],"modules":1,"symbols":2,"outline":{"name":"pinneapple","kind":"package","summary":"pinneapple \u2014 Physics-Informed Neural Networks for Engineering and Research.","children":[]}},{"name":"pinneapple_core","group":"foundations","title":"Core primitives","tagline":"Domain, Geometry, Mesh and Field: one vocabulary for tensors, geometry and topology.","about":["Physics AI keeps passing the same things around: a region, points sampled in it, values on a grid, a mesh or a point cloud, and derivatives of those values. `pinneapple_core` gives them one interface.","A `Field` answers `gradient()`, `divergence()`, `interpolate(x)` and `integrate()` whatever it is stored on (regular grid, simplex mesh with exact P1 operators, or scattered points with local least squares). `FunctionField` gives the same interface to a torch callable such as a PINN, through autograd. The free functions in `operators` (`grad`, `div`, `curl`, `laplacian`, `integrate`, `flux`) work on all of them."],"use_when":["You need derivatives or integrals of a field and do not want to care how it is discretised.","You are writing a solver, loss or dataset that should accept grids, meshes and point clouds alike."],"shim":null,"examples":[{"title":"Gradient and integral of a field on a grid, checked against calculus","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_core import Field, Domain\n\nx = np.linspace(0, 1, 101); y = np.linspace(0, 1, 101)\nX, Y = np.meshgrid(x, y, indexing=\"ij\")\nu = np.sin(np.pi * X) * np.sin(np.pi * Y)\nf = Field.on_grid([x, y], u, name=\"u\")\n\ng = f.gradient().values.reshape(101, 101, 2)   # (points, component, dim) -> grid\nexact = np.pi * np.cos(np.pi * X) * np.sin(np.pi * Y)\nprint(\"max |du/dx - exact| =\", float(np.abs(g[..., 0] - exact).max()))\nprint(\"integral =\", float(f.integrate()), \" exact 4/pi^2 =\", 4 / np.pi ** 2)\n\nd = Domain.box([0, 0], [1, 1])\npts = d.sample_interior(5, seed=0)\nprint(\"u at random points:\", np.round(f.interpolate(pts), 4))\n\nfig, ax = plt.subplots(1, 2, figsize=(8, 3.4))\nfor a, val, t in [(ax[0], u, \"u = sin(pi x) sin(pi y)\"), (ax[1], np.hypot(g[..., 0], g[..., 1]), \"|grad u|\")]:\n    im = a.pcolormesh(X, Y, val, shading=\"auto\", cmap=\"viridis\"); a.set_title(t); a.set_aspect(\"equal\")\n    fig.colorbar(im, ax=a, shrink=0.85)","output":"max |du/dx - exact| = 0.0010331855701966042\nintegral = 0.405218069547683  exact 4/pi^2 = 0.4052847345693511\nu at random points: [0.6813 0.0067 0.1498 0.7093 0.2006]","figures":["figures/pinneapple_core__0_0.png"],"seconds":1.3}],"modules":14,"symbols":77,"outline":{"name":"pinneapple_core","kind":"package","summary":"pinneapple_core: Field, Mesh, Domain and Geometry as shared primitives.","children":[{"name":"pinneapple_core.backend","kind":"module","summary":"PhysicsBackend: one array/derivative/solve API over torch, jax and anything registered.","children":[]},{"name":"pinneapple_core.data","kind":"module","summary":"Physics-native data API: PhysicsDataset, DataLoader and the samplers.","children":[]},{"name":"pinneapple_core.domain","kind":"module","summary":"Domain: the region of space a problem lives on.","children":[]},{"name":"pinneapple_core.fem","kind":"module","summary":"Differentiable P1 finite elements on simplex meshes.","children":[]},{"name":"pinneapple_core.field","kind":"module","summary":"Field: values of a physical quantity on a grid, a mesh or a point cloud.","children":[]},{"name":"pinneapple_core.func","kind":"module","summary":"pp.func: function transforms with scientific semantics, and implicit differentiation.","children":[]},{"name":"pinneapple_core.geometry","kind":"module","summary":"Geometry: a Domain plus named boundaries and a way to mesh it.","children":[]},{"name":"pinneapple_core.loss","kind":"module","summary":"pp.loss: functional loss terms and a balancer selectable by name.","children":[]},{"name":"pinneapple_core.mesh","kind":"module","summary":"Mesh: simplex meshes (intervals, triangles, tetrahedra) with P1 calculus.","children":[]},{"name":"pinneapple_core.module","kind":"module","summary":"PhysicsModule: composable models and solvers, the nn.Module of physics.","children":[]},{"name":"pinneapple_core.operators","kind":"module","summary":"Physics operators: grad, div, curl, laplacian, jacobian, hessian, integrate, flux.","children":[]},{"name":"pinneapple_core.optim","kind":"module","summary":"PhysicsOptimizer(parameters, objective, constraints): one interface for several optimizer families.","children":[]},{"name":"pinneapple_core.transforms","kind":"module","summary":"pp.transforms: composable, invertible transforms for tables, datasets and problems, with provenance.","children":[]}]}},{"name":"pinneapple_physics","group":"physics","title":"Physics problems and PINNs","tagline":"Define a physical problem once, solve it with a PINN, a solver or a closed form, and compare.","about":["`pde_environment` describes a problem as a `ProblemSpec`: the PDE terms, the boundary and initial conditions, data constraints and scales, with presets for Navier-Stokes, heat, wave, Burgers, elasticity, Helmholtz and RANS turbulence models. `pinn_solver` compiles a spec into differentiable losses, and `symbolic_pde` turns SymPy expressions into autograd residuals.","Not every engineering question needs a PDE. `closed_form` holds textbook models (fins, beams and fatigue, Helmholtz resonators, heat sinks, PCB thermal) as fast ground truth, and `tribology` solves sliding wear with contact-pressure redistribution. Domain packages (`weather`, `blackhole`, `pcb`) build on the same pieces."],"use_when":["You want a PINN for a known PDE with its boundary conditions written down once.","You need a quick, citable reference value to check a solver or a surrogate against."],"shim":null,"examples":[{"title":"Burgers' equation: a PINN against the Cole-Hopf solution, through one API","code":"import numpy as np\nimport matplotlib.pyplot as plt\nimport pinneapple as pp\n\npinn = pp.solve(\"burgers_1d\", method=\"pinn\", epochs=3000)\nexact = pp.solve(\"burgers_1d\", method=\"analytic\")\ndef trained_pinn(problem, **kw):            # compare() takes method names or callables returning a Solution\n    return pinn\nprint(pp.compare(\"burgers_1d\", methods=[trained_pinn], reference=exact))\n\nx = np.linspace(-1, 1, 400)\nfig, ax = plt.subplots(figsize=(7.5, 3))\nfor t in (0.0, 0.25, 0.5, 0.75):\n    X = np.column_stack([x, np.full_like(x, t)])\n    l, = ax.plot(x, exact.predict(X)[:, 0], lw=2.2, alpha=0.5)\n    ax.plot(x, pinn.predict(X)[:, 0], \"--\", c=l.get_color(), label=f\"t = {t}\")\nax.set_xlabel(\"x\"); ax.set_ylabel(\"u\"); ax.legend(fontsize=7); ax.set_title(\"PINN (dashed) vs Cole-Hopf (solid)\")","output":"Comparison on 'burgers_1d_default' against 'analytic' at 4096 points\nmethod          kind       status     train [s]  infer [us/pt]  ref sims  relL2(u)\ntrained_pinn    neural     ok               142          0.442         0  2.092e-03","figures":["figures/pinneapple_physics__0_0.png"],"seconds":147.9},{"title":"Closed-form engineering checks: cantilever fatigue and a Helmholtz port","code":"from pinneapple_physics.closed_form.cantilever_fatigue import (\n    cantilever_root_bending_stress_pa, basquin_fatigue_life_cycles)\nfrom pinneapple_physics.closed_form.helmholtz_resonator import helmholtz_resonant_frequency_hz, port_volume_m3\n\ns = cantilever_root_bending_stress_pa(width_m=0.02, thickness_m=0.004, load_n=60.0, length_m=0.15)\nprint(f\"root bending stress: {s / 1e6:.1f} MPa\")          # 6 F L / (b t^2)\nlife = basquin_fatigue_life_cycles(s, fatigue_strength_coeff_pa=900e6, fatigue_strength_exponent=-0.09)\nprint(f\"Basquin life at that amplitude: {life:.3g} cycles\")\nf = helmholtz_resonant_frequency_hz(port_radius_m=0.035, port_length_m=0.12, cabinet_volume_l=40.0)\nprint(f\"bass-reflex tuning of a 40 L box with a 70 mm x 120 mm port: {f:.1f} Hz\")","output":"root bending stress: 168.8 MPa\nBasquin life at that amplitude: 5.98e+07 cycles\nbass-reflex tuning of a 40 L box with a 70 mm x 120 mm port: 40.0 Hz","figures":[],"seconds":3.9},{"title":"Sliding wear of a bar end (Archard with pressure redistribution)","code":"import matplotlib.pyplot as plt\nfrom pinneapple_physics.tribology import BarWear, WEAR_MATERIALS\n\nbar = BarWear(WEAR_MATERIALS[\"60/40 brass\"], load_N=50.0)\nres = bar.run(distance_m=400.0, n_save=6)\nprint(f\"specific wear rate K = {bar.material.K:.2e} mm^3/(N m)\")\nprint(f\"worn volume {res['volume'][-1]:.3f} mm^3  vs  K F s = {bar.material.K * 50.0 * 400.0:.3f} mm^3\")\nprint(f\"peak pressure {res['p_max'][0]:.1f} -> {res['p_max'][-1]:.2f} MPa (flat punch F/A = {50 / 200:.2f} MPa)\")\n\nfig, ax = plt.subplots(1, 2, figsize=(8.5, 3.2))\nfor s, p in zip(res[\"s_saved\"], res[\"pressures\"]):\n    ax[0].plot(res[\"x\"], p, label=f\"s = {s:.0f} m\")\nax[0].set_xlabel(\"x along the bar end (mm)\"); ax[0].set_ylabel(\"contact pressure (MPa)\"); ax[0].legend(fontsize=7)\nax[1].plot(res[\"s\"], res[\"p_max\"]); ax[1].axhline(0.25, ls=\"--\", c=\"k\", lw=0.8)\nax[1].set_xlabel(\"sliding distance (m)\"); ax[1].set_ylabel(\"peak pressure (MPa)\"); ax[1].set_yscale(\"log\")\nax[1].set_title(\"running-in to the flat-punch pressure\")","output":"specific wear rate K = 6.32e-04 mm^3/(N m)\nworn volume 12.632 mm^3  vs  K F s = 12.632 mm^3\npeak pressure 6.2 -> 0.27 MPa (flat punch F/A = 0.25 MPa)","figures":["figures/pinneapple_physics__2_0.png"],"seconds":5.2}],"modules":90,"symbols":347,"outline":{"name":"pinneapple_physics","kind":"package","summary":"pinneapple_physics \u2014 Physics problem definition and PINN solving.","children":[{"name":"pinneapple_physics.adve model factory: compiles symbolic equations and builds unified loss function.","children":[]},{"name":"pinneapple_physics.pinn_solver.factory.signals","kind":"module","summary":"Exogenous signal providers for PINNFactory: known inputs such as sensor data or forcing.","children":[]},{"name":"pinneapple_physics.pinn_solver.factory.sympy_backend","kind":"module","summary":"SymPy-based compiler for symbolic equations to torch-callable lambdas.","children":[]}]},{"name":"pinneapple_physics.pinn_solver.io","kind":"package","summary":"","children":[{"name":"pinneapple_physics.pinn_solver.io.mappings","kind":"module","summary":"Mappings between UPD coordinates/variables and PINN independent/dependent vars.","children":[]},{"name":"pinneapple_physics.pinn_solver.io.upd_dataset","kind":"module","summary":"UPD dataset loader and PINN-ready sampling (collocation, conditions, data).","children":[]}]},{"name":"pinneapple_physics.pinn_solver.schemas","kind":"package","summary":"","children":[{"name":"pinneapple_physics.pinn_solver.schemas.schema_adapter","kind":"module","summary":"Adapter from Physical Schema (UPD) to PINN problem and sampling specs.","children":[]}]},{"name":"pinneapple_physics.pinn_solver.stochastic","kind":"module","summary":"Latent-conditioned (stochastic) PINN training utilities.","children":[]}]},{"name":"pinneapple_physics.solving","kind":"module","summary":"pp.solve and pp.compare: one entry point to solve a problem by any method and compare methods.","children":[]},{"name":"pinneapple_physics.symbolic_pde","kind":"package","summary":"pinneapple_symbolic \u2014 Symbolic PDE compiler for PINNeAPPle.","children":[{"name":"pinneapple_physics.symbolic_pde.bc","kind":"module","summary":"Boundary condition enforcement for PINNeAPPle symbolic PDE module.","children":[]},{"name":"pinneapple_physics.symbolic_pde.compiler","kind":"module","summary":"Symbolic PDE compiler for PINNeAPPle.","children":[]},{"name":"pinneapple_physics.symbolic_pde.gradient_backends","kind":"module","summary":"Pluggable derivative backends for :class:`SymbolicPDE`.","children":[]}]},{"name":"pinneapple_physics.tracking","kind":"module","summary":"Experiment tracking adapter: send an ExperimentResult to MLflow or Weights & Biases.","children":[]},{"name":"pinneapple_physics.tribology","kind":"package","summary":"Tribology: sliding wear of a bar against a counterface (Archard's law with contact-pressure redistribution).","children":[{"name":"pinneapple_physics.tribology.archard","kind":"module","summary":"Sliding wear of a bar end pressed against a rigid, flat counterface.","children":[]}]},{"name":"pinneapple_physics.weather","kind":"package","summary":"","children":[{"name":"pinneapple_physics.weather.data","kind":"module","summary":"ERA5 from WeatherBench2 (public Google Cloud bucket, no account) as a local, normalised array for training and","children":[]},{"name":"pinneapple_physics.weather.evaluate","kind":"module","summary":"Skill of global forecasts by lead time, and how far ahead each forecast can be trusted.","children":[]},{"name":"pinneapple_physics.weather.events","kind":"module","summary":"Extreme-weather case studies and the ERA5 states around them.","children":[]},{"name":"pinneapple_physics.weather.model","kind":"module","summary":"Global forecast network on an equiangular latitude-longitude grid.","children":[]},{"name":"pinneapple_physics.weather.train","kind":"module","summary":"Training of the global forecast network: one 6-hour step first, then rollouts of growing length.","children":[]},{"name":"pinneapple_physics.weather.viz","kind":"module","summary":"Forecast-versus-truth visuals in the style of global AI weather demos: dark background, the ERA5 field and the","children":[]}]}]}},{"name":"pinneapple_simulation","group":"physics","title":"Simulation","tagline":"Numerical solvers, particle dynamics and bridges to OpenFOAM, CalculiX, FEniCS, MATLAB and FMUs.","about":["`numerical_solvers` holds the in-house solvers: finite differences, finite volumes, lattice Boltzmann, spectral and FFT solvers, a 3-D finite-element solver with incompatible-mode hexahedra (`solid_fem`), internal pipe and mixer flow on OpenFOAM (`internal_flow`), DEM particles in a stirred tank (`particles`), and dataset generation for PINNs.","`external_solvers` drives real tools when they are installed (OpenFOAM, CalculiX through `pp.fea`, FEniCS, MATLAB, Modelica/FMU) and degrades gracefully when they are not. `particle_dynamics` has differentiable rigid bodies, MPM and SPH in PyTorch.","Every solver used in the lab is verified on a case with a known answer before its results are used."],"use_when":["You need reference fields or training data from a real solver.","You want an FEA, CFD or particle result scripted from Python."],"shim":null,"examples":[{"title":"3-D cantilever with C3D8I hexahedra, against beam theory","code":"import numpy as np\nfrom pinneapple_simulation.numerical_solvers.solid_fem import box_mesh, SolidFEM, fea_figure\n\nL, W, H, F, E = 2.0, 0.1, 0.2, 1e4, 210e9\nmesh = box_mesh(L, W, H, 40, 3, 6)\nfem = SolidFEM(mesh, E=E, nu=0.3)\nfem.fix(mesh.nodes_on(x=0.0))\nfem.load_face(mesh.face_nodes(\"x+\"), (0, 0, -F))\nres = fem.solve()\n\nI = W * H ** 3 / 12\nG = E / 2.6\ntheory = F * L ** 3 / (3 * E * I) + F * L / (5 / 6 * G * W * H)    # Euler-Bernoulli + shear (Timoshenko)\nprint(f\"tip deflection {res.max_displacement * 1e3:.3f} mm, Timoshenko {theory * 1e3:.3f} mm\")\nprint(f\"max von Mises {res.von_mises.max() / 1e6:.1f} MPa, beam theory at the root {F * L * H / 2 / I / 1e6:.1f} MPa\")\nfig = fea_figure(res, \"von_mises\")","output":"tip deflection 1.911 mm, Timoshenko 1.920 mm\nmax von Mises 31.0 MPa, beam theory at the root 30.0 MPa","figures":["figures/pinneapple_simulation__0_0.png"],"seconds":5.2},{"title":"Pipe-flow correlations used to check the CFD","code":"from pinneapple_simulation.numerical_solvers.internal_flow import colebrook, ito_bend_loss\nfrom pinneapple_simulation.numerical_solvers.particles import StirredTank, terminal_velocity, zwietering_njs\n\nfor Re in (1e4, 1e5, 1e6):\n    print(f\"Re {Re:8.0e}: Darcy f = {colebrook(Re):.4f}, 90 deg bend (R/r = 3) K = {ito_bend_loss(Re, 3.0):.3f}\")\nprint(f\"terminal velocity of a 3 mm, 1200 kg/m3 bead in water: {terminal_velocity(3e-3, 1200.0) * 100:.1f} cm/s\")\ntank = StirredTank(R=0.075, H=0.15)\nprint(f\"Zwietering just-suspended speed: {zwietering_njs(tank, 3e-3, 1200.0, 0.05):.0f} rpm\")","output":"Re    1e+04: Darcy f = 0.0309, 90 deg bend (R/r = 3) K = 0.336\nRe    1e+05: Darcy f = 0.0180, 90 deg bend (R/r = 3) K = 0.227\nRe    1e+06: Darcy f = 0.0116, 90 deg bend (R/r = 3) K = 0.154\nterminal velocity of a 3 mm, 1200 kg/m3 bead in water: 11.0 cm/s\nZwietering just-suspended speed: 336 rpm","figures":[],"seconds":3.4}],"modules":117,"symbols":334,"outline":{"name":"pinneapple_simulation","kind":"package","summary":"pinneapple_simulation \u2014 Physics simulation back-ends and data generation.","children":[{"name":"pinneapple_simulation.external_solvers","kind":"package","summary":"External tool integrations for PINNeAPPle.","children":[{"name":"pinneapple_simulation.external_solvers.ansys","kind":"package","summary":"ANSYS Fluent live-solver coupling: launches a real fluent batch-mode","children":[{"name":"pinneapple_simulation.external_solvers.ansys.journal_builder","kind":"module","summary":"ANSYS Fluent batch-mode journal (.jou) generation.","children":[]},{"name":"pinneapple_simulation.external_solvers.ansys.runner","kind":"module","summary":"ANSYS Fluent live-solver coupling: launches a real fluent batch-mode","children":[]}]},{"name":"pinneapple_simulation.external_solvers.calculix","kind":"package","summary":"CalculiX (implicit structural FEM) bridge: decks, runs, results, and a drop-in virtual ccx.","children":[{"name":"pinneapple_simulation.external_solvers.calculix.frd","kind":"module","summary":"CalculiX .frd results: reader (ASCII) and writer.","children":[]},{"name":"pinneapple_simul },{"name":"pinneapple_simulation.numerical_solvers.openfoam_bridge","kind":"module","summary":"OpenFOAM bridge for pinneapple.","children":[]},{"name":"pinneapple_simulation.numerical_solvers.particles","kind":"module","summary":"Lagrangian particles in a liquid: soft-sphere DEM contacts, drag, buoyancy and turbulent dispersion, in a","children":[]},{"name":"pinneapple_simulation.numerical_solvers.problem_runner","kind":"module","summary":"Generate PINN training datasets from ProblemSpec definitions.","children":[]},{"name":"pinneapple_simulation.numerical_solvers.registry","kind":"module","summary":"Solver registry.","children":[]},{"name":"pinneapple_simulation.numerical_solvers.shallow_water_fv","kind":"module","summary":"2D shallow-water finite-volume solver for free-surface water: walls, gates, virtual sensors,","children":[]},{"name":"pinneapple_simulation.numerical_solvers.solid_fem","kind":"module","summary":"3-D linear elasticity with 8-node hexahedra and incompatible modes (Wilson-Taylor; the element Abaqus calls","children":[]},{"name":"pinneapple_simulation.numerical_solvers.spectral","kind":"module","summary":"Spectral solvers (MVP).","children":[]},{"name":"pinneapple_simulation.numerical_solvers.sph","kind":"module","summary":"SPH: Weakly-compressible Smoothed Particle Hydrodynamics (WCSPH) MVP.","children":[]},{"name":"pinneapple_simulation.numerical_solvers.sph_boundaries","kind":"module","summary":"Boundary handling helpers for SPH (MVP).","children":[]},{"name":"pinneapple_simulation.numerical_solvers.ssa","kind":"module","summary":"SSA: Singular Spectrum Analysis for 1D time series.","children":[]},{"name":"pinneapple_simulation.numerical_solvers.sst","kind":"module","summary":"SST: Synchrosqueezed transform (MVP).","children":[]},{"name":"pinneapple_simulation.numerical_solvers.stiff_kinetics_ode","kind":"module","summary":"Stiff-ODE convenience wrapper for coupled reaction-network / chemical- or","children":[]},{"name":"pinneapple_simulation.numerical_solvers.stl","kind":"module","summary":"STL: Seasonal-Trend decomposition using Loess.","children":[]},{"name":"pinneapple_simulation.numerical_solvers.thermal_channel_2d","kind":"module","summary":"Transient 2-D heated-channel CFD: incompressible Navier-Stokes + energy, with time-varying","children":[]},{"name":"pinneapple_simulation.numerical_solvers.tvd_advection","kind":"module","summary":"Second-order TVD (Total Variation Diminishing) upwind scheme for 1D scalar","children":[]},{"name":"pinneapple_simulation.numerical_solvers.vmd","kind":"module","summary":"VMD: Variational Mode Decomposition.","children":[]},{"name":"pinneapple_simulation.numerical_solvers.wavelet","kind":"module","summary":"Wavelet-based decomposition/denoising features.","children":[]},{"name":"pinneapple_simulation.numerical_solvers.xtfc_ivp","kind":"module","summary":"X-TFC (eXtreme Theory of Functional Connections) solver for systems of ODEs","children":[]},{"name":"pinneapple_simulation.numerical_solvers.xtfc_pde","kind":"module","summary":"X-TFC (eXtreme Theory of Functional Connections) solver for 1D-space(+time)","children":[]},{"name":"pinneapple_simulation.numerical_solvers.xtfc_subdomain","kind":"module","summary":"Subdomain-chained X-TFC for extremely stiff ODE-IVP systems (target","children":[]}]},{"name":"pinneapple_simulation.particle_dynamics","kind":"package","summary":"Differentiable dynamics simulation for PINNeAPPle.","children":[{"name":"pinneapple_simulation.particle_dynamics.molecular_dynamics","kind":"module","summary":"Molecular dynamics: pairwise Lennard-Jones potential with velocity-Verlet","children":[]},{"name":"pinneapple_simulation.particle_dynamics.mpm","kind":"module","summary":"Material Point Method (MPM) for soft bodies and fluids.","children":[]},{"name":"pinneapple_simulation.particle_dynamics.particles","kind":"module","summary":"Particle-based simulations: SPH (Smoothed Particle Hydrodynamics) and DEM.","children":[]},{"name":"pinneapple_simulation.particle_dynamics.rigid_body","kind":"module","summary":"Differentiable rigid body dynamics for robot learning and physics coupling.","children":[]},{"name":"pinneapple_simulation.particle_dynamics.terramechanics","kind":"module","summary":"Terramechanics parameter dataclasses for Bekker-Wong wheel-soil interaction.","children":[]}]}]}},{"name":"pinneapple_neural","group":"learning","title":"Neural models","tagline":"Architectures, training and inference: PINNs, neural operators, GNNs and reduced-order models.","about":["`architectures` has the model families behind one registry (`ModelRegistry.build(name, ...)`): PINN networks (MLP, SIREN, modified MLP, Fourier features, hash grids, PINNsFormer), neural operators (FNO, AFNO, DeepONet and multi-scale DeepONet), graph networks (MeshGraphNet, equivariant GNNs) and reduced-order models (POD, DMD, Operator Inference, SINDy, HAVOK, Koopman, parametric POD-RBF/GPR).","`trainer` gives the training loops (two-phase Adam then L-BFGS, time marching, causal weighting, DDP and FSDP), loss balancing (GradNorm, NTK, self-adaptive weights) and callbacks. `predictor` evaluates trained models on grids and draws the results."],"use_when":["You want a surrogate of a solver, or a PINN for a PDE.","You want a reduced-order model of snapshot data with an honest baseline next to it."],"shim":null,"examples":[{"title":"POD + DMD of a travelling wave: compress, then forecast","code":"import numpy as np, torch\nimport matplotlib.pyplot as plt\nfrom pinneapple_neural.architectures.rom import POD, DynamicModeDecomposition\n\nx = np.linspace(0, 2 * np.pi, 256); t = np.arange(0, 12, 0.05)\nU = np.array([np.sin(x - 1.3 * s) + 0.5 * np.sin(3 * x + 2.1 * s) for s in t])   # (T, D)\nX = torch.tensor(U, dtype=torch.float64)\n\npod = POD(r=8).fit(X[:160])\nprint(\"POD energy in 4 modes:\", float(pod.explained_variance_ratio_[:4].sum()))\n\ndmd = DynamicModeDecomposition(r=4, center=False).fit(X[:160])\npred = dmd.rollout(X[159:160], steps=len(t) - 160)[0, 1:]\nerr = torch.linalg.norm(pred - X[160:]) / torch.linalg.norm(X[160:])\nprint(f\"DMD forecast error over {len(t) - 160} unseen steps: {float(err):.2e}\")\nprint(\"DMD frequencies (Hz):\", np.round(np.sort(np.abs(dmd.frequencies(dt=0.05).numpy())), 4))\n\nfig, ax = plt.subplots(1, 2, figsize=(8.5, 3.2), sharey=True)\nax[0].imshow(U[160:], aspect=\"auto\", cmap=\"RdBu_r\", extent=[0, 2 * np.pi, t[-1], t[160]]); ax[0].set_title(\"truth\")\nax[1].imshow(pred.numpy(), aspect=\"auto\", cmap=\"RdBu_r\", extent=[0, 2 * np.pi, t[-1], t[160]]); ax[1].set_title(\"DMD forecast\")\nax[0].set_ylabel(\"t (unseen)\"); [a.set_xlabel(\"x\") for a in ax]","output":"POD energy in 4 modes: 1.0\nDMD forecast error over 80 unseen steps: 1.57e-14\nDMD frequencies (Hz): [0.2069 0.2069 0.3342 0.3342]","figures":["figures/pinneapple_neural__0_0.png"],"seconds":4.6},{"title":"Parametric POD with Gaussian-process uncertainty, against the nearest-design baseline","code":"import numpy as np\nfrom pinneapple_neural.architectures.rom import ParametricPOD, latin_hypercube\n\nx = np.linspace(0, 1, 200)\ndef field(p):                                         # deflection-like response of two design parameters\n    a, b = p\n    return a * np.sin(np.pi * x) + b * x ** 2 * (1 - x)\n\nP, names = latin_hypercube(40, {\"a\": (0.5, 2.0), \"b\": (-1.0, 1.0)}, seed=0)\nXs = np.array([field(p) for p in P])\nPt, _ = latin_hypercube(20, {\"a\": (0.5, 2.0), \"b\": (-1.0, 1.0)}, seed=1)\nXt = np.array([field(p) for p in Pt])\n\ngpr = ParametricPOD(regressor=\"gpr\").fit(P, Xs)\nnear = ParametricPOD(regressor=\"nearest\").fit(P, Xs)\nprint(\"modes kept:\", gpr.rank, \" energy:\", round(gpr.energy_captured, 8))\nprint(f\"median error  POD-GPR {np.median(gpr.error(Pt, Xt)):.2e}   nearest design {np.median(near.error(Pt, Xt)):.2e}\")\n_, std = gpr.predict(Pt[:1], return_std=True)\nprint(\"predictive std available:\", std.shape)","output":"modes kept: 2  energy: 1.0\nmedian error  POD-GPR 4.77e-07   nearest design 7.08e-02\npredictive std available: (1, 200)","figures":[],"seconds":8.6},{"title":"DeepONet: branch net on sensor values, trunk net on query points","code":"import torch\nfrom pinneapple_neural.architectures.neural_operators.deeponet import DeepONet\n\ntorch.manual_seed(0)\nnet = DeepONet(branch_dim=32, trunk_dim=1, out_dim=1, hidden=64, modes=32, depth=3)\nu = torch.randn(8, 32)                        # 8 input functions sampled at 32 sensors\nxq = torch.linspace(0, 1, 100)[:, None]       # 100 query points shared by the batch\ny = net(u, xq).y\nprint(\"output:\", tuple(y.shape), \" parameters:\", sum(p.numel() for p in net.parameters()))","output":"output: (8, 100, 1)  parameters: 23041","figures":[],"seconds":5.0}],"modules":184,"symbols":439,"outline":{"name":"pinneapple_neural","kind":"package","summary":"pinneapple_neural \u2014 Neural network architectures, training, and inference.","children":[{"name":"pinneapple_neural.architectures","kind":"package","summary":"","children":[{"name":"pinneapple_neural.architectures.adapters","kind":"package","summary":"","children":[{"name":"pinneapple_neural.architectures.adapters.ae","kind":"module","summary":"","children":[]},{"name":"pinneapple_neural.architectures.adapters.base","kind":"module","summary":"","children":[]},{"name":"pinneapple_neural.architectures.adapters.conv","kind":"module","summary":"","children":[]},{"name":"pinneapple_neural.architectures.adapters.dynamics","kind":"module","summary":"","children":[]},{"name":"pinneapple_neural.architectures.adapters.gnn","kind":"module","summary":"","children":[]},{"name":"pinneapple_neural.architectures.adapters.operators","kind":"module","summary":"","children":[]},{"name":"pinneapple_neural.architectures.adapters.pinn","kind":"module","summary":"","children":[]},{"name":"pinneapple_neural.architectures.adapters.ts","kind":"module","summary":"","children":[]}]},{"name":"pinneapple_neural.architectures.afno","kind":"module","summary":"","children":[]},{"na eAPPle's neural","children":[{"name":"pinneapple_neural.workflows.dense_volume_operator","kind":"module","summary":"A reusable train/predict workflow for a grid-based neural operator","children":[]},{"name":"pinneapple_neural.workflows.hybrid_surrogate_physics","kind":"module","summary":"Hybrid model: a data-driven surrogate for intermediate quantities + an explicit physics post-model.","children":[]},{"name":"pinneapple_neural.workflows.parametric_dense_volume_operator","kind":"module","summary":"A joint, multi-case extension of :mod:`dense_volume_operator`: one","children":[]}]}]}},{"name":"pinneapple_lab","group":"trust","title":"Lab","tagline":"Run experiments reproducibly, check them, and grow a database of results, datasets and trust cards.","about":["An experiment is a class with parameters and a `run(ctx)` method. The runner gives every run an id from the experiment, its version and its parameters, and records inputs, outputs, metrics, checks, figures and datasets in one folder indexed in SQLite.","Checks have a kind (physics, reference, baseline, sanity, generalisation, uncertainty), and curation turns them into a tier (A to D) and a six-stage trust card: data and geometry, model, physical constraints, benchmark, uncertainty and engineering decision. `uq` adds coverage of predictive intervals and grid convergence indices. `python -m pinneapple_lab site` writes the public catalogue."],"use_when":["A result will be shown to someone else, and its evidence should travel with it.","You run the same study over many parameters and want to query and compare the runs."],"shim":null,"examples":[{"title":"A minimal experiment with a reference check","code":"import json, math, os, tempfile\nfrom pinneapple_lab import Experiment, register, run\n\n@register\nclass Pendulum(Experiment):\n    name = \"pendulum_doc_example\"\n    params = {\"L\": 1.0, \"theta0\": 0.05}\n    def run(self, ctx):\n        L, th = ctx.params[\"L\"], ctx.params[\"theta0\"]\n        T = 2 * math.pi * math.sqrt(L / 9.81) * (1 + th ** 2 / 16)       # small-angle period + first correction\n        ctx.metric(\"period_s\", T)\n        ctx.check(\"period_matches_small_angle\", value=T / (2 * math.pi * math.sqrt(L / 9.81)),\n                  min=0.999, max=1.002, kind=\"reference\", detail=\"T vs 2 pi sqrt(L/g)\")\n\nroot = tempfile.mkdtemp()\nr = run(\"pendulum_doc_example\", {\"L\": 2.0}, root=root)\nprint(r.status, {k: round(v, 4) for k, v in r.metrics.items()})\nchecks = json.load(open(os.path.join(r.dir, \"validation.json\")))\nprint([(c[\"name\"], c[\"passed\"], c[\"kind\"]) for c in checks])\nprint(\"run folder:\", sorted(os.listdir(r.dir)))","output":"completed {'period_s': 2.8374}\n[('period_matches_small_angle', True, 'reference')]\nrun folder: ['code', 'datasets', 'figures', 'inputs', 'log.txt', 'metrics.json', 'metrics_log.jsonl', 'outputs', 'run.json', 'validation.json']","figures":[],"seconds":0.6},{"title":"Grid convergence index of a mesh study (Celik et al. 2008)","code":"from pinneapple_lab.uq import gci, coverage\nimport numpy as np\n\ng = gci([2.512, 2.571, 2.591], h=[4.0, 2.0, 1.0])          # coarse -> fine\nprint(f\"observed order {g['order']:.2f}, extrapolated {g['extrapolated']:.4f}, GCI {100 * g['gci']:.2f} %\")\n\nrng = np.random.default_rng(0)\ny = rng.normal(size=2000); mean = np.zeros(2000)\nprint(\"coverage of a calibrated 90 % interval:\", round(coverage(y, mean, np.ones(2000), 0.9), 3))\nprint(\"coverage of an over-confident one:     \", round(coverage(y, mean, 0.5 * np.ones(2000), 0.9), 3))","output":"observed order 1.56, extrapolated 2.6013, GCI 0.49 %\ncoverage of a calibrated 90 % interval: 0.904\ncoverage of an over-confident one:      0.593","figures":[],"seconds":0.6}],"modules":29,"symbols":74,"outline":{"name":"pinneapple_lab","kind":"package","summary":"PINNeAPPle Lab: run many experiments reproducibly and grow a database of results and datasets.","children":[{"name":"pinneapple_lab.context","kind":"module","summary":"What an experiment sees while it runs: parameters, and places to put everything it produces.","children":[]},{"name":"pinneapple_lab.curation","kind":"module","summary":"Experiment curation: which runs are good enough to become a product, a paper, marketing or training data.","children":[]},{"name":"pinneapple_lab.dataset","kind":"module","summary":"Datasets produced by experiment runs: samples written in shards, with a card describing them.","children":[]},{"name":"pinneapple_lab.experiments","kind":"package","summary":"Built-in experiments. Each module registers its experiments on import.","children":[{"name":"pinneapple_lab.experiments.accretion","kind":"module","summary":"Black-hole hydrodynamics experiments (pinneapple_physics.blackhole).","children":[]},{"name":"pinneapple_lab.experiments.blackhole_forecast","kind":"module","summary":"Black-hole weather forecasting (Duarte, Nemmen & Navarro 2022; #399) as a lab experiment.","children":[]},{"name":"pinneapple_lab.experiments.calculix_cases","kind":"module","summary":"CalculiX through pinneapple_simulation.external_solvers.calculix.study: CAD-like parts meshed by gmsh (C3D10),","children":[]},{"name":"pinneapple_lab.experiments.car","kind":"module","summary":"Road-vehicle aerodynamics with a parametric car body and a Physics AI surrogate.","children":[]},{"name":"pinneapple_lab.experiments.cylinder","kind":"module","summary":"Lattice-Boltzmann flow past a cylinder: regime, Strouhal number and labelled vorticity images.","children":[]},{"name":"pinneapple_lab.experiments.discovery","kind":"module","summary":"Discovering physical laws from data with PINNeAPPle.","children":[]},{"name":"pinneapple_lab.experiments.examples","kind":"module","summary":"Every example and use case of the repository as a lab experiment.","children":[]},{"name":"pinneapple_lab.experiments.landing","kind":"module","summary":"The cases on the PINNeAPPle Labs landing page that live in public companion repositories, as lab runs.","children":[]},{"name":"pinneapple_lab.experiments.ode","kind":"module","summary":"Damped harmonic oscillator: integrators against the exact solution.","children":[]},{"name":"pinneapple_lab.experiments.particles","kind":"module","summary":"Solids suspension in a stirred tank: Lagrangian particles (soft-sphere DEM, drag, buoyancy, turbulent dispersion)","children":[]},{"name":"pinneapple_lab.experiments.pde","kind":"module","summary":"PDE experiments solved with the library's solvers, checked against exact solutions.","children":[]},{"name":"pinneapple_lab.experiments.pipes","kind":"module","summary":"Internal flow in pipes and static mixers (OpenFOAM, pinneapple_simulation.numerical_solvers.internal_flow).","children":[]},{"name":"pinneapple_lab.experiments.repo_results","kind":"module","summary":"Results already produced in this repository, imported into the lab as validated runs and datasets.","children":[]},{"name":"pinneapple_lab.experiments.rom","kind":"module","summary":"Reduced-order models on the lab's own solvers (pinneapple_neural.architectures.rom).","children":[]},{"name":"pinneapple_lab.experiments.structures","kind":"module","summary":"3-D structural mechanics with the solid finite-element solver (pinneapple_simulation.numerical_solvers.solid_fem,","children":[]},{"name":"pinneapple_lab.experiments.vehicles3d","kind":"module","summary":"3-D vehicles in OpenFOAM with photoreal renders: a road car and a launch vehicle.","children":[]},{"name":"pinneapple_lab.experiments.wear","kind":"module","summary":"Sliding wear of bars of different materials (pinneapple_physics.tribology).","children":[]}]},{"name":"pinneapple_lab.html","kind":"module","summary":"A browsable catalogue of the lab: one self-contained HTML page (data and thumbnails embedded).","children":[]},{"name":"pinneapple_lab.reports","kind":"module","summary":"Reports from the lab: one experiment (or case), or many selected by a filter, as HTML, Markdown or PDF.","children":[]},{"name":"pinneapple_lab.runner","kind":"module","summary":"Run experiments: one run, or a sweep over a grid or random samples, optionally in parallel.","children":[]},{"name":"pinneapple_lab.server","kind":"module","summary":"Serve the lab catalogue over HTTP: the browsable page, every run's files, a JSON API and dataset downloads.","children":[]},{"name":"pinneapple_lab.spec","kind":"module","summary":"Experiment specification and registry.","children":[]},{"name":"pinneapple_lab.store","kind":"module","summary":"The lab's database: run folders plus a SQLite index, queries, dataset export and the catalogue.","children":[]},{"name":"pinneapple_lab.uq","kind":"module","summary":"Uncertainty evidence for lab runs: the checks that answer the trust card's \"where may the result not be","children":[]}]}},{"name":"pinneapple_analysis","group":"trust","title":"Analysis","tagline":"Uncertainty, validation, inverse problems, equation discovery, state estimation and trust scores.","about":["`uncertainty` covers aleatoric heads, MC dropout, deep ensembles, conformal prediction, quantile regression and calibration metrics, behind one `uq_predict` entry point. `validation` checks physical consistency: conservation, boundary conditions, symmetry and agreement with analytical or solver references.","`inverse_problems` estimates parameters from observations (noise models, Tikhonov / TV regularisation with L-curve, local and Sobol sensitivity, ensemble Kalman inversion) and discovers missing terms with SINDy. `state_estimation` has extended and ensemble Kalman filters. `trust` scores a model's predictions before anyone consumes them."],"use_when":["A prediction needs an interval that actually holds its nominal coverage.","You have measurements and want the parameters or the missing physics behind them."],"shim":null,"examples":[{"title":"Conformal prediction: intervals with guaranteed coverage around any model","code":"import torch\nfrom pinneapple_analysis import ConformalPredictor\n\ntorch.manual_seed(0)\nx = torch.rand(3000, 1) * 6\ny = torch.sin(x) + 0.2 * torch.randn_like(x)\nmodel = lambda z: torch.sin(z) * 0.9                 # a slightly biased surrogate\n\ncp = ConformalPredictor(model, alpha=0.1)\ncp.calibrate(x[:1000], y[:1000])\npred, lo, hi = cp.predict(x[1000:])\nprint(f\"interval half-width {cp.quantile:.3f}\")\nprint(f\"empirical coverage on 2000 unseen points: {cp.coverage(x[1000:], y[1000:]):.3f}  (target 0.90)\")","output":"interval half-width 0.346\nempirical coverage on 2000 unseen points: 0.908  (target 0.90)","figures":[],"seconds":3.6},{"title":"SINDy: recover the missing term of a damped oscillator from data","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_analysis import CandidateLibrary, SINDyIdentifier\n\nt = np.linspace(0, 20, 2000)\nx = np.exp(-0.1 * t) * np.cos(2 * t)\nv = np.gradient(x, t, edge_order=2); a = np.gradient(v, t, edge_order=2)\nt, x, v, a = (z[5:-5] for z in (t, x, v, a))        # finite differences are least accurate at the ends\n# known part of the model: a = -4 x ; the residual holds what the model misses\nb = a + 4 * x\nTheta, names = CandidateLibrary(poly_order=2).build(np.column_stack([x, v]))\nnames = [n.replace(\"x0\", \"x\").replace(\"x1\", \"v\") for n in names]\nres = SINDyIdentifier(threshold=0.05).fit(Theta, b, names)\nprint(res.equation(\"a + 4x\"))\nprint(\"true:  a + 4x = -0.2 v - 0.01 x   (x = exp(-0.1 t) cos 2t solves x'' + 0.2 x' + 4.01 x = 0)\")\n\nfig, ax = plt.subplots(figsize=(7, 2.8))\nax.plot(t, b, lw=2, label=\"residual from data\"); ax.plot(t, Theta @ res.coefficients, \"--\", label=\"SINDy model\")\nax.set_xlabel(\"t\"); ax.legend(); ax.set_title(\"discovered damping term\")","output":"a + 4x = -0.009466 * x  -0.2 * v\ntrue:  a + 4x = -0.2 v - 0.01 x   (x = exp(-0.1 t) cos 2t solves x'' + 0.2 x' + 4.01 x = 0)","figures":["figures/pinneapple_analysis__1_0.png"],"seconds":3.5},{"title":"Extended Kalman filter tracking a pendulum from noisy angle readings","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_analysis.state_estimation.kalman import ExtendedKalmanFilter\n\ndt, g_L = 0.02, 9.81\nf = lambda s: np.array([s[0] + dt * s[1], s[1] - dt * g_L * np.sin(s[0])])\nh = lambda s: s[:1]\nrng = np.random.default_rng(1)\ntruth = [np.array([1.0, 0.0])]\nfor _ in range(400):\n    truth.append(f(truth[-1]))\ntruth = np.array(truth)\nobs = truth[:, :1] + rng.normal(0, 0.15, (len(truth), 1))\n\nekf = ExtendedKalmanFilter(2, 1, f, h, Q=np.eye(2) * 1e-5, R=np.eye(1) * 0.15 ** 2)\nekf.initialize(np.array([0.5, 0.0]), np.eye(2))\nest = []\nfor y in obs:\n    ekf.step(y); est.append(ekf.x.copy())\nest = np.array(est)\nprint(f\"angle RMS error: raw readings {np.sqrt(np.mean((obs[:, 0] - truth[:, 0]) ** 2)):.3f} rad,\"\n      f\" filter {np.sqrt(np.mean((est[100:, 0] - truth[100:, 0]) ** 2)):.3f} rad (after spin-up)\")\nprint(f\"angular velocity is never measured; filter RMS error {np.sqrt(np.mean((est[100:, 1] - truth[100:, 1]) ** 2)):.3f} rad/s\")\n\ntt = np.arange(len(truth)) * dt\nfig, ax = plt.subplots(figsize=(7, 2.8))\nax.plot(tt, obs[:, 0], \".\", ms=2, c=\"0.6\", label=\"readings\"); ax.plot(tt, truth[:, 0], label=\"truth\")\nax.plot(tt, est[:, 0], \"--\", label=\"EKF\"); ax.set_xlabel(\"t (s)\"); ax.set_ylabel(\"angle (rad)\"); ax.legend(ncol=3, fontsize=7)","output":"angle RMS error: raw readings 0.137 rad, filter 0.018 rad (after spin-up)\nangular velocity is never measured; filter RMS error 0.048 rad/s","figures":["figures/pinneapple_analysis__2_0.png"],"seconds":3.9}],"modules":67,"symbols":214,"outline":{"name":"pinneapple_analysis","kind":"package","summary":"pinneapple_analysis \u2014 Model analysis, validation, and inversion.","children":[{"name":"pinneapple_analysis.cost","kind":"package","summary":"Computational-cost validation per operation (time, memory, FLOPs, scaling, budgets, regressions).","children":[{"name":"pinneapple_analysis.cost.profiler","kind":"module","summary":"Computational-cost validation ]},{"name":"pinneapple_analysis.verification.solver_orchestration","kind":"module","summary":"Solver orchestration across PINNeAPPle's real solver families -- the","children":[]},{"name":"pinneapple_analysis.verification.tool_recommendation","kind":"module","summary":"External tool/player recommendation -- the sibling of","children":[]},{"name":"pinneapple_analysis.verification.uncertainty_inverse","kind":"module","summary":"Wiring PINNeAPPle's REAL uncertainty-quantification and inverse-problem","children":[]}]}]}},{"name":"pinneapple_data","group":"data","title":"Data","tagline":"Physical samples, collocation, datasets, sharded storage, preflight and lineage.","about":["`PhysicalSample` and the UPD format keep fields together with their coordinates, units and metadata; Zarr stores and sharded iterables stream them to training. `CollocationSampler` draws PINN points (uniform, Latin hypercube, Sobol or residual-adaptive) inside boxes, SDF shapes, meshes or STL files, and `active_learning` refines them where the residual or the variance is high.","`cae` reads meshes and fields from CAE formats and measures mesh quality; `preflight` checks a case before it is solved; `lineage` records where every dataset came from; `datasets` is the registry of built-in and public datasets."],"use_when":["You need collocation points for a PINN in a non-trivial region.","You are building a training set from solver runs and want units, splits and provenance kept."],"shim":null,"examples":[{"title":"Collocation points in a box, Latin hypercube versus uniform random","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_data import CollocationSampler\n\nfig, ax = plt.subplots(1, 2, figsize=(7.5, 3.4))\nfor a, strategy in zip(ax, (\"uniform\", \"lhs\")):\n    s = CollocationSampler.from_bounds({\"x\": (0.0, 1.0), \"y\": (0.0, 1.0)}, strategy=strategy, seed=3)\n    batch = s.sample(n_col=200, n_bc=0)\n    pts = np.column_stack([batch[\"x_col\"][:, 0], batch[\"x_col\"][:, 1]]) if \"x_col\" in batch else None\n    if pts is None:\n        print(\"batch keys:\", list(batch.keys())); break\n    a.plot(pts[:, 0], pts[:, 1], \".\", ms=4); a.set_title(strategy); a.set_aspect(\"equal\")\n    # discrepancy proxy: largest empty cell of a 10 x 10 grid\n    H, _, _ = np.histogram2d(pts[:, 0], pts[:, 1], bins=10, range=[[0, 1], [0, 1]])\n    print(f\"{strategy:8s}: empty cells of a 10x10 grid = {(H == 0).sum()}\")","output":"uniform : empty cells of a 10x10 grid = 13\nlhs     : empty cells of a 10x10 grid = 12","figures":["figures/pinneapple_data__0_0.png"],"seconds":4.7}],"modules":100,"symbols":302,"outline":{"name":"pinneapple_data","kind":"package","summary":"","children":[{"name":"pinneapple_data.active_learning","kind":"module","summary":"Active Learning for adaptive collocation in PINN training.","children":[]},{"name":"pinneapple_data.adapters","kind":"package","summary":"","children":[{"name":"pinneapple_data.adapters.geom_adapter","kind":"module","summary":"Geometry loading and attachment utilities for PhysicalSample via pinneapple_geom.","children":[]},{"name":"pinneapple_data.adapters.pinn_batch_builders","kind":"module","summary":"PINN batch builders: convert various data sources into the unified dict-batch format.","children":[]},{"name":"pinneapple_data.adapters.splash_archive_adapter","kind":"module","summary":"Loader for a Splash-CFD .splash case (a zipped OpenFOAM case","children":[]},{"name":"pinneapple_data.adapters.upd_adapter","kind":"module","summary":"UPD shard loading and PhysicalSample conversion adapters.","children":[]}]},{"name":"pinneapple_data.augmentation","kind":"module","summary":"Point-cloud dataset augmentation strategies for PDE/PINN training data.","children":[]},{"name":"pinneapple_data.cache","kind":"module","summary":"Thread-safe LRU cache for in-memory data with configurable capacity.","children":[]},{"name":"pinneapple_data.cache_bytes","kind":"module","summary":"Byte-constrained LRU cache for memor s and training bridge for UPD-aligned physical data.","children":[]},{"name":"pinneapple_data.physical_units","kind":"module","summary":"Physical units and quantities for engineering data (PINNeAPPle Physical Data Layer).","children":[]},{"name":"pinneapple_data.physics_case","kind":"module","summary":"PhysicsCase -- a minimal bridge between the three disjoint \"partial","children":[]},{"name":"pinneapple_data.prefetch_adaptive","kind":"module","summary":"Adaptive prefetch IterableDataset for Zarr-backed UPD stores with configurable queue control.","children":[]},{"name":"pinneapple_data.preflight","kind":"package","summary":"Simulation pre-flight: check an OpenFOAM case or a CalculiX/Abaqus deck before spending solver hours on it.","children":[{"name":"pinneapple_data.preflight.calculix","kind":"module","summary":"Pre-flight rules for CalculiX (and flat Abaqus) input decks: mesh, sections and materials, the properties each","children":[]},{"name":"pinneapple_data.preflight.common","kind":"module","summary":"Findings and the pre-flight report shared by the OpenFOAM and CalculiX rule sets.","children":[]},{"name":"pinneapple_data.preflight.openfoam","kind":"module","summary":"Pre-flight rules for OpenFOAM cases: mesh, transport/thermo properties, boundary and initial conditions, schemes,","children":[]}]},{"name":"pinneapple_data.process_optimizer","kind":"module","summary":"Data-driven process optimization for industrial plants (plain machine learning, no physics model).","children":[]},{"name":"pinneapple_data.serialization","kind":"module","summary":"Serialization utilities for PhysicalSample to/from PT, Zarr, and HDF5 formats.","children":[]},{"name":"pinneapple_data.simulation_metadata","kind":"package","summary":"Simulation metadata extraction (PINNeAPPle): solver, mesh, time step, boundary conditions, parameters","children":[{"name":"pinneapple_data.simulation_metadata.calculix","kind":"module","summary":"CalculiX / Abaqus input decks (.inp) and CalculiX run files (.sta, .cvg, .dat, solver output).","children":[]},{"name":"pinneapple_data.simulation_metadata.convergence","kind":"module","summary":"Convergence assessment from residual histories: a verdict, the reasons and what to do next.","children":[]},{"name":"pinneapple_data.simulation_metadata.foam_dict","kind":"module","summary":"A tolerant parser for OpenFOAM dictionary files (controlDict, fvSchemes, fvSolution, 0/U, ...).","children":[]},{"name":"pinneapple_data.simulation_metadata.openfoam","kind":"module","summary":"OpenFOAM case + log extraction for the simulation metadata record.","children":[]}]},{"name":"pinneapple_data.splits","kind":"module","summary":"Train/val/test split strategies (random, time, group).","children":[]},{"name":"pinneapple_data.stl_import","kind":"module","summary":"STL import utilities (ASCII + binary).","children":[]},{"name":"pinneapple_data.synth","kind":"package","summary":"","children":[{"name":"pinneapple_data.synth.base","kind":"module","summary":"Base SynthConfig, SynthOutput, and SynthGenerator protocol for synthetic data generation.","children":[]},{"name":"pinneapple_data.synth.curvefit","kind":"module","summary":"Curve-fit synthetic generator for polynomial ridge regression and sample synthesis.","children":[]},{"name":"pinneapple_data.synth.distributions","kind":"module","summary":"Distribution-based synthetic generator for Gaussian, uniform, and mixture-of-Gaussians sampling.","children":[]},{"name":"pinneapple_data.synth.geometry","kind":"module","summary":"Geometry synthesis and mesh augmentation from trimesh-like inputs.","children":[]},{"name":"pinneapple_data.synth.geometry_cadquery","kind":"module","summary":"CadQuery-based geometry synthesis: parametric templates and STL-driven variants.","children":[]},{"name":"pinneapple_data.synth.images","kind":"module","summary":"Image reconstruction and inpainting synthetic generator.","children":[]},{"name":"pinneapple_data.synth.operators","kind":"package","summary":"","children":[{"name":"pinneapple_data.synth.operators.masks","kind":"module","summary":"Random block mask generation for 2D grids.","children":[]},{"name":"pinneapple_data.synth.operators.noise","kind":"module","summary":"Gaussian noise addition for synthetic data augmentation.","children":[]},{"name":"pinneapple_data.synth.operators.transforms","kind":"module","summary":"Tensor normalization transforms for synth operators.","children":[]}]},{"name":"pinneapple_data.synth.pde","kind":"module","summary":"PDE/ODE synthetic generator for heat, advection, and logistic equations.","children":[]},{"name":"pinneapple_data.synth.pde_symbolic","kind":"module","summary":"Symbolic PDE parser and finite-difference-based synthetic trajectory generator.","children":[]},{"name":"pinneapple_data.synth.registry","kind":"module","summary":"SynthCatalog factory for building synthetic generators by name from a registry.","children":[]},{"name":"pinneapple_data.synth.sample_adapter","kind":"module","summary":"PhysicalSample-like conversion and torchify utilities for synth module outputs.","children":[]}]},{"name":"pinneapple_data.transforms","kind":"module","summary":"Data transforms and normalizers for preprocessing pipelines.","children":[]},{"name":"pinneapple_data.udr1","kind":"package","summary":"ASME Form U-DR-1 shortcuts over the generic pinneapple_data.formfill engine (template asme_u-dr-1).","children":[]},{"name":"pinneapple_data.unified","kind":"module","summary":"Engineering data standardizer: many files, many conventions -> one physical schema (PINNeAPPle UPD).","children":[]},{"name":"pinneapple_data.upd_dataset","kind":"module","summary":"Hardened UPDDataset wrapper with validation, persistence, and save/load support.","children":[]},{"name":"pinneapple_data.upd_types","kind":"module","summary":"Pure data-structure types for the UPD (Unified Physical Data) pipeline.","children":[]},{"name":"pinneapple_data.validators","kind":"module","summary":"PhysicalSample validation: units, alitative` add domain models and a quick preview of how a geometry change should move the physics."],"use_when":["You need a domain with holes or blends for a PINN or a mesh.","You want to optimise a shape against a physics objective."],"shim":null,"examples":[{"title":"A bracket from signed distance functions","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_design import sdf2d_rectangle, sdf2d_circle, sdf_difference, sdf_smooth_union\n\nn = 300\nX, Y = np.meshgrid(np.linspace(-1.2, 1.2, n), np.linspace(-0.8, 0.8, n))\nP = np.column_stack([X.ravel(), Y.ravel()])\nplate = sdf2d_rectangle(P, (0.0, 0.0), (1.0, 0.25))\nboss = sdf2d_circle(P, (-0.8, 0.0), 0.45)\nbody = sdf_smooth_union(plate, boss, k=0.15)\nholes = np.minimum(sdf2d_circle(P, (-0.8, 0.0), 0.2), sdf2d_circle(P, (0.7, 0.0), 0.12))\nd = sdf_difference(body, holes).reshape(n, n)\n\narea = (d < 0).mean() * 2.4 * 1.6\nprint(f\"area of the part: {area:.3f}\")\nprint(f\"signed distance at the centre of the big hole: {d[n // 2, int((-0.8 + 1.2) / 2.4 * n)]:.3f} (radius 0.2 -> +0.2)\")\nfig, ax = plt.subplots(figsize=(7, 3.4))\nim = ax.contourf(X, Y, d, levels=30, cmap=\"RdBu\"); ax.contour(X, Y, d, levels=[0], colors=\"k\")\nax.set_aspect(\"equal\"); fig.colorbar(im, ax=ax, label=\"signed distance\"); ax.set_title(\"bracket = plate U boss - holes\")","output":"area of the part: 1.147\nsigned distance at the centre of the big hole: 0.193 (radius 0.2 -> +0.2)","figures":["figures/pinneapple_design__0_0.png"],"seconds":4.6},{"title":"NACA four-digit airfoils","code":"import matplotlib.pyplot as plt\nfrom pinneapple_design import naca_parametric\n\nfig, ax = plt.subplots(figsize=(7, 2.4))\nfor m, p, t, name in [(0, 0, 0.12, \"0012\"), (0.02, 0.4, 0.12, \"2412\"), (0.04, 0.4, 0.15, \"4415\")]:\n    xy = naca_parametric(m=m, p=p, t_c=t, n_pts=120).numpy()\n    ax.plot(xy[:, 0], xy[:, 1], label=f\"NACA {name}\")\n    print(f\"NACA {name}: {xy.shape[0]} points, max thickness {xy[:, 1].max() - xy[:, 1].min():.3f} c\")\nax.set_aspect(\"equal\"); ax.legend(fontsize=7); ax.set_xlabel(\"x / c\")","output":"NACA 0012: 120 points, max thickness 0.120 c\nNACA 2412: 120 points, max thickness 0.122 c\nNACA 4415: 120 points, max thickness 0.156 c","figures":["figures/pinneapple_design__1_0.png"],"seconds":4.8}],"modules":92,"symbols":372,"outline":{"name":"pinneapple_design","kind":"package","summary":"pinneapple_design \u2014 Geometry construction and physics-guided design optimization.","children":[{"name":"pinneapple_design.aero","kind":"package","summary":"Aerodynamic design: airfoil shapes, O-grid meshes, OpenFOAM cases, aircraft performance, surrogate-based search.","children":[{"name":"pinneapple_design.aero.aircraft","kind":"module","summary":"From a section polar to aircraft numbers: top speed, CO2 per 100 km, stall speed, and the design constraints.","children":[]},{"name":"pinneapple_design.aero.aircraft3d","kind":"module","summary":"The whole aircraft in 3D: vortex lattice (wing + tail, trimmed), section drag strip by strip from the CFD","children":[]},{"name":"pinneapple_design.aero.airframe","kind":"module","summary":"Parametric light aircraft in 3D: fuselage, wing (the optimized airfoil, span, taper, sweep, dihedral, twist),","children":[]},{"name":"pinneapple_design.aero.airliner","kind":"module","summary":"Parametric single-aisle airliner (A320 / 737 class) in 3D: circular fuselage with cabin and cockpit windows and a","children":[]},{"name":"pinneapple_design.aero.airliner3d","kind":"module","summary":"Airliner physics (A320 class): cruise at transonic Mach and the low-speed end, for the whole aircraft.","children":[]},{"name":"pinneapple_design.aero.case","kind":"module","summary":"OpenFOAM case for one airfoil at one angle of attack: simpleFoam, k-omega SST resolved to the wall (y+ < 1).","children":[]},{"name":"pinneapple_design.aero.case3d","kind":"module","summary":"3D OpenFOAM case of a whole aircraft (half model, symmetry plane): STL from t  np.sin(Y)\nw = compute_vorticity_2d(u, v, x, y)\nq = compute_q_criterion_2d(u, v, x, y)\nprint(f\"max |vorticity| {np.abs(w).max():.3f} (exact 2), Q > 0 in {100 * (q > 0).mean():.0f} % of the box\")\n\nfig, ax = plt.subplots(1, 2, figsize=(8.5, 3.6))\nax[0].contourf(X, Y, w, 40, cmap=\"RdBu_r\"); ax[0].streamplot(x, y, u, v, color=\"k\", density=0.8, linewidth=0.5)\nax[0].set_title(\"vorticity + streamlines\"); ax[1].contourf(X, Y, q, 40, cmap=\"viridis\"); ax[1].set_title(\"Q-criterion\")\n[a.set_aspect(\"equal\") for a in ax]","output":"max |vorticity| 1.999 (exact 2), Q > 0 in 51 % of the box","figures":["figures/pinneapple_tools__0_0.png"],"seconds":5.6},{"title":"Export a model to TorchScript and check it reproduces the outputs","code":"import os, tempfile, torch\nfrom pinneapple_tools import export_torchscript\n\nnet = torch.nn.Sequential(torch.nn.Linear(2, 32), torch.nn.Tanh(), torch.nn.Linear(32, 1))\nx = torch.rand(5, 2)\npath = os.path.join(tempfile.mkdtemp(), \"model.pt\")\nout = export_torchscript(net, path, example_input=x)\nloaded = torch.jit.load(out if isinstance(out, str) else path)\nprint(\"exported:\", os.path.basename(path), f\"{os.path.getsize(path) / 1024:.1f} kB\")\nprint(\"max difference after reload:\", float((loaded(x) - net(x)).abs().max()))","output":"exported: model.pt 7.4 kB\nmax difference after reload: 0.0","figures":[],"seconds":5.7}],"modules":103,"symbols":245,"outline":{"name":"pinneapple_tools","kind":"package","summary":"pinneapple_tools \u2014 Visualization, model export, HPO, benchmarking, and compute backends.","children":[{"name":"pinneapple_tools.aero_coefficients","kind":"module","summary":"Shared aerodynamic-coefficient utilities (Cp, surface-force integration, CL/CD/CM).","children":[]},{"name":"pinneapple_tools.benchmark_suite","kind":"package","summary":"","children":[{"name":"pinneapple_tools.benchmark_suite.api","kind":"module","summary":"Arena \u2014 high-level API for running PINNeAPPle resolution pipelines.","chi
