<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PINNeAPPle viewer</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; background: #e9edf2; }
  #bar { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; z-index: 2; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #title { font-weight: 700; margin-right: 8px; background: #ffffffd9; border-radius: 7px; padding: 5px 9px; }
  .seg { display: flex; flex-wrap: wrap; background: #ffffffe6; border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button, #views button { border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; color: #334155; }
  .seg button.on { background: #0369a1; color: #fff; }
  #views { margin-left: auto; display: flex; gap: 4px; background: #ffffffe6; border-radius: 8px; padding: 3px; }
  #stage { position: absolute; inset: 0; }
  #legend { position: absolute; right: 14px; bottom: 14px; background: #ffffffe6; border-radius: 8px; padding: 8px 12px; display: none; max-width: 90vw; }
  #ctl { position: absolute; left: 14px; bottom: 40px; background: #ffffffe6; border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: calc(100vw - 28px); }
  #ctl .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 3px 0; }
  #ctl .row > span:first-child { min-width: 92px; color: #475569; }
  #ctl input[type=number] { width: 78px; font: inherit; padding: 2px 4px; }
  #ctl button, #ctl select { font: inherit; border: 1px solid #cbd5e1; background: #fff; border-radius: 5px; padding: 2px 8px; cursor: pointer; }
  #load { position: absolute; inset: 0; display: grid; place-items: center; color: #475569; }
  #foot { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: #475569; background: #ffffffb0; border-radius: 6px; padding: 3px 7px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body>
<div id="stage"><div id="load">loading…</div></div>
<div id="bar"><span id="title"></span><div class="seg" id="modes"></div>
  <div id="views"><button data-v="iso">3/4</button><button data-v="front">Front</button><button data-v="side">Side</button><button data-v="top">Top</button><button id="shot">PNG</button></div></div>
<div id="legend"></div>
<div id="ctl"></div>
<div id="foot">PINNeAPPle studio · drag to orbit, scroll to zoom</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
