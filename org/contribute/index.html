 PDE-to-dataset, BC/IC/constitutive registries, coverage, physics-aware sampling, multi-fidelity)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Beyond what commercial engineering-data platforms show: capabilities that make the data layer specific to Physics AI. | ID | Feature | Description | |---|---|---| | K01 | Physics Dataset Registry | A central catalogue of scientific datasets. | | K02 | Physics Dataset Cards | Standard documentation of a dataset: assumptions, domain, limitations. | | K03 | PDE-to-Dataset Mapping | Relate datasets to the \u2026"},{"n":1220,"t":"Data layer J: deployment, security and enterprise data management (on-prem / private / customer cloud, RBAC, audit, retention, governance)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Enterprise product gap. Companies that cannot move proprietary engineering data out of their perimeter need the platform to run where the data lives. | ID | Feature | Description | |---|---|---| | J01 | On-premises deployment | Deploy on the customer's own infrastructure. | | J02 | Private cloud deployment | Deploy in a private cloud. | | J03 | Customer cloud deployment | Run inside the customer's \u2026"},{"n":1219,"t":"Data layer I: data quality, validation and reliability (completeness, schema, duplicates, anomalies, cross-run and sim-vs-test consistency, scoring)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. PINNeAPPle already has part of this area. Two different things: \u00b7 Data quality: are the input data complete, consistent, correct and fit for processing? (This issue.) \u00b7 Physics validation: do data and models respect physical laws? PINNeAPPle already has a strong layer here: conservation, PDE residuals, boundary conditions, units, bounds, file integrity and training domain (pinneappleveriphysics, \u2026"},{"n":1218,"t":"Data layer H: APIs, SDK and AI-native access (data API, PyTorch/JAX loaders, MCP server, natural-language queries, access control)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Relevant gap. Curated data must be reachable by API and MCP, by external applications and in natural language. | ID | Feature | Description | |---|---|---| | H01 | Engineering Data API | An API to query datasets and metadata. | | H02 | Dataset query API | Programmatic dataset queries. | | H03 | Dataset retrieval API | Retrieval of filtered data. | | H04 | Pipeline execution API | Run pipelines through \u2026"},{"n":1217,"t":"Data layer G: inspection and engineering analytics tied to acquisition and preparation (3-D inspection, run comparison, KPI dashboards)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Partial gap. PINNeAPPle already has scientific visualization and experiment results. What is missing is an engineering data inspection UI integrated with the ingestion and dataset layers (A\u2013D). | ID | Feature | Description | |---|---|---| | G01 | Interactive 3D data inspection | Inspect 3-D results interactively. | | G02 | Visual region selection | Select geometric regions visually. | | G03 | Surface \u2026"},{"n":1216,"t":"Data layer F: versioning and reproducibility of datasets, pipelines, schemas and parsers","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Relevant gap. | ID | Feature | Description | |---|---|---| | F01 | Dataset versioning | Version datasets. | | F02 | Dataset snapshots | Immutable snapshots of dataset states. | | F03 | Dataset diff | Compare dataset versions (rows, fields, statistics). | | F04 | Pipeline versioning | Version processing pipelines. | | F05 | Schema versioning | Version schemas (with migrations). | | F06 | Parser \u2026"},{"n":1215,"t":"Data layer E: lineage and provenance, a digital thread from experiment to deployed model","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Strategic gap. Questions the layer must answer \u00b7 Which simulation produced this result? \u00b7 Which geometry, mesh, solver version and boundary conditions were used? \u00b7 Which pipeline extracted the data? \u00b7 Which dataset version trained which model? | ID | Feature | Description | |---|---|---| | E01 | Simulation provenance | Record the origin of each result. | | E02 | Experiment provenance | Trace the \u2026"},{"n":1214,"t":"Data layer D: dataset engineering for Physics AI (builder, schemas, features, splits, and one source to tabular/FNO/PINN/DeepONet/GNN/time-series)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Priority gap. This is where simulation files become training data. | ID | Feature | Description | |---|---|---| | D01 | Dataset builder | Build datasets from simulations automatically. | | D02 | Dataset schema definition | Define dataset schemas. | | D03 | Input-output mapping | Map input parameters to results. | | D04 | Feature engineering pipelines | Physical and statistical features. | | D05 | \u2026"},{"n":1213,"t":"Data layer C: extraction and parsing of engineering files (adapter architecture, fields/surfaces/regions/time steps, visual query editor)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Priority gap. | ID | Feature | Description | |---|---|---| | C01 | Universal engineering file parser | A framework for parsing engineering files. | | C02 | Solver-specific adapters | Adapters for each solver. | | C03 | Binary file extraction | Extraction from proprietary binary files. | | C04 | Structured data extraction | Extraction of structured data. | | C05 | Field variable extraction | Extraction \u2026"},{"n":1212,"t":"Data layer B: semantic data layer and a Physics AI ontology (fields, units, BCs, materials, geometry, mesh, PDE structure)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Strategic gap, probably the most important capability of the epic. A CFD file should not be just simulation001.vtu. The layer must know that it holds: \u00b7 the pressure, velocity and temperature fields; \u00b7 the geometry and the mesh; \u00b7 the boundary conditions and the physical model; \u00b7 the solver and the numerical settings. | ID | Feature | Description | |---|---|---| | B01 | Engineering data ontology | A \u2026"},{"n":1211,"t":"Data layer A: automated ingestion of engineering data (simulation capture, hooks, watchers, incremental, test benches)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. Priority gap. Why: today PINNeAPPle depends on datasets prepared by hand. This layer would let it follow, continuously, the data that engineering environments produce. | ID | Feature | Description | |---|---|---| | A01 | Automatic simulation capture | Capture a simulation's results automatically when its run ends. | | A02 | Simulation run hooks | Hooks into a solver run's lifecycle (start, step, end, \u2026"},{"n":1210,"t":"Epic: engineering data layer for Physics AI (ingestion, semantics, parsing, datasets, lineage, versioning, quality, APIs, enterprise)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":12,"a":false,"x":"Goal PINNeAPPle integrates methods, solvers and scientific pipelines. It does not yet have a universal layer that: \u00b7 captures engineering data at its source (simulation runs and physical test benches); \u00b7 understands its physical meaning; \u00b7 turns it into reproducible, traceable datasets for Physics AI models. The reference for this epic is a market analysis of engineering-data platforms. Simr's \"Semantic Data Layer\" \u2026"},{"n":1207,"t":"Workflow: satellite design (orbit, power, thermal, link budget, ADCS, lifetime)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1185,"s":0,"a":false,"x":"Part of #1185. Exists: pinneapplephysics.astro, covering orbits, decay, space weather, ephemeris, conjunction, satellites and an n-body propagator. Needed: one standard flow, starting from the mission (ground coverage or revisit, payload power and data rate, lifetime). \u00b7 Orbit: \u00b7 selection: altitude, inclination, sun-synchronous condition; \u00b7 eclipse fraction; \u00b7 J2 drift. \u00b7 Power: \u00b7 solar array sized for end of life, \u2026"},{"n":1204,"t":"Standard workflow: electromagnetics and electrodynamics (electro/magnetostatics, eddy currents, full wave)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1185,"s":0,"a":false,"x":"Part of #1185. Exists: 30 nodes \u2014 em. (Prius machine and flux maps, edge-element 3D verification, eddy segmentation), the antenna compact range, potential., pinneapplephysics.maxwellchecks, GetDP cross-checks. Needed: one standard flow that picks the formulation from the problem, with its reason: \u00b7 electrostatics; \u00b7 magnetostatics (A-formulation, nonlinear B-H); \u00b7 eddy currents (A-\u03c6, frequency domain); \u00b7 full-wave \u2026"},{"n":1203,"t":"Workflow: submarines / underwater vehicles (hydrostatics, resistance, pressure hull, depth and attitude control)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1185,"s":0,"a":false,"x":"Part of #1185. Exists: naval.submarinedepth, naval.shipstability. Needed: \u00b7 Hull and hydrostatics: \u00b7 hull geometry (Myring or parametric) and displacement; \u00b7 buoyancy and centre of buoyancy, metacentric heights (surfaced and submerged), trim tanks. \u00b7 Resistance: ITTC-57 friction plus form factor, and propulsion power. \u00b7 Pressure hull: collapse pressure of ring-stiffened cylinders (von Mises / Windenburg, with a \u2026"},{"n":1202,"t":"Workflow: robotic arms (kinematics, dynamics, trajectory, control, workspace and actuator design)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1185,"s":0,"a":false,"x":"Part of #1185. Exists: lib.robot.armcheck, lib.worldmodel.armcamera. Needed: \u00b7 Model: \u00b7 DH or URDF input; \u00b7 forward and inverse kinematics (analytic where it exists, damped least squares otherwise), Jacobian and singularities; \u00b7 Newton-Euler / Lagrange dynamics, with gravity, Coriolis and friction. \u00b7 Trajectory: quintic or trapezoidal profiles, time-optimal within torque limits. \u00b7 Control: computed-torque / PD, with \u2026"},{"n":1198,"t":"Workflow: extreme climate (GEV/GPD return levels, non-stationarity, compound events, attribution)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1185,"s":0,"a":false,"x":"Part of #1185. Exists: forecast.enso, enso.solverchecks, the black-hole weather / statistics nodes, pinneappleanalysis uncertainty tools. There is no extreme-value analysis yet. Needed: one standard flow. \u00b7 Input: a station or gridded series (ERA5 / CMIP extract, or a user CSV). \u00b7 Extremes extraction: block maxima or peaks over threshold, with the threshold chosen by mean-excess or stability plots and declustering. \u2026"},{"n":1197,"t":"Workflow: time-series prediction and modeling (analysis \u2192 baselines \u2192 models \u2192 backtest \u2192 intervals)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1185,"s":0,"a":false,"x":"Part of #1185. Exists: forecast.lab, forecastlab. (Lyapunov, overfitting), ts.adaptive, ts.naivebaselines, lib.ts.predictability, analyzestep, forecaststep, the ENSO flow. Needed: one standard flow. \u00b7 Input: a series or a table (multivariate, with exogenous covariates). \u00b7 Analysis: \u00b7 missing values, outliers; \u00b7 seasonality, stationarity tests; \u00b7 the predictability horizon (largest Lyapunov exponent or permutation \u2026"},{"n":1196,"t":"Workflow: satellite image processing (STAC search \u2192 cloud mask \u2192 indices / segmentation \u2192 change detection \u2192 validation)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1185,"s":0,"a":false,"x":"Part of #1185. Exists: pinneappleperception.sentinel2, changedetection, imagegeometry, data sources in pinneappledata.datasets.externalsources. Needed: one standard flow. \u00b7 Area and time: an AOI (GeoJSON) plus a period. \u00b7 Imagery: STAC search for Sentinel-2 L2A or Landsat, or a user GeoTIFF. \u00b7 Cloud and shadow masking: SCL, or a model. \u00b7 Preparation: reprojection and co-registration. \u00b7 Analysis: \u00b7 spectral indices \u2026"},{"n":1195,"t":"Standard structural mechanics workflow with CalculiX / FEniCS (static, modal, buckling, thermal-stress, fatigue)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1185,"s":0,"a":false,"x":"Part of #1185. Exists: \u00b7 calculix.deck, calculix.solve, calculix.results, solver.calculix; \u00b7 the calculixcantilever example; \u00b7 lib.solver.beam; \u00b7 geometry.unstructuredmesh, gmsh. Not installed here: ccx (CalculiX) and dolfinx (FEniCS). Needed: one standard flow. \u00b7 Geometry and mesh: STEP \u2192 gmsh, second-order tets, with quality checks. \u00b7 Materials: a library of materials with their sources. \u00b7 Loads and boundary \u2026"},{"n":1194,"t":"Standard CFD workflow with OpenFOAM (geometry \u2192 mesh \u2192 case \u2192 run \u2192 checks \u2192 GCI \u2192 post)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1185,"s":0,"a":false,"x":"Part of #1185. Exists: \u00b7 cfd.geometry, cfd.run, cfd.campaign, cfd.study, cfd.sweep, cfd.surrogate; \u00b7 the openfoamcampaign example; \u00b7 the FreeCAD \u2192 OpenFOAM flows; \u00b7 the Ahmed and airfoil cases; \u00b7 externalflow.openfoamavailable. OpenFOAM is not installed in this container. Needed: one standard flow for a user's geometry. \u00b7 Geometry: STL/STEP, with watertightness checked. \u00b7 Mesh: blockMesh + snappyHexMesh, with layers \u2026"},{"n":1185,"t":"Base workflows: a standard, closed-loop pipeline per domain and per method","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":24,"a":false,"x":"Goal A bundled Flow Studio pipeline per domain and per method. Each one is pickable in the Studio and proposed by the planner for a matching description in PT or EN, following the pattern of #1178: 1. a verified model or solver; 2. the measured cost, with recommendarchitecture deciding whether a learned model pays off; 3. the study (design, inverse, forecast, \u2026); 4. the result re-verified by the model, never by the \u2026"},{"n":1170,"t":"Studio catalog: a class is \"executable, run with .solve()\" even when that method needs arguments the form cannot give","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Measured pinneapplestudio.classify marks a class executable with the reason \"built from a form (N required inputs) and run with . ()\" whenever it has a run-like method. The inventory records only method names (inventory.py, the class record's methods), not their parameters. The runner (pinneapplestudio.runner and the Engineer's job runner) then calls that method with no argument. In the Engineer's battery \u2026"},{"n":1166,"t":"FNO: ONNX export for the 1-D and 3-D operators, and an MLP projection head as in Li et al.","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Problem 1. Export: neuraloperators/fnoexport.py rewrites SpectralConv2d in real arithmetic so an FNO2d exports to ONNX. SpectralConv (1-D) and SpectralConv3d have no equivalent, so a 1-D or 3-D FNO cannot be deployed through ONNX. 2. Projection head: the operators end with a single 1\u00d71 projection (outproj). Li et al. 2021 use a two-layer pointwise MLP (width \u2192 128 \u2192 out, GELU). That is the \"projection\" of the \u2026"},{"n":1165,"t":"FNO variants: TFNO (factorised weights), SFNO (sphere), iFNO (modes grown during training)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Problem The library has FNO 1-D/2-D/3-D, AFNO, U-NO, PINO, DeepONet, GNO and Transolver. Three widely used FNO variants are missing: \u00b7 TFNO (Kossaifi et al. 2023, Multi-Grid Tensorized FNO): the spectral weights stored as a Tucker/CP factorisation, with far fewer parameters at similar accuracy, which matters for 3-D. \u00b7 SFNO (Bonev et al. 2023, Spherical Fourier Neural Operators): spherical harmonics instead of the \u2026"},{"n":1164,"t":"Neural operators on irregular geometry: Geo-FNO / GINO (FNO takes only regular grids today)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Problem The FNO family in pinneappleneural/architectures/neuraloperators/ takes fields on a regular grid. An engineering part comes as a mesh or an STL: a cold plate with channels, a car body, a bracket. The library offers two routes for that today, and neither is an FNO on the part's own geometry: \u00b7 GNO and Transolver; \u00b7 MLPFNOSurrogate, which reads an FNO's grid at arbitrary points but does not learn on the \u2026"},{"n":1163,"t":"FNO applied examples measured with the library's own FNO: cold plate approved by the checks, data center with a real trained model","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Problem The FNO's application examples do not show the library's own FNO working: \u00b7 examples/nvidia/07omniversephysicsnemocoldplate trains PhysicsNeMo's FNO, not the library's. The library's own checks reject it (summary.json: decision REJECT, certified residual bound 0.196 against the 0.1 limit, test rel. L2 1.76 %). There is no version that passes. \u00b7 examples/benchmarksuite/10datacenterdigitaltwin.py loads \u2026"},{"n":1161,"t":"Study kinds miss common goal wordings: \"reduzir \u2026 variando \u2026\" is an optimisation, \"r\u00e1pido para testar muitos cen\u00e1rios\" is a surrogate","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Measured pinneapple-engineering-api#48 ran 15 consulting goals through classifystudy. Two of them fell to the default simulation: \u00b7 \"Reduzir o arrasto aerodin\u00e2mico deste carro a 100 km/h variando a inclina\u00e7\u00e3o do vidro traseiro e a altura do spoiler.\" This is a design optimisation: it has an objective verb and design variables. \u00b7 \"Quero um simulador de um carro dirigindo na lama \u2026 r\u00e1pido o bastante para testar muitos \u2026"},{"n":1158,"t":"Missile defence 5/5: example, Flow / Studio integration, docs","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1153,"s":0,"a":false,"x":"Example: examples/defense/ \u00b7 engagement.py: one engagement and its 3-D view. \u00b7 studies.py: runs the ten studies at a small budget, writes results/summary.json with every number and check, and writes the 3-D views. \u00b7 README: \u00b7 what each study shows; \u00b7 the measured results; \u00b7 the scope (textbook models, illustrative parameters, simulation only). Integration \u00b7 The Studio catalog lists the module's tools, with units and \u2026"},{"n":1157,"t":"Missile defence 4/5: studies B: inverse, uncertainty and sensitivity, digital twin, forecast, control, coupled, data analysis","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1153,"s":0,"a":false,"x":"Inverse problem \u00b7 Identify the threat's ballistic coefficient \u03b2 (and its launch point) from noisy radar measurements, with identifystep / calibrate. \u00b7 Done when: a known \u03b2 is recovered inside its interval, and the identified model predicts held-out measurements. Uncertainty and sensitivity \u00b7 Probability of kill: P(miss < lethal radius) by Monte Carlo over: \u00b7 radar noise; \u00b7 \u03b2 uncertainty; \u00b7 launch delay; \u00b7 autopilot \u2026"},{"n":1156,"t":"Missile defence 3/5: studies A: simulation, design optimisation, surrogate","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1153,"s":0,"a":false,"x":"Simulation \u00b7 One engagement, end to end, with its outcome. \u00b7 Verification: the same engagement at half the time step gives the same miss distance within tolerance (time-step convergence). Design optimisation \u00b7 Choose: \u00b7 the interceptor launch-site offset and the navigation gain N, to minimise the expected miss distance over a set of threat trajectories; \u00b7 the radar site, to maximise the warning time over the same \u2026"},{"n":1155,"t":"Missile defence 2/5: interactive 3-D view of an engagement (three.js, self-contained HTML)","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1153,"s":0,"a":false,"x":"What the view shows pinneapplesystems.defense.view.engagementhtml(result, path) writes a single HTML file with the Studio's vendored three.js inlined (no CDN). It shows: \u00b7 the terrain grid with the defended zone (a disc) and the radar (its site and a translucent coverage dome); \u00b7 the threat track, true and estimated by the tracker, with the radar measurements as points; \u00b7 the predicted impact point and its 2\u03c3 \u2026"},{"n":1154,"t":"Missile defence 1/5: models and engagement simulation (ballistic threat, radar + EKF tracker, PN interceptor) with known-answer tests","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1153,"s":0,"a":false,"x":"Module pinneapplesystems.defense \u00b7 ballistics: \u00b7 point mass, flat Earth, gravity; \u00b7 drag with a ballistic coefficient \u03b2 = m/(CD\u00b7A); \u00b7 density from ISA (isadensity); \u00b7 RK4 integration; \u00b7 impact point and time. \u00b7 radar: range, azimuth and elevation of a target from a site, with Gaussian noise, an update rate and a coverage limit (maximum range, minimum elevation). \u00b7 tracker: EKF on the state [position, velocity, 1/\u03b2], \u2026"},{"n":1153,"t":"Missile-defence engagement prototype: ballistic threat, radar tracking, interceptor guidance, 3-D view, and every kind of study (tracking)","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":null,"s":5,"a":false,"x":"Goal A prototype of a point-defence engagement built from PINNeAPPle pieces, with an interactive 3-D view: \u00b7 a ballistic threat; \u00b7 a ground radar that tracks it; \u00b7 an interceptor guided to it. It exercises every kind of study in pinneappleflow.studies (#1149) on one system. Scope and limits \u00b7 Textbook models only: \u00b7 point-mass ballistics with gravity and drag in an exponential / ISA atmosphere; \u00b7 a radar measuring \u2026"},{"n":1152,"t":"Verification derived from the problem: manufactured solutions, conservation, limits and measured convergence order","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":null,"s":0,"a":false,"x":"Problem Today a step's verification is a fixed list per role. Nothing derives the checks from the problem itself: its equations, its conservation laws, its limiting cases and its discretisation. A new problem therefore arrives with no check of its own. What to build pinneappleanalysis.verification.derive(problem) takes a ProblemSpec or PhysicalProblem and returns the checks that apply, each with a reference and a \u2026"},{"n":1151,"t":"Exercise the 3 102 executable Studio tools that have no recorded run","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":null,"s":0,"a":false,"x":"Problem Of the catalog's ~4 750 executable tools, about 3 100 have never been run: they have no smoke run and no recorded inputs. Their forms, units and outputs are unproven. The Engineer can pick one, and the first failure then shows up in a user's project. Plan 1. Batch-harvest inputs. \u00b7 Sources: literal calls in tests, examples and docstrings (python -m pinneapplestudio inputs), then the form defaults. \u00b7 Never \u2026"},{"n":1150,"t":"solve_pde refuses laplace_2d, poisson_2d and eight other box presets: their \"boundary\" tag is the box's faces","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":null,"s":0,"a":false,"x":"Problem Ten presets put their boundary condition on {\"tag\": \"boundary\"}: \u00b7 laplace2d, poisson2d; \u00b7 reactiondiffusion2d, climateoceangyre, materialfracture2d, opiniondynamics2d; \u00b7 steadyheatconduction3d, transientheat3d, helmholtzacoustics3d, waveultrasound3d. solvepde handled this tag badly in two ways over time: \u00b7 Before #857 it dropped the condition silently, so these presets trained with no boundary condition. \u00b7 \u2026"},{"n":1146,"t":"QA-PINN 4/4: docs page and example \u2014 what a QA-PINN is in PINNeAPPle, what it was measured to do, and what it was not","l":["documentation","enhancement"],"m":null,"c":1,"cr":"2026-11-02","up":"2026-11-02","p":1142,"s":0,"a":false,"x":"Part of #1142. Depends on 1/4\u20133/4. Proposed A page, docs/guides/qapinn.md: \u00b7 the architecture, as a diagram of PINNeAPPle's own classes: coordinates \u2192 scaling \u2192 Hadamard + encoding (\u00d7 re-uploads) \u2192 VQC \u2192 \u27e8Zi\u27e9 \u2192 MLP \u2192 \u00fb, with the loss \u03bbdata\u00b7Ldata + \u03bbpde\u00b7LPDE + \u03bbbc\u00b7Lbc/ic; \u00b7 every block named by the class that implements it. An example (examples/quantum/qapinnburgers.py) that trains a QA-PINN on burgers1d: \u00b7 validates \u2026"},{"n":1145,"t":"QA-PINN 3/4: PDE residuals on real quantum devices \u2014 input derivatives by parameter-shift, shot noise, and the cost per training step","l":["enhancement"],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1142,"s":0,"a":false,"x":"Part of #1142. Depends on 1/4. The gap The PDE loss needs derivatives of \u00fb with respect to the inputs (ux, uxx, ut), and gradients of that loss with respect to \u03b8. \u00b7 On the built-in state-vector simulator, autograd provides both exactly. This was checked: uxx comes out of creategraph=True. \u00b7 On a device or a shot-based simulator, there is no autograd through the circuit. Specifically: \u00b7 Input derivatives of \u27e8O\u27e9 \u2026"},{"n":1144,"t":"QA-PINN 2/4: measure it against classical PINNs at equal parameter count, including a Fourier-feature baseline","l":["enhancement"],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1142,"s":0,"a":false,"x":"Part of #1142. Depends on 1/4. Why The claim usually made for QA-PINNs is that quantum feature maps capture high-dimensional, non-linear or multi-scale structure more efficiently than classical networks. In PINNeAPPle, that claim has to be a measurement, and it needs the right baselines. An angle-encoded circuit computes a truncated Fourier series of its scaled inputs (Schuld, Sweke & Meyer 2021). A QA-PINN is \u2026"},{"n":1143,"t":"QA-PINN 1/4: a quantum-feature-map PINN usable on any PDE preset (registry, input scaling, re-uploading), with contract tests","l":["enhancement"],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1142,"s":0,"a":false,"x":"Part of #1142. What happens today pinneapplequantum.HybridModel(mode=\"quantumfirst\") computes coordinates \u2192 VQC \u2192 \u27e8Zi\u27e9 \u2192 MLP \u2192 \u00fb. On the built-in simulator, autograd gives ux and uxx with respect to the input. But nothing connects it to the PDE side of the library: \u00b7 it is not in ModelRegistry, so pp.buildmodel(\"qapinn\", ...), the Arena (modelfactory) and pp.loadcheckpoint cannot build it; \u00b7 angle encoding takes raw \u2026"},{"n":1142,"t":"Quantum-assisted PINNs (QA-PINN): a quantum feature map in front of a PINN, for any PDE preset, measured against classical baselines (tracking)","l":["enhancement"],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":null,"s":4,"a":false,"x":"Context A QA-PINN, as usually drawn, has this pipeline: 1. coordinates (x, y, z, t); 2. a quantum feature map: Hadamards, then Rx(\u03b8)/Ry(\u03b8) encoding and CNOT entanglers; 3. a variational circuit (VQC); 4. the expectation values \u27e8\u03c8|O|\u03c8\u27e9, which feed a classical network; 5. the output \u00fb; 6. a loss \u03bb\u2081Ldata + \u03bb\u2082LPDE + \u03bb\u2083Lbc/ic, where the PDE residual comes from automatic differentiation. Backpropagation trains both the \u2026"},{"n":1141,"t":"mesh_from_surface hangs on a tetrahedron's surface and does not respond to SIGTERM","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":null,"s":0,"a":false,"x":"Problem pinneappledesign.geometry.mesh.mesher3d.meshfromsurface never returns when it is given the closed surface of a single tetrahedron, made of 4 planar triangles: \u00b7 It ran for more than 10 minutes on CPU with gmsh 4.15. \u00b7 timeout 120 python ... did not stop it. The process ignores SIGTERM, presumably because of gmsh's own signal handling, and only SIGKILL ends it. \u00b7 The same function meshes the closed surface of \u2026"},{"n":1138,"t":"PhysicsLossHook guesses the physics function's signature from exceptions: (pred, batch) functions fail, and real TypeErrors are hidden","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":null,"s":0,"a":false,"x":"Problem PhysicsLossHook.call (pinneappleneural/trainer/losses.py:47) accepts physics functions in two forms: \u00b7 fn(model, batch) - (loss, components); \u00b7 fn(pred, batch) - loss. It does not know which form it has been given, so it always calls fn(model, batch) first. It falls back to fn(pred, batch) only if that call raises TypeError: This causes two problems. 1. A function in the (pred, batch) form often never runs \u2026"},{"n":1135,"t":"PINNeAPPle 1.0: a stable core with guarantees (tracking)","l":[],"m":"v1.0.0","c":0,"cr":"2026-11-02","up":"2026-11-02","p":423,"s":8,"a":false,"x":"Part of the release issue #423 (milestone v1.0.0). That milestone also holds items that stay in scope alongside this plan: \u00b7 #48: contribution and license policy \u00b7 #49: governance \u00b7 #96: security and supply chain \u00b7 #99: agent tool registry 95 (freeze the public API) is implemented here by #1127 and #1128. Why PINNeAPPle already has more capability than a typical 1.0. What it lacks is a commitment: what is stable, \u2026"},{"n":1134,"t":"1.0 (8/8): release hygiene: tag-to-PyPI proven, release candidates, migration notes, issue triage","l":[],"m":"v1.0.0","c":0,"cr":"2026-11-02","up":"2026-11-02","p":1135,"s":0,"a":false,"x":"Why The PyPI workflow (release.yml, Trusted Publishing) exists but has not run yet, because the v0.8.0 tag is not pushed. There are 665 open issues, and nothing says which of them block 1.0. What \u00b7 Prove the pipeline. Push v0.8.0, which publishes to PyPI, and check that the release notes come from the changelog. \u00b7 Release candidates. \u00b7 1.0.0rc1 is published to PyPI as a pre-release. \u00b7 The workshop repository and the \u2026"},{"n":1133,"t":"1.0 (7/8): external credibility: a versioned, CI-reproducible benchmark report, and the JOSS paper","l":[],"m":"v1.0.0","c":0,"cr":"2026-11-02","up":"2026-11-02","p":1135,"s":0,"a":false,"x":"Why The cross-framework benchmark (PhysicsNeMo / PhysicsNeMo-Sym, DeepXDE and neuraloperator, in benchmarks/vsframeworks/) and the paper reproductions with frozen targets already exist: \u00b7 X-TFC; \u00b7 Gated X-TFC; \u00b7 De Florio 2024; \u00b7 Schiassi 2020. Neither is published as a stable, versioned result, and the JOSS submission is still pending. A 1.0 should come with numbers others can rerun, and with a peer-reviewed \u2026"},{"n":1132,"t":"1.0 (6/8): documentation by task, a guarantees-and-limits page, and API reference for the core only","l":[],"m":"v1.0.0","c":0,"cr":"2026-11-02","up":"2026-11-02","p":1135,"s":0,"a":false,"x":"Why The material exists but is spread across guides, AGENTS.md, STARTHERE.md and per-module docs. A new user cannot see what is guaranteed or what each result was checked against. Related open issues: \u00b7 #954: quickstart has no smoke test. \u00b7 #959: quickstart metrics are missing. \u00b7 #962: 925 lines of quickstart recipes that CI never runs. What \u00b7 One page per main task. Each page has runnable code that is run in CI: \u00b7 \u2026"},{"n":1131,"t":"1.0 (5/8): predictable install: a light base package, a few profiles, 55 extras consolidated","l":[],"m":"v1.0.0","c":0,"cr":"2026-11-02","up":"2026-11-02","p":1135,"s":0,"a":false,"x":"Why pyproject.toml has 55 optional extras, and some overlap: cfd, fitmesh and others each pin gmsh, trimesh and cadquery. A new user cannot tell which one to install. pinneapple doctor already knows the profiles start, cfd, research, enterprise and all. The install should be organised the same way. What \u00b7 pip install pinneapple installs the core only (#1127): no torch-GPU, CAD or solver binaries. The size and the \u2026"},{"n":1130,"t":"1.0 (4/8): the core's tests on every PR, on Linux, macOS and Windows, Python 3.10\u20133.13","l":[],"m":"v1.0.0","c":0,"cr":"2026-11-02","up":"2026-11-02","p":1135,"s":0,"a":false,"x":"Why Today PR CI runs a selection of test files on Linux with Python 3.11, and the full suite runs only nightly (full-suite.yml). A break in the core can therefore land and only show up the next day. Other operating systems and Python versions are never exercised. requires-python says =3.10. What \u00b7 A core job runs every test of the core (#1127) on every PR: \u00b7 a matrix of ubuntu, macos and windows \u00d7 Python 3.10, 3.11, \u2026"},{"n":1122,"t":"Aerodynamics and aircraft: expand the module (viscous airfoils, compressible flow, aeroelasticity, rotors, performance, sizing, handling qualities, Physics AI)","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":null,"s":0,"a":false,"x":"Where we are The library already covers a lot: \u00b7 pinneappledesign.aero: \u00b7 CST and NACA airfoils; \u00b7 a Hess\u2013Smith panel method; \u00b7 an O-grid and OpenFOAM cases (2-D airfoil, 3-D half aircraft); \u00b7 the 436-run airfoil dataset with MeshGraphNet and MLP surrogates; \u00b7 the vortex lattice (wing + tail); \u00b7 light aircraft and A320-class airliner models (performance, CO2, Breguet range in the airliner); \u00b7 NSGA-II design search, \u2026"},{"n":1112,"t":"Electrodynamics with Physics AI: identify q/m and fields from particle tracks; neural surrogate of FDTD scattering","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1105,"s":0,"a":false,"x":"What Two Physics AI cases built on the new solvers. 1. Inverse problem with a PINN. From a noisy, sparse track of a charged particle, for example detector hits, identify: \u00b7 q/m; \u00b7 the magnetic field (uniform, or a low-order model); \u00b7 optionally E. The Lorentz-force ODE is in the loss and the unknowns are trainable, as in a bubble or cloud chamber analysis. 2. Neural surrogate. A neural operator (FNO or DeepONet from \u2026"},{"n":1111,"t":"Electrodynamics: visualization layer (field lines, Poynting flow, 3-D orbits, animations) and a gallery page","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1105,"s":0,"a":false,"x":"What Extend pinneappletools.visualization.electromagnetics: \u00b7 field lines traced in 2-D and 3-D; \u00b7 intensity maps with phase colouring; \u00b7 Poynting-vector streamlines; \u00b7 3-D particle trajectories with a fading trail; \u00b7 a consistent dark and light style. It should also give one animation writer (MP4/GIF, 16:9 and 4:5) that prints the checked numbers of each case on the frames. Also \u00b7 Gallery page: \u2026"},{"n":1110,"t":"Electrodynamics: plasma physics with a 1-D electrostatic particle-in-cell code and EM waves in plasma","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1105,"s":0,"a":false,"x":"What A 1-D electrostatic particle-in-cell (PIC) code in the library: \u00b7 particles pushed with leapfrog; \u00b7 charge and field on a periodic grid (CIC weighting, FFT Poisson solve); \u00b7 diagnostics: energy, field modes, phase space. Plus EM waves in a plasma, through FDTD with a Drude medium. Examples (phase-space animations) \u00b7 Langmuir (plasma) oscillation. \u00b7 Landau damping of a small wave. \u00b7 Two-stream instability: the \u2026"},{"n":1109,"t":"Electrodynamics: FDTD gallery 2: interference, diffraction, guiding, photonic crystals, plasmonics, Cherenkov, phased arrays","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1105,"s":0,"a":false,"x":"What New 2-D FDTD cases on the existing fdtd solver, with animations and field maps: \u00b7 Young's double slit and single-slit diffraction (Fraunhofer and Fresnel); \u00b7 total internal reflection, the evanescent wave and frustrated TIR (optical tunnelling); \u00b7 dielectric slab waveguide modes and a bent waveguide; \u00b7 photonic crystal: the band gap of a rod lattice, a waveguide through the crystal and a sharp bend; \u00b7 surface \u2026"},{"n":1108,"t":"Electrodynamics: transmission lines in the time and frequency domain (telegrapher, reflections, TDR, matching, Smith chart)","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1105,"s":0,"a":false,"x":"What A 1-D telegrapher solver: \u00b7 FDTD on V and I, with lossy RLGC lines; \u00b7 arbitrary terminations: R, L, C and RLC networks; \u00b7 frequency-domain ABCD/S-parameters; \u00b7 Smith-chart plotting. Examples (animations) \u00b7 A pulse launched into a line with open, short and matched loads. \u00b7 Mismatch: partial reflection and bouncing waves (a bounce diagram next to the animation). \u00b7 Standing waves and the VSWR of a sinusoid. \u00b7 TDR: \u2026"},{"n":1107,"t":"Electrodynamics: retarded (Li\u00e9nard\u2013Wiechert) fields of moving and accelerated charges, radiation visuals","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":1105,"s":0,"a":false,"x":"What Li\u00e9nard\u2013Wiechert E and B on a grid, for a charge on any prescribed trajectory. The retarded time is solved per point by root-finding. Examples (animations) \u00b7 A charge moving uniformly: the field compressed into a \"pancake\" at high \u03b2, compared with the Lorentz-transformed Coulomb field. \u00b7 A charge that stops suddenly: the radiation kink travels outward at c (Purcell's picture). \u00b7 An oscillating charge: the \u2026"},{"n":1105,"t":"Electrodynamics: moving charges, radiation, transmission lines, wave phenomena, plasma, with checked visuals (parent)","l":[],"m":null,"c":0,"cr":"2026-11-02","up":"2026-11-02","p":null,"s":7,"a":false,"x":"Why pinneapplesimulation.electromagnetics is strong on statics, machines, FEM, closed-form waves, Mie and a first FDTD gallery: a dielectric cylinder and a Hertzian dipole. The dynamics of electrodynamics is mostly missing: \u00b7 charges moving in fields; \u00b7 fields of accelerated charges (radiation); \u00b7 signals on lines in the time domain; \u00b7 classic wave phenomena; \u00b7 plasmas. These are also the most visual topics in \u2026"},{"n":1104,"t":"Floating city (#1090) as a library example: buoyancy and control study, scene script, outputs, checks","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem The city video comes from scratch scripts outside the library: \u00b7 physics.py, controlstudy.py, final.py: H\u2082/He hot-gas buoyancy, the stability of the atmosphere, and the cascade altitude \u2192 temperature \u2192 heater control; \u00b7 scene.py: the Blender scene; \u00b7 composecity.py: the overlays. What \u00b7 Physics: the buoyancy, thermal and control model moves into the library, either as a pinneapplesimulation aerostat module \u2026"},{"n":1103,"t":"Floating city (#1090): envelope, city and motion detail tied to the physics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem In the first render: \u00b7 the envelope reads as a plastic balloon: a smooth sphere, uniform material, meridian tori as seams; \u00b7 the city is random boxes on a disc; \u00b7 the motion is invisible. The controlled altitude error is at most 3.8 m on a 313 m envelope, so nothing visibly moves in the time-lapse. What \u00b7 Envelope: \u00b7 gored fabric with slight billowing between the load tapes; \u00b7 a translucent membrane lit from \u2026"},{"n":1102,"t":"Floating city (#1090): volumetric cloud deck and atmosphere instead of a textured plane","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem In the first render of the gas-giant city, the cloud deck 25 km below is a large plane with a banded procedural texture. It reads as wood grain or dunes. The cumulus towers are displaced spheres that look solid, and the haze is a distance-based emission blend inside the materials. What \u00b7 Cloud deck: a volumetric layer (Principled Volume with noise density and banded zonal winds) or a VDB generated from a \u2026"},{"n":1101,"t":"Black-hole flyby as a library example: scripts, 16:9 + 4:5 outputs, hero still, JSON, in-image checks (finish #1089)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem The #1089 video was produced with scratch scripts outside the library: shot.py traces in tiles, select()s the disc samples and calls renderseries, and compose2.py adds the overlays. The issue also asks for deliverables the video does not have yet. What \u00b7 examples/blackholeflyby/ holds the tracing and compositing scripts, using only library code, with a --quick mode. \u00b7 Outputs: \u00b7 MP4 at 4:5 and 16:9; \u00b7 a hero \u2026"},{"n":1100,"t":"raytrace: faster tracing (numba / torch GPU) for continuous camera paths, plus anti-aliasing of the photon ring and stars","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem Tracing one 720\u00d7900 camera on 4 CPU cores takes about 5\u20136 minutes. Because of that, the #1089 video uses 3 fixed camera shots joined by crossfades instead of one continuous fly-through. There are also two visual artifacts: \u00b7 the star field shows streaks and stretched sprites; \u00b7 the thin photon ring aliases at one sample per pixel. What \u00b7 A numba or torch (GPU) backend for Camera.trace that is numerically \u2026"},{"n":1099,"t":"raytrace: spinning (Kerr) black holes","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"What Null geodesics in the Kerr metric (Boyer\u2013Lindquist), with: \u00b7 the Carter constant; \u00b7 integration with turning points, or in Mino time; \u00b7 the prograde and retrograde ISCO and circular-orbit \u03a9(r, a); \u00b7 frame dragging in the disc velocity field. A spinning hole's shadow is asymmetric and shifted, and its ISCO moves inward to 1 M for a \u2192 1 (prograde). Checks \u00b7 a = 0 reproduces Schwarzschild, including the existing \u2026"},{"n":1098,"t":"Black-hole visuals: gas from a simulation instead of procedural clumps","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem The #1089 video's hot spots come from orbitingclumps. Their motion is physical (Keplerian), but their size, shape and placement are procedural. What \u00b7 Drive the render from a simulated flow. The candidates are: \u00b7 the in-house AccretionFlow (RIAF/torus hydro, axisymmetric), with its time series; \u00b7 a non-axisymmetric extension: a shearing-box or 3-D run, or seeded perturbations evolved by the same equations; \u00b7 \u2026"},{"n":1097,"t":"raytrace: light-travel time (\"slow light\") for time-dependent flows","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem render / renderseries use the same time t for every sample of a frame, the \"fast light\" approximation (#1091). Light from the far side of the disc arrives tens of M later than light from the near side, and that is comparable to the inner orbit (92 M at the ISCO). Hot spots near the hole are therefore drawn at the wrong phase. What \u00b7 Camera.trace integrates the coordinate time along each ray (dt/d\u03c6 from the \u2026"},{"n":1096,"t":"raytrace: optically thick thin disc and image order (direct image, photon ring n = 1, 2, \u2026)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem The emission is integrated as optically thin: you see through the disc. A geometrically thin accretion disc is optically thick, so it is opaque and emits from its surface. Grey absorption (kappa) exists, but it is not the standard thin-disc model. What \u00b7 Add a surface-emission mode. Record each equatorial crossing (\u03b8 = \u03c0/2) of every ray, with its order n (0 = direct, 1 = first lensed image, \u2026). Emit from the \u2026"},{"n":1095,"t":"raytrace: physical disc temperature and colour (relativistic Novikov\u2013Thorne flux, redshifted blackbody, declared false colour)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem Two things in the #1089 renders are not physical: \u00b7 The flux profile is the Newtonian form: F \u221d r\u207b\u00b3(1 \u2212 \u221a(6/r)). It is not the relativistic Novikov\u2013Thorne profile. \u00b7 The colour is a visual choice: tcolor = 4100 K, scaled by g. A disc around a 10-solar-mass hole is at about 10\u2077 K and emits in X-rays, while one around Sgr A or M87 emits in radio and sub-mm. What 1. A novikovthorneflux(r, M, Mdot) function, \u2026"},{"n":1094,"t":"raytrace: moving observers (free fall, orbit): aberration and observer Doppler","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem raytrace.Camera is a static observer: its pixel directions are defined in the local static frame. The #1089 flyby therefore shows a camera hovering at each radius. It does not show a camera falling in, even though \"falling\" is what such videos usually claim. What \u00b7 Add a camera 4-velocity: radial free fall from rest at infinity, circular orbit, or arbitrary. \u00b7 Transform the pixel directions from the camera \u2026"},{"n":1090,"t":"Sci-fi worlds, computed: a floating city in a gas giant (buoyancy, altitude-keeping control, cinematic render)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Goal A city hanging under a hot-hydrogen envelope in the atmosphere of a Jupiter-like gas giant. The physics is computed and the picture is rendered in a sci-fi style. Physics In an H\u2082/He atmosphere (molar mass \u2248 2.3 g/mol) nothing is lighter than the ambient gas, so lift needs hot hydrogen, a Montgolfi\u00e8re. 1. Atmosphere: p(z) and T(z) of a Jupiter-like profile, from an ideal-gas hydrostatic model with a stated \u2026"},{"n":1089,"t":"Sci-fi worlds, computed: a black hole flyby with its accretion disc (GR ray tracing, cinematic render)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Goal A cinematic black-hole sequence where the picture is computed, not painted. It reuses pinneapplephysics.blackhole: \u00b7 the RIAF / torus hydrodynamics of the accretion flow (AccretionFlow, torusstate); \u00b7 GR ray tracing on Schwarzschild null geodesics (raytrace.Camera, render, bloom, starfield), with Doppler beaming and gravitational redshift. Deliverables 1. A camera path, a slow orbit and dive from r = 120 M \u2026"},{"n":1087,"t":"UGS 5/5: reliability and engineers in the loop: history matching, uncertainty, validated domain, decision record, app view","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"The source work stresses that making surrogates reliable for real decisions, with engineers in the loop, is the harder part. History matching \u00b7 Calibrate permeability multipliers, the aquifer and the well skins to observed pressures and rates. \u00b7 Use ensemble methods (pinneappleanalysis.inverseproblems.ensemblekalman, ES-MDA) with the surrogate as the forward model and simulator spot-checks. \u00b7 Report the posterior \u2026"},{"n":1086,"t":"UGS 4/5: operations optimisation: maximise peak daily deliverability under pressure and well constraints","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"Problem Choose the well schedules (which wells, rates or BHPs per period) over a withdrawal season to maximise the peak daily deliverability, or a target withdrawal profile, subject to: \u00b7 minimum BHP per well; \u00b7 the reservoir pressure floor; \u00b7 maximum rate per well (erosion and sand limits); \u00b7 surface network or compressor capacity; \u00b7 the end-of-season inventory. Method 1. Optimise on the surrogate (3/5), with \u2026"},{"n":1085,"t":"UGS 3/5: UGS benchmark: scenario dataset, training, accuracy and an honest speed-up","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"Dataset From the 1/5 simulator, on a synthetic UGS model: \u00b7 a 3-D anticline trap; \u00b7 several tens of wells, scalable towards more than 100; \u00b7 heterogeneous permeability. Scenarios are well schedules (rates or BHPs per well per period) sampled by Latin hypercube. They cover injection, withdrawal and shut-in. The train/validation/test split includes extrapolation tests: rates beyond the training range, and wells shut \u2026"},{"n":1084,"t":"UGS 2/5: neural-operator upgrades: 3-D / space-time FNO, factorised spectral weights (CP, Tucker, tensor-train), Sobolev H\u00b9 loss","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"Extend pinneappleneural.architectures.neuraloperators, which today has 1-D and 2-D FNO, dense weights and no time axis. Additions \u00b7 FNO3d and a space-time FNO, with an adjustable internal time resolution: the operator steps at a coarser or finer internal time than the data and interpolates. \u00b7 Factorised spectral weights: factorization=\"dense\" | \"cp\" | \"tucker\" | \"tt\" with a rank. The tensor-train contraction is done \u2026"},{"n":1083,"t":"UGS 1/5: reference simulator: compressible gas in porous media with wells (data generator and ground truth)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"Model Single-phase real gas: \u2202(\u03c6 \u03c1(p))/\u2202t = \u2207\u00b7(\u03c1 k/\u03bc(p) \u2207p) + qwells \u00b7 \u03c1 from p/(zRT), with z from the Papay or Hall\u2013Yarborough correlation; \u00b7 \u03bc(p) from Lee\u2013Gonzalez\u2013Eakin; \u00b7 rock compressibility \u03c6(p); \u00b7 2-D and 3-D grids with heterogeneous permeability and porosity: SPE10-style fields, or Gaussian random fields with a correlation length. Wells \u00b7 Peaceman well index; \u00b7 rate or BHP control, switching to BHP when the \u2026"},{"n":1082,"t":"Underground gas storage (UGS): neural-operator surrogate (TFNO-opt style), reservoir simulator, deliverability optimisation, reliability (tracking)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":5,"a":false,"x":"Reference work Sirota et al., the \"NeuroUGS\" line of work: \u00b7 arXiv 2509.21485, Neural Operators for Mathematical Modeling of Transient Fluid Flow in Subsurface Reservoir Systems; \u00b7 an earlier version in Russian Technological Journal 2024 (Sirota, Gushchin, Khan, Kostikov, Butov). Their architecture, TFNO-opt, is a modified Fourier neural operator with: \u00b7 adjustable internal time resolution; \u00b7 tensor(-train) \u2026"},{"n":1081,"t":"Hypothesis \u2192 claims \u2192 verdict \u2192 VeriPhysics grade: an experiment API in the library","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"This is the library side of the app's experiment session (pinneapple-engineering-api #35). API, in pinneappleveriphysics.experiment or alongside pinneapplelab \u00b7 Hypothesis(text) \u2192 claims: each claim is a falsifiable statement with: \u00b7 a quantity, with units; \u00b7 a comparator and a threshold; \u00b7 the conditions; \u00b7 a reference kind (exact, benchmark, independent solver, data); \u00b7 a refutation criterion. \u00b7 \u2026"},{"n":1080,"t":"Problem catalogue as data: equations, conditions and physics-loss code (sympy + LaTeX), with edit validation","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"This is the library side of the app's \"Mapped problems\" screen (pinneapple-engineering-api #34). Goal pinneappleproblemdesign.catalogue (or a module that fits the layout) lists every problem the library knows: \u00b7 presets; \u00b7 PhysicalProblem instances; \u00b7 industrial cases; \u00b7 science experiments that have equations. Each problem comes as a serializable record: \u00b7 Governing equations as sympy, with the generated LaTeX. \u00b7 \u2026"},{"n":1076,"t":"Physics area: electromagnetism (remaining) and the app view of every area","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Electromagnetism Electromagnetism is the reference area: 10 of 11 subareas are available, with 20 experiments. What remains: \u00b7 the engineering subarea, which is partial. Link the existing machines (AFPM, Prius, TEAM 7), antenna and compact-range work as atlas experiments with their checks. \u00b7 3-D time-domain research experiments beyond FDTD, where feasible. For every area: the view in the app \u2026"},{"n":1075,"t":"Physics area: atomic, molecular and optical physics (new area)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"This area is not in the atlas yet. Add physics.amo with the subareas below. Classical optics stays in electromagnetism and is linked from here. Subareas and experiments to add \u00b7 Atomic structure: \u00b7 hydrogen fine structure and the Lamb shift scale; \u00b7 Zeeman and Stark effects (linear/quadratic) against formulas; \u00b7 multi-electron atoms by Hartree\u2013Fock for He and Li against tabulated energies. \u00b7 Spectroscopy: line \u2026"},{"n":1074,"t":"Physics area: geophysics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: subsurface and GFD are partial; seismology is planned. Experiments to add \u00b7 Seismology: \u00b7 P and S wave propagation in layered media; \u00b7 travel times and Snell refraction; \u00b7 Love and Rayleigh wave dispersion against analytic solutions; \u00b7 Lamb's problem; \u00b7 earthquake magnitude/energy relations; \u00b7 source mechanisms (radiation patterns). \u00b7 Subsurface: \u00b7 Darcy flow and well drawdown (Theis solution); \u00b7 \u2026"},{"n":1073,"t":"Physics area: astrophysics and cosmology","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: orbits, stars, accretion, data and cosmology are partial. Experiments to add \u00b7 Orbits: \u00b7 N-body with symplectic integrators (energy drift); \u00b7 the solar system against JPL ephemerides for a short span; \u00b7 orbital transfers (Hohmann, delta-v); \u00b7 tidal locking time scales. \u00b7 Stars: \u00b7 Lane\u2013Emden polytropes against analytic n = 0, 1, 5; \u00b7 a simple main-sequence model (mass\u2013luminosity); \u00b7 the Eddington \u2026"},{"n":1072,"t":"Physics area: plasma physics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: cold plasma is partial; kinetic and MHD are planned. Experiments to add \u00b7 Basics: Debye length and plasma frequency; Langmuir oscillations against \u03c9p. \u00b7 Single-particle motion: gyration; E\u00d7B and grad-B drifts against guiding-centre formulas; magnetic mirror loss cone. \u00b7 Waves: cold-plasma dispersion (O, X, R, L modes and cutoffs, the CMA diagram); Alfv\u00e9n waves. \u00b7 Kinetic: \u00b7 1-D electrostatic PIC: \u2026"},{"n":1071,"t":"Physics area: condensed matter","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: phonons and magnetism are partial, transport is available, and bands are planned. Experiments to add \u00b7 Bands: \u00b7 tight binding: a 1-D chain, the graphene Dirac cones and the SSH topological edge states; \u00b7 the nearly-free-electron gap against perturbation theory; \u00b7 density of states and van Hove singularities; \u00b7 Kronig\u2013Penney. \u00b7 Phonons: \u00b7 monatomic and diatomic chain dispersion; \u00b7 Debye against \u2026"},{"n":1070,"t":"Physics area: nuclear and particle physics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: decay, kinematics and detectors are all planned. Experiments to add \u00b7 Decay: \u00b7 Bateman equations for decay chains (U-238 series secular equilibrium); \u00b7 activity and half-life fits with Poisson counting statistics; \u00b7 dating (C-14). \u00b7 Nuclear structure: the semi-empirical mass formula against AME binding energies, and the valley of stability. \u00b7 Reactions: \u00b7 Q-values and thresholds; \u00b7 cross sections and \u2026"},{"n":1069,"t":"Physics area: relativity","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: special is planned; general is partial. Experiments to add \u00b7 Special relativity: \u00b7 Lorentz transformations and velocity addition; \u00b7 time dilation of muons against the measured flux ratio; \u00b7 relativistic kinematics of collisions (threshold energies); \u00b7 relativistic Doppler and aberration; \u00b7 the twin paradox computed along worldlines. \u00b7 Relativistic dynamics: a charged particle in uniform E and B \u2026"},{"n":1068,"t":"Physics area: quantum mechanics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: Schr\u00f6dinger and non-Hermitian are partial; scattering/spin is planned. Experiments to add \u00b7 Bound states: \u00b7 infinite and finite wells; \u00b7 the harmonic oscillator (energies and wavefunctions); \u00b7 the hydrogen radial equation against the Bohr levels; \u00b7 double-well tunnelling splitting against WKB. \u00b7 Time-dependent: \u00b7 wave-packet spreading and reflection/transmission at a barrier (exact coefficients); \u00b7 \u2026"},{"n":1067,"t":"Physics area: acoustics and vibration","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: resonators, ultrasound and pressure waves are partial. Experiments to add \u00b7 Resonators: \u00b7 Helmholtz resonator frequency, with end correction; \u00b7 open and closed pipe modes; \u00b7 rectangular room modes against the analytic formula; \u00b7 membrane and plate modes (Chladni patterns). \u00b7 Propagation: \u00b7 spherical spreading and atmospheric absorption (ISO 9613); \u00b7 the Lloyd's mirror interference pattern. \u00b7 Room \u2026"},{"n":1066,"t":"Physics area: continuum mechanics (solids)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: elasticity, fracture, contact/wear and granular are partial. Experiments to add \u00b7 Elasticity: \u00b7 cantilever and simply supported beams (Euler\u2013Bernoulli and Timoshenko); \u00b7 plate with a hole (Kirsch, Kt = 3); \u00b7 thick cylinder (Lam\u00e9); \u00b7 Hertz contact; \u00b7 torsion of non-circular sections (Prandtl stress function). \u00b7 Stability: Euler buckling with imperfections (Southwell plot); snap-through of a shallow \u2026"},{"n":1065,"t":"Physics area: fluid mechanics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: incompressible, compressible, turbulence, pipe networks and nonlinear waves are all partial. Experiments to add \u00b7 Incompressible: \u00b7 Poiseuille and Couette (exact); \u00b7 lid-driven cavity (Ghia et al. 1982); \u00b7 cylinder wake Strouhal against Re (Williamson); \u00b7 Sch\u00e4fer\u2013Turek, linked to #1037; \u00b7 Stokes drag on a sphere. \u00b7 Compressible: \u00b7 Sod shock tube (exact Riemann); \u00b7 oblique shock relations; \u00b7 nozzle \u2026"},{"n":1064,"t":"Physics area: thermodynamics and statistical physics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: equations of state, heat transfer, statistical and kinetic are all partial. Experiments to add \u00b7 Equations of state: \u00b7 ideal gas, van der Waals and Peng\u2013Robinson; \u00b7 Maxwell construction and the critical point against tabulated values; \u00b7 CoolProp cross-check where installed. \u00b7 Cycles: \u00b7 Carnot, Otto, Diesel, Brayton and Rankine, with efficiencies against closed forms; \u00b7 entropy generation and exergy. \u2026"},{"n":1063,"t":"Physics area: classical mechanics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: oscillators, central forces, rigid bodies and flight are partial; analytical mechanics is planned. Experiments to add \u00b7 Oscillators: \u00b7 damped and driven oscillators, with resonance curves against the closed form; \u00b7 Duffing hysteresis and jump; \u00b7 parametric resonance (Mathieu tongues); \u00b7 coupled oscillators and normal modes. \u00b7 Central forces: \u00b7 Kepler orbits with energy and angular momentum \u2026"},{"n":1062,"t":"Numerics 7/7: discretisation of PDEs (consistency, stability, convergence) and the numerical lab","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"Discretisation \u00b7 Finite differences for heat, advection and wave equations: \u00b7 truncation error derived symbolically; \u00b7 von Neumann amplification factors and CFL limits, measured by blow-up just above the limit; \u00b7 the Lax equivalence theorem made concrete. \u00b7 Advection schemes: \u00b7 upwind, Lax\u2013Friedrichs, Lax\u2013Wendroff; \u00b7 numerical diffusion and dispersion against the modified equation; \u00b7 flux limiters (TVD) on a step. \u00b7 \u2026"},{"n":1061,"t":"Numerics 6/7: numerical linear algebra","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"\u00b7 Direct solvers: \u00b7 LU with partial pivoting (and the growth factor), Cholesky and QR (Householder against Gram\u2013Schmidt orthogonality loss); \u00b7 sparse orderings and fill-in, reusing numericalsolvers.sparsedirect from #1031 when it lands. \u00b7 Conditioning: \u00b7 the condition number against the relative error observed; \u00b7 Hilbert and Vandermonde examples; \u00b7 iterative refinement. \u00b7 Iterative solvers: \u00b7 Jacobi, Gauss\u2013Seidel \u2026"},{"n":1060,"t":"Numerics 5/7: ODE integrators and stiffness","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"Reuse what exists: numericalsolvers.irkgausslegendre, etdrk4 and stiffkineticsode, plus the integrators of control.loop. Methods \u00b7 Explicit: Euler, Heun, RK4, and embedded pairs (Bogacki\u2013Shampine, Dormand\u2013Prince) with step control. \u00b7 Multistep: Adams\u2013Bashforth/Moulton. \u00b7 Implicit: backward Euler, the trapezoid rule, BDF 1\u20135 and Radau. Analysis \u00b7 Stability regions of each method, plotted, with A- and L-stability \u2026"},{"n":1059,"t":"Numerics 4/7: numerical differentiation and quadrature","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"Differentiation \u00b7 Forward, central and higher-order finite-difference stencils, built for any order on any nodes (Fornberg weights). \u00b7 The truncation against round-off trade-off: the optimal step is measured as a V-shaped error curve. \u00b7 Richardson extrapolation. \u00b7 The complex-step derivative. \u00b7 Automatic differentiation (torch), compared on the same functions. Quadrature \u00b7 Rectangle, trapezoid and Simpson rules. \u00b7 \u2026"},{"n":1058,"t":"Numerics 3/7: interpolation and approximation","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"\u00b7 Polynomial interpolation: \u00b7 Lagrange and barycentric forms, and Newton divided differences; \u00b7 the Runge phenomenon on equispaced nodes against Chebyshev nodes; \u00b7 the Lebesgue constant measured. \u00b7 Splines: cubic (natural, clamped, not-a-knot) and monotone (PCHIP), with error O(h\u2074) measured. \u00b7 Chebyshev approximation: coefficient decay, and spectral convergence for analytic functions against algebraic convergence \u2026"},{"n":1057,"t":"Numerics 2/7: roots and nonlinear systems","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"Scalar methods \u00b7 bisection; \u00b7 regula falsi (and Illinois); \u00b7 secant; \u00b7 Newton; \u00b7 Halley; \u00b7 Brent. Each method returns its iterates, so the observed convergence order (1, 1.618, 2, 3) is measured, not assumed. Failure modes are shown: a Newton cycle, a flat derivative, multiple roots with order loss and its fix. Systems \u00b7 Newton with a line search or trust region; \u00b7 Broyden; \u00b7 Jacobian-free Newton\u2013Krylov; \u00b7 \u2026"},{"n":1056,"t":"Numerics 1/7: floating point and error analysis","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"\u00b7 Machine epsilon, ulp and overflow/underflow: reported for float16, float32 and float64. \u00b7 Catastrophic cancellation, with stable rewrites: \u00b7 the quadratic formula; \u00b7 log1p / expm1; \u00b7 the variance in one pass (Welford) against the naive formula. Measured error against an mpmath reference. \u00b7 Compensated summation: Kahan / Neumaier against naive and pairwise summation, with the error growth against n. \u00b7 Condition \u2026"},{"n":1055,"t":"Control cases 6/6: methods (observers, generic MPC, scheduling, robust and nonlinear control, identification, sampling, MIMO)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"These general methods in pinneapplesystems.control serve the cases above. Methods and verification \u00b7 Observers: \u00b7 Luenberger by pole placement; \u00b7 steady-state Kalman (from pinneapplesystems.digitaltwin / stateestimation); \u00b7 separation principle check. \u00b7 Generic linear and nonlinear MPC on any Plant, reusing operations.control. Constraints on inputs, rates and outputs; verified against a known unconstrained LQR \u2026"},{"n":1054,"t":"Control cases 5/6: energy and power","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"Cases | Case | Verification | |---|---| | Grid load-frequency control (one and two areas, AGC, tie line) | frequency nadir and ROCOF against the swing-equation closed form | | Wind turbine: torque below rated, pitch above rated | gain scheduling against the operating point; reuse the library NREL 5 MW geometry; compare with the published reference controller values | | PV maximum power point tracking | \u2026"},{"n":1053,"t":"Control cases 4/6: marine","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"This extends pinneapplesimulation.naval, which came with #1046. Cases | Case | Verification | |---|---| | Ship heading autopilot (Nomoto 1st and 2nd order) | identification by zig-zag manoeuvre; PID; course-unstable ships | | Roll stabilisation by fins or anti-roll tanks | roll response against the natural period and damping; with and without the stabiliser | | Submarine depth and pitch with bow and stern planes | \u2026"},{"n":1052,"t":"Control cases 3/6: vehicles and aerospace","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"Cases | Case | Verification | |---|---| | Cruise control on a grade (aerodynamic drag, rolling, gear) | PI with anti-windup against the closed form of the linear model | | Active suspension (quarter car) | comfort and road-holding trade-off; LQR against passive, using ISO 8608 road profiles | | ABS and traction (wheel slip) | the slip-dependent friction curve (Pacejka/Burckhardt); slip regulation against bang-bang \u2026"},{"n":1051,"t":"Control cases 2/6: process control","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"Cases | Case | Verification | |---|---| | Tank level and the four-tank process (Johansson 2000) | the non-minimum-phase zero appears or disappears with the valve split; RGA | | Exothermic CSTR (van Heerden) | multiple steady states and the unstable middle one; temperature control with jacket limits | | Heat exchanger | FOPDT identification, then SIMC and IMC against Ziegler\u2013Nichols on the same disturbance | | Boiler \u2026"},{"n":1050,"t":"Control cases 1/6: mechatronics and motion","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"Cases | Case | Verification | |---|---| | DC motor: speed and position loops, current limit, cascade (current \u2192 speed \u2192 position) | closed-form transfer functions; the cascade bandwidth separation | | Inverted pendulum on a cart | open-loop unstable pole against \u221a(g/l); LQR against the textbook gains; swing-up by energy shaping | | Ball and beam | double-integrator chain; the margins of the designed loop | | \u2026"},{"n":1049,"t":"Physics by area: verified experiments for every area of physics in pp.science (tracking)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":14,"a":false,"x":"State on main (pp.science.atlas()) The atlas has 20 areas, but only electromagnetism is complete: 10 of its 11 subareas are available, with 20 experiments. The other physics areas are partial or planned: \u00b7 classical mechanics: 4 partial, 1 planned; \u00b7 thermodynamics: 4 partial; \u00b7 fluids: 5 partial; \u00b7 continuum mechanics: 4 partial; \u00b7 acoustics: 3 partial; \u00b7 quantum: 2 partial, 1 planned; \u00b7 relativity: 1 partial, 1 \u2026"},{"n":1048,"t":"Numerical methods (c\u00e1lculo num\u00e9rico): a verified module with measured convergence orders (tracking)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":7,"a":false,"x":"Why The library uses numerical methods everywhere: RK4, IRK Gauss\u2013Legendre, ETDRK4, stiff kinetics, quadrature in immersed, FEM and convergence studies in pinneappleanalysis.verification. But it has no coherent module where a user can: \u00b7 pick a method; \u00b7 see its order, stability and cost; \u00b7 measure them on their own problem. The science atlas lists appliedmath (integrators, discretisations, verification) as partial. \u2026"},{"n":1047,"t":"Control cases across engineering: a verified catalogue on pinneapple_systems.control (tracking)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":6,"a":false,"x":"This builds on #1040 / #1046. Each case is a plant in the library and lives in pinneapplesystems.control.cases, or in the domain package when one fits. Every case comes with: \u00b7 the model, with units and cited parameters, or labelled \"illustrative\"; \u00b7 the stability analysis: open loop, the closed loop with loopeigenvalues, and margins; \u00b7 the actuator realities (limits, rate, delay) and the \"what to command\" question \u2026"},{"n":1039,"t":"Paused work: #929 renders (PR 7) and #967; Raissi 2019 float64 Table 2 reproduction","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"These sessions were stopped on 2026-10-31 because of usage limits. 3-D electrical machines (#929) PR 7: renders. \u00b7 Branch claude/issue-929-renders, pushed at head 85e946f7. It holds: \u00b7 examples/electrodynamics/26machines3drenders.py; \u00b7 machines3d/renders.py; \u00b7 a Blender fix; \u00b7 tests/testmachines3drenders.py. \u00b7 Lost: the turntable render output, which was still being written in the container (about 1 h of rendering). \u2026"},{"n":1038,"t":"Bilingual Studio (pt/en): remaining library i18n work","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"State when paused (2026-10-31) \u00b7 #1033 (gallery + glossary in pt/en): open. \u00b7 It was reviewed: the code is fine, there are no client names (the hits were \"PhysicsNeMo\"), and the body has no footer. \u00b7 Merge it when CI is green. \u00b7 #1034 (pt text for the tools used by examples, 656 \u2192 705 of 705): open, not yet reviewed. \u00b7 After the merges: \u00b7 bump PINNEAPPLECOMMIT in pinneapple-engineering-api; \u00b7 use inLang(titlept, \u2026"},{"n":1037,"t":"CFD directly on STL (LBM and immersed vs. mesh): finish the pre-registered campaign","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"Goal: run CFD on the geometry without building a body-fitted mesh. It must be at least 2\u00d7 faster in total time, with an error no worse than the reference's plus a margin. The pre-registration is at f42d5c9. Candidates: \u00b7 R: generatemesh + Taylor\u2013Hood P2/P1 (the reference); \u00b7 A: LBM; \u00b7 B: immersed Q2/Q1 with Nitsche and ghost penalty. The cases are Sch\u00e4fer\u2013Turek 2D-1, the sphere at Re 20/50/100, the Armaly step and, \u2026"},{"n":1036,"t":"Generic Physics AI studies, creatable in the Studio without code (design optimization, surrogates, PINNs, inverse problems, twins)","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":1,"a":false,"x":"Goal A user opens the Studio and creates, with no code, any Physics AI study from a base geometry or system, a goal and limits. Design optimization is one kind; the others are surrogate training, PINN/operator solves, inverse identification and digital twins. Today each exists only as a hand-written example: \u00b7 apps/aerooptimizer (airliner, NSGA-II, OpenFOAM 3D check); \u00b7 examples/autolabaero (race car); \u00b7 the \u2026"},{"n":1032,"t":"generate_mesh quality view: worst elements are hidden by vertex averaging","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"Found while wiring the quality view into the app (pinneapple-engineering-api#24). What happens generatemesh (#1025) writes quality.glb / quality.json through fieldview. The cell fields (SICN, gamma, edge ratio) become vertex attributes, and Scene.frommesh sets each vertex to the mean of its neighbouring cells. The colour range in quality.json is computed on those vertex values. On the default box (h = 0.25 m), the \u2026"},{"n":1029,"t":"Compact range (#965): run the study on a private reflector geometry, outside the repository","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"999 (closing #965) delivered the compact-range study on a generic 2 GHz example. That study covers quiet zone against feed gain and reflector size, a surrogate with UQ, the Pareto front, and the smallest reflector verified by physical optics. As measured there, the optimum at 15.7 dBi and 4.53 m gives a usable quiet zone of 1.05 m; the GP predicted 1.00 \u00b1 0.21 m. Left out: running the same study on a private \u2026"},{"n":1028,"t":"Bio line: the paper-scale runs left out of #973 / #994 / #1013","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"Parts 1 and 2 of the biology-informed line are on main (#973, #994, #1013). Several runs were kept at reduced scale or not done because of their CPU cost. They are listed here so they are not lost. Each one should be run only with an explicit go-ahead, and reported with measured numbers. Left out \u00b7 SBINN at full scale (ultradian glucose\u2013insulin, #994). The paper trains for 610k epochs; #994 ran 100k. At 100k the \u2026"},{"n":993,"t":"Model-card governance: the gate stays on push, and the nightly covers the zoo","l":[],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"Split off from the same conversation as #992. scripts/validatemodelcard.py (the \"Model hub governance\" step, last in tests.yml) was stuck behind the hour-long full-suite step: it is cheap, it is a real gate, and it never got to run while the suite was going. With the suite moved to .github/workflows/full-suite.yml, this step now runs in seconds at the end of every push, so it stays must-pass on push rather than \u2026"},{"n":992,"t":"Triage the 81 failures in the full test suite, now that it runs","l":[],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"The full suite in CI never ran. pytest tests/ aborted during collection with Interrupted: 5 errors during collection, and the step was continue-on-error, so the workflow stayed green and nothing was reviewed from it. That is fixed (#975, and the collection fixes in 52d743b7). The suite now runs in .github/workflows/full-suite.yml, nightly at 03:00 UTC and on demand; the workflow is red only when the suite stops \u2026"},{"n":991,"t":"futures: fill the planned directions of the atlas (post-biological, civilization-scale, propulsion)","l":["enhancement","help wanted","priority: P3","effort: L","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"pp.futures.atlas() lists eight directions; five subareas are planned with no code behind them, and the atlas reports that honestly rather than hiding it. Each becomes work when there is a closed-form check worth attaching. Currently planned: | Direction | Subarea | |---|---| | Speculative Physics | physics beyond the Standard Model | | Future Engineering | space elevators and megastructures | | Future Engineering | \u2026"},{"n":990,"t":"futures: decide where the Lab publishes its experiment pages","l":["documentation","priority: P3","effort: S","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"python -m pinneapplefutures publish all --out DIR writes, per experiment, result.json, the figures and a README.md publication (the world with the provenance of every number, the equations, the comparisons with their sources, the checks, the evidence axes, the two verdicts and a What this does not show section), plus Catalogue.md and ATLAS.md. The command exists; the destination does not. Nothing is published \u2026"},{"n":989,"t":"futures: let a demonstrator declare engineering evidence, not just a simulation","l":["enhancement","priority: P2","effort: S","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"The plausibility framework has six axes and the API already accepts evidence on any of them \u2014 SpeculativeResult.engineering(name, passed, value=..., limit=..., detail=...) records a check with source=\"engineering\", which fills technologicalfeasibility and switches the engineering verdict from NOT ASSESSED to FEASIBLE / CONDITIONAL / NOT FEASIBLE. All three current demonstrators leave it NOT ASSESSED, and that is the \u2026"},{"n":988,"t":"futures: a fourth demonstrator -- reaction-diffusion and morphogenesis","l":["enhancement","help wanted","priority: P2","effort: M","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"The atlas lists artificiallife / reaction-diffusion and morphogenesis as partial, pointing at pinneapplephysics.pdeenvironment: the PDE machinery exists, a worked Futures experiment does not. It is the one direction of the Lab with a natural closed-form check that is not yet a demonstrator. What it would add An experiment futures.artificiallife (name to settle) with the same shape as the other three: an epistemic \u2026"},{"n":987,"t":"test(science): cover the Experiment.result_cls hook","l":["enhancement","priority: P2","effort: S","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"986 added Experiment.resultcls (pinneapplescience/core.py, what run() returns) so that a layer built on the science experiments can return its own result type; pinneapplefutures uses it for SpeculativeResult. The hook itself has no test in the package it belongs to \u2014 only the downstream consumer exercises it. What to do \u00b7 A test in tests/testscience.py that a subclass setting resultcls gets that type back from \u2026"},{"n":978,"t":"PINN boundary test: at what electrical size does a PINN stop matching PO and a converged reference?","l":["enhancement","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-30","up":"20
