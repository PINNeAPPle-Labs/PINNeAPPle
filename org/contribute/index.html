 tolerances. \u00b7 Lab runs \u2026"},{"n":441,"t":"Sweep silent fallbacks and audit the remaining model families (PINN, FNO/PINO, transformers)","l":["priority: P0"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"This session found silent fallbacks and wrong training paths: \u00b7 the Arena built an MLP in place of DeepONet; \u00b7 FNO was trained on scattered points reshaped as images, and fno2d built the 1-D operator; \u00b7 compiled PINN losses that failed were dropped; \u00b7 five builders returned an MLP on error; \u00b7 the GNN masked losses averaged over padded nodes; \u00b7 DMD and OpInf stored float32 operators. All are fixed, with tests. \u2026"},{"n":440,"t":"Applicability domain at inference: refuse or fall back to the solver outside the training envelope","l":["priority: P0"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"virtualccx (CalculiX bridge) already checks a validity envelope and falls back to the real solver. Generalise it. \u00b7 Envelope stored with every trained model: parameter box, convex hull, density or Mahalanobis distance of the training inputs, plus feature-space distance for fields. \u00b7 One predict() contract: returns a value, an uncertainty and an in/out-of-domain flag; out of domain means refuse, or call the solver \u2026"},{"n":439,"t":"Uncertainty quantification by default for learned models, with a calibration gate for tier A","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"pinneapplelab.uq.coveragecheck exists. romstudy/beamparametric uses it: the 90 % interval covers 82 % of the unseen displacement values, which is slightly optimistic. \u00b7 Uncertainty heads by default for surrogates: deep ensembles, MC dropout, conformal prediction, GP intervals. \u00b7 Coverage check on unseen data in every learned-model experiment (car surrogate, MeshGraphNet, FNO, DeepONet, forecasters). \u00b7 Curation rule: \u2026"},{"n":438,"t":"Validation against experimental data with measurement uncertainty, one case per domain","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"Closed-form references verify solvers; they do not validate them against reality. Add validation cases with published experimental data and its uncertainty, compared in the ASME V&V 20 way: the comparison error against the validation uncertainty, which combines numerical, input and measurement uncertainty. \u00b7 Aerodynamics: Ahmed body (Lienhart & Becker 2003) or NASA TMR cases, with the measured scatter. \u00b7 Internal \u2026"},{"n":437,"t":"Solution verification: grid convergence index on every CFD and FEA result in the lab","l":["priority: P0"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"pinneapplelab.uq.gcicheck exists and is used by calculixcase/platehole (Kt GCI 1.7 %). Extend it to every mesh-based experiment. \u00b7 vehiclecfd (car and rocket): CD, CL, CNalpha on three meshes. \u00b7 pipeflow: friction factor, bend loss, mixer CoV on three meshes. \u00b7 calculixcase (bracket, modal, buckling, fin), solidfem (three cases): key quantities on three meshes. \u00b7 carlbm, cylinderlbm: lattice resolution study for \u2026"},{"n":436,"t":"Code verification: manufactured solutions and observed order for every solver","l":["priority: P0"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"Every numerical solver in the library gets a code-verification test. Solvers in scope: LBM, FDM/FVM, spectral, black-hole hydro, solidfem, internalflow, externalflow, particles, tribology. For each solver: \u00b7 A method of manufactured solutions case (source terms derived symbolically, pinneapplephysics.symbolicpde where possible). \u00b7 Observed order of accuracy on three or more resolutions against the formal order, as a \u2026"},{"n":435,"t":"Stirred tank: CFD-DEM with two-way coupling instead of the analytic flow","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-11-03","p":null,"s":0,"a":false,"x":"particlesuspension carries DEM particles in an analytic, divergence-free stirred-tank flow (swirl and one circulation loop scaled by the tip speed), one-way coupled. The just-suspended speed is consistent with Zwietering's range, but the flow constants are not calibrated. To do \u00b7 Stirred-tank CFD in OpenFOAM (MRF or sliding mesh, pitched-blade turbine) and import its mean velocity and turbulence fields as the \u2026"},{"n":434,"t":"Industrial-grade confidence: verification, validation and uncertainty everywhere","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":11,"a":false,"x":"The lab's trust card shows the main gap: almost every item answers \"uncertainty\" only partially (declared limitations, no quantified spread). Verification and validation (ASME V&V 20/40, NASA-STD-7009) \u00b7 Code verification: manufactured solutions and observed order of convergence for every solver. \u00b7 Solution verification: grid convergence index (Richardson, three meshes) on every CFD and FEA result in the lab. \u00b7 \u2026"},{"n":433,"t":"Lab catalogue: UX/UI pass, static GitHub Pages version, then the served version with the database","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"UX/UI \u00b7 Text search and combined filters (tier, use, tag, trust-card stage). \u00b7 Gallery lightbox, GIFs that animate on hover, the 3-D viewer embedded in the run sheet. \u00b7 One page per experiment with a shareable link. \u00b7 Stronger hierarchy for tier A, lighter cards, phone and dark-mode review, lazy images. Publication \u00b7 Static curated version (tiers A and B, gallery, no dataset downloads) built by writehtml(..., \u2026"},{"n":432,"t":"Lab catalogue: import the remaining repository results (heat dome 3-D globe, electrodynamics, chassis, ensembles, ...)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Results that exist in the repository but are not in the lab catalogue yet: \u00b7 Heat dome (PNW 2021): only a 2-D preview GIF exists (docs/assets/weather/pnwheatdome2021preview.gif). Import it, and build the 3-D globe visualisation (forecast vs reanalysis on a rotating globe, Twin3D or Blender). \u00b7 Electrodynamics (examples/electrodynamics/results, 6 cases: capacitor, charge, dipole, wire, EM wave, TM waveguide). \u00b7 \u2026"},{"n":431,"t":"Black-hole weather: evaluate the faithful Duarte et al. replication, then the improved models","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The faithful replication of Duarte et al. is training (lr 2e-4, gradient clip 1, 16 filters, 180 min budget). The first attempt (lr 5e-4, no clip, float32) diverged: the loss went from 23k to 49M. Its log is kept as paperfaithfullr5e-4diverged.log. To do \u00b7 Evaluate the faithful model: R\u00b2, trust horizon, mass-budget check against the solver. \u00b7 Make the Interstellar-style real-vs-prediction GIF only if the error is \u2026"},{"n":430,"t":"Lab: rerun the launch-vehicle CFD on a finer mesh (fails Barrowman on the coarse one)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"vehiclecfd with vehicle=rocket (run vehiclecfd-61b9a6cd026a, coarse mesh, about 2 000 skin faces) fails validation: \u00b7 normal-force slope CNalpha 19.8 vs 8.1 from Barrowman \u00b7 centre of pressure 12 % of the length behind Barrowman's The nose alone agrees (CNalpha about 2). The excess comes from the fins and the engine/nozzle region, which the coarse mesh barely resolves (fins 0.22 m thick). To do \u00b7 Rerun with \u2026"},{"n":429,"t":"Lab: discover a PDE from a thermal-camera video, then render the video back from the discovered law","l":["enhancement","priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Part of the law-discovery track (#428). pendulumvideo covers ODEs (law \u2192 video \u2192 law \u2192 video). This issue adds the field case: discover a partial differential equation from false-colour images, then run it the other way and render a video from the discovered law. Pipeline 1. Film. A 2D field obeys ut = D \u0394u \u2212 c\u00b7\u2207u \u2212 k u, with diffusion, advection and decay, on a periodic domain. The exact solution is spectral. It is \u2026"},{"n":428,"t":"Law discovery experiments: from real data, from images and video, and the inverse (law to video, video to parameters)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":400,"s":0,"a":false,"x":"Done in #412 (pinneapplelab experiments, results in lab/) | experiment | data | discovered | check | |---|---|---|---| | keplerlaw | real orbits of 19 bodies (NASA fact sheets) | P \u221d a^1.4999 (Sun), 1.5003 (Jupiter), 1.5007 (Saturn); GM within 0.05-0.12 %; Sun/Jupiter mass ratio 1047.6 (true 1047.35) | passed | | pendulumvideo | video frames (rendered with camera noise and motion blur), angle measured from the \u2026"},{"n":427,"t":"Moonshots from first principles: Starship heat shield, full-flow engines, Mars ISRU, battery packs, humanoids, Hyperloop, rapid iteration","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"Idea Large engineering bets are decided by a few physical numbers: \u00b7 heat flux at the tile; \u00b7 chamber pressure and the turbopump power balance; \u00b7 energy per kilogram of propellant made on Mars; \u00b7 the time for a thermal runaway to propagate in a pack. The way to make them is to reason from first principles and iterate fast on hardware. PINNeAPPle can be the \"fast iteration\" layer: a physics model you trust for the \u2026"},{"n":426,"t":"Attention in DeepONet (arXiv:2609.04407): tokenised cross-attention operators, data-driven and physics-informed, with the paper's controlled ablation","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Context Koric, Liu & Koric, Disentangling Attention in Deep Operator Learning: A Controlled Study of Data-Driven and Physics-Informed Architectures (arXiv:2609.04407, Sept 2026): \u00b7 compares five DeepONet variants that differ only in their attention mechanism; \u00b7 isolates cross-attention, self-attention, tokenisation and attention depth; \u00b7 trains each both data-driven and physics-informed; \u00b7 benchmarks a 1D nonlinear \u2026"},{"n":425,"t":"Reproduce AI-Lorenz and AI-Aristotle (De Florio, Kevrekidis, Karniadakis) with PINNeAPPle's X-TFC: black-box and gray-box discovery of chaotic and biological systems","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context AI-Lorenz (Chaos, Solitons & Fractals 188, 2024; arXiv:2312.14237) and AI-Aristotle (PLOS Comp. Biology, 2024) discover the equations of dynamical systems from sparse, noisy data: \u00b7 X-TFC / physics-informed networks estimate the states, their derivatives and any missing terms (gray-box); \u00b7 symbolic regression distils explicit equations. Benchmarks: Lorenz, a 6-D hyperchaotic system, the non-autonomous Sprott \u2026"},{"n":424,"t":"Stellar rotation, gyrochronology and solar twins (work of J.-D. do Nascimento Jr.): rotation-age-activity laws from Kepler, Gaia and CoRoT data","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Context Jos\u00e9 Dias do Nascimento Jr. (UFRN) works on the rotation, magnetic activity and evolution of Sun-like stars. Representative work: \u00b7 \"The future of the Sun: an evolved solar twin revealed by CoRoT\" (2013, arXiv:1305.3652). CoRoT Sol 1 has a rotation period of 29 \u00b1 5 days and an age of about 6.7 Gyr, a look at the Sun's future. \u00b7 Rotation of solar analogs cross-matching Kepler and Gaia DR2 (2020, \u2026"},{"n":423,"t":"Release v1.0.0: Stable API","l":["priority: P2"],"m":"v1.0.0","c":0,"cr":"2026-10-10","up":"2026-11-02","p":null,"s":1,"a":false,"x":"Release v1.0.0: Stable API Freeze the public API, and add governance, a contribution and license policy, security and supply chain, and an agent tool registry on top of PhysicalProblem. Plan and sequencing (2026-11-02): #1135. It measures where the library stands and splits the work into #1127\u2013#1134. The items below stay in scope. #95 (freeze the public API) is implemented by #1127 (core vs experimental) and #1128 \u2026"},{"n":422,"t":"Release v0.9.0: Twins and discovery at scale","l":["priority: P2"],"m":"v0.9.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Release v0.9.0: Twins and discovery at scale End-to-end digital twins with real sensors and OpenUSD, equation discovery inside the Experiment flow, numerical reproducibility, extrapolation error in every case, task-oriented docs, and the version matrix. Scope (milestone v0.9.0) \u00b7 #46 [A5] Errors that teach \u00b7 #47 [A6] Task-oriented documentation \u00b7 #50 [A9] One-command development environment \u00b7 #58 [D7] Extrapolation \u2026"},{"n":421,"t":"Release v0.8.0: Surrogates with evidence","l":["priority: P1"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Release v0.8.0: Surrogates with evidence Surrogates you can hand to someone else: validation cards, V&V reports in the industry standard, FMU export, measured cost, active learning and multi-fidelity behind one interface, rendering of fields on any mesh. Scope (milestone v0.8.0) \u00b7 #31 [B4] Unified PhysicsValidator \u00b7 #33 [B7] DesignPipeline: from problem to validated design \u00b7 #34 [B8] ActiveLearning behind one \u2026"},{"n":420,"t":"Release v0.7.0: Foundations you can trust","l":["priority: P0"],"m":"v0.7.0","c":1,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Release v0.7.0: Foundations you can trust One front door, one Experiment record with provenance, a rigorous benchmark protocol, units in the API, plugins and blocking CI tiers. Black-hole weather and PINNeAPPle Lab (PR #412) land here as the first users of the Experiment record. Scope (milestone v0.7.0) \u00b7 #27 [B6] Unified PhysicalProblem (universal ProblemSpec) \u00b7 #28 [B1] pp.solve() and pp.compare(): one entry point \u2026"},{"n":419,"t":"Cinematic general-relativistic views (\"Interstellar\" style) for more problems: Kerr/Gargantua, EHT images, neutron stars, tidal disruption, wormholes, lensing","l":["priority: P3"],"m":"v0.9.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Context pinneapplephysics.blackhole.raytrace (#399, PR #412) integrates Schwarzschild null geodesics through a simulated flow. It adds gravitational and Doppler redshift, a lensed star field and a film-like look, and the tests check the shadow size and the lensed far side of a thin disc. The same machinery turns several other problems into physically correct, striking visualisations, and some of them into \u2026"},{"n":418,"t":"Synthetic labelled image and video datasets from the PINNeAPPle simulators, for vision pre-training and benchmarks","l":["priority: P3"],"m":"v0.9.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":413,"s":0,"a":false,"x":"Idea The library's solvers (LBM, shallow water, compressible FV, accretion hydro, heat, VOF / OpenFOAM) and renderers (Blender, Twin3D, the GR ray tracer) can produce images and video with exact labels: \u00b7 regime; \u00b7 parameters (Re, Ra, \u03b1\u2026); \u00b7 masks of phases and objects; \u00b7 velocity fields; \u00b7 the physical state. At scale this is a training set no real dataset can match for physical vision, and a controlled benchmark \u2026"},{"n":417,"t":"Video: segmentation and tracking that obey transport (plumes, clouds, bubbles), and video classification of flow regimes","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":413,"s":0,"a":false,"x":"Idea In video of physical systems, segmented objects move with the flow. A mask m(x, t) of smoke, a cloud or a bubble should approximately satisfy a transport equation \u2202m/\u2202t + u\u00b7\u2207m \u2248 sources. Here u is the optical flow, or a velocity from PIV (#329). Frame-by-frame segmentation does not know this, so masks flicker and objects get lost. Plan 1. Transport-consistent segmentation. Segment each frame (U-Net / SAM2 when \u2026"},{"n":416,"t":"Physics-consistent image segmentation: cracks, grains, bubbles and interfaces, cells","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":413,"s":0,"a":false,"x":"Idea Segmentation masks of physical objects have properties a generic model ignores: \u00b7 cracks are thin and connected; \u00b7 grains tile the plane; \u00b7 the area of a bubble is tied to its gas content; \u00b7 the phase fractions of a two-phase image add up to one; \u00b7 the sum of cell areas does not jump between frames. Adding these as soft constraints, and checking them at inference, gives better masks and a trust signal. \u2026"},{"n":415,"t":"Unsupervised clustering of physical regimes in images and video, checked against known regimes","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":413,"s":0,"a":false,"x":"Idea Many physical datasets have no labels, but the physics has regimes: \u00b7 laminar, vortex-shedding, turbulent; \u00b7 quiet and flaring Sun; \u00b7 stable and unstable plumes; \u00b7 the flow patterns of two-phase flow. Clustering embeddings of the images finds structure. Clustering physical descriptors finds structure the physics recognises. The question this issue answers is which combination recovers the true regimes, and how \u2026"},{"n":414,"t":"Image classification with calibrated trust: galaxy morphology, steel surface defects, microstructures","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":413,"s":0,"a":false,"x":"Idea Classify physical images and say when not to trust the class. This uses a learned backbone, physical descriptors and conformal prediction sets. Benchmarks (public) \u00b7 Galaxy10 DECaLS (17 736 galaxy images, 10 morphology classes). Galaxy Zoo labels for the larger set. \u00b7 Physical descriptors: S\u00e9rsic index, concentration, asymmetry, smoothness, colour. \u00b7 NEU surface defect database (hot-rolled steel, 6 classes) and \u2026"},{"n":413,"t":"Vision with physics and trust: classification, clustering and segmentation of images and video","l":["priority: P3"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":5,"a":false,"x":"Why Images and video are where physical systems are most often observed: \u00b7 microscopes, cameras on test rigs, thermography; \u00b7 satellites and telescopes; \u00b7 high-speed video of flows and sprays. Generic vision models classify, cluster and segment them well inside their training distribution. They have two weaknesses on physical data: \u00b7 they say nothing when the data leave that distribution; \u00b7 their outputs can violate \u2026"},{"n":411,"t":"NVIDIA Omniverse live link and Cosmos / Isaac: Twin3D scenes in Omniverse, world models and robot training with physics checks","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context \u00b7 Twin3D already exports OpenUSD (#85) and has a browser viewer that does not need Omniverse (#183). NVIDIA Omniverse (Kit, USD Composer) is where many industrial digital twins live. \u00b7 pinneappleworldmodel generates physics datasets and camera systems. NVIDIA Cosmos world foundation models generate and predict video of physical scenes, and NVIDIA Isaac Sim / Isaac Lab train robots in simulation. Both need a \u2026"},{"n":410,"t":"NVIDIA Warp kernels for the library's finite-volume solvers (GPU and differentiable), starting with the black-hole hydro","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context Several PINNeAPPle solvers are vectorised PyTorch: \u00b7 compressiblefv; \u00b7 shallowwaterfv; \u00b7 the new axisymmetric accretion solver in pinneapplephysics.blackhole (#399). On small grids they are dominated by kernel-launch overhead. The accretion solver takes about 10 ms per step on 128 \u00d7 64 cells on CPU, so a 10\u2074 GM/c\u00b3 run takes about 1.5 h. NVIDIA Warp compiles Python kernels to CPU and CUDA, supports automatic \u2026"},{"n":409,"t":"NVIDIA PhysicsNeMo DoMINO and X-MeshGraphNet as baselines on the Ashton datasets, with the trust layer on top","l":["priority: P3"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context PhysicsNeMo provides external-aerodynamics surrogates with public training recipes: \u00b7 DoMINO: a local, multi-scale point-cloud model for large meshes; \u00b7 X-MeshGraphNet / XAeroNet: MeshGraphNet scaled with halo regions. They are trained and published on DrivAerML. PINNeAPPle already has MeshGraphNet parity work against PhysicsNeMo (#228, #230, #232) and a PhysicsNeMo backend issue (#75). Plan 1. Run the \u2026"},{"n":408,"t":"NVIDIA Earth-2: score Earth2Studio models (FourCastNet/SFNO, CorrDiff, StormCast) with the PINNeAPPle trust horizon","l":["priority: P3"],"m":"v0.9.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context NVIDIA Earth-2 (Earth2Studio and PhysicsNeMo) ships pretrained weather and climate models: \u00b7 global forecasters (FourCastNet / SFNO and others exposed by Earth2Studio); \u00b7 CorrDiff, generative diffusion downscaling to km scale; \u00b7 StormCast, a km-scale convection-allowing emulator; \u00b7 cBottle, a climate generative model. PINNeAPPle's weather work (pinneapplephysics.weather, #322, #323) measures how many days a \u2026"},{"n":407,"t":"WindsorML plus one loader and benchmark across Ashton's AhmedML, DrivAerML and WindsorML","l":["priority: P2"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context Neil Ashton (AWS) and co-authors released three open automotive CFD datasets with the same file structure and a permissive licence (CC-BY-SA), built for ML research: \u00b7 AhmedML: 500 Ahmed-body variants, hybrid RANS-LES in OpenFOAM, about 20 M cells (arXiv:2407.20801). Tracked in #241. \u00b7 DrivAerML: 500 morphed DrivAer cars, hybrid RANS-LES, on the order of 140-160 M cells. Tracked in #247. \u00b7 WindsorML: 355 \u2026"},{"n":406,"t":"Rarefied gas dynamics with PINN-TFC: BGK thermal creep and Poiseuille flow across Knudsen numbers (De Florio et al.)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context Micro-channels, vacuum systems, MEMS and high-altitude flight leave the continuum regime, where Navier-Stokes fails. In the BGK approximation of the Boltzmann equation, De Florio, Schiassi, Ganapol and Furfaro solved two problems with PINN-TFC (shallow networks with Chebyshev or Legendre bases) and matched the published benchmarks: \u00b7 Physics-informed neural networks for rarefied-gas dynamics: thermal creep \u2026"},{"n":405,"t":"Pontryagin and Bellman neural networks: physics-informed optimal control and guidance (Schiassi, D'Ambrosio, Furfaro)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context Physics-informed networks can solve optimal control problems directly: \u00b7 Pontryagin Neural Networks (PoNN): the Pontryagin Minimum Principle turns the problem into a two-point boundary value problem for state and costate, which is solved with X-TFC or PINNs. \u00b7 Schiassi, Calabr\u00f2, De Falco, Pontryagin Neural Networks for the Class of Optimal Control Problems With Integral Quadratic Cost, Aerospace Research \u2026"},{"n":404,"t":"X-TFC: reproduce the Schiassi et al. benchmarks and extend the solvers beyond heat/Burgers","l":["priority: P2"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context X-TFC (Schiassi, Leake, De Florio, Johnston, Furfaro, Mortari) combines two ideas: \u00b7 the Theory of Functional Connections, whose constrained expressions satisfy the boundary and initial conditions exactly; \u00b7 a single-layer network with fixed random hidden weights (Extreme Learning Machine). Training therefore reduces to (iterative) least squares, which gives high accuracy in milliseconds to seconds. Papers: \u2026"},{"n":403,"t":"Related work to build on: X-TFC line (Schiassi, De Florio, Furfaro, Mortari), Ashton's open CFD datasets, NVIDIA PhysicsNeMo / Earth-2","l":["priority: P3"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":9,"a":false,"x":"Why Several research lines map directly onto what PINNeAPPle does. Reproducing their published results inside the library does three things: \u00b7 validates our implementations against numbers the community already trusts; \u00b7 gives the trust layer real benchmarks; \u00b7 builds bridges to the groups and tools behind them. This epic tracks them. Each sub-issue reproduces published results first, then adds what PINNeAPPle \u2026"},{"n":401,"t":"Exoplanet discovery with the Hilbert-Huang transform: adaptive detrending of stellar variability, then a physics transit search","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":386,"s":0,"a":false,"x":"Idea A transit is a dip of 0.01-1 % lasting a few hours. The star underneath is not stationary: \u00b7 spots rotating in and out (days to weeks); \u00b7 spot evolution; \u00b7 pulsations and granulation; \u00b7 flares; \u00b7 instrument drifts and gaps. Detrending is the step that decides whether a small planet survives. Fixed-window filters and stationary Gaussian processes assume a timescale or a stationarity the star does not respect. \u2026"},{"n":400,"t":"From inverse models to equations: distil trained PINNs, neural ODEs and operators into verified symbolic laws","l":["priority: P2"],"m":"v0.8.0","c":1,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":1,"a":false,"x":"Idea An inverse model (a PINN with an unknown term, a neural ODE, a neural operator fitted to data) learns a law but hides it in weights. The next step is to read it out as an equation a scientist can check, publish and reuse in a solver. Then the equation itself becomes a hypothesis to verify, not just a curve fit. The library already has pieces of this in pinneappleanalysis/inverseproblems/missingterm.py: \u00b7 \u2026"},{"n":399,"t":"Black-hole weather forecasting: reproduce Duarte, Nemmen & Navarro and add a trust horizon, physics residuals and MHD","l":["priority: P3"],"m":"v0.7.0","c":1,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Roberta Duarte, Rodrigo Nemmen and Jo\u00e3o Paulo Navarro trained a convolutional network on hydrodynamic simulations of radiatively inefficient accretion flows (RIAFs) around a black hole. The network forecasts the turbulent flow about four orders of magnitude faster than the fluid solver on 200 CPU cores. They called it \"black hole weather forecasting\", and their own framing asks what the weather work in \u2026"},{"n":398,"t":"Planetary rovers on regolith: traversability and slip on the Moon and Mars (terramechanics in low gravity)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Rovers get stuck in soft sand (Spirit, 2009) because regolith behaves differently in low gravity and vacuum. The field-robot traversability issue (#333) goes off-world: \u00b7 Bekker/Wong-Reece terramechanics with Moon and Mars gravity and regolith parameters; \u00b7 slip and sinkage predicted from orbital and onboard imagery; \u00b7 the trust layer flags terrain the model has not seen. Plan \u00b7 Data: \u00b7 HiRISE / LRO NAC terrain \u2026"},{"n":397,"t":"Low-thrust and multi-flyby trajectory design with evolutionary search (GTOC-style problems)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Interplanetary trajectory design (sequences of gravity assists, low-thrust spirals) is a global optimisation problem with many local optima and discrete choices (which planet to fly by). This is where evolutionary methods shine, and where gradients alone fail: \u00b7 differential evolution; \u00b7 CMA-ES; \u00b7 NSGA-II for propellant against time of flight; \u00b7 quality-diversity (#354) for a family of different missions. ESA's \u2026"},{"n":396,"t":"Spacecraft thermal design: radiative heat with PINN surrogates over the orbit, for CubeSats","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea A satellite's temperature swings with every orbit: sun and eclipse, Earth albedo and infrared, internal dissipation. Thermal design normally needs many slow thermal-network runs. A PINN or neural operator surrogate of the conduction + radiation problem, parametrised by: \u00b7 orbit (beta angle, altitude); \u00b7 attitude; \u00b7 coatings (absorptivity and emissivity); \u00b7 power, lets the engineer explore designs in seconds. \u2026"},{"n":395,"t":"Spacecraft telemetry: anomaly detection and attitude faults (reaction wheels, sensors) on public ESA and NASA benchmarks","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Spacecraft operators watch thousands of telemetry channels. Most anomaly detectors are purely statistical and raise many false alarms. Physics models of the subsystems help separate a real fault (a reaction wheel losing torque) from a telemetry glitch: \u00b7 attitude dynamics: Euler's equations with wheel momentum; \u00b7 the power balance; \u00b7 thermal nodes. It is the drone flight-safety problem (#335) in orbit. Plan \u00b7 \u2026"},{"n":394,"t":"Powered descent and landing: guidance with physics-verified model switching (engine-out, wind, sloshing)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Landing a rocket stage or a lunar lander is a model predictive control problem with hard constraints: \u00b7 glide slope; \u00b7 thrust bounds; \u00b7 the final touchdown state. Convex guidance (G-FOLD style, A\u00e7\u0131kme\u015fe & Blackmore) solves it with a nominal model. In flight the model changes: an engine out, propellant sloshing, gusts, mass uncertainty. This is the robotics model predictive control issue (#331) in its most \u2026"},{"n":393,"t":"Atmospheric reentry: hypersonic heating and heat-shield ablation, trajectory with a trust envelope","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea A capsule entering at 7-11 km/s is a coupled problem: \u00b7 trajectory (drag, lift, gravity); \u00b7 stagnation-point heating (Sutton-Graves / Fay-Riddell correlations, then CFD where possible); \u00b7 heat-shield response: conduction, pyrolysis and surface recession. The ablator's thermal response is a moving-boundary PDE well suited to PINNs. The trust layer marks where the correlations stop being valid (high altitude \u2026"},{"n":392,"t":"Orbit determination and space traffic: propagation with uncertainty, conjunctions, and drag during geomagnetic storms","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea More than 10,000 active satellites share low Earth orbit. Collision avoidance needs each orbit's uncertainty propagated forward, and the dominant uncertainty in LEO is atmospheric drag. Drag jumps during geomagnetic storms, which is how about 38 Starlink satellites were lost in February 2022. That links directly to the space-weather issue. Plan \u00b7 Data (public): CelesTrak TLEs and SupGP ephemerides, SGP4 \u2026"},{"n":391,"t":"Transients: supernova light curves with physics templates, for the Rubin Observatory alert stream","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea The Vera C. Rubin Observatory will issue millions of alerts per night. Classifying and forecasting transients from a few early points decides which ones get follow-up spectra. The physics of each class (radioactive decay of nickel-56 and cobalt-56 in Type Ia, shock cooling and plateaus in Type II, kilonova models) gives templates that generalise better than pure classifiers. Bogus alerts (artefacts, satellites, \u2026"},{"n":390,"t":"Black-hole imaging and strong lensing: physics-constrained inverse problems with uncertainty","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Two inverse problems where physics constraints decide what an image can mean. 1. Black-hole imaging (Event Horizon Telescope) Interferometric data sample the sky's Fourier transform sparsely. Imaging is an ill-posed inverse problem. Physics priors help: \u00b7 a ring shape from photon orbits; \u00b7 brightness asymmetry from Doppler beaming; \u00b7 GRMHD-simulation priors. They must be separated from what the data actually \u2026"},{"n":389,"t":"Stellar structure: from Lane-Emden to full stellar models with PINNs, checked against MESA","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea The repo already has a Lane-Emden example (examples/runslaneemden). The next step is the full structure equations of a star: \u00b7 hydrostatic equilibrium; \u00b7 mass continuity; \u00b7 energy generation by the pp-chain and CNO cycle; \u00b7 radiative or convective transport, with a real equation of state and opacities. These are stiff, coupled ODEs with a free boundary: a demanding PINN benchmark with a gold-standard reference \u2026"},{"n":388,"t":"Cosmology emulators: neural operators for structure formation, with a trust layer for parameters outside the training range","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Cosmological simulations (dark matter + baryons) are too expensive to run for every set of cosmological parameters. Emulators (neural operators, U-Nets) map parameters and initial conditions to the density field or the power spectrum in seconds. They are only valid inside the parameter space they were trained on, and they can break subtly (mass conservation, the large-scale power spectrum). Plan \u00b7 Data: CAMELS \u2026"},{"n":387,"t":"Galaxy rotation curves and dark matter: physics-informed mass models on SPARC","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Galaxies rotate too fast at large radii for their visible mass: the classic evidence for dark matter, or for modified gravity (MOND). With a rotation curve, the question \"which mass model is right for this galaxy\" is a model-selection problem with clear physics: Poisson's equation and the circular velocity v\u00b2 = r \u2202\u03a6/\u2202r. Plan \u00b7 Data: SPARC (175 galaxies, Spitzer photometry + HI/H\u03b1 rotation curves; public). \u00b7 \u2026"},{"n":386,"t":"Exoplanet transits: physics transit model + stellar variability + instrument checks on TESS/Kepler light curves","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":1,"a":false,"x":"Idea A transiting planet dims its star by a fraction set by geometry (the Mandel-Agol model with limb darkening). Real light curves mix that with: \u00b7 stellar variability (spots, granulation, flares); \u00b7 instrument systematics (momentum dumps, scattered light). Telling a real transit from a systematic is the \"regime change or sensor noise\" question. Plan \u00b7 Data: TESS and Kepler light curves from MAST (public, no \u2026"},{"n":385,"t":"Space weather: from solar images to geomagnetic storm forecasts with a trust horizon","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea A solar eruption becomes a geomagnetic storm at Earth 1-4 days later. It disturbs power grids, GNSS and satellites: in February 2022, about 38 Starlink satellites were lost to drag after a minor storm. The chain is physics: 1. flare and CME onset from solar images; 2. solar-wind propagation to L1 (a ballistic model or a WSA-Enlil-style surrogate); 3. measured L1 plasma and field; 4. a coupling function to the \u2026"},{"n":384,"t":"Astronomy, astrophysics and astronautics: physics AI that knows when to trust it, from the Sun to orbit","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":17,"a":false,"x":"Space is the ideal ground for PINNeAPPle's edge: \u00b7 the physics is well known; \u00b7 the public data is excellent (NASA, ESA, MAST, JSOC, CelesTrak, GWOSC); \u00b7 instruments have glitches and systematics that must be told apart from real signals; \u00b7 many decisions (collision avoidance, storm warnings) need a forecast with a stated horizon. Sub-issues follow. Related science-fiction showcases already open: tidally locked \u2026"},{"n":382,"t":"Sci-fi showcase: listening to black holes, gravitational waves from public LIGO data","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture Two black holes spiralling into each other (a render), with the real strain signal from LIGO underneath and the \"chirp\" played as sound. Real physics \u00b7 Public strain data from GWOSC (open; e.g. GW150914). \u00b7 Matched filtering against waveform templates (post-Newtonian inspiral, plus an open waveform model). \u00b7 A physics-informed model of the chirp (frequency evolution set by the chirp mass) fitted with \u2026"},{"n":381,"t":"Sci-fi showcase: planetary defence, deflecting an asteroid and how far ahead the impact can be trusted","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture An asteroid's orbit drawn as an uncertainty cloud that grows over years. A kinetic impactor (as in DART) nudges it, and the cloud's intersection with Earth's position shrinks to zero. A trust bar shows how far ahead the \"miss\" can be guaranteed. Real physics \u00b7 N-body orbital integration (Sun, planets, Moon), with Yarkovsky and solar radiation pressure as uncertain parameters. \u00b7 Momentum transfer with the \u2026"},{"n":380,"t":"Sci-fi showcase: flying on other worlds, one drone design on Earth, Mars and Titan","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture The same small rotorcraft shown flying in three atmospheres: on Mars it needs huge, fast blades (like Ingenuity); on Titan it flies easily (dense air, low gravity, as planned for Dragonfly). Real physics \u00b7 Rotor performance with BEMT and low-Reynolds airfoil data (#270), and OpenFOAM rotating-frame runs at each world's density, viscosity, speed of sound and gravity. \u00b7 Power required, tip Mach limits and \u2026"},{"n":379,"t":"Sci-fi showcase: weather inside an O'Neill cylinder (clouds that fall sideways)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture The inside of a rotating space habitat (an O'Neill cylinder): air heated on the \"ground\" rises toward the axis, where gravity vanishes, and clouds and thermals curve because of the Coriolis force. Real physics Buoyancy-driven flow in a rotating frame, with artificial gravity \u03c9\u00b2r increasing with radius, Coriolis and centrifugal terms, and heat sources on the inner surface. OpenFOAM in a rotating reference \u2026"},{"n":378,"t":"Sci-fi showcase: a fusion tokamak, the plasma equilibrium and the instability seen before the disruption","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A cross-section of a tokamak plasma with its magnetic flux surfaces. The shape evolves; before a disruption the physics residual climbs and a warning appears. Real physics \u00b7 The Grad-Shafranov equilibrium solved with a PINN (a known PINN benchmark), with coil currents as parameters. \u00b7 Vertical instability and disruption precursors from the equilibrium's stability margin. \u00b7 PhysicsEnsemble over \u2026"},{"n":377,"t":"Sci-fi showcase: a space elevator, a 36 000 km cable swaying with the wind and the climber","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A twin3d or Blender scene of a cable from the equator to beyond geostationary orbit. Waves run up and down it when a climber starts or wind gusts hit the lower atmosphere, and a controller damps them. Real physics \u00b7 A tapered cable under gravity and centrifugal load, in the rotating frame (Coriolis on the climber). \u00b7 Material limits: the required specific strength, and why carbon nanotubes or graphene \u2026"},{"n":376,"t":"Sci-fi showcase: an Alcubierre warp bubble, the curvature and where the physics says \"impossible\"","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A 3D render (Blender) of space-time around a warp bubble: the expansion ahead of the bubble, the contraction behind it, and the regions where the energy density the metric needs is negative, highlighted in red. Real physics The Alcubierre metric, with the York time (expansion), and the Einstein tensor computed with symbolic or autograd differentiation (the SymPy \u2192 autograd compiler of \u2026"},{"n":375,"t":"Sci-fi showcase: weather on a tidally locked exoplanet (eternal day side, eternal night side)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A lit globe of a planet locked to its star: a hot day side, a cold night side and the super-rotating jet that carries heat around, as in the TRAPPIST-1 and Proxima b climate papers. The same Earth-2 style animation, on an alien world. Real physics The shallow-water equations on a rotating sphere with day-side forcing (the Matsuno-Gill pattern, the Showman & Polvani 2011 super-rotation mechanism). Solve \u2026"},{"n":374,"t":"Sci-fi showcase: terraforming Mars, a globe warming over centuries","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A Mars globe (earth2gif with Mars topography and colours): the polar caps shrink, the surface warms and the pressure rises as CO2 is released over centuries. A trust bar shortens as the scenario leaves anything measured. Real physics \u00b7 A zonal energy-balance model: insolation with Mars's orbit and obliquity, greenhouse forcing of CO2 and of engineered gases, the albedo of ice against regolith. \u00b7 The CO2 \u2026"},{"n":373,"t":"Showcase: battle of the models, live (FNO vs GraphCast vs PINN vs solver, with a live \"who left its domain first\" scoreboard)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A live arena: several models forecast the same stream of cases. Examples: \u00b7 weather: PINNeAPPle's model, IFS HRES, Pangu-Weather, NeuralGCM (#348); \u00b7 PDE fields: FNO, GNN, PINN, numerical solver. The adaptive ensemble picks in real time. A scoreboard shows error, cost, trust horizon and who left its domain first, with the physics residual as a live \"health bar\" per model. It is the trust benchmark suite (#349) \u2026"},{"n":372,"t":"Showcase: the dam that warns in advance","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A retrospective on a documented tailings-dam failure (#355): satellite deformation (InSAR) and pore pressure feed the slope-stability physics, and the factor of safety falls over months. The alarm states its lead time and confidence, and that a stable dam nearby stays green (no false alarm). This needs to be told carefully and respectfully: the point is what monitoring can do, with honest limits on what could and \u2026"},{"n":371,"t":"Showcase: thermography, seeing the invisible defect","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A board or chip package heats up after a flash; the IR camera sees only a smooth surface. The inverse heat equation (#330) reveals a hidden delamination underneath, as a defect map with uncertainty, revealed frame by frame as the heat diffuses. Second beat: a reflection on the surface would fool a pure image model; the energy-balance check flags it as a measurement artefact. This answers the semiconductor and \u2026"},{"n":370,"t":"Showcase: the robot arm that does not spill the glass","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"In MuJoCo, an arm carries a glass that is being filled, so its mass and its sloshing change. \u00b7 With the trust layer (#331): the physics residual sees the payload change on the first steps; the controller switches dynamics models, shortens its planning horizon while uncertain, and carries the glass without spilling. \u00b7 Next to it: model predictive control with a fixed model overshoots and spills. A second beat: a \u2026"},{"n":369,"t":"Showcase: an aircraft designed in an afternoon (requirements in plain language \u2192 optimisation \u2192 CFD \u2192 cinematic render \u2192 trust)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The aircraft design pieces already exist: \u00b7 the parametric airliner and airframe (pinneappledesign.aero); \u00b7 NSGA-II on surrogates; \u00b7 OpenFOAM 3D verification; \u00b7 Blender Cycles renders and the three.js viewer (apps/aerooptimizer). The showcase is the story in one video: 1. requirements typed in plain language (\"120 seats, 3000 km, short runway\"); 2. the design space explored (quality-diversity map, #354), and the \u2026"},{"n":368,"t":"Showcase: from a phone video to the river's discharge","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A 20-second video filmed from a bridge, turned into: 1. surface velocity vectors drawn over the video (LSPIV); 2. the velocity inside the water across the section (PINN); 3. the discharge with its uncertainty band, compared with the gauge reading. The story: \"any phone becomes a gauging station\", for ungauged streams in a flood (RS 2024). Built on #329 (and #336 for the drone-view version). Deliverables: a \u2026"},{"n":367,"t":"Showcase: the drone that knows it is broken","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A simulated quadrotor (MuJoCo or a 6-DoF model) loses part of a propeller mid-flight; later its GPS glitches. On screen, next to the 3D flight: \u00b7 the physics residual jumps within a few hundred milliseconds; \u00b7 the diagnosis panel says \"motor 3 at ~70 % thrust\" (not \"GPS\"); \u00b7 the controller switches to the degraded-rotor model and lands safely; \u00b7 when the GPS glitch comes, the measurement check says \"sensor fault\" \u2026"},{"n":366,"t":"Showcase: from the satellite to the street, a hurricane end to end on one globe","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"One continuous animation on the Earth-2 style globe (earth2gif), each stage with its trust bar: 1. Now. GOES imagery of the storm (#264). 2. Next hours. The satellite nowcast. 3. Next days. The global model's track and intensity (#322/#323), next to IFS HRES and Pangu. 4. Landfall. Rain, river discharge and flood extent (operational hydrology chain, #327). 5. The street. A twin3d scene of the flooded neighbourhood \u2026"},{"n":365,"t":"Additive manufacturing: melt-pool thermography \u2192 defect predicted before the part is finished","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea In laser powder-bed fusion, the melt pool's thermal signature (from an IR or high-speed camera) predicts porosity, lack of fusion and keyholing layer by layer. A thermal model gives the expected melt-pool size and cooling rate per scan vector (Rosenthal, or a PINN or FEM surrogate), and the measured signature is compared with it. A residual that leaves the in-domain level marks a regime change (keyhole, \u2026"},{"n":364,"t":"Maritime and offshore: wave forecasting, ship and platform motion, mooring loads","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Offshore operations (very present in Brazil) depend on the sea state and on how ships and platforms respond to it. Plan \u00b7 Waves. Significant wave height and period from ERA5 wave fields (in ARCO/WeatherBench2), forecast with the weather model's winds plus a learned or physics wave model, with horizon. \u00b7 Response. Response amplitude operators and a learned correction for ship motion; mooring-line tension from \u2026"},{"n":363,"t":"Biomechanics and sport from video: pose + Lagrangian dynamics \u2192 joint forces and loads","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Pose estimation from ordinary video gives joint positions; the Lagrangian networks of the robotics issue (#332) and inverse dynamics give joint torques and loads. Uses: injury-risk screening, technique coaching, ergonomics at work. Very visual, and it reuses perception (#328) and robotics. Plan \u00b7 Data: open motion-capture datasets with force plates (e.g. public biomechanics sets; check licences), plus pose from \u2026"},{"n":362,"t":"Health (later stage): hemodynamics from 4D-flow MRI with PINNs, pharmacological models with regime changes","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea High value, but sensitive data and regulation, so it is an area to enter after the trust layer and security pieces mature (pinneapplesecurity already maps LGPD/GDPR and 21 CFR Part 11). 1. Hemodynamics. 4D-flow MRI gives noisy, low-resolution velocity in vessels; a Navier-Stokes PINN recovers pressure and wall shear stress with uncertainty. Open benchmarks: public phantom and aneurysm datasets (check licences \u2026"},{"n":361,"t":"Power grids: frequency dynamics with variable renewables, model switching under contingencies","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea As inverter-based generation grows, grid inertia drops and frequency dynamics change regime (which machines are online, grid-forming against grid-following inverters). The swing equation and its multi-machine version are clear physics. Physics-informed and learned surrogates speed up stability assessment, and the trust layer says when a surrogate no longer represents the grid. Plan \u00b7 Benchmarks: IEEE 9/39-bus \u2026"},{"n":360,"t":"Landslides: accumulated rain + slope stability + InSAR deformation, alarms by municipality","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Landslides in Brazil's coastal ranges (Serra do Mar, Petr\u00f3polis 2022, S\u00e3o Sebasti\u00e3o 2023) follow intense or accumulated rain on steep, saturated slopes. The physics combines: \u00b7 infiltration (Green-Ampt / Richards) giving pore pressure; \u00b7 pore pressure in an infinite-slope factor of safety per terrain cell; \u00b7 with deformation from InSAR as an independent check. Plan \u00b7 Data: rainfall (ERA5 or the weather model, \u2026"},{"n":359,"t":"Operational hydrology chain: forecast rain \u2192 river discharge \u2192 flood extent, with a trust horizon at every link","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Join pieces that are being built separately into the chain civil defence needs: 1. rain from the weather model (#322/#323) and the nowcast (#264); 2. a rainfall-runoff model, physics (e.g. a GR4J-style conceptual model, or a distributed one) plus a learned correction, giving discharge at gauges; 3. river routing (Muskingum-Cunge, or a shallow-water surrogate) and the flood extent (#262, with the terrain of \u2026"},{"n":358,"t":"Oil, gas and CO2 storage: fast reservoir surrogates, pressure monitoring and pipeline leak detection","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Ideas 1. Reservoir surrogates. Neural operators (FNO, U-FNO) for multiphase flow in porous media, trained on open simulators (OPM Flow, GPL: run it as an external tool and do not copy code). The trust layer says when a well-control scenario is outside the training envelope. Benchmarks: SPE10 and the CO2 storage cases of the literature. 2. CO2 storage monitoring. Pressure and plume-front forecasts with assimilation \u2026"},{"n":357,"t":"Air quality: pollutant dispersion with low-cost noisy sensors (advection-diffusion + measurement checks)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Cities install cheap PM2.5/NO2 sensors that drift, saturate with humidity and fail. Telling a real pollution episode from a sensor problem is the same question as the ensemble's \"regime change or noise\", with clear physics: advection-diffusion with sources and deposition, wind from the weather model. Plan \u00b7 Data: OpenAQ (open API), reference stations, and low-cost networks (PurpleAir data terms: check). \u00b7 \u2026"},{"n":356,"t":"Methane from space: plume detection (Sentinel-5P / Sentinel-2) and emission-rate inversion with plume physics","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Methane super-emitters (landfills, oil and gas, cattle, coal) are visible from orbit. TROPOMI on Sentinel-5P sees regional enhancements; Sentinel-2 SWIR bands see large point-source plumes. The emission rate comes from inverting a transport model: \u00b7 integrated mass enhancement (IME), with wind from ERA5 or the weather model; \u00b7 or a Gaussian-plume / advection-diffusion PINN. Plan \u00b7 Data: Sentinel-5P L2 CH4 and \u2026"},{"n":355,"t":"Tailings dams: InSAR deformation + piezometers + slope stability, alarms with a trust horizon and sensor checks","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Tailings-dam failures (Mariana 2015, Brumadinho 2019) gave signs before failing: surface deformation, rising pore pressure. The physics links them: \u00b7 seepage (Darcy) to pore pressure; \u00b7 pore pressure to effective stress; \u00b7 effective stress to the factor of safety (limit equilibrium), with creep and acceleration (Fukuzono inverse-velocity) before failure. Plan \u00b7 Data: Sentinel-1 InSAR deformation time series \u2026"},{"n":354,"t":"Quality-diversity search (MAP-Elites): diverse designs, and automatic discovery of the cases where a physics model fails","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Why Optimisers return one design, or a Pareto front. Quality-diversity (MAP-Elites, CMA-ME) returns the best design in every cell of a behaviour space (e.g. \"drag \u00d7 lift \u00d7 volume\"), which matters in two places: 1. Design exploration and data generation. A map of diverse, high-performing heat sinks, airfoils or fins shows the engineer the trade-off space at a glance. It is also a far better training set for \u2026"},{"n":353,"t":"Genetic-programming symbolic regression for closures and missing terms, checked against SINDy and physics constraints","l":["priority: P2"],"m":"v0.8.0","c":1,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Why a genetic method here SINDy (pinneappleneural.architectures.rom.sindy) and the missing-term inverse problem (pinneappleanalysis.inverseproblems.missingterm) need a library of candidate terms chosen in advance. Genetic programming searches the space of expressions itself: products, ratios, powers, special functions. It finds interpretable closures (wall models, drag laws, reaction rates, damage laws) that the \u2026"},{"n":352,"t":"Experiment design and sensor placement: where to measure next to shrink uncertainty fastest (including evolutionary placement)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea Where should the next sensor go, or which test should run next, to reduce the uncertainty that matters (of a quantity of interest, or of the trust horizon) the fastest? It uses the uncertainty already in pinneappleanalysis, and the decision layer (pinneappledecision) that picks the next experiment under hard constraints. Scope \u00b7 Criteria: \u00b7 expected information gain; \u00b7 reduction in the variance of a quantity of \u2026"},{"n":351,"t":"Generic event scoring: lead time of detection, peak and position error, false alarms, for any kind of event","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea The weather case studies score an event by how many days ahead it was well forecast (examples/weatherforecasting/runusecases.py). The same questions apply to a thunderstorm, a motor failure, a battery's knee, structural damage and a flood. Turn this into a library piece. API sketch Scope \u00b7 Event kinds: threshold exceedance, extremum (min/max in a region), onset or change-point, and moving feature (track). \u00b7 \u2026"},{"n":350,"t":"Embedded execution for drones and robots: export model + residual check + measurement check to ONNX, tens of Hz on an embedded CPU","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea The physics residual is cheap, which is what lets trust fly. Export the dynamics model, its residual and the measurementcheck as one ONNX graph (or TorchScript), with a small C/C++ or Python runtime that a flight controller or robot computer can call at 50-200 Hz. Scope \u00b7 Export of PhysicsEnsemble experts plus the residual function and the measurement checks, with a fixed-size state and no Python control flow \u2026"},{"n":349,"t":"Trust benchmark suite: hidden regime changes, sensor faults, slow drift and out-of-domain cases, with a public leaderboard","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea There is no standard benchmark for knowing when a physics model stops being valid. A LinkedIn reviewer of the ensemble work asked for exactly this (\"validate on real drift\"). Whoever defines the benchmark becomes the reference. Tasks (each with ground truth for when the regime or sensor changed) \u00b7 Hidden regime changes. The five-family stream, with regimes that are not separable by the inputs (a hidden \u2026"},{"n":348,"t":"\"Bring your foundation model, PINNeAPPle verifies it\": wrap pre-trained models as ensemble experts under physics checks","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea Nobody will train a better model from scratch than the large pre-trained ones. The value is in knowing when to trust them. Wrap them as Experts of PhysicsEnsemble, with the same residual, measurement and horizon checks: \u00b7 Satellite: Prithvi (NASA/IBM HLS foundation model, open weights on Hugging Face). \u00b7 Weather: the published forecasts in WeatherBench2 (IFS HRES, Pangu-Weather, GraphCast, NeuralGCM) already \u2026"},{"n":347,"t":"Adaptive fidelity driven by the trust horizon: call the expensive solver only where the fast model stops being trustworthy","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea When the fast model's trust horizon shortens, or its residual leaves the in-domain level, the system calls the expensive solver (OpenFOAM, FEM, a fine numerical scheme) only there and then. The result is fed back: it is used as the answer and it retrains or corrects the fast model. PhysicsEnsemble(costweight=...) and #297 (surrogate in the loop with a verification budget) already point this way. Scope \u00b7 A \u2026"},{"n":346,"t":"Data assimilation with neural models: ensemble Kalman filter and 4D-Var with differentiable surrogates","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea The ensemble chooses and combines models. Assimilation corrects the state of a model as measurements arrive. Operational centres do both, and weather, drones, digital twins and batteries all need it. pinneappleanalysis has dataassimilation and stateestimation, and pinneapplesystems.digitaltwin has EKF/EnKF. This issue makes them work with neural and PINN models as the forecast operator. Scope \u00b7 EnKF / LETKF \u2026"},{"n":345,"t":"Trust layer as a first-class object: pp.trust(model, data) attached to every prediction","l":["priority: P0"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea Today trust is spread over several places: \u00b7 PhysicsEnsemble (residual lookahead, measurementcheck); \u00b7 pinneapplephysics.weather.evaluate (horizons); \u00b7 pinneappledecision.verifiers; \u00b7 pinneappleanalysis (uncertainty, validation, trust). The proposal is one object that every prediction can carry, and that every consumer reads (twin3d, the apps, certificates, the decision layer): Scope \u00b7 A Trust dataclass and \u2026"},{"n":344,"t":"Showcases: demos that make people stop scrolling (flagships and science fiction with real physics)","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":18,"a":false,"x":"Demos made to be seen, each with real physics, an honest number and a trust statement (\"good up to X\"). Each one is a GIF or video plus a short write-up and a post. Flagships reuse the technical issues of #327; the science-fiction ones push the library into physics nobody can measure, the extreme case of \"how far can the model be trusted\". Flagships \u00b7 From the satellite to the street: a hurricane end to end. \u00b7 The \u2026"},{"n":343,"t":"Core: the shared pieces that make the use cases one product (trust layer, assimilation, adaptive fidelity, benchmarks)","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":11,"a":false,"x":"The application areas of #327 are what users see. What makes them one product, rather than twenty separate examples, is a set of shared pieces in the library core. Sub-issues, in order of value: 1. Trust layer as a first-class object (pp.trust). 2. Data assimilation with neural models (EnKF, 4D-Var). 3. Adaptive fidelity driven by the trust horizon. 4. \"Bring your foundation model, PINNeAPPle verifies it.\" 5. A \u2026"},{"n":341,"t":"Physics verification as a service: check any model's output against conservation laws and return a certificate","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Many teams already use AI surrogates without physics. A small service (library API + HTTP) that takes a model's output plus the problem description, and returns: \u00b7 the conservation residuals (mass, momentum, energy, charge) with where they fail; \u00b7 boundary-condition and positivity violations; \u00b7 the trust horizon or domain where the model's residual stays at its in-domain level; \u00b7 a certificate (JSON + PDF) with \u2026"},{"n":340,"t":"Agriculture: crop water stress from Sentinel-2 + ERA5 with a Penman-Monteith water balance","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Irrigation and yield depend on how much water the crop actually uses. Evapotranspiration comes from Penman-Monteith (radiation, temperature, humidity, wind from ERA5 or the weather model) times a crop coefficient that follows the canopy (NDVI from Sentinel-2). A soil water balance then tells when the crop enters stress. The physics gives a model that holds in seasons and regions without training data, and its \u2026"},{"n":339,"t":"Structural health monitoring: modal identification from video and audio, damage detection with temperature compensation","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Bridges, towers, wind-turbine blades and pipelines change their natural frequencies when damaged, but also with temperature and humidity. pinneappleperception already extracts vibration from audio (audiomodal) and motion from video (PIV / optical flow; phase-based motion magnification is a candidate). The physics question: is a frequency shift damage, an environmental effect or a sensor problem? Plan \u00b7 Modal \u2026"},{"n":338,"t":"Manufacturing: virtual metrology and process-drift monitoring (regime change vs sensor drift)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea This comes from the semiconductor discussion on the ensemble post. In a fab or process plant, operating conditions drift; a model that is good in one regime stops being reliable. The hard part is telling a real process drift from a slowly drifting sensor. Plan \u00b7 Virtual metrology: predict a quality measurement (thickness, critical dimension, yield) from process sensors with an ensemble of models (physics-based \u2026"},{"n":337,"t":"Batteries: physics-informed degradation and remaining useful life, with a trust horizon","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Battery ageing changes regime: SEI growth, then lithium plating or knee-point acceleration, temperature and C-rate changes. The sensors (voltage, current, temperature) drift and glitch. It is the same pair of questions \u2014 regime change or noise, and how far ahead the forecast can be trusted \u2014 on a problem with a clear industry need: EVs, storage and drones. Plan \u00b7 Models: \u00b7 an equivalent-circuit model with \u2026"},{"n":336,"t":"Drones as physical sensors: wind from flight data, aerial river PIV, spray drift and urban wind-aware planning","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea A drone is also a measuring instrument. Four uses that each reuse an existing PINNeAPPle piece: 1. The drone as an anemometer. Its tilt and motor commands while hovering or in cruise give the local wind through the dynamics model, without a wind sensor. Vertical profiles over a site feed the satellite nowcasting (#264) and wind-energy siting. Check against an anemometer mast or the ERA5/weather model. 2. Aerial \u2026"},{"n":335,"t":"Drones: flight safety with physics-verified dynamics (payload, gusts, motor degradation, sensor faults)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea A multirotor's dynamics change during a flight: a payload is picked up or dropped, gusts and ground effect act on it, a propeller is chipped, a motor degrades, the battery voltage sags. Its sensors also fail: GPS glitches, magnetometer interference, IMU vibration. Telling these apart in real time is what keeps a drone flying. It is the same problem as the ensemble's regime change versus sensor noise, with a \u2026"},{"n":334,"t":"Robotics: sim-to-real perception data with pinneapple_worldmodel and a robot digital twin in twin3d","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea pinneappleworldmodel already renders physics simulations into images and video with domain randomisation, and pinneappletwin3d shows a digital twin with sensors and operating envelopes in the browser. Together they can: \u00b7 generate labelled training data for a robot's perception (depth, flow, contact, deformation), with the physics known exactly; \u00b7 show the live robot next to its twin: the active dynamics model, \u2026"},{"n":333,"t":"Robotics: terrain traversability for field robots (vision + Bekker wheel-soil model)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Field robots (agriculture, mining, planetary rovers) get stuck because the soil changes. examples/usecases/terramechanics already has wheel-soil physics. Vision estimates the soil class and moisture ahead of the robot. The Bekker / Wong-Reece model predicts sinkage and slip for each patch, and the ensemble switches soil models when the measured slip leaves the predicted band. Steps 1. Terrain classification \u2026"},{"n":332,"t":"Robotics: system identification with Lagrangian and Hamiltonian networks, and transfer between robots","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Networks that learn a Lagrangian L(q, q\u0307) or a Hamiltonian H(q, p) respect energy and symmetries by construction. They learn dynamics from little data and extrapolate better than black-box networks. Transfer learning (pinneappleadaptation) then moves a model from one robot to a similar one with a few minutes of data. Steps 1. Pendulum, double pendulum and cart-pole with exact solutions; then MuJoCo arms. 2. \u2026"},{"n":331,"t":"Robotics: model predictive control with physics-verified model switching (MuJoCo)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea For a robot, knowing when its dynamics model stops being valid is a safety question: a new payload, contact, a slippery floor, a gust, or a failed sensor. The adaptive ensemble already does this for fields; here it does it for dynamics. \u00b7 Experts: \u00b7 the nominal rigid-body model; \u00b7 the same model with parameters identified online (mass, inertia, friction); \u00b7 a neural residual model trained on logged data; \u00b7 a \u2026"},{"n":330,"t":"Thermography inspection: inverse heat equation from IR images (defects, conductivity, thermal management)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea An infrared camera sees a surface temperature over time. The heat equation links it to what is inside: a delamination, a void, a change of conductivity, or a hot spot in a power module or an advanced package. A PINN or inverse solver with the IR frames as data recovers a map of the hidden property with uncertainty. The forward model can then say when a measured frame is physically inconsistent (reflections, \u2026"},{"n":329,"t":"River discharge from smartphone video: surface PIV + PINN with uncertainty","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Small rivers and streams have no gauging station. A short video from a bank or bridge already contains the surface velocity (large-scale PIV, LSPIV). A PINN that solves the open-channel flow completes the velocity below the surface and gives the discharge with an uncertainty. This matters for flood warning: the RS 2024 floods hit many ungauged streams. Steps 1. Surface velocity. pinneappleperception.videopiv \u2026"},{"n":328,"t":"Perception API: images and video as physical observations with uncertainty and provenance","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea pinneappleperception already turns images, video and audio into physics: PIV velocity fields, geometry from images and modal frequencies from audio. What is missing is one contract that the rest of the library can consume: Scope \u00b7 A PhysicalObservation dataclass: value, standard uncertainty, coordinates and times, units, provenance, and the failed checks. \u00b7 Adapters for the existing PIV (video), image-geometry \u2026"},{"n":327,"t":"Roadmap: new application areas where physics tells when to trust the model","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":27,"a":false,"x":"Why PINNeAPPle's edge is not only predicting, but saying when a prediction can be trusted. It has three parts: \u00b7 the PDE residual flags a model that left its domain (PhysicsEnsemble(residuallookahead=..., residualbaseline=...)); \u00b7 the useful horizon of every forecast (pinneapplephysics.weather.evaluate); \u00b7 the physics check of the reading itself (measurementcheck), which separates sensor noise from a real regime \u2026"},{"n":324,"t":"Weather forecasting: improvements after the first trained model","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Ideas to pick up once #322 and #323 are done, in rough order of value. Measure each against the first trained model on the same 2020 cases. \u00b7 Finer grid. Use 128 x 64 (2.8 degrees), also on WeatherBench2. Events such as the 2024 RS floods and tropical cyclones are one or two cells wide on 64 x 32. It costs about 4x the training time; GPU recommended. \u00b7 Longer and richer rollouts. Add a 12-step phase (3 days) and \u2026"},{"n":323,"t":"Weather forecasting: evaluate the trained model, event GIFs and docs page","l":["priority: P1"],"m":"v0.9.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Context This follows #322 (trained model). examples/weatherforecasting/runusecases.py produces everything below from the trained checkpoint. It reuses data shipped in the repo, so nothing has to be fetched again: \u00b7 data/baselines2020.json: scores of persistence, climatology, IFS HRES, Pangu-Weather, Keisler and NeuralGCM on the 122 test forecasts of 2020. \u00b7 data/rsfloods202440.npy: ERA5 states of the 2024 Rio Grande \u2026"},{"n":322,"t":"Weather forecasting: finish training the ERA5 model (rollout phases 2, 4 and 8 steps)","l":["priority: P1"],"m":"v0.9.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Context pinneapplephysics.weather (PR #321) trains a global forecast model on ERA5 (WeatherBench2, 64 x 32 grid, public bucket). Training is split into phases of growing rollout length: 1, 2, 4 and 8 steps of 6 hours. Only phase 1 ran: 15,000 steps, about 2 h on 4 CPU cores, 2-day validation error 0.098. The cloud session that trained it is recycled when idle, so the rollout phases never ran, and those phases carry \u2026"},{"n":316,"t":"Dyson swarm design study: radiation, orbits, statites, structures, mass budget, infrared signature, Pareto front and 3-D scene","l":["enhancement","roadmap","priority: P3","effort: L","area: apps"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context A Dyson sphere (Dyson 1960, Science 131:1667) is a set of structures around a star that captures a large share of its output. It is speculative, but it is a good design-study prototype for the library: it brings together orbital dynamics, radiation, heat transfer, structures, materials budgets, multi-objective optimisation, surrogates, uncertainty and 3-D visualisation, and the infrared waste-heat signature \u2026"},{"n":315,"t":"Spherical Fourier Neural Operator (SFNO) with a torch spherical-harmonic transform, benchmarked against FNO on the sphere","l":["enhancement","roadmap","priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context Planar FNOs on latitude-longitude grids distort near the poles and are not rotation-equivariant on the sphere. The Spherical Fourier Neural Operator (Bonev et al. 2023, \"Spherical Fourier Neural Operators: Learning Stable Dynamics on the Sphere\", ICML, arXiv:2306.03838) replaces the FFT with the spherical-harmonic transform and gives stable long autoregressive rollouts of weather-like dynamics. PINNeAPPle \u2026"},{"n":314,"t":"Differentiable domain decomposition for the geophysics solvers: halo exchange, parallel spectral transform, ensembles","l":["enhancement","roadmap","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context 198 covers distribution in general (training, ensembles, sweeps). This issue is the solver side for the geophysics models: domain decomposition with halo exchange, kept differentiable so 4D-Var and training through the solver still work across processes. Scope 1. Decomposition: latitude bands (lat-lon and Gaussian grids), the 6 faces and sub-face tiles of the cubed sphere. 2. Halo exchange through \u2026"},{"n":313,"t":"GCM column physics behind one interface: gray radiation, moist convection, condensation, boundary layer, and learned parameterisations","l":["enhancement","roadmap","priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context A dynamical core alone runs dry, idealised climates. Realistic atmospheres need column physics: radiation, convection, condensation, boundary layer and surface fluxes. In Physics AI these schemes are also the main target for learned parameterisations (replacing or correcting a scheme with a network trained on high-resolution data), so they need a clean, swappable, differentiable interface. Scope 1. \u2026"},{"n":312,"t":"Dynamical cores for the 3-D atmosphere: hydrostatic spectral and cubed-sphere finite-volume, then non-hydrostatic","l":["enhancement","roadmap","priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context pinneapplesimulation.geophysics now has a spectral shallow-water model on the sphere with the Williamson et al. (1992) test cases. The next rung of the standard dynamical-core ladder is the 3-D atmosphere: hydrostatic primitive equations first, non-hydrostatic later. A differentiable 3-D core (PyTorch) is what makes the rest useful for Physics AI: 4D-Var through autograd \u2026"},{"n":305,"t":"Aircraft app: re-run the five airliner OpenFOAM cases with a stack of wake planes for the slice-position control","l":["priority: P3","effort: M","area: visualization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The studio viewer now steps through a stack of slices with a position slider (#281): slices that share a group form a stack, and pp.cfd.ExternalFlow samples cross-flow planes at 0.25, 0.5, 1.0 and 1.5 body lengths behind the body (wakeplanes=). The aircraft app (apps/aerooptimizer) uses the same viewer core, but its cached OpenFOAM results in model/cfd3d/.npz were produced before this change. They hold a \u2026"},{"n":299,"t":"When PINNs, when data-driven geometric surrogates: equal-budget benchmark and a method-choice guide","l":["priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-17","p":null,"s":0,"a":false,"x":"Context Physics-informed ML is often equated with PINNs. Industrial Physics-AI products mostly do something else: \u00b7 they generate many low-to-medium-fidelity simulations over a parameterised geometry; \u00b7 they train data-driven surrogates on meshes or point clouds; \u00b7 they optimise on top (MDO). PINNs have their own strong cases: inverse problems with sparse sensors (the Inverse Heat Lab), little or no simulation data, \u2026"},{"n":298,"t":"Generative inverse design: latent geometry models conditioned on target performance, checked by surrogate and solver","l":["priority: P3","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Beyond searching a fixed parameterisation, recent work learns the design space itself from a corpus of shapes: an autoencoder, or a diffusion model over point clouds, SDFs or meshes. New shapes ar
