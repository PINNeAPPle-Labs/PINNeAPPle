<style>
:root {
  --bg: #fbfaf5; --surface: #ffffff; --sunk: #f3f2ea; --fg: #1d2318; --muted: #5b6352; --faint: #8a8f80;
  --line: #e3e2d6; --accent: #c98a0b; --accent-ink: #7a5200; --accent-soft: #f6ead0; --leaf: #3f7d3a; --leaf-soft: #e3f0df;
  --p0: #b42318; --p1: #c4560c; --p2: #2b5fb4; --p3: #6b7280;
  --overlay: rgba(20, 24, 16, 0.35);
  --nav-w: 280px; --toc-w: 240px; --top-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12150f; --surface: #181c14; --sunk: #1d2219; --fg: #ecebdf; --muted: #a3a796; --faint: #7b8072;
    --line: #2b3124; --accent: #f0b43a; --accent-ink: #f6cf7c; --accent-soft: #3a2f14; --leaf: #8fcf7f; --leaf-soft: #1f3019;
    --p0: #ff8a80; --p1: #ffb26b; --p2: #8ab8f0; --p3: #a3a796;
    --overlay: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12150f; --surface: #181c14; --sunk: #1d2219; --fg: #ecebdf; --muted: #a3a796; --faint: #7b8072;
  --line: #2b3124; --accent: #f0b43a; --accent-ink: #f6cf7c; --accent-soft: #3a2f14; --leaf: #8fcf7f; --leaf-soft: #1f3019;
  --p0: #ff8a80; --p1: #ffb26b; --p2: #8ab8f0; --p3: #a3a796;
  --overlay: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h) + 12px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
code, .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
h1, h2, h3 { font-family: Fraunces, Georgia, serif; line-height: 1.2; text-wrap: balance; }
button { font: inherit; color: inherit; }

.top { position: sticky; top: 0; z-index: 30; height: var(--top-h); display: flex; align-items: center; gap: 10px;
  padding-inline: 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.burger { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.burger svg { width: 18px; height: 18px; }
.burger[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--fg); white-space: nowrap; }
.brand b { font: 600 1.05rem Fraunces, Georgia, serif; }
.brand span { color: var(--muted); font-size: 0.85rem; }
.search { flex: 1; max-width: 460px; margin-left: auto; position: relative; min-width: 0; }
.search input { width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px 0 34px; font: inherit; color: var(--fg); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search svg { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; color: var(--faint); }

.layout { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--toc-w); }
.nav, .toc { position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; }
.nav { border-right: 1px solid var(--line); padding: 14px 10px 40px; background: var(--bg); }
.toc { border-left: 1px solid var(--line); padding: 20px 16px 40px; }
main { min-width: 0; padding: 28px clamp(16px, 4vw, 44px) 80px; }
.page { max-width: 880px; margin: 0 auto; }
.overlay { display: none; }

.nav h4, .toc h4 { margin: 18px 8px 6px; font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.toc h4 { margin: 0 0 10px; }
.nav h4:first-child { margin-top: 2px; }
.nav a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); font-size: 0.9rem; }
.nav a span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav a .ct { color: var(--faint); font-size: 0.78rem; font-variant-numeric: tabular-nums; flex: none; }
.nav a:hover { background: var(--sunk); }
.nav a.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nav details summary { list-style: none; cursor: pointer; }
.nav details summary::-webkit-details-marker { display: none; }
.nav details summary h4 { display: flex; justify-content: space-between; align-items: center; }
.nav details summary h4::after { content: "+"; font-size: 0.9rem; }
.nav details[open] summary h4::after { content: "–"; }
.toc a { display: block; padding: 4px 0 4px 10px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; font-size: 0.85rem; line-height: 1.35; }
.toc a:hover { color: var(--fg); }
.toc a.on { color: var(--accent-ink); border-left-color: var(--accent); }
.toc ol { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.82rem; display: grid; gap: 6px; }
.toc .steps { margin-top: 26px; }

.eyebrow { font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 6px 0 8px; }
.lede { font-size: 1.08rem; color: var(--muted); margin: 0 0 18px; max-width: 42em; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); margin-bottom: 18px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); }
.note { font-size: 0.8rem; color: var(--faint); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 22px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.filters label { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.filters select { height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 0.82rem; padding: 0 6px; }
.chip { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 0.8rem; }
.chip[aria-pressed="true"] { background: var(--leaf-soft); border-color: var(--leaf); color: var(--fg); }
.filters .reset { margin-left: auto; font-size: 0.8rem; background: none; border: 0; color: var(--accent-ink); cursor: pointer; text-decoration: underline; }

h2 { font-size: 1.35rem; margin: 36px 0 10px; display: flex; align-items: baseline; gap: 10px; }
h2 .ct { font: 500 0.85rem Inter, sans-serif; color: var(--faint); }
.group-intro { color: var(--muted); font-size: 0.9rem; margin: -4px 0 12px; max-width: 64ch; }
.list { display: grid; gap: 8px; }
.issue { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.issue > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
.issue > summary::-webkit-details-marker { display: none; }
.issue[open] > summary { border-bottom: 1px solid var(--line); }
.issue .num { font: 500 0.82rem "JetBrains Mono", monospace; color: var(--faint); padding-top: 2px; }
.issue .ttl { font-weight: 500; overflow-wrap: anywhere; }
.issue .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.75rem; color: var(--muted); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 0.72rem; white-space: nowrap; }
.tag.p0 { border-color: var(--p0); color: var(--p0); } .tag.p1 { border-color: var(--p1); color: var(--p1); }
.tag.p2 { border-color: var(--p2); color: var(--p2); } .tag.p3 { border-color: var(--p3); color: var(--p3); }
.tag.easy { background: var(--leaf-soft); border-color: var(--leaf); color: var(--fg); }
.tag.rel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.issue .body { padding: 10px 14px 12px; font-size: 0.9rem; }
.issue .body p { margin: 0 0 10px; color: var(--muted); max-width: 70ch; }
.issue .links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.85rem; }
.kids { margin: 8px 0 0 0; padding: 8px 0 0; border-top: 1px dashed var(--line); font-size: 0.85rem; }
.kids a { display: block; text-decoration: none; padding: 2px 0; }
.kids a span { color: var(--faint); font-family: "JetBrains Mono", monospace; font-size: 0.78rem; margin-right: 6px; }
.empty { color: var(--muted); padding: 24px 0; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-bottom: 8px; }
.cards a { display: grid; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--fg); }
.cards a:hover { border-color: var(--accent); }
.cards b { font-family: Fraunces, Georgia, serif; }
.cards small { color: var(--muted); line-height: 1.4; }
.cards .ct { font-size: 0.75rem; color: var(--faint); }
.how { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); counter-reset: s; }
.how div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 0.88rem; color: var(--muted); }
.how div b { display: block; color: var(--fg); margin-bottom: 4px; }
.how div b::before { counter-increment: s; content: counter(s) ". "; color: var(--accent-ink); }
.how code { font-size: 0.8rem; background: var(--sunk); padding: 0 4px; border-radius: 4px; }
.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 0.8rem; }

@media (max-width: 1240px) {
  .layout { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  .toc { position: fixed; right: 0; top: var(--top-h); z-index: 25; width: min(300px, 86vw); background: var(--bg);
    transform: translateX(100%); transition: transform .2s ease, visibility .2s; visibility: hidden; }
  body.toc-open .toc { transform: none; visibility: visible; box-shadow: -12px 0 30px rgba(0,0,0,.12); }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; left: 0; top: var(--top-h); z-index: 25; width: min(320px, 88vw); transform: translateX(-100%);
    transition: transform .2s ease, visibility .2s; visibility: hidden; }
  body.nav-open .nav { transform: none; visibility: visible; box-shadow: 12px 0 30px rgba(0,0,0,.12); }
  .brand span { display: none; }
}
@media (max-width: 1240px) { body.nav-open .overlay, body.toc-open .overlay { display: block; position: fixed; inset: var(--top-h) 0 0 0; z-index: 20; background: var(--overlay); } }
@media (min-width: 901px) { body.nav-open .overlay { display: none; } body.nav-open.toc-open .overlay { display: block; } }
@media (min-width: 1241px) { #toc-btn { display: none; } }
@media (max-width: 560px) { .filters .reset { margin-left: 0; } }
</style>

<script>
let SNAP = {"repo":"PINNeAPPle-Labs/PINNeAPPle","taken":"2026-11-07 14:16 UTC","issues":[{"n":1481,"t":"[E10] Workflow and experiment observability: structured run events and pp runs why","l":["priority: P1","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context A workflow run already has resume, retries and a run directory (pinneapplecore/workflows/engine.py), and the record on disk is enough to continue a run but not to explain one. When a step fails at 03:00 the operator gets a run directory and has to reconstruct: which step, which command, which retry, what the solver printed in its last twenty lines, how long it took, how much memory it used. The Flows and the \u2026"},{"n":1480,"t":"[E9] Reproducible execution from an experiment id","l":["priority: P1","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context 29 defines what an experiment records and #224/#199 define where the artifacts and their lineage live. Neither closes the loop: given an experiment id from six months ago, there is no way to re-run it and be told whether you just reproduced it or ran something else. The failure mode this prevents is quiet: a re-run on a newer package produces different metrics, and nothing in the output says the environment \u2026"},{"n":1479,"t":"[E8] Kubernetes and cloud batch executors behind the existing executor contract","l":["priority: P1","effort: M","area: ecosystem","hpc"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context The workflow engine can already hand a step to local, docker or slurm (pinneapplecore/workflows/executors.py), and registerexecutor() is the documented way to add another. The first thing anyone with a cluster asks for is neither: it is a Kubernetes cluster or a cloud batch service, because that is what the rest of their stack runs on. The executor interface is already the right seam \u2014 cwd, env, timeout, \u2026"},{"n":1478,"t":"[E7] One catalogue facade over the five list_models()","l":["priority: P1","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context There is no single catalogue today \u2014 there are five, and they do not know about each other. Measured on main: | Call site | What it lists | |---|---| | pinneapple/init.py:156 and :167 | the pp.listmodels facade, two branches | | pinneappleregistry/gatewayapi.py:77 | models registered with the gateway | | pinneappletools/benchmarksuite/benchmark.py:1306 | models the benchmark can run | | \u2026"},{"n":1477,"t":"[E6] One model provider interface (PyTorch, JAX, ONNX, TorchScript, PhysicsNeMo, Hugging Face)","l":["priority: P1","effort: M","area: ecosystem","interop"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context Models reach the library by several doors: pp.zoo, pinneapplehub (frompretrained), pinneappleneural for architectures built here, export through pinneappletools/modelexport, and whatever a neighbouring framework hands over \u2014 PyTorch checkpoint, JAX pytree, ONNX graph, TorchScript, PhysicsNeMo module, a Hugging Face repo. Each door has its own loading convention and its own way of reporting failure, and a \u2026"},{"n":1476,"t":"[E5] One solver interface for external solvers (OpenFOAM, CalculiX, FEniCSx, ANSYS, COMSOL, MATLAB)","l":["priority: P1","effort: L","area: solvers","interop"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context External solvers are already integrated \u2014 OpenFOAM and CalculiX as workflow adapters (pinneapplecore/workflows/adapters.py), the rest through pinneapplesimulation/externalsolvers \u2014 but each brings its own setup path: its own case layout, its own health check, its own log parsing, its own idea of what \"finished\" means. Adding a fourth solver means reading the third one's code. The gap is not coverage, it is \u2026"},{"n":1475,"t":"[E4] Plugin trust policy: what loading a plugin does and does not guarantee","l":["priority: P2","effort: S","area: ecosystem"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context An installed plugin is Python code that runs with the privileges of whoever imports it. There is no isolation to add later without a separate process or container, and a plugin subprocess is not a sandbox either. The risk that is worth designing for now is different: silently loading a version that no longer matches the contract, or a package that claims capabilities it does not have. The dangerous outcome \u2026"},{"n":1474,"t":"[E3] Plugin diagnostics: list, inspect, doctor, enable, disable","l":["priority: P1","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context Once plugins come from installed packages, the failure modes stop being visible in the source tree: a dependency missing from the environment, an executable that is not on PATH, a contract version that no longer matches, an entry point that resolves but raises on import. Today pp doctor diagnoses the installation (pinneapplecheck/cli.py, the pinneapple console script) and knows nothing about extensions. The \u2026"},{"n":1473,"t":"[E2] Capability-based plugin lookup: find a component by what it can do","l":["priority: P0","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context 100 gets a third-party solver into a registry and #200 defines that registry, but both are keyed by name. A workflow then has to know the name in advance, which is the same coupling the plugin system was meant to remove: the moment a second CFD plugin exists, every workflow that hard-codes \"openfoam\" becomes wrong for the case it is actually suited to. Today lookup is exact-match on a single key: \u2026"},{"n":1472,"t":"[E1] Plugin contract and lifecycle: what an installed package must implement","l":["priority: P0","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-11-06","up":"2026-11-06","p":null,"s":0,"a":false,"x":"Context 100 defines the discovery mechanism (pinneapple.plugins entry-point group) and #200 the registry protocol, but neither says what a discovered object is. Today the only extension point is in-process and undocumented as such: registeradapter() in pinneapplecore/workflows/adapters.py:274 fills the module-level ADAPTERS dict at import time, and registerexecutor() does the same for executors. A third party can \u2026"},{"n":1464,"t":"Joule\u2013Thomson CFD: OpenFOAM rhoSimpleFoam with PengRobinsonGas through an orifice or valve passage, ideal-gas vs real-gas runs checked against the isenthalpic value","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":null,"s":0,"a":false,"x":"Follow-up of #1463. #1463 gives the thermodynamic answer of throttling: the outlet temperature by GERG-2008, Peng\u2013Robinson, SRK and the ideal gas, and a check of a CFD outlet temperature. This issue adds the CFD itself, so a user sees in a resolved flow why an ideal-gas setup shows no Joule\u2013Thomson cooling, and what a correct setup gives. Scope \u00b7 Case: a compressible steady RANS case in OpenFOAM (rhoSimpleFoam, or \u2026"},{"n":1458,"t":"F8: case-study export from the evidence record (Problem \u2192 Approach \u2192 What worked / what didn't \u2192 Outcome)","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1450,"s":0,"a":false,"x":"Part of #1450. Why Forward-deployed and Physics AI roles judge work by a project write-up in a fixed shape. Intelimek asks for exactly \"Problem \u2192 Approach \u2192 What worked / didn't \u2192 Outcome\", and the Luminary, PSI and NVIDIA solutions roles ask for technical demos and customer reports. The library records everything such a write-up needs: \u00b7 the request, the formulation, the steps, the checks and the verdicts; \u00b7 the \u2026"},{"n":1457,"t":"F7: scaling-law harness for physics models (model size \u00d7 data \u00d7 compute), fitted power laws with intervals","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1450,"s":0,"a":false,"x":"Part of #1450. Why Mistral's physics-models role asks for \"scaling behavior\" of physics foundation models. PhysicsX and UniversalAGI build large physics models, and the LPM epic (#1412) needs to know when a bigger model or more data pays. #1433 covers one axis: the multi-fidelity budget mix. Nothing in the library runs a controlled sweep over model size, data and compute and fits the laws. Proposal \u2026"},{"n":1456,"t":"F6: feature-scale etch and deposition profile evolution (level set, flux models) and a surrogate of the profile","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1450,"s":0,"a":false,"x":"Part of #1450. Why Applied Materials (Physics AI scientist) and Mistral (physics models for semiconductor engineering) need surrogates of process steps. The library covers lithography and OPC (pinneappleflow litho flow, pinneapplephysics). It does not cover the next steps, etch and deposition, where feature-scale profile simulation is the standard tool. Scope \u00b7 A 2-D level-set profile evolution of a trench or via \u2026"},{"n":1455,"t":"F5: interconnect S-parameter surrogates with physics checks (passivity, causality, reciprocity), Touchstone in and out","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1450,"s":0,"a":false,"x":"Part of #1450. Why Molex (simulation R&D and ML engineer), Luminary (electromagnetics FDE) and EMA3D build surrogates of frequency-domain EM responses. Each surrogate maps connector, trace or package geometry to S-parameters. A surrogate that is accurate but not passive or causal breaks the downstream circuit simulation: these are the physics checks such a model must pass. The library has EM solvers \u2026"},{"n":1454,"t":"F4: full-waveform inversion workflow (2-D acoustic): differentiable wave solver, neural reparameterisation, OpenFWI benchmark","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1450,"s":0,"a":false,"x":"Part of #1450. Why SLB's FWI and AI scientist role asks for physics-informed ML, learned solvers and neural surrogates for seismic inversion, and it is one of the larger industrial markets for PDE-constrained inversion. The library has seismic datasets in pinneapplearena and a geophysics area issue (#1074). It has no FWI workflow. Scope \u00b7 A 2-D acoustic wave solver (finite differences, PML absorbing boundaries) in \u2026"},{"n":1453,"t":"F3: credibility assessment per context of use (NASA-STD-7009A, ASME V&V 40) as an executable VeriPhysics report","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1450,"s":0,"a":false,"x":"Part of #1450. Why Blue Origin (Physical AI, V&V and safety), Honeywell Aerospace and Eli Lilly deploy models into regulated or safety-relevant decisions. There, the question is not only \"is the error small?\" but \"is the evidence sufficient for this use?\". \u00b7 docs/guides/validationmethodsreference.md already explains NASA-STD-7009A and ASME V&V 40 (rigour scales with model risk, within a context of use). \u00b7 The \u2026"},{"n":1452,"t":"F2: learned multigrid components (smoother, prolongation) inside a geometric multigrid, with measured iteration savings and grid transfer","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1450,"s":0,"a":false,"x":"Part of #1450. Why The NVIDIA role on AI-native numerical methods, Periodic Labs and Unconventional AI ask for hybrid numerical/ML solvers: AI-guided multigrid and learned components inside classical solvers. Their accuracy guarantee comes from the solver, and their speed from the learned part. The library has learned preconditioners (pinneapplesimulation) and solver-in-the-loop issues (#584, #585). It has no \u2026"},{"n":1451,"t":"F1: Abaqus and Simcenter STAR-CCM+ campaign drivers (case from parameters, run, results to a dataset), licence-gated","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1450,"s":0,"a":false,"x":"Part of #1450. Why Mistral (physics models), Eli Lilly (SciML), Trane and Honeywell list Abaqus and STAR-CCM+ next to OpenFOAM as the solvers their campaigns use. The library reads STAR-CCM+ exports (pinneapplesimulation.externalsolvers.cfdformats.starccmreader) and has Abaqus mentions in preflight and rendering. It cannot drive either solver from a parameter set, as it does for OpenFOAM and CalculiX. Scope \u00b7 \u2026"},{"n":1450,"t":"Epic: feature map from the Physics AI job market, round 2 (2026-11-05): what PINNeAPPle has, what to improve, what is missing","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":null,"s":8,"a":false,"x":"Context This is a second round on top of #1263, built from a new set of open Physics AI / SciML / CAE roles: \u00b7 Large AI labs and platforms: Mistral AI (physics models), Physical Superintelligence, NVIDIA (PhysicsNeMo CAE, AI-native numerics, Warp, simulation performance, industrial solutions architecture), Luminary Cloud (FDE CFD / applied AI / FEA / EM / meshing), PhysicsX, Dassault Syst\u00e8mes (SIMULIA AI physique). \u2026"},{"n":1449,"t":"Pilots P6: deployment runner for live twins (long-running service, scheduler, store-and-forward, health, restart without losing the ledger)","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1441,"s":0,"a":false,"x":"Part of #1441. Problem The library's twin workflow runs as a script, and a pilot runs for weeks. It needs: \u00b7 a service that keeps ingesting while the network or the broker drops; \u00b7 a restart that loses nothing; \u00b7 an alert on silence; \u00b7 a page someone can open. Proposal Add pinneapplesystems.digitaltwin.service (name to confirm), packaged as a container: \u00b7 Scheduler: per-pilot jobs (ingest, predict, match, score, \u2026"},{"n":1448,"t":"Pilots P5: champion / challenger update policy (recalibrate parameters vs retrain the residual), promotion decided by the live ledger","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1441,"s":0,"a":false,"x":"Part of #1441. Depends on P0. Problem \"Collect data in real time and improve the model\" needs a rule for what changes, when, and who decides that the new model is better. Without one, a retrained model can silently get worse, or overfit the last week. Proposal \u00b7 Two kinds of update, handled differently: \u00b7 recalibration: the slow physical parameters move, assimilated online (EnKF, already in the library). No new \u2026"},{"n":1447,"t":"Run PICT for real on an NVIDIA GPU: layout check, Ghia on the same grids, and a differentiable run","l":["enhancement"],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":null,"s":0,"a":false,"x":"Tracked separately from #1440 (which covers Warp and Newton on CUDA) because this one is the only item that needs hardware nobody here has: PICT is CUDA-only, and the bridge in #1439 was written against its source, not against a run. Until this issue closes, no PICT number exists in this repository \u2014 only the local engine's numbers, which are labelled as such. To be done later, when a machine with an NVIDIA GPU is \u2026"},{"n":1446,"t":"Pilots P4: pump and pipe-loop fault diagnosis on a water loop (physics residuals), scored on staged faults","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1441,"s":0,"a":false,"x":"Part of #1441. Depends on P0 (the ledger). Why Fault detection is the most common first use of a physics twin in industry. Its value is easy to state: earlier detection, and fewer false alarms than threshold rules. pinneapplesystems.digitaltwin.pipeloop already has the plant model, the diagnosis and the report, and they have only been run on simulated plants. This pilot measures them on real hardware. Rig (listed \u2026"},{"n":1445,"t":"Pilots P3: surrogate service with an applicability gate and solver spot checks, the live error feeding the next training data","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1441,"s":0,"a":false,"x":"Part of #1441. Depends on P0 (the ledger). Why A surrogate is only worth deploying if its error on the requests people actually make is known. The solver gives that truth within minutes. The #1438 demo showed the pattern: \u00b7 a request outside the validated design space is rejected; \u00b7 the design space is extended with new solver data; \u00b7 the request is then accepted, and its error is measured against the solver. This \u2026"},{"n":1444,"t":"Pilots P2: thermal virtual sensor on a bench rig (cooled part twin + EnKF), held-out thermocouple and staged faults","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1441,"s":0,"a":false,"x":"Part of #1441. Depends on P0 (the ledger). Why Thermal is the cheapest physical system to instrument, the truth arrives every second, and the library already has the model: \u00b7 pinneapplesystems.digitaltwin.cooledpart: a 3-D twin of a part with cooling passages, built from its STL; \u00b7 digitaltwin.workflow.thermalplant, with EnKF assimilation of states and slow parameters, NIS/NEES, CUSUM drift and recalibration. The \u2026"},{"n":1443,"t":"Pilots P1: river discharge nowcast on live public USGS data (gray-box + adaptive conformal), the whole loop with no hardware","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1441,"s":0,"a":false,"x":"Part of #1441. Depends on P0 (the ledger). Why this pilot first It needs no hardware and no client data. The truth arrives every 15 minutes from the gauge itself. pinneapplesystems.digitaltwin.io.usgs already reads the public USGS feed. The pilot therefore exercises every production piece on real data, live: \u00b7 ingestion; \u00b7 latency budget; \u00b7 prediction with intervals; \u00b7 ledger; \u00b7 drift; \u00b7 retraining; \u00b7 report. Scope \u2026"},{"n":1442,"t":"Pilots P0: live evaluation ledger (prediction log \u2192 truth matching \u2192 prequential scores vs baselines, pre-registered promotion and kill rules)","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":1441,"s":0,"a":false,"x":"Part of #1441. Problem A model in production is judged today, if at all, by its offline test set. Nothing in the library records each live prediction, waits for its truth and scores it. Proposal Add pinneapplesystems.digitaltwin.ledger (name to confirm): \u00b7 Log. Each prediction is logged with: \u00b7 its interval; \u00b7 the model id and version; \u00b7 the inputs' hash, the request time and the target time; \u00b7 the applicability \u2026"},{"n":1441,"t":"Epic: Physics AI in production on live data: shadow-mode pilots that measure whether the models work","l":[],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":null,"s":7,"a":false,"x":"Goal Put a few PINNeAPPle models into production now, collect real data as it arrives, improve the models with it, and measure whether they work: live, against baselines and with pre-registered criteria, not from a single test set. Choosing the pilots A model is a pilot now when four things hold: 1. The truth arrives soon, in minutes to hours, so every prediction gets scored. 2. It runs open loop: it advises, logs \u2026"},{"n":1440,"t":"GPU validation pending: Newton, Warp (float32 and float64) and PICT are untested on CUDA","l":["enhancement"],"m":null,"c":0,"cr":"2026-11-05","up":"2026-11-05","p":null,"s":0,"a":false,"x":"Everything in #1439 was verified on a CPU-only machine (Apple Silicon). The CUDA paths of every engine are therefore untested, and this issue is the checklist for the first machine with an NVIDIA GPU. Nothing here should be closed by reading the code: each line asks for a number that was measured. Warp (pinneappletools.computebackends.warpbackend, extra pinneapple[warp]) \u00b7 warpavailable() reports True with \u2026"},{"n":1437,"t":"LPM L15: component LPMs for complex multiphysics components (per component), starting with electric motors (#967)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. Why Feedback received on the LPM direction: \"I would say per component at least. e-motors for example are very complex components with multi-physics needs. If someone would create such a thing it would be a great value.\" This adds a second granularity to #1412, next to the physics family: the engineering component. A component LPM covers one class of component across all the physics that decide its \u2026"},{"n":1436,"t":"Emmi 8/8: Noether bridge upkeep (licence re-check after the Mistral acquisition, version pin, CI, docs)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1428,"s":0,"a":false,"x":"Part of #1428. What \u00b7 Licence: \u00b7 re-read the licence file in the Noether repository and the licences of the released weights; the sources name it differently (\"Emmi Open Research License\", \"Non-Production License based on Mistral's MNPL\"); \u00b7 record in pinneappleneural.licencas the exact name, version and URL; \u00b7 re-check after the announced acquisition by Mistral AI; \u00b7 keep the bridge research only, refused under \u2026"},{"n":1435,"t":"Emmi 7/8: public automotive and aerospace surrogate benchmarks (DrivAerML, AhmedML, transonic wing) as #1380 problems","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1428,"s":0,"a":false,"x":"Part of #1428. It adds two problems to the benchmark v2 epic #1380, as P15 and P16, in the same format as P01\u2013P14. P15: 3-D automotive aerodynamics (AhmedML, DrivAerML) \u00b7 Data: the public high-fidelity datasets AhmedML and DrivAerML (Ashton et al.), with their licences checked and their official splits if given. Start with AhmedML, which is smaller, and a DrivAerML subset sized for the hardware. \u00b7 Players: \u00b7 \u2026"},{"n":1434,"t":"Emmi 6/8: neural surrogate for CFD\u2013DEM particle-laden and granular flows (NeuralDEM-style)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1428,"s":0,"a":false,"x":"Part of #1428. Emmi presents NeuralDEM (2024) as an end-to-end deep-learning alternative to coupled CFD\u2013DEM multiphysics simulations. PINNeAPPle has particle and granular pieces (pinneapplesimulation.particledynamics, geompm), but no learned surrogate for coupled fluid\u2013particle flows. What \u00b7 Data: \u00b7 generate CFD\u2013DEM cases with an open-source coupled solver; choose and pin it in this issue, for example a DEM code \u2026"},{"n":1433,"t":"Emmi 5/8: multi-fidelity scaling laws for neural surrogates (budget versus fidelity mix), reproduced on PINNeAPPle data","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1428,"s":0,"a":false,"x":"Part of #1428. It builds on the multi-fidelity datasets of #1393 and LPM L09 (#1422). Reference Setinek, Galletti and Brandstetter, \"Towards Multi-Fidelity Scaling Laws of Neural Surrogates in CFD\" (arXiv:2511.01830, NeurIPS 2025). As described by the paper: \u00b7 the dataset axis of scaling laws is split into the compute budget and the mix of low- and high-fidelity RANS cases; \u00b7 the fidelity is varied through the \u2026"},{"n":1432,"t":"Emmi 4/8: surrogate inference directly from CAD (STEP / B-rep), without a volume mesh","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1428,"s":0,"a":false,"x":"Part of #1428. Emmi describes AB-UPT as supporting inference directly from CAD geometry, without a meshed simulation input (company claim). PINNeAPPle already imports STEP as exact B-rep (#1114, #1115) and has a geometry interface planned in LPM L02 (#1415). What \u00b7 From a STEP file to model inputs, with no CFD mesh: \u00b7 sample points on the B-rep faces, with normals, curvature and face type from #1117; \u00b7 sample volume \u2026"},{"n":1431,"t":"Emmi 3/8: divergence-free and conservative output heads for flow surrogates (measured)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1428,"s":0,"a":false,"x":"Part of #1428. AB-UPT reports a divergence-free formulation that keeps vorticity predictions physically consistent (arXiv:2502.09692). This issue is the flow-specific part of LPM L10 (#1423). What Output heads that satisfy the physics by construction, for any point-based surrogate: \u00b7 Divergence-free velocity, for example by predicting a vector potential \u03c8 with u = \u2207 \u00d7 \u03c8, so \u2207\u00b7u = 0 exactly, through autograd at the \u2026"},{"n":1430,"t":"Emmi 2/8: scaling surrogates to very large meshes (memory-bounded training and inference, streaming mesh I/O)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1428,"s":0,"a":false,"x":"Part of #1428. Emmi's news page claims AB-UPT is trained and executed on meshes above 100 million cells on one GPU. That claim is not verified here. This issue gives PINNeAPPle the machinery to measure how far it can go. What \u00b7 Training on random point subsets: each step samples points from the surface and the volume, never the whole mesh, and the loss accounts for the sampling. \u00b7 Chunked inference: query points are \u2026"},{"n":1429,"t":"Emmi 1/8: native anchor-token, branched transformer surrogate (clean-room, under the library licence)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1428,"s":0,"a":false,"x":"Part of #1428. Why Today the only route to AB-UPT-style models in PINNeAPPle is the Noether bridge, which is research only. A native implementation of the published ideas would make large-mesh surrogates usable without that restriction. What Implement from the papers, without reading or copying Noether code (UPT, arXiv:2402.12365; AB-UPT, arXiv:2502.09692): \u00b7 geometry encoding into a reduced set of latent geometry \u2026"},{"n":1428,"t":"Epic: lessons from Emmi AI (AB-UPT, NeuralDEM, multi-fidelity scaling): large-mesh surrogates, CAD-direct inference, CFD\u2013DEM","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":8,"a":false,"x":"Context Emmi AI (Linz; a spin-out of Johannes Kepler University Linz) builds physics-AI surrogates for industrial engineering. emmi.ai could not be fetched from this environment, so the points below come from its public papers and pages found by search. Company figures are the company's claims, not measured here. \u00b7 AB-UPT, Anchored-Branched Universal Physics Transformers (arXiv:2502.09692, Alkin et al., TMLR 2025): \u2026"},{"n":1427,"t":"LPM L14: pilot family LPMs built along all the axes (external aero 2-D, conjugate heat, free surface)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. It brings L00\u2013L11 together on real families, using the data of #1389 and the benchmark problems of #1380. Pilots, in order 1. Incompressible external aerodynamics in 2-D: airfoils from AirfRANS (#1408) plus PINNeAPPle-generated shapes. \u00b7 Axes: Re and angle of attack, geometry, discretisation, output fields and forces, inverse design. 2. Conjugate heat transfer: the finned heat sink (#1404) plus \u2026"},{"n":1426,"t":"LPM L13: coupling family LPMs for multiphysics (interfaces, partitioned iteration)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. It reuses the multiphysics coupling workflow (#1209). What Instead of one model for all couplings, compose family LPMs, for example a fluid LPM with a solid LPM for fluid\u2013structure interaction, or a flow LPM with a conduction LPM for conjugate heat transfer. \u00b7 Interface contract: the interface fields each LPM gives and takes (traction and displacement, temperature and heat flux), on the shared \u2026"},{"n":1425,"t":"LPM L12: cross-family pretrained backbone versus per-family training (measured)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. Question Does pretraining one backbone on many families help each family LPM, compared with training each family from scratch at equal compute? Multi-physics PDE foundation models suggest it can, for example multiple-physics pretraining (McCabe et al.), DPOT (Hao et al.) and Poseidon (Herde et al.). This has to be measured on our families and our axes. What \u00b7 Pretrain one backbone on several families \u2026"},{"n":1424,"t":"LPM L11: validity domain: uncertainty, OOD per axis, abstention, few-shot fine-tuning","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. It extends what pinneappleneural.lpm already has (ensemble uncertainty, geometry-code OOD, fine-tuning). What \u00b7 Uncertainty on every prediction: deep ensembles, conformal calibration (as in #1378) and variance per query point. The calibration is measured on every L00 split. \u00b7 OOD detection per axis: a score for each axis of #1412 (parameters, geometry, boundary conditions, loads, law, discretisation), \u2026"},{"n":1423,"t":"LPM L10: symmetries and physics constraints for generalisation, with measured effect","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. What Build in the structure that should make a family LPM generalise: \u00b7 symmetries: translation, rotation and reflection equivariance (E(n)-equivariant layers, or frame averaging), Galilean invariance where it holds, and scale invariance through L01; \u00b7 conservation: \u00b7 divergence-free outputs for incompressible flow, for example through stream functions or projection; \u00b7 conservative flux-form layers; \u00b7 \u2026"},{"n":1422,"t":"LPM L09: multi-fidelity and multi-source training (solvers, fidelities, experiments)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. It uses the multi-fidelity datasets of #1393. What Train one family LPM on data from several sources, each tagged with its source and fidelity: \u00b7 different solvers; \u00b7 coarse and fine meshes; \u00b7 simplified and full models; \u00b7 experiments with their measurement uncertainty. Options to compare: \u00b7 a fidelity token; \u00b7 residual (correction) heads; \u00b7 a likelihood weighted by each source's known error. Measure \u2026"},{"n":1421,"t":"LPM L08: tasks and outputs: forward, inverse, assimilation, design through gradients; fields and quantities of interest","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. What The same trained family LPM serves several tasks: \u00b7 forward: inputs to fields; \u00b7 inverse: recover parameters, boundary conditions or sources from sparse, noisy observations, by gradient-based or Bayesian inversion through the model, with uncertainty (reusing the inverse workflow #1189); \u00b7 data assimilation: the LPM as the forecast model inside the digital-twin filter (#1193); \u00b7 design and \u2026"},{"n":1420,"t":"LPM L07: constitutive laws and materials as inputs","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. What Within a family, let the material law vary, not only its constants: \u00b7 fluids: Newtonian; power-law, Carreau or Bingham; the equation of state for compressible flow; \u00b7 solids: isotropic or orthotropic linear elasticity with any constants; hyperelastic models (neo-Hookean, Mooney\u2013Rivlin); plasticity as a separate, harder split; \u00b7 thermal: temperature-dependent conductivity. Encode the law as a \u2026"},{"n":1419,"t":"LPM L06: sources, loads and forcing fields as inputs","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. What Spatial or space-time inputs that drive the physics, as fields on any discretisation (L05): \u00b7 heat-source maps and power maps (chips, batteries); \u00b7 distributed and point loads, with their direction; \u00b7 body forces (gravity direction, rotation, electromagnetic forces); \u00b7 moving sources (a laser path, a moving load). Measure it Splits in L00: \u00b7 a load pattern not seen in training, for example a new \u2026"},{"n":1418,"t":"LPM L05: discretisation invariance (mesh, grid, point cloud and sensors, at input and output)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. What The same trained model accepts and returns fields on any discretisation: \u00b7 structured grids at any resolution; \u00b7 unstructured meshes (tetrahedral, hexahedral, polyhedral, as OpenFOAM writes them); \u00b7 point clouds; \u00b7 sparse sensor layouts. Implementation routes to compare: \u00b7 neural-operator style; \u00b7 graph and point-cloud encoders feeding a latent space, with a query decoder. Measure it Splits in \u2026"},{"n":1417,"t":"LPM L04: space and time: continuous queries, any horizon and step, steady and transient, 2-D and 3-D","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. What \u00b7 Continuous space-time queries: the model answers at any (x, t), not only on the training grid or at the saved times, for example with a neural-field decoder. \u00b7 Time: any horizon and step. \u00b7 Compare an autoregressive rollout, a direct time-conditioned prediction and a hybrid. \u00b7 Report how the error grows with the horizon (rollout stability, as in #1378). \u00b7 Steady and transient in one model where \u2026"},{"n":1416,"t":"LPM L03: boundary and initial conditions as inputs (type, location, value)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. Boundary conditions are a separate axis from the parameters. A model that only learned \"inlet velocity = 2 m/s on the left face\" cannot answer for an inlet on the top face, or for a heat flux instead of a fixed temperature. What \u00b7 Encode every boundary condition as data: \u00b7 the patch it applies to, as a set of surface points or faces; \u00b7 its type: Dirichlet, Neumann, Robin, periodic, wall function; \u00b7 \u2026"},{"n":1415,"t":"LPM L02: geometry and topology encoders (CAD/B-rep, mesh, point cloud, SDF)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. What One geometry input interface, however the user's geometry arrives: \u00b7 STEP / B-rep through the exact import of #1114, with face types and curvature as features; \u00b7 surface meshes (STL/OBJ), volume meshes, point clouds and signed distance fields (SDFs). Encoders to compare: \u00b7 the existing permutation-invariant geometry code of pinneappleneural.lpm; \u00b7 an SDF-on-grid encoder, as in GINO; \u00b7 point-cloud \u2026"},{"n":1414,"t":"LPM L01: physical parameters and regime: dimensionless conditioning and regime flags","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. What \u00b7 Condition the model on the dimensionless groups of the family (Re, Pr, Gr, Ma, Bi, Fo, Weber\u2026), computed with the library's Buckingham \u03c0 tools from the user's dimensional inputs. \u00b7 Two cases with the same groups must give the same dimensionless answer. A test checks this. \u00b7 Outputs are scaled back to the user's units. \u00b7 Also condition on the dimensional inputs when similarity is incomplete, for \u2026"},{"n":1413,"t":"LPM L00: evaluation protocol: generalisation matrix (held-out split per axis) and the LPM card","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1412,"s":0,"a":false,"x":"Part of #1412. This comes first: no axis is claimed without it. Generalisation matrix For a family dataset, build one held-out split per axis of #1412, each with an interpolation variant (inside the training ranges) and an extrapolation variant (outside them). Examples: \u00b7 parameters: Re above the training maximum; \u00b7 geometry: a shape family not seen in training; \u00b7 boundary conditions: an inlet at a new location; \u00b7 \u2026"},{"n":1412,"t":"Epic: Large Physics Models, one model per physics family, generic along every axis a user changes","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":16,"a":false,"x":"Position A Large Physics Model (LPM) here is one trained model per physics family at least, and one per engineering component for complex multiphysics components. It stands in for many simulations of that family or component. \u00b7 Physics family: for example incompressible external aerodynamics, conjugate heat transfer, free-surface flow, linear elasticity. \u00b7 Component: for example an electric motor. It needs \u2026"},{"n":1410,"t":"Benchmark problem P14: data assimilation and digital twin (Lorenz-96 and a thermal plant with drift)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Few PINN frameworks cover this problem, so the players come from the data-assimilation field. Problem \u00b7 Lorenz-96 (40 variables, F = 8): estimate the state from partial, noisy observations, with ensemble filters. \u00b7 Thermal plant with a parameter drift and a sensor fault: the digital-twin case of #1193 / #1255, fed with the synthetic sensor streams of #1395. \u00b7 Tasks: track the state, detect the drift, \u2026"},{"n":1409,"t":"Benchmark problem P13: stiff reaction\u2013diffusion (Allen\u2013Cahn, Gray\u2013Scott)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Problem \u00b7 1-D Allen\u2013Cahn: ut = 1e-4 uxx \u2212 5u\u00b3 + 5u, the standard hard PINN case with sharp interfaces. \u00b7 2-D Gray\u2013Scott pattern formation: autoregressive prediction over long horizons. Reference \u00b7 Allen\u2013Cahn: a fine spectral or ETDRK4 reference generated with #1389; \u00b7 Gray\u2013Scott: the corresponding dataset of The Well (official splits), or a PINNeAPPle-generated pseudo-spectral set. Players \u00b7 PINN \u2026"},{"n":1408,"t":"Benchmark problem P12: external aerodynamics, airfoil RANS (AirfRANS)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Problem 2-D incompressible RANS around NACA airfoils at varying angle of attack and Reynolds number. The task is to predict the velocity, pressure and turbulent viscosity fields on the mesh, and the force coefficients. Data AirfRANS (Bonnet et al. 2022), using its official tasks and splits (the \"full\" and \"scarce\" regimes, plus the extrapolation splits in Reynolds number and angle of attack). Players \u2026"},{"n":1407,"t":"Benchmark problem P11: inverse problems (Navier\u2013Stokes parameters from the cylinder wake; diffusion coefficient field)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. It extends v1 track C. Problem \u00b7 Raissi et al. (2019) cylinder wake: identify \u03bb1 and \u03bb2 of the Navier\u2013Stokes equations (true values 1 and 0.01) and recover the pressure, from scattered velocity data. Use the clean data and 1 % noise. \u00b7 Field inversion: recover a spatially varying diffusion coefficient \u03ba(x) in a 2-D steady diffusion problem, from sparse noisy measurements of u. Reference \u00b7 the \u2026"},{"n":1406,"t":"Benchmark problem P10: high-frequency Helmholtz and wave propagation (spectral bias)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. v1 has one Helmholtz case, where every framework failed at 2000 iterations. P10 makes frequency the axis. Problem \u00b7 2-D Helmholtz \u0394u + k\u00b2u = f with a manufactured solution, at wavenumbers k = 1, 4, 16 and 32; \u00b7 the 1-D wave equation over several periods. Reference The manufactured and exact solutions. Players PINNeAPPle, DeepXDE, PhysicsNeMo-Sym, PINA, TorchPhysics and jinns. \u00b7 Each runs its \u2026"},{"n":1405,"t":"Benchmark problem P09: linear elasticity, plate with a hole (Kirsch) and parametric cantilever","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Problem \u00b7 Plate with a hole: an infinite plate under uniaxial tension, on a finite domain with the Kirsch solution applied as traction. \u00b7 Parametric cantilever: length, thickness, load and Young's modulus, in 2-D plane stress and in 3-D. Reference \u00b7 the Kirsch analytic solution, including the stress concentration factor of 3 at the hole; \u00b7 for the cantilever, CalculiX FEM runs generated with #1389, \u2026"},{"n":1404,"t":"Benchmark problem P08: conjugate heat transfer in a finned heat sink (parametric)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Problem Steady conjugate heat transfer in a three-fin heat sink in a channel. This is the configuration of PhysicsNeMo-Sym's three-fin example, chosen so that each framework runs its own documented setup of the same physics. \u00b7 Parameters: fin height, fin thickness, inlet velocity and heat source power. \u00b7 Outputs: the temperature field, the maximum temperature and the pressure drop. Reference \u00b7 a \u2026"},{"n":1403,"t":"Benchmark problem P07: two-phase dam break with VOF (interFoam damBreak)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. This is the per-problem entry for the work already specified in #1375 (#1376\u2013#1379) and #1384. It does not duplicate them. Problem The OpenFOAM interFoam damBreak tutorial with parametric water columns. \u00b7 The input is the initial water column; the output is the rollout of alpha.water up to 1 s on a 64 \u00d7 64 grid. \u00b7 The reference rollout is the interFoam solution itself. Data \u00b7 the dataset of #1376, \u2026"},{"n":1402,"t":"Benchmark problem P06: shallow water and the single-phase dam break (Ritter / Stoker, PDEBench SWE)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Problem The 2-D shallow-water equations. \u00b7 Analytic check: the 1-D dam break on a dry bed (Ritter) and a wet bed (Stoker). The library already verifies these in testshallowwaterfv.py. \u00b7 Operator task: PDEBench 2-D shallow water (radial dam break), with official splits. Players \u00b7 Operator: PINNeAPPle, PhysicsNeMo FNO (and the swenonlinearpino physics-informed variant), neuraloperator, PDEBench \u2026"},{"n":1401,"t":"Benchmark problem P05: 2-D turbulence (Kolmogorov flow / incompressible Navier\u2013Stokes, autoregressive)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Problem 2-D incompressible Navier\u2013Stokes in vorticity form on a periodic domain, with Kolmogorov forcing, in a turbulent regime. The task is to predict the vorticity autoregressively. Data \u00b7 PDEBench 2-D incompressible NS, or the corresponding dataset of The Well, with official splits (chosen in #1381 by size); \u00b7 for a controlled resolution study, a PINNeAPPle pseudo-spectral reference generated with \u2026"},{"n":1400,"t":"Benchmark problem P04: flow past a cylinder (Sch\u00e4fer\u2013Turek 2-D benchmark, unsteady vortex shedding)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Problem The Sch\u00e4fer & Turek (1996) 2-D-2 case: unsteady channel flow past a cylinder at Re = 100 with periodic vortex shedding. Reference \u00b7 the benchmark quantities of the paper (Strouhal number, maximum drag and lift coefficients, pressure difference); \u00b7 a PINNeAPPle-generated OpenFOAM reference with a mesh and time-step convergence check (#1389); \u00b7 for the mesh-based surrogates, the DeepMind \u2026"},{"n":1399,"t":"Benchmark problem P03: steady incompressible flow, lid-driven cavity (Re 100, 1000) and Kovasznay flow","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Problem Steady 2-D incompressible Navier\u2013Stokes: \u00b7 the lid-driven cavity at Re = 100 and Re = 1000; \u00b7 Kovasznay flow at Re = 20, which has an exact solution. Reference \u00b7 the cavity: the centreline velocity tables of Ghia, Ghia & Shin (1982), plus a fine-mesh OpenFOAM icoFoam / simpleFoam run with a mesh-convergence check; \u00b7 Kovasznay: the exact solution (Kovasznay 1948). Players PINN forward with \u2026"},{"n":1398,"t":"Benchmark problem P02: 2-D Darcy flow with random permeability (operator learning)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. It extends v1 track B, which covers a single Darcy set. Problem \u2212\u2207\u00b7(a(x) \u2207u) = f on the unit square with u = 0 on the boundary. The task is to learn the map from the permeability a to the pressure u. Data \u00b7 PDEBench 2-D Darcy at one \u03b2, with the official splits; \u00b7 a PINNeAPPle-generated set (#1389) with log-normal Gaussian random field (GRF) permeability from grfsampler, at resolutions 64, 128 and 256, \u2026"},{"n":1397,"t":"Benchmark problem P01: 1-D viscous Burgers (shock formation)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Follow the protocol of #1381 and report through #1388. Problem ut + u ux = \u03bd uxx on x in [\u22121, 1], t in [0, 1], with u(x, 0) = \u2212sin(\u03c0x) and u(\u00b11, t) = 0. \u00b7 \u03bd = 0.01/\u03c0, the classic stiff case with a steep front; \u00b7 a \u03bd sweep over {0.1, 0.01, 0.001} for the operator variant. Reference \u00b7 the exact solution via the Cole\u2013Hopf transform, evaluated by quadrature on a fine grid; \u00b7 the operator variant: PDEBench \u2026"},{"n":1396,"t":"Synthetic data 7/7: published dataset suite (data cards, checksums, licences, regeneration commands)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1389,"s":0,"a":false,"x":"Part of #1389. Needs 1/7 and 2/7. Used by the benchmark problems of #1380. What Publish the datasets generated by PINNeAPPle for the #1380 problems that have no public dataset, for example: \u00b7 the interFoam dam break (#1376); \u00b7 the heat sink; \u00b7 the plate with a hole; \u00b7 a reaction-diffusion set. Hosting: on a public data host with a DOI, for example Zenodo, or the Hugging Face Hub. Decide which in this issue. Each \u2026"},{"n":1395,"t":"Synthetic data 6/7: synthetic sensor streams for digital twins (noise, drift, dropouts, faults)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1389,"s":0,"a":false,"x":"Part of #1389. Related to the digital-twin workflow (#1193, merged in #1255) and to the stream adapters. What Turn simulated fields into realistic sensor data, to test state estimation and anomaly detection before any real plant is available. Sensor models: \u00b7 placement on the domain; \u00b7 sampling rate and latency; \u00b7 white and coloured noise; \u00b7 bias, slow drift and quantisation; \u00b7 saturation and dropouts, plus stuck, \u2026"},{"n":1394,"t":"Synthetic data 5/7: physics-consistent augmentation and non-dimensionalisation","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1389,"s":0,"a":false,"x":"Part of #1389. What Augmentations that keep the physics, so a dataset can be enlarged without new solver runs: \u00b7 symmetries of the problem: reflections and rotations of the domain and fields, with vectors and tensors transformed correctly, and Galilean shifts where the equations allow them; \u00b7 non-dimensionalisation: with the existing Buckingham \u03c0 tools, re-express cases in dimensionless groups, so cases with the \u2026"},{"n":1393,"t":"Synthetic data 4/7: multi-fidelity datasets (coarse and fine runs with fidelity labels and cost)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1389,"s":0,"a":false,"x":"Part of #1389. Needs 1/7. What Generate datasets that mix fidelities, and record the fidelity and the cost of every case: \u00b7 the same problem at two or three mesh or time-step levels, or with a simplified model (for example shallow water for the dam break, potential flow for an airfoil); \u00b7 each case stores its fidelity level, its wall and CPU time, and its discretisation error estimate from 2/7. Measure it On one \u2026"},{"n":1392,"t":"Synthetic data 3/7: adaptive design (add cases where the surrogate is uncertain) vs LHS and Sobol at equal budget","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1389,"s":0,"a":false,"x":"Part of #1389. Needs 1/7. What Use pinneappledata.activelearning and doe.prioritize to grow a dataset where a surrogate is uncertain or wrong. \u00b7 Candidates are scored by the ensemble or conformal uncertainty of the current surrogate. \u00b7 The batch of new cases is chosen with a diversity term, so the new cases do not cluster. Measure it \u00b7 Problem: one cheap and one expensive problem, for example Darcy with GRF \u2026"},{"n":1391,"t":"Synthetic data 2/7: dataset quality checks and a data card with measured quality","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1389,"s":0,"a":false,"x":"Part of #1389. Needs 1/7. What Every generated dataset gets a data card (Markdown plus JSON) whose quality numbers are measured on the dataset itself: \u00b7 Solver health per case: converged or not, the final residuals, Courant number, mass or energy balance. Failed or suspicious cases are listed, never silently dropped. \u00b7 Discretisation error: a mesh or time-step refinement study on a few cases of the design (for \u2026"},{"n":1390,"t":"Synthetic data 1/7: one pipeline and API (problem \u2192 design \u2192 solver runs \u2192 standard dataset)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1389,"s":0,"a":false,"x":"Part of #1389. What One documented path from a problem description to a dataset: 1. Problem spec: the parameter space (pinneappledata.contracts.ParameterSpace), the outputs, the solver, the mesh or grid, and the time window. 2. Design: pinneappledata.doe (LHS, Sobol and others), with coverage and redundancy reported before any run. 3. Runs: \u00b7 in-process classical solvers (pinneapplesolvers); \u00b7 external solvers \u2026"},{"n":1389,"t":"Epic: synthetic physics data generation with PINNeAPPle (one pipeline, measured quality, published datasets)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":7,"a":false,"x":"Goal Make generating synthetic physics data a first-class, measured capability of PINNeAPPle: \u00b7 from a problem description to a verified, documented dataset that any framework can train on; \u00b7 with the quality of the data measured, not assumed. The datasets this produces also feed the per-problem benchmarks of #1380. What exists today (to build on, not to duplicate) \u00b7 pinneappledata.synth: generators for PDEs (also \u2026"},{"n":1388,"t":"Benchmark v2 8/8: report v2 and reproducibility (one command per track, results schema, CI smoke)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Related to #1133. What \u00b7 One command per track: \u00b7 for example python -m benchmarks.vsframeworks.driver --track B+ --player physicsnemo --seed 0; \u00b7 plus --all with the compute budget of the protocol; \u00b7 resumable: a finished run is skipped by its result file. \u00b7 Results schema: one JSON per run, validated in CI. It records: \u00b7 player, version and environment hash; \u00b7 track, task, regime and seed; \u00b7 \u2026"},{"n":1387,"t":"Benchmark v2 7/8: track H, capabilities and workflow (measured ergonomics plus a cited not-measured matrix)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. What Two separate parts, which are never merged. Measured For each open-source player: \u00b7 Time to first result from a clean machine: install, then run the player's own quickstart, timed. Record each failure and its cause. \u00b7 User code for a fixed set of tasks, with the v1 measureergonomics.py: \u00b7 a forward PINN; \u00b7 an operator trained on a given dataset; \u00b7 uncertainty intervals on a surrogate's \u2026"},{"n":1386,"t":"Benchmark v2 6/8: track G, GPU track (throughput, AMP, torch.compile, multi-GPU)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. What v1 is CPU only, which is not where PhysicsNeMo is built to run. v2 reruns a subset of tracks B+, E and F on GPU and reports it in separate tables, never mixed with CPU numbers. \u00b7 Hardware: recorded in full: the GPU model and count, driver, CUDA and cuDNN versions, and the interconnect for multi-GPU. If only consumer or cloud GPUs are available, say so. \u00b7 Per player: \u00b7 fp32 and each player's \u2026"},{"n":1385,"t":"Benchmark v2 5/8: mesh and graph framework adapters (F), reused by problems P04, P08, P09, P12","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Needs the protocol from sub-issue 1/8. What Compare graph and mesh surrogates on unstructured meshes, where the grid-based operators of tracks B and E do not apply. Datasets (public, downloaded with checksums): \u00b7 the DeepMind MeshGraphNets cylinderflow dataset, 2-D incompressible flow past a cylinder; \u00b7 one airfoil or 3-D external-aero subset small enough for the benchmark machine, chosen in the \u2026"},{"n":1384,"t":"Benchmark v2 4/8: free-surface VOF adapters and coarse-CFD baseline (E), for problem P07","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. It builds on #1375 (#1376\u2013#1379), which compares PINNeAPPle and PhysicsNeMo on the interFoam dam-break dataset. What Add the other operator players to the same data and evaluation: \u00b7 neuraloperator FNO and TFNO; \u00b7 PDEArena U-Net, or its FNO recipe. Use the same inputs (alpha at t \u2212 dt, alpha at t, obstacle mask), the same unrolled training budget and the same 40-step rollout from t = 0. Use the same \u2026"},{"n":1383,"t":"Benchmark v2 3/8: operator framework adapters and public dataset loaders (B+), reused by problems P01, P02, P04\u2013P06, P13","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Needs the protocol from sub-issue 1/8. What v1 track B uses one Darcy problem. v2 uses public datasets with published splits, so the results can be checked against the literature. Datasets. Download them with checksums, never commit them, and use the dataset's official train and test splits. \u00b7 PDEBench 2-D Darcy flow, at one \u03b2. \u00b7 PDEBench 2-D shallow water. \u00b7 PDEBench 2-D incompressible Navier\u2013Stokes, \u2026"},{"n":1382,"t":"Benchmark v2 2/8: PINN framework adapters (A+), reused by problems P01, P03, P06, P09\u2013P11, P13","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Needs the protocol from sub-issue 1/8. What Rerun the v1 PINN problems with the players added in v2, on the same points, losses and evaluation: \u00b7 the v1 forward problems of track A, in the A1 identical-configuration and A2 best-effort regimes; \u00b7 the v1 inverse problem of track C. Players: \u00b7 PINNeAPPle, DeepXDE and PhysicsNeMo-Sym, as in v1; \u00b7 PINA, TorchPhysics and jinns; \u00b7 NeuralPDE.jl if the Julia \u2026"},{"n":1381,"t":"Benchmark v2 1/8: protocol v2, player matrix, pinned environments and fairness rules","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1380,"s":0,"a":false,"x":"Part of #1380. Must be merged before any v2 result is produced. What Write benchmarks/vsframeworks/PROTOCOLv2.md, or a v2 section in PROTOCOL.md. \u00b7 Player matrix: which player runs in which track, with the exact version or commit and the install command. \u00b7 One isolated environment per player (venv, conda or container), recorded in benchmarks/vsframeworks/envs/. \u00b7 A clash between players' pinned torch versions is \u2026"},{"n":1380,"t":"Epic: cross-framework benchmark v2, PINNeAPPle vs PhysicsNeMo and other players","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":22,"a":false,"x":"Goal Extend benchmarks/vsframeworks/ (v1) into a broader, reproducible benchmark of PINNeAPPle against PhysicsNeMo and the other players in physics-informed ML and neural surrogates. The benchmark is organised by problem: each problem has its own issue, reference solution, data, players and metrics. v1 compares PINNeAPPle with PhysicsNeMo, PhysicsNeMo-Sym, DeepXDE and neuraloperator. It is CPU only and uses 3\u20135 \u2026"},{"n":1379,"t":"Dam-break benchmark 4/4: PINNeAPPle vs PhysicsNeMo comparison report (benchmarks/vs_frameworks)","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1375,"s":0,"a":false,"x":"Part of #1375. Needs sub-issues 1/4 to 3/4. What Add the dam-break VOF surrogate as a new case of benchmarks/vsframeworks/ and follow its rules: \u00b7 the protocol is committed before any result, as an addition to PROTOCOL.md; \u00b7 every number in REPORT.md comes from results/.json; \u00b7 the goal is to understand the state of things, not to make PINNeAPPle win. Protocol to write first \u00b7 Data: the same HDF5 files for both \u2026"},{"n":1378,"t":"Dam-break benchmark 3/4: rollout validation and uncertainty for both surrogates","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1375,"s":0,"a":false,"x":"Part of #1375. This part goes beyond the PhysicsNeMo example. It covers the checks PINNeAPPle offers, applied to both trained surrogates: the PINNeAPPle one from sub-issue 2/4 and the PhysicsNeMo checkpoint from the reference example. What 1. Rollout validation with pinneappleanalysis.validation.rollout (#701) over the 40-step horizon on the 10 test cases: \u00b7 invariant drift: the total water volume, compared with the \u2026"},{"n":1377,"t":"Dam-break benchmark 2/4: autoregressive FNO with unrolled training on the library's FNO","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1375,"s":0,"a":false,"x":"Part of #1375. Needs the dataset from sub-issue 1/4. The reference files from the PhysicsNeMo example can be used until it is done. What Train the same surrogate as the PhysicsNeMo reference with pinneappleneural.architectures.neuraloperators.fno. The reference is examples/cfd/dambreakfno/{utils,train}.py on barrosyan/physicsnemo@examples/dam-break-fno. Inputs and outputs: \u00b7 Input channels: alpha at t \u2212 dt, alpha at \u2026"},{"n":1376,"t":"Dam-break benchmark 1/4: parametric interFoam dam-break dataset generated with the library","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":1375,"s":0,"a":false,"x":"Part of #1375. What Generate the same dataset as the PhysicsNeMo reference: examples/cfd/dambreakfno/generatedataset.py on barrosyan/physicsnemo@examples/dam-break-fno. Use the library's own OpenFOAM tooling, not a copy of the script. \u00b7 Case: the interFoam damBreak tutorial with the mesh refined 2\u00d7 (cell counts doubled in each hex block, grading unchanged, 9072 cells). \u00b7 Parameters: \u00b7 100 water columns, with width ~ \u2026"},{"n":1375,"t":"Epic: dam-break VOF surrogate, reproduced in PINNeAPPle and compared with PhysicsNeMo","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":4,"a":false,"x":"Goal Reproduce in PINNeAPPle the two-phase dam-break surrogate experiment that was built as a PhysicsNeMo example. Then compare the two frameworks on the same data, with the protocol of benchmarks/vsframeworks/. The aim is to understand where each framework stands, not to make PINNeAPPle win. Every number in the comparison must be measured. A number from the PhysicsNeMo side is only quoted once it has been rerun \u2026"},{"n":1374,"t":"IMPOSSIBLE ROOM: a room that cannot exist in ordinary geometry, and stays consistent","l":["enhancement","priority: P3","effort: M","solvers","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A navigable room whose local geometry is ordinary but whose global connectivity is not: the walls are identified in pairs, so walking straight returns the traveller somewhere else, and light follows the same identifications so that what is seen through a wall is a real distant part of the space. The experiment delivers the environment, an audit that checks the construction is consistent \u2014 path \u2026"},{"n":1373,"t":"CAUSALITY MANIPULATOR: simulate the consequences before choosing the action","l":["enhancement","priority: P2","effort: M","surrogate","uq","agents","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary For a system that has a physics model and an expensive solver, a decision aid enumerates the candidate actions, propagates each through a surrogate with its uncertainty, ranks them, and then verifies the chosen action with the full solver. The scientific content is not the ranking but its reliability: did the ranking survive verification, and was the uncertainty that drove the ranking \u2026"},{"n":1372,"t":"VORTEX SHIELD: deflecting dust and droplets with a flow instead of a wall","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A device creates a flow that turns approaching dust particles or droplets away from a protected region, using moving air instead of a solid wall. The effectiveness is governed by the particle Stokes number, and that is the scientific content: a particle much smaller than the flow's turning scale follows the flow and is deflected, a particle much larger keeps its momentum and passes through the \u2026"},{"n":1371,"t":"HARD-LIGHT CONSTRUCTOR: how much force light can actually apply","l":["enhancement","priority: P3","effort: S","uq","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary The radiation-pressure force available from a structured light field is computed for a range of structures and powers, and compared with the weight of any macroscopic object and with the forces that hold a small particle in a trap. The answer is a table in newtons per watt, with the object-size scaling attached, and the conclusion it supports is not a matter of degree: at any power a \u2026"},{"n":1370,"t":"MIRROR DIMENSION: an environment whose geometry is consistent and impossible","l":["enhancement","priority: P3","effort: M","solvers","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A three-dimensional environment is built so that its local geometry is ordinary everywhere and its global connectivity is not: walking in a straight direction returns the traveller to a place that is elsewhere, light follows the same identified boundaries, and gravity stays coherent with the floor. The experiment produces the environment, a loop-closure test that verifies the identification is \u2026"},{"n":1369,"t":"ENERGY SHIELD: a barrier that attenuates a blast or a wave instead of stopping it","l":["enhancement","priority: P3","effort: L","uq","solvers","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A structured barrier reduces the impulse transmitted to a protected region from a blast or a wave, and it is compared against a solid wall of the same mass and against no barrier at all. The physics is transient wave propagation in a heterogeneous medium with impedance mismatch and internal scattering, and the metrics are the transmitted impulse, the peak pressure and the transmitted energy. \u2026"},{"n":1368,"t":"FORCE FIELD LAB: moving an object without touching it, with the mechanism named","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Four real trapping mechanisms \u2014 magnetic, acoustic, optical and electrostatic \u2014 are computed for objects of stated size, and the experiment produces one table: which mechanism, at which object size, gives how many newtons of trapping force and how much stiffness, and how much energy it deposits in the object. There is no fictional mechanism in the list; the point is that \"moving an object \u2026"},{"n":1367,"t":"MEDIBOTS: particles navigating a vessel to a target","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Micron-scale magnetic carriers are released into a branching vessel and steered toward a target against the flow, with Brownian diffusion competing against the steering force. The experiment computes the targeting efficiency, the time to target and the fraction lost to the walls or to the wrong branch, as a function of particle size, flow rate and field strength. The content is where particles \u2026"},{"n":1366,"t":"SELF-BUILDING CITY: local rules that end in a structure, or in a collapse","l":["enhancement","priority: P3","effort: L","orchestration","agents","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Small robots ferry and place parts and assemble a bridge, a tower or a shelter without a central plan, following only local rules. After every placement the structure is checked for stability under its own weight and a stated live load, because an intermediate configuration that cannot stand is not a valid state of the plan. The experiment reports whether the result stands, how long it took, \u2026"},{"n":1365,"t":"BAYMAX ENGINE: a soft body that changes shape to reach and to carry","l":["enhancement","priority: P3","effort: L","solvers","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A soft, pressure-actuated body deforms to reach into a confined space, grasps a delicate object and carries a load. The optimisation chooses the body geometry and the actuation pressure profile; the constraints are the reachable volume, the grasp force, the peak contact pressure on the object and the pressure the system can supply. The result includes the failure case: the object fragility \u2026"},{"n":1364,"t":"UNIVERSAL TOOL: one module set, three tools, one force budget","l":["enhancement","priority: P3","effort: M","design-optimization","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary One inventory of modules reorganises into three tools \u2014 a wrench, a gripper and a gear \u2014 and the experiment checks, for each, the function that actually matters: transmitted torque at the fastener, grip force on the object, and tooth load at the mesh. The same modules and the same total mass serve all three, so the question is whether a single set can deliver any of them well, and the answer \u2026"},{"n":1363,"t":"REACTIVE ARMOR: a layer that stiffens only where it is hit","l":["enhancement","priority: P3","effort: L","uq","solvers","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A protective layer whose local stiffness or damping switches on impact is compared with a passive layer of the same areal mass, and the comparison is the whole experiment. The impact drives an elastic wave through a heterogeneous medium whose modulus changes with the local stress or strain rate, and the metrics are the transmitted impulse and the peak pressure at a protected interface. Equal \u2026"},{"n":1362,"t":"THOUGHTFORM: from a described object to a structure that can actually be built","l":["enhancement","priority: P2","effort: M","llm","agents","design-optimization",
