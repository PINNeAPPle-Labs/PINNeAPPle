:0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context There is no single open aircraft-geometry dataset, so the first step is to assemble one from sources whose licences allow it, keep the provenance of each model, and use it for geometry learning. Sources: \u00b7 OpenVSP and the VSP Hangar (openvsp.org, hangar.openvsp.org; NASA open-source licence): parametric aircraft models contributed by the community, with the parametric definition, not just a mesh. \u00b7 \u2026"},{"n":266,"t":"NASA Common Research Model wing-body: transonic RANS in OpenFOAM against Drag Prediction Workshop data","l":["priority: P2","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The NASA Common Research Model (CRM; Vassberg et al. 2008, AIAA 2008-6919) is an open transonic transport configuration used in the AIAA Drag Prediction Workshops (aiaa-dpw.larc.nasa.gov) and described at commonresearchmodel.larc.nasa.gov. The geometry, a hierarchy of grids and results from tens of participating codes are public, plus wind-tunnel data from NASA and ETW tests. Standard condition: Mach 0.85, \u2026"},{"n":265,"t":"NASA Turbulence Modeling Resource verification suite in OpenFOAM: flat plate, bump in channel, NACA 0012, backward-facing step","l":["priority: P1","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The NASA Langley Turbulence Modeling Resource (TMR, turbmodels.larc.nasa.gov) publishes verification and validation cases for RANS models: geometry, a family of structured grids, the exact model definitions (Spalart-Allmaras, k-omega SST and variants) and reference results from CFL3D and FUN3D, including grid-converged values of skin friction, drag and pressure. It is the cleanest open source for checking \u2026"},{"n":264,"t":"Cloud masking and precipitation nowcasting: SEVIR (GOES-16 and NEXRAD) with advection-constrained models","l":["priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-10","p":null,"s":0,"a":false,"x":"Context SEVIR (Veillette et al., NeurIPS 2020, sevir.mit.edu, on the AWS open-data registry) is a curated set of 20 000 weather events, each a 4-hour, 384 km window with co-registered GOES-16 ABI (visible, water-vapour, IR), NEXRAD vertically integrated liquid (VIL) and GLM lightning. It is the standard open nowcasting benchmark. Confirm its licence before redistributing derived data. Two tasks: 1. Nowcasting: \u2026"},{"n":263,"t":"Burn-scar and active-fire segmentation: NASA/IBM HLS Burn Scars, FIRMS and MTBS, with a spread-rate physical model","l":["priority: P2","effort: L","area: benchmark-cost"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-10","p":null,"s":0,"a":false,"x":"Context Wildfire gives a segmentation task with a ready open dataset and a physical model to connect it to. \u00b7 HLS Burn Scars (NASA/IBM, Hugging Face ibm-nasa-geospatial/hlsburnscars; CC-BY-4.0 at the time of writing, confirm): HLS scenes with burn-scar masks over the contiguous US. A Prithvi downstream task. \u00b7 NASA FIRMS active-fire detections (MODIS and VIIRS, near-real-time and archive, free key): point detections \u2026"},{"n":262,"t":"Flood mapping: Sen1Floods11 segmentation with Sentinel-1 SAR and a terrain-based physical check","l":["priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-10","p":null,"s":0,"a":false,"x":"Context Sen1Floods11 (Bonafilia et al., CVPR Workshops 2020; github.com/cloudtostreet/Sen1Floods11, CC BY 4.0) pairs Sentinel-1 SAR and Sentinel-2 optical chips with flood-water masks for 11 events on 6 continents: a few hundred hand-labelled chips plus a larger weakly-labelled set. It is the standard small flood-segmentation benchmark and one of the downstream tasks used to evaluate Prithvi-EO. Terrain gives a \u2026"},{"n":261,"t":"Scene classification of satellite imagery: EuroSAT and BigEarthNet with the NASA HLS Prithvi backbone","l":["priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Satellite scene classification is the entry point for the imagery experiments. \u00b7 EuroSAT (Helber et al. 2019, github.com/phelber/EuroSAT): 27 000 labelled Sentinel-2 patches, 10 land-use classes, RGB and 13-band versions. Small enough for a CPU run; check the licence on the repository page. \u00b7 BigEarthNet (bigearth.net): multi-label Sentinel-2 patches with CORINE land-cover labels, much larger; use a subset. \u2026"},{"n":260,"t":"Soil moisture dynamics: NASA SMAP and NOAA USCRN with a Richards-equation physics term","l":["priority: P3","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Soil moisture links weather, agriculture and flood risk, and it has a standard physical model (the Richards equation, or a bucket model at coarse scale). \u00b7 NASA SMAP L3 daily soil moisture (SPL3SMP, 36 km; the enhanced 9 km product), via NSIDC DAAC with a free Earthdata login. \u00b7 NOAA USCRN (US Climate Reference Network): hourly in-situ soil moisture at several depths, precipitation and air temperature, \u2026"},{"n":259,"t":"Global warming as an inverse problem: two-layer energy-balance model fitted to NASA GISTEMP and NOAA data","l":["priority: P3","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context A two-layer energy-balance model (Held et al. 2010; Geoffroy et al. 2013) is two coupled ODEs for upper-ocean and deep-ocean temperature, driven by radiative forcing, with a handful of parameters: feedback lambda, heat capacities, heat-exchange coefficient and efficacy. Fitting it to observations is a small, interpretable inverse problem with real uncertainty, and a good check of the library's \u2026"},{"n":258,"t":"Shallow water on the sphere: Williamson test cases and comparison with ERA5 500 hPa geopotential","l":["priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Williamson et al. (1992, J. Comput. Phys. 102:211) defined the standard test suite for shallow-water solvers on the sphere. These are the atmospheric-dynamics analogue of the DFG cylinder: everyone uses them. \u00b7 Case 2: steady zonal geostrophic flow, with an analytic solution. Pure verification. \u00b7 Case 5: flow over an isolated mountain, no analytic solution; a reference solution from a spectral model is used. \u2026"},{"n":257,"t":"Arctic sea-ice extent and concentration: forecasting from NSIDC passive-microwave data","l":["priority: P3","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Sea ice has a long, clean, open satellite record and a physical story (thermodynamic growth plus advection) that a model can use. \u00b7 NSIDC Sea Ice Index (G02135): daily and monthly extent and area, 1978 onward. \u00b7 NOAA/NSIDC Climate Data Record of passive-microwave sea-ice concentration (G02202): gridded daily concentration on a 25 km polar grid. NASA DAAC at NSIDC (free Earthdata login for download). \u00b7 \u2026"},{"n":256,"t":"Solar irradiance and energy-yield forecasting with NASA POWER and a clear-sky physical baseline","l":["priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-10","p":null,"s":0,"a":false,"x":"Context NASA POWER (power.larc.nasa.gov, free, no account, REST API) provides daily and hourly solar and meteorological parameters on a global grid, from satellite and MERRA-2 sources: ALLSKYSFCSWDWN, CLRSKYSFCSWDWN, T2M, WS10M, RH2M and others. The clear-sky product is the physical baseline; the all-sky value is the target. Plan: for 20 sites on all continents, predict the clearness index (all-sky divided by \u2026"},{"n":255,"t":"Tropical cyclones: track and rapid-intensification prediction from HURDAT2/IBTrACS and satellite imagery","l":["priority: P3","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Two linked problems with fully open data: \u00b7 Time series (regression and classification): best-track records from NHC HURDAT2 (Atlantic and East Pacific) and NOAA NCEI IBTrACS (global, multi-agency). Predict 24 to 72 h track and maximum wind, and classify rapid intensification (an increase of at least 30 kt in 24 h). \u00b7 Image classification: NOAA NCEI HURSAT (geostationary infrared imagery along storm tracks) \u2026"},{"n":254,"t":"Coastal water level: tide harmonics plus a learned storm-surge residual from NOAA CO-OPS","l":["priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Water level at a tide gauge is the sum of a deterministic astronomical tide and a meteorological residual (surge). The tide is exactly the kind of structure a physics-aware model should hard-code, so this is a clean test for hybrid modelling. NOAA CO-OPS Tides and Currents (api.tidesandcurrents.noaa.gov, public domain, no key) gives: \u00b7 verified 6-minute and hourly water level at hundreds of stations; \u00b7 \u2026"},{"n":253,"t":"Sea-surface temperature and ENSO: forecast Nino 3.4 from NOAA OISST and NCEP/NCAR reanalysis","l":["priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-10","p":null,"s":0,"a":false,"x":"Context ENSO is the classic low-dimensional, physically understood, hard-to-predict climate signal. Both the data and the target index are open: \u00b7 NOAA OISST v2.1 (NCEI): daily 0.25 degree SST from 1981, public domain; also on the AWS open-data registry. \u00b7 NOAA ERSSTv5: monthly extended reconstruction from 1854, for longer training series. \u00b7 Nino 3.4 index (NOAA PSL / CPC): the target, and the ONI for event \u2026"},{"n":252,"t":"Station time series: temperature and precipitation forecasting on NOAA GHCN-Daily","l":["priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context GHCN-Daily (NOAA NCEI) has daily TMAX, TMIN, PRCP, SNOW and SNWD from tens of thousands of land stations, many with records longer than 100 years. It is public domain and needs no account: \u00b7 product page: ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily; \u00b7 also on the Registry of Open Data on AWS, one CSV per station (search the registry for GHCN). It is the cheapest \u2026"},{"n":251,"t":"Medium-range weather forecasting: WeatherBench 2 (ERA5) with NOAA GFS and GEFS as operational baselines","l":["priority: P2","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context WeatherBench 2 (Rasp et al. 2023, arXiv:2308.15560, docs at weatherbench2.readthedocs.io) defines a fixed protocol for global medium-range forecasting on ERA5: regridded data at 64x32, 240x121 and 1440x721, standard variables (Z500, T850, U/V850, T2m, 10 m wind, precipitation), and RMSE/ACC/CRPS/energy-spectra metrics against IFS HRES, GraphCast and Pangu-Weather. \u00b7 Training data: ERA5 (Copernicus, CC-BY 4.0 \u2026"},{"n":250,"t":"Tracking issue: open-data experiments (NOAA, NASA, satellite, aircraft, OpenFOAM, standard Physics AI problems) and a catalogue of open sources by area","l":["priority: P1","effort: S","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The benchmark and demonstration work so far uses our own simulations and a handful of public CFD datasets (#241 to #249). This tracking issue organises the next layer: experiments built only on open data, so anyone can rerun them, covering the problem types the library should handle: \u00b7 time-series prediction; \u00b7 classification and segmentation on satellite imagery; \u00b7 physical and climate modelling; \u00b7 aircraft \u2026"},{"n":249,"t":"ONERA M6 wing: transonic compressible ExternalFlow and the shock lambda pattern","l":["priority: P3","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The ONERA M6 wing is the classic transonic validation case: Mach 0.8395, \u03b1 = 3.06\u00b0, with wind-tunnel Cp at seven span stations (Schmitt & Charpin 1979) and a characteristic \"lambda\" shock on the upper surface. It is in the NASA Turbulence Modeling Resource and in SU2's tutorials, and its geometry is public. pinneappledesign.aero models compressibility with a vortex lattice, Prandtl\u2013Glauert and Korn wave \u2026"},{"n":248,"t":"Wind around buildings: AIJ single high-rise benchmark with an atmospheric boundary layer inlet","l":["priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Urban wind (pedestrian comfort, wind loads, pollutant dispersion) is a common engineering use of CFD and a growing Physics-AI target. The Architectural Institute of Japan publishes guideline benchmark cases with wind-tunnel data. The simplest is an isolated high-rise building with a 1:1:2 aspect ratio, measured inside a turbulent atmospheric boundary layer (ABL). How to reproduce in PINNeAPPle: \u00b7 \u2026"},{"n":247,"t":"OpenFOAM motorBike tutorial and DrivAerML through pp.cfd: real-geometry external flow and surface-pressure surrogate","l":["priority: P2","effort: L","area: benchmark-cost"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-10","p":null,"s":0,"a":false,"x":"Context Two steps up in geometry complexity from the Ahmed body. \u00b7 motorBike: OpenFOAM's incompressible/simpleFoam/motorBike tutorial (a motorcycle and rider) ships with every OpenFOAM install. It is the usual smoke test for snappyHexMesh on a complex, dirty STL, with drag and lift from its forceCoeffs. \u00b7 DrivAerML: Ashton et al. 2024, arXiv:2408.11969, has 500 geometry variants of the open-cooling DrivAer car, \u2026"},{"n":246,"t":"Turek\u2013Hron FSI2/FSI3: fluid-structure benchmark with FEniCSx and OpenFOAM coupling","l":["priority: P3","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Turek & Hron (2006) is the reference fluid-structure interaction benchmark: an elastic flag attached behind the DFG cylinder. \u00b7 FSI2: large periodic deflection. \u00b7 FSI3: higher frequency, matched densities. Reference values exist for the displacement of the flag's tip (mean \u00b1 amplitude), the drag and lift, and the frequency. They are reproduced in many papers, with differing precision, so the original paper \u2026"},{"n":245,"t":"Structural benchmarks in FEniCSx: NAFEMS LE1/LE10 and Cook's membrane, with surrogate and 3D renders","l":["priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context For structures there is no single dataset like AirfRANS, but there are reference problems with published answers that every FEA code is checked against: \u00b7 NAFEMS LE1: elliptic membrane, plane stress, \u03c3yy at point D = 92.7 MPa. \u00b7 NAFEMS LE10: thick plate under 1 MPa pressure, E = 210 GPa, \u03bd = 0.3, quarter model, \u03c3yy at point D = \u22125.38 MPa. \u00b7 Cook's membrane: a tapered cantilever under shear, a test for \u2026"},{"n":244,"t":"Periodic hills and the McConkey curated dataset: neural turbulence closure on OpenFOAM RANS","l":["priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Data-driven turbulence closure is one of the most cited open problems in Physics AI. McConkey, Yee & Lien (Scientific Data 2021, arXiv:2103.11515) published a curated dataset: \u00b7 RANS with k-\u03b5, k-\u03b5-\u03c6t-f, k-\u03c9 and k-\u03c9 SST, produced in OpenFOAM; \u00b7 DNS/LES labels at about 0.9 M points; \u00b7 cases: periodic hills of parametrised slope (Xiao et al. 2020, arXiv:1910.01264), square duct, parametric bumps, a \u2026"},{"n":243,"t":"DFG cylinder benchmark (Sch\u00e4fer & Turek 2D-2 and 3D): transient ExternalFlow and PINN/MGN comparison","l":["priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The DFG benchmark \"Flow around a cylinder\" (Sch\u00e4fer & Turek 1996) is the reference for laminar unsteady incompressible flow: \u00b7 a channel 2.2 \u00d7 0.41 with a cylinder of diameter 0.1; \u00b7 Re = 100 in case 2D-2 (vortex shedding), with published intervals for the maximum drag and lift coefficients and the Strouhal number; \u00b7 a 3D version (3D-2) with a square channel. Most Physics-AI papers on cylinder flow use it \u2026"},{"n":242,"t":"AirfRANS: reproduce the four tasks with the aero pipeline's MeshGraphNet","l":["priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context AirfRANS (Bonnet et al., NeurIPS 2022 Datasets & Benchmarks, arXiv:2212.07564) is 1000 incompressible RANS simulations around NACA 4- and 5-digit airfoils, run in OpenFOAM v2112. The data is under ODbL v1.0, and the mesh and case generation are open. It defines four tasks: \u00b7 full data; \u00b7 scarce data; \u00b7 Reynolds-number extrapolation; \u00b7 angle-of-attack extrapolation. It reports baselines (MLP, GraphSAGE, \u2026"},{"n":241,"t":"Ahmed body: validate pp.cfd.ExternalFlow and train a surrogate on AhmedML","l":["priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-10","p":null,"s":0,"a":false,"x":"Context The Ahmed body (Ahmed, Ramm & Faltin 1984) is the standard bluff-body benchmark for car aerodynamics: a 1.044 \u00d7 0.389 \u00d7 0.288 m body with rounded front edges and a rear slant whose angle switches the wake between attached and separated regimes. Wind-tunnel data exist for drag and for velocity profiles (Lienhart & Becker 2003, ERCOFTAC case 82). PR #240 adds what is needed to run it end to end: \u00b7 \u2026"},{"n":236,"t":"MeshGraphNet: world-space edges, separate hidden dims and memory optimizations","l":["priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-07","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Pending item from the MGN implementation session (PR #232). PINNeAPPle's MeshGraphNet is the single-edge-type variant, as the docstring of meshgraphnet.py says; features from the paper and from PhysicsNeMo are missing: \u00b7 World-space edges (Pfaff et al.): an edge set rebuilt by proximity at every step, with its own encoder, needed for contact (flag, deformingplate). lagrangianmgn.py already rebuilds the graph \u2026"},{"n":235,"t":"Literature survey and verification of the MeshGraphNet experiments","l":["priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-07","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Pending item from the MGN implementation session (PR #232). The experiments were chosen from Pfaff et al. 2021 (cylinderflow), Sanchez-Gonzalez et al. 2020 (Water/Sand/Goop) and the PhysicsNeMo examples, from memory and local READMEs, without a broad search or verification against the papers. Done when \u00b7 The MeshGraphNet-for-CFD literature is surveyed and the cases reproducible with public data are listed \u2026"},{"n":233,"t":"Reproduce the MeshGraphNet paper's cylinder_flow at scale (GPU)","l":["priority: P2","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-07","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Pending item from the MGN implementation session (PR #232). The experiment examples/meshgraphnet/02cylinderflowdeepmind.py only ran on a minimal budget (11 trajectories, 64 hidden, 6 MP layers, 3000 steps, lr 1e-3\u21921e-5, noise 0.003, 2 validation trajectories, CPU on an overloaded machine): rollout RMSE (50 steps) 0.0711 vs 0.0962 for the frozen baseline. This only shows that the pipeline learns. Done when \u00b7 \u2026"},{"n":231,"t":"Integrate MeshDynamicsMGN into the registry, Arena and variable-graph batching","l":["priority: P2","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context MeshDynamicsMGN (pinneappleneural/architectures/graphnn/mgndynamics.py) is currently only exported from graphnn; it is not in the catalog (graphnn/registry.py) nor in the Arena/GNNAdapter. \u00b7 Register MeshDynamicsMGN in the global registry with its own capabilities (input: static mesh + trajectory; output: rollout). \u00b7 Arena/GNNAdapter support for per-sample variable-size graphs (today MeshGraphNet assumes a \u2026"},{"n":230,"t":"Port Stokes-MGN physics fine-tuning and vortex_shedding_mesh_reduced from PhysicsNeMo","l":["priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Items from the PhysicsNeMo MGN examples that were not ported in #228. Depends on #228 (base Stokes and vortex shedding scripts running). \u00b7 examples/cfd/stokesmgn/pifinetuning.py and pifinetuninggnn.py: after the MGN is trained, inference-time fine-tuning with a data loss (match the MGN prediction) plus Stokes PDE residuals and boundary conditions (10000 iterations, lr 1e-3). Use the residuals from \u2026"},{"n":229,"t":"CANTO (NVIDIA): evaluate integrating the CAD-native transformer operator","l":["priority: P3","effort: L","area: surrogates-optimization"],"m":null,"c":1,"cr":"2026-10-06","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Out of scope for #228. CANTO (NVIDIA, arXiv 2609.36806, https://research.nvidia.com/labs/aie/canto/): a transformer operator native to CAD. It tokenizes NURBS patches (control points, rational weights, knots) and predicts surface fields (pressure, wall shear) and volume fields (velocity, vorticity) at arbitrary query points, without converting to a mesh. Evaluated on AhmedML, WindsorML, DrivAerML and \u2026"},{"n":228,"t":"Run the MeshGraphNet vs PhysicsNeMo parity scripts (vortex shedding, Stokes, Lagrangian)","l":["priority: P1","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context PINNeAPPle already had MeshGraphNet (pinneappleneural/architectures/graphnn/meshgraphnet.py). Branch feat/meshgraphnet-parity (commits 6060d03d, 839dad69, not yet published nor in a PR) adds the transient recipe of Pfaff et al. (mgndynamics.py: normalization, training noise, \u0394v target, rollout with pinned boundary), the activation=\"relu\" option, tests and experiments. This issue asks for the full-scale \u2026"},{"n":227,"t":"[X40] Architecture decision rule: seven planes (Physics IR, Data, Compute, AI, Engineering, Validation, Evidence)","l":["roadmap","priority: P1","effort: S","area: ecosystem","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Document the plane model and use it as an admission test for the core: a feature that does not strengthen a plane or a connection between planes does not belong in core. Add a feature x impact x difficulty x dependency x architectural-priority matrix for 0.6.3 - 1.0 - 2.0. Done when Document merged in docs/ and referenced from CONTRIBUTING.md and ROADMAP.md. | Priority | Effort | Related | |---|---|---| | P1 \u2026"},{"n":226,"t":"[X39] API stability tiers: Experimental, Stable, Scientific Standard","l":["roadmap","priority: P1","effort: S","area: release-quality","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Mark every public symbol with a tier so growth of the project does not make the API unmaintainable. Complements deprecation policy and the 1.0 freeze. Done when Tier is visible in docs and enforced by a contract test; decorator exists for experimental APIs. | Priority | Effort | Related | |---|---|---| | P1 | S | I7, I8 | Roadmap item X39 (physics kernel / infrastructure extension of 2026-10-06; builds on \u2026"},{"n":225,"t":"[X38] Cross-version compatibility and schema migrations","l":["roadmap","priority: P1","effort: M","area: release-quality","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Results, ProblemSpecs, datasets, models and manifests declare the versions they are compatible with, and schema migrations upgrade old artifacts (for example 0.7.x ok, 0.9.x warn, 1.0.x not supported). Done when A 0.7 artifact loads in a later version through a tested migration or fails with an actionable message. | Priority | Effort | Related | |---|---|---| | P1 | M | I7, I8 | Roadmap item X38 (physics \u2026"},{"n":224,"t":"[X37] Scientific artifact store with end-to-end lineage","l":["roadmap","priority: P2","effort: L","area: ecosystem","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context One registry for problems, datasets, models, meshes, solvers, experiments, benchmarks, results, validation reports and cards, with lineage (dataset v3 - experiment 482 - model v17 - validation 92 - deployment 8). Done when Lineage is queryable from a deployed model back to dataset and solver versions. | Priority | Effort | Related | |---|---|---| | P2 | L | S7, S18, X15 | Roadmap item X37 (physics kernel / \u2026"},{"n":223,"t":"[X36] Physics experiment planner (expected information gain)","l":["roadmap","priority: P3","effort: M","area: surrogates-optimization","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Choose the physical experiment with the largest expected information gain given model uncertainty. Connects UQ, inverse problems, active learning and experimental design. Done when Planner picks a better sensor/experiment than random on a synthetic inverse problem. | Priority | Effort | Related | |---|---|---| | P3 | M | K3, K10 | Roadmap item X36 (physics kernel / infrastructure extension of 2026-10-06; \u2026"},{"n":222,"t":"[X35] Design space explorer with physics-regime maps","l":["roadmap","priority: P2","effort: L","area: surrogates-optimization","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context DesignSpace + Explorer over geometry, parameters and physics regime (Reynolds, Mach, temperature, materials, BCs), producing Pareto fronts, response surfaces, uncertainty and feasibility maps, and stable/unstable/valid/invalid regions. Done when Explorer returns a feasibility map and Pareto front on a documented case. | Priority | Effort | Related | |---|---|---| | P2 | L | S13, G7, G8 | Roadmap item X35 \u2026"},{"n":221,"t":"[X34] Constraint engine shared by training, optimization, control and deployment","l":["roadmap","priority: P2","effort: M","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context One pp.Constraint(...) abstraction for physical limits, conservation, operational, material, actuator and safety bounds, reused everywhere instead of per-module checks. Done when The same constraint object is enforced in training, an optimizer and a deployment guard. | Priority | Effort | Related | |---|---|---| | P2 | M | S23, S10 | Roadmap item X34 (physics kernel / infrastructure extension of 2026-10-06; \u2026"},{"n":220,"t":"[X33] Physics-constrained reinforcement learning (research)","l":["roadmap","priority: P3","effort: L","area: digital-twin","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Environment - physics - dynamics model - RL agent - control, with physical constraints enforced in the policy. Done when Research note and one constrained-RL baseline on a toy environment. | Priority | Effort | Related | |---|---|---| | P3 | L | X32, X34 | Roadmap item X33 (physics kernel / infrastructure extension of 2026-10-06; builds on the 2026-10-03 plan). Contributions welcome: comment here before \u2026"},{"n":219,"t":"[S38] Decision report: outcome distribution, risks and recommendation from an ensemble","l":["roadmap","priority: P2","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: syn.Be and its syn.protocol description: a simulation returns a distribution of probable scenarios, emerging risks and recommendations before a decision is taken. The social-simulation part does not apply to physics; the output format does. For a design or a plant decision, run an ensemble of simulations or surrogate evaluations over uncertain inputs ([K5]) and report: the distribution of the quantity of \u2026"},{"n":218,"t":"[X32] Physics-based control: MPC, optimal and safe control","l":["roadmap","priority: P2","effort: L","area: digital-twin","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context pp.MPC(model=digitaltwin, constraints=...) plus differentiable, neural and constraint-aware control on top of the twin. Done when MPC on a heated-channel case keeps the constraint while tracking a setpoint. | Priority | Effort | Related | |---|---|---| | P2 | L | X31, X34 | Roadmap item X32 (physics kernel / infrastructure extension of 2026-10-06; builds on the 2026-10-03 plan). Contributions welcome: \u2026"},{"n":217,"t":"[S37] Browser demo gallery for the solvers","l":["roadmap","priority: P3","effort: M","area: contributing"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: Ambystoma Technologies: real-time 2D Navier-Stokes wind tunnel in WebGL, with airfoil drag/lift telemetry and 12 teaching scenarios, running in the browser. Complements [A3] (first example in minutes): a small set of interactive demos (lid-driven cavity, flow over a cylinder, heat conduction) that run in the browser with no install, each linking to the Python code that produces the same result. Acceptance \u00b7 \u2026"},{"n":216,"t":"[S36] Local-only execution mode with a no-egress guarantee","l":["roadmap","priority: P2","effort: M","area: release-quality"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: Ambystoma Technologies, whose products advertise \"100% local processing\" as a privacy guarantee. Industrial clients often cannot send CAD, plant data or operating conditions to a cloud service. Add a mode in which the platform runs entirely on the user's machine and proves it did not send data out. Tasks \u00b7 A localonly setting that disables remote backends, telemetry and external model downloads at runtime. \u00b7 \u2026"},{"n":215,"t":"[X31] StateEstimator: EKF, UKF, EnKF, particle filter, latent state","l":["roadmap","priority: P1","effort: M","area: digital-twin","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context pp.StateEstimator(...) closing the loop sensors - state - physics - prediction - correction. Done when EnKF and EKF recover a known hidden state on a synthetic twin case. | Priority | Effort | Related | |---|---|---| | P1 | M | H1, X30 | Roadmap item X31 (physics kernel / infrastructure extension of 2026-10-06; builds on the 2026-10-03 plan). Contributions welcome: comment here before starting so work is not \u2026"},{"n":214,"t":"[X30] Sensor and observation layer","l":["roadmap","priority: P2","effort: L","area: digital-twin","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Treat observations as partial views of physical state, not as plain datasets: cameras, LiDAR, temperature, pressure, vibration, acoustic, telemetry and satellite data feeding state estimation. Done when Observation objects carry sensor model, noise and mapping to state; one sensor type end to end. | Priority | Effort | Related | |---|---|---| | P2 | L | H1, X31 | Roadmap item X30 (physics kernel / \u2026"},{"n":213,"t":"[X29] Synthetic-to-real transfer workflow","l":["roadmap","priority: P2","effort: L","area: digital-twin","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Simulation - physics AI - experimental data - calibration/adaptation - deployment, with domain adaptation, parameter adaptation, sensor calibration, noise modelling and sim-to-real validation. Done when Documented workflow where a simulation-trained surrogate is adapted to measured data with a measured error reduction. | Priority | Effort | Related | |---|---|---| | P2 | L | G10, H1 | Roadmap item X29 \u2026"},{"n":212,"t":"[X28] Model discrepancy decomposition (physics, numerical error, model error, noise)","l":["roadmap","priority: P2","effort: M","area: surrogates-optimization","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Separate observation = true physics + numerical error + model error + measurement noise and estimate each component, for calibration, inverse problems and twins. Done when Recovers known injected components on a synthetic case with stated intervals. | Priority | Effort | Related | |---|---|---| | P2 | M | K4, K6 | Roadmap item X28 (physics kernel / infrastructure extension of 2026-10-06; builds on the \u2026"},{"n":211,"t":"[X27] HybridModel and neural closure / residual learning","l":["roadmap","priority: P1","effort: L","area: surrogates-optimization","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context pp.HybridModel(physics=..., surrogate=..., correction=...) and a closure block that learns what known physics does not explain (turbulence closure, subgrid, constitutive corrections). Pipelines such as CFD - ROM - neural surrogate - experimental residual correction. Done when A closure model reduces error of a coarse solver on a held-out case and is validated by the trust layer. | Priority | Effort | Related \u2026"},{"n":210,"t":"[X26] Event-driven simulation (pp.Event)","l":["roadmap","priority: P2","effort: M","area: solvers","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Support events such as impact, phase transition, valve opening, material failure, contact, shock and reaction thresholds: pp.Event(condition=..., action=...). Done when A bouncing-ball or valve-opening example triggers events at the right time within tolerance. | Priority | Effort | Related | |---|---|---| | P2 | M | H1 | Roadmap item X26 (physics kernel / infrastructure extension of 2026-10-06; builds on \u2026"},{"n":209,"t":"[X25] Adaptive sampling engine with multi-signal scoring","l":["roadmap","priority: P1","effort: M","area: surrogates-optimization","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Score points with PDE residual, gradient magnitude, uncertainty, geometry complexity, temporal error and boundary distance; sampler.adapt() usable by PINNs, operators, inverse problems, active learning and twins. Done when Adaptive sampler beats Sobol at equal budget on a documented benchmark case. | Priority | Effort | Related | |---|---|---| | P1 | M | K8, B8, X12 | Roadmap item X25 (physics kernel / \u2026"},{"n":208,"t":"[X24] Automatic domain decomposition (problem.decompose)","l":["roadmap","priority: P2","effort: L","area: solvers","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Turn XPINN/SubdomainPINN into infrastructure: adaptive decomposition using geometry, residual gradient, curvature, boundary layers and physical interfaces, producing N subdomains that connect to HPC execution. Done when problem.decompose(strategy=\"adaptive\", ndomains=16) returns valid subdomains and trains with interface conditions. | Priority | Effort | Related | |---|---|---| | P2 | L | X14 | Roadmap item \u2026"},{"n":207,"t":"[X23] Stiffness and regime detection with strategy recommendations","l":["roadmap","priority: P2","effort: M","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Deterministic diagnosis of stiff ODE/PDE, multiscale dynamics, high-frequency solutions, boundary layers and shock-like regimes, recommending adaptive sampling, causal training, curriculum, time marching, XPINN or an implicit solver. Not an agent: plain rules first. Done when Diagnosis report on three known cases (stiff ODE, boundary layer, shock) lists the expected strategies. | Priority | Effort | Related \u2026"},{"n":206,"t":"[X22] Automatic scaling and conditioning (pp.condition) with nondimensional formulation and Re/Pe-style groups","l":["roadmap","priority: P1","effort: L","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Analyse magnitudes, gradients, PDE terms, BCs and scales, then suggest or apply coordinate scaling, field and loss normalization, adaptive weights and nondimensionalization. Also reports dimensionless numbers (for example Re = 20,000 from geometry, velocity, density and viscosity). Done when On a benchmark PINN the auto-conditioned run converges faster or equal to the hand-tuned baseline. | Priority | Effort \u2026"},{"n":205,"t":"[X21] Dimensional consistency checker for equations (pp.check_dimensions)","l":["roadmap","priority: P1","effort: M","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Detect a dimensionally inconsistent PDE before training, with a readable report such as dT/dt - K/s, alphalaplacian - K/s, source - W/m^3: inconsistent. Builds on the unit layer. Done when Checker flags a seeded inconsistent heat equation and passes the consistent one; wired into problem validation. | Priority | Effort | Related | |---|---|---| | P1 | M | K11, X2 | Roadmap item X21 (physics kernel / \u2026"},{"n":204,"t":"[X20] Physics ontology: formal schema for physical objects","l":["roadmap","priority: P1","effort: L","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Formal types for PhysicalSystem, Domain, Geometry, Material, Field, Parameter, GoverningEquation, ConstitutiveLaw, BoundaryCondition, InitialCondition, Observation, Solver and Model, so that physically equivalent concepts have one representation across ProblemSpec, datasets, solvers, Arena, Hub, agents and model cards. Done when The schema is published, and ProblemSpec, dataset and model-card code reuse it \u2026"},{"n":203,"t":"[X19] pp.sparse: SparseField, MeshOperator, GraphOperator, BlockOperator and linear solvers (CG, GMRES, BiCGSTAB, AMG)","l":["roadmap","priority: P2","effort: L","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Engineering problems are sparse (meshes, FEM matrices, adjacency). Needs sparse operators and preconditioned Krylov solvers as first-class objects. Done when A mesh Poisson problem solves through pp.sparse with a preconditioner and matches a reference solver. | Priority | Effort | Related | |---|---|---| | P2 | L | X4 | Roadmap item X19 (physics kernel / infrastructure extension of 2026-10-06; builds on the \u2026"},{"n":202,"t":"[X18] pp.linalg: LinearOperator, eigen and modal analysis, POD, Krylov, adjoint, sensitivity, condition number","l":["roadmap","priority: P2","effort: M","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context A scientific linear-algebra layer bridging numerical computing and SciML. Done when POD, modal analysis and condition-number estimation available through pp.linalg with tests. | Priority | Effort | Related | |---|---|---| | P2 | M | X19 | Roadmap item X18 (physics kernel / infrastructure extension of 2026-10-06; builds on the 2026-10-03 plan). Contributions welcome: comment here before starting so work is \u2026"},{"n":201,"t":"[X17] Public namespace layout and positioning (pp.physics, data, nn, optim, linalg, sparse, geometry, mesh, solver, ...)","l":["roadmap","priority: P1","effort: S","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Settle the target namespace map and the project positioning (a physics computing framework where PINNs are one technology among many). Decision issue; implementation is tracked by the other X issues. Done when Namespace map and positioning text merged into ROADMAP.md and the README. | Priority | Effort | Related | |---|---|---| | P1 | S | A4, I8 | Roadmap item X17 (physics kernel / infrastructure extension \u2026"},{"n":200,"t":"[X16] Unified registries (physics, model, solver, operator, dataset, benchmark, geometry, material, optimizer)","l":["roadmap","priority: P1","effort: M","area: ecosystem","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context One registry protocol for every extensible object type, instead of a ModelRegistry only. Pairs with the entry-point plugin system. Done when pp.register(MySolver) works for each object type with one shared protocol and test suite. | Priority | Effort | Related | |---|---|---| | P1 | M | K1 | Roadmap item X16 (physics kernel / infrastructure extension of 2026-10-06; builds on the 2026-10-03 plan). \u2026"},{"n":199,"t":"[X15] Physics Artifact Format (.ppx): save problem, model, mesh, units, provenance and validation together","l":["roadmap","priority: P1","effort: M","area: ecosystem","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context pp.save(artifact, \"experiment.ppx\") packaging problem, model, weights, mesh, dataset metadata, units, solver, configuration, environment, validation, metrics and provenance. Done when Artifact saved on one machine reproduces the result on another and is rejected if provenance is missing. | Priority | Effort | Related | |---|---|---| | P1 | M | B12, B13, S18 | Roadmap item X15 (physics kernel / infrastructure \u2026"},{"n":198,"t":"[X14] Distributed physics: pp.distributed (domain, mesh, experiment and ensemble parallelism)","l":["roadmap","priority: P1","effort: L","area: core-api","roadmap-v2"],"m":null,"c":1,"cr":"2026-10-06","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Distribute not only training but also domains, meshes, simulations, hyperparameter searches, ensembles and benchmarks (pp.distributed.map(simulations, workers=64)). Done when A domain-decomposed training run and a 64-way simulation sweep both run through the module. | Priority | Effort | Related | |---|---|---| | P1 | L | X19 | Roadmap item X14 (physics kernel / infrastructure extension of 2026-10-06; builds \u2026"},{"n":186,"t":"[X2] PhysicsTensor: tensors that know units, domain, components and discretization","l":["roadmap","priority: P0","effort: L","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Add physical semantics on top of torch.Tensor: name, units, dimension, coordinates, domain, time, components, mesh, device, dtype, batch and scientific metadata. Natural operations (u.grad(), u.div(), u.laplacian(), u.integrate(), u.interpolate(mesh)) follow from it. Done when pp.tensor(data, name=..., units=..., domain=...) exists, round-trips through autograd, and rejects incompatible operations (for \u2026"},{"n":185,"t":"[X1] Physics IR: one executable representation of a physical problem","l":["roadmap","priority: P0","effort: L","area: core-api","roadmap-v2"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Context Variables, equations, boundary and initial conditions, geometry and parameters need a single intermediate representation that backends (PyTorch, JAX, FEM, FVM, OpenFOAM) can consume. Today each solver rebuilds the problem on its own. Done when A problem described once as IR can be handed to at least two backends without being re-described, with contract tests. | Priority | Effort | Related | |---|---|---| | \u2026"},{"n":184,"t":"[S35] GPU LBM with adaptive mesh refinement as a solver backend (evaluation)","l":["roadmap","priority: P3","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: josepedro/jp-solver, MIT licence, CUDA C++. Claims from its README, not verified: D3Q19 lattice Boltzmann with three-level AMR, about 3.8 times faster and 2.3 times less memory than a uniform grid on a Taylor-Green case, on an RTX 2060. The library already has a Cartesian LBM with Numba (README, LBM section). The new idea is AMR and a GPU path. Requires CUDA, so it is not a \"any PC\" path; treat it as an \u2026"},{"n":183,"t":"[S34] Browser 3D viewer for twin scenes, without Omniverse","l":["roadmap","priority: P2","effort: M","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: owner's question (2026-10-06): \"how to run something like Omniverse on any PC\". Complements [H2] (OpenUSD export for Omniverse and Isaac Sim) and [H3] (scan to twin). A viewer that opens a twin scene in any modern browser without a GPU workstation: fields, time slider, sensor overlay, validity-domain warning. Reuse the existing three.js visualizer of the CFD product as the starting point. Acceptance \u00b7 A \u2026"},{"n":182,"t":"[S33] Commodity-hardware tier: CPU-first profile with measured time and memory","l":["roadmap","priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: owner's question (2026-10-06): \"how to accelerate simulations and run them on any PC\". Related: [D1] (measured cost), [D8] (resource-aware scheduling), [D3] (memory measurement). Define what \"any PC\" means as tiers (CPU-only laptop, CPU with many cores, one consumer GPU) and measure time and memory for a reference case on each. Publish the tier table with the benchmark. Acceptance \u00b7 A table with measured \u2026"},{"n":181,"t":"[S32] Rocket nozzle benchmark with mesh-independence and isentropic checks","l":["roadmap","priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: owner's list of ideas (2026-10-06): \"realistic CFD example for a rocket\". The library already has the rocketnozzlecfd preset ([E16]); the realistic version is CFD-06 in PINNeAPPle-CFD (phase 1 approved mesh-independence check, phase 2 plume and pad, pending). Port the CFD-06 acceptance checks into the library benchmark: mesh-independence (Mach and shock position between a base and a 1.5\u00d7 refined mesh, target \u2026"},{"n":180,"t":"[S31] Process optimization with operating-limit guards","l":["roadmap","priority: P2","effort: L","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: owner's list of ideas (2026-10-06): \"modules for optimization and data analysis of industrial plant processes with ML and process automation\". Extends [G9] (process optimizer) and [H1] (sensor adapters already exist). The optimizer suggests setpoints; it never writes to a controller. Every suggestion is checked against operating limits (hard constraints from [S23]) and the twin's validity domain from [D7]. \u2026"},{"n":179,"t":"[S30] Stirred exothermic reactor as a digital-twin benchmark case","l":["roadmap","priority: P2","effort: M","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: LinkedIn post by Gabriel Hernandez Rozo: a 2D Python/Numba CFD model of an exothermic reactor with a three-blade impeller and a five-tube cooling system. Claimed: without agitation, conversion stalls near 20 percent with hotspots near 75 \u00b0C; with the impeller, conversion reaches about 75 percent and temperature about 48 \u00b0C, with mass conservation checked. Author's numbers, not verified. Candidate case for \u2026"},{"n":178,"t":"[S29] Public industrial surrogate benchmarks in the protocol","l":["roadmap","priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: Hodges, \"Database of code benchmarks\". The post lists runnable tutorials for surrogates (Transolver, Physics Transformers, DoMINO, GeoPT, PINNs, Mamba-based models) on DrivAerML, AirfRANS, HiLiftAeroML and structural datasets. Add at least two of these public datasets to the benchmark protocol from [B3] and [D5], with the same metrics, cost columns from [D4] and the extrapolation column from [D7]. Acceptance \u2026"},{"n":177,"t":"[S28] Inverse identification of structural parameters from measured displacements","l":["roadmap","priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: owner's list of ideas (2026-10-06): \"inverse modelling with structural mechanics\". Overlaps [K10] and [G5]; this issue is the structural case. Given displacements measured at a few points, identify the unknown parameters (e.g. Young's modulus, load) of the cantilever in examples/calculixcantilever/. Depends on [F1]. Tasks \u00b7 Generate synthetic measurements from CalculiX with known parameters, plus noise. \u00b7 \u2026"},{"n":176,"t":"[S27] One-shot trajectory surrogate for transient structural simulation","l":["roadmap","priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: LinkedIn post by Ben Chang on transformer surrogates for crash FEM. The post says the model is not yet as accurate as FEM and that contact and failure are open problems; no paper with numbers was accessible. Idea: predict the whole transient event in one forward pass instead of rolling out step by step, so errors do not compound over many time steps. Depends on [F1] (CalculiX in the benchmark). Tasks \u00b7 \u2026"},{"n":175,"t":"[S26] Physics-aware field tokenizer (research)","l":["roadmap","priority: P3","effort: L","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: camlab-ethz/Phaedra, paper arXiv:2602.03915, code on GitHub, models on Hugging Face. Phaedra factorizes field data into morphology tokens (finite scalar quantization of spatial structure) and amplitude tokens (approximately continuous magnitudes), to keep dynamic range and conservation properties at high compression. Reported: neural operators on its tokens have 16 to 43 percent lower error than on FSQ \u2026"},{"n":174,"t":"[S25] Preconditioned loss for physics-informed neural operators","l":["roadmap","priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: arXiv:2609.36216, Wen, Mishra, Zeinhofer, \"Preconditioned Physics-Informed Neural Operator Training\". The paper reports that the physics residual loss becomes ill-conditioned as the mesh is refined, and proposes a preconditioned residual loss (geometric and algebraic multigrid) that is architecture-agnostic and adds no inference cost. Claimed results (abstract only, not reproduced here): 4 to 25 times more \u2026"},{"n":173,"t":"[S24] Expert corrections become persistent checks","l":["roadmap","priority: P2","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: notes shared by the owner (2026-10-06); relates to [S8], [S23] and [D7]. Engineers correct or guide automated work. Each correction should become a check that future generated designs must pass, instead of being lost in a chat. Tasks \u00b7 Store a correction as a rule: the case it applies to, the condition, the reviewer, and the date. \u00b7 Run stored rules as part of the trust report from [S8] (status supports / \u2026"},{"n":172,"t":"[S23] Typed design constraints checked in stages","l":["roadmap","priority: P1","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: notes shared by the owner (2026-10-06); relates to [S10], [S13] and [B7]. Separate three kinds of requirements and check them in a fixed order: \u00b7 Hard constraints: must never be violated (e.g. thickness 2 mm, mass 5 mm, T < Tmax). \u00b7 Physics constraints: must hold for the physics (mass and energy conservation, boundary conditions, symmetry, known physical behaviour). \u00b7 Soft objectives: optimized, not enforced \u2026"},{"n":171,"t":"[S22] Dataset coverage and regime audit","l":["roadmap","priority: P1","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Source: notes shared by the owner (2026-10-06), extending [B8] and [S4]. Before training, measure whether a dataset is good enough to trust: \u00b7 Coverage: does the dataset cover the design space? \u00b7 Diversity: are the simulations actually different, or near-duplicates? \u00b7 Physical regimes: laminar/turbulent, low/high Reynolds, attached/separated flow, low/high pressure, thermal regimes. \u00b7 Information density: which \u2026"},{"n":170,"t":"[S21] Tracking issue: five reference demonstrations","l":["roadmap","priority: P1","effort: L","area: apps"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Track the five demonstrations from the strategy (\u00a76): \u00b7 1. Aerospace: wing STEP \u2192 CFD \u2192 operator \u2192 drag/lift \u2192 optimization \u2192 validation \u00b7 2. Automotive: 10k-design factory \u2192 operator \u2192 OOD \u2192 optimization \u00b7 3. Structural: bracket \u2192 FEA \u2192 surrogate \u2192 stress \u2192 mass optimization \u2192 UQ \u00b7 4. Industrial digital twin: surrogate \u2192 sensor stream \u2192 EnKF \u2192 anomaly \u00b7 5. Agentic engineering: cooling-system intent \u2192 five validated \u2026"},{"n":169,"t":"[S20] Geometry as a first-class layer (CAD, B-Rep, SDF, point cloud, mesh, graph)","l":["roadmap","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Cross-cutting, from the strategy's problem 13 and geometric AI. Geometry representations should be interchangeable inputs to the models. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":168,"t":"[S19] Multi-fidelity training from cheap, medium and high-fidelity data","l":["roadmap","priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Cross-cutting, from the strategy's problem 12. Train on a mix of fidelities with explicit weighting. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":167,"t":"[S18] Reproducibility: lineage of commit, environment, seeds and hardware","l":["roadmap","priority: P1","effort: M","area: release-quality"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Cross-cutting, from the strategy's problem 11. Every result records its commit, environment, seeds, hardware and inputs. Acceptance \u00b7 A command reproduces a stored result from its record. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":166,"t":"[S17] Physics foundation and world models (research program)","l":["roadmap","priority: P3","effort: L","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 9. Research program, not a near-term deliverable. Overlaps with [K18] and [K19]; keep the scope there and reference this issue for the strategy. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":165,"t":"[S16] Digital twin runtime with continuous validation and drift monitoring","l":["roadmap","priority: P2","effort: L","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 8. Serve a trained model with sensor input, state estimation and drift alarms tied to the trust envelope. Acceptance \u00b7 A replayed sensor stream triggers a drift alarm when inputs leave the validity domain. Overlaps with the existing issue [K15]; link there. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":164,"t":"[S15] Intent-to-problem compiler (natural language or CAD \u2192 universal problem)","l":["roadmap","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 7 (depends on [S2]). Map engineering intent to physics, geometry, materials and boundary conditions, asking for confirmation where the input is missing. Acceptance \u00b7 Ambiguous inputs produce explicit questions, not silent defaults. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":163,"t":"[S14] Engineering agent over the platform's typed APIs","l":["roadmap","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 7. The agent calls typed, audited tools (problem, simulate, train, validate, optimize, report). It must not bypass the trust layer. Acceptance \u00b7 An end-to-end run from an intent string to a validated report, with every tool call logged. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":162,"t":"[S13] Design loop: requirements \u2192 candidates \u2192 surrogate \u2192 validation \u2192 Pareto","l":["roadmap","priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 6. Connect optimization to the surrogate and to high-fidelity validation of the chosen candidates. Acceptance \u00b7 Given objectives and constraints, the loop returns a Pareto set where each candidate is validated by the solver. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":161,"t":"[S12] Adaptive fidelity: decide surrogate versus solver per request","l":["roadmap","priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 5. Use the surrogate when trust is APPROVED; otherwise call the high-fidelity solver and record why. Acceptance \u00b7 The routing decision and its reason are stored with each request. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":160,"t":"[S11] Generalization suite: geometry, physics, resolution and regime OOD","l":["roadmap","priority: P1","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 4. A model should be tested separately on each kind of out-of-distribution shift: geometry, physics parameters, resolution, regime. Acceptance \u00b7 For each shift type, a train/test split and a reported error, with the suite runnable from the benchmark arena. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":159,"t":"[S10] Automatic conservation and boundary-condition checks","l":["roadmap","priority: P1","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 4. Today these checks are booleans supplied by the caller. Compute them from the physics spec and the model's prediction. Acceptance \u00b7 Mass or energy conservation and boundary-condition violation are computed, not supplied, for at least two benchmark problems. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":158,"t":"[S9] Calibrate trust limits on real surrogates (decision D3)","l":["roadmap","priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 4. The 0.80 score, 60% coverage and 0.7 sub-score limits are provisional. Calibrate them on surrogates with measured error (CFD product: 0.23% to about 10%). Acceptance \u00b7 A calibration note with the data used, the limits chosen and the false approve/reject rates on that data. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":156,"t":"[S7] Physical Data Graph: lineage from problem to prediction","l":["roadmap","priority: P1","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 3. Registry stores exist separately (problem, dataset, model, experiment). Link them. Acceptance \u00b7 Given a prediction, the graph returns problem, geometry, simulation runs, dataset version, model version and validation record. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":155,"t":"[S6] Common PhysicsModel interface over PINN, operator, GNN, ROM and hybrids","l":["roadmap","priority: P1","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 3. One interface for fit, predict, uncertainty and export, independent of architecture. Acceptance \u00b7 The existing PINN, neural operator and ROM implementations satisfy the interface, with contract tests. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":154,"t":"[S5] Model selector: compare PINN, operator, GNN and ROM on a benchmark","l":["roadmap","priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 3. Today the user picks the architecture. The selector should benchmark candidates on the same data and report the winner with its validity domain. Acceptance \u00b7 For one problem, the selector returns a ranked table with error, cost and domain of validity for each candidate. Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":153,"t":"[S4] Active learning: choose the next simulations from uncertainty","l":["roadmap","priority: P1","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 2. Train, find uncertainty and out-of-distribution regions, run the expensive simulation there, retrain. Tasks \u00b7 Acquisition function over the surrogate's uncertainty. \u00b7 Loop wired to the factory from [S3]. Acceptance \u00b7 On a benchmark case, the loop reaches a target error with fewer simulations than a random design (measured, not assumed). Source: docs/strategy/STRATEGYPHYSICSAI.md (PR #149)."},{"n":152,"t":"[S3] Generic simulation factory (CAD \u2192 DOE \u2192 solver \u2192 dataset \u2192 QC)","l":["roadmap","priority: P1","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 2. The CFD product runs this pipeline only for pipe erosion. Generalize it. Tasks \u00b7 Parameterize geometry, DOE, solver choice and dataset writer behind interfaces. \u00b7 Add quality control: failed runs, convergence and mesh checks recorded as proofs (supports/contradicts/notrun). Acceptance \u00b7 The pipe-erosion case runs through the generic factory with the same results as the current pipeline. Source: \u2026"},{"n":151,"t":"[S2] Universal physical problem as a fa\u00e7ade over the reconciled spec","l":["roadmap","priority: P0","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 1 (depends on [S1]). Single entry point that describes a physical problem: objectives, constraints, geometry reference, physics, boundary conditions, outputs, fidelity. Tasks \u00b7 Implement the fa\u00e7ade on top of the reconciled spec from [S1]. \u00b7 Serialize to and from JSON. Acceptance \u00b7 A problem created in one place can be compiled into the PDE spec and into the elicited spec without re-entering data. Source: \u2026"},{"n":150,"t":"[S1] Reconcile the three problem specifications (decision D1)","l":["roadmap","priority: P0","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-06","up":"2026-10-06","p":null,"s":0,"a":false,"x":"Phase 1 of the strategy. Three overlapping specs exist: pinneappleproblemdesign/schema.py::ProblemSpec (elicited problems), pinneapplephysics/pdeenvironment/spec.py::ProblemSpec (PDEs), and pinneappledata/updtypes.py::ConditionSpec. Tasks \u00b7 Write a decision record listing the fields of each and the overlaps. \u00b7 Define explicit converters between them, with round-trip tests. \u00b7 Do not add a new class in this issue. \u2026"},{"n":142,"t":"[J8] Job queue and metering for the reference apps","l":["help wanted","roadmap","priority: P3","effort: L","area: apps"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Queueing and usage metering in the apps are stubs. Implement them only once real usage shows which tasks repeat; until then keep the stubs documented as such. Done when Decision recorded after real usage data; if implemented, a queue with limits and per-job usage records. | Priority | Effort | Target | |---|---|---| | P3 | L | unscheduled | Roadmap item J8 (plan of 2026-10-03). Contributions welcome: comment \u2026"},{"n":141,"t":"[J5] Document the \"simulation to surrogate in a day\" reference workflow","l":["help wanted","roadmap","priority: P2","effort: M","area: apps"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Write the end-to-end workflow with its deliverables (surrogate, validation report, inference API, benchmark table), expected time and limits, using only open data. Done when A tutorial reproduces the workflow from a public case and produces all four deliverables. | Priority | Effort | Target | |---|---|---| | P2 | M | unscheduled | Roadmap item J5 (plan of 2026-10-03). Contributions welcome: comment here \u2026"},{"n":140,"t":"[J4] Public leaderboard tied to the benchmark protocol","l":["roadmap","priority: P1","effort: L","area: apps"],"m":"v0.8.0","c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context A leaderboard should only accept results that follow the benchmark protocol and carry provenance, so entries are reproducible and comparable. Done when A submission without the required provenance or protocol fields is rejected with a clear message; accepted entries link to their evidence record. | Priority | Effort | Target | |---|---|---| | P1 | L | 0.8.0 | Roadmap item J4 (plan of 2026-10-03). \u2026"},{"n":139,"t":"[J3] Decide how the reference apps consume the library","l":["help wanted","roadmap","priority: P2","effort: S","area: apps"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context The apps live in the same repository as the library. Decide whether they stay there or depend on the published package, to avoid coupling release cycles. Done when The decision is recorded and applied (dependency pinned to a released version, or an explicit monorepo policy). | Priority | Effort | Target | |---|---|---| | P2 | S | unscheduled | Roadmap item J3 (plan of 2026-10-03). Contributions welcome: \u2026"},{"n":138,"t":"[J2] Build the reference-app Docker images in CI with a smoke test","l":["roadmap","priority: P1","effort: M","area: apps"],"m":"v0.8.0","c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context The images could not be built in the development environment because the PyTorch package index was unreachable there. Build them in CI and run a smoke test per app. Done when CI builds every app image and a smoke test hits each health endpoint. | Priority | Effort | Target | |---|---|---| | P1 | M | 0.8.0 | Roadmap item J2 (plan of 2026-10-03). Contributions welcome: comment here before starting so work is \u2026"},{"n":137,"t":"[J1] Reference apps in production: measure usage and tune limits","l":["roadmap","priority: P1","effort: S","area: apps"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context The data apps under apps/ are deployable. Add basic usage metrics, document upload and concurrency limits, and note what to tune after a week of real use. Done when A short operations note with measured limits, and metrics that can be read without extra tooling. | Priority | Effort | Target | |---|---|---| | P1 | S | unscheduled | Roadmap item J1 (plan of 2026-10-03). Contributions welcome: comment here \u2026"},{"n":136,"t":"[G4] PINN surrogate in parametric studies","l":["roadmap","priority: P1","effort: M","area: surrogates-optimization"],"m":"v0.8.0","c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context A parametric-study surrogate of type pinn is not run today. It needs per-sample fields, domain sampling driven by the mesh, and a 2-D case check. Done when A parametric study with a PINN surrogate runs and its result enters the study report. | Priority | Effort | Target | |---|---|---| | P1 | M | 0.8.0 | Roadmap item G4 (plan of 2026-10-03). Contributions welcome: comment here before starting so work is not \u2026"},{"n":135,"t":"[F9] Provenance and labelling of erosion-model constants","l":["help wanted","roadmap","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Erosion results depend on constants taken from secondary sources. Every result should carry a visible \"preliminary\" label until the constants are checked against the primary sources, and accuracy targets should exist for the quantities that are validated. Done when Constants are stored with their source and verification status; results print the label while any constant is unverified. | Priority | Effort | \u2026"},{"n":134,"t":"[F7] Test remote solver execution against a real server","l":["help wanted","roadmap","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Remote (SSH) execution of solver runs has only been tested with a fake transport. Point it at a real host and test it, including failure and retry paths. Done when A solver case runs on a remote host and returns with provenance; the test is documented so anyone with a host can repeat it. | Priority | Effort | Target | |---|---|---| | P2 | M | unscheduled | Roadmap item F7 (plan of 2026-10-03). Contributions \u2026"},{"n":133,"t":"[F6] Wall prism layers and target y+ in the OpenFOAM case generator","l":["help wanted","roadmap","priority: P2","effort: L","area: solvers"],"m":"v0.9.0","c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Isotropic meshes never reach the asymptotic range of a grid-convergence study for wall-driven quantities such as erosion. The case generator needs prism layers at walls with a target y+. Done when A generated case with prism layers reaches the asymptotic range in a grid-convergence (GCI) study on a reference case. | Priority | Effort | Target | |---|---|---| | P2 | L | 0.9.0 | Roadmap item F6 (plan of \u2026"},{"n":132,"t":"[F5] OpenFOAM connector: document and test the known numerical limits","l":["help wanted","roadmap","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context buoyantSimpleFoam, buoyantPimpleFoam and interIsoFoam hit real numerical limits in earlier case campaigns, and free-surface flow with k-omega SST was never run for real. Decide for each whether to accept the limit (and document it in the connector) or change the numerical approach. Done when A decision per solver is recorded in the docs, the free-surface SST case runs or is documented as unsupported, and a \u2026"},{"n":131,"t":"[D8] Feed measured cost into resource-aware scheduling","l":["help wanted","roadmap","priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-04","up":"2026-10-04","p":null,"s":0,"a":false,"x":"Context Operations are tagged by resource kind (CPU light, CPU heavy, GPU preferred, I/O bound) with static labels. Derive the kind and the expected cost from measurements made with pinneappleanalysis.cost. Done when A scheduler or job profile table is generated from measured cost and records the machine it was measured on. | Priority | Effort | Target | |---|---|---| | P2 | M | unscheduled | Roadmap item D8 (plan \u2026"},{"n":119,"t":"[K20] Energy and emissions in the cost report","l":["help wanted","roadmap","priority: P3","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-03","up":"2026-10-03","p":null,"s":0,"a":false,"x":"Context Measure energy and emissions per operation in addition to time and FLOPs, with the cost module. A selling point for edge twins. Done when The report includes estimated joules with a declared method. | Priority | Effort | Target | |---|---|---| | P3 | M | unscheduled | Roadmap item K20 (plan of 2026-10-03; see the \"Standing requirements\" section of ROADMAP.md). Contributions welcome: comment here before \u2026"},{"n":118,"t":"[K19] Stochastic PDEs and rare events","l":["help wanted","roadmap","priority: P3","effort: L","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-03","up":"2026-10-03","p":null,"s":0,"a":false,"x":"Context Absent. Stochastic PDEs and rare-event (importance) sampling; useful for climate, finance and reliability. Done when A reference case with a known solution. | Priority | Effort | Target | |---|---|---| | P3 | L | unscheduled | Roadmap item K19 (plan of 2026-10-03; see the \"Standing requirements\" section of ROADMAP.md). Contributions welcome: comment here before starting so work is not duplicated. --- \u2026"},{"n":117,"t":"[K18] Physics foundation models and a fine-tuning recipe","l":["help wanted","roadmap","priority: P3","effort: L","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-03","up":"2026-10-03","p":null,"s":0,"a":false,"x":"Context Partial. Large-physics-model blocks and a hub with cards exist. A standard fine-tuning routine for small datasets and its benchmark evaluation are missing. Done when A pretrained model fine-tuned on 5% of the data reaches a defined error in the benchmark. | Priority | Effort | Target | |---|---|---| | P3 | L | unscheduled | Roadmap item K18 (plan of 2026-10-03; see the \"Standing requirements\" section of \u2026"},{"n":116,"t":"[K17] ParaView plugin and notebook widgets","l":["help wanted","roadmap","priority: P3","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-03","up":"2026-10-03","p":null,"s":0,"a":false,"x":"Context To verify. A ParaView plugin or filter for surrogates and reports; Jupyter widgets to explore the design space. Done when Open a surrogate in ParaView and vary parameters interactively. | Priority | Effort | Target | |---|---|---| | P3 | M | unscheduled | Roadmap item K17 (plan of 2026-10-03; see the \"Standing requirements\" section of ROADMAP.md). Contributions welcome: comment here before starting so work \u2026"},{"n":115,"t":"[K16] Format interoperability (XDMF, CGNS writer, STEP, SSP)","l":["help wanted","roadmap","priority: P2","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-03","up":"2026-10-03","p":null,"s":0,"a":false,"x":"Context Partial. Readers for CGNS, Exodus, Fluent and OpenFOAM and a USD writer exist. XDMF, CGNS writing, full STEP and SSP are missing. Done when Lossless round trip of fields in the promised formats. | Priority | Effort | Target | |---|---|---| | P2 | M | unscheduled | Roadmap item K16 (plan of 2026-10-03; see the \"Standing requirements\" section of ROADMAP.md). Contributions welcome: comment here before starting \u2026"},{"n":114,"t":"[K15] Model monitoring in production (drift and envelope alarms)","l":["help wanted","roadmap","priority: P2","effort: M","area: ecosystem"],"m":null,"c":0,
