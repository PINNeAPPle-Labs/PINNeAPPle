"experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A fixed set of natural-language object descriptions is passed through the existing intent-to-design path, and each result is scored on three things: did the parser read the requirements correctly, did the resulting object pass its physics check, and is it buildable. The output is a success rate with its failure breakdown, compared against a hand-made CAD answer on a small subset. The \u2026"},{"n":1361,"t":"BIG HERO SWARM: a swarm that loses a fifth of its units and keeps holding the object","l":["enhancement","priority: P3","effort: L","uq","agents","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A population of small units clings to a load-bearing frame, and the frame is then damaged by removing a stated fraction of the units. The experiment asks whether the remaining units can reorganise to keep the load carried, and reports the fraction at which they cannot. Physics is the interesting part and it is ordinary: adhesion and per-unit force budgets, the global stability of the assembled \u2026"},{"n":1360,"t":"CAUSALITY LAB: closed timelike curves, and whether the equations admit a consistent history","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Trajectories are integrated in a spacetime whose causal structure contains closed timelike curves, and the experiment maps where self-consistent histories exist and where the constraint set is empty, as a function of the metric parameters. The local physics is well defined everywhere; what the experiment interrogates is the global consistency condition, which is the standard way this subject \u2026"},{"n":1359,"t":"TIME DILATION ENGINE: two clocks, two histories, one number","l":["enhancement","priority: P2","effort: M","solvers","benchmark","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Proper time is integrated along two trajectories \u2014 one that stays and one that travels fast, sits in a gravity well, or both \u2014 and the accumulated difference is reported with a numerical error analysis. The physics is special and general relativity in the weak field, where the answer is closed-form in each limit. The value of the experiment is the verification discipline: the integrator is \u2026"},{"n":1358,"t":"QUANTUM TELEPORTER: a state that moves without a particle moving, and its fidelity","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary The standard quantum teleportation protocol is simulated on a small register: prepare an unknown single-qubit state, distribute a Bell pair, perform a Bell-basis measurement on the input and one half of the pair, send the two classical bits, and apply the corresponding correction. The experiment reports the fidelity of the recovered state against the prepared one, as a function of the noise \u2026"},{"n":1357,"t":"SPACE FOLDER: a metric that shortens a path, and the price of the deformation","l":["enhancement","priority: P3","effort: M","solvers","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A spatial metric is deformed so that a path which is long in flat space becomes short, geodesics are integrated in the deformed geometry, and the experiment then computes what the deformation costs under the field equations: the curvature, the stress-energy that sources it, and the energy density an observer would measure. The geometry half is textbook differential geometry and the result \u2026"},{"n":1356,"t":"MATTER TRANSPORTER: what it costs to reconstruct an object from its description","l":["enhancement","priority: P3","effort: M","data","benchmark","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary An object is described as a voxel field with a material state per voxel, the description is encoded, transmitted as a bit stream and reconstructed, and the experiment measures two things: the geometric and material error of the reconstruction as a function of the bit budget, and the information bill for a stated resolution. The physical content is the accounting, not the transport: the bit \u2026"},{"n":1355,"t":"ARTIFICIAL GRAVITY GENERATOR: a ring that spins, and the comfort it can and cannot buy","l":["enhancement","priority: P3","effort: M","uq","visualization","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A rotating habitat is sized for a target apparent gravity, and the experiment measures what the rotation costs: the gravity gradient across a standing body, the Coriolis deflection of a thrown object, the hoop stress in the ring and the structural mass it implies. The principle is established and the physics is ordinary; the value of the experiment is that the trade between radius, rotation \u2026"},{"n":1354,"t":"WORMHOLE LAB: light through a throat that may not exist","l":["enhancement","priority: P3","effort: M","solvers","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Null geodesics are integrated through a Morris\u2013Thorne-type traversable wormhole metric, and the ray-marching renderer produces what a distant observer would see: the throat, its Einstein-ring structure, the multiple images of a background star field, and the shadow. Separately, the metric's throat parameters are fed to an energy-condition calculation and the violation at the throat is reported \u2026"},{"n":1353,"t":"EARTHQUAKE SHIELD: a foundation whose stiffness changes during the shaking","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A building sits on adaptive isolators whose stiffness and damping are scheduled during the shaking, and the experiment asks how much peak floor acceleration that schedule buys against a set of recorded ground motions, relative to the passive isolation that already exists. The soil column and the building are coupled through a layered site response, the excitation is a set of real \u2026"},{"n":1352,"t":"REGENERATIVE STRUCTURE: a crack, a repair, and how much of the strength comes back","l":["enhancement","priority: P2","effort: M","uq","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A cracked member is repaired by an activated material that fills or bridges the crack, and the experiment measures how much of the original stiffness and strength comes back and where the new stress concentration appears. The physics is linear elastic fracture mechanics with a repair patch that has its own modulus and a finite bond strength. The result is a percentage, not a demonstration: \u2026"},{"n":1351,"t":"SONIC CLOAK: an acoustic metamaterial that hides a region at one frequency band","l":["enhancement","priority: P3","effort: M","design-optimization","solvers","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A shell of structured material surrounds a target and reduces the acoustic pressure it scatters over a stated frequency band. The experiment solves the Helmholtz equation on the exterior region with the shell, optimises the material distribution with physical bounds, and reports the scattering reduction as a function of frequency together with the material parameters the design demands. The \u2026"},{"n":1350,"t":"ACTIVE CAMOUFLAGE SKIN: a surface that matches what is behind it, from a stated viewpoint","l":["enhancement","priority: P3","effort: M","design-optimization","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A panel array on a body whose local reflectance and emission are set per panel is optimised so that the rendered appearance of the body matches its background from a defined set of viewpoints and wavelengths. The physics is radiometry, not texture animation: the result is an image difference, and its value depends entirely on the observer, the illumination and the band. The experiment's honest \u2026"},{"n":1349,"t":"GRAVITY-FREE PLATFORM: a stage that holds a load without touching it","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A magnetically levitated stage holds a payload at a controlled gap against a disturbance, and the experiment reports the three numbers that decide whether such a stage is usable: the levitation stiffness, the closed-loop disturbance-rejection bandwidth, and the load range over which both hold. The physics is magnetostatics plus eddy currents and a control loop that exists only because the \u2026"},{"n":1348,"t":"FUELLESS DEEP SPACE CRAFT: a sail, its trajectory, and the patience it needs","l":["enhancement","priority: P3","effort: M","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A thin reflective membrane changes a heliocentric orbit using solar radiation pressure alone, and the experiment optimises the attitude history that achieves a stated transfer. The object is not the sail concept but the trajectory: given an areal density, a reflectance model and a start and end orbit, what change is available, how long it takes, and how much of the answer is lost to wrinkling \u2026"},{"n":1346,"t":"OMNIVEHICLE: one machine for air, surface and water, with the trade-off shown","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary One vehicle that flies, floats and dives by reconfiguring. The experiment does not try to show that such a vehicle is a good idea; it quantifies the conflict. Mass and buoyancy must close in three media, aerodynamic and hydrodynamic requirements pull the hull in opposite directions, and the transition states \u2014 crossing the surface \u2014 are where the assumptions of both models fail. The \u2026"},{"n":1345,"t":"INSTANT EXOSUIT: armour that folds out of a pack and takes the load","l":["enhancement","priority: P3","effort: L","design-optimization","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A deployable exoskeleton that folds out of a pack, locks its joints around a body model and routes actuator torque so that lifting a load produces acceptable joint moments. The experiment designs the frame and the torque distribution, checks the deployed structure under the lift load, and reports the margins. It makes no human-safety claim: the numbers are mechanical, and the issue says so in \u2026"},{"n":1344,"t":"AUTONOMOUS WORLD BUILDER: robots that assemble a station without a foreman","l":["enhancement","priority: P3","effort: L","orchestration","agents","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Many units ferry and attach modules in orbit under a coordination policy, and the experiment scores the assembly: total propellant, elapsed time, and \u2014 the constraint that kills most real plans \u2014 whether the structure is stable at every intermediate step, not only when it is finished. It is a planning experiment wrapped around a rigid-body orbital simulation and a structural check that runs \u2026"},{"n":1343,"t":"T-1000 LAB: a liquid-metal machine, and the physics that refuses it","l":["enhancement","priority: P3","effort: L","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Liquid metal that splits into limbs, holds a shape and reforms, as in the film. The experiment takes the premise seriously and computes, in order, why it fails: surface tension dominates at the scale where a droplet is small, a free liquid cannot sustain a bending moment, and any shaping mechanism must produce a body force comparable with the capillary pressure. The expected verdict is \u2026"},{"n":1342,"t":"PORTAL ENGINE: two rooms joined at a boundary, and what the fields do there","l":["enhancement","priority: P3","effort: M","solvers","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Two separated three-dimensional rooms are meshed independently and identified along a pair of matching boundary patches, so that a flow entering one leaves the other. The field problem is ordinary finite-volume work once the identification is imposed; what the experiment produces is the price of the identification. Specifically: what happens to mass, momentum, energy and to a potential field \u2026"},{"n":1341,"t":"INERTIA CONTROL LAB: making a payload feel less of a manoeuvre","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A rigid payload sits on a platform that carries internal moving masses and dampers, and the platform is driven by a prescribed maneuver acceleration history. The experiment asks how much of that acceleration reaches the payload, and what the platform pays in stroke and actuator force to achieve it. The claim it can support is narrow: for a stated stroke budget and force budget, peak payload \u2026"},{"n":1340,"t":"WALKING INDUSTRIAL MEGASTRUCTURE: a factory that steps over the terrain","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A legged platform some 50 m across and several hundred tonnes walks over unprepared ground while keeping its deck level. The ground decides whether it works: pad bearing pressure sets pad size, pad size sets leg mass, mass sets pressure again. The experiment couples a multibody gait to a Bekker\u2013Wong foot\u2013soil model across a terrain ladder and reports ground pressure, energy per metre, maximum \u2026"},{"n":1339,"t":"SHAPE-SHIFTING MATTER: one population of modules, several machines","l":["enhancement","priority: P3","effort: L","agents","design-optimization","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary One fixed inventory of identical modular units is re-planned, without new parts, into a two-wheeled vehicle, a quadrotor frame and a serial manipulator arm. Unit mass and connector strength decide which configuration survives, and each assembly is checked against its own structural and mass/power budget. The claim it supports is a boundary in the module-count versus connector-strength plane, \u2026"},{"n":1338,"t":"3-D field animation over a CAD wireframe: free surface coloured by a field, plume, one frame per saved time","l":[],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"A visualisation built in a downstream CFD project (two-phase jet into an open channel, VOF) turned out to be the clearest way to show a transient run to non-specialists. It should live in the library, so any case can produce it, and not as a script inside one study. Per frame (one per saved time, nothing interpolated), it draws: \u00b7 the geometry's feature edges, read from the CAD (STEP) and drawn as thin white lines \u2026"},{"n":1337,"t":"OMNIMATTER: speak a part, and matter arranges itself into it","l":["enhancement","priority: P3","effort: L","llm","agents","design-optimization","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A sentence describes a part \u2014 \"a bracket that holds 20 kg over a 200 mm span\" \u2014 and the system turns the intent into a geometry, plans how a population of modular units assembles it, checks the assembled part mechanically, and reports whether it is feasible, how long the assembly takes and what is missing. The language is the interface; the physics is the referee. A request that cannot be met \u2026"},{"n":1336,"t":"CHRONOSCOPE: reconstructing a past state from what is left of it","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Reconstructing a past state from what is left of it: sparse, noisy measurements taken later are inverted to recover an earlier field, with a reported uncertainty. The physics is a backward parabolic problem, which is ill-posed \u2014 small errors in the data grow exponentially backwards \u2014 so the experiment is about regularisation, about how much information genuinely survives, and about the number \u2026"},{"n":1335,"t":"TEMPORAL LOOP: a system that returns to its own initial state, and the dynamics that follow","l":["enhancement","priority: P3","effort: S","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A dynamical system that returns to a neighbourhood of its own initial state at fixed intervals: a reset map applied to a nonlinear system. The experiment maps what the closed loop does \u2014 fixed point, period doubling, chaos, collapse to a different attractor \u2014 as a function of how much of the state is reset and how often. It is explicitly a mathematical analogy for loops in narrative and in \u2026"},{"n":1334,"t":"MOLECULAR LOCK: a cage that closes on a particle and opens on command","l":["enhancement","priority: P3","effort: L","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A coarse-grained molecular assembly closes around a payload and releases it when the interaction parameters change. The experiment computes the free-energy difference between the open and closed states, so the preference for one over the other is a number with an error bar rather than an observation that the cage \"looked closed\". It is deliberately coarse-grained: beads with bonded and \u2026"},{"n":1333,"t":"ACTIVE MATTER: a crowd of units that organises itself, and the parameters where it stops","l":["enhancement","priority: P3","effort: M","uq","solvers","benchmark","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Active particles that convert energy into motion, with alignment and noise: the experiment maps the order\u2013disorder transition, the clustering regime and the collapse regime as a function of density, noise and alignment strength, and compares the phase diagram with the known Vicsek-style results. The deliverable is the phase diagram with error bars, not a swirling particle render \u2014 the render \u2026"},{"n":1332,"t":"THERMAL MORPH: a part that changes function with temperature","l":["enhancement","priority: P3","effort: M","solvers","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A member that assumes one configuration when hot and another when cold, executing a mechanical task with no motor: a clamp that grips, a lock that releases. The experiment designs the layer stack and the thermal profile for a target stroke and force, and validates against the classical bimetal curvature formula before any shape-memory claim is made \u2014 so the physics is anchored in a closed form \u2026"},{"n":1331,"t":"FERROFLUID ARCHITECT: shapes a magnetic field can command, and the ones it cannot","l":["enhancement","priority: P2","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A ferrofluid surface under a variable magnetic field: it forms spikes, rings and other three-dimensional patterns, and the experiment asks which field produces a target shape, at what stability margin, and \u2014 first \u2014 whether the simulation reproduces the classical linear-stability result the phenomenon is known for. The last point is what separates this issue from a pretty fluid demo: the \u2026"},{"n":1330,"t":"NANOORIGAMI: a flat sheet that folds itself into a 3-D shape","l":["enhancement","priority: P2","effort: M","design-optimization","geometry","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A flat plate with programmed hinge lines folds itself into a three-dimensional shape when a stimulus is applied, and the design variable is the layout of hinges and the actuation field. The experiment asks how accurately a target shape can be reached, and \u2014 the part that is usually missing \u2014 whether the folded state is stable, whether the sheet self-intersects on the way, and whether the same \u2026"},{"n":1329,"t":"LES surrogate for parametric studies: a DOE on statistics, with a validity domain that refuses","l":["enhancement","priority: P3","effort: M","surrogate","solvers"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Related: #601, #603, and the a-posteriori issue. Summary An LES is too expensive to run inside an optimisation loop, which is exactly where a designer wants it. A surrogate trained on a DOE of LES runs can answer \"what do the statistics do if I change this\" in milliseconds \u2014 provided it knows where it stops being valid. This issue builds the LES-specific DOE, the surrogate on the statistics rather than on the field, \u2026"},{"n":1328,"t":"OpenFOAM LES path: the case, the delta from the mesh, and a comparison against the PINN-LES","l":["enhancement","priority: P2","effort: M","meshing","solvers"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Related: #601, #475 (PyFR LES bridge), #273 (JHU turbulence data). Summary The OpenFOAM bridge can stage a case, mesh it, run it and read the fields back, and the preflight already knows which fields each LES closure writes. What is missing is the LES itself: a case whose turbulenceProperties selects a subgrid model, whose delta comes from the mesh instead of a guessed number, whose time step is held by a Courant \u2026"},{"n":1327,"t":"A subgrid closure trained through the 3-D solver, compared with the a-priori learned one","l":["enhancement","priority: P2","effort: L","surrogate","solvers"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Follows pinneapplephysics.multiscale.sgs3d.learnsgsstress. Related: #601, #603. Summary The learned closure in the a-priori benchmark is trained on filtered pairs and then scored; it never runs inside a solver, so nothing forces it to be stable or to get the transfer right. Training the closure through short differentiable LES rollouts is the standard fix. In 2-D it exists here (trainclosureaposteriori on \u2026"},{"n":1326,"t":"WMLES and DES: a wall model and a RANS/LES length-scale blend, checked on a channel at Re_tau 395","l":["enhancement","priority: P3","effort: L","solvers"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Follows the LES closures in pinneapplephysics.pdeenvironment.turbulencepresets. Related: the a-posteriori issue and #444 (validated turbulence). Summary The three shipped closures are free-shear closures: they assume the wall layer is resolved, which at an engineering Reynolds number it is not. This issue adds the two standard ways of not resolving it \u2014 a wall model (WMLES) and a RANS/LES blend (DES) \u2014 with an \u2026"},{"n":1325,"t":"A-posteriori 3-D LES: score each subgrid closure on resolved statistics against the filtered DNS","l":["enhancement","priority: P2","effort: L","solvers","benchmark"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Related: #601 (closure benchmarking), #603 (scale-driven fidelity). Follows the a-priori benchmark that already exists in pinneapplephysics.multiscale.sgs3d. Summary The a-priori benchmark scores the stress a filter removes. It says nothing about what happens when a closure's error feeds back into the resolved scales: a closure can correlate poorly a priori and still run a stable LES, or correlate well and blow up. \u2026"},{"n":1324,"t":"NANOTURBINE: a rotor that assembles itself in a fluid and then pumps","l":["enhancement","priority: P3","effort: L","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Helical blades and a shaft assemble from suspended particles in a viscous fluid, and then the assembly rotates under an applied torque and drives a flow. The experiment reports volumetric flow per unit torque, the stability of the assembly while it turns, and the Reynolds number at which the result stops being transferable to anything larger \u2014 because at low Reynolds number a rotor that works \u2026"},{"n":1323,"t":"LIVING LATTICE: one architecture, several mechanical functions, chosen by topology","l":["enhancement","priority: P3","effort: L","design-optimization","geometry","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A lattice of units occupying fixed positions, where the design variable is which neighbours are physically joined. The same population must deliver three different mechanical functions in sequence \u2014 high stiffness, high energy absorption, and a compliant load path \u2014 by re-forming its connections. The distinguishing requirement is reachability: a configuration is only a result if the structure \u2026"},{"n":1322,"t":"NANOSWARM: a gripper that emerges from magnetic particles under an applied field","l":["enhancement","priority: P3","effort: L","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A cloud of superparamagnetic particles under a time-varying magnetic field aggregates into fingers, a palm and an opposing thumb, closes on a sphere, and then reconfigures into a three-finger tool. The experiment computes the field sequence that produces each shape without letting the particles collapse into an uncontrolled clump, and it reports the grip force the assembly can actually \u2026"},{"n":1321,"t":"WAVE EATER: a floating structure that changes shape to take energy from the waves","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A floating wave-energy converter whose geometry or stiffness changes with the sea state: the device reconfigures so that its resonant response tracks the incoming spectrum, and the experiment optimises that schedule for captured energy over a year of sea states while respecting mooring and structural loads. The honest core is the coefficient source \u2014 radiation and diffraction data must come \u2026"},{"n":1319,"t":"VORTEX RIDER: thrust from vortex rings, measured rather than implied","l":["enhancement","priority: P3","effort: L","solvers","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A pulsed jet forms vortex rings and a body reacts to them. The experiment measures impulse per unit energy for a family of nozzle shapes and pulse frequencies, and \u2014 this is the part that is usually skipped \u2014 verifies the thrust by integrating the momentum flux through a control surface, not by applying a formula to an animation. The report places every design on a bound: the mean thrust \u2026"},{"n":1318,"t":"BLOOM TURBINE: a rotor whose blades open as the wind rises","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A small wind rotor whose blades are articulated: they can fold toward the hub and change pitch, so the rotor presents a different solidity and a different blade geometry as the wind changes. The experiment optimises the blade shape and the fold/pitch schedule for annual energy at a stated site, subject to a thrust limit and a cut-out condition \u2014 and then checks the cheap model it optimised \u2026"},{"n":1317,"t":"SKYBRAKE: a capsule that steers its own entry with movable surfaces","l":["enhancement","priority: P3","effort: L","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A re-entry capsule with deployable aerodynamic surfaces steers its own descent. The experiment optimises the control schedule \u2014 when to deflect which surface, by how much \u2014 against three competing limits: landing dispersion, deceleration on the payload, and peak heat flux. The trajectory that comes out is not authored: it is what the optimiser produces when it has to trade those three against \u2026"},{"n":1316,"t":"CLIMATE SKIN: a facade whose panels move, and what that does to the wind around a building","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A building envelope of actuated panels: each panel has one controllable angle, and the array is optimised so that the flow around the building does what the occupants need \u2014 less mean and peak load on the structure, or more ventilation at a target location. The physics is ordinary external aerodynamics at building Reynolds numbers; the experiment's content is the coupling between a geometry \u2026"},{"n":1315,"t":"MICROFACTORY: an assembly line inside a channel","l":["enhancement","priority: P3","effort: M","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Components of order 1-100 \u00b5m suspended in a channel are carried by a creeping flow past a designed obstacle landscape and bind at stations into a small assembly. The run reports yield \u2014 assemblies completed per unit time, component waste fraction, blockage rate \u2014 per layout and flow rate. The components are point particles with prescribed binding rules, so the claim is about a transport scheme \u2026"},{"n":1314,"t":"SELF-HEALING MACHINE: a truss that breaks, and then repairs itself","l":["enhancement","priority: P2","effort: M","uq","solvers","fem","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A truss of order 10^2 mesoscale members, each a lattice unit rather than an atom, is loaded, loses members, and is repaired by mobile units that migrate into the gap and re-form them. Comparing intact, damaged and repaired states on one load case yields recovered stiffness per unit of added mass and energy: a claim about a repair policy, not about a self-healing material. Question On one load \u2026"},{"n":1313,"t":"MORPHOGENESIS: units that assemble themselves into a part, take it apart and build another","l":["enhancement","priority: P2","effort: L","agents","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Up to 20 000 mesoscale units, 0.5 mm to 2 mm (a design choice, not atoms), carry a few binding states and start dispersed. Agitation anneals them into a gear; a command switches the states and the same population re-forms as a gripper. The claim is narrow: a target shape is reached with a measured defect rate, at a computed reconfiguration cost. This models rules on units, not a material. \u2026"},{"n":1312,"t":"AERODYNAMIC EVOLUTION: a body whose shape evolves to cut drag, generation by generation","l":["enhancement","priority: P2","effort: L","design-optimization","solvers","geometry","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary AERODYNAMIC EVOLUTION evolves a parametric three-dimensional body \u2014 a simplified passenger car and an axisymmetric bluff body \u2014 to cut drag at fixed frontal area and volume. Geometry comes from signed distance fields, evaluation from RANS with a stated turbulence model, and the search is surrogate-assisted so CFD budget goes where the ranking is uncertain. The claim: the final body's drag \u2026"},{"n":1311,"t":"THERMAL ORGANISM: a heat sink the optimiser grows, branch by branch","l":["enhancement","priority: P2","effort: L","design-optimization","solvers","geometry","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary THERMAL ORGANISM is a heat sink grown by topology optimization inside a fixed footprint and volume: one density field decides where metal and where coolant go, minimizing thermal resistance under a pressure-drop budget. The optimiser uses a single-domain Brinkman model; the claim rests on extracting a manufacturable fin set and re-solving it as a two-region conjugate case. Question At fixed \u2026"},{"n":1310,"t":"VORTEX TREE: a 3-D manifold a topology optimiser grows to spread flow evenly at minimum loss","l":["enhancement","priority: P2","effort: L","design-optimization","solvers","geometry","experiment"],"m":null,"c":0,"cr":"2026-11-04","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of #1288. Summary VORTEX TREE is a three-dimensional internal manifold: one inlet, eight outlets, fixed split, minimum total pressure loss under a uniformity constraint on the outlet fluxes. The geometry comes from Brinkman-penalized Stokes topology optimization, is remeshed body-fitted and re-solved with incompressible RANS. The claim: a 3-D optimum beats a bifurcating manifold of equal solid volume at the \u2026"},{"n":1309,"t":"GRANULAR CONSTRUCTOR: a pile of grains that becomes a bridge and then an arch","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A few thousand mesoscale grains (0.5 mm to 5 mm equivalent diameter, a design choice, not atoms) with controlled shape and Coulomb friction are driven from a loose poured state into a bridge that carries a specified load, then re-driven into an arch when the load path reverses. Actuation is base vibration or a magnetic body force on functionalized grains. The claim is narrow: for this grain \u2026"},{"n":1308,"t":"INVERTED WORLD: a vehicle that drives on a ceiling, and what holds it there","l":["enhancement","priority: P3","effort: M","solvers","geometry","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary INVERTED WORLD is a six-wheeled vehicle that drives across a floor, up a wall, around a curved corner and onto a ceiling, with an explicit adhesion mechanism whose force budget is modelled rather than assumed. The experiment returns the adhesion-to-weight ratio at which each transition stops, and which wheel loses contact first. Question For a stated adhesion mechanism and force density, what \u2026"},{"n":1307,"t":"HYDROFLIGHT: a hull that leaves the water and flies on foils","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary HYDROFLIGHT is a hull that leaves the water and continues on foils. The experiment builds the resistance curve, the take-off speed and the incidence schedule in a cheap lifting-line model, then checks one configuration against free-surface CFD. The claim is bounded by the disagreement between the two, which is reported, not hidden. Question At what speed does the foil system carry the full \u2026"},{"n":1306,"t":"AEROMORPH: a race car that changes its own aerodynamics for the corner it is in","l":["enhancement","priority: P2","effort: M","design-optimization","solvers","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary AEROMORPH selects an aerodynamic configuration per track segment: low drag on the straight, downforce in the corner, cooling throughout. Lap time is the objective, computed with a point-mass vehicle model fed by an aero map. The deliverable is the delta against the best single fixed configuration \u2014 the delta is the result, not the shape. Question On a stated lap, does a per-segment \u2026"},{"n":1305,"t":"ORBITAL INFLATION: a compact module that expands into a rotating ring","l":["enhancement","priority: P3","effort: L","uq","visualization","fem","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary ORBITAL INFLATION is a stowed structure that deploys into a ring, stiffens, then spins up to provide apparent gravity. Deployment order and spin-up profile are optimised so that no member is overstressed and the ring stays controllable at every instant. The gravity is centrifugal acceleration in a rotating frame; its gradient and Coriolis consequences are reported. Question For a ring of \u2026"},{"n":1304,"t":"VORTEX GATE: can a flow field really deflect a passing object?","l":["enhancement","priority: P3","effort: M","uq","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary VORTEX GATE is an annular nozzle array that imposes swirl on the air a body passes through; the experiment measures the lateral force that swirl actually delivers. The physics is transient incompressible flow with two-way body coupling. The deliverable is a ratio of lateral force to body weight, and the verdict follows from that ratio. Question For a body of mass m at speed U crossing a swirl \u2026"},{"n":1303,"t":"MECHAMORPH: a machine that walks into a gap and turns itself into a bridge","l":["enhancement","priority: P3","effort: L","agents","design-optimization","fem","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary MECHAMORPH is a chain of rigid links that walks to a gap edge, locks its joints, then carries load as a span. Locomotion is rigid-body dynamics with foot\u2013soil contact; the locked state is a static analysis of the same members. Such a chain spans less than a truss of equal mass, by a measured factor. Question For a chain of N links that must walk to a gap of span L, what is the largest L \u2026"},{"n":1302,"t":"TENTACLE ENGINE: a continuum arm that squeezes through a gap and still lifts","l":["enhancement","priority: P3","effort: L","design-optimization","fem","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A soft continuum arm with a stiffness distribution and cable actuation that must pass through an opening narrower than its resting diameter, then exert a grasp force. The work is a large-rotation rod model, a non-penetrating contact, and an optimisation over the stiffness profile. Question Can a stiffness profile be found such that the arm, driven only by admissible cable tensions, passes a \u2026"},{"n":1301,"t":"INVISIBLE WEATHER: a 3-D convection cell, and the scaling law it must reproduce","l":["enhancement","priority: P3","effort: L","solvers","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Rayleigh\u2013B\u00e9nard convection in a 3-D box: heat a plate, cool the top, let the pattern emerge, then change the cavity geometry and the heating distribution and measure again. The quantitative outputs are the critical Rayleigh number for onset and the Nusselt\u2013Rayleigh exponent, both known independently. Question Does a 3-D buoyant solver built on the library's existing case machinery recover the \u2026"},{"n":1300,"t":"SHAPE-SHIFTING METAMATERIAL: a lattice whose unit cells are chosen for the behaviour it must have","l":["enhancement","priority: P3","effort: L","design-optimization","geometry","fem","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A lattice assembled from unit cells of different topology, chosen so that the global response \u2014 Poisson's ratio, stiffness anisotropy, buckling load \u2014 hits a target. The core of the work is a homogenisation step that turns a unit cell into an effective stiffness tensor, and a selection over the library under a connectivity constraint. Question Can a cell-by-cell selection, scored on \u2026"},{"n":1299,"t":"FLUID MACHINE: blades the optimiser finds for a rotor","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","geometry","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A parametrised compressor cascade optimised on isentropic efficiency, then checked off-design. Design variables are stagger, camber, thickness and lean; the evaluation is RANS on a periodic single passage, cross-checked against a meanline design at equal solidity. Question Does a blade row optimised on a cascade RANS evaluation exceed the efficiency of the meanline design of the same duty and \u2026"},{"n":1298,"t":"VORTEX ENGINE: a geometry that learns to mix two streams","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A mixer geometry optimised to homogenise two inlet streams: minimise the outlet coefficient of variation of a passive scalar at fixed pressure drop. The work is a two-inlet case, a design loop over the mixing elements, and a comparison with a Kenics static mixer of equal length. Question At Peclet number 10^4 and the pressure budget of a six-element Kenics mixer, does the optimised geometry \u2026"},{"n":1297,"t":"STRESS GARDEN: material migrating to where the load is, in 3-D","l":["enhancement","priority: P2","effort: L","design-optimization","geometry","fem","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary A 3-D density-based topology optimisation of a load-carrying bracket: minimise mass under a von Mises stress bound, then re-solve the extracted optimum in CalculiX at twice the element density. Every Pareto point is checked by a code other than the one that produced it. Question Does a 3-D SIMP optimum with a stress constraint still meet its stress limit and mass budget when re-meshed and \u2026"},{"n":1296,"t":"FLOW GOD: control a channel flow with what the model has learned, not with a hand-tuned schedule","l":["enhancement","priority: P3","effort: L","uq","solvers","neural-operators","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary FLOW GOD closes a loop on a confined laminar flow using wall-normal blowing and suction, asking whether a policy learned from a reduced model beats a hand-tuned schedule at the same actuation energy. Mixing, heat transfer and drag are targeted in a planar channel; a learned policy, optimised steady forcing and a tuned sinusoid are compared on one solver. The claim: the learned policy buys the \u2026"},{"n":1295,"t":"LIVING MATTER: a cellular structure that becomes stiffer, softer or more conductive region by region","l":["enhancement","priority: P3","effort: L","design-optimization","geometry","fem","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary LIVING MATTER reconfigures a lattice of actuated cells, each switching between discrete stiffness or conductivity states, to meet a task: global stiffness, a target compliance pattern, or a heat path. The study measures two different optima and the distance between them: the best configuration over the whole state space, and the best one reachable from the as-built state under a switching \u2026"},{"n":1294,"t":"LEVITATE: a controller that learns to hold a body in a magnetic field, and what that costs","l":["enhancement","priority: P3","effort: L","uq","solvers","training","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary LEVITATE holds a body in a magnetic field with a closed loop. A magnetostatic solve gives the field gradient, a rigid-body model integrates the force, the plant is linearised about an operating gap, and LQR, MPC and a learned policy compete under noise and coil saturation. The claim: over a stated gap and payload range, the loop holds the body within a position tolerance at a stated power per \u2026"},{"n":1293,"t":"XENOFORM: a structure the optimiser grows to carry load and to route flow at the same time","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","geometry","fem","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary XENOFORM runs one 3-D density-based topology optimisation with two physics in one objective: structural compliance and Stokes dissipation of a fluid in the same design domain, coupled by a Brinkman penalisation over a shared density field. A single distribution must carry a transverse load and pass a fluid without throttling it. The claim: the field beats a uniform lattice and a hand-designed \u2026"},{"n":1292,"t":"AERIS: an aircraft whose geometry changes in flight, optimised for the conditions it is in","l":["enhancement","priority: P3","effort: L","design-optimization","solvers","geometry","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary AERIS optimises a morphing airframe as a function of flight condition rather than once: sweep, span, section camber and winglet articulation become separate design vectors, one per point in an operating envelope. Aerodynamics comes from a vortex-lattice solve regenerated as the geometry moves; the trimmed state comes from the 6-DOF side. The claim: a per-condition schedule beats the best \u2026"},{"n":1291,"t":"MORPH: a machine that learns its own physics and redesigns itself, in simulation","l":["enhancement","priority: P2","effort: L","agents","design-optimization","neural-operators","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary MORPH is a simulated machine that starts without knowledge of its own structure: a beam or wing section whose mass, stiffness and damping are withheld from the software operating it. It perturbs the structure, identifies those parameters, selects a predictive model family from evidence, and optimises a morphing configuration for a lift or stiffness target. The reference solver run that plays \u2026"},{"n":1290,"t":"Scientific cinematic pipeline: every frame of a demonstration video traceable to a solver output","l":["enhancement","priority: P2","effort: L","interop","twin3d","visualization","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary Every experiment in this campaign ends in a video, and a video is the easiest artefact in engineering to fake. This issue builds the shared pipeline that makes the opposite claim checkable: a solver trajectory (mesh or point cloud plus fields over time) goes in, and what comes out is an image sequence, a video, and a frame manifest in which every frame carries the case id, the solver, the git \u2026"},{"n":1289,"t":"ENSO v2: a sealed out-of-sample El Ni\u00f1o forecast, calibrated probabilities and regime-conditional skill","l":["enhancement","priority: P2","effort: L","uq","data","benchmark","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of #1288. Summary The committed ENSO study (examples/ensoforecasting/, guide docs/guides/ensoforecasting.md, code pinneapplesystems.timeseries.enso) compares 30 forecasters of the Ni\u00f1o-3.4 SST anomaly under one protocol and reports their skill honestly, but every number in it is a hindcast: the verifying observations already existed when the forecasts were made. This issue adds the one thing a hindcast cannot \u2026"},{"n":1288,"t":"Experiment campaign: reproducible Physics-AI demonstrations, one evidence protocol, and what each one may claim","l":["documentation","roadmap","priority: P2","effort: M","experiment"],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Summary This is the index and the protocol for a campaign of reproducible Physics-AI demonstrations: one series of experiments in which geometry is generated by an algorithm, the physics is solved by a real solver, something is optimised or altered, and the result is published with the evidence that says what it does and does not prove. The campaign's proposition is narrow: a demonstration is an experiment, not an \u2026"},{"n":1287,"t":"sensitivity_step / uncertainty_step should emit a verify.converged check (needed by the Engineer's uq_sensitivity verify)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"This came up in pinneapple-engineering-api PR #74 (issue #43). The gap. The Engineer's uqsensitivity study kind needs to verify a study inside its own step (verifyin). Today the library's sensitivitystep and uncertaintystep emit no convergence check, so the Engineer's verify step is reported as a stated gap instead. What to add. Both steps emit a verify.converged check, with pass / fail / inconclusive and the \u2026"},{"n":1286,"t":"Handoff 2026-11-04: what merged, what was lost, and what is left for the owner","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Resuming from another account or PC: start with docs/dev/handoff/RETOMAR.md (on main since #1347; corrected in #1411). The full, checked list of open items, with the step-by-step for the external PhysicsNeMo contributions, is in docs/pendencias/PENDENCIASYAN.md on the private PINNeAPPle-CFD pendencias/yan branch (section 0, checked on 2026-11-04). Left for the owner \u00b7 #1260 (time series #1197, extreme climate \u2026"},{"n":1285,"t":"[P2] G22: imaging inverse problems \u2014 Radon/FBP/SIRT/TV tomography (CT and neutron), dose kernels","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Opportunity area: IPEN / CINAS (medical physics, dosimetry, neutron tomography). Adjacent: #362, hemodynamics only. Gaps \u00b7 Tomographic reconstruction: \u00b7 forward model: the Radon transform; \u00b7 reconstruction methods: FBP, SIRT and TV regularization; \u00b7 applied to CT and to neutron tomography. \u00b7 Dose kernels for dosimetry. Proposed location pinneappleanalysis/inverseproblems/tomography.py \u2026"},{"n":1284,"t":"[P2] G21: electrochemistry and corrosion \u2014 Butler-Volmer, Nernst, single-particle model, Tafel / mixed-potential corrosion","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps \u00b7 Electrochemical kinetics: Butler-Volmer and Nernst. \u00b7 Battery single-particle model (SPM). \u00b7 Corrosion and degradation: Tafel kinetics, mixed potential. Proposed location: pinneapplephysics/electrochemistry/. Acceptance \u00b7 Butler-Volmer reduces to the symmetric linear limit and to the Tafel limits. \u00b7 The Nernst potential is correct. \u00b7 The SPM agrees with PyBaMM (optional \u2026"},{"n":1283,"t":"[P2] G20: production analytics \u2014 bottleneck, throughput, capacity, downtime/OEE, discrete-event scenario simulation, debottlenecking","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps \u00b7 Bottleneck detection. \u00b7 Capacity planning. \u00b7 Throughput. \u00b7 Downtime and OEE analysis. \u00b7 Discrete-event scenario simulation. \u00b7 Debottlenecking recommendations. Proposed location pinneapplesystems/production/, plus a flow node. Acceptance \u00b7 Little's law holds in simulation. \u00b7 The station with the highest utilisation is identified as the bottleneck. \u00b7 OEE = availability \u00d7 \u2026"},{"n":1282,"t":"[P2] G19: process unit library \u2014 biogas (AM2/ADM1), refinery shortcut distillation (FUG), crude blending, catalyst deactivation","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps: \u00b7 biogas process models (AM2, then ADM1); \u00b7 shortcut distillation for refineries (Fenske\u2013Underwood\u2013Gilliland); \u00b7 crude blending; \u00b7 catalyst deactivation. Build on: \u00b7 pinneapplesystems/processcomponents; \u00b7 pinneapplephysics/reactors; \u00b7 G10 for flowsheets (#1263). Acceptance: \u00b7 The textbook FUG example is reproduced. \u00b7 The AM2 steady states and washout are reproduced. \u00b7 \u2026"},{"n":1281,"t":"[P2] G18: surface kinetics (Langmuir-Hinshelwood) and reactive transport validated against experimental data","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. This complements #485 and #71 (reacting CFD). Gaps: \u00b7 surface-reaction kinetics (Langmuir-Hinshelwood); \u00b7 a reactive-flow workflow that compares species and rates with experimental data. Build on: \u00b7 pinneapplephysics/reactors/kinetics.py; \u00b7 pinneapplesimulation/numericalsolvers/stiffkineticsode.py; \u00b7 the 1-D multi-species ADR in processcomponents/reactionkinetics.py. Acceptance: \u00b7 The \u2026"},{"n":1280,"t":"[P2] G17: fire and explosion consequence models (TNT equivalence, TNO multi-energy, BST, pool/jet fire radiation, probit damage)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Scope \u00b7 TNT equivalence with Kingery-Bulmash blast parameters. \u00b7 The TNO multi-energy and Baker-Strehlow-Tang methods. \u00b7 Radiation from pool fires and jet fires. \u00b7 Probit damage and injury models. \u00b7 The workflow: fuel and release \u2192 model \u2192 overpressure and heat flux \u2192 consequence indicators. Proposed location: pinneapplephysics/safety/fireexplosion.py and a flow node. Acceptance \u00b7 \u2026"},{"n":1279,"t":"[P2] G16: gas dispersion and consequence zones (Gaussian plume/puff, Pasquill-Gifford/Briggs, dense gas, LFL/IDLH/probit)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Adjacent: #357 (urban flow only). Scope \u00b7 Gaussian plume and puff models. \u00b7 Dispersion coefficients \u03c3 from Pasquill-Gifford and Briggs, by stability class. \u00b7 Ground reflection. \u00b7 Britter-McQuaid model for dense gas. \u00b7 Consequence zones by LFL, IDLH and probit. \u00b7 The workflow: source \u2192 gas \u2192 atmosphere \u2192 concentration fields \u2192 zones. Proposed location: \u2026"},{"n":1278,"t":"[P2] G15: battery thermal \u2014 cell/module/pack, Bernardi heat, propagation, cooling configurations, parameter identification","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Today #337 covers battery RUL only. Gaps. \u00b7 A battery thermal model at cell, module and pack level. \u00b7 Bernardi heat generation (I\u00b2R plus the entropic term). \u00b7 Thermal propagation between cells. \u00b7 Comparison of cooling configurations. \u00b7 Identification of the thermal parameters. \u00b7 The \"Battery Thermal Intelligence\" application. Build on: \u00b7 pinneappleproblemdesign.formulate \u2026"},{"n":1277,"t":"[P2] G14: phase-change materials \u2014 enthalpy method, Stefan problem, thermal storage workflow","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps: \u00b7 PCM and enthalpy-based phase change; \u00b7 thermal energy storage; \u00b7 a PCM workflow covering properties, transition range, latent heat, coupling, melt/solidify fronts, and calibration against experiments. Proposed location: pinneapplephysics/phasechange/ plus a flow node. Acceptance: \u00b7 In the one-phase Stefan problem, the front position matches the Neumann analytic solution within 1 \u2026"},{"n":1276,"t":"[P1] G13: data center and HVAC thermal (rack inlet, RCI/RTI/SHI, chiller COP, cooling tower, airflow layouts)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps. The only thing that exists today is the 2-D PINN preset datacenterairflow2d. Missing: \u00b7 cooling tower model; \u00b7 chiller performance model; \u00b7 HVAC airflow; \u00b7 rack-inlet temperature analysis; \u00b7 a data-center thermal workflow (data hall \u2192 racks and CRAC units \u2192 airflow \u2192 hot and cold spots \u2192 recirculation and bypass \u2192 layout comparison \u2192 thermal maps); \u00b7 the \"Data Center Thermal \u2026"},{"n":1275,"t":"[P1] G12: HPC executors (PBS, LSF, async Slurm submit/poll/cancel, job arrays) and GPU profiling flow","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Resource-aware scheduling stays in #131. Gaps. Today the library has SlurmExecutor (blocking sbatch --wait) in pinneapplecore/workflows/executors.py and buildslurmscript in pinneappleneural/trainer/hpc.py. Missing: \u00b7 PBS and LSF executors; \u00b7 asynchronous Slurm submit, poll and cancel; \u00b7 job arrays for campaigns; \u00b7 a GPU profiling report as a flow. Proposed location: \u2026"},{"n":1274,"t":"[P1] G11: model serving \u2014 rollback, canary, batch inference endpoint, ONNX graph optimisation","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. ONNX quantisation stays in #112, and monitoring in #114. Gaps. The library already has pinneappleregistry/gateway.py, modelstore.py, versioning, stages, a REJECT gate and ONNX export. Missing: \u00b7 explicit rollback; \u00b7 canary traffic split; \u00b7 a batch inference endpoint; \u00b7 ONNX graph optimisation. Proposed location: pinneappleregistry/gateway.py and modelstore.py. Acceptance: \u00b7 Rollback \u2026"},{"n":1273,"t":"[P1] G10: process flowsheet, mass & energy balance with data reconciliation and gross-error detection","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps. Unit models exist, but there is: \u00b7 no flowsheet (process topology plus unit operations); \u00b7 no data reconciliation; \u00b7 no gross-error detection; \u00b7 no workflow for mass and energy balances with reconciliation. Build on: \u00b7 pinneapplesystems/processcomponents (heat exchanger, pipe network, valve, EOS, kinetics); \u00b7 pinneapplephysics/reactors; \u00b7 pinneapplesystems/operations/plant.py \u2026"},{"n":1272,"t":"[P1] G9: historian / LIMS / CMMS / ERP connectors, tag mapping, store-and-forward and connectivity health","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps. The OPC UA, Modbus, MQTT and Kafka streams exist (pinneapplesystems/digitaltwin/io/stream.py), but the following are missing: \u00b7 historian, LIMS, CMMS and ERP connectors; \u00b7 tag-to-variable mapping with units; \u00b7 handling of delayed or missing data, with store-and-forward persistence; \u00b7 connectivity health monitoring. Build on: \u00b7 digitaltwin/io/stream.py and SensorRegistry; \u00b7 \u2026"},{"n":1271,"t":"[P0] G8: Skill / Workflow / Application / Evidence as first-class catalog entities with acceptance criteria and versioned links","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Adjacent issues: #200, #1248 (agent spec). Owner's architecture rule \u00b7 Skill: an executable, testable capability. \u00b7 Workflow: skills + data + acceptance criteria. \u00b7 Application: workflows grouped for a business problem. \u00b7 Evidence: the verifiable record of a run (parameters, versions, logs, convergence, metrics, data, uncertainty, approvals). Gaps \u00b7 Studio tools and Hub KINDS exist, but \u2026"},{"n":1270,"t":"[P0] G7: retrieval over simulation archives (parameter, physics and text queries with provenance)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Adjacent issue: #1218 (H03). Gap Retrieval today (pinneappleanalysis/retrieval) covers documents and literature only. Nothing yet lets you search past runs: \u00b7 by parameters (\"nearest runs to Re = 2e5, slant 25\u00b0\"); \u00b7 by physics (\"transient CHT with k-\u03c9 SST\"); \u00b7 by text. Build on \u00b7 pinneappleanalysis/retrieval; \u00b7 pinneappledata/simulationmetadata; \u00b7 pinneappleregistry/experimentmemory.py; \u2026"},{"n":1269,"t":"[P0] G6: live simulation monitoring, failure diagnosis and automatic recovery, convergence-based stopping","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Extends #295 (failure classification) and #547. Gaps Today convergence is judged only after the run ends. Missing: \u00b7 live monitoring of residuals and Courant number; \u00b7 automated fix and re-run for known failures: Courant, divergence, bad mesh, missing BC; \u00b7 early stop when a run diverges or stalls; \u00b7 convergence-based stopping inside simulation campaigns. Build on \u00b7 \u2026"},{"n":1268,"t":"[P0] G5: field mapping between meshes (incl. conservative), mesh correspondence, coordinate transforms, mesh-to-graph datasets","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps \u00b7 Coordinate-system transforms for vectors and tensors: Cartesian, cylindrical and spherical. \u00b7 Conservative field mapping. Today pinneappledata/cae/compare.py has only linear interpolation and nearest neighbour. \u00b7 Mesh correspondence and registration. \u00b7 A mesh-to-graph dataset workflow, for training GNNs and operators. Build on \u00b7 pinneappledata/cae/compare.py; \u00b7 \u2026"},{"n":1267,"t":"[P0] G4: model qualification spec object, shadow mode, release approval and continuous requalification","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Already in the library \u00b7 Acceptance-criteria builder: pinneappleveriphysics/policy.py (GradePolicy). \u00b7 Applicability domain and OOD with solver fallback: pinneappleanalysis/uncertainty/applicability.py (routecases). \u00b7 Local error: validation/errormap.py. \u00b7 Conservation checks and UQ calibration. \u00b7 Cards with a ledger: pinneapplehub/verifiedcard.py, vp/ledger.py. \u00b7 Drift detection: \u2026"},{"n":1266,"t":"[P0] G3: predictive-maintenance decision layer, operating-state detection and sensor-intelligence workflow","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps \u00b7 No calibrated fault probability, risk ranking or maintenance priorities. \u00b7 No maintenance-scenario evaluation for degradation monitoring. \u00b7 No operating-state (regime) detection. \u00b7 No sensor-intelligence workflow (missing data \u2192 filtering \u2192 features \u2192 spectral \u2192 regimes \u2192 health indicators). Build on \u00b7 pinneapplesystems/digitaltwin/prognostics.py (RUL path model); \u00b7 \u2026"},{"n":1265,"t":"[P0] G2: vibration and condition-monitoring toolkit + workflow (RMS/kurtosis/crest, envelope analysis, bearing defect frequencies, order tracking)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. Gaps \u00b7 No vibration or accelerometer processing. \u00b7 No condition indicators: RMS, peak, crest factor, kurtosis, skewness. \u00b7 No fault signatures (BPFO, BPFI, BSF, FTF), envelope or Hilbert demodulation, or order tracking. \u00b7 No vibration-analysis workflow. Build on \u00b7 pinneapplephysics/physicsaudit/regime.py (dominantfrequency); \u00b7 flight/turbulence.py (welchpsd); \u00b7 \u2026"},{"n":1264,"t":"[P0] G1: standard thermal simulation and cooling-optimisation workflow (resistance networks, hotspots, view-factor radiation, HX thermal-hydraulic optimum)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1263,"s":0,"a":false,"x":"Part of #1263. Planning only. The #1185 family has no thermal sub-issue. Gaps \u00b7 Generic thermal resistance networks (only the heat-sink one exists). \u00b7 Hotspot detection on any field. \u00b7 Radiation with view factors (today only surface emission to ambient). \u00b7 Cooling-architecture comparison including the energy used. \u00b7 No standard thermal flow that goes geometry \u2192 solve \u2192 hotspots \u2192 report. \u00b7 Heat-exchanger \u2026"},{"n":1263,"t":"Epic: market-driven capability gaps (Physics AI / CFD / thermal / process / PdM / SciML job requirements, 2026-11)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":22,"a":false,"x":"Context The owner consolidated the recurring requirements of Physics AI, CFD, thermal, process, digital-twin and SciML job openings into one list: about 400 skills and workflows in 14 domains. The source includes postings from Firmus, Eli Lilly, PhysicsX, Dassault Syst\u00e8mes, Applied Materials, Shell, EMA, Bosch, Anduril, LNCC, INPE, IPEN and Halliburton. A read-only audit of main (2026-11-03) classified each item as \u2026"},{"n":1257,"t":"discover_pde weak form: the rollout check rejects the true equation at 1 % noise (it compares against noisy data)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Follow-up of #1224, fixed by PR #1241. What happens Burgers (\u03bd = 0.1, Cole\u2013Hopf exact) with 1 % noise: \u00b7 discoverpde(form=\"weak\") finds the true terms: 0.10001\u00b7uxx \u2212 0.99843\u00b7u\u00b7ux. \u00b7 The rollout check still fails, at 2.37 %. The rollout compares the identified model's trajectory with the noisy data. Its error floor is therefore the noise level itself, which sits above the allowed min(5 %, \u00bc of the persistence error). \u2026"},{"n":1254,"t":"Agents 7: multi-agent orchestration \u2014 lead delegates to specialists with typed handoff contracts","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1247,"s":0,"a":false,"x":"Part of #1247. Planning only, not implemented yet. Scope \u00b7 The workbench lead delegates to the specialists, using each agent's whentouse and the planner capabilities. Each handoff carries the typed inputs / outputs contract of the spec (sub-issue 1). \u00b7 Typical chains: \u00b7 problem-formulator \u2192 surrogate-scientist or cfd-engineer \u2192 verification-auditor \u2192 report-writer; \u00b7 inverse-analyst \u2192 verification-auditor; \u00b7 \u2026"},{"n":1253,"t":"Agents 6: evaluation harness per agent (task suites, mocked + real-LLM runs, CI regression, metrics)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1247,"s":0,"a":false,"x":"Part of #1247. Planning only, not implemented yet. Scope Every agent ships an eval suite, and the harness runs it. Suites. Tasks in PT and EN, each with: \u00b7 the expected tool calls (or the acceptable set); \u00b7 the checks that must appear; \u00b7 the expected verdict on known cases, e.g. the cantilever minimum-mass optimum of #1242; \u00b7 negative cases the agent must refuse or flag: an unreachable target, an under-determined \u2026"},{"n":1252,"t":"Agents 5: guardrails \u2014 measured numbers only, VeriPhysics gates, tool permission tiers, refusal behaviour","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1247,"s":0,"a":false,"x":"Part of #1247. Planning only, not implemented yet. Scope Guardrails that every agent gets from the runtime. They do not depend on the prompt. \u00b7 Measured numbers only: every number in an agent's answer must match a value in a recorded tool run of the same session, within its stated precision, or a cited reference. A number with neither is flagged and the answer is refused or rewritten. Build on \u2026"},{"n":1251,"t":"Agents 4: external export (Claude Code / Agent SDK subagents, MCP prompts+tools, function schemas) and CLI","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1247,"s":0,"a":false,"x":"Part of #1247. Planning only, not implemented yet. Scope Make the catalog usable outside PINNeAPPle without re-writing the prompts. \u00b7 Claude Code subagents: \u00b7 pinneapple agents export --format claude-code --out .claude/agents/ writes one .md per agent, with that format's front matter (name, description, tools) and the prompt; \u00b7 PINNeAPPle tool calls go through the PINNeAPPle MCP server (below), and the export lists \u2026"},{"n":1250,"t":"Agents 3: Python API to import and run an agent with any LLM backend","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1247,"s":0,"a":false,"x":"Part of #1247. Planning only, not implemented yet. Scope A small, stable public API: Behaviour \u00b7 It runs on pinneapplellm.agentloop. The tool registry is limited to the agent's allow-list and permission tier. \u00b7 Backends sit behind one interface: \u00b7 the existing local Ollama (localllm); \u00b7 Anthropic, through the official SDK, with the model id given by the user (no default id in code); \u00b7 any OpenAI-compatible endpoint; \u2026"},{"n":1249,"t":"Agents 2: catalog of predefined specialist agents (CFD, structural, thermal, EM, surrogates, VeriPhysics auditor, ...)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1247,"s":0,"a":false,"x":"Part of #1247. Planning only, not implemented yet. Scope Ship a first catalog of specialist agents in the spec of sub-issue 1. Each one has: \u00b7 a system prompt; \u00b7 a tool allow-list taken from the library; \u00b7 the required checks; \u00b7 the references it relies on; \u00b7 an eval suite (sub-issue 6). Candidate agents (each maps to library workflows that already exist) | Agent | Role | Main library pieces | |---|---|---| | \u2026"},{"n":1248,"t":"Agents 1: agent spec v1 (versioned format), registry and discovery via entry points","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1247,"s":0,"a":false,"x":"Part of #1247. Planning only, not implemented yet. Scope Extend the current Markdown format (pinneapplellm/workbench/agents.py) into a versioned agent spec. Every field must be machine-checkable. | Field | Content | |---|---| | specversion, name, version, title, description | identity | | domain | e.g. cfd, structural, thermal, em, surrogates, verification | | whentouse | for the lead's delegation, in PT and EN | | \u2026"},{"n":1247,"t":"Epic: predefined specialized agents, usable inside pinneapple_llm and importable externally","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":7,"a":false,"x":"Goal A catalog of predefined, specialized agents: physics and engineering specialists, each with the right PINNeAPPle tools, flows, checks and guardrails. They can be: \u00b7 used inside PINNeAPPle: pinneapplellm workbench, agentloop, the Engineer app, Flow Studio; \u00b7 imported externally: as Claude Code / Claude Agent SDK subagents, through MCP, from a plain Python API, or by third parties shipping their own agents. \u2026"},{"n":1240,"t":"Data layer: helpers found in the October apps (formfill, CAE upload, unified inspect, snapshots, lineage, describe_table, data health)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1210,"s":0,"a":false,"x":"Part of #1210. The audit of the October apps (#1226) found these data-layer helpers inside apps. Each is effort S and maps to a data-layer sub-issue. | Sub-issue | App code | Library target | |---|---|---| | #1213 parsing | designrequirements (day 6) api.py:165 spec (template id / fillable-PDF fields / custom JSON) | pinneappledata.formfill.resolvespec(template, specjson=, formpdf=) | | #1213 | designrequirements \u2026"},{"n":1238,"t":"October apps 12: evidence-report example study and contract objects in the library (evidence_report, validation_lab)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1226,"s":0,"a":false,"x":"Part of #1226. Effort: M. | App code | What it does | Library target | |---|---|---| | evidencereport (day 30) api.py:106 examplesources (104 lines) | example evidence study: FEM vs PINN on Poisson, pp.compare, trust cards into an EvidenceLedger, a Validation Lab run, metrics.csv | pinneappleveriphysics.evidencepackage.examples.poissonfemvspinn() | | same function | duplicate: builds StudyResult / ModelRef as plain \u2026"},{"n":1234,"t":"October apps 8: model-gateway publishing paths and their security checks in pinneapple_registry (model_gateway)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1226,"s":0,"a":false,"x":"Part of #1226. Effort: S. Related to #1215. Security-relevant: today other callers (for example surrogatestudio's direct GW.publish) bypass checks that exist only in the app. | modelgateway (day 31) code | What it does | Library target | |---|---|---| | api.py:157 publishsurrogate | safe zip extract, find card.json, pickle scan (scancheckpoint), publish | \u2026"},{"n":1233,"t":"October apps 7: ROM study bundle and query API in pinneapple_neural.architectures.rom (rom_lab)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1226,"s":0,"a":false,"x":"Part of #1226. Effort: M. Coordinate with #1208 (the reduced-order-modeling base workflow, in progress): the workflow should reuse these. | romlab (day 19) code | What it does | Library target | |---|---|---| | api.py:159 runstudy (176\u2013205) | each model as .rom.npz + ModelRef (dataset hash), best-model StudyResult, ONNX-exportable flag | rom.contracts.writestudybundle(res, outdir, name=, tolerance=); \u2026"},{"n":1232,"t":"October apps 6: surrogate study packaging and held-out reporting (surrogate_studio, benchmark_arena)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1226,"s":0,"a":false,"x":"Part of #1226. Effort: M. surrogatestudio (day 14) | App code | What it does | Library target | |---|---|---| | api.py:98 read | duplicate of pinneappleanalysis.surrogate.contracts.readtablewithroles | switch | | :134 parity | held-out parity (scalar) or per-sample relative L2 with the worst sample (field) | pinneappleanalysis.surrogate.heldout.parity(study, data, n=400), using pinneapplephysics.metrics.relativel2 | \u2026"},{"n":1231,"t":"October apps 5: design-optimisation study runners in pinneapple_design.design_optimizer.study (engineering_optimizer, physics_design)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1226,"s":0,"a":false,"x":"Part of #1226. Effort: M. Coordinate with #1188 (the design-optimization base workflow, in progress): the workflow should call these runners. | App code | What it does | Library target | |---|---|---| | engineeringoptimizer (day 17) api.py:139 optimizejob | full study: problem from spec/table, direct vs surrogate-assisted active learning, front verification, design files, ModelRef of the fitted GP, StudyResult, \u2026"},{"n":1230,"t":"October apps 4: register and resolve operations models in the library (twin_runtime, control_lab, anomaly_detector)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1226,"s":0,"a":false,"x":"Part of #1226. Effort: S. Related to #1215 (provenance of deployed models). | App code | What it does | Library target | |---|---|---| | twin api.py:147, ctrl api.py:120, anom api.py:138 uploadmodel (3 identical copies) | ModelRef + model file: size cap, store, rewrite uri, SHA-256 check through loadmodel, roll back on failure | pinneapplesystems.operations.contracts.registermodel(root, refjson, data, maxbytes=) | | \u2026"},{"n":1229,"t":"October apps 3: one inverse-problem parser and result tables (calibration_lab, inverse_studio, identifiability_lab)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1226,"s":0,"a":false,"x":"Part of #1226. Effort: S. Three apps (days 18, 21, 25) carry three copies of the same problem parsing. | App code | What it does | Library target | |---|---|---| | cal api.py:107 build, inv api.py:111 problem, ident api.py:97 build | model + Parameters + Observations from JSON, with checks: \u2265 1 free parameter, max free parameters, every measurement has a value, max rows, known methods | \u2026"},{"n":1228,"t":"October apps 2: sensitivity studies from external runs and from given data in pinneapple_analysis.sensitivity.study (sensitivity_lab)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1226,"s":0,"a":false,"x":"Part of #1226. Effort: S. | App code (sensitivitylab, day 16) | What it does | Library target | |---|---|---| | api.py:302 runruns | Sobol from external solver runs: tables, ranking, freeze rows, \"no re-run\" note, cost, StudyResult | pinneappleanalysis.sensitivity.study.runsstudy(spec, table) | | :334 rungivendata | given-data first-order indices per output (auto input selection, finite-row filter, sum S1, dropped \u2026"},{"n":1227,"t":"October apps 1: shared study-model resolution and contract normalisation (uncertainty_lab, sensitivity_lab)","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":1226,"s":0,"a":false,"x":"Part of #1226. Effort: S\u2013M. uncertaintylab (day 15) and sensitivitylab (day 16) carry copies of the same helpers: | App code | What it does | Library target | |---|---|---| | unc api.py:191 loadmodel, sen api.py:167 model | model spec (builtin / zoo / onnx / ModelRef) \u2192 StudyModel | pinneappleanalysis.studymodels.resolvemodel(spec, onnx=, allowed=) | | unc :289 normalize, sen :199 normalize | ParameterSpace / \u2026"},{"n":1226,"t":"Epic: move the remaining logic of the October one-app-per-day apps (days 1\u201331) into the library","l":[],"m":null,"c":0,"cr":"2026-11-03","up":"2026-11-03","p":null,"s":13,"a":false,"x":"Goal Features live in the library; apps only call it. An audit of the 32 apps of the October series found that most are already thin. Their physics and numerics come from pinneapple, and PRs #653 and #660 moved days 1\u201313. What remains in the apps is: \u00b7 Study orchestration: the job body that chains library calls and writes the study bundle. \u00b7 Copy-pasted helpers: shared by 2\u20133 sibling apps. \u00b7 Result-to-table / CSV \u2026"},{"n":1221,"t":"Data layer K: Physics-AI-specific data capabilities (dataset cards,
