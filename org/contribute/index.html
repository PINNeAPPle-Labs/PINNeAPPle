<style>
:root {
  --bg: #fbfaf5; --surface: #ffffff; --sunk: #f3f2ea; --fg: #1d2318; --muted: #5b6352; --faint: #8a8f80;
  --line: #e3e2d6; --accent: #c98a0b; --accent-ink: #7a5200; --accent-soft: #f6ead0; --leaf: #3f7d3a; --leaf-soft: #e3f0df;
  --p0: #b42318; --p1: #c4560c; --p2: #2b5fb4; --p3: #6b7280;
  --overlay: rgba(20, 24, 16, 0.35);
  --nav-w: 280px; --toc-w: 240px; --top-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12150f; --surface: #181c14; --sunk: #1d2219; --fg: #ecebdf; --muted: #a3a796; --faint: #7b8072;
    --line: #2b3124; --accent: #f0b43a; --accent-ink: #f6cf7c; --accent-soft: #3a2f14; --leaf: #8fcf7f; --leaf-soft: #1f3019;
    --p0: #ff8a80; --p1: #ffb26b; --p2: #8ab8f0; --p3: #a3a796;
    --overlay: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12150f; --surface: #181c14; --sunk: #1d2219; --fg: #ecebdf; --muted: #a3a796; --faint: #7b8072;
  --line: #2b3124; --accent: #f0b43a; --accent-ink: #f6cf7c; --accent-soft: #3a2f14; --leaf: #8fcf7f; --leaf-soft: #1f3019;
  --p0: #ff8a80; --p1: #ffb26b; --p2: #8ab8f0; --p3: #a3a796;
  --overlay: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h) + 12px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
code, .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
h1, h2, h3 { font-family: Fraunces, Georgia, serif; line-height: 1.2; text-wrap: balance; }
button { font: inherit; color: inherit; }

.top { position: sticky; top: 0; z-index: 30; height: var(--top-h); display: flex; align-items: center; gap: 10px;
  padding-inline: 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.burger { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.burger svg { width: 18px; height: 18px; }
.burger[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--fg); white-space: nowrap; }
.brand b { font: 600 1.05rem Fraunces, Georgia, serif; }
.brand span { color: var(--muted); font-size: 0.85rem; }
.search { flex: 1; max-width: 460px; margin-left: auto; position: relative; min-width: 0; }
.search input { width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px 0 34px; font: inherit; color: var(--fg); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search svg { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; color: var(--faint); }

.layout { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--toc-w); }
.nav, .toc { position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; }
.nav { border-right: 1px solid var(--line); padding: 14px 10px 40px; background: var(--bg); }
.toc { border-left: 1px solid var(--line); padding: 20px 16px 40px; }
main { min-width: 0; padding: 28px clamp(16px, 4vw, 44px) 80px; }
.page { max-width: 880px; margin: 0 auto; }
.overlay { display: none; }

.nav h4, .toc h4 { margin: 18px 8px 6px; font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.toc h4 { margin: 0 0 10px; }
.nav h4:first-child { margin-top: 2px; }
.nav a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); font-size: 0.9rem; }
.nav a span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav a .ct { color: var(--faint); font-size: 0.78rem; font-variant-numeric: tabular-nums; flex: none; }
.nav a:hover { background: var(--sunk); }
.nav a.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nav details summary { list-style: none; cursor: pointer; }
.nav details summary::-webkit-details-marker { display: none; }
.nav details summary h4 { display: flex; justify-content: space-between; align-items: center; }
.nav details summary h4::after { content: "+"; font-size: 0.9rem; }
.nav details[open] summary h4::after { content: "–"; }
.toc a { display: block; padding: 4px 0 4px 10px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; font-size: 0.85rem; line-height: 1.35; }
.toc a:hover { color: var(--fg); }
.toc a.on { color: var(--accent-ink); border-left-color: var(--accent); }
.toc ol { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.82rem; display: grid; gap: 6px; }
.toc .steps { margin-top: 26px; }

.eyebrow { font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin: 6px 0 8px; }
.lede { font-size: 1.08rem; color: var(--muted); margin: 0 0 18px; max-width: 42em; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); margin-bottom: 18px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); }
.note { font-size: 0.8rem; color: var(--faint); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 22px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.filters label { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.filters select { height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 0.82rem; padding: 0 6px; }
.chip { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 0.8rem; }
.chip[aria-pressed="true"] { background: var(--leaf-soft); border-color: var(--leaf); color: var(--fg); }
.filters .reset { margin-left: auto; font-size: 0.8rem; background: none; border: 0; color: var(--accent-ink); cursor: pointer; text-decoration: underline; }

h2 { font-size: 1.35rem; margin: 36px 0 10px; display: flex; align-items: baseline; gap: 10px; }
h2 .ct { font: 500 0.85rem Inter, sans-serif; color: var(--faint); }
.group-intro { color: var(--muted); font-size: 0.9rem; margin: -4px 0 12px; max-width: 64ch; }
.list { display: grid; gap: 8px; }
.issue { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.issue > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
.issue > summary::-webkit-details-marker { display: none; }
.issue[open] > summary { border-bottom: 1px solid var(--line); }
.issue .num { font: 500 0.82rem "JetBrains Mono", monospace; color: var(--faint); padding-top: 2px; }
.issue .ttl { font-weight: 500; overflow-wrap: anywhere; }
.issue .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.75rem; color: var(--muted); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 0.72rem; white-space: nowrap; }
.tag.p0 { border-color: var(--p0); color: var(--p0); } .tag.p1 { border-color: var(--p1); color: var(--p1); }
.tag.p2 { border-color: var(--p2); color: var(--p2); } .tag.p3 { border-color: var(--p3); color: var(--p3); }
.tag.easy { background: var(--leaf-soft); border-color: var(--leaf); color: var(--fg); }
.tag.rel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.issue .body { padding: 10px 14px 12px; font-size: 0.9rem; }
.issue .body p { margin: 0 0 10px; color: var(--muted); max-width: 70ch; }
.issue .links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.85rem; }
.kids { margin: 8px 0 0 0; padding: 8px 0 0; border-top: 1px dashed var(--line); font-size: 0.85rem; }
.kids a { display: block; text-decoration: none; padding: 2px 0; }
.kids a span { color: var(--faint); font-family: "JetBrains Mono", monospace; font-size: 0.78rem; margin-right: 6px; }
.empty { color: var(--muted); padding: 24px 0; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-bottom: 8px; }
.cards a { display: grid; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--fg); }
.cards a:hover { border-color: var(--accent); }
.cards b { font-family: Fraunces, Georgia, serif; }
.cards small { color: var(--muted); line-height: 1.4; }
.cards .ct { font-size: 0.75rem; color: var(--faint); }
.how { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); counter-reset: s; }
.how div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 0.88rem; color: var(--muted); }
.how div b { display: block; color: var(--fg); margin-bottom: 4px; }
.how div b::before { counter-increment: s; content: counter(s) ". "; color: var(--accent-ink); }
.how code { font-size: 0.8rem; background: var(--sunk); padding: 0 4px; border-radius: 4px; }
.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 0.8rem; }

@media (max-width: 1240px) {
  .layout { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  .toc { position: fixed; right: 0; top: var(--top-h); z-index: 25; width: min(300px, 86vw); background: var(--bg);
    transform: translateX(100%); transition: transform .2s ease, visibility .2s; visibility: hidden; }
  body.toc-open .toc { transform: none; visibility: visible; box-shadow: -12px 0 30px rgba(0,0,0,.12); }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; left: 0; top: var(--top-h); z-index: 25; width: min(320px, 88vw); transform: translateX(-100%);
    transition: transform .2s ease, visibility .2s; visibility: hidden; }
  body.nav-open .nav { transform: none; visibility: visible; box-shadow: 12px 0 30px rgba(0,0,0,.12); }
  .brand span { display: none; }
}
@media (max-width: 1240px) { body.nav-open .overlay, body.toc-open .overlay { display: block; position: fixed; inset: var(--top-h) 0 0 0; z-index: 20; background: var(--overlay); } }
@media (min-width: 901px) { body.nav-open .overlay { display: none; } body.nav-open.toc-open .overlay { display: block; } }
@media (min-width: 1241px) { #toc-btn { display: none; } }
@media (max-width: 560px) { .filters .reset { margin-left: 0; } }
</style>

<script>
let SNAP = {"repo":"PINNeAPPle-Labs/PINNeAPPle","taken":"2026-11-01 21:21 UTC","issues":[{"n":1104,"t":"Floating city (#1090) as a library example: buoyancy and control study, scene script, outputs, checks","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem The city video comes from scratch scripts outside the library: \u00b7 physics.py, controlstudy.py, final.py: H\u2082/He hot-gas buoyancy, the stability of the atmosphere, and the cascade altitude \u2192 temperature \u2192 heater control; \u00b7 scene.py: the Blender scene; \u00b7 composecity.py: the overlays. What \u00b7 Physics: the buoyancy, thermal and control model moves into the library, either as a pinneapplesimulation aerostat module \u2026"},{"n":1103,"t":"Floating city (#1090): envelope, city and motion detail tied to the physics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem In the first render: \u00b7 the envelope reads as a plastic balloon: a smooth sphere, uniform material, meridian tori as seams; \u00b7 the city is random boxes on a disc; \u00b7 the motion is invisible. The controlled altitude error is at most 3.8 m on a 313 m envelope, so nothing visibly moves in the time-lapse. What \u00b7 Envelope: \u00b7 gored fabric with slight billowing between the load tapes; \u00b7 a translucent membrane lit from \u2026"},{"n":1102,"t":"Floating city (#1090): volumetric cloud deck and atmosphere instead of a textured plane","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem In the first render of the gas-giant city, the cloud deck 25 km below is a large plane with a banded procedural texture. It reads as wood grain or dunes. The cumulus towers are displaced spheres that look solid, and the haze is a distance-based emission blend inside the materials. What \u00b7 Cloud deck: a volumetric layer (Principled Volume with noise density and banded zonal winds) or a VDB generated from a \u2026"},{"n":1101,"t":"Black-hole flyby as a library example: scripts, 16:9 + 4:5 outputs, hero still, JSON, in-image checks (finish #1089)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem The #1089 video was produced with scratch scripts outside the library: shot.py traces in tiles, select()s the disc samples and calls renderseries, and compose2.py adds the overlays. The issue also asks for deliverables the video does not have yet. What \u00b7 examples/blackholeflyby/ holds the tracing and compositing scripts, using only library code, with a --quick mode. \u00b7 Outputs: \u00b7 MP4 at 4:5 and 16:9; \u00b7 a hero \u2026"},{"n":1100,"t":"raytrace: faster tracing (numba / torch GPU) for continuous camera paths, plus anti-aliasing of the photon ring and stars","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem Tracing one 720\u00d7900 camera on 4 CPU cores takes about 5\u20136 minutes. Because of that, the #1089 video uses 3 fixed camera shots joined by crossfades instead of one continuous fly-through. There are also two visual artifacts: \u00b7 the star field shows streaks and stretched sprites; \u00b7 the thin photon ring aliases at one sample per pixel. What \u00b7 A numba or torch (GPU) backend for Camera.trace that is numerically \u2026"},{"n":1099,"t":"raytrace: spinning (Kerr) black holes","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"What Null geodesics in the Kerr metric (Boyer\u2013Lindquist), with: \u00b7 the Carter constant; \u00b7 integration with turning points, or in Mino time; \u00b7 the prograde and retrograde ISCO and circular-orbit \u03a9(r, a); \u00b7 frame dragging in the disc velocity field. A spinning hole's shadow is asymmetric and shifted, and its ISCO moves inward to 1 M for a \u2192 1 (prograde). Checks \u00b7 a = 0 reproduces Schwarzschild, including the existing \u2026"},{"n":1098,"t":"Black-hole visuals: gas from a simulation instead of procedural clumps","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem The #1089 video's hot spots come from orbitingclumps. Their motion is physical (Keplerian), but their size, shape and placement are procedural. What \u00b7 Drive the render from a simulated flow. The candidates are: \u00b7 the in-house AccretionFlow (RIAF/torus hydro, axisymmetric), with its time series; \u00b7 a non-axisymmetric extension: a shearing-box or 3-D run, or seeded perturbations evolved by the same equations; \u00b7 \u2026"},{"n":1097,"t":"raytrace: light-travel time (\"slow light\") for time-dependent flows","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem render / renderseries use the same time t for every sample of a frame, the \"fast light\" approximation (#1091). Light from the far side of the disc arrives tens of M later than light from the near side, and that is comparable to the inner orbit (92 M at the ISCO). Hot spots near the hole are therefore drawn at the wrong phase. What \u00b7 Camera.trace integrates the coordinate time along each ray (dt/d\u03c6 from the \u2026"},{"n":1096,"t":"raytrace: optically thick thin disc and image order (direct image, photon ring n = 1, 2, \u2026)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem The emission is integrated as optically thin: you see through the disc. A geometrically thin accretion disc is optically thick, so it is opaque and emits from its surface. Grey absorption (kappa) exists, but it is not the standard thin-disc model. What \u00b7 Add a surface-emission mode. Record each equatorial crossing (\u03b8 = \u03c0/2) of every ray, with its order n (0 = direct, 1 = first lensed image, \u2026). Emit from the \u2026"},{"n":1095,"t":"raytrace: physical disc temperature and colour (relativistic Novikov\u2013Thorne flux, redshifted blackbody, declared false colour)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem Two things in the #1089 renders are not physical: \u00b7 The flux profile is the Newtonian form: F \u221d r\u207b\u00b3(1 \u2212 \u221a(6/r)). It is not the relativistic Novikov\u2013Thorne profile. \u00b7 The colour is a visual choice: tcolor = 4100 K, scaled by g. A disc around a 10-solar-mass hole is at about 10\u2077 K and emits in X-rays, while one around Sgr A or M87 emits in radio and sub-mm. What 1. A novikovthorneflux(r, M, Mdot) function, \u2026"},{"n":1094,"t":"raytrace: moving observers (free fall, orbit): aberration and observer Doppler","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Problem raytrace.Camera is a static observer: its pixel directions are defined in the local static frame. The #1089 flyby therefore shows a camera hovering at each radius. It does not show a camera falling in, even though \"falling\" is what such videos usually claim. What \u00b7 Add a camera 4-velocity: radial free fall from rest at infinity, circular orbit, or arbitrary. \u00b7 Transform the pixel directions from the camera \u2026"},{"n":1090,"t":"Sci-fi worlds, computed: a floating city in a gas giant (buoyancy, altitude-keeping control, cinematic render)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Goal A city hanging under a hot-hydrogen envelope in the atmosphere of a Jupiter-like gas giant. The physics is computed and the picture is rendered in a sci-fi style. Physics In an H\u2082/He atmosphere (molar mass \u2248 2.3 g/mol) nothing is lighter than the ambient gas, so lift needs hot hydrogen, a Montgolfi\u00e8re. 1. Atmosphere: p(z) and T(z) of a Jupiter-like profile, from an ideal-gas hydrostatic model with a stated \u2026"},{"n":1089,"t":"Sci-fi worlds, computed: a black hole flyby with its accretion disc (GR ray tracing, cinematic render)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"Goal A cinematic black-hole sequence where the picture is computed, not painted. It reuses pinneapplephysics.blackhole: \u00b7 the RIAF / torus hydrodynamics of the accretion flow (AccretionFlow, torusstate); \u00b7 GR ray tracing on Schwarzschild null geodesics (raytrace.Camera, render, bloom, starfield), with Doppler beaming and gravitational redshift. Deliverables 1. A camera path, a slow orbit and dive from r = 120 M \u2026"},{"n":1087,"t":"UGS 5/5: reliability and engineers in the loop: history matching, uncertainty, validated domain, decision record, app view","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"The source work stresses that making surrogates reliable for real decisions, with engineers in the loop, is the harder part. History matching \u00b7 Calibrate permeability multipliers, the aquifer and the well skins to observed pressures and rates. \u00b7 Use ensemble methods (pinneappleanalysis.inverseproblems.ensemblekalman, ES-MDA) with the surrogate as the forward model and simulator spot-checks. \u00b7 Report the posterior \u2026"},{"n":1086,"t":"UGS 4/5: operations optimisation: maximise peak daily deliverability under pressure and well constraints","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"Problem Choose the well schedules (which wells, rates or BHPs per period) over a withdrawal season to maximise the peak daily deliverability, or a target withdrawal profile, subject to: \u00b7 minimum BHP per well; \u00b7 the reservoir pressure floor; \u00b7 maximum rate per well (erosion and sand limits); \u00b7 surface network or compressor capacity; \u00b7 the end-of-season inventory. Method 1. Optimise on the surrogate (3/5), with \u2026"},{"n":1085,"t":"UGS 3/5: UGS benchmark: scenario dataset, training, accuracy and an honest speed-up","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"Dataset From the 1/5 simulator, on a synthetic UGS model: \u00b7 a 3-D anticline trap; \u00b7 several tens of wells, scalable towards more than 100; \u00b7 heterogeneous permeability. Scenarios are well schedules (rates or BHPs per well per period) sampled by Latin hypercube. They cover injection, withdrawal and shut-in. The train/validation/test split includes extrapolation tests: rates beyond the training range, and wells shut \u2026"},{"n":1084,"t":"UGS 2/5: neural-operator upgrades: 3-D / space-time FNO, factorised spectral weights (CP, Tucker, tensor-train), Sobolev H\u00b9 loss","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"Extend pinneappleneural.architectures.neuraloperators, which today has 1-D and 2-D FNO, dense weights and no time axis. Additions \u00b7 FNO3d and a space-time FNO, with an adjustable internal time resolution: the operator steps at a coarser or finer internal time than the data and interpolates. \u00b7 Factorised spectral weights: factorization=\"dense\" | \"cp\" | \"tucker\" | \"tt\" with a rank. The tensor-train contraction is done \u2026"},{"n":1083,"t":"UGS 1/5: reference simulator: compressible gas in porous media with wells (data generator and ground truth)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1082,"s":0,"a":false,"x":"Model Single-phase real gas: \u2202(\u03c6 \u03c1(p))/\u2202t = \u2207\u00b7(\u03c1 k/\u03bc(p) \u2207p) + qwells \u00b7 \u03c1 from p/(zRT), with z from the Papay or Hall\u2013Yarborough correlation; \u00b7 \u03bc(p) from Lee\u2013Gonzalez\u2013Eakin; \u00b7 rock compressibility \u03c6(p); \u00b7 2-D and 3-D grids with heterogeneous permeability and porosity: SPE10-style fields, or Gaussian random fields with a correlation length. Wells \u00b7 Peaceman well index; \u00b7 rate or BHP control, switching to BHP when the \u2026"},{"n":1082,"t":"Underground gas storage (UGS): neural-operator surrogate (TFNO-opt style), reservoir simulator, deliverability optimisation, reliability (tracking)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":5,"a":false,"x":"Reference work Sirota et al., the \"NeuroUGS\" line of work: \u00b7 arXiv 2509.21485, Neural Operators for Mathematical Modeling of Transient Fluid Flow in Subsurface Reservoir Systems; \u00b7 an earlier version in Russian Technological Journal 2024 (Sirota, Gushchin, Khan, Kostikov, Butov). Their architecture, TFNO-opt, is a modified Fourier neural operator with: \u00b7 adjustable internal time resolution; \u00b7 tensor(-train) \u2026"},{"n":1081,"t":"Hypothesis \u2192 claims \u2192 verdict \u2192 VeriPhysics grade: an experiment API in the library","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"This is the library side of the app's experiment session (pinneapple-engineering-api #35). API, in pinneappleveriphysics.experiment or alongside pinneapplelab \u00b7 Hypothesis(text) \u2192 claims: each claim is a falsifiable statement with: \u00b7 a quantity, with units; \u00b7 a comparator and a threshold; \u00b7 the conditions; \u00b7 a reference kind (exact, benchmark, independent solver, data); \u00b7 a refutation criterion. \u00b7 \u2026"},{"n":1080,"t":"Problem catalogue as data: equations, conditions and physics-loss code (sympy + LaTeX), with edit validation","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":0,"a":false,"x":"This is the library side of the app's \"Mapped problems\" screen (pinneapple-engineering-api #34). Goal pinneappleproblemdesign.catalogue (or a module that fits the layout) lists every problem the library knows: \u00b7 presets; \u00b7 PhysicalProblem instances; \u00b7 industrial cases; \u00b7 science experiments that have equations. Each problem comes as a serializable record: \u00b7 Governing equations as sympy, with the generated LaTeX. \u00b7 \u2026"},{"n":1076,"t":"Physics area: electromagnetism (remaining) and the app view of every area","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Electromagnetism Electromagnetism is the reference area: 10 of 11 subareas are available, with 20 experiments. What remains: \u00b7 the engineering subarea, which is partial. Link the existing machines (AFPM, Prius, TEAM 7), antenna and compact-range work as atlas experiments with their checks. \u00b7 3-D time-domain research experiments beyond FDTD, where feasible. For every area: the view in the app \u2026"},{"n":1075,"t":"Physics area: atomic, molecular and optical physics (new area)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"This area is not in the atlas yet. Add physics.amo with the subareas below. Classical optics stays in electromagnetism and is linked from here. Subareas and experiments to add \u00b7 Atomic structure: \u00b7 hydrogen fine structure and the Lamb shift scale; \u00b7 Zeeman and Stark effects (linear/quadratic) against formulas; \u00b7 multi-electron atoms by Hartree\u2013Fock for He and Li against tabulated energies. \u00b7 Spectroscopy: line \u2026"},{"n":1074,"t":"Physics area: geophysics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: subsurface and GFD are partial; seismology is planned. Experiments to add \u00b7 Seismology: \u00b7 P and S wave propagation in layered media; \u00b7 travel times and Snell refraction; \u00b7 Love and Rayleigh wave dispersion against analytic solutions; \u00b7 Lamb's problem; \u00b7 earthquake magnitude/energy relations; \u00b7 source mechanisms (radiation patterns). \u00b7 Subsurface: \u00b7 Darcy flow and well drawdown (Theis solution); \u00b7 \u2026"},{"n":1073,"t":"Physics area: astrophysics and cosmology","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: orbits, stars, accretion, data and cosmology are partial. Experiments to add \u00b7 Orbits: \u00b7 N-body with symplectic integrators (energy drift); \u00b7 the solar system against JPL ephemerides for a short span; \u00b7 orbital transfers (Hohmann, delta-v); \u00b7 tidal locking time scales. \u00b7 Stars: \u00b7 Lane\u2013Emden polytropes against analytic n = 0, 1, 5; \u00b7 a simple main-sequence model (mass\u2013luminosity); \u00b7 the Eddington \u2026"},{"n":1072,"t":"Physics area: plasma physics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: cold plasma is partial; kinetic and MHD are planned. Experiments to add \u00b7 Basics: Debye length and plasma frequency; Langmuir oscillations against \u03c9p. \u00b7 Single-particle motion: gyration; E\u00d7B and grad-B drifts against guiding-centre formulas; magnetic mirror loss cone. \u00b7 Waves: cold-plasma dispersion (O, X, R, L modes and cutoffs, the CMA diagram); Alfv\u00e9n waves. \u00b7 Kinetic: \u00b7 1-D electrostatic PIC: \u2026"},{"n":1071,"t":"Physics area: condensed matter","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: phonons and magnetism are partial, transport is available, and bands are planned. Experiments to add \u00b7 Bands: \u00b7 tight binding: a 1-D chain, the graphene Dirac cones and the SSH topological edge states; \u00b7 the nearly-free-electron gap against perturbation theory; \u00b7 density of states and van Hove singularities; \u00b7 Kronig\u2013Penney. \u00b7 Phonons: \u00b7 monatomic and diatomic chain dispersion; \u00b7 Debye against \u2026"},{"n":1070,"t":"Physics area: nuclear and particle physics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: decay, kinematics and detectors are all planned. Experiments to add \u00b7 Decay: \u00b7 Bateman equations for decay chains (U-238 series secular equilibrium); \u00b7 activity and half-life fits with Poisson counting statistics; \u00b7 dating (C-14). \u00b7 Nuclear structure: the semi-empirical mass formula against AME binding energies, and the valley of stability. \u00b7 Reactions: \u00b7 Q-values and thresholds; \u00b7 cross sections and \u2026"},{"n":1069,"t":"Physics area: relativity","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: special is planned; general is partial. Experiments to add \u00b7 Special relativity: \u00b7 Lorentz transformations and velocity addition; \u00b7 time dilation of muons against the measured flux ratio; \u00b7 relativistic kinematics of collisions (threshold energies); \u00b7 relativistic Doppler and aberration; \u00b7 the twin paradox computed along worldlines. \u00b7 Relativistic dynamics: a charged particle in uniform E and B \u2026"},{"n":1068,"t":"Physics area: quantum mechanics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: Schr\u00f6dinger and non-Hermitian are partial; scattering/spin is planned. Experiments to add \u00b7 Bound states: \u00b7 infinite and finite wells; \u00b7 the harmonic oscillator (energies and wavefunctions); \u00b7 the hydrogen radial equation against the Bohr levels; \u00b7 double-well tunnelling splitting against WKB. \u00b7 Time-dependent: \u00b7 wave-packet spreading and reflection/transmission at a barrier (exact coefficients); \u00b7 \u2026"},{"n":1067,"t":"Physics area: acoustics and vibration","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: resonators, ultrasound and pressure waves are partial. Experiments to add \u00b7 Resonators: \u00b7 Helmholtz resonator frequency, with end correction; \u00b7 open and closed pipe modes; \u00b7 rectangular room modes against the analytic formula; \u00b7 membrane and plate modes (Chladni patterns). \u00b7 Propagation: \u00b7 spherical spreading and atmospheric absorption (ISO 9613); \u00b7 the Lloyd's mirror interference pattern. \u00b7 Room \u2026"},{"n":1066,"t":"Physics area: continuum mechanics (solids)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: elasticity, fracture, contact/wear and granular are partial. Experiments to add \u00b7 Elasticity: \u00b7 cantilever and simply supported beams (Euler\u2013Bernoulli and Timoshenko); \u00b7 plate with a hole (Kirsch, Kt = 3); \u00b7 thick cylinder (Lam\u00e9); \u00b7 Hertz contact; \u00b7 torsion of non-circular sections (Prandtl stress function). \u00b7 Stability: Euler buckling with imperfections (Southwell plot); snap-through of a shallow \u2026"},{"n":1065,"t":"Physics area: fluid mechanics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: incompressible, compressible, turbulence, pipe networks and nonlinear waves are all partial. Experiments to add \u00b7 Incompressible: \u00b7 Poiseuille and Couette (exact); \u00b7 lid-driven cavity (Ghia et al. 1982); \u00b7 cylinder wake Strouhal against Re (Williamson); \u00b7 Sch\u00e4fer\u2013Turek, linked to #1037; \u00b7 Stokes drag on a sphere. \u00b7 Compressible: \u00b7 Sod shock tube (exact Riemann); \u00b7 oblique shock relations; \u00b7 nozzle \u2026"},{"n":1064,"t":"Physics area: thermodynamics and statistical physics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: equations of state, heat transfer, statistical and kinetic are all partial. Experiments to add \u00b7 Equations of state: \u00b7 ideal gas, van der Waals and Peng\u2013Robinson; \u00b7 Maxwell construction and the critical point against tabulated values; \u00b7 CoolProp cross-check where installed. \u00b7 Cycles: \u00b7 Carnot, Otto, Diesel, Brayton and Rankine, with efficiencies against closed forms; \u00b7 entropy generation and exergy. \u2026"},{"n":1063,"t":"Physics area: classical mechanics","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1049,"s":0,"a":false,"x":"Atlas subareas: oscillators, central forces, rigid bodies and flight are partial; analytical mechanics is planned. Experiments to add \u00b7 Oscillators: \u00b7 damped and driven oscillators, with resonance curves against the closed form; \u00b7 Duffing hysteresis and jump; \u00b7 parametric resonance (Mathieu tongues); \u00b7 coupled oscillators and normal modes. \u00b7 Central forces: \u00b7 Kepler orbits with energy and angular momentum \u2026"},{"n":1062,"t":"Numerics 7/7: discretisation of PDEs (consistency, stability, convergence) and the numerical lab","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"Discretisation \u00b7 Finite differences for heat, advection and wave equations: \u00b7 truncation error derived symbolically; \u00b7 von Neumann amplification factors and CFL limits, measured by blow-up just above the limit; \u00b7 the Lax equivalence theorem made concrete. \u00b7 Advection schemes: \u00b7 upwind, Lax\u2013Friedrichs, Lax\u2013Wendroff; \u00b7 numerical diffusion and dispersion against the modified equation; \u00b7 flux limiters (TVD) on a step. \u00b7 \u2026"},{"n":1061,"t":"Numerics 6/7: numerical linear algebra","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"\u00b7 Direct solvers: \u00b7 LU with partial pivoting (and the growth factor), Cholesky and QR (Householder against Gram\u2013Schmidt orthogonality loss); \u00b7 sparse orderings and fill-in, reusing numericalsolvers.sparsedirect from #1031 when it lands. \u00b7 Conditioning: \u00b7 the condition number against the relative error observed; \u00b7 Hilbert and Vandermonde examples; \u00b7 iterative refinement. \u00b7 Iterative solvers: \u00b7 Jacobi, Gauss\u2013Seidel \u2026"},{"n":1060,"t":"Numerics 5/7: ODE integrators and stiffness","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"Reuse what exists: numericalsolvers.irkgausslegendre, etdrk4 and stiffkineticsode, plus the integrators of control.loop. Methods \u00b7 Explicit: Euler, Heun, RK4, and embedded pairs (Bogacki\u2013Shampine, Dormand\u2013Prince) with step control. \u00b7 Multistep: Adams\u2013Bashforth/Moulton. \u00b7 Implicit: backward Euler, the trapezoid rule, BDF 1\u20135 and Radau. Analysis \u00b7 Stability regions of each method, plotted, with A- and L-stability \u2026"},{"n":1059,"t":"Numerics 4/7: numerical differentiation and quadrature","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"Differentiation \u00b7 Forward, central and higher-order finite-difference stencils, built for any order on any nodes (Fornberg weights). \u00b7 The truncation against round-off trade-off: the optimal step is measured as a V-shaped error curve. \u00b7 Richardson extrapolation. \u00b7 The complex-step derivative. \u00b7 Automatic differentiation (torch), compared on the same functions. Quadrature \u00b7 Rectangle, trapezoid and Simpson rules. \u00b7 \u2026"},{"n":1058,"t":"Numerics 3/7: interpolation and approximation","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"\u00b7 Polynomial interpolation: \u00b7 Lagrange and barycentric forms, and Newton divided differences; \u00b7 the Runge phenomenon on equispaced nodes against Chebyshev nodes; \u00b7 the Lebesgue constant measured. \u00b7 Splines: cubic (natural, clamped, not-a-knot) and monotone (PCHIP), with error O(h\u2074) measured. \u00b7 Chebyshev approximation: coefficient decay, and spectral convergence for analytic functions against algebraic convergence \u2026"},{"n":1057,"t":"Numerics 2/7: roots and nonlinear systems","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"Scalar methods \u00b7 bisection; \u00b7 regula falsi (and Illinois); \u00b7 secant; \u00b7 Newton; \u00b7 Halley; \u00b7 Brent. Each method returns its iterates, so the observed convergence order (1, 1.618, 2, 3) is measured, not assumed. Failure modes are shown: a Newton cycle, a flat derivative, multiple roots with order loss and its fix. Systems \u00b7 Newton with a line search or trust region; \u00b7 Broyden; \u00b7 Jacobian-free Newton\u2013Krylov; \u00b7 \u2026"},{"n":1056,"t":"Numerics 1/7: floating point and error analysis","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1048,"s":0,"a":false,"x":"\u00b7 Machine epsilon, ulp and overflow/underflow: reported for float16, float32 and float64. \u00b7 Catastrophic cancellation, with stable rewrites: \u00b7 the quadratic formula; \u00b7 log1p / expm1; \u00b7 the variance in one pass (Welford) against the naive formula. Measured error against an mpmath reference. \u00b7 Compensated summation: Kahan / Neumaier against naive and pairwise summation, with the error growth against n. \u00b7 Condition \u2026"},{"n":1055,"t":"Control cases 6/6: methods (observers, generic MPC, scheduling, robust and nonlinear control, identification, sampling, MIMO)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"These general methods in pinneapplesystems.control serve the cases above. Methods and verification \u00b7 Observers: \u00b7 Luenberger by pole placement; \u00b7 steady-state Kalman (from pinneapplesystems.digitaltwin / stateestimation); \u00b7 separation principle check. \u00b7 Generic linear and nonlinear MPC on any Plant, reusing operations.control. Constraints on inputs, rates and outputs; verified against a known unconstrained LQR \u2026"},{"n":1054,"t":"Control cases 5/6: energy and power","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"Cases | Case | Verification | |---|---| | Grid load-frequency control (one and two areas, AGC, tie line) | frequency nadir and ROCOF against the swing-equation closed form | | Wind turbine: torque below rated, pitch above rated | gain scheduling against the operating point; reuse the library NREL 5 MW geometry; compare with the published reference controller values | | PV maximum power point tracking | \u2026"},{"n":1053,"t":"Control cases 4/6: marine","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"This extends pinneapplesimulation.naval, which came with #1046. Cases | Case | Verification | |---|---| | Ship heading autopilot (Nomoto 1st and 2nd order) | identification by zig-zag manoeuvre; PID; course-unstable ships | | Roll stabilisation by fins or anti-roll tanks | roll response against the natural period and damping; with and without the stabiliser | | Submarine depth and pitch with bow and stern planes | \u2026"},{"n":1052,"t":"Control cases 3/6: vehicles and aerospace","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"Cases | Case | Verification | |---|---| | Cruise control on a grade (aerodynamic drag, rolling, gear) | PI with anti-windup against the closed form of the linear model | | Active suspension (quarter car) | comfort and road-holding trade-off; LQR against passive, using ISO 8608 road profiles | | ABS and traction (wheel slip) | the slip-dependent friction curve (Pacejka/Burckhardt); slip regulation against bang-bang \u2026"},{"n":1051,"t":"Control cases 2/6: process control","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"Cases | Case | Verification | |---|---| | Tank level and the four-tank process (Johansson 2000) | the non-minimum-phase zero appears or disappears with the valve split; RGA | | Exothermic CSTR (van Heerden) | multiple steady states and the unstable middle one; temperature control with jacket limits | | Heat exchanger | FOPDT identification, then SIMC and IMC against Ziegler\u2013Nichols on the same disturbance | | Boiler \u2026"},{"n":1050,"t":"Control cases 1/6: mechatronics and motion","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":1047,"s":0,"a":false,"x":"Cases | Case | Verification | |---|---| | DC motor: speed and position loops, current limit, cascade (current \u2192 speed \u2192 position) | closed-form transfer functions; the cascade bandwidth separation | | Inverted pendulum on a cart | open-loop unstable pole against \u221a(g/l); LQR against the textbook gains; swing-up by energy shaping | | Ball and beam | double-integrator chain; the margins of the designed loop | | \u2026"},{"n":1049,"t":"Physics by area: verified experiments for every area of physics in pp.science (tracking)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":14,"a":false,"x":"State on main (pp.science.atlas()) The atlas has 20 areas, but only electromagnetism is complete: 10 of its 11 subareas are available, with 20 experiments. The other physics areas are partial or planned: \u00b7 classical mechanics: 4 partial, 1 planned; \u00b7 thermodynamics: 4 partial; \u00b7 fluids: 5 partial; \u00b7 continuum mechanics: 4 partial; \u00b7 acoustics: 3 partial; \u00b7 quantum: 2 partial, 1 planned; \u00b7 relativity: 1 partial, 1 \u2026"},{"n":1048,"t":"Numerical methods (c\u00e1lculo num\u00e9rico): a verified module with measured convergence orders (tracking)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":7,"a":false,"x":"Why The library uses numerical methods everywhere: RK4, IRK Gauss\u2013Legendre, ETDRK4, stiff kinetics, quadrature in immersed, FEM and convergence studies in pinneappleanalysis.verification. But it has no coherent module where a user can: \u00b7 pick a method; \u00b7 see its order, stability and cost; \u00b7 measure them on their own problem. The science atlas lists appliedmath (integrators, discretisations, verification) as partial. \u2026"},{"n":1047,"t":"Control cases across engineering: a verified catalogue on pinneapple_systems.control (tracking)","l":[],"m":null,"c":0,"cr":"2026-11-01","up":"2026-11-01","p":null,"s":6,"a":false,"x":"This builds on #1040 / #1046. Each case is a plant in the library and lives in pinneapplesystems.control.cases, or in the domain package when one fits. Every case comes with: \u00b7 the model, with units and cited parameters, or labelled \"illustrative\"; \u00b7 the stability analysis: open loop, the closed loop with loopeigenvalues, and margins; \u00b7 the actuator realities (limits, rate, delay) and the \"what to command\" question \u2026"},{"n":1039,"t":"Paused work: #929 renders (PR 7) and #967; Raissi 2019 float64 Table 2 reproduction","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"These sessions were stopped on 2026-10-31 because of usage limits. 3-D electrical machines (#929) PR 7: renders. \u00b7 Branch claude/issue-929-renders, pushed at head 85e946f7. It holds: \u00b7 examples/electrodynamics/26machines3drenders.py; \u00b7 machines3d/renders.py; \u00b7 a Blender fix; \u00b7 tests/testmachines3drenders.py. \u00b7 Lost: the turntable render output, which was still being written in the container (about 1 h of rendering). \u2026"},{"n":1038,"t":"Bilingual Studio (pt/en): remaining library i18n work","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"State when paused (2026-10-31) \u00b7 #1033 (gallery + glossary in pt/en): open. \u00b7 It was reviewed: the code is fine, there are no client names (the hits were \"PhysicsNeMo\"), and the body has no footer. \u00b7 Merge it when CI is green. \u00b7 #1034 (pt text for the tools used by examples, 656 \u2192 705 of 705): open, not yet reviewed. \u00b7 After the merges: \u00b7 bump PINNEAPPLECOMMIT in pinneapple-engineering-api; \u00b7 use inLang(titlept, \u2026"},{"n":1037,"t":"CFD directly on STL (LBM and immersed vs. mesh): finish the pre-registered campaign","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"Goal: run CFD on the geometry without building a body-fitted mesh. It must be at least 2\u00d7 faster in total time, with an error no worse than the reference's plus a margin. The pre-registration is at f42d5c9. Candidates: \u00b7 R: generatemesh + Taylor\u2013Hood P2/P1 (the reference); \u00b7 A: LBM; \u00b7 B: immersed Q2/Q1 with Nitsche and ghost penalty. The cases are Sch\u00e4fer\u2013Turek 2D-1, the sphere at Re 20/50/100, the Armaly step and, \u2026"},{"n":1036,"t":"Generic Physics AI studies, creatable in the Studio without code (design optimization, surrogates, PINNs, inverse problems, twins)","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"Goal A user opens the Studio and creates, with no code, any Physics AI study from a base geometry or system, a goal and limits. Design optimization is one kind; the others are surrogate training, PINN/operator solves, inverse identification and digital twins. Today each exists only as a hand-written example: \u00b7 apps/aerooptimizer (airliner, NSGA-II, OpenFOAM 3D check); \u00b7 examples/autolabaero (race car); \u00b7 the \u2026"},{"n":1032,"t":"generate_mesh quality view: worst elements are hidden by vertex averaging","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"Found while wiring the quality view into the app (pinneapple-engineering-api#24). What happens generatemesh (#1025) writes quality.glb / quality.json through fieldview. The cell fields (SICN, gamma, edge ratio) become vertex attributes, and Scene.frommesh sets each vertex to the mean of its neighbouring cells. The colour range in quality.json is computed on those vertex values. On the default box (h = 0.25 m), the \u2026"},{"n":1029,"t":"Compact range (#965): run the study on a private reflector geometry, outside the repository","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"999 (closing #965) delivered the compact-range study on a generic 2 GHz example. That study covers quiet zone against feed gain and reflector size, a surrogate with UQ, the Pareto front, and the smallest reflector verified by physical optics. As measured there, the optimum at 15.7 dBi and 4.53 m gives a usable quiet zone of 1.05 m; the GP predicted 1.00 \u00b1 0.21 m. Left out: running the same study on a private \u2026"},{"n":1028,"t":"Bio line: the paper-scale runs left out of #973 / #994 / #1013","l":[],"m":null,"c":0,"cr":"2026-10-31","up":"2026-10-31","p":null,"s":0,"a":false,"x":"Parts 1 and 2 of the biology-informed line are on main (#973, #994, #1013). Several runs were kept at reduced scale or not done because of their CPU cost. They are listed here so they are not lost. Each one should be run only with an explicit go-ahead, and reported with measured numbers. Left out \u00b7 SBINN at full scale (ultradian glucose\u2013insulin, #994). The paper trains for 610k epochs; #994 ran 100k. At 100k the \u2026"},{"n":993,"t":"Model-card governance: the gate stays on push, and the nightly covers the zoo","l":[],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"Split off from the same conversation as #992. scripts/validatemodelcard.py (the \"Model hub governance\" step, last in tests.yml) was stuck behind the hour-long full-suite step: it is cheap, it is a real gate, and it never got to run while the suite was going. With the suite moved to .github/workflows/full-suite.yml, this step now runs in seconds at the end of every push, so it stays must-pass on push rather than \u2026"},{"n":992,"t":"Triage the 81 failures in the full test suite, now that it runs","l":[],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"The full suite in CI never ran. pytest tests/ aborted during collection with Interrupted: 5 errors during collection, and the step was continue-on-error, so the workflow stayed green and nothing was reviewed from it. That is fixed (#975, and the collection fixes in 52d743b7). The suite now runs in .github/workflows/full-suite.yml, nightly at 03:00 UTC and on demand; the workflow is red only when the suite stops \u2026"},{"n":991,"t":"futures: fill the planned directions of the atlas (post-biological, civilization-scale, propulsion)","l":["enhancement","help wanted","priority: P3","effort: L","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"pp.futures.atlas() lists eight directions; five subareas are planned with no code behind them, and the atlas reports that honestly rather than hiding it. Each becomes work when there is a closed-form check worth attaching. Currently planned: | Direction | Subarea | |---|---| | Speculative Physics | physics beyond the Standard Model | | Future Engineering | space elevators and megastructures | | Future Engineering | \u2026"},{"n":990,"t":"futures: decide where the Lab publishes its experiment pages","l":["documentation","priority: P3","effort: S","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"python -m pinneapplefutures publish all --out DIR writes, per experiment, result.json, the figures and a README.md publication (the world with the provenance of every number, the equations, the comparisons with their sources, the checks, the evidence axes, the two verdicts and a What this does not show section), plus Catalogue.md and ATLAS.md. The command exists; the destination does not. Nothing is published \u2026"},{"n":989,"t":"futures: let a demonstrator declare engineering evidence, not just a simulation","l":["enhancement","priority: P2","effort: S","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"The plausibility framework has six axes and the API already accepts evidence on any of them \u2014 SpeculativeResult.engineering(name, passed, value=..., limit=..., detail=...) records a check with source=\"engineering\", which fills technologicalfeasibility and switches the engineering verdict from NOT ASSESSED to FEASIBLE / CONDITIONAL / NOT FEASIBLE. All three current demonstrators leave it NOT ASSESSED, and that is the \u2026"},{"n":988,"t":"futures: a fourth demonstrator -- reaction-diffusion and morphogenesis","l":["enhancement","help wanted","priority: P2","effort: M","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"The atlas lists artificiallife / reaction-diffusion and morphogenesis as partial, pointing at pinneapplephysics.pdeenvironment: the PDE machinery exists, a worked Futures experiment does not. It is the one direction of the Lab with a natural closed-form check that is not yet a demonstrator. What it would add An experiment futures.artificiallife (name to settle) with the same shape as the other three: an epistemic \u2026"},{"n":987,"t":"test(science): cover the Experiment.result_cls hook","l":["enhancement","priority: P2","effort: S","area: futures"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"986 added Experiment.resultcls (pinneapplescience/core.py, what run() returns) so that a layer built on the science experiments can return its own result type; pinneapplefutures uses it for SpeculativeResult. The hook itself has no test in the package it belongs to \u2014 only the downstream consumer exercises it. What to do \u00b7 A test in tests/testscience.py that a subclass setting resultcls gets that type back from \u2026"},{"n":978,"t":"PINN boundary test: at what electrical size does a PINN stop matching PO and a converged reference?","l":["enhancement","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"Motivation The library can solve Helmholtz problems (pdeenvironment carries the capability and an acoustics preset) and it solves electromagnetics with classical methods -- physical optics, FEM, Mie, FDTD. It has no documented position on where a physics-informed network is a reasonable substitute for those methods and where it is not, and the answer is not the same in every regime. The physics is the argument. A \u2026"},{"n":977,"t":"Learn the cheap-to-full-wave residual as a function of the rolled-edge profile","l":["effort: M","area: surrogates-optimization","surrogate"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"Motivation Physical optics on this library's reflector model is systematically optimistic about the amplitude ripple in the quiet zone: on a case where a full-wave reference was available, the peak-to-peak came out about 1.6 dB high on average, with a median ratio near 1.8, while the phase tracked to a few degrees. The cause is known and stated in the datasheet: the module's rolled edge is a constant-curvature \u2026"},{"n":976,"t":"Multi-fidelity design search: does cheap physics guide an expensive oracle at equal cost?","l":["enhancement","effort: M","area: surrogates-optimization","surrogate"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"Motivation reflector.studyreport runs a compact-range study that ends in a datasheet, and that datasheet now carries an equal-budget comparison: the same number of physical-optics solves, spent three ways. On a near-field range, where one PO solve costs about 6 s, the result was that the surrogate bought nothing: a space-filling design whose Gaussian process was optimised on the surrogate reached the same quiet-zone \u2026"},{"n":967,"t":"Pre-trained 3-D multiphysics e-motor model for fast design optimisation without FEA in the loop","l":["enhancement","priority: P1","effort: L","surrogate","design-optimization","neural-operators"],"m":null,"c":0,"cr":"2026-10-28","up":"2026-10-28","p":null,"s":0,"a":false,"x":"Why Building on #929 (3-D electric machines): engineers want to optimise e-motors across multiple physics at once: \u00b7 electromagnetics: torque, ripple, back-EMF, losses; \u00b7 thermal: winding and magnet hot spots; \u00b7 structural: rotor stress at overspeed; \u00b7 optionally NVH (radial force harmonics). Each design should be evaluated in milliseconds instead of hours of 3-D FEA, and the FEA should be kept only for final \u2026"},{"n":964,"t":"The docs-build step of the generated job cannot be reproduced locally","l":[],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What The generated job ends with a step that is different in kind from the rest: The three steps before it are single module invocations that anyone can run after pip install -e \".[flow,hub]\". This one needs requirements-docs.txt as well \u2014 mkdocs, mkdocs-material, mkdocstrings, mkdocs-gen-files, mkdocs-literate-nav, mkdocs-autorefs \u2014 and nothing tells a contributor that. I hit this fixing generated on 2026-10-27: \u2026"},{"n":963,"t":"apps/twin_ops: the committed evidence file carries a wall-clock timestamp, so every demo run shows a diff","l":[],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What apps/twinops/twinevidencehx201.json is committed, and TwinEvidence.createdunix defaults to time.time() (pinneapplesystems/digitaltwin/product/evidence.py). Running the demo therefore rewrites the file every time: Nothing else changes \u2014 every metric, digest and verdict is deterministic. Why it matters A checked-in evidence artifact is useful: it is the thing a reader can open without running anything. But a file \u2026"},{"n":962,"t":"examples/quickstart: 925 lines of recipes that CI never runs","l":[],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What examples/quickstart holds thirteen recipes (925 lines) added in 497917a4. CI touches exactly one thing about them: the hub snippet example:examples/quickstart, which loads experiment.json through pinneapplelab.manifest and prints its title, domain, status and first metrics. None of the thirteen scripts is executed anywhere in the workflow. The example-flows gate lists the folder as status: notconvertible, so it \u2026"},{"n":960,"t":"Recipes 12 and 13 are not in the CI smoke run of the notebook at full budget","l":["enhancement","priority: P3"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Skip this one if it is noise \u2014 recording it so the decision is explicit rather than forgotten. What happens notebooks/colab/06quickstarttenrecipes.ipynb now carries thirteen recipes. CI runs it with PINNEAPPLENBSMOKE=1 (36 s), where recipes 12 and 13 shrink to: \u00b7 TRAINEREPOCHS = 12 (full: 150) \u2014 the surrogate in recipe 12 is barely trained, so its \"held-out relative L2\" line in the smoke run is not comparable to the \u2026"},{"n":959,"t":"examples/quickstart/experiment.json records no metrics: the manifest says the numbers exist, the file has none","l":["documentation","priority: P3"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens AGENTS.md requires every examples/ folder to carry a valid experiment.json, and that \"a metric in a manifest needs its measured value, unit and how it was measured\". The quickstart manifest satisfies the gate while carrying nothing: The scripts print real numbers \u2014 relative L2 2.705e-04 for the heat PINN, h = 24.97 W/m\u00b2K for the inverse preset, 4.125e-02 held-out for the SIREN surrogate \u2014 and the guide \u2026"},{"n":958,"t":"Trainer.fit has no docstring and crashes with an opaque TypeError when there is no validation split","l":["enhancement","priority: P2"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens Fitting on the training set alone \u2014 the common case while prototyping, and the only case when the data is too small to split \u2014 fails with an error that names no argument: fit(self, trainloader, valloader, cfg) also has no docstring, so there is nothing that says whether valloader is optional, what the loss callable receives, or which keys the returned dict has (bestval, bestpath, ddp, rank0, history, \u2026"},{"n":957,"t":"SolverCatalog().build(\"fdm\") returns an FDMSolver with no solve() \u2014 the catalog builds solvers you cannot run","l":["bug","priority: P2"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens The documented way to get a solver is the catalog: FDMSolver comes back as a torch.nn.Module (its public methods are addmodule, apply, compile, cuda, eval, ...), with no solve, no run and no documented entry point. The catalog lists 32 solver names (cat.list()), and a user following it has no way to know which ones are runnable and how. The ones used in the examples have explicit classes with a real \u2026"},{"n":956,"t":"Arena can only benchmark datasets registered in the library, not one the user generated","l":["enhancement","priority: P1"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens Arena benchmarks architectures on a problem from its own registry, or on a dataset named by DatasetConfig.datasetid \u2014 and datasetid is looked up in the library's presets, not on disk: So the most common real benchmark \u2014 \"I generated 40 solver runs from my own geometry sweep, which architecture should I train?\" \u2014 cannot use the Arena. examples/quickstart/13variantsbenchmarkinverse.py runs that benchmark \u2026"},{"n":955,"t":"manifests --check accepts a manifest whose script list does not match the folder","l":["bug","priority: P2"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens python -m pinneapplelab manifests --check is the CI gate for experiment.json files. It validates the schema, but it does not compare scripts[] against the folder next to it, so a stale list passes: The three scripts added to the folder were invisible to the gate, and #954 proposes a test that would have caught the other half of the problem: nothing runs them either. Why it matters The manifest is what \u2026"},{"n":954,"t":"No smoke test for examples/quickstart: the guide quotes their output, nothing catches a regression","l":["enhancement","priority: P1"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What is missing examples/quickstart/ holds the thirteen scripts that GETTINGSTARTED.md quotes number for number. Nothing in CI runs them: \u00b7 scripts/checkapphelpers.py checks that examples only compose library calls \u2014 it never executes them; \u00b7 scripts/runcolabnotebooks.py executes notebooks/colab/.ipynb, and 06quickstarttenrecipes.ipynb covers the same recipes, but the .py files themselves are untested; \u00b7 \u2026"},{"n":953,"t":"pp.design follow-up asks for a temperature in \u00b0C but the slot is kelvin, so 70 is rejected as -203 \u00b0C","l":["bug"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens A plain-language request that leaves one slot open produces a follow-up question whose unit disagrees with the value the API accepts: Answering in the unit the question shows fails: -203.1 \u00b0C is 70 K. The slot's unit is K (RequirementSpec.values[\"tlimit\"].unit == \"K\") and the number is taken in that unit, while the question advertises \u00b0C. Passing a string with a unit does not help either: The only thing \u2026"},{"n":950,"t":"feat(simulation): expor leitura de .frd e de campos bin\u00e1rios OpenFOAM como API p\u00fablica","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto Leitura de resultados j\u00e1 existente no pacote: \u00b7 CalculiX: externalsolvers.calculix.frd.readfrd e readdatdisplacements; \u00b7 OpenFOAM bin\u00e1rio: externalsolvers.openfoam.binaryreader.readinternalfield; \u00b7 OpenFOAM para dataset: openfoam.fieldreader.openfoamcasetoupd. Problema Essas fun\u00e7\u00f5es existem, mas n\u00e3o s\u00e3o uma interface p\u00fablica documentada e est\u00e1vel. Ferramentas externas (e produtos do cat\u00e1logo) acabam \u2026"},{"n":949,"t":"feat(registry): suportar artefatos n\u00e3o-torch (pacote JSON de surrogate e g\u00eameo)","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto pinneappleregistry.modelstore.ModelStore.save espera um modelo com savecheckpoint ou, no limite, um statedict do PyTorch. Problema Pacotes de modelo que n\u00e3o s\u00e3o redes neurais n\u00e3o entram no registry: pacote JSON de substituto (polin\u00f4mio, kNN, ensemble) e pacote de g\u00eameo digital (twin.json). Sem isso, versionamento e compara\u00e7\u00e3o entre vers\u00f5es ficam de fora justamente para os artefatos mais usados em \u2026"},{"n":948,"t":"feat(systems): pipeline de constru\u00e7\u00e3o de g\u00eameo digital (calibra\u00e7\u00e3o, envelope, pacote)","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto pinneapplesystems.digitaltwin.twin traz DigitalTwin, Observation, SystemState, monitoramento e streams. assimilation traz ExtendedKalmanFilter e EnsembleKalmanFilter. Problema O runtime existe, a constru\u00e7\u00e3o n\u00e3o. Falta o caminho que vai de hist\u00f3rico de opera\u00e7\u00e3o at\u00e9 g\u00eameo utiliz\u00e1vel: escolher estrutura, calibrar, validar fora da amostra, calcular envelope de validade e exportar pacote port\u00e1til que responda \u2026"},{"n":947,"t":"feat(analysis): VeriPhysics como CLI com score decomposto e componentes n\u00e3o avaliados","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto pinneappleanalysis.verification.physicsconfidencescore implementa computephysicsconfidence e scoreagainstreference com uma regra correta: nunca fabrica componente que n\u00e3o foi executado. Problema A capacidade s\u00f3 \u00e9 acess\u00edvel via Python. N\u00e3o h\u00e1 CLI, nem JSON est\u00e1vel, nem conven\u00e7\u00e3o de sa\u00edda para \"componente n\u00e3o avaliado\", nem c\u00f3digo de retorno que possa ser usado em CI. Quem quer usar em pipeline de engenharia \u2026"},{"n":946,"t":"feat(simulation): fam\u00edlias de casos param\u00e9tricos e estat\u00edsticas de campo na API p\u00fablica","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto pinneapplesimulation.numericalsolvers.openfoambridge.generatecase monta um caso a partir de ProblemSpec. A leitura de caso existe em externalsolvers.openfoam.fieldreader.openfoamcasetoupd, e campos bin\u00e1rios s\u00e3o lidos por binaryreader.readinternalfield. Problema Um estudo CFD n\u00e3o \u00e9 um caso: \u00e9 uma fam\u00edlia. Falta (a) gera\u00e7\u00e3o de N casos a partir de um espa\u00e7o de projeto e (b) estat\u00edsticas de campo (m\u00ednimo, \u2026"},{"n":945,"t":"pp.quickstart() prints a blank problem name and dumps raw ConditionSpec reprs","l":["enhancement"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens pp.quickstart(\"burgers1d\") is the first function a new user is likely to call after pp.info(), and its output looks like a bug report: Two problems in a nine-line summary: 1. the title is empty \u2014 spec.problemid is '' for this preset (the identifier lives in spec.name); 2. the conditions line is one raw dataclass repr per condition, wrapping over several screens and showing memory addresses. The user \u2026"},{"n":944,"t":"feat(train): f\u00e1brica de surrogates com compara\u00e7\u00e3o e sele\u00e7\u00e3o por alvo","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto Hoje o pacote oferece treino e registro de modelos, e o cat\u00e1logo pinneappletools.benchmarksuite.pipeline.modelselector.selectmodels filtra arquiteturas por capacidade (inputkind, tags). Nenhum dos dois compara modelos treinados em dados de engenharia, por alvo, no mesmo conjunto retido. Problema Quem tem uma tabela de simula\u00e7\u00f5es precisa decidir, por alvo, qual fam\u00edlia de modelo usar (polin\u00f4mio, log-alvo, \u2026"},{"n":943,"t":"obs_operator docstring documents a BoundaryObsOperator that does not exist","l":["documentation"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens The module docstring of pinneappleanalysis/inverseproblems/obsoperator.py lists four observation operators: BoundaryObsOperator does not exist: Anyone modelling boundary measurements reads the docstring, imports the class, and gets an ImportError/AttributeError. It matters for exactly the case the inverse-precision presets care about (a wall you cannot reach: rodbasebc), where the natural operator to \u2026"},{"n":942,"t":"burgers_1d: the reference method is refused because the FDM solver returns a grid over x only","l":["bug"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens The preset declares solverspec = fdm, but that solver keeps only the last time step, so the reference method refuses the result: The refusal itself is right \u2014 comparing a spatial slice against a spatio-temporal reference would report an error at the wrong points. The problem is that the preset advertises a reference solver that cannot serve it, so the natural first call (pp.solve(preset, \"reference\"), \u2026"},{"n":941,"t":"save_checkpoint stores the dotted class path, so the recorded class_name cannot be rebuilt through ModelRegistry","l":["enhancement"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens BaseModel.savecheckpoint writes \"classname\": f\"{cls.module}.{cls.name}\". Reloading needs the registry key and the constructor kwargs, neither of which is in the checkpoint: buildmodel needs \"vanillapinn\" plus hiddendim=..., nlayers=.... The user has to keep those next to the checkpoint by hand, and a checkpoint written today is unloadable by anyone who does not already know how the model was built. \u2026"},{"n":940,"t":"Arena cannot build ModifiedMLP: model_factory passes hidden= but the class takes hidden_dim=","l":["bug"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens Any Arena config that names ModifiedMLP fails before training starts: buildmodifiedmlp forwards hidden=netcfg.hidden, but ModifiedMLP.init takes hiddendim and nlayers. The same model builds fine through the registry: Leaving the network block out of the config does not help \u2014 the fallback builder passes hidden= regardless. Expected Arena trains ModifiedMLP like any other registered family. Suggested fix \u2026"},{"n":939,"t":"pp.validate(model, {\"pinn\": spec}) raises AttributeError for a ProblemSpec; only preset names work","l":["bug"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens pp.validate(net, {\"pinn\": ...}) accepts a preset name but not the ProblemSpec you get from ProblemBuilder(...).build() \u2014 the documented object for a custom problem: pp.PhysicalProblem.frompdespec(spec) does not help either: it has no mesh attribute, so the same line fails. The consequence is that a custom problem cannot be validated with the high-level entry point at all \u2014 the user is pushed to \u2026"},{"n":938,"t":"Domain(bounds, shape=...) ignores the CSG: contains() and sample_interior() use the bounding box","l":["bug"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens Domain(lo, hi, shape=csgshape) stores the shape in self.shape but leaves self.sdf = None. isbox is defined as self.sdf is None, so the domain reports itself as a box, and both contains() and sampleinterior() fall back to the bounding box: \u00b7 contains() uses self.sdf, which is the box SDF \u2014 every point of the box is \"inside\"; \u00b7 sampleinterior() takes the if self.isbox: branch and returns uniform points \u2026"},{"n":937,"t":"QA pipeline: Q4 needs a defined intake for operational evidence","l":["enhancement","priority: P3","effort: M","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context Quality level Q4 is granted only when the report carries operationalevidence with environment, reviewer, reviewedat and monitoring. The rule exists so synthetic tests and simulations cannot claim operational validity, and it is enforced in pinneapplellm/qa/levels.py. Right now the evidence is an untyped dictionary. Any non-empty string satisfies each key. Gap \"reviewer\": \"ok\" currently grants Q4. The level \u2026"},{"n":936,"t":"QA pipeline: generation envelope is unit-tested but never exercised against a live model","l":["enhancement","priority: P2","effort: S","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.generation asks a provider for a JSON envelope (code plus assumptions, dependencies, units, equations, limitations) through the existing callllm dispatch, and checkclaims confronts those declarations with the specification. The parsing and claim checks are covered by deterministic tests with canned responses. The path from a real model response to a parsed envelope has never been run. Gap \u2026"},{"n":935,"t":"QA pipeline: hollow-body check only covers closed cylinder-like meshes","l":["enhancement","priority: P2","effort: M","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.validators.geometry catches the failure the specification calls out (a hollow pipe delivered as a solid cylinder) by computing the enclosed volume from the triangles and comparing it against pi(R^2 - (R-t)^2)L. On the reference pipe example it separates the two bodies with a 0.16% error against the solid value. Gap The check requires two conditions that most twin artifacts do not meet: \u00b7 the \u2026"},{"n":934,"t":"QA pipeline: units validator checks declarations, not the equations themselves","l":["enhancement","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.validators.units compares the dimensions of declared quantities: geometry dimensions must be lengths, a field's unit must be dimensionally compatible with the unit the specification declares for the same quantity, wall thickness must agree with the geometry, sensors must agree with the fields they observe. Gap The guide is explicit that this does not check the equations: a governing equation \u2026"},{"n":933,"t":"QA pipeline: repair re-validates the source but does not rebuild the artifact bundle","l":["enhancement","priority: P1","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.repair.RepairLoop is correct on its own terms: every attempt re-runs every validator it is given, the specification's criteria hash is re-checked, and repeated diffs stop the loop. QualityPipeline's built-in repair step is narrower. It re-validates the candidate source statically and re-runs the scientific validators against the same ValidationContext (same meshes, fields, times, sensors). A \u2026"},{"n":932,"t":"QA pipeline: static validation does not see through *args, **kwargs or dynamically built calls","l":["enhancement","priority: P2","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.static resolves pinneapple attributes with getattr and compares literal call sites against inspect.signature. The check is real: an invented method such as pinneappletwin3d.primitives.torus is caught before execution. Gap Anything that hides the call target from the AST escapes both checks: \u00b7 getattrmodule(\"cylinder\")(...) \u00b7 funcs\"build\" \u00b7 a call assembled through functools.partial or a \u2026"},{"n":931,"t":"QA pipeline: add kernel-level isolation as an opt-in execution mode","l":["enhancement","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.sandbox runs generated artifacts in a separate process with a scrubbed environment, POSIX rlimits, a wall-clock timeout and an in-process sys.addaudithook that refuses network connections, process creation and file access outside the artifact directory (see ISOLATIONLIMITATIONS in pinneapplellm/qa/sandbox.py). That is a policy layer, not a security boundary. Native code loaded through ctypes \u2026"},{"n":929,"t":"3-D electric machines: axial-flux, skew, end effects and 3-D losses on top of pinneapple_simulation.electromagnetics.machines","l":["enhancement","priority: P1","effort: L","solvers","fem"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":0,"a":false,"x":"Why pinneapplesimulation.electromagnetics.machines is 2-D. It has: \u00b7 PMSM / IPM / SPM design and the Az magnetostatics (P1 FEM, Newton for nonlinear B-H); \u00b7 GetDP interop, an end-winding model, thermal, drive cycles (WLTC) and robustness; \u00b7 the validated presets (spmservomotor, ipmtractionmotor, Prius). The guide says the 2-D A-V formulation is the scope. Several questions engineers ask about machines are inherently \u2026"},{"n":927,"t":"Sensitivity Lab: propagate surrogate error into the Sobol intervals and report ranking stability","l":["enhancement","priority: P1","effort: M","uq"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":0,"a":false,"x":"Why A reader of the day-16 post (Engineering Sensitivity Lab) asked: How robust are the sensitivity rankings when the underlying surrogate model has prediction errors, and are those uncertainties included in the reported 95% confidence intervals? The honest answer today is no. pp.sensitivity.sensitivitystudy reports percentile-bootstrap 95 % intervals over the Saltelli sample. Those intervals cover the Monte Carlo \u2026"},{"n":924,"t":"Football scouting: physics-based player profiles with uncertainty, comparable across feeds","l":["enhancement","priority: P2","effort: L","uq"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why Scouts compare players from different leagues, data providers and sample sizes. Two problems make naive per-player numbers misleading. Provider artefacts. In #902: \u00b7 broadcast ball height gave g = 6.09 m/s\u00b2; \u00b7 the mean metabolic power ranged from 13.7 to 68 W/kg depending on the filter used, before plausibility gating. Small samples. A player seen for 3 matches gets a ranking with no error bar. Physics helps \u2026"},{"n":923,"t":"Experiment quality checklist and badge (baseline, held-out, seeds/intervals, ablation, provenance, verdict)","l":["enhancement","priority: P1","effort: M","area: release-quality","benchmark"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why Recent studies (#899, #900, #901, #902) follow a strong protocol: everything pre-registered or held out, the same budget for every method, intervals, verdicts computed from results, and losses reported. Older examples vary. An industrial reader needs to see at a glance how much to trust an experiment. That should not depend on reading its README. Proposal Extend the experiment.json schema and \u2026"},{"n":922,"t":"Figure quality gate in CI and a generated figure gallery on the docs site","l":["enhancement","priority: P2","effort: M","area: release-quality","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why 398 images were added in two days. Nothing checks that a figure has units, a readable font, a colour bar for a field, or a reasonable size. Proposal A must-pass check for new or changed figures only. Old figures go on a baseline list that may only shrink. The check uses the metadata that usetheme writes into the PNG and SVG (the theme version, and axis labels with units) plus image checks: \u00b7 minimum resolution; \u2026"},{"n":921,"t":"Standard animation template for time-dependent r
