26-10-30","p":null,"s":0,"a":false,"x":"Motivation The library can solve Helmholtz problems (pdeenvironment carries the capability and an acoustics preset) and it solves electromagnetics with classical methods -- physical optics, FEM, Mie, FDTD. It has no documented position on where a physics-informed network is a reasonable substitute for those methods and where it is not, and the answer is not the same in every regime. The physics is the argument. A \u2026"},{"n":977,"t":"Learn the cheap-to-full-wave residual as a function of the rolled-edge profile","l":["effort: M","area: surrogates-optimization","surrogate"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"Motivation Physical optics on this library's reflector model is systematically optimistic about the amplitude ripple in the quiet zone: on a case where a full-wave reference was available, the peak-to-peak came out about 1.6 dB high on average, with a median ratio near 1.8, while the phase tracked to a few degrees. The cause is known and stated in the datasheet: the module's rolled edge is a constant-curvature \u2026"},{"n":976,"t":"Multi-fidelity design search: does cheap physics guide an expensive oracle at equal cost?","l":["enhancement","effort: M","area: surrogates-optimization","surrogate"],"m":null,"c":0,"cr":"2026-10-30","up":"2026-10-30","p":null,"s":0,"a":false,"x":"Motivation reflector.studyreport runs a compact-range study that ends in a datasheet, and that datasheet now carries an equal-budget comparison: the same number of physical-optics solves, spent three ways. On a near-field range, where one PO solve costs about 6 s, the result was that the surrogate bought nothing: a space-filling design whose Gaussian process was optimised on the surrogate reached the same quiet-zone \u2026"},{"n":967,"t":"Pre-trained 3-D multiphysics e-motor model for fast design optimisation without FEA in the loop","l":["enhancement","priority: P1","effort: L","surrogate","design-optimization","neural-operators"],"m":null,"c":0,"cr":"2026-10-28","up":"2026-11-04","p":null,"s":0,"a":false,"x":"Part of the Large Physics Model epic #1412: this is the electric-motor implementation of the component-LPM level, L15 (#1437). Besides the acceptance below, the model also gets: - the LPM card with the generalisation matrix of L00 (#1413); - OOD per axis and abstention (L11, #1424); - the component-level outputs and checks listed in #1437: efficiency and loss maps, torque-speed envelopes with thermal limits, energy \u2026"},{"n":964,"t":"The docs-build step of the generated job cannot be reproduced locally","l":[],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What The generated job ends with a step that is different in kind from the rest: The three steps before it are single module invocations that anyone can run after pip install -e \".[flow,hub]\". This one needs requirements-docs.txt as well \u2014 mkdocs, mkdocs-material, mkdocstrings, mkdocs-gen-files, mkdocs-literate-nav, mkdocs-autorefs \u2014 and nothing tells a contributor that. I hit this fixing generated on 2026-10-27: \u2026"},{"n":963,"t":"apps/twin_ops: the committed evidence file carries a wall-clock timestamp, so every demo run shows a diff","l":[],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What apps/twinops/twinevidencehx201.json is committed, and TwinEvidence.createdunix defaults to time.time() (pinneapplesystems/digitaltwin/product/evidence.py). Running the demo therefore rewrites the file every time: Nothing else changes \u2014 every metric, digest and verdict is deterministic. Why it matters A checked-in evidence artifact is useful: it is the thing a reader can open without running anything. But a file \u2026"},{"n":962,"t":"examples/quickstart: 925 lines of recipes that CI never runs","l":[],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What examples/quickstart holds thirteen recipes (925 lines) added in 497917a4. CI touches exactly one thing about them: the hub snippet example:examples/quickstart, which loads experiment.json through pinneapplelab.manifest and prints its title, domain, status and first metrics. None of the thirteen scripts is executed anywhere in the workflow. The example-flows gate lists the folder as status: notconvertible, so it \u2026"},{"n":960,"t":"Recipes 12 and 13 are not in the CI smoke run of the notebook at full budget","l":["enhancement","priority: P3"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Skip this one if it is noise \u2014 recording it so the decision is explicit rather than forgotten. What happens notebooks/colab/06quickstarttenrecipes.ipynb now carries thirteen recipes. CI runs it with PINNEAPPLENBSMOKE=1 (36 s), where recipes 12 and 13 shrink to: \u00b7 TRAINEREPOCHS = 12 (full: 150) \u2014 the surrogate in recipe 12 is barely trained, so its \"held-out relative L2\" line in the smoke run is not comparable to the \u2026"},{"n":959,"t":"examples/quickstart/experiment.json records no metrics: the manifest says the numbers exist, the file has none","l":["documentation","priority: P3"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens AGENTS.md requires every examples/ folder to carry a valid experiment.json, and that \"a metric in a manifest needs its measured value, unit and how it was measured\". The quickstart manifest satisfies the gate while carrying nothing: The scripts print real numbers \u2014 relative L2 2.705e-04 for the heat PINN, h = 24.97 W/m\u00b2K for the inverse preset, 4.125e-02 held-out for the SIREN surrogate \u2014 and the guide \u2026"},{"n":956,"t":"Arena can only benchmark datasets registered in the library, not one the user generated","l":["enhancement","priority: P1"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens Arena benchmarks architectures on a problem from its own registry, or on a dataset named by DatasetConfig.datasetid \u2014 and datasetid is looked up in the library's presets, not on disk: So the most common real benchmark \u2014 \"I generated 40 solver runs from my own geometry sweep, which architecture should I train?\" \u2014 cannot use the Arena. examples/quickstart/13variantsbenchmarkinverse.py runs that benchmark \u2026"},{"n":955,"t":"manifests --check accepts a manifest whose script list does not match the folder","l":["bug","priority: P2"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens python -m pinneapplelab manifests --check is the CI gate for experiment.json files. It validates the schema, but it does not compare scripts[] against the folder next to it, so a stale list passes: The three scripts added to the folder were invisible to the gate, and #954 proposes a test that would have caught the other half of the problem: nothing runs them either. Why it matters The manifest is what \u2026"},{"n":954,"t":"No smoke test for examples/quickstart: the guide quotes their output, nothing catches a regression","l":["enhancement","priority: P1"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What is missing examples/quickstart/ holds the thirteen scripts that GETTINGSTARTED.md quotes number for number. Nothing in CI runs them: \u00b7 scripts/checkapphelpers.py checks that examples only compose library calls \u2014 it never executes them; \u00b7 scripts/runcolabnotebooks.py executes notebooks/colab/.ipynb, and 06quickstarttenrecipes.ipynb covers the same recipes, but the .py files themselves are untested; \u00b7 \u2026"},{"n":950,"t":"feat(simulation): expor leitura de .frd e de campos bin\u00e1rios OpenFOAM como API p\u00fablica","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto Leitura de resultados j\u00e1 existente no pacote: \u00b7 CalculiX: externalsolvers.calculix.frd.readfrd e readdatdisplacements; \u00b7 OpenFOAM bin\u00e1rio: externalsolvers.openfoam.binaryreader.readinternalfield; \u00b7 OpenFOAM para dataset: openfoam.fieldreader.openfoamcasetoupd. Problema Essas fun\u00e7\u00f5es existem, mas n\u00e3o s\u00e3o uma interface p\u00fablica documentada e est\u00e1vel. Ferramentas externas (e produtos do cat\u00e1logo) acabam \u2026"},{"n":949,"t":"feat(registry): suportar artefatos n\u00e3o-torch (pacote JSON de surrogate e g\u00eameo)","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto pinneappleregistry.modelstore.ModelStore.save espera um modelo com savecheckpoint ou, no limite, um statedict do PyTorch. Problema Pacotes de modelo que n\u00e3o s\u00e3o redes neurais n\u00e3o entram no registry: pacote JSON de substituto (polin\u00f4mio, kNN, ensemble) e pacote de g\u00eameo digital (twin.json). Sem isso, versionamento e compara\u00e7\u00e3o entre vers\u00f5es ficam de fora justamente para os artefatos mais usados em \u2026"},{"n":948,"t":"feat(systems): pipeline de constru\u00e7\u00e3o de g\u00eameo digital (calibra\u00e7\u00e3o, envelope, pacote)","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto pinneapplesystems.digitaltwin.twin traz DigitalTwin, Observation, SystemState, monitoramento e streams. assimilation traz ExtendedKalmanFilter e EnsembleKalmanFilter. Problema O runtime existe, a constru\u00e7\u00e3o n\u00e3o. Falta o caminho que vai de hist\u00f3rico de opera\u00e7\u00e3o at\u00e9 g\u00eameo utiliz\u00e1vel: escolher estrutura, calibrar, validar fora da amostra, calcular envelope de validade e exportar pacote port\u00e1til que responda \u2026"},{"n":947,"t":"feat(analysis): VeriPhysics como CLI com score decomposto e componentes n\u00e3o avaliados","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto pinneappleanalysis.verification.physicsconfidencescore implementa computephysicsconfidence e scoreagainstreference com uma regra correta: nunca fabrica componente que n\u00e3o foi executado. Problema A capacidade s\u00f3 \u00e9 acess\u00edvel via Python. N\u00e3o h\u00e1 CLI, nem JSON est\u00e1vel, nem conven\u00e7\u00e3o de sa\u00edda para \"componente n\u00e3o avaliado\", nem c\u00f3digo de retorno que possa ser usado em CI. Quem quer usar em pipeline de engenharia \u2026"},{"n":946,"t":"feat(simulation): fam\u00edlias de casos param\u00e9tricos e estat\u00edsticas de campo na API p\u00fablica","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto pinneapplesimulation.numericalsolvers.openfoambridge.generatecase monta um caso a partir de ProblemSpec. A leitura de caso existe em externalsolvers.openfoam.fieldreader.openfoamcasetoupd, e campos bin\u00e1rios s\u00e3o lidos por binaryreader.readinternalfield. Problema Um estudo CFD n\u00e3o \u00e9 um caso: \u00e9 uma fam\u00edlia. Falta (a) gera\u00e7\u00e3o de N casos a partir de um espa\u00e7o de projeto e (b) estat\u00edsticas de campo (m\u00ednimo, \u2026"},{"n":944,"t":"feat(train): f\u00e1brica de surrogates com compara\u00e7\u00e3o e sele\u00e7\u00e3o por alvo","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Contexto Hoje o pacote oferece treino e registro de modelos, e o cat\u00e1logo pinneappletools.benchmarksuite.pipeline.modelselector.selectmodels filtra arquiteturas por capacidade (inputkind, tags). Nenhum dos dois compara modelos treinados em dados de engenharia, por alvo, no mesmo conjunto retido. Problema Quem tem uma tabela de simula\u00e7\u00f5es precisa decidir, por alvo, qual fam\u00edlia de modelo usar (polin\u00f4mio, log-alvo, \u2026"},{"n":943,"t":"obs_operator docstring documents a BoundaryObsOperator that does not exist","l":["documentation"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens The module docstring of pinneappleanalysis/inverseproblems/obsoperator.py lists four observation operators: BoundaryObsOperator does not exist: Anyone modelling boundary measurements reads the docstring, imports the class, and gets an ImportError/AttributeError. It matters for exactly the case the inverse-precision presets care about (a wall you cannot reach: rodbasebc), where the natural operator to \u2026"},{"n":938,"t":"Domain(bounds, shape=...) ignores the CSG: contains() and sample_interior() use the bounding box","l":["bug"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"What happens Domain(lo, hi, shape=csgshape) stores the shape in self.shape but leaves self.sdf = None. isbox is defined as self.sdf is None, so the domain reports itself as a box, and both contains() and sampleinterior() fall back to the bounding box: \u00b7 contains() uses self.sdf, which is the box SDF \u2014 every point of the box is \"inside\"; \u00b7 sampleinterior() takes the if self.isbox: branch and returns uniform points \u2026"},{"n":937,"t":"QA pipeline: Q4 needs a defined intake for operational evidence","l":["enhancement","priority: P3","effort: M","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context Quality level Q4 is granted only when the report carries operationalevidence with environment, reviewer, reviewedat and monitoring. The rule exists so synthetic tests and simulations cannot claim operational validity, and it is enforced in pinneapplellm/qa/levels.py. Right now the evidence is an untyped dictionary. Any non-empty string satisfies each key. Gap \"reviewer\": \"ok\" currently grants Q4. The level \u2026"},{"n":936,"t":"QA pipeline: generation envelope is unit-tested but never exercised against a live model","l":["enhancement","priority: P2","effort: S","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.generation asks a provider for a JSON envelope (code plus assumptions, dependencies, units, equations, limitations) through the existing callllm dispatch, and checkclaims confronts those declarations with the specification. The parsing and claim checks are covered by deterministic tests with canned responses. The path from a real model response to a parsed envelope has never been run. Gap \u2026"},{"n":935,"t":"QA pipeline: hollow-body check only covers closed cylinder-like meshes","l":["enhancement","priority: P2","effort: M","area: digital-twin"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.validators.geometry catches the failure the specification calls out (a hollow pipe delivered as a solid cylinder) by computing the enclosed volume from the triangles and comparing it against pi(R^2 - (R-t)^2)L. On the reference pipe example it separates the two bodies with a 0.16% error against the solid value. Gap The check requires two conditions that most twin artifacts do not meet: \u00b7 the \u2026"},{"n":934,"t":"QA pipeline: units validator checks declarations, not the equations themselves","l":["enhancement","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.validators.units compares the dimensions of declared quantities: geometry dimensions must be lengths, a field's unit must be dimensionally compatible with the unit the specification declares for the same quantity, wall thickness must agree with the geometry, sensors must agree with the fields they observe. Gap The guide is explicit that this does not check the equations: a governing equation \u2026"},{"n":933,"t":"QA pipeline: repair re-validates the source but does not rebuild the artifact bundle","l":["enhancement","priority: P1","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.repair.RepairLoop is correct on its own terms: every attempt re-runs every validator it is given, the specification's criteria hash is re-checked, and repeated diffs stop the loop. QualityPipeline's built-in repair step is narrower. It re-validates the candidate source statically and re-runs the scientific validators against the same ValidationContext (same meshes, fields, times, sensors). A \u2026"},{"n":932,"t":"QA pipeline: static validation does not see through *args, **kwargs or dynamically built calls","l":["enhancement","priority: P2","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.static resolves pinneapple attributes with getattr and compares literal call sites against inspect.signature. The check is real: an invented method such as pinneappletwin3d.primitives.torus is caught before execution. Gap Anything that hides the call target from the AST escapes both checks: \u00b7 getattrmodule(\"cylinder\")(...) \u00b7 funcs\"build\" \u00b7 a call assembled through functools.partial or a \u2026"},{"n":931,"t":"QA pipeline: add kernel-level isolation as an opt-in execution mode","l":["enhancement","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-27","up":"2026-10-27","p":null,"s":0,"a":false,"x":"Context pinneapplellm.qa.sandbox runs generated artifacts in a separate process with a scrubbed environment, POSIX rlimits, a wall-clock timeout and an in-process sys.addaudithook that refuses network connections, process creation and file access outside the artifact directory (see ISOLATIONLIMITATIONS in pinneapplellm/qa/sandbox.py). That is a policy layer, not a security boundary. Native code loaded through ctypes \u2026"},{"n":929,"t":"3-D electric machines: axial-flux, skew, end effects and 3-D losses on top of pinneapple_simulation.electromagnetics.machines","l":["enhancement","priority: P1","effort: L","solvers","fem"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":0,"a":false,"x":"Why pinneapplesimulation.electromagnetics.machines is 2-D. It has: \u00b7 PMSM / IPM / SPM design and the Az magnetostatics (P1 FEM, Newton for nonlinear B-H); \u00b7 GetDP interop, an end-winding model, thermal, drive cycles (WLTC) and robustness; \u00b7 the validated presets (spmservomotor, ipmtractionmotor, Prius). The guide says the 2-D A-V formulation is the scope. Several questions engineers ask about machines are inherently \u2026"},{"n":927,"t":"Sensitivity Lab: propagate surrogate error into the Sobol intervals and report ranking stability","l":["enhancement","priority: P1","effort: M","uq"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":0,"a":false,"x":"Why A reader of the day-16 post (Engineering Sensitivity Lab) asked: How robust are the sensitivity rankings when the underlying surrogate model has prediction errors, and are those uncertainties included in the reported 95% confidence intervals? The honest answer today is no. pp.sensitivity.sensitivitystudy reports percentile-bootstrap 95 % intervals over the Saltelli sample. Those intervals cover the Monte Carlo \u2026"},{"n":924,"t":"Football scouting: physics-based player profiles with uncertainty, comparable across feeds","l":["enhancement","priority: P2","effort: L","uq"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why Scouts compare players from different leagues, data providers and sample sizes. Two problems make naive per-player numbers misleading. Provider artefacts. In #902: \u00b7 broadcast ball height gave g = 6.09 m/s\u00b2; \u00b7 the mean metabolic power ranged from 13.7 to 68 W/kg depending on the filter used, before plausibility gating. Small samples. A player seen for 3 matches gets a ranking with no error bar. Physics helps \u2026"},{"n":923,"t":"Experiment quality checklist and badge (baseline, held-out, seeds/intervals, ablation, provenance, verdict)","l":["enhancement","priority: P1","effort: M","area: release-quality","benchmark"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why Recent studies (#899, #900, #901, #902) follow a strong protocol: everything pre-registered or held out, the same budget for every method, intervals, verdicts computed from results, and losses reported. Older examples vary. An industrial reader needs to see at a glance how much to trust an experiment. That should not depend on reading its README. Proposal Extend the experiment.json schema and \u2026"},{"n":922,"t":"Figure quality gate in CI and a generated figure gallery on the docs site","l":["enhancement","priority: P2","effort: M","area: release-quality","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why 398 images were added in two days. Nothing checks that a figure has units, a readable font, a colour bar for a field, or a reasonable size. Proposal A must-pass check for new or changed figures only. Old figures go on a baseline list that may only shrink. The check uses the metadata that usetheme writes into the PNG and SVG (the theme version, and axis labels with units) plus image checks: \u00b7 minimum resolution; \u2026"},{"n":921,"t":"Standard animation template for time-dependent results (MP4/GIF with timer, colour bar, scale bar, caption)","l":["enhancement","priority: P2","effort: M","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why Transient results are a large part of the repo: weather and black-hole, digital twins, rover, FDTD, wakes, football tracking. Each one animates differently, if it animates at all. pinneappletools.visualization.animation exists, but there is no standard frame layout. Proposal animate(framesfn, t, layout=\"standard\"). The standard layout: \u00b7 a title and a one-line English caption; \u00b7 a time code in physical units; \u00b7 \u2026"},{"n":920,"t":"Studio 3-D renders and turntables for CFD/FEA/EM fields, one call per experiment (Blender Cycles + three.js PBR)","l":["enhancement","priority: P1","effort: L","area: visualization","twin3d","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why The repo already has pinneappleblender (Cycles render and export), pinneappletools.visualization.studio.blender, the generic three.js viewer and pyvistabridge. They are used in a few showcase pieces: the airliner, the Ahmed body, the molecular renders. Most 3-D experiments still ship only matplotlib slices. This includes the FreeCAD \u2192 OpenFOAM cases in #897, the heat sinks, the motor magnetics and the FDTD in \u2026"},{"n":919,"t":"One-page engineering report generated from experiment.json + results (KPI cards, verdicts, uncertainty, provenance)","l":["enhancement","priority: P1","effort: L","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why Every example now has an experiment.json manifest, which CI checks with checkexperimentmanifests, plus results files. Several are presented in different ways: \u00b7 the six-stage trust card; \u00b7 evidencereport; \u00b7 the campaign report in the CFD app; \u00b7 the verdict tables in #900 and #902. A reader still has to open JSON or a README to see what was measured and whether it passed. Industrial CAE and analytics tools give a \u2026"},{"n":918,"t":"One house theme for all 2-D figures (extend pinneapple_tools.visualization.style; adopt in every example)","l":["enhancement","priority: P1","effort: M","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why pinneappletools.visualization.style exists: CFD colour maps, themes and defaults. Only 7 of the 88 examples/ folders import it; the rest use matplotlib defaults or their own palettes. Its CFD colour map is a rainbow (cfdrainbow), which is not perceptually uniform. The result is that each PR has a different look. Proposal Extend the existing module. Do not create a new package. usetheme(kind=\"report\" | \"slide\" | \u2026"},{"n":917,"t":"Football: broadcast-style 3-D replays and a club-grade match report","l":["enhancement","priority: P1","effort: M","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why The #902 figures are correct, but they read as research plots. The club-analyst audience expects broadcast-style visuals. Proposal football.plots.replay(sequence) writes an MP4 and an interactive three.js page: \u00b7 a 3-D pitch with true markings and stadium-style lighting; \u00b7 player discs with numbers and short velocity trails; \u00b7 the ball flight as a tube, shaded by the model's uncertainty, with the physics fit \u2026"},{"n":916,"t":"Football: goalkeeper and shot physics in place of the dropped xG case","l":["enhancement","priority: P3","effort: M"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why In #902, intercept-time features did not improve xG: log-loss changed by +0.0016 [\u22120.0019, +0.0052]. That case was dropped. Physics may still answer narrower questions that xG models answer badly. Proposal Using StatsBomb 360 (goalkeeper and defender positions at the shot), plus end location and shot speed where available: 1. Goalkeeper reachable set. Build a time-to-reach map over the goal mouth from the \u2026"},{"n":915,"t":"Football: wider public data with licences (SoccerNet tracking, Wyscout/figshare, more StatsBomb 360)","l":["enhancement","priority: P2","effort: M","data"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why 902 used SkillCorner (20 matches), Metrica (2 matches) and StatsBomb 360 (3 859 shots). Two matches of Metrica limit every pass-level result. Wyscout on figshare was refused by the environment proxy. Proposal Add loaders in pinneapplesystems.sports.football.data, with the same cache and SHA-256 manifest as today. Each new source records its licence and the credit it requires. Candidate sources (check each one's \u2026"},{"n":914,"t":"Football: individual acceleration\u2013speed profiles and in-match fatigue from tracking","l":["enhancement","priority: P2","effort: M"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why 902 added Kalman-RTS smoothing, plausibility gates and metabolic power (Minetti 2002 / Osgnach 2010). The Osgnach grass terrain factor could not be verified, so it stays a parameter with default 1. Clubs use individual acceleration\u2013speed (A\u2013S) profiles and their in-match drift to judge players' readiness and fatigue. Proposal A\u2013S profile per player. Fit a linear Amax(v) = A0\u00b7(1 \u2212 v/V0) to the upper envelope of \u2026"},{"n":913,"t":"Pitch control from more data: SkillCorner events, per-player parameters, value layer","l":["enhancement","priority: P2","effort: L"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why In #902 the fitted Spearman pitch control had a pass-completion log-loss of 0.150, against 0.174 for logistic regression, with the difference interval reaching zero (\u22120.023 [\u22120.048, +0.000]). With only 100 training passes it scored 0.162 against 0.218. That uses only the 2 Metrica sample matches. Proposal 1. More passes. SkillCorner open data has 20 matches of tracking. Derive passes from its event or phase \u2026"},{"n":912,"t":"Football landing point: physics-structured model vs trees, with calibrated uncertainty","l":["enhancement","priority: P2","effort: M","uq","hybrid"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why In #902, predicting the landing point from the first half of a flight (1 282 test flights) gave these median errors: | Model | Median error | |---|---| | trees | 2.44 m | | hybrid | 2.55 m | | drag physics with free g | 3.27 m | | quadratic | 7.51 m | The trees learn the feed's own height dynamics, so physics lost this case. Proposal 1. Rerun the comparison on the height-corrected feed from the calibration \u2026"},{"n":911,"t":"Football: calibrate broadcast ball height with gravity as the constraint, then infer drag and spin","l":["enhancement","priority: P1","effort: M"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why In #902, fitting each SkillCorner aerial flight with free gravity gave g = 6.09 m/s\u00b2 [6.02, 6.18] over 2 601 flights. The same fit on simulated flights gives 9.88. The deficit holds at every launch speed, so it is not backspin lift. The broadcast z is therefore not physical, and CD and spin cannot be inferred from it. Proposal Physics can repair the feed. Two candidate models of the broadcast height: \u00b7 a \u2026"},{"n":910,"t":"Cosmos Reasoner as an Autonomous Physics Lab tool, with its physical claims checked","l":["enhancement","priority: P3","effort: M","llm","agents"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why Cosmos 3's Reasoner (text + vision \u2192 text) is meant for scene understanding and planning. The Autonomous Physics Lab demos (#867, #869, #871, #879\u2013#881) drive solvers with an agent. A vision reasoner could read a camera frame or a render (\"where is the flow separating?\", \"which part is overheating?\"). Its answers would be claims that the lab can check with a solver. Proposal A tool, observeandclaim(frames, \u2026"},{"n":909,"t":"Update CosmosAdapter to Cosmos 3 (Generator + Reasoner; Diffusers / vLLM / NIM), GPU-gated","l":["enhancement","priority: P2","effort: M","gpu","interop"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why pinneappleworldmodel.physicalworld.CosmosAdapter targets the Cosmos 1 world-foundation-model NIM (POST {base}/infer with b64video). The Cosmos 3 README lists these backends: Diffusers, Transformers, vLLM, vLLM-Omni, SGLang, TensorRT-LLM and NIM. The hosted endpoints are build.nvidia.com cosmos3-nano and cosmos3-nano-reasoner. The checkpoints on Hugging Face are Cosmos3-Edge (4B), Nano (16B) and Super (64B), plus \u2026"},{"n":908,"t":"Physics-residual filter stage for video and tracking data (Curator-style)","l":["enhancement","priority: P2","effort: M","data"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why Cosmos Curator filters and deduplicates video on visual criteria. #902 showed a different kind of filter that pays off: fitting gravity to 2 601 broadcast ball flights gave g = 6.09 m/s\u00b2, so the height feed is not physical. Gating player tracking with human limits also changed the mean metabolic power from 13.7\u201368 W/kg to 7.1\u20137.4 W/kg. A physics filter catches data that looks fine but breaks the laws. Proposal \u2026"},{"n":907,"t":"Physics-labelled post-training data factory in Cosmos-ready formats","l":["enhancement","priority: P2","effort: L","data"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why Cosmos 3 Nano is meant as a base for post-training (SFT, LoRA, RL), and its Transfer variants are conditioned on control signals. PINNeAPPle simulators can produce video whose physical state is known exactly. The kinds of video they can produce: \u00b7 rigid bodies (Newton backend, #70-era); \u00b7 CFD fields: OpenFOAM / FreeCAD pipelines (#897), the Ahmed body; \u00b7 FEA, and EM (FDTD in pp.science); \u00b7 robot camera data \u2026"},{"n":906,"t":"Physics judge for world-model video: exact checks, known-answer benchmark, score card","l":["enhancement","priority: P1","effort: L","benchmark"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why Cosmos-style generators produce plausible video. Cosmos Evaluator scores \"physical plausibility\" with learned temporal representations. What is missing is a judge that checks a clip against the equations, with a stated tolerance, and says which law fails and by how much. pinneappleworldmodel.physicalworld.physicschecks already does this for one scene type: a bouncing ball, with gravity, restitution and energy \u2026"},{"n":905,"t":"Epic: industrial-grade experiment quality and visuals across examples/","l":["enhancement","roadmap","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":6,"a":false,"x":"Context A review of the 398 figures added to main on 24\u201325 Oct 2026 found three problems: \u00b7 Each PR has its own look: matplotlib defaults next to custom palettes, inconsistent colour bars and units, and some figures with empty space (for example the 4-panel mesh-study strips in #897). \u00b7 Some figures rely on tiny text. \u00b7 Very few experiments have a hero image or a video. pinneappletools.visualization.style exists, \u2026"},{"n":904,"t":"Epic: football physics, round 2 (after #902)","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":8,"a":false,"x":"Context 902 added pinneapplesystems.sports.football and examples/sports. Each case is scored on held-out data, with the same training data for every model. Measured verdicts from #902: \u00b7 Physics helped in four places: as a data check (broadcast ball height gives g = 6.09 m/s\u00b2 [6.02, 6.18], not 9.81), with little data (pitch control, player prediction), for Kalman-RTS smoothing, and as a plausibility gate for \u2026"},{"n":903,"t":"Epic: what PINNeAPPle can take from NVIDIA Cosmos 3 (physics judge, physics data, adapter)","l":["enhancement","roadmap","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":5,"a":false,"x":"Context NVIDIA Cosmos is now at Cosmos 3. It is one architecture with a Reasoner (text + vision \u2192 text: scene understanding, planning) and a Generator (text, vision, audio, action \u2192 vision, audio, action: world simulation, future prediction, synthetic data, policy learning). Sizes and the hardware the README lists for them: \u00b7 Super, 64B: H200/B200. \u00b7 Nano, 16B: H100/RTX Pro 6000. \u00b7 Edge, 4B: Jetson Thor/AGX Orin. \u2026"},{"n":777,"t":"Publish zoo: the geometries job fails verification with SHA-256 mismatches","l":[],"m":null,"c":0,"cr":"2026-10-17","up":"2026-10-17","p":null,"s":0,"a":false,"x":"The geometries job of the \"Publish zoo to the Hub\" workflow (.github/workflows/publish-zoo.yml) fails in its verify step on every run. The publish job, which handles the zoo models and datasets, passes. Example run: https://github.com/PINNeAPPle-Labs/PINNeAPPle/actions/runs/38964216575 (job geometries). It reports verify: 18 problem(s), all of them SHA MISMATCH, for example: Later runs on main fail the same way \u2026"},{"n":694,"t":"Consolidation: unify duplicate helpers inside the library","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). Duplicates found inside the library packages; each differs at the edges, so unify with tests that pin the current behaviour of every caller first. \u00b7 Three latinhypercube functions: pinneappledesign.aero.geometry, pinneappleneural.architectures.rom.parametric, pinneapplesimulation.externalsolvers.modelica.sweep (plus \u2026"},{"n":693,"t":"Consolidation: example helpers whose library counterpart behaves differently","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). The examples keep their own versions because switching would change results; decide per item whether to extend the library function (an option) and then switch. \u00b7 examples/handoffcases/airfoilld/simulation/airfoilcase.py::residuals: simulationmetadata.openfoam.parselog keeps only the first p solve per time step (2000 values instead \u2026"},{"n":692,"t":"Consolidation: example solvers that need a published reference before they move","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). \u00b7 examples/usecases/crashsurrogate/crashsurrogatepipeline.py::abramowiczjonessolver (axial crush of a square tube) \u2192 pinneapplephysics.closedform once tested against the mean crush force formula and values in Abramowicz & Jones (1984). \u00b7 examples/benchmarksuite/14physicssimulationsurrogateworkflow.py: RectMesh2D, solveelasticity (Q4 \u2026"},{"n":691,"t":"Consolidation: unstructured streamlines, strict OpenFOAM dictionary editor, erosion models, MCMC inverse, rollout evaluator","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-11-03","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). Generic capabilities found in a downstream project; each must be written from the literature (cited in docstrings) and validated on its own. Nothing is copied from that project. \u00b7 Streamlines on an unstructured finite-volume mesh \u2192 pinneappledata.cae.streamlines.trace(mesh, U, seeds, ...) + a VTP reader: point-in-cell locator, \u2026"},{"n":690,"t":"Consolidation: shared helpers of the physics-ensemble examples","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). Near-duplicates across examples/physicsensemble/fivemodelfamiliesgif.py, fnopinngnnsolvers.py, comparelookaheadgif.py and sensornoisegif.py: \u00b7 iccoefficients (Fourier coefficients of the periodic initial condition) \u2192 e.g. AdvectionDiffusion1D.iccoefficients(u0, nmodes); \u00b7 ParametricPINN / trainpinn / pinnpredict (parametric PINN \u2026"},{"n":689,"t":"Consolidation: zoo release manifest and Hub verification into pinneapple_hub.zoo","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). scripts/zoo/buildassets.py (hubonlyentry, carryversions) and scripts/zoo/publishtohub.py (plan, verify, staging / allowunpublished) hold release logic (manifest entries with SHA-256, sizes, column dtypes and shapes; version history; upload plan and checksum verification) that belongs next to pinneapplehub.zoo.artifacts. The scripts \u2026"},{"n":688,"t":"Consolidation: inverse-heat app imports the library directly","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). apps/inverseheat/inverseheat/engine.py is an alias of pinneappleanalysis.inverseproblems.heattransfer that also patches EXAMPLE. Switch apps/inverseheat/inverseheat/api.py and tests/testinverseheat.py to the library module (pass the example path explicitly instead of patching a module global), keeping the alias for old imports. \u2026"},{"n":687,"t":"Consolidation: move the black-hole run storage into pinneapple_physics.blackhole","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). \u00b7 examples/blackholeweather/simulate.py::loadrun and the chunked checkpoint / resume loop in main \u2192 pinneapplephysics.blackhole (runtodisk, loadrun). \u00b7 examples/blackholeweather/evaluate.py::cellvolumes \u2192 use 2\u03c0 \u00b7 AccretionFlow.vol. \u00b7 Then remove the evaluate.py - simulate.py and trainforecaster.py - simulate.py lines from \u2026"},{"n":686,"t":"Consolidation: move the observatory analyses into pinneapple_physics.astro","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). apps/observatory/observatory/api.py still composes library astro calls into analyses that belong in the library: | App symbol | Target | |---|---| | best-window part of target (24 h altitude/airmass, dark sky, longest run above minalt, Moon separation) | astro.phenomena.observingwindow | | targetvec (body name or \"HR n\" \u2192 apparent \u2026"},{"n":677,"t":"Validate the physics-residual FDI detector on real data (needs an environment that can reach batadal.net)","l":["enhancement","priority: P2","effort: S","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The numbers for pinneapplesecurity.cps in docs/guides/physicsresidualattackdetection.md come only from the simulated three-tank benchmark (cpsbench). The loader and residuals for real data are scoped in #645 (BATADAL adapter). This issue is about running that validation and publishing the results. Blocker The build environment's outbound proxy refused batadal.net (HTTP 403). The run needs one of: \u00b7 a cloud \u2026"},{"n":676,"t":"Delete the merged branch feat/latent-and-cyber","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"PR #646 was merged into main (merge commit 7b6c8d6). Its branch feat/latent-and-cyber is still on the remote and is no longer needed. To do \u00b7 Delete feat/latent-and-cyber on GitHub (the \"Delete branch\" button on #646, or git push origin --delete feat/latent-and-cyber). Acceptance test \u00b7 git ls-remote --heads origin feat/latent-and-cyber returns nothing. \u00b7 main still contains pinneapplesecurity/cps.py and \u2026"},{"n":675,"t":"pp.benchmark: accept any zoo dataset by name (follow-up to zoo v2)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Scope. Once the pp.benchmark API (branch feat/benchmark-api) is merged, pp.benchmark should accept any pp.datasets zoo dataset by name as its problem source. This is the integration hook of zoo v2. It could not land with the zoo PRs because the benchmark API is not on main yet. What to add. \u00b7 A registry entry. In pinneappleanalysis.benchmark.registry, add a zoo: problem source backed by pp.datasets.load(name, \u2026"},{"n":673,"t":"lunar_rover_3d example: use the zoo contact PINN (v1.1.0) and refresh docs/assets/lunar_rover","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"examples/usecases/terramechanics/lunarrover3d.py still trains its own contact PINN (4000 epochs). The rover dashboard now uses pp.zoo.load(\"rovercontactgrc1viper\") v1.1.0: \u00b7 trained on the current physics with slip-sinkage; \u00b7 held-out RMSE: Fx 0.22 N, Fz 0.47 N, My 0.071 N m; \u00b7 0.33 N RMS along the crater run. To do: \u00b7 Use the zoo model in the example (ZooContactSurrogate), with the physics guard (checkphysics). \u00b7 \u2026"},{"n":672,"t":"VIPER CAD: compare with NASA photos and revisit the TRIDENT position","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The parametric VIPER CAD (pinneapplesimulation/vehicle/viper.py, VIPERSOURCES) was checked against two things: \u00b7 the published dimensions; \u00b7 the layout that NASA renders and photo captions describe. It was not compared side by side with the photographs, because they could not be downloaded from the build environment. To do: \u00b7 Put the beauty and side renders next to NASA VIPER photos (assembly, mast raise, \u2026"},{"n":671,"t":"Rover grade sweep: average the slip over the in-rut regime","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"scenarios.gradesweep averages over the second half of a 14 s run. That window straddles a change of regime. Before the ruts. For roughly the first wheelbase (~1 m, ~11 s), the rear wheels drive on virgin soil. The slip is about 0.17 on 15\u00b0 and about 0.26 on 20\u00b0. In the ruts. Once the rear wheels reach the front wheels' ruts, multi-pass shear lets them push, and the slip of all four wheels falls to about 0. Effect on \u2026"},{"n":670,"t":"Delete the merged geometry-library branches","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Both branches were merged and can be deleted from the remote: \u00b7 feat/geometry-library (#633) \u00b7 fix/geometry-determinism (#648)"},{"n":669,"t":"Geometry library: new entries (bicycle or motorbike with rider, business jet)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Candidates from the original geometry-library scope that were not built (12 new entries were added, the minimum was 8): \u00b7 Road bicycle or motorbike with rider: a time-trial cyclist position for drag and drafting studies, a rider on a sport motorbike. \u00b7 Business jet: T-tail, rear-mounted engines. Same quality bar as the other entries (see docs/guides/geometrylibrary.md): \u00b7 published dimensions with sources, estimates \u2026"},{"n":668,"t":"Geometry library: improve fidelity where info() flags estimates (DU blade sections, KCS offsets, airliner trailing edge)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Three documented fidelity gaps in pp.geometries. Each is flagged in info(name)[\"estimates\"] or [\"knownissues\"]. 1. windturbinenrel5mw: blade sections. The DU 40/35/30/25/21 and NACA 64-618 sections of the NREL 5-MW reference are approximated by NACA 4-digit sections with the same thickness ratio and 2-4 % camber. Use the published coordinates (the NREL 5-MW OpenFAST model, Apache-2.0) with a licence note, and keep \u2026"},{"n":667,"t":"Geometry library: regenerate the turntable GIF smaller (or move it to the Hub)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"docs/assets/geometrylibrary/turntable.gif is 2.5 MB: 17 geometries, 24 frames, a 4-column grid of 240x165 tiles. It was rendered before vertices were snapped to the 0.1 um grid (#648). It looks identical, but it is no longer what the current code produces. Options: \u00b7 Regenerate it with python scripts/geometrylibrary.py sheet --frames 16 and a smaller palette or tiles, aiming for under 1 MB. \u00b7 Or publish the \u2026"},{"n":666,"t":"Check the geometry-library Hub files from a user machine (pp.geometries.load download path)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The fine files of pp.geometries were published to https://huggingface.co/datasets/PINNeAPPle-Labs/geometry-library by the geometries job of publish-zoo.yml (run 38431677342). The job's anonymous check reports verify-hub: 153 files OK, 0 problem(s). That check ran on the GitHub runner only. The load() download path has not been exercised end to end from outside CI. To check: \u00b7 python scripts/geometrylibrary.py \u2026"},{"n":665,"t":"Run the CAARC building OpenFOAM example and record the drag coefficient against the wind tunnel","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"examples/geometrylibrary/01caarcbuildingwindopenfoam.py loads caarcbuilding (isolated, surroundings=False). It then runs steady RANS at 10 m/s through the generic STL path of pp.cfd.ExternalFlow, on fixed ground. So far it has only been checked on a machine without OpenFOAM, where it writes the case and stops. It needs a real run: \u00b7 Run coarse and medium on a machine with OpenFOAM (FOAMBASHRC). \u00b7 Compare the \u2026"},{"n":664,"t":"Geometry library: bring the light files of the airliner, two-stage launcher and VIPER under 2 MB","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The goal for the committed light level of pp.geometries (data/geometries/ /, STL + glTF) is under 2 MB per geometry. Three entries are above it: | entry | light triangles | committed size | |---|---|---| | airlinera320 | 34 560 | ~2.5 MB | | launchvehicletwostage | 34 368 | ~2.5 MB | | viperrover | 24 804 | ~2.1 MB | The airliner and the launcher wrap pinneappledesign.aero.airliner.Airliner and \u2026"},{"n":647,"t":"Process-tampering detection from physical side signals (acoustic, power) in manufacturing","l":["enhancement","priority: P3","effort: L"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B8 in docs/dev/LATENTANDCYBEREVALUATION.md (ranked last, not planned for now; kept here so the idea and its test are not lost). Acoustic and power side channels of a machine carry the physics of what it is doing (e.g. Al Faruque et al., ICCPS 2016, for additive manufacturing). A physics model of the expected signal for a given toolpath would let pinneapplesecurity.cps flag a sabotaged job (changed infill, layer \u2026"},{"n":645,"t":"BATADAL adapter for the physics-residual FDI benchmark (public water-network attack data)","l":["enhancement","priority: P2","effort: S","data","benchmark"],"m":null,"c":1,"cr":"2026-10-13","up":"2026-10-15","p":null,"s":0,"a":false,"x":"This is a follow-up to B1 in docs/dev/LATENTANDCYBEREVALUATION.md, which was implemented as pinneapplesecurity.cps and cpsbench. The FDI benchmark currently runs on a simulated, seeded three-tank water network. The public BATADAL dataset (Taormina et al., J. Water Resour. Plann. Manage. 2018) is the natural real-data test. It was not reachable from the build environment when B1 was written. Scope \u00b7 A loader for the \u2026"},{"n":644,"t":"Signed trust reports whose physics residual is re-verified on load","l":["enhancement","good first issue","priority: P2","effort: S"],"m":null,"c":4,"cr":"2026-10-13","up":"2026-10-19","p":null,"s":0,"a":true,"x":"Item B7 of docs/dev/LATENTANDCYBEREVALUATION.md. A quick win. What exists: DSSE signing, attestation, and TrustReport.todict. Goal: a trust report signed together with the model and inputs it describes. On load, the recorded physics residual is recomputed from the signed model and inputs and compared with the stored value. Acceptance test \u00b7 A signed trust report whose recorded physics residual is recomputed on load. \u2026"},{"n":643,"t":"Federated, differentially private training of surrogates across sites","l":["enhancement","priority: P3","effort: L","training"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B6 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 FedAvg (McMahan et al., AISTATS 2017). \u00b7 Secure aggregation (Bonawitz et al., CCS 2017). \u00b7 DP-SGD with RDP accounting (Abadi et al., CCS 2016; Mironov 2017). What exists: DP-SGD and the RDP accountant. There is no federated training loop yet. Acceptance test Three sites with different operating regimes train one surrogate: \u00b7 At \u03b5 \u2264 8, the federated \u2026"},{"n":642,"t":"Adversarial robustness and certification of physics surrogates (IBP, randomised smoothing, physics-consistent attacks)","l":["enhancement","priority: P3","effort: M","surrogate"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B5 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Interval bound propagation (Gowal et al., 2018). \u00b7 Randomised smoothing (Cohen, Rosenfeld & Kolter, ICML 2019). \u00b7 Lipschitz-constrained networks. What exists: modelsecurity.adversarialsensitivity (empirical worst case) and TrustGate. Acceptance test For an MLP surrogate of a parametric PDE: \u00b7 The certified output radius from IBP or smoothing \u2026"},{"n":641,"t":"Sensor spoofing detection for vehicles and robots through vehicle-dynamics consistency (GNSS / IMU / odometry)","l":["enhancement","priority: P3","effort: L"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B4 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 GPS spoofing of UAVs (Kerns et al., J. Field Robotics 2014). \u00b7 Control-invariant attack detection (Choi et al., CCS 2018). \u00b7 SAVIOR (Quinonez et al., USENIX Security 2020). What exists: vehicle bicycle-model runs, EKF and UKF, the pinneapplesecurity.cps framework, and the rover vehicle dynamics (pinneapplesimulation.vehicle). Acceptance test On a \u2026"},{"n":640,"t":"Physics-residual screening of training data against poisoning, recorded in the signed dataset manifest","l":["enhancement","priority: P2","effort: M","data"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B3 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: certified defences against data poisoning (Steinhardt, Koh & Liang, NeurIPS 2017). Poisoning of scientific-ML surrogates is barely studied. Physics residuals give a label-free consistency test for each training sample. What exists: residual functions, TrustGate, integrity manifests and attestation, and secretsscan. Integration point: data \u2192 model. \u00b7 \u2026"},{"n":639,"t":"Power-grid state-estimation FDI detection with dynamic physics residuals (IEEE 14/118-bus)","l":["enhancement","priority: P2","effort: L","digital-twin"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B2 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Liu, Ning & Reiter, CCS 2009. \u00b7 Kosut et al., IEEE Trans. Smart Grid 2011 (GLRT). \u00b7 Manandhar et al., IEEE Systems Journal 2014 (Kalman filter with chi-squared and Euclidean detectors). \u00b7 Survey: Musleh, Chen & Dong, IEEE Trans. Smart Grid 11(3) 2020. What exists: EKF and EnKF, the pinneapplesecurity.cps residual framework, and CUSUM. PINNeAPPle \u2026"},{"n":638,"t":"Latent generative surrogates (latent diffusion / flow matching) with a physics check on every sample","l":["enhancement","priority: P3","effort: L","surrogate","uq"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A6 of docs/dev/LATENTANDCYBEREVALUATION.md. Research track. State of the art: \u00b7 Latent diffusion (Rombach et al., CVPR 2022) and flow matching (Lipman et al., ICLR 2023). \u00b7 Autoregressive conditional diffusion for turbulence (Kohl, Chen & Thuerey, arXiv:2309.01745). \u00b7 Physics-informed diffusion (Shu, Li & Barati Farimani, JCP 2023; Bastek, Sun & Kochmann, ICLR 2025). \u00b7 GenCast (Price et al., Nature 2025). What \u2026"},{"n":637,"t":"Geometry latent spaces: shape codes as surrogate inputs and latent density as a geometry OOD score","l":["enhancement","priority: P3","effort: L","surrogate","geometry"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A5 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: DeepSDF (Park et al., CVPR 2019), occupancy networks (Mescheder et al., CVPR 2019), PointNet (Qi et al., CVPR 2017), GINO (Li et al., NeurIPS 2023), Transolver (Wu et al., ICML 2024). What exists: \u00b7 geometryoodguardrail, which uses hand-made features. \u00b7 pinneappledesign parametric geometry and optimiser. \u00b7 The car2d generator and voxelisation. \u00b7 The \u2026"},{"n":636,"t":"Physics-constrained latent spaces: conservation and structure preserved in latent coordinates","l":["enhancement","priority: P3","effort: L","rom"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A4 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Conservation-enforcing nonlinear-manifold ROMs (Lee & Carlberg, \"Deep conservation\", JCP 2021). \u00b7 Structure-preserving latent dynamics, port-Hamiltonian and GENERIC (Hern\u00e1ndez et al., JCP 2021). \u00b7 Physics-informed latent training (Kim et al., JCP 2022). koopmanpiae is a starting point. Integration point: model training, with the conserved \u2026"},{"n":635,"t":"Latent dynamics surrogates with stability checks and per-horizon rollout trust","l":["enhancement","priority: P2","effort: M","uq","rom"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A3 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Operator inference (Peherstorfer & Willcox, CMAME 2016), and its energy-preserving and stable variants (Sawant, Kramer & Peherstorfer, CMAME 2023; Goyal, Pontes Duff & Benner, 2023). \u00b7 Koopman autoencoders (Lusch, Kutz & Brunton, Nat. Commun. 2018). \u00b7 Latent ODEs (Rubanova et al., NeurIPS 2019). \u00b7 LaSDI (Fries, He & Choi, CMAME 2022). \u00b7 Latent \u2026"},{"n":634,"t":"Latent data assimilation: EnKF / 3D-Var in POD or autoencoder coordinates for digital twins","l":["enhancement","priority: P2","effort: M","rom","digital-twin"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A2 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Amendola et al., ICCS 2021. \u00b7 Peyron et al., QJRMS 147 (2021). \u00b7 Reduced-order EnKF and POD-4D-Var (Cao et al., IJNMF 2007). \u00b7 Review: Cheng et al., IEEE/CAA J. Autom. Sinica 10 (2023). What exists: EnsembleKalmanFilter, var4d, POD and autoencoder encoders, latent dynamics (OpInf, Koopman), and digital-twin monitoring. Integration point: data \u2192 \u2026"},{"n":630,"t":"Colab notebooks and MCP server: switch to pp.benchmark and pp.geometries once merged","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Follow-up of #629 (Colab notebooks, AGENTS.md, pinneapple-mcp). pp.zoo / pp.datasets (#621) are already used there. Two APIs were not on main when it was written: pp.benchmark (equal-budget benchmark API, branches feat/benchmark-api / feat/equal-budget-benchmark, #598) \u00b7 notebooks/colab/03equalbudgetbenchmark.ipynb: the cell marked \"Switch to pp.benchmark\" runs only when pinneappleanalysis.benchmark and \u2026"},{"n":626,"t":"Test isolation: a leaked default device (MPS) makes unrelated tests fail","l":["bug","priority: P2","effort: M"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Documented in .agent/FAILEDAPPROACHES.md #7: some tests leave the default device on mps, so later tests fail non-deterministically (different DeviceContext identities across runs). A fixture that resets the device fixed 12 failures but not the cause. Next step: bisect the suite to find the test that leaks, fix it at the source, and add an autouse fixture that fails the test that leaves the device changed."},{"n":625,"t":"Full regression suite: re-measure the failures on v0.7.0 and fix or quarantine each one","l":["bug","priority: P1","effort: M"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The last full 37-file regression (0.6.2 baseline) ended with 68 failed, 798 passed, 155 skipped. Part of the failures is a test-isolation leak (device left on mps), the rest is unclassified. Only tests/testmanufacturedsolutions.py blocks the workflow today; everything else runs with continue-on-error. Next step \u00b7 run the full suite on v0.7.0 and list the failing test ids \u00b7 classify each one: real bug, environment, \u2026"},{"n":624,"t":"Method catalogue: validate the methods that are still untested or tested without a reference","l":["enhancement","priority: P1","effort: L"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"At the last count (2026-10-02, branch feat/validation-batch4) the catalogue had 42 untested methods and 53 tested without a reference solution. Regenerate pinneapplecatalog/methodstatus.json first: the numbers are old. Done when \u00b7 the status file is regenerated on v0.7.0 and the counts are written here \u00b7 a validation batch (5 to 10 methods per batch, each against a manufactured or published reference) is merged per \u2026"},{"n":623,"t":"Review and merge the four open pull requests (#559, #598, #606, #621)","l":["documentation","priority: P1","effort: S"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Four pull requests are open and none is being worked on in the issue list: \u00b7 #559 REA bridge + harvested numerics \u00b7 #598 Equal-budget comparison toolkit and the \"Choosing a method\" page (#299) \u00b7 #606 [A8] Lightweight governance \u00b7 #621 Model zoo (pp.zoo) and dataset hub (pp.datasets) Next step: review in this order: #606 (small, unblocks contribution rules), #598, #621 (touches the catalogue in #528), #559 (largest). \u2026"},{"n":620,"t":"Developer showcases: Hugging Face Spaces, conda-forge, conference talks and short videos","l":["documentation","priority: P2","effort: M","area: release-quality","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal Put PINNeAPPle where developers already look, with low effort per item and cumulative reach. Checklist \u00b7 Hugging Face Spaces (Gradio), one per showcase model from the zoo: airfoil surrogate (draw a CST shape, get Cl, Cd and the field, with trust checks), rover terramechanics, heat PINN. Each Space links back to the repo and the model card. \u00b7 conda-forge feedstock for pinneapple (core plus optional extras), with \u2026"},{"n":619,"t":"Educational series \"Under the hood\": numerics behind CFD and Physics AI, as notebooks and posts","l":["documentation","priority: P2","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal A recurring series of short, runnable notebooks (Colab), each with a figure or animation and a post, that explain one numerical detail most users never see and show it working in PINNeAPPle. It is educational outreach that teachers and students can reuse. First episodes 1. Rhie-Chow interpolation and the checkerboard problem on collocated grids (#613). 2. Non-orthogonal correction on skewed meshes. 3. Upwind vs \u2026"},{"n":618,"t":"pp.forecast(lat, lon): wind and solar forecasts with uncertainty for energy and data-centre use","l":["enhancement","priority: P3","effort: L","area: ecosystem","uq"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal A one-line API, and a small HTTP service, giving wind speed at hub height and solar irradiance or PV power for any location over the next hours to days, with calibrated uncertainty bands and a reliability horizon. The audience is developers building energy, EV-charging and data-centre scheduling tools. Scope \u00b7 Data: open sources only (Open-Meteo / ECMWF open data, ERA5 for training and verification); licences \u2026"},{"n":617,"t":"\"Explain this simulation\": upload a CFD case or a model, get a plain-language trust report","l":["enhancement","priority: P2","effort: M","area: apps","ux"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal A public web tool and an API: upload an OpenFOAM case (or a VTK result, or a PINNeAPPle model) and receive a trust report in plain language. The report covers what was simulated, which models and boundary conditions were used, mesh quality, convergence, conservation and residual checks, what can and cannot be concluded, and what to fix. It is aimed at engineers and technical managers who do not do ML or CFD \u2026"},{"n":616,"t":"Public Physics AI challenges with a leaderboard judged by pp.benchmark","l":["enhancement","priority: P2","effort: L","area: ecosystem","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal Recurring public challenges (\"Kaggle for Physics AI\") in which anyone submits a method and pp.benchmark scores it under an equal compute budget, with physics checks that a submission must pass. Results go on a public leaderboard. Scope \u00b7 Challenge format: \u00b7 a problem spec, the training data and budget (FLOPs or wall clock on a reference GPU), and hidden test and OOD sets; \u00b7 metrics: integrals and fields \u2026"},{"n":615,"t":"Lightweight physics surrogates for game engines and robot simulators (ONNX export to Godot, Unity, Unreal, MuJoCo, Isaac)","l":["enhancement","priority: P3","effort: L","area: ecosystem","surrogate","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal Let game and robotics developers use PINNeAPPle surrogates as fast, physically checked effects and contact models: water and waves, wind loads, granular terrain (the lunar rover's wheel-soil model), heat. The surrogates are exported to ONNX and called from engine plug-ins. Scope \u00b7 pp.export.onnx(model, ...) for zoo models, with fixed input/output signatures, units in the metadata, a validity range, and a small \u2026"},{"n":614,"t":"Showcase notebook: a coding agent solves a physics problem in Colab and PINNeAPPle verifies the answer","l":["documentation","priority: P2","effort: M","area: ecosystem","agents"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal A Colab notebook, and a short recorded video, in which a coding agent running inside Colab (Gemini CLI or Antigravity CLI, on a free GPU runtime) is asked to solve a physics problem with PINNeAPPle, and the PINNeAPPle checks decide whether the answer can be trusted. The message is that an agent can write plausible but wrong physics code, and PINNeAPPle's physics checks catch it. Depends on \u00b7 Colab notebooks, \u2026"},{"n":613,"t":"Collocated finite-volume SIMPLE solver with Rhie-Chow interpolation for a NACA 2412, plus a surrogate trained on it","l":["enhancement","priority: P2","effort: L","surrogate","solvers","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal Reproduce a classic CFD teaching result and extend it with Physics AI: 1. A steady, incompressible Navier-Stokes solver on a collocated finite-volume grid using the SIMPLE algorithm, run on a NACA 2412 airfoil. 2. Rhie-Chow momentum interpolation of the face fluxes, to suppress the odd-even (checkerboard) pressure-velocity decoupling that appears with linear interpolation. The run shows the continuity residual \u2026"},{"n":604,"t":"Scale-conditioned surrogates: condition models on resolution, filter width or physical scale","l":["enhancement","priority: P2","surrogate","neural-operators"],"m":null,"c":1,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Problem: Surrogates are trained for one resolution and one implicit filter. Using them at another resolution (super-resolution, coarser meshes, LES with a different \u0394) silently changes what they represent. FNO is discretisation-invariant only in its architecture, not in the physics of the filtered data. Proposal: \u00b7 Scale conditioning: add a scale input to the surrogate API in pinneappleneural.architectures (FNO, \u2026"},{"n":603,"t":"Scale-driven adaptive fidelity: switch between surrogate, RANS and LES by the scales the question needs","l":["enhancement","priority: P2","orchestration","solvers"],"m":null,"c":1,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Problem: The existing adaptive-fidelity issues (#161, #347) decide between surrogate and solver from trust and error. They do not consider whether the question needs resolved turbulent scales. A surrogate trained on RANS cannot answer a question about peak unsteady loads or mixing at the Kolmogorov/Taylor scale, however small its validation error. Proposal: Extend the adaptive-fidelity controller with a scale \u2026"},{"n":601,"t":"Closure model benchmarking: compare RANS/LES closures for the unresolved scales on reference DNS/LES data","l":["enhancement","priority: P2","solvers","benchmark"],"m":null,"c":1,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Problem: PINNeAPPle runs OpenFOAM with several turbulence models and has hybrid/neural closures (#211), but no common harness compares closures on the same case against reference data. Users choose k-\u03c9 SST, Smagorinsky, WALE or a learned closure by habit. Proposal: pinneapplesimulation.closures.benchmark: \u00b7 Cases: canonical cases with public reference data, cited with their licences: \u00b7 turbulent channel at Re\u03c4 = \u2026"},{"n":594,"t":"COMSOL bridge through MPh (parameter sweeps \u2192 dataset)","l":["enhancement","priority: P3","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: COMSOL 6.3/6.4 surrogate training, Model Manager; MPh (MIT, community) drives COMSOL's Java API from Python. What PINNeAPPle already has: Nothing beyond mentions in the tool-recommendation tables. Proposal: Optional bridge: open .mph, set parameters, solve, export scalars and fields to UPD/xarray; reuse the DOE samplers. Acceptance (rule D1 \u2014 independent reference): Skipped without a COMSOL licence; with \u2026"},{"n":593,"t":"Rescale REST connector: run a DOE campaign on Rescale and pull results","l":["enhancement","priority: P3","orchestration","hpc"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Rescale API v2 (jobs, submit, statuses, files), AI Physics dataset format (PyVista-compatible). What PINNeAPPle already has: SLURM script generation, Prefect flows, file-lock sharded OpenFOAM campaigns; no managed cloud backend. Proposal: A campaign backend that submits each DOE point as a Rescale job, polls, downloads outputs and registers them in pinneappleregistry. Acceptance (rule D1 \u2014 independent \u2026"},{"n":592,"t":"Onshape connector: sample configuration parameters and export geometry for DOE","l":["enhancement","priority: P3","interop","cad"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Onshape REST API (configurations, encodeConfigurationMap, STL/STEP/Parasolid export); Luminary \u00d7 Onshape partner app generating SHIFT-Wing variants. What PINNeAPPle already has: STEP via gmsh, CadQuery; Onshape appears only in the resource catalog. Proposal: pinneappledesign.geometry.io.onshape: read configuration parameters, LHS over them, export STL per variant, record document/version IDs as dataset \u2026"},{"n":591,"t":"RBF / Kriging / EBF approximation models with training-set outlier detection","l":["enhancement","good first issue","priority: P2","surrogate"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Dassault Isight approximation models (RSM, Kriging, RBF, EBF), COMSOL surrogate training (GP, PCE, DNN), 3DEXPERIENCE outlier exploration. What PINNeAPPle already has: NumPy GP in designoptimizer; no RBF surrogate; no outlier screening of training data. Proposal: RBF interpolant (thin-plate/multiquadric with polynomial tail), ordinary Kriging, leave-one-out error, and an outlier score per training \u2026"},{"n":590,"t":"NVIDIA Warp backend: warp.fem weak forms + zero-copy torch interop","l":["enhancement","priority: P3","solvers","gpu"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: NVIDIA Warp 1.18 (Apache-2.0): @wp.kernel with wp.Tape autodiff, warp.fem integrands on grid/tet/hex geometries, wp.totorch via DLPack. What PINNeAPPle already has: Warp only indirectly through the Newton bridge; ROADMAP \u00a73 lists Warp as a candidate differentiable backend. Proposal: computebackends.warp: zero-copy tensors, a Poisson/elasticity example in warp.fem, differentiable particle step for \u2026"},{"n":589,"t":"Neural networks inside variational forms (firedrake.ml-style) in the FEniCS bridge","l":["enhancement","priority: P3","hybrid","fem"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Firedrake (LGPL-3.0, clean-room): femoperator / mloperator embed PyTorch/JAX models in UFL forms with adjoints. What PINNeAPPle already has: fenicsbridge, hybrid surrogates; no NN term inside a weak form. Proposal: External-operator term in a FEniCS form evaluated by a torch model, with the adjoint provided by torch autograd (method from the published paper, not Firedrake code). Acceptance (rule D1 \u2014 \u2026"},{"n":588,"t":"ParaView Catalyst 2 in-situ adaptor for solvers and surrogates","l":["enhancement","priority: P3","visualization"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: ParaView 6.2 (BSD-3-Clause, Copyright.txt): Catalyst 2 with Conduit Blueprint; NekRS/FluidX3D/M-Star render while running. What PINNeAPPle already has: PyVista/VTK export, trame, Rerun bridge; nothing streams fields in situ from the native solvers. Proposal: Optional catalyst adaptor publishing mesh + fields as Conduit Blueprint every N steps from fvm, lbm, stablefluids and surrogate rollouts. Acceptance \u2026"},{"n":587,"t":"JAX-Fluids as an optional external solver (GPL: subprocess bridge, no code reuse)","l":["enhancement","priority: P3","solvers","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: JAX-Fluids 2.0 (GPL-3.0): fully differentiable compressible two-phase solver (level-set / diffuse interface), level-set immersed boundaries, multi-GPU. What PINNeAPPle already has: jaxcfdsolver.py (incompressible, Apache); no compressible two-phase solver. Proposal: Out-of-process bridge (case JSON in, HDF5 out) behind an optional extra, never imported in-process or vendored; clean-room policy for any \u2026"},{"n":586,"t":"Nektar++ bridge (spectral/hp element, MIT) for high-order reference data","l":["enhancement","priority: P2","solvers","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Nektar++ 5.9 (MIT): CG/DG/HDG/flux-reconstruction spectral/hp, incompressible and compressible N\u2013S, linear stability and adjoint, curvilinear high-order meshes. What PINNeAPPle already has: Bridges to OpenFOAM, FEniCS, CalculiX, FluidX3D, MuJoCo\u2026; no high-order solver. Proposal: Session-XML generation from a ProblemSpec, runner (subprocess/Docker), field reader into UPD \u2014 same pattern as the OpenFOAM \u2026"},{"n":585,"t":"Differentiable implicit linear solves with matrix construction by tracing (PhiFlow-style)","l":["enhancement","priority: P2","solvers","autodiff"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: PhiFlow (MIT): sparse matrices built automatically by tracing a linear function; preconditioned solvers with implicit (adjoint) gradients; dimension-agnostic code. What PINNeAPPle already has: Implicit steps in fdm.py/fvm.py assemble matrices by hand; gradients through solves are not implicit. Proposal: A linearsolve(f, rhs) helper: trace f to a sparse matrix once, solve with CG/BiCGStab, backward pass \u2026"},{"n":584,"t":"Neural-corrected coarse solver trained through the rollout (solver-in-the-loop)","l":["enhancement","priority: P2","training","hybrid"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: APEBench CorrectedStepper; PhiFlow 'solver-in-the-loop' (Um et al., NeurIPS 2020). What PINNeAPPle already has: Differentiable torch solvers (fvm, lbm, spectral), hybrid surrogates (hybridsurrogatephysics). Proposal: Wrap a coarse differentiable solver with a learned correction (sequential or parallel composition) trained by unrolling k steps. Acceptance (rule D1 \u2014 independent reference): 1-D Burgers at \u2026"},{"n":583,"t":"Procedural PDE datasets on the fly (APEBench-style) using the new ETDRK4","l":["enhancement","priority: P2","data","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: APEBench (MIT): datasets are generated procedurally by a spectral ETDRK reference solver (Exponax) instead of downloaded; scenarios are parameterized by normalized 'difficulty' coefficients; autoregressive rollout metrics. What PINNeAPPle already has: numericalsolvers/etdrk4.py (S27), PDE presets, fieldmetrics. Proposal: pinneappledata.procedural: periodic 1/2/3-D scenarios (advection, diffusion, \u2026"},{"n":582,"t":"The Well adapter: WellDataset \u2192 PINNeAPPle dense volumes + leaderboard-comparable metrics","l":["enhancement","priority: P2","data","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: PolymathicAI The Well (BSD-2-Clause): 16 physics datasets (fluids, MHD, supernovae, acoustics, biology), WellDataset loader, VRMSE / binned spectral MSE / Wasserstein-1 / windowed DTW metrics. What PINNeAPPle already has: Planned in ROADMAP \u00a74 (pinneappledata.adapters.welladapter), not implemented. fieldmetrics now reports vrmse and pearson with The Well's definitions. Proposal: Adapter to the \u2026"},{"n":581,"t":"Viewer with hash-keyed inference cache and surrogate-vs-truth diff","l":["enhancement","good first issue","priority: P2","frontend","twin3d"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: NVIDIA Omniverse digital-twins-for-fluid-simulation blueprint (SHA256-keyed .npz cache). What PINNeAPPle already has: twin3d viewer, pinneappleapp. Proposal: Re-infer on every parameter change, cache by input hash, diff tab against ground truth. Acceptance (rule D1 \u2014 independent reference): Same input \u2192 same hash and a cache hit; zero diff when surrogate equals truth. Origin: \u00a72 item 15 Related PR: #559"},{"n":580,"t":"Parametric RBF morphing of tessellated geometry (no CAD needed)","l":["enhancement","good first issue","priority: P2","design-optimization","geometry"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: STAR-CCM+ 2506 Parametric Morphing, SU2 RBF deformation. What PINNeAPPle already has: Absent (optimization needs parametric geometry). Proposal: RBF morphing with control points and parameter vectors acting on an STL. Acceptance (rule D1 \u2014 independent reference): Exact interpolation at control points; zero displacement outside the support; no inverted elements (positive Jacobian). Origin: \u00a72 item 13 \u2026"},{"n":579,"t":"Design study as a first-class object (Study \u2192 Designs \u2192 Scenarios + comparison view)","l":["enhancement","priority: P2","orchestration","ux"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Autodesk CFD Design Study Automation, COMSOL Model Manager, Simcenter Studio. What PINNeAPPle already has: pinneapplelab, pinneappleregistry. Proposal: Study/Design/Scenario hierarchy in the registry + a comparison view in pinneappleapp. Acceptance (rule D1 \u2014 independent reference): Round trip: a saved and reloaded study returns identical results; the comparison sorts by KPI. Origin: \u00a72 item 12 Related \u2026"},{"n":578,"t":"Adjoint: MMA optimizer and volumetric B-spline parameterization","l":["enhancement","priority: P2","design-optimization"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: OpenFOAM ESI adjointOptimisation, SU2 (RBF, Hicks\u2013Henne). What PINNeAPPle already has: ContinuousAdjointSolver, ShapeParametrization. Proposal: MMA (Svanberg 1987) and volumetric B-spline morphing boxes. Acceptance (rule D1 \u2014 independent reference): MMA reproduces the optimum of Svanberg's test problem; zero control-point displacement leaves the geometry unchanged. Origin: \u00a73 Related PR: #559"},{"n":577,"t":"REA: native binary analysis (FMUs, solvers) with a Ghidra provider","l":["enhancement","priority: P3","rea"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: REA openbinary + Ghidra/Hopper/IDA providers. What PINNeAPPle already has: reabridge covers JavaScript and provenance; fmuinspect covers the ELF symbol table. Ghidra could not be installed in the sandbox (GitHub Releases download blocked). Proposal: rea setup with Ghidra on a machine with access; ReaClient.openbinary/decompile wrappers + a native-Evidence summarizer. Acceptance (rule D1 \u2014 independent \u2026"},{"n":576,"t":"PhysicsNeMo models not yet exposed: FIGConvNet, TopoDiff, DLWP-HEALPix","l":["enhancement"
