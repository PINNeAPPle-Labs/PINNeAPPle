,"priority: P3","neural-operators"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: NVIDIA PhysicsNeMo (Apache-2.0). What PINNeAPPle already has: physicsnemobridge exists; these models are not exposed. Proposal: Expose through the bridge first (no reimplementation); reimplement only where justified. Acceptance (rule D1 \u2014 independent reference): Forward smoke test + one small training case per model. Origin: ledger: PhysicsNeMo Related PR: #559"},{"n":575,"t":"In-browser PDE preview (SymbolicPDE \u2192 GLSL), VisualPDE-style","l":["enhancement","priority: P3","frontend"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: VisualPDE (MIT) \u2014 located with REA: setRDEquations, urlcodec, auto steps-per-frame. What PINNeAPPle already has: pinneappleapp/frontend (React/Vite); SymbolicPDE. Proposal: Emit GLSL from a 2-D reaction\u2013diffusion ProblemSpec, run it in the frontend, keep the state shareable in the URL. Acceptance (rule D1 \u2014 independent reference): Gray\u2013Scott: steady pattern matches the NumPy solver (correlation 0.99) on \u2026"},{"n":574,"t":"MAPDL .rst result reader and a PyFluent driver","l":["enhancement","priority: P3","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: PyAnsys pymapdl-reader and pyfluent (MIT). What PINNeAPPle already has: Readers for Abaqus, Exodus, CGNS, Fluent mesh, STAR-CCM+; Fluent driven by journal files. Proposal: .rst reader (optional pymapdl-reader dependency) into UPD; a PyFluent path in externalsolvers/ansys. Acceptance (rule D1 \u2014 independent reference): pymapdl-reader's own example .rst file read with displacements equal to the reference \u2026"},{"n":572,"t":"Incremental FNO (iFNO): grow Fourier modes during training","l":["enhancement","priority: P2","neural-operators"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: neuraloperator IncrementalFNOTrainer (MIT); George et al., TMLR 2024. What PINNeAPPle already has: FNO in architectures/neuraloperators/fno.py with fixed modes. Proposal: Training callback (loss-gap and explained-variance rules) that increases the FNO modes. Acceptance (rule D1 \u2014 independent reference): 1-D Burgers: same final accuracy as fixed-mode FNO with fewer training FLOPs (fixed seed). Origin: \u2026"},{"n":571,"t":"LBM D3Q27 cumulant collision + STL voxelization + FP16 storage","l":["enhancement","priority: P2","solvers","gpu"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: ultraFluidX, PowerFLOW, XFlow, M-Star, SimScale Pacefish, FluidX3D (FP16 storage). What PINNeAPPle already has: lbm.py: D2Q9/D3Q19 BGK + Smagorinsky; lbmtunnel. Proposal: D3Q27 cumulant collision, STL voxelization (GPU via torch), FP16 storage with FP32 arithmetic (the idea only \u2014 FluidX3D is non-commercial, no code reuse). Acceptance (rule D1 \u2014 independent reference): 3-D Poiseuille and Taylor\u2013Green \u2026"},{"n":570,"t":"Geometry encoders (PointNet / DGCNN; B-rep UV-Net later)","l":["enhancement","priority: P2","surrogate","geometry"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Neural Concept, Simcenter PhysicsAI (geometric deep learning). What PINNeAPPle already has: geometryfeatures, geometryintelligence (hand-crafted descriptors). Proposal: PointNet/DGCNN encoders in pinneappleneural/architectures, used by the similarity score and the raw-geometry surrogate. Acceptance (rule D1 \u2014 independent reference): Permutation invariance tested; accuracy reported on a ModelNet10 subset. \u2026"},{"n":568,"t":"Hybrid dynamic ROM (physics + learned residual) calibrated online from sensors","l":["enhancement","priority: P2","rom","digital-twin"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Twin Builder (Neural ODE, TFT, Hammerstein LPV, fusion modeling), ROM Builder (LSTM/GRU). What PINNeAPPle already has: Neural ROM, Koopman, SINDy, Kalman, 4D-Var \u2014 but not the physics + residual composition updated online. Proposal: Physics ROM + learned correction, updated by Kalman/EnKF inside digitaltwin. Acceptance (rule D1 \u2014 independent reference): Synthetic system with a known missing term: the \u2026"},{"n":567,"t":"Multi-fidelity surrogate (Kennedy\u2013O'Hagan co-kriging)","l":["enhancement","priority: P2","surrogate"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: optiSLang AI+, HEEDS data reuse, COMSOL. What PINNeAPPle already has: Transfer/meta-learning exist; explicit multi-fidelity does not. Proposal: Autoregressive co-kriging on the NumPy GP in designoptimizer (e.g. coarse LBM + fine OpenFOAM). Acceptance (rule D1 \u2014 independent reference): Forrester functions (closed form): co-kriging with 4 HF + 11 LF points beats an HF-only GP in RMSE. Origin: \u00a72 item 8 \u2026"},{"n":566,"t":"Solution-adaptive mesh refinement (quadtree, wavelet/gradient criterion)","l":["enhancement","priority: P2","meshing","solvers"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: CONVERGE (AMR every step), Basilisk (adaptwavelet), Luminary SDK. What PINNeAPPle already has: Static refinement only (boundary layers, curvature, snappy levels). Proposal: 2-D quadtree with a wavelet criterion for fvm and shallowwaterfv. Acceptance (rule D1 \u2014 independent reference): Ritter dam break: same L1 error as the fine uniform grid with \u2264 40% of the cells. Origin: \u00a72 item 7 Related PR: #559"},{"n":564,"t":"PINNeAPPle MCP server generated from PhysicsToolRegistry","l":["enhancement","priority: P1","llm","agents"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: PyAnsys (MCP servers for PyFluent/PyMechanical/PyMAPDL), Luminary SDK (documented MCP server). What PINNeAPPle already has: PhysicsToolRegistry already carries inputschema/outputschema; agentloop uses the registry. Proposal: Generate MCP tools from the registry (stdio), with an allowlist and PhysicsGuardrail on outputs. Acceptance (rule D1 \u2014 independent reference): tools/list exposes the registered \u2026"},{"n":563,"t":"Export ROMs and surrogates as FMUs (co-simulation)","l":["enhancement","priority: P1","rom","digital-twin","fmi"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Ansys Twin Builder, Simcenter ROM Builder (FMI + ONNX), Altair/Siemens romAI. What PINNeAPPle already has: ROMs (POD, DMD, OpInf, neural ROM), ONNX/TorchScript export; modelica/fmirunner.py only imports FMUs; the new fmuinspect.py validates them. Proposal: Package linear ROMs (POD/DMD/OpInf) as FMI 2.0/3.0 co-simulation FMUs from generated C (no runtime dependency), and neural ROMs through ONNX Runtime. \u2026"},{"n":562,"t":"Pipeline 'CFD cases \u2192 field surrogate from STL / point cloud' + a real DoMINO","l":["enhancement","priority: P1","surrogate"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Ansys SimAI (non-parametric), Simcenter PhysicsAI, Luminary SHIFT (DoMINO/GeoTransolver), Emmi AB-UPT. What PINNeAPPle already has: Transolver, MeshGraphNet, physicsnemobridge, lpm.py. Note: pinneapplephysics/pinnsolver/domino.py is a domain-decomposition PINN, not NVIDIA's DoMINO \u2014 the name is misleading. Proposal: Ready-made pipeline: folder of OpenFOAM cases \u2192 dataset (surface + volume) \u2192 training \u2026"},{"n":561,"t":"Closed loop: the surrogate picks the next simulation (acquisition \u2192 campaign \u2192 retrain)","l":["enhancement","priority: P1","active-learning","orchestration"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: HEEDS adaptive sampling, PhysicsX (UQ \u2192 new simulation), Neural Concept. What PINNeAPPle already has: pinneapplecore/data.py::ActiveSampler, EI in designoptimizer, externalsolvers/openfoam/campaign.py, pinneappleregistry. Proposal: An orchestrator wiring acquisition function \u2192 campaign (OpenFOAM/LBM/any registry solver) \u2192 dataset store \u2192 retrain \u2192 next acquisition, stopping on validation error or budget. \u2026"},{"n":560,"t":"Return a 0\u20131 geometric similarity score with every surrogate prediction","l":["enhancement","priority: P1","surrogate","uq"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Simcenter/Altair PhysicsAI return a geometric similarity score; Ansys SimAI returns a confidence level telling whether a new design lies inside the training domain. What PINNeAPPle already has: GeometryOODGuardrail, analysis/trust/trustgate.py, conformal/ensemble UQ in pinneappleanalysis/uncertainty. Proposal: Geometry embedding (geometryfeatures descriptors + curvature from geometry/ops/curvature.py) \u2192 \u2026"},{"n":556,"t":"Accelerated OpenFOAM pressure solves: next steps after #554 (free-surface cases, GPU, learned guesses)","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"554 (merged) added pinneapplesimulation/acceleratedfoam/ and the pinneWarmStart OpenFOAM plugin. The plugin projects the current pressure system onto the last solutions, as an initial guess for OpenFOAM's own solver, and is verified against plain OpenFOAM. Full results are in docs/coreconcepts/openfoamacceleration.md. The work was paused here. Results so far (OpenFOAM v1912, 1 core, no GPU) Lid-driven cavity \u2026"},{"n":555,"t":"Electric-motor magnetics and topology optimization: finish branch feat/motor-magnetics-topopt (paused)","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Work is paused on branch feat/motor-magnetics-topopt: one WIP commit, about 3.6k lines, no PR yet. The audit and current status are in docs/coreconcepts/motorandtopoptaudit.md. What existed before \u00b7 Only a PINN example of an infinite wire for magnetostatics. \u00b7 An axisymmetric eddy-current FDM solver (verified). \u00b7 No machine model (magnets, coils, rotation, torque, flux linkage, cogging, losses). \u00b7 No density-based \u2026"},{"n":553,"t":"fitmesh: manufacturability and tolerance checks on CAD variants","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Why A CAD variant can pass every geometric check in pinneappledesign/fitmesh/cad.py and still be impossible or unrealistic to make. The study should flag that before meshing and simulating it. Proposal Add a manufacturability block to the per-variant checks (value, limit and verdict, as the existing rows), driven by a declared process: \u00b7 Minimum wall thickness: ray casting or medial-axis estimate on the solid, \u2026"},{"n":552,"t":"fitmesh: grow the template catalogue with industrial parts (tee, reducer, valve, open channel, nozzle)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Why The catalogue in pinneappledesign/fitmesh/catalog.py has 9 templates. Most industrial problems fall outside it and end up in language-model geometry, which has no published reference to compare against. Proposal Add parametric templates, each in the same format as the existing ones: \u00b7 physics and keywords; \u00b7 parameters with reference value, typical range and validity limits, plus role and sensitivity; \u00b7 \u2026"},{"n":551,"t":"fitmesh: fit a catalogue template to an uploaded CAD or scan and report the deviation","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Why Today \"close to reality\" in pinneappledesign.fitmesh means close to the published reference object of a template. When the user has the real part (STEP/IGES/STL or a 3D scan), we should measure how far each template variant is from that part, not only from the literature object. Proposal \u00b7 fittemplate(template, part) - FitResult: find the template parameters that best reproduce the uploaded geometry. \u00b7 Align \u2026"},{"n":550,"t":"hpo_experiments and formfill on the shared provider layer","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Two packages call language models outside the shared provider layer: \u00b7 pinneappletools/hpoexperiments has its own Gemini provider (providers/geminiprovider.py), used by agents/extractor, verifier and reproducer. \u00b7 pinneappledata/formfill/llm.py has its own urllib OllamaClient and extractwithllm. Proposal: \u00b7 Move both onto LLMAssist and callllm (#539), with adapters, so any provider works, including a local Ollama. \u00b7 \u2026"},{"n":549,"t":"Reports: optional plain-language summary that may only quote numbers from the report","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Several outputs give users raw scores, components and checklists to read: \u00b7 veriphysics DecisionRecord and evidencereport; \u00b7 pinneappleanalysis/trust/trustreport.py; \u00b7 pinneapplelab/reports.writereport; \u00b7 pinneapplelab/curation.planexperiment; \u00b7 physicsaudit.diagnose and recommend. Proposal: an optional section labelled \"Model summary\" with an executive summary and the next best action. Validation: \u00b7 Every number in \u2026"},{"n":548,"t":"Design: objectives and constraints from text (qualitative preview, design optimizer, heat-sink sizer)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Today: \u00b7 pinneappledesign/qualitative/preview.py parseobjective: a regex vocabulary that raises ValueError when nothing matches. \u00b7 designoptimizer (DesignOptConfig, objective and constraint classes): users compose objectives and constraints by hand. \u00b7 thermal/heatsink/sizer.py SizingRequest: a form. Proposal: the model proposes: \u00b7 (quantity, sense, model) among MODELS[...].quantities; \u00b7 CompositeObjective weights; \u00b7 \u2026"},{"n":547,"t":"Preflight: model-proposed fix per finding, accepted only if re-running preflight clears it","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"pinneappledata/preflight preflight() (also the simulation preflight app) gives findings with hand-written detail and fix text. The user then edits the case files. Proposal: for each fail or warn finding, the model proposes a concrete patch, as key/value edits through campaign.setentry. Validation: \u00b7 Apply the patch to a copy and run preflight() again. \u00b7 Accept it only if that finding disappears and no new fail \u2026"},{"n":546,"t":"Solver setup from text: CalculiX FEModel, FEniCS config, OpenFOAM Campaign plans, Fluent cases","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"What users build by hand today: \u00b7 CalculiX (externalsolvers/calculix/study.py: FEModel, Static/Frequency/Buckle/Heat): node sets, fixes, loads, pressures, materials. FEniCS (FEniCSConfig) is the same story. \u00b7 OpenFOAM (openfoam/campaign.py Campaign): plan JSON. \u00b7 Fluent (ansys/journalbuilder.py FluentCaseConfig): boundary-condition zone dicts. Proposal: the model maps a text brief onto these objects: \u00b7 step type; \u00b7 \u2026"},{"n":545,"t":"physical_units.infer_quantity: model fallback for ambiguous column names, checked by dimension","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"pinneappledata/physicalunits.py inferquantity matches keywords. It is used by: \u00b7 datahealth; \u00b7 unified; \u00b7 the data standardizer app. Plant tags such as \"TT-101 PV\" end up as low-confidence mappings that a person reviews. Proposal: when the confidence is below the threshold, ask the model for a quantity key from QUANTITIES. Validation: \u00b7 The key must be in quantitiesfordim(unit.dim), so it is dimensionally compatible \u2026"},{"n":544,"t":"Arena: draft ArenaConfig (preset, models, training) from a description","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Today users write by hand, in YAML or code (pinneapplearena/custombuilder.py defineproblem, pinneapplearena/config.py ArenaConfig): \u00b7 the PDE residual string; \u00b7 the boundary-condition dicts; \u00b7 the list of models. Proposal: \u00b7 Choose a preset with draftproblem. \u00b7 Choose ModelConfig entries only from ModelRegistry, plus training parameters. \u00b7 A new PDE string goes only through presetauthoring.draftpreset, which already \u2026"},{"n":543,"t":"identify_pde / suggest_problem_spec and worldmodel from_prompt: model fallback when keywords miss","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Two keyword parsers that fall back silently today: \u00b7 pinneapplephysics/pdeenvironment/capabilities.py: identifypde scores keyword overlap. When nothing matches, it returns \"custom\" with confidence 0. \u00b7 pinneappleworldmodel/scenariogenerator.py: fromprompt \u2192 prompttodict uses fixed keyword lists. When it finds nothing, it defaults to a cavity, air, Re = 1000. Proposal: when the score is zero or the defaults were hit, \u2026"},{"n":542,"t":"problemdesign: one LLM provider protocol on top of call_llm (local Ollama included)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"pinneappleproblemdesign defines LLMProvider twice, with incompatible signatures: \u00b7 protocol.py: generate(messages, ..., jsonmode), plus GeminiProvider. \u00b7 providers/init.py: generate(, prompt, system, schema), plus CosmosProvider. agent.py, extractor.py and unifiedagent.py only accept those protocols, so the existing callllm providers cannot be used, local Ollama included. \u00b7 Merge the two protocols. \u00b7 Add a \u2026"},{"n":541,"t":"ConversationStore: record whether the model's answer was accepted","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Today pinneapplellm/conversationstore.py log() keeps only the prompt and the response. Add optional fields: \u00b7 accepted: bool; \u00b7 validation: dict (what was dropped or clipped, and which checker passed or failed); \u00b7 runid. Pass module=\" . \" consistently. This makes three things possible: \u00b7 finetune.preparedataset can train only on outputs that were accepted and validated; \u00b7 reports (DecisionRecord.evidence, ModelCard, \u2026"},{"n":540,"t":"call_llm: max_tokens, temperature, JSON for every provider, optional json_schema","l":["good first issue","priority: P1"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"pinneapplellm/dispatch.callllm has two problems: \u00b7 It hard-codes maxtokens=1024 for Anthropic. Config proposals for Arena, Campaign or CalculiX will be longer than that. \u00b7 It ignores jsonmode for Anthropic. Changes: \u00b7 Add maxtokens and temperature keyword arguments, with the current values as defaults. \u00b7 Enforce JSON on Anthropic, either by prefilling { or by using a tool/JSON schema. \u00b7 Add an optional jsonschema= \u2026"},{"n":539,"t":"pinneapple_llm: shared LLMAssist config and a propose-and-check helper","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Move LLMAssist from pinneappledesign/fitmesh/llm.py to pinneapplellm/assist.py and re-export it. LLMAssist holds provider, model, apikey, conversationstore, a call override for tests, and provider kwargs. \u00b7 One argument everywhere. Every module takes one optional argument, llm: LLMAssist | None = None. None keeps today's behaviour. \u00b7 Old keywords. Keep the existing keywords as deprecated aliases: provider=, \u2026"},{"n":538,"t":"Optional language-model assistance across modules (one config, one validation pattern)","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":12,"a":false,"x":"Several modules ask users to hand-write configuration, choose among many options, or interpret results, where a language model could propose from a text description. pinneapplellm already reaches local Ollama, Anthropic and OpenAI and logs calls. But today LLM use is spread over seven conventions (provider=, llmprovider=, llmcall=, an llm= callable, llm: LLMProvider, client: OllamaClient, LLMAssist), and two \u2026"},{"n":535,"t":"Trust horizon and regime warnings for economic and other time-series forecasts","l":["enhancement","priority: P3","effort: S","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-12","p":529,"s":0,"a":false,"x":"What do you want to do? Apply the trust layer PINNeAPPle already uses for weather and black-hole forecasts to economic series: 1. a measured horizon up to which forecasts beat a naive baseline; 2. a flag when the current state lies outside the regimes seen in training, for example an election year, a currency crisis or a commodity shock; 3. calibrated forecast intervals. Reference \u00b7 Applicability domain and \u2026"},{"n":534,"t":"Hybrid macro models: known relations (Taylor rule, government budget constraint) plus a learned residual, distilled to equations","l":["enhancement","priority: P3","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-12","p":529,"s":0,"a":false,"x":"What do you want to do? Use what economics already knows as structure: \u00b7 a Taylor-type policy rule; \u00b7 the government's intertemporal budget constraint and debt dynamics; \u00b7 a simple Phillips curve. A small network learns what those relations miss, the way PINNeAPPle builds hybrid physics models. The learned term is then distilled with symbolic regression into a readable correction. This connects to the \u2026"},{"n":533,"t":"Probability-density dynamics with PINNs: Fokker\u2013Planck and maximum-entropy evolution fitted to data","l":["enhancement","priority: P3","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-12","p":529,"s":0,"a":false,"x":"What do you want to do? Model how the uncertainty of a state evolves, and not only its mean. Examples of the state are inflation, the policy rate and the debt ratio. The model describes the probability density p(x, t), driven by: \u00b7 a drift, the systematic dynamics; \u00b7 a diffusion, the shocks. From that density we get: \u00b7 how fast uncertainty spreads; \u00b7 how quickly the system returns to equilibrium; \u00b7 the probability \u2026"},{"n":532,"t":"Weak-signal recovery: multi-scale noise decomposition with tests for what is noise and what is structure","l":["enhancement","priority: P2","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-12","p":529,"s":0,"a":false,"x":"What do you want to do? Small, frequent shocks can hide information that standard models average away, such as election cycles, seasonal informal-market swings or small sensor drifts. The goal is to: \u00b7 split a series into components by time scale; \u00b7 test each component against white or red noise; \u00b7 report a map of which components carry structure, at which scale, and how much variance each explains. Reference \u2026"},{"n":531,"t":"Directed information flow between time series: transfer entropy and (non-linear) Granger causality","l":["enhancement","priority: P3","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-12","p":529,"s":0,"a":false,"x":"What do you want to do? Measure which series drives which, and how strongly, beyond correlation. Two examples of the question: \u00b7 does the fiscal balance carry information about future policy rates that inflation does not? \u00b7 which sensor in a plant leads a fault? Every result needs a significance level, because entropy estimates are biased on short series. Reference \u00b7 Transfer entropy: Schreiber (2000), \"Measuring \u2026"},{"n":530,"t":"Non-stationarity diagnostics for time series: unit roots, structural breaks, cointegration","l":["enhancement","priority: P2","effort: M","area: core-api"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-12","p":529,"s":0,"a":false,"x":"What do you want to do? Before any surrogate is trained on a time series, check whether the series is stationary, has structural breaks, or shares a long-run relation with other series. A model trained on a series with a unit root or an unflagged break will extrapolate badly. The same check is useful for sensor and process data in digital twins, not only for economics. Reference \u00b7 Unit-root tests: \u00b7 ADF (Dickey & \u2026"},{"n":529,"t":"Macroeconomic time series with physics-style trust: fiscal\u2013monetary interaction case study (tracking)","l":["enhancement","priority: P3","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-12","p":null,"s":6,"a":false,"x":"What do you want to do? Show that PINNeAPPle's core ideas work outside engineering, on macroeconomic time series: \u00b7 separating weak signals from noise; \u00b7 knowing when a model stops being valid; \u00b7 using known structure as a constraint. The motivating question is how fiscal and monetary policy interact in a small, shock-prone economy. Small, frequent shocks (election periods, swings in informal markets) are hard to \u2026"},{"n":528,"t":"Dataset and model catalogue: one registry for public physics datasets and checkpoints (Hugging Face Hub, Zenodo) with licence and citation","l":["enhancement","priority: P1","effort: M","area: core-api","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? More than 40 issues each add a public dataset or pretrained model: \u00b7 PDE benchmarks; \u00b7 aerodynamics; \u00b7 weather; \u00b7 atomistic data; \u00b7 cosmology. Each solves download, caching, licence and citation in its own way. The goal is one registry so that this works for any of them: \u00b7 pp.datasets.load(\"airfrans\", split=\"train\"); \u00b7 pp.models.load(\"mace-mp-0\"); with: \u00b7 the licence shown before download \u2026"},{"n":527,"t":"FlowBench: flow and heat transfer around thousands of complex geometries","l":["enhancement","priority: P3","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Test geometry-aware surrogates on complex, non-parametric shapes, and on mixed convection as well as pure flow. Today's datasets mostly vary airfoils or one car family. Reference FlowBench (Tali et al., 2024; Hugging Face BGLab/FlowBench): more than 10 000 samples of 2-D and 3-D flow past complex shapes (from the SkelNetOn and NURBS shape sets). Contents: \u00b7 Navier\u2013Stokes and coupled heat \u2026"},{"n":526,"t":"LagrangeBench: particle-based (SPH) learned simulators benchmark","l":["enhancement","priority: P3","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Benchmark learned particle simulators on the standard Lagrangian datasets, with PINNeAPPle's SPH solvers (WCSPH, ISPH, DFSPH) as physics references. The targets are GNS/SEGNN-style models. Then test what the leaderboards do not: \u00b7 long-rollout energy and momentum; \u00b7 incompressibility drift. Reference LagrangeBench (Toshev et al., NeurIPS 2023 datasets track), MIT. Its 2-D and 3-D SPH datasets \u2026"},{"n":525,"t":"Climate ML: ClimSim sub-grid parameterisation, and ClimaX, Aurora and GenCast in the weather evaluation","l":["enhancement","priority: P2","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? 1. ClimSim: learn the sub-grid physics of a climate model (convection, clouds, radiation) from the high-resolution embedded simulations. Then check the learned parameterisation for physical consistency: energy and water conservation, positivity. This is the climate counterpart of turbulence closures (#211). 2. Add three public weather and climate models to the WeatherBench evaluation (#251, \u2026"},{"n":524,"t":"Pretrained ML interatomic potentials: MACE-MP-0, CHGNet, M3GNet, Orb, UMA and EquiformerV2, verified before use","l":["enhancement","priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Use the universal ML interatomic potentials released in recent years as drop-in force fields in PINNeAPPle's MD and materials workflows. Every model goes through the physics checks first, because \"universal\" potentials are known to fail outside their training distribution: \u00b7 softened phonons; \u00b7 wrong surface energies; \u00b7 unstable MD at high temperature. Reference | Model | Origin | Licence | \u2026"},{"n":523,"t":"Atomistic datasets: Materials Project, MPtrj, OC20/OC22, OMat24, MD17, QM9, SPICE and Matbench loaders","l":["enhancement","priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Load the standard public datasets of atomistic machine learning as PhysicalSamples (positions, species, cell, energies, forces, stresses), with the same split, audit and benchmark tooling as the field datasets. Uses: \u00b7 train and test the Torch MD module (#462); \u00b7 train ML interatomic potentials for LAMMPS (#504); \u00b7 benchmark pretrained potentials (the companion issue on MACE, CHGNet and \u2026"},{"n":522,"t":"Astropy interop: FITS, units, coordinates and time in PhysicalSamples, plus galpy/Gala galactic dynamics","l":["enhancement","good first issue","priority: P2","effort: S","area: core-api"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"What do you want to do? Make astronomy data first class in PINNeAPPle. The astro issues (#384 and its sub-issues) all need the same base: \u00b7 read FITS images, cubes and tables; \u00b7 keep physical units; \u00b7 handle sky coordinates and time scales. On top of that, use galactic potentials and orbit integration for the rotation-curve and dark-matter work. Reference \u00b7 Astropy (Astropy Collaboration 2013/2018/2022), \u2026"},{"n":521,"t":"GRMHD and black-hole images: KHARMA simulations and ipole ray tracing for synthetic EHT data","l":["enhancement","priority: P3","effort: L","area: visualization","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Produce general-relativistic MHD accretion simulations and synthetic black-hole images. They are: \u00b7 the physics prior and training set for black-hole imaging (#390); \u00b7 the MHD step of black-hole weather (#399); \u00b7 the reference for the cinematic GR views (#419). Reference \u00b7 KHARMA (Prather et al. 2021), BSD-3-Clause: GPU GRMHD on Kokkos/Parthenon, the successor of iharm3d. \u00b7 ipole \u2026"},{"n":520,"t":"Gravitational waves: Bilby inference and LAL waveforms, with PINNeAPPle surrogates as fast waveform models","l":["enhancement","priority: P3","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Use the standard gravitational-wave tools for two tasks: \u00b7 generate waveforms and run parameter inference on public events; \u00b7 build waveform surrogates in PINNeAPPle that speed up inference, with a check of how much they bias the posteriors. This turns the showcase (#382) into a tool. Reference \u00b7 Bilby (Ashton et al. 2019), MIT: Bayesian inference for GW. \u00b7 LALSuite / LALSimulation (LVK), \u2026"},{"n":519,"t":"MESA and GYRE bridge: stellar evolution and asteroseismology as reference and training data","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Run stellar evolution tracks and oscillation spectra from PINNeAPPle. Uses: \u00b7 reference for the stellar-structure PINN work (#389); \u00b7 data for the gyrochronology and solar-twins study (#424); \u00b7 surrogates that map mass, metallicity and age to observables (luminosity, radius, oscillation frequencies) for fast inference. Reference \u00b7 MESA (Paxton et al. 2011\u20132019; Jermyn et al. 2023; \u2026"},{"n":518,"t":"Cosmology pipeline: CAMB/CLASS power spectra, monofonIC initial conditions and SWIFT/GADGET-4 boxes","l":["enhancement","priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Generate cosmological simulation data for the emulator work (#388) with the standard chain, so that new parameter points can be run and not only taken from CAMELS and Quijote: linear power spectrum \u2192 initial conditions \u2192 N-body/hydro \u2192 halo catalogue and density fields. Reference \u00b7 CAMB (Lewis & Challinor) and CLASS (Lesgourgues): linear Boltzmann codes with Python wrappers. Check each \u2026"},{"n":517,"t":"Athena++ / AthenaK bridge: (GR)MHD simulations for accretion, shocks and plasma datasets","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Run astrophysical MHD and GRMHD simulations from PINNeAPPle to produce training data. Targets: \u00b7 accretion flows: the black-hole weather work (#399) and its MHD extension; \u00b7 MHD turbulence; \u00b7 magnetic reconnection; \u00b7 standard test problems: Orszag\u2013Tang, Brio\u2013Wu, blast waves. Reference \u00b7 Athena++ (Stone et al., ApJS 2020), BSD-3-Clause. \u00b7 AthenaK (Stone et al. 2024), its Kokkos/GPU successor. \u2026"},{"n":516,"t":"AMUSE bridge: one framework for N-body, stellar evolution, hydro and radiative codes","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Access many community astrophysics codes through one Python interface, and couple them, instead of writing a bridge per code. AMUSE covers: \u00b7 N-body (ph4, Hermite, Huayno, BHTree); \u00b7 stellar evolution (SeBa, SSE, MESA); \u00b7 hydrodynamics (Fi, Gadget-2); \u00b7 radiative transfer. Reference AMUSE (Astrophysical Multipurpose Software Environment; Portegies Zwart & McMillan, 2018; amusecode.org), \u2026"},{"n":515,"t":"yt reader: load Enzo, FLASH, RAMSES, GADGET, AREPO, Athena++ and other astrophysics outputs as PhysicalSamples","l":["enhancement","priority: P1","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Load the output of most astrophysical simulation codes with one reader, to train models and run the physics audit on them. This covers grid, AMR, particle and moving-mesh data. It is the astrophysics counterpart of the CFD readers (OpenFOAM, CGNS, Fluent) and unblocks #388, #399 and #390. Reference yt (yt-project.org; Turk et al., ApJS 2011), BSD-3-Clause. It reads more than 30 formats: \u00b7 \u2026"},{"n":514,"t":"MATLAB research toolboxes as reference solvers: MRST (porous media), Chebfun (spectral) and the PDE Toolbox","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Reuse three well-known MATLAB toolboxes as reference solvers and data generators. MRST: reservoir simulation and porous-media flow, for the oil, gas and CO2 storage surrogates (#358). Covers: \u00b7 multiphase flow; \u00b7 CO2 storage (co2lab); \u00b7 geomechanics coupling. Chebfun: near machine-precision solutions of 1-D/2-D ODEs and PDEs. Excellent ground truth for PINN benchmarks: \u00b7 Allen\u2013Cahn; \u00b7 KdV; \u00b7 \u2026"},{"n":513,"t":"GNU Octave back-end for the MATLAB runner (no licence needed)","l":["enhancement","good first issue","priority: P2","effort: S","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"What do you want to do? Run .m scripts and functions from PINNeAPPle where MATLAB is not installed, in CI, Docker and on cloud machines. Much academic code runs unchanged in Octave. Reference GNU Octave (octave.org), GPL-3.0. It runs as an executable (octave-cli), so no Octave code is used in PINNeAPPle. Plan \u00b7 runmatlabscript(..., engine=\"octave\") and runmatlabfunction(..., engine=\"octave\") call octave-cli --eval. \u2026"},{"n":512,"t":"Simulink and Simscape as data sources: parameter sweeps with parsim, logged signals to datasets","l":["enhancement","priority: P2","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Generate training data from existing Simulink/Simscape models, which is how many system-level physics models exist in industry: powertrains, hydraulics, thermal management, power electronics. The workflow: 1. Sweep the model parameters. 2. Collect the logged signals. 3. Train a surrogate. The FMU export issues (#101, #459) cover the other direction, a PINNeAPPle surrogate running inside \u2026"},{"n":511,"t":"PINNeAPPle from MATLAB: a toolbox (.mltbx) that trains and runs surrogates through MATLAB's Python interface","l":["enhancement","priority: P2","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Many engineers work only in MATLAB. Today PINNeAPPle can call MATLAB (externalsolvers.matlab: Engine, matlab -batch, .mat I/O), but not the other way round. The goal is for a MATLAB user to: \u00b7 load a dataset from MATLAB arrays or tables; \u00b7 train a PINNeAPPle surrogate; \u00b7 predict with uncertainty; \u00b7 read the trust report; all without leaving MATLAB. Reference MATLAB's Python interface (pyenv, \u2026"},{"n":510,"t":"Fortran codes: f2py / ISO_C_BINDING path for legacy scientific solvers","l":["enhancement","priority: P3","effort: S","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Much validated physics lives in Fortran, for example: \u00b7 atmosphere and ocean parameterisations; \u00b7 reactor physics; \u00b7 XFOIL; \u00b7 radiative transfer; \u00b7 many astrophysics codes. The goal is a documented way to call such code from PINNeAPPle, or to wrap it as a solver, without porting it. Reference \u00b7 f2py (NumPy, BSD-3) and meson-python. \u00b7 ISOCBINDING combined with the native path (#499). \u00b7 \u2026"},{"n":509,"t":"Enzyme: automatic differentiation through existing C, C++, Fortran and Julia solvers","l":["enhancement","priority: P3","effort: L","area: solvers","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Get exact gradients through numerical codes that were not written to be differentiable. Typical examples are a legacy C/Fortran kernel or a C++ solver step. Uses: \u00b7 sensitivities for optimisation and inverse problems; \u00b7 end-to-end training with the native solver in the loop; all without rewriting the solver in PyTorch or JAX. Reference Enzyme (Moses & Churavy, NeurIPS 2020; enzyme.mit.edu): \u2026"},{"n":508,"t":"Julia FEM: Gridap.jl and Ferrite.jl as reference solvers","l":["enhancement","priority: P3","effort: S","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Have finite-element reference solutions written in a high-level language that are easy to modify for new PDEs. Uses: \u00b7 multiphysics coupling; \u00b7 nonlinear mechanics with automatic Jacobians; \u00b7 embedded/unfitted methods (Gridap's GridapEmbedded). They complement FEniCS and MFEM (#502). Reference Gridap.jl (Badia & Verdugo, JOSS 2020) and Ferrite.jl (Carlsson et al.); both MIT. Plan \u00b7 Through \u2026"},{"n":507,"t":"Universal differential equations and NeuralPDE.jl: cross-check PINNeAPPle's PINNs and hybrid models against SciML","l":["enhancement","priority: P3","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? 1. Benchmark PINNeAPPle's PINNs against an independent implementation, NeuralPDE.jl, on the same problems, to catch errors that self-tests miss. 2. Add universal differential equations (UDEs): known physics plus a neural term inside an ODE/PDE, trained through an adaptive solver with adjoint sensitivities. This is the SciML route to closures and missing physics, and complements #211 and #400. \u2026"},{"n":506,"t":"Julia bridge core and SciML: DifferentialEquations.jl and ModelingToolkit from Python","l":["enhancement","priority: P2","effort: M","area: solvers","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Use the Julia scientific ecosystem from PINNeAPPle with one shared bridge, instead of each integration setting up Julia on its own. The first use is SciML: \u00b7 DifferentialEquations.jl: the widest set of stiff, non-stiff, DAE, SDE and delay solvers, with sensitivities; \u00b7 ModelingToolkit.jl: acausal component models, a Julia counterpart to the Modelica path, with symbolic index reduction. \u2026"},{"n":505,"t":"OpenSees (OpenSeesPy): structural and earthquake engineering reference models","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Model the nonlinear response of buildings and bridges to earthquakes: \u00b7 fibre sections; \u00b7 concrete and steel hysteresis; \u00b7 time-history and pushover analyses. Use the results to train fast seismic surrogates (drift, base shear, damage) with uncertainty. CalculiX covers linear and continuum FEA; OpenSees is the standard for earthquake engineering. Reference OpenSees (PEER, UC Berkeley; \u2026"},{"n":504,"t":"LAMMPS and GROMACS bridges: molecular dynamics data and ML interatomic potentials","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Run production molecular dynamics for materials (LAMMPS) and biomolecules (GROMACS), and read the trajectories into PINNeAPPle. Uses: \u00b7 training data for coarse-grained or continuum surrogates; \u00b7 checking the Torch MD module (#462) and the biointerface work (#461) against the standard codes; \u00b7 deploying ML interatomic potentials trained in PINNeAPPle back into LAMMPS. Reference \u00b7 LAMMPS \u2026"},{"n":503,"t":"Project Chrono (PyChrono): multibody dynamics, granular DEM, vehicles and terramechanics","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Simulate mechanisms, vehicles on soft soil, and granular flows with a validated multibody and DEM engine, and use the results as training data and as the physics behind several open topics: \u00b7 rovers on regolith (#398); \u00b7 vehicle experiments (#468); \u00b7 the Bekker\u2013Wong terramechanics model already in numericalsolvers/bekkerwong.py; \u00b7 DEM next to the MPM sand model (#471). Reference Project \u2026"},{"n":502,"t":"High-order FEM: MFEM (PyMFEM) bridge, and deal.II through its executables","l":["enhancement","priority: P3","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Get high-order, adaptive finite-element reference solutions where FEniCS is not the best fit: \u00b7 very high order (p 4) elements; \u00b7 H(curl) and H(div) electromagnetics; \u00b7 GPU assembly; \u00b7 partial assembly for large 3-D problems. Reference \u00b7 MFEM (LLNL, mfem.org), BSD-3-Clause, with Python bindings in PyMFEM. It has GPU back-ends and libCEED. \u00b7 deal.II (dealii.org), LGPL-2.1, used in Lethe and \u2026"},{"n":501,"t":"SUNDIALS (CVODE, IDA, ARKODE): stiff ODE/DAE integration with adjoint sensitivities","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Integrate stiff ODEs and DAEs reliably, and get parameter gradients from adjoint sensitivities. Examples: \u00b7 chemical kinetics; \u00b7 battery models; \u00b7 method-of-lines PDEs; \u00b7 equations exported from Modelica. Use cases: reference solutions, parameter identification, and training data for neural ODE and PINN models. stiffkineticsode and irkgausslegendre are good for small problems but do not do \u2026"},{"n":500,"t":"PETSc (petsc4py): scalable linear, nonlinear and time solvers as a back-end for pp.linalg and the FEM/FDM solvers","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Solve the large sparse systems behind PINNeAPPle's FEM, FDM and FV solvers, and the reference solutions used to verify PINNs, with production solvers. This replaces the SciPy direct and iterative solves that stop scaling at around a million unknowns. PETSc provides: \u00b7 Krylov methods with AMG and other preconditioners; \u00b7 Newton solvers (SNES); \u00b7 adaptive time stepping (TS); \u00b7 optimisation \u2026"},{"n":499,"t":"C++ extension path: nanobind + scikit-build-core (+ Kokkos) for fast kernels and native-library bridges","l":["enhancement","priority: P2","effort: M","area: release-quality","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Have one tested way to add C/C++ code to PINNeAPPle. Uses: \u00b7 hot kernels (neighbour search, SPH/MPM particle loops, mesh queries); \u00b7 thin bindings to native libraries (PETSc, SUNDIALS, MFEM, Chrono). Without breaking pip install pinneapple for users without a compiler. Reference \u00b7 nanobind (BSD-3; Jakob), the successor of pybind11 with smaller and faster bindings. \u00b7 scikit-build-core \u2026"},{"n":498,"t":"ML-guided mesh refinement for OpenFOAM: predict where the mesh must be finer before running","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Most CFD cost and most user error sit in the mesh. The goal is to predict refinement regions from the geometry and the flow conditions, then write them as snappyHexMesh refinement boxes or refineMesh cell sets. The targets are: \u00b7 shear layers; \u00b7 jets and impingement zones; \u00b7 free-surface regions; \u00b7 wakes. The aim is fewer cells for the same answer, or the same cells with less error. Reference \u2026"},{"n":497,"t":"Neural-Solver-Library as a baseline zoo: 20+ neural PDE solvers under one benchmark protocol","l":["enhancement","priority: P3","effort: M","area: benchmark-cost","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Compare PINNeAPPle's surrogates against many published neural PDE solvers without reimplementing each one. Run them on PINNeAPPle's datasets and score them with the same protocol (accuracy, physics audit, cost). Reference THUML Neural-Solver-Library (Tsinghua; github.com/thuml/Neural-Solver-Library). Implementations in one codebase: \u00b7 Transolver; \u00b7 LSM; \u00b7 GNOT; \u00b7 FactFormer; \u00b7 ONO; \u00b7 Galerkin \u2026"},{"n":496,"t":"Mesh-based unsteady CFD datasets: EAGLE, BubbleML and the MeshGraphNet CylinderFlow/Airfoil sets","l":["enhancement","priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Benchmark mesh-based learned simulators (MeshGraphNet, Transolver, GINO) on the public unsteady datasets the field reports against, with PINNeAPPle's loaders and audit. Reference \u00b7 EAGLE (Janny et al., ICLR 2023): about 1.1 M 2-D meshes of turbulent flow from a moving drone over varied floor geometries. \u00b7 BubbleML (Hassan et al., NeurIPS 2023): boiling and multiphase simulations with \u2026"},{"n":495,"t":"Generative models for turbulent flows: diffusion rollouts (PDE-Refiner, ACDM) with calibrated uncertainty","l":["enhancement","priority: P3","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Predict turbulent flows with models that return samples instead of one mean field. This addresses three things: \u00b7 long rollouts that stay stable; \u00b7 correct energy spectra at high wavenumbers, which deterministic surrogates blur; \u00b7 a distribution of outcomes that can be checked for calibration. Reference \u00b7 Lippe et al., \"PDE-Refiner\" (NeurIPS 2023): refining long rollouts. \u00b7 Kohl, Chen & \u2026"},{"n":494,"t":"Surrogate warm start for OpenFOAM: initialise runs from the predicted field and measure the time saved","l":["enhancement","priority: P1","effort: M","area: solvers","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Use a trained surrogate to start each new CFD run close to its answer: map the predicted U, p, k and omega onto the mesh as the initial condition. Then measure how many iterations, and how much wall time, that saves compared with a uniform or potential-flow start. The final answer still comes from the solver, so this is a safe way to get value from surrogates in production. It is also a \u2026"},{"n":493,"t":"Deploy trained models inside OpenFOAM (libtorch / ONNX Runtime): neural closures and boundary conditions in the solver","l":["enhancement","priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Run a network trained in PINNeAPPle inside a running OpenFOAM solver, every iteration. Uses: \u00b7 a turbulence-model correction (from #211, #244 or FIML); \u00b7 a wall model; \u00b7 a learned source term; \u00b7 a boundary condition. Then measure whether the coupled solver is stable and better. Offline closure papers often fail this step: a model that is accurate a priori can diverge a posteriori. Reference \u00b7 \u2026"},{"n":492,"t":"NeuralFoil and AeroSandbox: learned airfoil polars as a fast rung of the multi-fidelity ladder","l":["enhancement","good first issue","priority: P2","effort: S","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"What do you want to do? Get airfoil CL, CD and CM in milliseconds, with an uncertainty estimate, for any shape, Reynolds number and angle of attack. Use them: \u00b7 as the cheapest fidelity in the multi-fidelity ladder (#294, #268); \u00b7 as a sanity check on PINNeAPPle's own airfoil surrogates (CST + MeshGraphNet). Reference \u00b7 NeuralFoil (Sharpe, 2024): a physics-informed network trained on XFOIL, with Kulfan (CST) shape \u2026"},{"n":491,"t":"Active flow control with deep reinforcement learning: HydroGym environments and the Rabault cylinder","l":["enhancement","priority: P3","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Train controllers that act on a flow (jets, rotating cylinders, plasma actuators) to reduce drag or suppress vortex shedding, with the CFD solver as the environment. Then check that the controller is physically sensible: \u00b7 energy spent against drag saved; \u00b7 robustness to changes in Reynolds number. 220 is the generic physics-constrained RL item. This issue covers flow control specifically. \u2026"},{"n":490,"t":"DAFoam bridge: adjoint shape optimisation and field inversion with ML-augmented turbulence models","l":["enhancement","priority: P2","effort: L","area: solvers","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Use OpenFOAM with adjoint gradients for two tasks: \u00b7 Shape optimisation with hundreds of design variables, which surrogates and NSGA-II cannot handle at that scale. \u00b7 Field inversion and machine learning (FIML): infer a correction field beta(x) to the turbulence model that matches measured data, then train a network beta = f(local flow features) that generalises to new geometries. Reference \u00b7 \u2026"},{"n":489,"t":"Pretrained PDE foundation models (Poseidon, DPOT, MPP): fine-tune and verify on CFD data","l":["enhancement","priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Start CFD surrogates from models pretrained on many PDEs instead of from scratch, and measure how much simulation data that saves. Candidate models: \u00b7 Poseidon (Herde et al., NeurIPS 2024; scalable operator transformer); \u00b7 DPOT (Hao et al., ICML 2024; denoising operator pretraining); \u00b7 MPP (McCabe et al., NeurIPS 2024; multiple physics pretraining). All three were trained on compressible and \u2026"},{"n":488,"t":"Xcompact3d bridge: DNS of channels, jets and wakes on structured grids","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Fast high-order DNS/LES of canonical flows (turbulent channel, jets, cylinder wakes, gravity currents) to produce turbulence training data with a well-known solver. Reference Xcompact3d/Incompact3d (xcompact3d.com; Bartholomew et al., SoftwareX 2020). Licence: BSD-3-Clause, run as an executable. It can be an optional dependency (pip install pinneapple[xcompact3d]); only the bridge lives in \u2026"},{"n":487,"t":"Clawpack / GeoClaw bridge: shallow water, tsunamis, floods and dam breaks","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Get adaptive finite-volume solutions of hyperbolic problems: tsunami propagation and inundation, river floods, dam breaks over real topography. Useful for datasets and for checking shallowwaterfv. Reference Clawpack (clawpack.org), with GeoClaw and PyClaw. Licence: BSD-3-Clause. It can be an optional dependency (pip install pinneapple[clawpack]); only the bridge lives in PINNeAPPle. Plan \u00b7 \u2026"},{"n":486,"t":"In-situ training: stream fields from a running OpenFOAM to a training loop (SmartSim, TorchFort)","l":["enhancement","priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Train a model while the CFD runs, without writing every time step to disk. Disk is the bottleneck in the OpenFOAM campaigns, which today sample lines and delete the time directories. Online training and reinforcement-learning flow control need the same capability. Reference \u00b7 SmartSim/SmartRedis (HPE, BSD-2-Clause) and TorchFort (NVIDIA). \u00b7 Examples: OpenFOAM-SmartSim (Maric et al., 2023); \u2026"},{"n":485,"t":"Cantera: real thermochemistry for reacting and high-temperature flows","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Use real gas properties, equilibrium and chemical kinetics in PINNs, surrogates and OpenFOAM cases. Targets: \u00b7 flame speeds; \u00b7 ignition delay; \u00b7 combustion products; \u00b7 properties of metallurgical gases. Reference Cantera (cantera.org), with GRI-Mech 3.0 and other mechanisms. Licence: BSD-3-Clause. It can be an optional dependency (pip install pinneapple[cantera]); only the bridge lives in \u2026"},{"n":484,"t":"Julia CFD solvers through juliacall: Oceananigans, WaterLily and Trixi","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Use three Julia solvers from Python training pipelines: \u00b7 Oceananigans.jl for ocean and atmosphere LES on GPUs; \u00b7 WaterLily.jl for fast immersed-boundary flows on GPUs, including moving bodies; \u00b7 Trixi.jl for high-order DG for compressible flow. Reference Oceananigans.jl (CliMA), WaterLily.jl (Weymouth), Trixi.jl (trixi-framework). Licence: MIT for all three. They can be optional dependencies \u2026"},{"n":483,"t":"DualSPHysics bridge: GPU SPH for free-surface and wave\u2013structure cases","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Simulate free-surface flows with violent splashing and moving bodies on GPUs: sloshing, wave impact on structures, floating bodies. PINNeAPPle's own SPH (WCSPH, ISPH, DFSPH) is a CPU reference for small cases. Reference DualSPHysics (dual.sphysics.org) and its validation cases: dam break with obstacle, sloshing tank. Licence: LGPL-2.1. PINNeAPPle calls the installed executables; only the \u2026"},{"n":482,"t":"Basilisk bridge: adaptive octree VOF for jets, waves and splashing","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Run free-surface cases that need adaptive refinement and sharp interfaces: plunging jets, breaking waves, drop impact, atomisation. These are expensive in interFoam; Basilisk's adaptive VOF runs them at much lower cost. Directly relevant to pp.cfd.FreeSurfaceFlow. Reference Basilisk (basilisk.fr, Popinet) and its examples: breaking wave, Rayleigh\u2013Plateau, drop impact. Licence: GPL. PINNeAPPle \u2026"},{"n":481,"t":"code_saturne bridge: EDF's industrial finite-volume CFD","l":["enhancement","priority: P3","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Add a second industrial open-source finite-volume solver next to OpenFOAM. codesaturne covers RANS/LES, heat transfer and atmospheric flows. Uses: \u00b7 cross-checking OpenFOAM results; \u00b7 reading existing codesaturne studies. Reference codesaturne (EDF, code-saturne.org) and its validation cases. Licence: GPL-2.0-or-later. PINNeAPPle is Apache-2.0, so no codesaturne code is imported or copied. \u2026"},{"n":480,"t":"Dedalus bridge: spectral solutions for convection, rotating and stratified flow","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Produce reference data for flows in simple domains, where spectral methods give near-exact solutions: \u00b7 Rayleigh\u2013B\u00e9nard convection; \u00b7 Kelvin\u2013Helmholtz; \u00b7 rotating shallow water. This is useful for datasets (#275) and for the Williamson cases (#258). Reference Dedalus v3 (dedalus-project.org). Licence: GPL-3.0. PINNeAPPle is Apache-2.0, so no Dedalus code is imported or copied. The bridge runs \u2026"},{"n":479,"t":"JAX-Fluids integration: differentiable compressible and two-phase flow","l":["enhancement","priority: P3","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Simulate shocks, compressible turbulence and two-phase compressible flow (level set, diffuse interface), differentiable in JAX. Use the results as training data and for end-to-end training. PINNeAPPle's compressiblefv is only a small 1-D/2-D reference. Reference JAX-Fluids (TU Munich, github.com/tumaer/JAXFLUIDS; Bezgin et al., CPC 2023). Licence: check the repository LICENSE before doing \u2026"},{"n":478,"t":"PhiFlow integration: differentiable PDE solvers for solver-in-the-loop training","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Train correction networks and controllers with the solver inside the loss, in PyTorch, JAX or TensorFlow. Example flows: smoke plumes, incompressible flow, Burgers. Reference PhiFlow (TU Munich, github.com/tum-pbs/PhiFlow) and the Solver-in-the-Loop paper (Um et al., NeurIPS 2020). Licence: MIT. It can be an optional dependency (pip install pinneapple[phiflow]); only the bridge lives in \u2026"},{"n":477,"t":"XLB integration: differentiable lattice Boltzmann (JAX and Warp)","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Run LBM cases that can be differentiated end to end. Uses: \u00b7 optimising shapes; \u00b7 training hybrid models (solver plus network) through the solver. The PyTorch LBM (lbmtunnel, #473) is not written for autodiff through many steps. Reference XLB (Autodesk Research, github.com/Autodesk/XLB): \u00b7 D2Q9, D3Q19 and D3Q27; \u00b7 BGK and KBC collision; \u00b7 JAX and NVIDIA Warp back-ends; \u00b7 multi-GPU. Licence: \u2026"},{"n":476,"t":"Spectral/hp element bridges: Nektar++ and Neko for DNS reference data","l":["enhancement","priority: P3","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Get DNS-quality reference solutions from spectral-element solvers, to verify surrogates and PINNs. Cases: channel, cylinder wake, periodic hill. Reference \u00b7 Nektar++ (nektar.info): incompressible and compressible spectral/hp elements, set up with XML session files. \u00b7 Neko (github.com/ExtremeFLOW/neko): the GPU successor of Nek5000. Licence: Nektar++ is MIT and Neko is BSD-3-Clause. PINNeAPPle \u2026"},{"n":475,"t":"PyFR bridge: high-order LES on GPUs for turbulence datasets","l":["enhancement","priority: P2","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Produce scale-resolving (LES/DNS) training data on GPUs. Candidate cases: \u00b7 Taylor\u2013Green vortex; \u00b7 cylinder at Re = 3900; \u00b7 SD7003 airfoil. These resolve much more of the flow than RANS datasets. Reference PyFR (Imperial College, pyfr.org): flux reconstruction with CUDA, HIP, OpenCL and OpenMP back-ends, driven from Python. Licence: BSD-3-Clause. It can be an optional dependency (pip install \u2026"},{"n":474,"t":"SU2 bridge: compressible RANS, shape adjoints and transonic datasets","l":["enhancement","priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"What do you want to do? Run compressible RANS and Euler cases from Python, and get shape gradients from the adjoint. OpenFOAM covers incompressible and low-Mach flow well; SU2 is the open standard for transonic aerodynamics and for adjoint shape optimisation. Reference SU2 (Stanford, su2code.github.io) and its tutorials: ONERA M6, RAE 2822, NACA 0012 and the NASA TMR cases. Licence: LGPL-2.1. PINNeAPPle calls the \u2026"},{"n":473,"t":"LBM wind tunnel: features still missing compared with FluidX3D","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"pinneapplesimulation.numericalsolvers.lbmtunnel (PyTorch LBM) and the bridge in externalsolvers.fluidx3d cover single-phase wind-tunnel cases. Supported today: \u00b7 D3Q19 and D3Q27; SRT or TRT collision; Smagorinsky LES \u00b7 DDF shifting, with optional FP16 storage \u00b7 Guo forcing; halfway bounce-back with moving walls \u00b7 momentum-exchange forces \u00b7 inlet, outlet, open, wall, moving and periodic faces \u00b7 STL voxelization, SI \u2026"},{"n":472,"t":"Physics-informed training in latent space: LatentPINN, physics-informed MeshGraphNet, residual loss on latent ROM dynamics","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Summary Add physics-informed training in a latent space. A PDE residual should be able to train or regularise a model whose state is a latent vector (an autoencoder code) or latent node features on a mesh graph (a GNN). Today PINNeAPPle has latent models and has PINNs, but nothing joins the two. What exists today | Piece | Where | Latent? | Physics loss? | |---|---|---|---| | Autoencoders (dense, 2-D conv, VAE, \u2026"},{"n":471,"t":"Geomechanics MPM: features from GeoTaichi still missing (\u03bc(I), 3-D, DEM coupling, porous media, GPU)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"pinneapplesimulation.particledynamics.geompm (MLS-MPM with Drucker\u2013Prager sand, a weakly compressible fluid and an elastic solid, in 2-D or 3-D) and the GeoTaichi bridge (externalsolvers.geotaichi, which runs GeoTaichi as a separate process and reads its frames) cover a first slice of GeoTaichi. GeoTaichi is GPL-3.0, so each item below has to be written from the papers, not from its code. Constitutive models \u00b7 \u03bc(I) \u2026"},{"n":469,"t":"Map and prioritise the open issues of every PINNeAPPle-Labs repository","l":["priority: P1"],"m":null,"c":1,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The organisation has many repositories, for example the CFD, Climate, SplashCFD, Benchmark, apps and sector hubs (automotive, aerospace, energy, oil and gas, maritime, defence). Each has its own issues, and some issues duplicate work that is now in the core library. Contributors need a single, ordered view. Proposal 1. Inventory. List the open issues of every repository of the organisation (GitHub API) with their \u2026"},{"n":468,"t":"Lab: remaining landing-page cases and the vehicle experiments (road car, Formula car) with Physics AI","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The lab (pinneapplelab) runs experiments with parameters, figures, datasets and validation checks, and publishes them to the catalogue. Two lines of work are still open. 1. Landing-page cases as lab runs Some cases shown on the landing pages are still only images or app results. Each one should become a lab run with checks against a reference, so the catalogue and the trust card cover it. To do: \u00b7 list the cases on \u2026"},{"n":467,"t":"List PINNeAPPle in the FMI tools list (fmi-standard.org)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The FMI standard site lists tools that import or export FMUs. The procedure is in https://github.com/modelica/fmi-standard.org/blob/main/CONTRIBUTING.md#updating-the-tools-list: add an entry to static/assets/tools.json and open a pull request. Prerequisite PR #463, which fixes simulatefmu and adds tests/testfmirunner.py, must be merged first. The entry's examplesURL points to that test on main. Steps 1. Fork \u2026"},{"n":466,"t":"Multi-cloud interoperability: run and publish PINNeAPPle twins, models and results on Azure, AWS and Google Cloud","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Industrial users run their stacks on a single cloud: some all on Microsoft (Azure), others on AWS, others on Google Cloud. PINNeAPPle should plug into each without rewriting the physics, the models or the trust layer. Today \u00b7 Twin exports: AAS v3, DTDL v3 (the Azure Digital Twins language), NGSI-LD, Eclipse Ditto, and a live OPC UA server (pinneapplesystems.digitaltwin.standards). \u00b7 Model export: ONNX, plus FMI \u2026"},{"n":465,"t":"More viewers and live twin connectors: Open3D, Polyscope, K3D, Mitsuba, CesiumJS; Orion-LD, BaSyx server, Azure DT, Sparkplug","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Already integrated: \u00b7 Viewers: the PINNeAPPle three.js viewer, PyVista, Blender Cycles, USD (Omniverse), Rerun, Plotly HTML and Trame (pinneappletools.visualization.integrations). \u00b7 Twin standards, as exports: AAS v3 (BaSyx), DTDL v3, NGSI-LD, Eclipse Ditto, plus a live OPC UA server (pinneapplesystems.digitaltwin.standards). Viewers still to bridge \u00b7 Open3D: point clouds and reconstruction, a GUI with PBR \u2026"},{"n":464,"t":"Proof graphs: close the ARGUED step of the PT-tetramer theorem, attack N >= 5, export to Lean","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"pinneappleanalysis.proof with examples/proofgraph/ptchainnogo.py extends the no-go theorem for linear exceptional-point tuning (PT dimers, Zenodo 23287622) to PT tetramers whose bonds are modulated independently. The theorem is ARGUED: every algebraic step is machine-checked for all degrees, and one continuity step in L3 is a written argument. The conjecture for N = 5 is only SUPPORTED, by a counterexample search on \u2026"},{"n":462,"t":"Torch MD: thermostats, barostat, restraints and neighbour lists in the differentiable molecular dynamics","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Today pinneapplesimulation/particledynamics/moleculardynamics.py covers NVE only, with Lennard-Jones forces, velocity Verlet and minimum-image periodic boundaries. Its pair loop is O(N\u00b2) and it has no thermostat. RoyalMD Gold, built on OpenMM, shows the minimum a real MD protocol needs: NVT, then NPT, with layer restraints. Proposal (differentiable, pure torch) \u00b7 Thermostats: Langevin (BAOAB) and Nos\u00e9-Hoover. \u00b7 \u2026"},{"n":461,"t":"Biointerfaces: protein / molecule on metal surfaces (fcc slab builder, facet, orientation, restraints, z-barostat)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Inspired by RoyalMD Gold (TheVisualHub/RoyalMDGold, MIT). Only the ideas are taken; no code is copied. Use cases \u00b7 Enzyme immobilization. \u00b7 Biosensors. \u00b7 Corrosion inhibitors on metals. \u00b7 Adsorption of molecules on catalysts. Proposal (builds on the OpenMM bridge) \u00b7 Slab builder: an fcc metal slab (Au, Ag, Cu, Pt, Pd, Ni, Al, Pb) on the (100), (110) or (111) facet, from the lattice constant. The XY size comes from \u2026"},{"n":460,"t":"OpenMM bridge: staged MD protocol (fix, solvate, minimize, NVT/NPT, production) with verified equilibration","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Inspired by RoyalMD Gold (TheVisualHub/RoyalMDGold, MIT). Only the ideas are taken; no code is copied. Today pinneapplesimulation.particledynamics.moleculardynamics is a pure-torch NVE Lennard-Jones simulator. There is no bridge to a production molecular dynamics engine. Proposal Add pinneapplesimulation.externalsolvers.openmm, an optional extra (openmm, pdbfixer, mdtraj): \u00b7 Structure: read a PDB, then repair it \u2026"},{"n":459,"t":"FMI: export PINNeAPPle surrogates as FMUs (Co-Simulation) for Modelica, Simulink and system models","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Today PINNeAPPle imports FMUs: simulatefmu and fmutoupd through fmpy. FMI 2.0 Co-Simulation is tested in tests/testfmirunner.py. A surrogate trained in PINNeAPPle cannot yet be used inside a system model. Proposal Add pinneapplesimulation.fmi.exportfmu(model, inputs, outputs, parameters, path). It packages any of the following as an FMI 2.0 Co-Simulation FMU, built with pythonfmu: \u00b7 a trained surrogate (torch or \u2026"},{"n":458,"t":"Problem knowledge graph and justified decision tree for every problem started","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal When a problem is started (pp.solve, PhysicalProblem, a lab experiment or an app), build its own knowledge graph and a decision tree. Every decision along the way should carry its justification: simulator, mesh, model family, loss, validation and data. What exists \u00b7 pinneapplephysics.physicsaudit.knowledge: a generic graph of phenomena, equations, assumptions, parameters, mechanisms and models (defaultgraph, \u2026"},{"n":457,"t":"Physics audit in the lab trust card and the Veriphysics evidence report","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The six-stage trust card in pinneapplelab/curation.py and the Veriphysics applicability map do not yet use the physics audit. Proposal: \u00b7 Model stage of the trust card: show the assumption audit (VALID / MARGINAL / VIOLATED / UNKNOWN per assumption) and the training envelope. \u00b7 Physics stage: show the validity monitor summary (alarms, failures by check). \u00b7 Lab run reports: include the failure attribution and the top \u2026"},{"n":456,"t":"Physics audit on fields: Peclet-based routing of FNO / PINN / solvers on advection-diffusion","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"examples/physicsaudit/piperegimes.py demonstrates routing and attribution on a scalar output, the pipe friction factor. The next step is a field-level case: advection-diffusion across Peclet regimes, which matches the \"advection-dominated\" example of the proposal. It can reuse the experts from examples/physicsensemble/fivemodelfamiliesgif.py. Each model gets profiles with advectiondominated or diffusiondominated \u2026"},{"n":455,"t":"Physics audit: build ModelProfile automatically from PhysicalProblem, presets and trained models","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"pinneapplephysics.physicsaudit needs a ModelProfile per model: its equations, assumptions, mechanisms and training envelope. Today these are written by hand. Most of this information already exists in the library: \u00b7 Presets and PhysicalProblem: the equation family (incompressible Navier-Stokes, heat with constant k, linear elasticity...) maps to the EQUATIONS table in physicsaudit/knowledge.py, and therefore to the \u2026"},{"n":451,"t":"CI: keep the module reference in sync with the code (regenerate on deploy, check examples on PRs)","l":["help wanted","priority: P1","effort: S","area: release-quality"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"The module reference (docs/org/reference/, published under /PINNeAPPle/org/reference/) is generated by two scripts: \u00b7 scripts/reference/build.py reads every package with ast (nothing imported, a few seconds) and writes the API data, the submodule tree and the page. It refuses to build when a curated example changed and was not rerun (hash check against scripts/reference/examplesoutput.json). \u00b7 \u2026"},{"n":448,"t":"Lab: runs whose process dies stay \"running\" forever; detect and mark them interrupted","l":["help wanted","good first issue","priority: P1","effort: S","area: core-api"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-13","p":null,"s":0,"a":false,"x":"When the process running a lab experiment dies (killed, out of memory, container recycled), the run folder keeps \"status\": \"running\" in run.json and its current stage stays running in progress.json. Nothing ever changes it: the store lists it as running, curation skips it as \"in progress\" (curation.py, if r[\"status\"] != \"running\"), and rerunning the same parameters is not obviously allowed. It happened to \u2026"},{"n":447,"t":"Lab: rerun car_surrogate (interrupted during FNO training) and commit the run","l":["priority: P1","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-11","up":"2026-10-11","p":null,"s":0,"a":false,"x":"The carsurrogate experiment (pinneapplelab/experiments/car.py) was started on 2026-10-10 22:43 UTC and its process died during the trainfno stage. The run folder still says \"status\": \"running\" and has no results, so it was not committed (it is not in the catalogue). Parameters of the interrupted run (carsurrogate-3db2de4d123b, code at f7aacc83): Stages: simulate (LBM data) - trainfno (FNO shape - mean flow, \u2026"},{"n":446,"t":"External proof: public benchmarks, industrial case studies, peer review","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"\u00b7 Submit results to public benchmarks (AirfRANS, PDEBench, WeatherBench 2, The Well), negative results included. \u00b7 Two or three case studies with industrial partners on their own data, each with the full trust card. \u00b7 Domain-expert review of the flagship items (the lab's review field), then peer-reviewed papers for the tier-A results."},{"n":445,"t":"Production: model registry, model cards with the trust card, drift monitoring, audit, compliance","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"\u00b7 Model registry: versioned models tied to the data version and code commit that produced them. \u00b7 Model cards that embed the lab's six-stage trust card, the envelope and the calibration. \u00b7 Drift monitoring in production (input distribution, residuals against occasional solver runs). \u00b7 Audit trail for predictions and fallbacks, building on pinneapplesecurity. \u00b7 Latency and availability targets for served models. \u00b7 \u2026"},{"n":444,"t":"Physics depth: coupled multiphysics, validated turbulence, nonlinear FEA, materials with uncertainty","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"\u00b7 Two-way coupling: CFD-DEM (#435), fluid-structure, thermo-mechanical. \u00b7 Turbulence models validated per flow class (attached, separated, rotating, internal), with automatic y+ and mesh-quality control and adaptive refinement. \u00b7 Nonlinear FEA: contact, fatigue, fracture, composites (CalculiX steps through pp.fea). \u00b7 Material database with provenance and uncertainty (properties as distributions)."},{"n":443,"t":"Scale: GPU and distributed training, solvers on clusters, chunked datasets, lab database server","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"Training \u00b7 GPU by default where available; mixed precision; distributed data parallel and FSDP; resumable checkpoints. Solvers \u00b7 OpenFOAM and CalculiX on clusters (MPI, Slurm or Kubernetes jobs, queues, restart); meshes of 10 to 100 million cells. Data \u00b7 Chunked, streamable datasets (Zarr or Parquet) in place of npz shards; versioning (DVC or lakeFS). Lab \u00b7 Database on Postgres with object storage for files; \u2026"},{"n":442,"t":"CI and API: full test suite, lint, numerical regression values, API 1.0","l":["priority: P0"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":434,"s":0,"a":false,"x":"\u00b7 Full test suite in CI, split into fast (every PR, under 30 min) and slow (nightly) tiers. \u00b7 Ruff in CI: clean the legacy modules (hundreds of warnings in pinneapplearena, pinneappleneural/architectures/rom, ...) or ratchet them file by file. \u00b7 Type checking on the public API. \u00b7 Numerical regression: frozen reference values for key results (solver outputs, trained-model errors), with
