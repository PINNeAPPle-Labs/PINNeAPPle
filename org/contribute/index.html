esults (MP4/GIF with timer, colour bar, scale bar, caption)","l":["enhancement","priority: P2","effort: M","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why Transient results are a large part of the repo: weather and black-hole, digital twins, rover, FDTD, wakes, football tracking. Each one animates differently, if it animates at all. pinneappletools.visualization.animation exists, but there is no standard frame layout. Proposal animate(framesfn, t, layout=\"standard\"). The standard layout: \u00b7 a title and a one-line English caption; \u00b7 a time code in physical units; \u00b7 \u2026"},{"n":920,"t":"Studio 3-D renders and turntables for CFD/FEA/EM fields, one call per experiment (Blender Cycles + three.js PBR)","l":["enhancement","priority: P1","effort: L","area: visualization","twin3d","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why The repo already has pinneappleblender (Cycles render and export), pinneappletools.visualization.studio.blender, the generic three.js viewer and pyvistabridge. They are used in a few showcase pieces: the airliner, the Ahmed body, the molecular renders. Most 3-D experiments still ship only matplotlib slices. This includes the FreeCAD \u2192 OpenFOAM cases in #897, the heat sinks, the motor magnetics and the FDTD in \u2026"},{"n":919,"t":"One-page engineering report generated from experiment.json + results (KPI cards, verdicts, uncertainty, provenance)","l":["enhancement","priority: P1","effort: L","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why Every example now has an experiment.json manifest, which CI checks with checkexperimentmanifests, plus results files. Several are presented in different ways: \u00b7 the six-stage trust card; \u00b7 evidencereport; \u00b7 the campaign report in the CFD app; \u00b7 the verdict tables in #900 and #902. A reader still has to open JSON or a README to see what was measured and whether it passed. Industrial CAE and analytics tools give a \u2026"},{"n":918,"t":"One house theme for all 2-D figures (extend pinneapple_tools.visualization.style; adopt in every example)","l":["enhancement","priority: P1","effort: M","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":905,"s":0,"a":false,"x":"Why pinneappletools.visualization.style exists: CFD colour maps, themes and defaults. Only 7 of the 88 examples/ folders import it; the rest use matplotlib defaults or their own palettes. Its CFD colour map is a rainbow (cfdrainbow), which is not perceptually uniform. The result is that each PR has a different look. Proposal Extend the existing module. Do not create a new package. usetheme(kind=\"report\" | \"slide\" | \u2026"},{"n":917,"t":"Football: broadcast-style 3-D replays and a club-grade match report","l":["enhancement","priority: P1","effort: M","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why The #902 figures are correct, but they read as research plots. The club-analyst audience expects broadcast-style visuals. Proposal football.plots.replay(sequence) writes an MP4 and an interactive three.js page: \u00b7 a 3-D pitch with true markings and stadium-style lighting; \u00b7 player discs with numbers and short velocity trails; \u00b7 the ball flight as a tube, shaded by the model's uncertainty, with the physics fit \u2026"},{"n":916,"t":"Football: goalkeeper and shot physics in place of the dropped xG case","l":["enhancement","priority: P3","effort: M"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why In #902, intercept-time features did not improve xG: log-loss changed by +0.0016 [\u22120.0019, +0.0052]. That case was dropped. Physics may still answer narrower questions that xG models answer badly. Proposal Using StatsBomb 360 (goalkeeper and defender positions at the shot), plus end location and shot speed where available: 1. Goalkeeper reachable set. Build a time-to-reach map over the goal mouth from the \u2026"},{"n":915,"t":"Football: wider public data with licences (SoccerNet tracking, Wyscout/figshare, more StatsBomb 360)","l":["enhancement","priority: P2","effort: M","data"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why 902 used SkillCorner (20 matches), Metrica (2 matches) and StatsBomb 360 (3 859 shots). Two matches of Metrica limit every pass-level result. Wyscout on figshare was refused by the environment proxy. Proposal Add loaders in pinneapplesystems.sports.football.data, with the same cache and SHA-256 manifest as today. Each new source records its licence and the credit it requires. Candidate sources (check each one's \u2026"},{"n":914,"t":"Football: individual acceleration\u2013speed profiles and in-match fatigue from tracking","l":["enhancement","priority: P2","effort: M"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why 902 added Kalman-RTS smoothing, plausibility gates and metabolic power (Minetti 2002 / Osgnach 2010). The Osgnach grass terrain factor could not be verified, so it stays a parameter with default 1. Clubs use individual acceleration\u2013speed (A\u2013S) profiles and their in-match drift to judge players' readiness and fatigue. Proposal A\u2013S profile per player. Fit a linear Amax(v) = A0\u00b7(1 \u2212 v/V0) to the upper envelope of \u2026"},{"n":913,"t":"Pitch control from more data: SkillCorner events, per-player parameters, value layer","l":["enhancement","priority: P2","effort: L"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why In #902 the fitted Spearman pitch control had a pass-completion log-loss of 0.150, against 0.174 for logistic regression, with the difference interval reaching zero (\u22120.023 [\u22120.048, +0.000]). With only 100 training passes it scored 0.162 against 0.218. That uses only the 2 Metrica sample matches. Proposal 1. More passes. SkillCorner open data has 20 matches of tracking. Derive passes from its event or phase \u2026"},{"n":912,"t":"Football landing point: physics-structured model vs trees, with calibrated uncertainty","l":["enhancement","priority: P2","effort: M","uq","hybrid"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why In #902, predicting the landing point from the first half of a flight (1 282 test flights) gave these median errors: | Model | Median error | |---|---| | trees | 2.44 m | | hybrid | 2.55 m | | drag physics with free g | 3.27 m | | quadratic | 7.51 m | The trees learn the feed's own height dynamics, so physics lost this case. Proposal 1. Rerun the comparison on the height-corrected feed from the calibration \u2026"},{"n":911,"t":"Football: calibrate broadcast ball height with gravity as the constraint, then infer drag and spin","l":["enhancement","priority: P1","effort: M"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":904,"s":0,"a":false,"x":"Why In #902, fitting each SkillCorner aerial flight with free gravity gave g = 6.09 m/s\u00b2 [6.02, 6.18] over 2 601 flights. The same fit on simulated flights gives 9.88. The deficit holds at every launch speed, so it is not backspin lift. The broadcast z is therefore not physical, and CD and spin cannot be inferred from it. Proposal Physics can repair the feed. Two candidate models of the broadcast height: \u00b7 a \u2026"},{"n":910,"t":"Cosmos Reasoner as an Autonomous Physics Lab tool, with its physical claims checked","l":["enhancement","priority: P3","effort: M","llm","agents"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why Cosmos 3's Reasoner (text + vision \u2192 text) is meant for scene understanding and planning. The Autonomous Physics Lab demos (#867, #869, #871, #879\u2013#881) drive solvers with an agent. A vision reasoner could read a camera frame or a render (\"where is the flow separating?\", \"which part is overheating?\"). Its answers would be claims that the lab can check with a solver. Proposal A tool, observeandclaim(frames, \u2026"},{"n":909,"t":"Update CosmosAdapter to Cosmos 3 (Generator + Reasoner; Diffusers / vLLM / NIM), GPU-gated","l":["enhancement","priority: P2","effort: M","gpu","interop"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why pinneappleworldmodel.physicalworld.CosmosAdapter targets the Cosmos 1 world-foundation-model NIM (POST {base}/infer with b64video). The Cosmos 3 README lists these backends: Diffusers, Transformers, vLLM, vLLM-Omni, SGLang, TensorRT-LLM and NIM. The hosted endpoints are build.nvidia.com cosmos3-nano and cosmos3-nano-reasoner. The checkpoints on Hugging Face are Cosmos3-Edge (4B), Nano (16B) and Super (64B), plus \u2026"},{"n":908,"t":"Physics-residual filter stage for video and tracking data (Curator-style)","l":["enhancement","priority: P2","effort: M","data"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why Cosmos Curator filters and deduplicates video on visual criteria. #902 showed a different kind of filter that pays off: fitting gravity to 2 601 broadcast ball flights gave g = 6.09 m/s\u00b2, so the height feed is not physical. Gating player tracking with human limits also changed the mean metabolic power from 13.7\u201368 W/kg to 7.1\u20137.4 W/kg. A physics filter catches data that looks fine but breaks the laws. Proposal \u2026"},{"n":907,"t":"Physics-labelled post-training data factory in Cosmos-ready formats","l":["enhancement","priority: P2","effort: L","data"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why Cosmos 3 Nano is meant as a base for post-training (SFT, LoRA, RL), and its Transfer variants are conditioned on control signals. PINNeAPPle simulators can produce video whose physical state is known exactly. The kinds of video they can produce: \u00b7 rigid bodies (Newton backend, #70-era); \u00b7 CFD fields: OpenFOAM / FreeCAD pipelines (#897), the Ahmed body; \u00b7 FEA, and EM (FDTD in pp.science); \u00b7 robot camera data \u2026"},{"n":906,"t":"Physics judge for world-model video: exact checks, known-answer benchmark, score card","l":["enhancement","priority: P1","effort: L","benchmark"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":903,"s":0,"a":false,"x":"Why Cosmos-style generators produce plausible video. Cosmos Evaluator scores \"physical plausibility\" with learned temporal representations. What is missing is a judge that checks a clip against the equations, with a stated tolerance, and says which law fails and by how much. pinneappleworldmodel.physicalworld.physicschecks already does this for one scene type: a bouncing ball, with gravity, restitution and energy \u2026"},{"n":905,"t":"Epic: industrial-grade experiment quality and visuals across examples/","l":["enhancement","roadmap","area: visualization","visualization"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":6,"a":false,"x":"Context A review of the 398 figures added to main on 24\u201325 Oct 2026 found three problems: \u00b7 Each PR has its own look: matplotlib defaults next to custom palettes, inconsistent colour bars and units, and some figures with empty space (for example the 4-panel mesh-study strips in #897). \u00b7 Some figures rely on tiny text. \u00b7 Very few experiments have a hero image or a video. pinneappletools.visualization.style exists, \u2026"},{"n":904,"t":"Epic: football physics, round 2 (after #902)","l":["enhancement","roadmap"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":8,"a":false,"x":"Context 902 added pinneapplesystems.sports.football and examples/sports. Each case is scored on held-out data, with the same training data for every model. Measured verdicts from #902: \u00b7 Physics helped in four places: as a data check (broadcast ball height gives g = 6.09 m/s\u00b2 [6.02, 6.18], not 9.81), with little data (pitch control, player prediction), for Kalman-RTS smoothing, and as a plausibility gate for \u2026"},{"n":903,"t":"Epic: what PINNeAPPle can take from NVIDIA Cosmos 3 (physics judge, physics data, adapter)","l":["enhancement","roadmap","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-25","up":"2026-10-25","p":null,"s":5,"a":false,"x":"Context NVIDIA Cosmos is now at Cosmos 3. It is one architecture with a Reasoner (text + vision \u2192 text: scene understanding, planning) and a Generator (text, vision, audio, action \u2192 vision, audio, action: world simulation, future prediction, synthetic data, policy learning). Sizes and the hardware the README lists for them: \u00b7 Super, 64B: H200/B200. \u00b7 Nano, 16B: H100/RTX Pro 6000. \u00b7 Edge, 4B: Jetson Thor/AGX Orin. \u2026"},{"n":777,"t":"Publish zoo: the geometries job fails verification with SHA-256 mismatches","l":[],"m":null,"c":0,"cr":"2026-10-17","up":"2026-10-17","p":null,"s":0,"a":false,"x":"The geometries job of the \"Publish zoo to the Hub\" workflow (.github/workflows/publish-zoo.yml) fails in its verify step on every run. The publish job, which handles the zoo models and datasets, passes. Example run: https://github.com/PINNeAPPle-Labs/PINNeAPPle/actions/runs/38964216575 (job geometries). It reports verify: 18 problem(s), all of them SHA MISMATCH, for example: Later runs on main fail the same way \u2026"},{"n":694,"t":"Consolidation: unify duplicate helpers inside the library","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). Duplicates found inside the library packages; each differs at the edges, so unify with tests that pin the current behaviour of every caller first. \u00b7 Three latinhypercube functions: pinneappledesign.aero.geometry, pinneappleneural.architectures.rom.parametric, pinneapplesimulation.externalsolvers.modelica.sweep (plus \u2026"},{"n":693,"t":"Consolidation: example helpers whose library counterpart behaves differently","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). The examples keep their own versions because switching would change results; decide per item whether to extend the library function (an option) and then switch. \u00b7 examples/handoffcases/airfoilld/simulation/airfoilcase.py::residuals: simulationmetadata.openfoam.parselog keeps only the first p solve per time step (2000 values instead \u2026"},{"n":692,"t":"Consolidation: example solvers that need a published reference before they move","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). \u00b7 examples/usecases/crashsurrogate/crashsurrogatepipeline.py::abramowiczjonessolver (axial crush of a square tube) \u2192 pinneapplephysics.closedform once tested against the mean crush force formula and values in Abramowicz & Jones (1984). \u00b7 examples/benchmarksuite/14physicssimulationsurrogateworkflow.py: RectMesh2D, solveelasticity (Q4 \u2026"},{"n":691,"t":"Consolidation: unstructured streamlines, strict OpenFOAM dictionary editor, erosion models, MCMC inverse, rollout evaluator","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). Generic capabilities found in a downstream project; each must be written from the literature (cited in docstrings) and validated on its own. Nothing is copied from that project. \u00b7 Streamlines on an unstructured finite-volume mesh \u2192 pinneappledata.cae.streamlines.trace(mesh, U, seeds, ...) + a VTP reader: point-in-cell locator, \u2026"},{"n":690,"t":"Consolidation: shared helpers of the physics-ensemble examples","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). Near-duplicates across examples/physicsensemble/fivemodelfamiliesgif.py, fnopinngnnsolvers.py, comparelookaheadgif.py and sensornoisegif.py: \u00b7 iccoefficients (Fourier coefficients of the periodic initial condition) \u2192 e.g. AdvectionDiffusion1D.iccoefficients(u0, nmodes); \u00b7 ParametricPINN / trainpinn / pinnpredict (parametric PINN \u2026"},{"n":689,"t":"Consolidation: zoo release manifest and Hub verification into pinneapple_hub.zoo","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). scripts/zoo/buildassets.py (hubonlyentry, carryversions) and scripts/zoo/publishtohub.py (plan, verify, staging / allowunpublished) hold release logic (manifest entries with SHA-256, sizes, column dtypes and shapes; version history; upload plan and checksum verification) that belongs next to pinneapplehub.zoo.artifacts. The scripts \u2026"},{"n":688,"t":"Consolidation: inverse-heat app imports the library directly","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). apps/inverseheat/inverseheat/engine.py is an alias of pinneappleanalysis.inverseproblems.heattransfer that also patches EXAMPLE. Switch apps/inverseheat/inverseheat/api.py and tests/testinverseheat.py to the library module (pass the example path explicitly instead of patching a module global), keeping the alias for old imports. \u2026"},{"n":687,"t":"Consolidation: move the black-hole run storage into pinneapple_physics.blackhole","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). \u00b7 examples/blackholeweather/simulate.py::loadrun and the chunked checkpoint / resume loop in main \u2192 pinneapplephysics.blackhole (runtodisk, loadrun). \u00b7 examples/blackholeweather/evaluate.py::cellvolumes \u2192 use 2\u03c0 \u00b7 AccretionFlow.vol. \u00b7 Then remove the evaluate.py - simulate.py and trainforecaster.py - simulate.py lines from \u2026"},{"n":686,"t":"Consolidation: move the observatory analyses into pinneapple_physics.astro","l":[],"m":null,"c":0,"cr":"2026-10-14","up":"2026-10-14","p":null,"s":0,"a":false,"x":"Part of the library consolidation (docs/dev/LIBRARYCONSOLIDATION.md, \"Still to do\"). apps/observatory/observatory/api.py still composes library astro calls into analyses that belong in the library: | App symbol | Target | |---|---| | best-window part of target (24 h altitude/airmass, dark sky, longest run above minalt, Moon separation) | astro.phenomena.observingwindow | | targetvec (body name or \"HR n\" \u2192 apparent \u2026"},{"n":677,"t":"Validate the physics-residual FDI detector on real data (needs an environment that can reach batadal.net)","l":["enhancement","priority: P2","effort: S","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The numbers for pinneapplesecurity.cps in docs/guides/physicsresidualattackdetection.md come only from the simulated three-tank benchmark (cpsbench). The loader and residuals for real data are scoped in #645 (BATADAL adapter). This issue is about running that validation and publishing the results. Blocker The build environment's outbound proxy refused batadal.net (HTTP 403). The run needs one of: \u00b7 a cloud \u2026"},{"n":676,"t":"Delete the merged branch feat/latent-and-cyber","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"PR #646 was merged into main (merge commit 7b6c8d6). Its branch feat/latent-and-cyber is still on the remote and is no longer needed. To do \u00b7 Delete feat/latent-and-cyber on GitHub (the \"Delete branch\" button on #646, or git push origin --delete feat/latent-and-cyber). Acceptance test \u00b7 git ls-remote --heads origin feat/latent-and-cyber returns nothing. \u00b7 main still contains pinneapplesecurity/cps.py and \u2026"},{"n":675,"t":"pp.benchmark: accept any zoo dataset by name (follow-up to zoo v2)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Scope. Once the pp.benchmark API (branch feat/benchmark-api) is merged, pp.benchmark should accept any pp.datasets zoo dataset by name as its problem source. This is the integration hook of zoo v2. It could not land with the zoo PRs because the benchmark API is not on main yet. What to add. \u00b7 A registry entry. In pinneappleanalysis.benchmark.registry, add a zoo: problem source backed by pp.datasets.load(name, \u2026"},{"n":673,"t":"lunar_rover_3d example: use the zoo contact PINN (v1.1.0) and refresh docs/assets/lunar_rover","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"examples/usecases/terramechanics/lunarrover3d.py still trains its own contact PINN (4000 epochs). The rover dashboard now uses pp.zoo.load(\"rovercontactgrc1viper\") v1.1.0: \u00b7 trained on the current physics with slip-sinkage; \u00b7 held-out RMSE: Fx 0.22 N, Fz 0.47 N, My 0.071 N m; \u00b7 0.33 N RMS along the crater run. To do: \u00b7 Use the zoo model in the example (ZooContactSurrogate), with the physics guard (checkphysics). \u00b7 \u2026"},{"n":672,"t":"VIPER CAD: compare with NASA photos and revisit the TRIDENT position","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The parametric VIPER CAD (pinneapplesimulation/vehicle/viper.py, VIPERSOURCES) was checked against two things: \u00b7 the published dimensions; \u00b7 the layout that NASA renders and photo captions describe. It was not compared side by side with the photographs, because they could not be downloaded from the build environment. To do: \u00b7 Put the beauty and side renders next to NASA VIPER photos (assembly, mast raise, \u2026"},{"n":671,"t":"Rover grade sweep: average the slip over the in-rut regime","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"scenarios.gradesweep averages over the second half of a 14 s run. That window straddles a change of regime. Before the ruts. For roughly the first wheelbase (~1 m, ~11 s), the rear wheels drive on virgin soil. The slip is about 0.17 on 15\u00b0 and about 0.26 on 20\u00b0. In the ruts. Once the rear wheels reach the front wheels' ruts, multi-pass shear lets them push, and the slip of all four wheels falls to about 0. Effect on \u2026"},{"n":670,"t":"Delete the merged geometry-library branches","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Both branches were merged and can be deleted from the remote: \u00b7 feat/geometry-library (#633) \u00b7 fix/geometry-determinism (#648)"},{"n":669,"t":"Geometry library: new entries (bicycle or motorbike with rider, business jet)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Candidates from the original geometry-library scope that were not built (12 new entries were added, the minimum was 8): \u00b7 Road bicycle or motorbike with rider: a time-trial cyclist position for drag and drafting studies, a rider on a sport motorbike. \u00b7 Business jet: T-tail, rear-mounted engines. Same quality bar as the other entries (see docs/guides/geometrylibrary.md): \u00b7 published dimensions with sources, estimates \u2026"},{"n":668,"t":"Geometry library: improve fidelity where info() flags estimates (DU blade sections, KCS offsets, airliner trailing edge)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Three documented fidelity gaps in pp.geometries. Each is flagged in info(name)[\"estimates\"] or [\"knownissues\"]. 1. windturbinenrel5mw: blade sections. The DU 40/35/30/25/21 and NACA 64-618 sections of the NREL 5-MW reference are approximated by NACA 4-digit sections with the same thickness ratio and 2-4 % camber. Use the published coordinates (the NREL 5-MW OpenFAST model, Apache-2.0) with a licence note, and keep \u2026"},{"n":667,"t":"Geometry library: regenerate the turntable GIF smaller (or move it to the Hub)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"docs/assets/geometrylibrary/turntable.gif is 2.5 MB: 17 geometries, 24 frames, a 4-column grid of 240x165 tiles. It was rendered before vertices were snapped to the 0.1 um grid (#648). It looks identical, but it is no longer what the current code produces. Options: \u00b7 Regenerate it with python scripts/geometrylibrary.py sheet --frames 16 and a smaller palette or tiles, aiming for under 1 MB. \u00b7 Or publish the \u2026"},{"n":666,"t":"Check the geometry-library Hub files from a user machine (pp.geometries.load download path)","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The fine files of pp.geometries were published to https://huggingface.co/datasets/PINNeAPPle-Labs/geometry-library by the geometries job of publish-zoo.yml (run 38431677342). The job's anonymous check reports verify-hub: 153 files OK, 0 problem(s). That check ran on the GitHub runner only. The load() download path has not been exercised end to end from outside CI. To check: \u00b7 python scripts/geometrylibrary.py \u2026"},{"n":665,"t":"Run the CAARC building OpenFOAM example and record the drag coefficient against the wind tunnel","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"examples/geometrylibrary/01caarcbuildingwindopenfoam.py loads caarcbuilding (isolated, surroundings=False). It then runs steady RANS at 10 m/s through the generic STL path of pp.cfd.ExternalFlow, on fixed ground. So far it has only been checked on a machine without OpenFOAM, where it writes the case and stops. It needs a real run: \u00b7 Run coarse and medium on a machine with OpenFOAM (FOAMBASHRC). \u00b7 Compare the \u2026"},{"n":664,"t":"Geometry library: bring the light files of the airliner, two-stage launcher and VIPER under 2 MB","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The goal for the committed light level of pp.geometries (data/geometries/ /, STL + glTF) is under 2 MB per geometry. Three entries are above it: | entry | light triangles | committed size | |---|---|---| | airlinera320 | 34 560 | ~2.5 MB | | launchvehicletwostage | 34 368 | ~2.5 MB | | viperrover | 24 804 | ~2.1 MB | The airliner and the launcher wrap pinneappledesign.aero.airliner.Airliner and \u2026"},{"n":647,"t":"Process-tampering detection from physical side signals (acoustic, power) in manufacturing","l":["enhancement","priority: P3","effort: L"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B8 in docs/dev/LATENTANDCYBEREVALUATION.md (ranked last, not planned for now; kept here so the idea and its test are not lost). Acoustic and power side channels of a machine carry the physics of what it is doing (e.g. Al Faruque et al., ICCPS 2016, for additive manufacturing). A physics model of the expected signal for a given toolpath would let pinneapplesecurity.cps flag a sabotaged job (changed infill, layer \u2026"},{"n":645,"t":"BATADAL adapter for the physics-residual FDI benchmark (public water-network attack data)","l":["enhancement","priority: P2","effort: S","data","benchmark"],"m":null,"c":1,"cr":"2026-10-13","up":"2026-10-15","p":null,"s":0,"a":false,"x":"This is a follow-up to B1 in docs/dev/LATENTANDCYBEREVALUATION.md, which was implemented as pinneapplesecurity.cps and cpsbench. The FDI benchmark currently runs on a simulated, seeded three-tank water network. The public BATADAL dataset (Taormina et al., J. Water Resour. Plann. Manage. 2018) is the natural real-data test. It was not reachable from the build environment when B1 was written. Scope \u00b7 A loader for the \u2026"},{"n":644,"t":"Signed trust reports whose physics residual is re-verified on load","l":["enhancement","good first issue","priority: P2","effort: S"],"m":null,"c":4,"cr":"2026-10-13","up":"2026-10-19","p":null,"s":0,"a":true,"x":"Item B7 of docs/dev/LATENTANDCYBEREVALUATION.md. A quick win. What exists: DSSE signing, attestation, and TrustReport.todict. Goal: a trust report signed together with the model and inputs it describes. On load, the recorded physics residual is recomputed from the signed model and inputs and compared with the stored value. Acceptance test \u00b7 A signed trust report whose recorded physics residual is recomputed on load. \u2026"},{"n":643,"t":"Federated, differentially private training of surrogates across sites","l":["enhancement","priority: P3","effort: L","training"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B6 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 FedAvg (McMahan et al., AISTATS 2017). \u00b7 Secure aggregation (Bonawitz et al., CCS 2017). \u00b7 DP-SGD with RDP accounting (Abadi et al., CCS 2016; Mironov 2017). What exists: DP-SGD and the RDP accountant. There is no federated training loop yet. Acceptance test Three sites with different operating regimes train one surrogate: \u00b7 At \u03b5 \u2264 8, the federated \u2026"},{"n":642,"t":"Adversarial robustness and certification of physics surrogates (IBP, randomised smoothing, physics-consistent attacks)","l":["enhancement","priority: P3","effort: M","surrogate"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B5 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Interval bound propagation (Gowal et al., 2018). \u00b7 Randomised smoothing (Cohen, Rosenfeld & Kolter, ICML 2019). \u00b7 Lipschitz-constrained networks. What exists: modelsecurity.adversarialsensitivity (empirical worst case) and TrustGate. Acceptance test For an MLP surrogate of a parametric PDE: \u00b7 The certified output radius from IBP or smoothing \u2026"},{"n":641,"t":"Sensor spoofing detection for vehicles and robots through vehicle-dynamics consistency (GNSS / IMU / odometry)","l":["enhancement","priority: P3","effort: L"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B4 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 GPS spoofing of UAVs (Kerns et al., J. Field Robotics 2014). \u00b7 Control-invariant attack detection (Choi et al., CCS 2018). \u00b7 SAVIOR (Quinonez et al., USENIX Security 2020). What exists: vehicle bicycle-model runs, EKF and UKF, the pinneapplesecurity.cps framework, and the rover vehicle dynamics (pinneapplesimulation.vehicle). Acceptance test On a \u2026"},{"n":640,"t":"Physics-residual screening of training data against poisoning, recorded in the signed dataset manifest","l":["enhancement","priority: P2","effort: M","data"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B3 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: certified defences against data poisoning (Steinhardt, Koh & Liang, NeurIPS 2017). Poisoning of scientific-ML surrogates is barely studied. Physics residuals give a label-free consistency test for each training sample. What exists: residual functions, TrustGate, integrity manifests and attestation, and secretsscan. Integration point: data \u2192 model. \u00b7 \u2026"},{"n":639,"t":"Power-grid state-estimation FDI detection with dynamic physics residuals (IEEE 14/118-bus)","l":["enhancement","priority: P2","effort: L","digital-twin"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item B2 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Liu, Ning & Reiter, CCS 2009. \u00b7 Kosut et al., IEEE Trans. Smart Grid 2011 (GLRT). \u00b7 Manandhar et al., IEEE Systems Journal 2014 (Kalman filter with chi-squared and Euclidean detectors). \u00b7 Survey: Musleh, Chen & Dong, IEEE Trans. Smart Grid 11(3) 2020. What exists: EKF and EnKF, the pinneapplesecurity.cps residual framework, and CUSUM. PINNeAPPle \u2026"},{"n":638,"t":"Latent generative surrogates (latent diffusion / flow matching) with a physics check on every sample","l":["enhancement","priority: P3","effort: L","surrogate","uq"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A6 of docs/dev/LATENTANDCYBEREVALUATION.md. Research track. State of the art: \u00b7 Latent diffusion (Rombach et al., CVPR 2022) and flow matching (Lipman et al., ICLR 2023). \u00b7 Autoregressive conditional diffusion for turbulence (Kohl, Chen & Thuerey, arXiv:2309.01745). \u00b7 Physics-informed diffusion (Shu, Li & Barati Farimani, JCP 2023; Bastek, Sun & Kochmann, ICLR 2025). \u00b7 GenCast (Price et al., Nature 2025). What \u2026"},{"n":637,"t":"Geometry latent spaces: shape codes as surrogate inputs and latent density as a geometry OOD score","l":["enhancement","priority: P3","effort: L","surrogate","geometry"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A5 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: DeepSDF (Park et al., CVPR 2019), occupancy networks (Mescheder et al., CVPR 2019), PointNet (Qi et al., CVPR 2017), GINO (Li et al., NeurIPS 2023), Transolver (Wu et al., ICML 2024). What exists: \u00b7 geometryoodguardrail, which uses hand-made features. \u00b7 pinneappledesign parametric geometry and optimiser. \u00b7 The car2d generator and voxelisation. \u00b7 The \u2026"},{"n":636,"t":"Physics-constrained latent spaces: conservation and structure preserved in latent coordinates","l":["enhancement","priority: P3","effort: L","rom"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A4 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Conservation-enforcing nonlinear-manifold ROMs (Lee & Carlberg, \"Deep conservation\", JCP 2021). \u00b7 Structure-preserving latent dynamics, port-Hamiltonian and GENERIC (Hern\u00e1ndez et al., JCP 2021). \u00b7 Physics-informed latent training (Kim et al., JCP 2022). koopmanpiae is a starting point. Integration point: model training, with the conserved \u2026"},{"n":635,"t":"Latent dynamics surrogates with stability checks and per-horizon rollout trust","l":["enhancement","priority: P2","effort: M","uq","rom"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A3 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Operator inference (Peherstorfer & Willcox, CMAME 2016), and its energy-preserving and stable variants (Sawant, Kramer & Peherstorfer, CMAME 2023; Goyal, Pontes Duff & Benner, 2023). \u00b7 Koopman autoencoders (Lusch, Kutz & Brunton, Nat. Commun. 2018). \u00b7 Latent ODEs (Rubanova et al., NeurIPS 2019). \u00b7 LaSDI (Fries, He & Choi, CMAME 2022). \u00b7 Latent \u2026"},{"n":634,"t":"Latent data assimilation: EnKF / 3D-Var in POD or autoencoder coordinates for digital twins","l":["enhancement","priority: P2","effort: M","rom","digital-twin"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Item A2 of docs/dev/LATENTANDCYBEREVALUATION.md. State of the art: \u00b7 Amendola et al., ICCS 2021. \u00b7 Peyron et al., QJRMS 147 (2021). \u00b7 Reduced-order EnKF and POD-4D-Var (Cao et al., IJNMF 2007). \u00b7 Review: Cheng et al., IEEE/CAA J. Autom. Sinica 10 (2023). What exists: EnsembleKalmanFilter, var4d, POD and autoencoder encoders, latent dynamics (OpInf, Koopman), and digital-twin monitoring. Integration point: data \u2192 \u2026"},{"n":630,"t":"Colab notebooks and MCP server: switch to pp.benchmark and pp.geometries once merged","l":[],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Follow-up of #629 (Colab notebooks, AGENTS.md, pinneapple-mcp). pp.zoo / pp.datasets (#621) are already used there. Two APIs were not on main when it was written: pp.benchmark (equal-budget benchmark API, branches feat/benchmark-api / feat/equal-budget-benchmark, #598) \u00b7 notebooks/colab/03equalbudgetbenchmark.ipynb: the cell marked \"Switch to pp.benchmark\" runs only when pinneappleanalysis.benchmark and \u2026"},{"n":626,"t":"Test isolation: a leaked default device (MPS) makes unrelated tests fail","l":["bug","priority: P2","effort: M"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Documented in .agent/FAILEDAPPROACHES.md #7: some tests leave the default device on mps, so later tests fail non-deterministically (different DeviceContext identities across runs). A fixture that resets the device fixed 12 failures but not the cause. Next step: bisect the suite to find the test that leaks, fix it at the source, and add an autouse fixture that fails the test that leaves the device changed."},{"n":625,"t":"Full regression suite: re-measure the failures on v0.7.0 and fix or quarantine each one","l":["bug","priority: P1","effort: M"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"The last full 37-file regression (0.6.2 baseline) ended with 68 failed, 798 passed, 155 skipped. Part of the failures is a test-isolation leak (device left on mps), the rest is unclassified. Only tests/testmanufacturedsolutions.py blocks the workflow today; everything else runs with continue-on-error. Next step \u00b7 run the full suite on v0.7.0 and list the failing test ids \u00b7 classify each one: real bug, environment, \u2026"},{"n":624,"t":"Method catalogue: validate the methods that are still untested or tested without a reference","l":["enhancement","priority: P1","effort: L"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"At the last count (2026-10-02, branch feat/validation-batch4) the catalogue had 42 untested methods and 53 tested without a reference solution. Regenerate pinneapplecatalog/methodstatus.json first: the numbers are old. Done when \u00b7 the status file is regenerated on v0.7.0 and the counts are written here \u00b7 a validation batch (5 to 10 methods per batch, each against a manufactured or published reference) is merged per \u2026"},{"n":623,"t":"Review and merge the four open pull requests (#559, #598, #606, #621)","l":["documentation","priority: P1","effort: S"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Four pull requests are open and none is being worked on in the issue list: \u00b7 #559 REA bridge + harvested numerics \u00b7 #598 Equal-budget comparison toolkit and the \"Choosing a method\" page (#299) \u00b7 #606 [A8] Lightweight governance \u00b7 #621 Model zoo (pp.zoo) and dataset hub (pp.datasets) Next step: review in this order: #606 (small, unblocks contribution rules), #598, #621 (touches the catalogue in #528), #559 (largest). \u2026"},{"n":620,"t":"Developer showcases: Hugging Face Spaces, conda-forge, conference talks and short videos","l":["documentation","priority: P2","effort: M","area: release-quality","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal Put PINNeAPPle where developers already look, with low effort per item and cumulative reach. Checklist \u00b7 Hugging Face Spaces (Gradio), one per showcase model from the zoo: airfoil surrogate (draw a CST shape, get Cl, Cd and the field, with trust checks), rover terramechanics, heat PINN. Each Space links back to the repo and the model card. \u00b7 conda-forge feedstock for pinneapple (core plus optional extras), with \u2026"},{"n":619,"t":"Educational series \"Under the hood\": numerics behind CFD and Physics AI, as notebooks and posts","l":["documentation","priority: P2","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal A recurring series of short, runnable notebooks (Colab), each with a figure or animation and a post, that explain one numerical detail most users never see and show it working in PINNeAPPle. It is educational outreach that teachers and students can reuse. First episodes 1. Rhie-Chow interpolation and the checkerboard problem on collocated grids (#613). 2. Non-orthogonal correction on skewed meshes. 3. Upwind vs \u2026"},{"n":618,"t":"pp.forecast(lat, lon): wind and solar forecasts with uncertainty for energy and data-centre use","l":["enhancement","priority: P3","effort: L","area: ecosystem","uq"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal A one-line API, and a small HTTP service, giving wind speed at hub height and solar irradiance or PV power for any location over the next hours to days, with calibrated uncertainty bands and a reliability horizon. The audience is developers building energy, EV-charging and data-centre scheduling tools. Scope \u00b7 Data: open sources only (Open-Meteo / ECMWF open data, ERA5 for training and verification); licences \u2026"},{"n":617,"t":"\"Explain this simulation\": upload a CFD case or a model, get a plain-language trust report","l":["enhancement","priority: P2","effort: M","area: apps","ux"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal A public web tool and an API: upload an OpenFOAM case (or a VTK result, or a PINNeAPPle model) and receive a trust report in plain language. The report covers what was simulated, which models and boundary conditions were used, mesh quality, convergence, conservation and residual checks, what can and cannot be concluded, and what to fix. It is aimed at engineers and technical managers who do not do ML or CFD \u2026"},{"n":616,"t":"Public Physics AI challenges with a leaderboard judged by pp.benchmark","l":["enhancement","priority: P2","effort: L","area: ecosystem","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal Recurring public challenges (\"Kaggle for Physics AI\") in which anyone submits a method and pp.benchmark scores it under an equal compute budget, with physics checks that a submission must pass. Results go on a public leaderboard. Scope \u00b7 Challenge format: \u00b7 a problem spec, the training data and budget (FLOPs or wall clock on a reference GPU), and hidden test and OOD sets; \u00b7 metrics: integrals and fields \u2026"},{"n":615,"t":"Lightweight physics surrogates for game engines and robot simulators (ONNX export to Godot, Unity, Unreal, MuJoCo, Isaac)","l":["enhancement","priority: P3","effort: L","area: ecosystem","surrogate","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal Let game and robotics developers use PINNeAPPle surrogates as fast, physically checked effects and contact models: water and waves, wind loads, granular terrain (the lunar rover's wheel-soil model), heat. The surrogates are exported to ONNX and called from engine plug-ins. Scope \u00b7 pp.export.onnx(model, ...) for zoo models, with fixed input/output signatures, units in the metadata, a validity range, and a small \u2026"},{"n":614,"t":"Showcase notebook: a coding agent solves a physics problem in Colab and PINNeAPPle verifies the answer","l":["documentation","priority: P2","effort: M","area: ecosystem","agents"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal A Colab notebook, and a short recorded video, in which a coding agent running inside Colab (Gemini CLI or Antigravity CLI, on a free GPU runtime) is asked to solve a physics problem with PINNeAPPle, and the PINNeAPPle checks decide whether the answer can be trusted. The message is that an agent can write plausible but wrong physics code, and PINNeAPPle's physics checks catch it. Depends on \u00b7 Colab notebooks, \u2026"},{"n":613,"t":"Collocated finite-volume SIMPLE solver with Rhie-Chow interpolation for a NACA 2412, plus a surrogate trained on it","l":["enhancement","priority: P2","effort: L","surrogate","solvers","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Goal Reproduce a classic CFD teaching result and extend it with Physics AI: 1. A steady, incompressible Navier-Stokes solver on a collocated finite-volume grid using the SIMPLE algorithm, run on a NACA 2412 airfoil. 2. Rhie-Chow momentum interpolation of the face fluxes, to suppress the odd-even (checkerboard) pressure-velocity decoupling that appears with linear interpolation. The run shows the continuity residual \u2026"},{"n":604,"t":"Scale-conditioned surrogates: condition models on resolution, filter width or physical scale","l":["enhancement","priority: P2","surrogate","neural-operators"],"m":null,"c":1,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Problem: Surrogates are trained for one resolution and one implicit filter. Using them at another resolution (super-resolution, coarser meshes, LES with a different \u0394) silently changes what they represent. FNO is discretisation-invariant only in its architecture, not in the physics of the filtered data. Proposal: \u00b7 Scale conditioning: add a scale input to the surrogate API in pinneappleneural.architectures (FNO, \u2026"},{"n":603,"t":"Scale-driven adaptive fidelity: switch between surrogate, RANS and LES by the scales the question needs","l":["enhancement","priority: P2","orchestration","solvers"],"m":null,"c":1,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Problem: The existing adaptive-fidelity issues (#161, #347) decide between surrogate and solver from trust and error. They do not consider whether the question needs resolved turbulent scales. A surrogate trained on RANS cannot answer a question about peak unsteady loads or mixing at the Kolmogorov/Taylor scale, however small its validation error. Proposal: Extend the adaptive-fidelity controller with a scale \u2026"},{"n":601,"t":"Closure model benchmarking: compare RANS/LES closures for the unresolved scales on reference DNS/LES data","l":["enhancement","priority: P2","solvers","benchmark"],"m":null,"c":1,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Problem: PINNeAPPle runs OpenFOAM with several turbulence models and has hybrid/neural closures (#211), but no common harness compares closures on the same case against reference data. Users choose k-\u03c9 SST, Smagorinsky, WALE or a learned closure by habit. Proposal: pinneapplesimulation.closures.benchmark: \u00b7 Cases: canonical cases with public reference data, cited with their licences: \u00b7 turbulent channel at Re\u03c4 = \u2026"},{"n":594,"t":"COMSOL bridge through MPh (parameter sweeps \u2192 dataset)","l":["enhancement","priority: P3","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: COMSOL 6.3/6.4 surrogate training, Model Manager; MPh (MIT, community) drives COMSOL's Java API from Python. What PINNeAPPle already has: Nothing beyond mentions in the tool-recommendation tables. Proposal: Optional bridge: open .mph, set parameters, solve, export scalars and fields to UPD/xarray; reuse the DOE samplers. Acceptance (rule D1 \u2014 independent reference): Skipped without a COMSOL licence; with \u2026"},{"n":593,"t":"Rescale REST connector: run a DOE campaign on Rescale and pull results","l":["enhancement","priority: P3","orchestration","hpc"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Rescale API v2 (jobs, submit, statuses, files), AI Physics dataset format (PyVista-compatible). What PINNeAPPle already has: SLURM script generation, Prefect flows, file-lock sharded OpenFOAM campaigns; no managed cloud backend. Proposal: A campaign backend that submits each DOE point as a Rescale job, polls, downloads outputs and registers them in pinneappleregistry. Acceptance (rule D1 \u2014 independent \u2026"},{"n":592,"t":"Onshape connector: sample configuration parameters and export geometry for DOE","l":["enhancement","priority: P3","interop","cad"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Onshape REST API (configurations, encodeConfigurationMap, STL/STEP/Parasolid export); Luminary \u00d7 Onshape partner app generating SHIFT-Wing variants. What PINNeAPPle already has: STEP via gmsh, CadQuery; Onshape appears only in the resource catalog. Proposal: pinneappledesign.geometry.io.onshape: read configuration parameters, LHS over them, export STL per variant, record document/version IDs as dataset \u2026"},{"n":591,"t":"RBF / Kriging / EBF approximation models with training-set outlier detection","l":["enhancement","good first issue","priority: P2","surrogate"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Dassault Isight approximation models (RSM, Kriging, RBF, EBF), COMSOL surrogate training (GP, PCE, DNN), 3DEXPERIENCE outlier exploration. What PINNeAPPle already has: NumPy GP in designoptimizer; no RBF surrogate; no outlier screening of training data. Proposal: RBF interpolant (thin-plate/multiquadric with polynomial tail), ordinary Kriging, leave-one-out error, and an outlier score per training \u2026"},{"n":590,"t":"NVIDIA Warp backend: warp.fem weak forms + zero-copy torch interop","l":["enhancement","priority: P3","solvers","gpu"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: NVIDIA Warp 1.18 (Apache-2.0): @wp.kernel with wp.Tape autodiff, warp.fem integrands on grid/tet/hex geometries, wp.totorch via DLPack. What PINNeAPPle already has: Warp only indirectly through the Newton bridge; ROADMAP \u00a73 lists Warp as a candidate differentiable backend. Proposal: computebackends.warp: zero-copy tensors, a Poisson/elasticity example in warp.fem, differentiable particle step for \u2026"},{"n":589,"t":"Neural networks inside variational forms (firedrake.ml-style) in the FEniCS bridge","l":["enhancement","priority: P3","hybrid","fem"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Firedrake (LGPL-3.0, clean-room): femoperator / mloperator embed PyTorch/JAX models in UFL forms with adjoints. What PINNeAPPle already has: fenicsbridge, hybrid surrogates; no NN term inside a weak form. Proposal: External-operator term in a FEniCS form evaluated by a torch model, with the adjoint provided by torch autograd (method from the published paper, not Firedrake code). Acceptance (rule D1 \u2014 \u2026"},{"n":588,"t":"ParaView Catalyst 2 in-situ adaptor for solvers and surrogates","l":["enhancement","priority: P3","visualization"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: ParaView 6.2 (BSD-3-Clause, Copyright.txt): Catalyst 2 with Conduit Blueprint; NekRS/FluidX3D/M-Star render while running. What PINNeAPPle already has: PyVista/VTK export, trame, Rerun bridge; nothing streams fields in situ from the native solvers. Proposal: Optional catalyst adaptor publishing mesh + fields as Conduit Blueprint every N steps from fvm, lbm, stablefluids and surrogate rollouts. Acceptance \u2026"},{"n":587,"t":"JAX-Fluids as an optional external solver (GPL: subprocess bridge, no code reuse)","l":["enhancement","priority: P3","solvers","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: JAX-Fluids 2.0 (GPL-3.0): fully differentiable compressible two-phase solver (level-set / diffuse interface), level-set immersed boundaries, multi-GPU. What PINNeAPPle already has: jaxcfdsolver.py (incompressible, Apache); no compressible two-phase solver. Proposal: Out-of-process bridge (case JSON in, HDF5 out) behind an optional extra, never imported in-process or vendored; clean-room policy for any \u2026"},{"n":586,"t":"Nektar++ bridge (spectral/hp element, MIT) for high-order reference data","l":["enhancement","priority: P2","solvers","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Nektar++ 5.9 (MIT): CG/DG/HDG/flux-reconstruction spectral/hp, incompressible and compressible N\u2013S, linear stability and adjoint, curvilinear high-order meshes. What PINNeAPPle already has: Bridges to OpenFOAM, FEniCS, CalculiX, FluidX3D, MuJoCo\u2026; no high-order solver. Proposal: Session-XML generation from a ProblemSpec, runner (subprocess/Docker), field reader into UPD \u2014 same pattern as the OpenFOAM \u2026"},{"n":585,"t":"Differentiable implicit linear solves with matrix construction by tracing (PhiFlow-style)","l":["enhancement","priority: P2","solvers","autodiff"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: PhiFlow (MIT): sparse matrices built automatically by tracing a linear function; preconditioned solvers with implicit (adjoint) gradients; dimension-agnostic code. What PINNeAPPle already has: Implicit steps in fdm.py/fvm.py assemble matrices by hand; gradients through solves are not implicit. Proposal: A linearsolve(f, rhs) helper: trace f to a sparse matrix once, solve with CG/BiCGStab, backward pass \u2026"},{"n":584,"t":"Neural-corrected coarse solver trained through the rollout (solver-in-the-loop)","l":["enhancement","priority: P2","training","hybrid"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: APEBench CorrectedStepper; PhiFlow 'solver-in-the-loop' (Um et al., NeurIPS 2020). What PINNeAPPle already has: Differentiable torch solvers (fvm, lbm, spectral), hybrid surrogates (hybridsurrogatephysics). Proposal: Wrap a coarse differentiable solver with a learned correction (sequential or parallel composition) trained by unrolling k steps. Acceptance (rule D1 \u2014 independent reference): 1-D Burgers at \u2026"},{"n":583,"t":"Procedural PDE datasets on the fly (APEBench-style) using the new ETDRK4","l":["enhancement","priority: P2","data","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: APEBench (MIT): datasets are generated procedurally by a spectral ETDRK reference solver (Exponax) instead of downloaded; scenarios are parameterized by normalized 'difficulty' coefficients; autoregressive rollout metrics. What PINNeAPPle already has: numericalsolvers/etdrk4.py (S27), PDE presets, fieldmetrics. Proposal: pinneappledata.procedural: periodic 1/2/3-D scenarios (advection, diffusion, \u2026"},{"n":582,"t":"The Well adapter: WellDataset \u2192 PINNeAPPle dense volumes + leaderboard-comparable metrics","l":["enhancement","priority: P2","data","benchmark"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: PolymathicAI The Well (BSD-2-Clause): 16 physics datasets (fluids, MHD, supernovae, acoustics, biology), WellDataset loader, VRMSE / binned spectral MSE / Wasserstein-1 / windowed DTW metrics. What PINNeAPPle already has: Planned in ROADMAP \u00a74 (pinneappledata.adapters.welladapter), not implemented. fieldmetrics now reports vrmse and pearson with The Well's definitions. Proposal: Adapter to the \u2026"},{"n":581,"t":"Viewer with hash-keyed inference cache and surrogate-vs-truth diff","l":["enhancement","good first issue","priority: P2","frontend","twin3d"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: NVIDIA Omniverse digital-twins-for-fluid-simulation blueprint (SHA256-keyed .npz cache). What PINNeAPPle already has: twin3d viewer, pinneappleapp. Proposal: Re-infer on every parameter change, cache by input hash, diff tab against ground truth. Acceptance (rule D1 \u2014 independent reference): Same input \u2192 same hash and a cache hit; zero diff when surrogate equals truth. Origin: \u00a72 item 15 Related PR: #559"},{"n":580,"t":"Parametric RBF morphing of tessellated geometry (no CAD needed)","l":["enhancement","good first issue","priority: P2","design-optimization","geometry"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: STAR-CCM+ 2506 Parametric Morphing, SU2 RBF deformation. What PINNeAPPle already has: Absent (optimization needs parametric geometry). Proposal: RBF morphing with control points and parameter vectors acting on an STL. Acceptance (rule D1 \u2014 independent reference): Exact interpolation at control points; zero displacement outside the support; no inverted elements (positive Jacobian). Origin: \u00a72 item 13 \u2026"},{"n":579,"t":"Design study as a first-class object (Study \u2192 Designs \u2192 Scenarios + comparison view)","l":["enhancement","priority: P2","orchestration","ux"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Autodesk CFD Design Study Automation, COMSOL Model Manager, Simcenter Studio. What PINNeAPPle already has: pinneapplelab, pinneappleregistry. Proposal: Study/Design/Scenario hierarchy in the registry + a comparison view in pinneappleapp. Acceptance (rule D1 \u2014 independent reference): Round trip: a saved and reloaded study returns identical results; the comparison sorts by KPI. Origin: \u00a72 item 12 Related \u2026"},{"n":578,"t":"Adjoint: MMA optimizer and volumetric B-spline parameterization","l":["enhancement","priority: P2","design-optimization"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: OpenFOAM ESI adjointOptimisation, SU2 (RBF, Hicks\u2013Henne). What PINNeAPPle already has: ContinuousAdjointSolver, ShapeParametrization. Proposal: MMA (Svanberg 1987) and volumetric B-spline morphing boxes. Acceptance (rule D1 \u2014 independent reference): MMA reproduces the optimum of Svanberg's test problem; zero control-point displacement leaves the geometry unchanged. Origin: \u00a73 Related PR: #559"},{"n":577,"t":"REA: native binary analysis (FMUs, solvers) with a Ghidra provider","l":["enhancement","priority: P3","rea"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: REA openbinary + Ghidra/Hopper/IDA providers. What PINNeAPPle already has: reabridge covers JavaScript and provenance; fmuinspect covers the ELF symbol table. Ghidra could not be installed in the sandbox (GitHub Releases download blocked). Proposal: rea setup with Ghidra on a machine with access; ReaClient.openbinary/decompile wrappers + a native-Evidence summarizer. Acceptance (rule D1 \u2014 independent \u2026"},{"n":576,"t":"PhysicsNeMo models not yet exposed: FIGConvNet, TopoDiff, DLWP-HEALPix","l":["enhancement","priority: P3","neural-operators"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: NVIDIA PhysicsNeMo (Apache-2.0). What PINNeAPPle already has: physicsnemobridge exists; these models are not exposed. Proposal: Expose through the bridge first (no reimplementation); reimplement only where justified. Acceptance (rule D1 \u2014 independent reference): Forward smoke test + one small training case per model. Origin: ledger: PhysicsNeMo Related PR: #559"},{"n":575,"t":"In-browser PDE preview (SymbolicPDE \u2192 GLSL), VisualPDE-style","l":["enhancement","priority: P3","frontend"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: VisualPDE (MIT) \u2014 located with REA: setRDEquations, urlcodec, auto steps-per-frame. What PINNeAPPle already has: pinneappleapp/frontend (React/Vite); SymbolicPDE. Proposal: Emit GLSL from a 2-D reaction\u2013diffusion ProblemSpec, run it in the frontend, keep the state shareable in the URL. Acceptance (rule D1 \u2014 independent reference): Gray\u2013Scott: steady pattern matches the NumPy solver (correlation 0.99) on \u2026"},{"n":574,"t":"MAPDL .rst result reader and a PyFluent driver","l":["enhancement","priority: P3","interop"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: PyAnsys pymapdl-reader and pyfluent (MIT). What PINNeAPPle already has: Readers for Abaqus, Exodus, CGNS, Fluent mesh, STAR-CCM+; Fluent driven by journal files. Proposal: .rst reader (optional pymapdl-reader dependency) into UPD; a PyFluent path in externalsolvers/ansys. Acceptance (rule D1 \u2014 independent reference): pymapdl-reader's own example .rst file read with displacements equal to the reference \u2026"},{"n":572,"t":"Incremental FNO (iFNO): grow Fourier modes during training","l":["enhancement","priority: P2","neural-operators"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: neuraloperator IncrementalFNOTrainer (MIT); George et al., TMLR 2024. What PINNeAPPle already has: FNO in architectures/neuraloperators/fno.py with fixed modes. Proposal: Training callback (loss-gap and explained-variance rules) that increases the FNO modes. Acceptance (rule D1 \u2014 independent reference): 1-D Burgers: same final accuracy as fixed-mode FNO with fewer training FLOPs (fixed seed). Origin: \u2026"},{"n":571,"t":"LBM D3Q27 cumulant collision + STL voxelization + FP16 storage","l":["enhancement","priority: P2","solvers","gpu"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: ultraFluidX, PowerFLOW, XFlow, M-Star, SimScale Pacefish, FluidX3D (FP16 storage). What PINNeAPPle already has: lbm.py: D2Q9/D3Q19 BGK + Smagorinsky; lbmtunnel. Proposal: D3Q27 cumulant collision, STL voxelization (GPU via torch), FP16 storage with FP32 arithmetic (the idea only \u2014 FluidX3D is non-commercial, no code reuse). Acceptance (rule D1 \u2014 independent reference): 3-D Poiseuille and Taylor\u2013Green \u2026"},{"n":570,"t":"Geometry encoders (PointNet / DGCNN; B-rep UV-Net later)","l":["enhancement","priority: P2","surrogate","geometry"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Neural Concept, Simcenter PhysicsAI (geometric deep learning). What PINNeAPPle already has: geometryfeatures, geometryintelligence (hand-crafted descriptors). Proposal: PointNet/DGCNN encoders in pinneappleneural/architectures, used by the similarity score and the raw-geometry surrogate. Acceptance (rule D1 \u2014 independent reference): Permutation invariance tested; accuracy reported on a ModelNet10 subset. \u2026"},{"n":569,"t":"Polynomial chaos expansion + Sobol indices for UQ and sensitivity","l":["enhancement","good first issue","priority: P2","uq"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: optiSLang, COMSOL Uncertainty Quantification Module. What PINNeAPPle already has: Conformal / ensemble / MC-dropout; no PCE. Proposal: Regression PCE (Hermite/Legendre) with Sobol indices computed analytically from the coefficients. Acceptance (rule D1 \u2014 independent reference): Ishigami function: first-order and total Sobol indices within 1% of the closed-form values. Origin: \u00a72 item 10 Related PR: #559"},{"n":568,"t":"Hybrid dynamic ROM (physics + learned residual) calibrated online from sensors","l":["enhancement","priority: P2","rom","digital-twin"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Twin Builder (Neural ODE, TFT, Hammerstein LPV, fusion modeling), ROM Builder (LSTM/GRU). What PINNeAPPle already has: Neural ROM, Koopman, SINDy, Kalman, 4D-Var \u2014 but not the physics + residual composition updated online. Proposal: Physics ROM + learned correction, updated by Kalman/EnKF inside digitaltwin. Acceptance (rule D1 \u2014 independent reference): Synthetic system with a known missing term: the \u2026"},{"n":567,"t":"Multi-fidelity surrogate (Kennedy\u2013O'Hagan co-kriging)","l":["enhancement","priority: P2","surrogate"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: optiSLang AI+, HEEDS data reuse, COMSOL. What PINNeAPPle already has: Transfer/meta-learning exist; explicit multi-fidelity does not. Proposal: Autoregressive co-kriging on the NumPy GP in designoptimizer (e.g. coarse LBM + fine OpenFOAM). Acceptance (rule D1 \u2014 independent reference): Forrester functions (closed form): co-kriging with 4 HF + 11 LF points beats an HF-only GP in RMSE. Origin: \u00a72 item 8 \u2026"},{"n":566,"t":"Solution-adaptive mesh refinement (quadtree, wavelet/gradient criterion)","l":["enhancement","priority: P2","meshing","solvers"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: CONVERGE (AMR every step), Basilisk (adaptwavelet), Luminary SDK. What PINNeAPPle already has: Static refinement only (boundary layers, curvature, snappy levels). Proposal: 2-D quadtree with a wavelet criterion for fvm and shallowwaterfv. Acceptance (rule D1 \u2014 independent reference): Ritter dam break: same L1 error as the fine uniform grid with \u2264 40% of the cells. Origin: \u00a72 item 7 Related PR: #559"},{"n":565,"t":"SIMP topology optimization (2-D compliance) on top of solid_fem","l":["enhancement","good first issue","priority: P2","design-optimization"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Ansys Mechanical/Discovery, STAR-CCM+ adjoint topology optimization, SU2, OpenFOAM adjointOptimisation. What PINNeAPPle already has: Absent. Proposal: SIMP with density filter and OC/MMA updates, 2-D compliance, on solidfem.py. Acceptance (rule D1 \u2014 independent reference): Reproduce Sigmund's MBB beam ('99-line code', 2001): final compliance within 1% of the published value on the same mesh. Origin: \u00a72 \u2026"},{"n":564,"t":"PINNeAPPle MCP server generated from PhysicsToolRegistry","l":["enhancement","priority: P1","llm","agents"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: PyAnsys (MCP servers for PyFluent/PyMechanical/PyMAPDL), Luminary SDK (documented MCP server). What PINNeAPPle already has: PhysicsToolRegistry already carries inputschema/outputschema; agentloop uses the registry. Proposal: Generate MCP tools from the registry (stdio), with an allowlist and PhysicsGuardrail on outputs. Acceptance (rule D1 \u2014 independent reference): tools/list exposes the registered \u2026"},{"n":563,"t":"Export ROMs and surrogates as FMUs (co-simulation)","l":["enhancement","priority: P1","rom","digital-twin","fmi"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Ansys Twin Builder, Simcenter ROM Builder (FMI + ONNX), Altair/Siemens romAI. What PINNeAPPle already has: ROMs (POD, DMD, OpInf, neural ROM), ONNX/TorchScript export; modelica/fmirunner.py only imports FMUs; the new fmuinspect.py validates them. Proposal: Package linear ROMs (POD/DMD/OpInf) as FMI 2.0/3.0 co-simulation FMUs from generated C (no runtime dependency), and neural ROMs through ONNX Runtime. \u2026"},{"n":562,"t":"Pipeline 'CFD cases \u2192 field surrogate from STL / point cloud' + a real DoMINO","l":["enhancement","priority: P1","surrogate"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Ansys SimAI (non-parametric), Simcenter PhysicsAI, Luminary SHIFT (DoMINO/GeoTransolver), Emmi AB-UPT. What PINNeAPPle already has: Transolver, MeshGraphNet, physicsnemobridge, lpm.py. Note: pinneapplephysics/pinnsolver/domino.py is a domain-decomposition PINN, not NVIDIA's DoMINO \u2014 the name is misleading. Proposal: Ready-made pipeline: folder of OpenFOAM cases \u2192 dataset (surface + volume) \u2192 training \u2026"},{"n":561,"t":"Closed loop: the surrogate picks the next simulation (acquisition \u2192 campaign \u2192 retrain)","l":["enhancement","priority: P1","active-learning","orchestration"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: HEEDS adaptive sampling, PhysicsX (UQ \u2192 new simulation), Neural Concept. What PINNeAPPle already has: pinneapplecore/data.py::ActiveSampler, EI in designoptimizer, externalsolvers/openfoam/campaign.py, pinneappleregistry. Proposal: An orchestrator wiring acquisition function \u2192 campaign (OpenFOAM/LBM/any registry solver) \u2192 dataset store \u2192 retrain \u2192 next acquisition, stopping on validation error or budget. \u2026"},{"n":560,"t":"Return a 0\u20131 geometric similarity score with every surrogate prediction","l":["enhancement","priority: P1","surrogate","uq"],"m":null,"c":0,"cr":"2026-10-13","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Who has it: Simcenter/Altair PhysicsAI return a geometric similarity score; Ansys SimAI returns a confidence level telling whether a new design lies inside the training domain. What PINNeAPPle already has: GeometryOODGuardrail, analysis/trust/trustgate.py, conformal/ensemble UQ in pinneappleanalysis/uncertainty. Proposal: Geometry embedding (geometryfeatures descriptors + curvature from geometry/ops/curvature.py) \u2192 \u2026"},{"n":556,"t":"Accelerated OpenFOAM pressure solves: next steps after #554 (free-surface cases, GPU, learned guesses)","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"554 (merged) added pinneapplesimulation/acceleratedfoam/ and the pinneWarmStart OpenFOAM plugin. The plugin projects the current pressure system onto the last solutions, as an initial guess for OpenFOAM's own solver, and is verified against plain OpenFOAM. Full results are in docs/coreconcepts/openfoamacceleration.md. The work was paused here. Results so far (OpenFOAM v1912, 1 core, no GPU) Lid-driven cavity \u2026"},{"n":555,"t":"Electric-motor magnetics and topology optimization: finish branch feat/motor-magnetics-topopt (paused)","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Work is paused on branch feat/motor-magnetics-topopt: one WIP commit, about 3.6k lines, no PR yet. The audit and current status are in docs/coreconcepts/motorandtopoptaudit.md. What existed before \u00b7 Only a PINN example of an infinite wire for magnetostatics. \u00b7 An axisymmetric eddy-current FDM solver (verified). \u00b7 No machine model (magnets, coils, rotation, torque, flux linkage, cogging, losses). \u00b7 No density-based \u2026"},{"n":553,"t":"fitmesh: manufacturability and tolerance checks on CAD variants","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Why A CAD variant can pass every geometric check in pinneappledesign/fitmesh/cad.py and still be impossible or unrealistic to make. The study should flag that before meshing and simulating it. Proposal Add a manufacturability block to the per-variant checks (value, limit and verdict, as the existing rows), driven by a declared process: \u00b7 Minimum wall thickness: ray casting or medial-axis estimate on the solid, \u2026"},{"n":552,"t":"fitmesh: grow the template catalogue with industrial parts (tee, reducer, valve, open channel, nozzle)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Why The catalogue in pinneappledesign/fitmesh/catalog.py has 9 templates. Most industrial problems fall outside it and end up in language-model geometry, which has no published reference to compare against. Proposal Add parametric templates, each in the same format as the existing ones: \u00b7 physics and keywords; \u00b7 parameters with reference value, typical range and validity limits, plus role and sensitivity; \u00b7 \u2026"},{"n":551,"t":"fitmesh: fit a catalogue template to an uploaded CAD or scan and report the deviation","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Why Today \"close to reality\" in pinneappledesign.fitmesh means close to the published reference object of a template. When the user has the real part (STEP/IGES/STL or a 3D scan), we should measure how far each template variant is from that part, not only from the literature object. Proposal \u00b7 fittemplate(template, part) - FitResult: find the template parameters that best reproduce the uploaded geometry. \u00b7 Align \u2026"},{"n":550,"t":"hpo_experiments and formfill on the shared provider layer","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Two packages call language models outside the shared provider layer: \u00b7 pinneappletools/hpoexperiments has its own Gemini provider (providers/geminiprovider.py), used by agents/extractor, verifier and reproducer. \u00b7 pinneappledata/formfill/llm.py has its own urllib OllamaClient and extractwithllm. Proposal: \u00b7 Move both onto LLMAssist and callllm (#539), with adapters, so any provider works, including a local Ollama. \u00b7 \u2026"},{"n":549,"t":"Reports: optional plain-language summary that may only quote numbers from the report","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Several outputs give users raw scores, components and checklists to read: \u00b7 veriphysics DecisionRecord and evidencereport; \u00b7 pinneappleanalysis/trust/trustreport.py; \u00b7 pinneapplelab/reports.writereport; \u00b7 pinneapplelab/curation.planexperiment; \u00b7 physicsaudit.diagnose and recommend. Proposal: an optional section labelled \"Model summary\" with an executive summary and the next best action. Validation: \u00b7 Every number in \u2026"},{"n":548,"t":"Design: objectives and constraints from text (qualitative preview, design optimizer, heat-sink sizer)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Today: \u00b7 pinneappledesign/qualitative/preview.py parseobjective: a regex vocabulary that raises ValueError when nothing matches. \u00b7 designoptimizer (DesignOptConfig, objective and constraint classes): users compose objectives and constraints by hand. \u00b7 thermal/heatsink/sizer.py SizingRequest: a form. Proposal: the model proposes: \u00b7 (quantity, sense, model) among MODELS[...].quantities; \u00b7 CompositeObjective weights; \u00b7 \u2026"},{"n":547,"t":"Preflight: model-proposed fix per finding, accepted only if re-running preflight clears it","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"pinneappledata/preflight preflight() (also the simulation preflight app) gives findings with hand-written detail and fix text. The user then edits the case files. Proposal: for each fail or warn finding, the model proposes a concrete patch, as key/value edits through campaign.setentry. Validation: \u00b7 Apply the patch to a copy and run preflight() again. \u00b7 Accept it only if that finding disappears and no new fail \u2026"},{"n":546,"t":"Solver setup from text: CalculiX FEModel, FEniCS config, OpenFOAM Campaign plans, Fluent cases","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"What users build by hand today: \u00b7 CalculiX (externalsolvers/calculix/study.py: FEModel, Static/Frequency/Buckle/Heat): node sets, fixes, loads, pressures, materials. FEniCS (FEniCSConfig) is the same story. \u00b7 OpenFOAM (openfoam/campaign.py Campaign): plan JSON. \u00b7 Fluent (ansys/journalbuilder.py FluentCaseConfig): boundary-condition zone dicts. Proposal: the model maps a text brief onto these objects: \u00b7 step type; \u00b7 \u2026"},{"n":545,"t":"physical_units.infer_quantity: model fallback for ambiguous column names, checked by dimension","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"pinneappledata/physicalunits.py inferquantity matches keywords. It is used by: \u00b7 datahealth; \u00b7 unified; \u00b7 the data standardizer app. Plant tags such as \"TT-101 PV\" end up as low-confidence mappings that a person reviews. Proposal: when the confidence is below the threshold, ask the model for a quantity key from QUANTITIES. Validation: \u00b7 The key must be in quantitiesfordim(unit.dim), so it is dimensionally compatible \u2026"},{"n":544,"t":"Arena: draft ArenaConfig (preset, models, training) from a description","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Today users write by hand, in YAML or code (pinneapplearena/custombuilder.py defineproblem, pinneapplearena/config.py ArenaConfig): \u00b7 the PDE residual string; \u00b7 the boundary-condition dicts; \u00b7 the list of models. Proposal: \u00b7 Choose a preset with draftproblem. \u00b7 Choose ModelConfig entries only from ModelRegistry, plus training parameters. \u00b7 A new PDE string goes only through presetauthoring.draftpreset, which already \u2026"},{"n":543,"t":"identify_pde / suggest_problem_spec and worldmodel from_prompt: model fallback when keywords miss","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Two keyword parsers that fall back silently today: \u00b7 pinneapplephysics/pdeenvironment/capabilities.py: identifypde scores keyword overlap. When nothing matches, it returns \"custom\" with confidence 0. \u00b7 pinneappleworldmodel/scenariogenerator.py: fromprompt \u2192 prompttodict uses fixed keyword lists. When it finds nothing, it defaults to a cavity, air, Re = 1000. Proposal: when the score is zero or the defaults were hit, \u2026"},{"n":542,"t":"problemdesign: one LLM provider protocol on top of call_llm (local Ollama included)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"pinneappleproblemdesign defines LLMProvider twice, with incompatible signatures: \u00b7 protocol.py: generate(messages, ..., jsonmode), plus GeminiProvider. \u00b7 providers/init.py: generate(, prompt, system, schema), plus CosmosProvider. agent.py, extractor.py and unifiedagent.py only accept those protocols, so the existing callllm providers cannot be used, local Ollama included. \u00b7 Merge the two protocols. \u00b7 Add a \u2026"},{"n":541,"t":"ConversationStore: record whether the model's answer was accepted","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Today pinneapplellm/conversationstore.py log() keeps only the prompt and the response. Add optional fields: \u00b7 accepted: bool; \u00b7 validation: dict (what was dropped or clipped, and which checker passed or failed); \u00b7 runid. Pass module=\" . \" consistently. This makes three things possible: \u00b7 finetune.preparedataset can train only on outputs that were accepted and validated; \u00b7 reports (DecisionRecord.evidence, ModelCard, \u2026"},{"n":540,"t":"call_llm: max_tokens, temperature, JSON for every provider, optional json_schema","l":["good first issue","priority: P1"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"pinneapplellm/dispatch.callllm has two problems: \u00b7 It hard-codes maxtokens=1024 for Anthropic. Config proposals for Arena, Campaign or CalculiX will be longer than that. \u00b7 It ignores jsonmode for Anthropic. Changes: \u00b7 Add maxtokens and temperature keyword arguments, with the current values as defaults. \u00b7 Enforce JSON on Anthropic, either by prefilling { or by using a tool/JSON schema. \u00b7 Add an optional jsonschema= \u2026"},{"n":539,"t":"pinneapple_llm: shared LLMAssist config and a propose-and-check helper","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-12","up":"2026-10-13","p":538,"s":0,"a":false,"x":"Move LLMAssist from pinneappledesign/fitmesh/llm.py to pinneapplellm/assist.py and re-export it. LLMAssist holds provider, model, apikey, conversationstore, a call override for tests, and provider kwargs. \u00b7 One argument everywhere. Every module takes one optional argument, llm: LLMAssist | None = None. None keeps today's behaviour. \u00b7 Old keywords. Keep the existing keywords as deprecated aliases: provider=, \u2026"},{"n":538,"t":"Optional language-model assistance acro
