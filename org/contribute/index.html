,"p":403,"s":0,"a":false,"x":"Context Several PINNeAPPle solvers are vectorised PyTorch: \u00b7 compressiblefv; \u00b7 shallowwaterfv; \u00b7 the new axisymmetric accretion solver in pinneapplephysics.blackhole (#399). On small grids they are dominated by kernel-launch overhead. The accretion solver takes about 10 ms per step on 128 \u00d7 64 cells on CPU, so a 10\u2074 GM/c\u00b3 run takes about 1.5 h. NVIDIA Warp compiles Python kernels to CPU and CUDA, supports automatic \u2026"},{"n":409,"t":"NVIDIA PhysicsNeMo DoMINO and X-MeshGraphNet as baselines on the Ashton datasets, with the trust layer on top","l":["priority: P3"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context PhysicsNeMo provides external-aerodynamics surrogates with public training recipes: \u00b7 DoMINO: a local, multi-scale point-cloud model for large meshes; \u00b7 X-MeshGraphNet / XAeroNet: MeshGraphNet scaled with halo regions. They are trained and published on DrivAerML. PINNeAPPle already has MeshGraphNet parity work against PhysicsNeMo (#228, #230, #232) and a PhysicsNeMo backend issue (#75). Plan 1. Run the \u2026"},{"n":408,"t":"NVIDIA Earth-2: score Earth2Studio models (FourCastNet/SFNO, CorrDiff, StormCast) with the PINNeAPPle trust horizon","l":["priority: P3"],"m":"v0.9.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context NVIDIA Earth-2 (Earth2Studio and PhysicsNeMo) ships pretrained weather and climate models: \u00b7 global forecasters (FourCastNet / SFNO and others exposed by Earth2Studio); \u00b7 CorrDiff, generative diffusion downscaling to km scale; \u00b7 StormCast, a km-scale convection-allowing emulator; \u00b7 cBottle, a climate generative model. PINNeAPPle's weather work (pinneapplephysics.weather, #322, #323) measures how many days a \u2026"},{"n":407,"t":"WindsorML plus one loader and benchmark across Ashton's AhmedML, DrivAerML and WindsorML","l":["priority: P2"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context Neil Ashton (AWS) and co-authors released three open automotive CFD datasets with the same file structure and a permissive licence (CC-BY-SA), built for ML research: \u00b7 AhmedML: 500 Ahmed-body variants, hybrid RANS-LES in OpenFOAM, about 20 M cells (arXiv:2407.20801). Tracked in #241. \u00b7 DrivAerML: 500 morphed DrivAer cars, hybrid RANS-LES, on the order of 140-160 M cells. Tracked in #247. \u00b7 WindsorML: 355 \u2026"},{"n":406,"t":"Rarefied gas dynamics with PINN-TFC: BGK thermal creep and Poiseuille flow across Knudsen numbers (De Florio et al.)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context Micro-channels, vacuum systems, MEMS and high-altitude flight leave the continuum regime, where Navier-Stokes fails. In the BGK approximation of the Boltzmann equation, De Florio, Schiassi, Ganapol and Furfaro solved two problems with PINN-TFC (shallow networks with Chebyshev or Legendre bases) and matched the published benchmarks: \u00b7 Physics-informed neural networks for rarefied-gas dynamics: thermal creep \u2026"},{"n":405,"t":"Pontryagin and Bellman neural networks: physics-informed optimal control and guidance (Schiassi, D'Ambrosio, Furfaro)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context Physics-informed networks can solve optimal control problems directly: \u00b7 Pontryagin Neural Networks (PoNN): the Pontryagin Minimum Principle turns the problem into a two-point boundary value problem for state and costate, which is solved with X-TFC or PINNs. \u00b7 Schiassi, Calabr\u00f2, De Falco, Pontryagin Neural Networks for the Class of Optimal Control Problems With Integral Quadratic Cost, Aerospace Research \u2026"},{"n":404,"t":"X-TFC: reproduce the Schiassi et al. benchmarks and extend the solvers beyond heat/Burgers","l":["priority: P2"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":403,"s":0,"a":false,"x":"Context X-TFC (Schiassi, Leake, De Florio, Johnston, Furfaro, Mortari) combines two ideas: \u00b7 the Theory of Functional Connections, whose constrained expressions satisfy the boundary and initial conditions exactly; \u00b7 a single-layer network with fixed random hidden weights (Extreme Learning Machine). Training therefore reduces to (iterative) least squares, which gives high accuracy in milliseconds to seconds. Papers: \u2026"},{"n":403,"t":"Related work to build on: X-TFC line (Schiassi, De Florio, Furfaro, Mortari), Ashton's open CFD datasets, NVIDIA PhysicsNeMo / Earth-2","l":["priority: P3"],"m":"v0.8.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":9,"a":false,"x":"Why Several research lines map directly onto what PINNeAPPle does. Reproducing their published results inside the library does three things: \u00b7 validates our implementations against numbers the community already trusts; \u00b7 gives the trust layer real benchmarks; \u00b7 builds bridges to the groups and tools behind them. This epic tracks them. Each sub-issue reproduces published results first, then adds what PINNeAPPle \u2026"},{"n":401,"t":"Exoplanet discovery with the Hilbert-Huang transform: adaptive detrending of stellar variability, then a physics transit search","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":386,"s":0,"a":false,"x":"Idea A transit is a dip of 0.01-1 % lasting a few hours. The star underneath is not stationary: \u00b7 spots rotating in and out (days to weeks); \u00b7 spot evolution; \u00b7 pulsations and granulation; \u00b7 flares; \u00b7 instrument drifts and gaps. Detrending is the step that decides whether a small planet survives. Fixed-window filters and stationary Gaussian processes assume a timescale or a stationarity the star does not respect. \u2026"},{"n":400,"t":"From inverse models to equations: distil trained PINNs, neural ODEs and operators into verified symbolic laws","l":["priority: P2"],"m":"v0.8.0","c":1,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":1,"a":false,"x":"Idea An inverse model (a PINN with an unknown term, a neural ODE, a neural operator fitted to data) learns a law but hides it in weights. The next step is to read it out as an equation a scientist can check, publish and reuse in a solver. Then the equation itself becomes a hypothesis to verify, not just a curve fit. The library already has pieces of this in pinneappleanalysis/inverseproblems/missingterm.py: \u00b7 \u2026"},{"n":399,"t":"Black-hole weather forecasting: reproduce Duarte, Nemmen & Navarro and add a trust horizon, physics residuals and MHD","l":["priority: P3"],"m":"v0.7.0","c":1,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Roberta Duarte, Rodrigo Nemmen and Jo\u00e3o Paulo Navarro trained a convolutional network on hydrodynamic simulations of radiatively inefficient accretion flows (RIAFs) around a black hole. The network forecasts the turbulent flow about four orders of magnitude faster than the fluid solver on 200 CPU cores. They called it \"black hole weather forecasting\", and their own framing asks what the weather work in \u2026"},{"n":398,"t":"Planetary rovers on regolith: traversability and slip on the Moon and Mars (terramechanics in low gravity)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Rovers get stuck in soft sand (Spirit, 2009) because regolith behaves differently in low gravity and vacuum. The field-robot traversability issue (#333) goes off-world: \u00b7 Bekker/Wong-Reece terramechanics with Moon and Mars gravity and regolith parameters; \u00b7 slip and sinkage predicted from orbital and onboard imagery; \u00b7 the trust layer flags terrain the model has not seen. Plan \u00b7 Data: \u00b7 HiRISE / LRO NAC terrain \u2026"},{"n":397,"t":"Low-thrust and multi-flyby trajectory design with evolutionary search (GTOC-style problems)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Interplanetary trajectory design (sequences of gravity assists, low-thrust spirals) is a global optimisation problem with many local optima and discrete choices (which planet to fly by). This is where evolutionary methods shine, and where gradients alone fail: \u00b7 differential evolution; \u00b7 CMA-ES; \u00b7 NSGA-II for propellant against time of flight; \u00b7 quality-diversity (#354) for a family of different missions. ESA's \u2026"},{"n":396,"t":"Spacecraft thermal design: radiative heat with PINN surrogates over the orbit, for CubeSats","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea A satellite's temperature swings with every orbit: sun and eclipse, Earth albedo and infrared, internal dissipation. Thermal design normally needs many slow thermal-network runs. A PINN or neural operator surrogate of the conduction + radiation problem, parametrised by: \u00b7 orbit (beta angle, altitude); \u00b7 attitude; \u00b7 coatings (absorptivity and emissivity); \u00b7 power, lets the engineer explore designs in seconds. \u2026"},{"n":395,"t":"Spacecraft telemetry: anomaly detection and attitude faults (reaction wheels, sensors) on public ESA and NASA benchmarks","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Spacecraft operators watch thousands of telemetry channels. Most anomaly detectors are purely statistical and raise many false alarms. Physics models of the subsystems help separate a real fault (a reaction wheel losing torque) from a telemetry glitch: \u00b7 attitude dynamics: Euler's equations with wheel momentum; \u00b7 the power balance; \u00b7 thermal nodes. It is the drone flight-safety problem (#335) in orbit. Plan \u00b7 \u2026"},{"n":394,"t":"Powered descent and landing: guidance with physics-verified model switching (engine-out, wind, sloshing)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Landing a rocket stage or a lunar lander is a model predictive control problem with hard constraints: \u00b7 glide slope; \u00b7 thrust bounds; \u00b7 the final touchdown state. Convex guidance (G-FOLD style, A\u00e7\u0131kme\u015fe & Blackmore) solves it with a nominal model. In flight the model changes: an engine out, propellant sloshing, gusts, mass uncertainty. This is the robotics model predictive control issue (#331) in its most \u2026"},{"n":393,"t":"Atmospheric reentry: hypersonic heating and heat-shield ablation, trajectory with a trust envelope","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea A capsule entering at 7-11 km/s is a coupled problem: \u00b7 trajectory (drag, lift, gravity); \u00b7 stagnation-point heating (Sutton-Graves / Fay-Riddell correlations, then CFD where possible); \u00b7 heat-shield response: conduction, pyrolysis and surface recession. The ablator's thermal response is a moving-boundary PDE well suited to PINNs. The trust layer marks where the correlations stop being valid (high altitude \u2026"},{"n":392,"t":"Orbit determination and space traffic: propagation with uncertainty, conjunctions, and drag during geomagnetic storms","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea More than 10,000 active satellites share low Earth orbit. Collision avoidance needs each orbit's uncertainty propagated forward, and the dominant uncertainty in LEO is atmospheric drag. Drag jumps during geomagnetic storms, which is how about 38 Starlink satellites were lost in February 2022. That links directly to the space-weather issue. Plan \u00b7 Data (public): CelesTrak TLEs and SupGP ephemerides, SGP4 \u2026"},{"n":391,"t":"Transients: supernova light curves with physics templates, for the Rubin Observatory alert stream","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea The Vera C. Rubin Observatory will issue millions of alerts per night. Classifying and forecasting transients from a few early points decides which ones get follow-up spectra. The physics of each class (radioactive decay of nickel-56 and cobalt-56 in Type Ia, shock cooling and plateaus in Type II, kilonova models) gives templates that generalise better than pure classifiers. Bogus alerts (artefacts, satellites, \u2026"},{"n":390,"t":"Black-hole imaging and strong lensing: physics-constrained inverse problems with uncertainty","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Two inverse problems where physics constraints decide what an image can mean. 1. Black-hole imaging (Event Horizon Telescope) Interferometric data sample the sky's Fourier transform sparsely. Imaging is an ill-posed inverse problem. Physics priors help: \u00b7 a ring shape from photon orbits; \u00b7 brightness asymmetry from Doppler beaming; \u00b7 GRMHD-simulation priors. They must be separated from what the data actually \u2026"},{"n":389,"t":"Stellar structure: from Lane-Emden to full stellar models with PINNs, checked against MESA","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea The repo already has a Lane-Emden example (examples/runslaneemden). The next step is the full structure equations of a star: \u00b7 hydrostatic equilibrium; \u00b7 mass continuity; \u00b7 energy generation by the pp-chain and CNO cycle; \u00b7 radiative or convective transport, with a real equation of state and opacities. These are stiff, coupled ODEs with a free boundary: a demanding PINN benchmark with a gold-standard reference \u2026"},{"n":388,"t":"Cosmology emulators: neural operators for structure formation, with a trust layer for parameters outside the training range","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Cosmological simulations (dark matter + baryons) are too expensive to run for every set of cosmological parameters. Emulators (neural operators, U-Nets) map parameters and initial conditions to the density field or the power spectrum in seconds. They are only valid inside the parameter space they were trained on, and they can break subtly (mass conservation, the large-scale power spectrum). Plan \u00b7 Data: CAMELS \u2026"},{"n":387,"t":"Galaxy rotation curves and dark matter: physics-informed mass models on SPARC","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea Galaxies rotate too fast at large radii for their visible mass: the classic evidence for dark matter, or for modified gravity (MOND). With a rotation curve, the question \"which mass model is right for this galaxy\" is a model-selection problem with clear physics: Poisson's equation and the circular velocity v\u00b2 = r \u2202\u03a6/\u2202r. Plan \u00b7 Data: SPARC (175 galaxies, Spitzer photometry + HI/H\u03b1 rotation curves; public). \u00b7 \u2026"},{"n":386,"t":"Exoplanet transits: physics transit model + stellar variability + instrument checks on TESS/Kepler light curves","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":1,"a":false,"x":"Idea A transiting planet dims its star by a fraction set by geometry (the Mandel-Agol model with limb darkening). Real light curves mix that with: \u00b7 stellar variability (spots, granulation, flares); \u00b7 instrument systematics (momentum dumps, scattered light). Telling a real transit from a systematic is the \"regime change or sensor noise\" question. Plan \u00b7 Data: TESS and Kepler light curves from MAST (public, no \u2026"},{"n":385,"t":"Space weather: from solar images to geomagnetic storm forecasts with a trust horizon","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":384,"s":0,"a":false,"x":"Idea A solar eruption becomes a geomagnetic storm at Earth 1-4 days later. It disturbs power grids, GNSS and satellites: in February 2022, about 38 Starlink satellites were lost to drag after a minor storm. The chain is physics: 1. flare and CME onset from solar images; 2. solar-wind propagation to L1 (a ballistic model or a WSA-Enlil-style surrogate); 3. measured L1 plasma and field; 4. a coupling function to the \u2026"},{"n":384,"t":"Astronomy, astrophysics and astronautics: physics AI that knows when to trust it, from the Sun to orbit","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":17,"a":false,"x":"Space is the ideal ground for PINNeAPPle's edge: \u00b7 the physics is well known; \u00b7 the public data is excellent (NASA, ESA, MAST, JSOC, CelesTrak, GWOSC); \u00b7 instruments have glitches and systematics that must be told apart from real signals; \u00b7 many decisions (collision avoidance, storm warnings) need a forecast with a stated horizon. Sub-issues follow. Related science-fiction showcases already open: tidally locked \u2026"},{"n":382,"t":"Sci-fi showcase: listening to black holes, gravitational waves from public LIGO data","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture Two black holes spiralling into each other (a render), with the real strain signal from LIGO underneath and the \"chirp\" played as sound. Real physics \u00b7 Public strain data from GWOSC (open; e.g. GW150914). \u00b7 Matched filtering against waveform templates (post-Newtonian inspiral, plus an open waveform model). \u00b7 A physics-informed model of the chirp (frequency evolution set by the chirp mass) fitted with \u2026"},{"n":381,"t":"Sci-fi showcase: planetary defence, deflecting an asteroid and how far ahead the impact can be trusted","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture An asteroid's orbit drawn as an uncertainty cloud that grows over years. A kinetic impactor (as in DART) nudges it, and the cloud's intersection with Earth's position shrinks to zero. A trust bar shows how far ahead the \"miss\" can be guaranteed. Real physics \u00b7 N-body orbital integration (Sun, planets, Moon), with Yarkovsky and solar radiation pressure as uncertain parameters. \u00b7 Momentum transfer with the \u2026"},{"n":380,"t":"Sci-fi showcase: flying on other worlds, one drone design on Earth, Mars and Titan","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture The same small rotorcraft shown flying in three atmospheres: on Mars it needs huge, fast blades (like Ingenuity); on Titan it flies easily (dense air, low gravity, as planned for Dragonfly). Real physics \u00b7 Rotor performance with BEMT and low-Reynolds airfoil data (#270), and OpenFOAM rotating-frame runs at each world's density, viscosity, speed of sound and gravity. \u00b7 Power required, tip Mach limits and \u2026"},{"n":379,"t":"Sci-fi showcase: weather inside an O'Neill cylinder (clouds that fall sideways)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture The inside of a rotating space habitat (an O'Neill cylinder): air heated on the \"ground\" rises toward the axis, where gravity vanishes, and clouds and thermals curve because of the Coriolis force. Real physics Buoyancy-driven flow in a rotating frame, with artificial gravity \u03c9\u00b2r increasing with radius, Coriolis and centrifugal terms, and heat sources on the inner surface. OpenFOAM in a rotating reference \u2026"},{"n":378,"t":"Sci-fi showcase: a fusion tokamak, the plasma equilibrium and the instability seen before the disruption","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A cross-section of a tokamak plasma with its magnetic flux surfaces. The shape evolves; before a disruption the physics residual climbs and a warning appears. Real physics \u00b7 The Grad-Shafranov equilibrium solved with a PINN (a known PINN benchmark), with coil currents as parameters. \u00b7 Vertical instability and disruption precursors from the equilibrium's stability margin. \u00b7 PhysicsEnsemble over \u2026"},{"n":377,"t":"Sci-fi showcase: a space elevator, a 36 000 km cable swaying with the wind and the climber","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A twin3d or Blender scene of a cable from the equator to beyond geostationary orbit. Waves run up and down it when a climber starts or wind gusts hit the lower atmosphere, and a controller damps them. Real physics \u00b7 A tapered cable under gravity and centrifugal load, in the rotating frame (Coriolis on the climber). \u00b7 Material limits: the required specific strength, and why carbon nanotubes or graphene \u2026"},{"n":376,"t":"Sci-fi showcase: an Alcubierre warp bubble, the curvature and where the physics says \"impossible\"","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A 3D render (Blender) of space-time around a warp bubble: the expansion ahead of the bubble, the contraction behind it, and the regions where the energy density the metric needs is negative, highlighted in red. Real physics The Alcubierre metric, with the York time (expansion), and the Einstein tensor computed with symbolic or autograd differentiation (the SymPy \u2192 autograd compiler of \u2026"},{"n":375,"t":"Sci-fi showcase: weather on a tidally locked exoplanet (eternal day side, eternal night side)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A lit globe of a planet locked to its star: a hot day side, a cold night side and the super-rotating jet that carries heat around, as in the TRAPPIST-1 and Proxima b climate papers. The same Earth-2 style animation, on an alien world. Real physics The shallow-water equations on a rotating sphere with day-side forcing (the Matsuno-Gill pattern, the Showman & Polvani 2011 super-rotation mechanism). Solve \u2026"},{"n":374,"t":"Sci-fi showcase: terraforming Mars, a globe warming over centuries","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The picture A Mars globe (earth2gif with Mars topography and colours): the polar caps shrink, the surface warms and the pressure rises as CO2 is released over centuries. A trust bar shortens as the scenario leaves anything measured. Real physics \u00b7 A zonal energy-balance model: insolation with Mars's orbit and obliquity, greenhouse forcing of CO2 and of engineered gases, the albedo of ice against regolith. \u00b7 The CO2 \u2026"},{"n":373,"t":"Showcase: battle of the models, live (FNO vs GraphCast vs PINN vs solver, with a live \"who left its domain first\" scoreboard)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A live arena: several models forecast the same stream of cases. Examples: \u00b7 weather: PINNeAPPle's model, IFS HRES, Pangu-Weather, NeuralGCM (#348); \u00b7 PDE fields: FNO, GNN, PINN, numerical solver. The adaptive ensemble picks in real time. A scoreboard shows error, cost, trust horizon and who left its domain first, with the physics residual as a live \"health bar\" per model. It is the trust benchmark suite (#349) \u2026"},{"n":372,"t":"Showcase: the dam that warns in advance","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A retrospective on a documented tailings-dam failure (#355): satellite deformation (InSAR) and pore pressure feed the slope-stability physics, and the factor of safety falls over months. The alarm states its lead time and confidence, and that a stable dam nearby stays green (no false alarm). This needs to be told carefully and respectfully: the point is what monitoring can do, with honest limits on what could and \u2026"},{"n":371,"t":"Showcase: thermography, seeing the invisible defect","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A board or chip package heats up after a flash; the IR camera sees only a smooth surface. The inverse heat equation (#330) reveals a hidden delamination underneath, as a defect map with uncertainty, revealed frame by frame as the heat diffuses. Second beat: a reflection on the surface would fool a pure image model; the energy-balance check flags it as a measurement artefact. This answers the semiconductor and \u2026"},{"n":370,"t":"Showcase: the robot arm that does not spill the glass","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"In MuJoCo, an arm carries a glass that is being filled, so its mass and its sloshing change. \u00b7 With the trust layer (#331): the physics residual sees the payload change on the first steps; the controller switches dynamics models, shortens its planning horizon while uncertain, and carries the glass without spilling. \u00b7 Next to it: model predictive control with a fixed model overshoots and spills. A second beat: a \u2026"},{"n":369,"t":"Showcase: an aircraft designed in an afternoon (requirements in plain language \u2192 optimisation \u2192 CFD \u2192 cinematic render \u2192 trust)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"The aircraft design pieces already exist: \u00b7 the parametric airliner and airframe (pinneappledesign.aero); \u00b7 NSGA-II on surrogates; \u00b7 OpenFOAM 3D verification; \u00b7 Blender Cycles renders and the three.js viewer (apps/aerooptimizer). The showcase is the story in one video: 1. requirements typed in plain language (\"120 seats, 3000 km, short runway\"); 2. the design space explored (quality-diversity map, #354), and the \u2026"},{"n":368,"t":"Showcase: from a phone video to the river's discharge","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A 20-second video filmed from a bridge, turned into: 1. surface velocity vectors drawn over the video (LSPIV); 2. the velocity inside the water across the section (PINN); 3. the discharge with its uncertainty band, compared with the gauge reading. The story: \"any phone becomes a gauging station\", for ungauged streams in a flood (RS 2024). Built on #329 (and #336 for the drone-view version). Deliverables: a \u2026"},{"n":367,"t":"Showcase: the drone that knows it is broken","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"A simulated quadrotor (MuJoCo or a 6-DoF model) loses part of a propeller mid-flight; later its GPS glitches. On screen, next to the 3D flight: \u00b7 the physics residual jumps within a few hundred milliseconds; \u00b7 the diagnosis panel says \"motor 3 at ~70 % thrust\" (not \"GPS\"); \u00b7 the controller switches to the degraded-rotor model and lands safely; \u00b7 when the GPS glitch comes, the measurement check says \"sensor fault\" \u2026"},{"n":366,"t":"Showcase: from the satellite to the street, a hurricane end to end on one globe","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":344,"s":0,"a":false,"x":"One continuous animation on the Earth-2 style globe (earth2gif), each stage with its trust bar: 1. Now. GOES imagery of the storm (#264). 2. Next hours. The satellite nowcast. 3. Next days. The global model's track and intensity (#322/#323), next to IFS HRES and Pangu. 4. Landfall. Rain, river discharge and flood extent (operational hydrology chain, #327). 5. The street. A twin3d scene of the flooded neighbourhood \u2026"},{"n":365,"t":"Additive manufacturing: melt-pool thermography \u2192 defect predicted before the part is finished","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea In laser powder-bed fusion, the melt pool's thermal signature (from an IR or high-speed camera) predicts porosity, lack of fusion and keyholing layer by layer. A thermal model gives the expected melt-pool size and cooling rate per scan vector (Rosenthal, or a PINN or FEM surrogate), and the measured signature is compared with it. A residual that leaves the in-domain level marks a regime change (keyhole, \u2026"},{"n":364,"t":"Maritime and offshore: wave forecasting, ship and platform motion, mooring loads","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Offshore operations (very present in Brazil) depend on the sea state and on how ships and platforms respond to it. Plan \u00b7 Waves. Significant wave height and period from ERA5 wave fields (in ARCO/WeatherBench2), forecast with the weather model's winds plus a learned or physics wave model, with horizon. \u00b7 Response. Response amplitude operators and a learned correction for ship motion; mooring-line tension from \u2026"},{"n":363,"t":"Biomechanics and sport from video: pose + Lagrangian dynamics \u2192 joint forces and loads","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Pose estimation from ordinary video gives joint positions; the Lagrangian networks of the robotics issue (#332) and inverse dynamics give joint torques and loads. Uses: injury-risk screening, technique coaching, ergonomics at work. Very visual, and it reuses perception (#328) and robotics. Plan \u00b7 Data: open motion-capture datasets with force plates (e.g. public biomechanics sets; check licences), plus pose from \u2026"},{"n":362,"t":"Health (later stage): hemodynamics from 4D-flow MRI with PINNs, pharmacological models with regime changes","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea High value, but sensitive data and regulation, so it is an area to enter after the trust layer and security pieces mature (pinneapplesecurity already maps LGPD/GDPR and 21 CFR Part 11). 1. Hemodynamics. 4D-flow MRI gives noisy, low-resolution velocity in vessels; a Navier-Stokes PINN recovers pressure and wall shear stress with uncertainty. Open benchmarks: public phantom and aneurysm datasets (check licences \u2026"},{"n":361,"t":"Power grids: frequency dynamics with variable renewables, model switching under contingencies","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea As inverter-based generation grows, grid inertia drops and frequency dynamics change regime (which machines are online, grid-forming against grid-following inverters). The swing equation and its multi-machine version are clear physics. Physics-informed and learned surrogates speed up stability assessment, and the trust layer says when a surrogate no longer represents the grid. Plan \u00b7 Benchmarks: IEEE 9/39-bus \u2026"},{"n":360,"t":"Landslides: accumulated rain + slope stability + InSAR deformation, alarms by municipality","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Landslides in Brazil's coastal ranges (Serra do Mar, Petr\u00f3polis 2022, S\u00e3o Sebasti\u00e3o 2023) follow intense or accumulated rain on steep, saturated slopes. The physics combines: \u00b7 infiltration (Green-Ampt / Richards) giving pore pressure; \u00b7 pore pressure in an infinite-slope factor of safety per terrain cell; \u00b7 with deformation from InSAR as an independent check. Plan \u00b7 Data: rainfall (ERA5 or the weather model, \u2026"},{"n":359,"t":"Operational hydrology chain: forecast rain \u2192 river discharge \u2192 flood extent, with a trust horizon at every link","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Join pieces that are being built separately into the chain civil defence needs: 1. rain from the weather model (#322/#323) and the nowcast (#264); 2. a rainfall-runoff model, physics (e.g. a GR4J-style conceptual model, or a distributed one) plus a learned correction, giving discharge at gauges; 3. river routing (Muskingum-Cunge, or a shallow-water surrogate) and the flood extent (#262, with the terrain of \u2026"},{"n":358,"t":"Oil, gas and CO2 storage: fast reservoir surrogates, pressure monitoring and pipeline leak detection","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Ideas 1. Reservoir surrogates. Neural operators (FNO, U-FNO) for multiphase flow in porous media, trained on open simulators (OPM Flow, GPL: run it as an external tool and do not copy code). The trust layer says when a well-control scenario is outside the training envelope. Benchmarks: SPE10 and the CO2 storage cases of the literature. 2. CO2 storage monitoring. Pressure and plume-front forecasts with assimilation \u2026"},{"n":357,"t":"Air quality: pollutant dispersion with low-cost noisy sensors (advection-diffusion + measurement checks)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Cities install cheap PM2.5/NO2 sensors that drift, saturate with humidity and fail. Telling a real pollution episode from a sensor problem is the same question as the ensemble's \"regime change or noise\", with clear physics: advection-diffusion with sources and deposition, wind from the weather model. Plan \u00b7 Data: OpenAQ (open API), reference stations, and low-cost networks (PurpleAir data terms: check). \u00b7 \u2026"},{"n":356,"t":"Methane from space: plume detection (Sentinel-5P / Sentinel-2) and emission-rate inversion with plume physics","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Methane super-emitters (landfills, oil and gas, cattle, coal) are visible from orbit. TROPOMI on Sentinel-5P sees regional enhancements; Sentinel-2 SWIR bands see large point-source plumes. The emission rate comes from inverting a transport model: \u00b7 integrated mass enhancement (IME), with wind from ERA5 or the weather model; \u00b7 or a Gaussian-plume / advection-diffusion PINN. Plan \u00b7 Data: Sentinel-5P L2 CH4 and \u2026"},{"n":355,"t":"Tailings dams: InSAR deformation + piezometers + slope stability, alarms with a trust horizon and sensor checks","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Tailings-dam failures (Mariana 2015, Brumadinho 2019) gave signs before failing: surface deformation, rising pore pressure. The physics links them: \u00b7 seepage (Darcy) to pore pressure; \u00b7 pore pressure to effective stress; \u00b7 effective stress to the factor of safety (limit equilibrium), with creep and acceleration (Fukuzono inverse-velocity) before failure. Plan \u00b7 Data: Sentinel-1 InSAR deformation time series \u2026"},{"n":354,"t":"Quality-diversity search (MAP-Elites): diverse designs, and automatic discovery of the cases where a physics model fails","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Why Optimisers return one design, or a Pareto front. Quality-diversity (MAP-Elites, CMA-ME) returns the best design in every cell of a behaviour space (e.g. \"drag \u00d7 lift \u00d7 volume\"), which matters in two places: 1. Design exploration and data generation. A map of diverse, high-performing heat sinks, airfoils or fins shows the engineer the trade-off space at a glance. It is also a far better training set for \u2026"},{"n":353,"t":"Genetic-programming symbolic regression for closures and missing terms, checked against SINDy and physics constraints","l":["priority: P2"],"m":"v0.8.0","c":1,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Why a genetic method here SINDy (pinneappleneural.architectures.rom.sindy) and the missing-term inverse problem (pinneappleanalysis.inverseproblems.missingterm) need a library of candidate terms chosen in advance. Genetic programming searches the space of expressions itself: products, ratios, powers, special functions. It finds interpretable closures (wall models, drag laws, reaction rates, damage laws) that the \u2026"},{"n":352,"t":"Experiment design and sensor placement: where to measure next to shrink uncertainty fastest (including evolutionary placement)","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea Where should the next sensor go, or which test should run next, to reduce the uncertainty that matters (of a quantity of interest, or of the trust horizon) the fastest? It uses the uncertainty already in pinneappleanalysis, and the decision layer (pinneappledecision) that picks the next experiment under hard constraints. Scope \u00b7 Criteria: \u00b7 expected information gain; \u00b7 reduction in the variance of a quantity of \u2026"},{"n":351,"t":"Generic event scoring: lead time of detection, peak and position error, false alarms, for any kind of event","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea The weather case studies score an event by how many days ahead it was well forecast (examples/weatherforecasting/runusecases.py). The same questions apply to a thunderstorm, a motor failure, a battery's knee, structural damage and a flood. Turn this into a library piece. API sketch Scope \u00b7 Event kinds: threshold exceedance, extremum (min/max in a region), onset or change-point, and moving feature (track). \u00b7 \u2026"},{"n":350,"t":"Embedded execution for drones and robots: export model + residual check + measurement check to ONNX, tens of Hz on an embedded CPU","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea The physics residual is cheap, which is what lets trust fly. Export the dynamics model, its residual and the measurementcheck as one ONNX graph (or TorchScript), with a small C/C++ or Python runtime that a flight controller or robot computer can call at 50-200 Hz. Scope \u00b7 Export of PhysicsEnsemble experts plus the residual function and the measurement checks, with a fixed-size state and no Python control flow \u2026"},{"n":349,"t":"Trust benchmark suite: hidden regime changes, sensor faults, slow drift and out-of-domain cases, with a public leaderboard","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea There is no standard benchmark for knowing when a physics model stops being valid. A LinkedIn reviewer of the ensemble work asked for exactly this (\"validate on real drift\"). Whoever defines the benchmark becomes the reference. Tasks (each with ground truth for when the regime or sensor changed) \u00b7 Hidden regime changes. The five-family stream, with regimes that are not separable by the inputs (a hidden \u2026"},{"n":348,"t":"\"Bring your foundation model, PINNeAPPle verifies it\": wrap pre-trained models as ensemble experts under physics checks","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea Nobody will train a better model from scratch than the large pre-trained ones. The value is in knowing when to trust them. Wrap them as Experts of PhysicsEnsemble, with the same residual, measurement and horizon checks: \u00b7 Satellite: Prithvi (NASA/IBM HLS foundation model, open weights on Hugging Face). \u00b7 Weather: the published forecasts in WeatherBench2 (IFS HRES, Pangu-Weather, GraphCast, NeuralGCM) already \u2026"},{"n":347,"t":"Adaptive fidelity driven by the trust horizon: call the expensive solver only where the fast model stops being trustworthy","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea When the fast model's trust horizon shortens, or its residual leaves the in-domain level, the system calls the expensive solver (OpenFOAM, FEM, a fine numerical scheme) only there and then. The result is fed back: it is used as the answer and it retrains or corrects the fast model. PhysicsEnsemble(costweight=...) and #297 (surrogate in the loop with a verification budget) already point this way. Scope \u00b7 A \u2026"},{"n":346,"t":"Data assimilation with neural models: ensemble Kalman filter and 4D-Var with differentiable surrogates","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea The ensemble chooses and combines models. Assimilation corrects the state of a model as measurements arrive. Operational centres do both, and weather, drones, digital twins and batteries all need it. pinneappleanalysis has dataassimilation and stateestimation, and pinneapplesystems.digitaltwin has EKF/EnKF. This issue makes them work with neural and PINN models as the forecast operator. Scope \u00b7 EnKF / LETKF \u2026"},{"n":345,"t":"Trust layer as a first-class object: pp.trust(model, data) attached to every prediction","l":["priority: P0"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":343,"s":0,"a":false,"x":"Idea Today trust is spread over several places: \u00b7 PhysicsEnsemble (residual lookahead, measurementcheck); \u00b7 pinneapplephysics.weather.evaluate (horizons); \u00b7 pinneappledecision.verifiers; \u00b7 pinneappleanalysis (uncertainty, validation, trust). The proposal is one object that every prediction can carry, and that every consumer reads (twin3d, the apps, certificates, the decision layer): Scope \u00b7 A Trust dataclass and \u2026"},{"n":344,"t":"Showcases: demos that make people stop scrolling (flagships and science fiction with real physics)","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":18,"a":false,"x":"Demos made to be seen, each with real physics, an honest number and a trust statement (\"good up to X\"). Each one is a GIF or video plus a short write-up and a post. Flagships reuse the technical issues of #327; the science-fiction ones push the library into physics nobody can measure, the extreme case of \"how far can the model be trusted\". Flagships \u00b7 From the satellite to the street: a hurricane end to end. \u00b7 The \u2026"},{"n":343,"t":"Core: the shared pieces that make the use cases one product (trust layer, assimilation, adaptive fidelity, benchmarks)","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":11,"a":false,"x":"The application areas of #327 are what users see. What makes them one product, rather than twenty separate examples, is a set of shared pieces in the library core. Sub-issues, in order of value: 1. Trust layer as a first-class object (pp.trust). 2. Data assimilation with neural models (EnKF, 4D-Var). 3. Adaptive fidelity driven by the trust horizon. 4. \"Bring your foundation model, PINNeAPPle verifies it.\" 5. A \u2026"},{"n":341,"t":"Physics verification as a service: check any model's output against conservation laws and return a certificate","l":["priority: P1"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Many teams already use AI surrogates without physics. A small service (library API + HTTP) that takes a model's output plus the problem description, and returns: \u00b7 the conservation residuals (mass, momentum, energy, charge) with where they fail; \u00b7 boundary-condition and positivity violations; \u00b7 the trust horizon or domain where the model's residual stays at its in-domain level; \u00b7 a certificate (JSON + PDF) with \u2026"},{"n":340,"t":"Agriculture: crop water stress from Sentinel-2 + ERA5 with a Penman-Monteith water balance","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Irrigation and yield depend on how much water the crop actually uses. Evapotranspiration comes from Penman-Monteith (radiation, temperature, humidity, wind from ERA5 or the weather model) times a crop coefficient that follows the canopy (NDVI from Sentinel-2). A soil water balance then tells when the crop enters stress. The physics gives a model that holds in seasons and regions without training data, and its \u2026"},{"n":339,"t":"Structural health monitoring: modal identification from video and audio, damage detection with temperature compensation","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Bridges, towers, wind-turbine blades and pipelines change their natural frequencies when damaged, but also with temperature and humidity. pinneappleperception already extracts vibration from audio (audiomodal) and motion from video (PIV / optical flow; phase-based motion magnification is a candidate). The physics question: is a frequency shift damage, an environmental effect or a sensor problem? Plan \u00b7 Modal \u2026"},{"n":338,"t":"Manufacturing: virtual metrology and process-drift monitoring (regime change vs sensor drift)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea This comes from the semiconductor discussion on the ensemble post. In a fab or process plant, operating conditions drift; a model that is good in one regime stops being reliable. The hard part is telling a real process drift from a slowly drifting sensor. Plan \u00b7 Virtual metrology: predict a quality measurement (thickness, critical dimension, yield) from process sensors with an ensemble of models (physics-based \u2026"},{"n":337,"t":"Batteries: physics-informed degradation and remaining useful life, with a trust horizon","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Battery ageing changes regime: SEI growth, then lithium plating or knee-point acceleration, temperature and C-rate changes. The sensors (voltage, current, temperature) drift and glitch. It is the same pair of questions \u2014 regime change or noise, and how far ahead the forecast can be trusted \u2014 on a problem with a clear industry need: EVs, storage and drones. Plan \u00b7 Models: \u00b7 an equivalent-circuit model with \u2026"},{"n":336,"t":"Drones as physical sensors: wind from flight data, aerial river PIV, spray drift and urban wind-aware planning","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea A drone is also a measuring instrument. Four uses that each reuse an existing PINNeAPPle piece: 1. The drone as an anemometer. Its tilt and motor commands while hovering or in cruise give the local wind through the dynamics model, without a wind sensor. Vertical profiles over a site feed the satellite nowcasting (#264) and wind-energy siting. Check against an anemometer mast or the ERA5/weather model. 2. Aerial \u2026"},{"n":335,"t":"Drones: flight safety with physics-verified dynamics (payload, gusts, motor degradation, sensor faults)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea A multirotor's dynamics change during a flight: a payload is picked up or dropped, gusts and ground effect act on it, a propeller is chipped, a motor degrades, the battery voltage sags. Its sensors also fail: GPS glitches, magnetometer interference, IMU vibration. Telling these apart in real time is what keeps a drone flying. It is the same problem as the ensemble's regime change versus sensor noise, with a \u2026"},{"n":334,"t":"Robotics: sim-to-real perception data with pinneapple_worldmodel and a robot digital twin in twin3d","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea pinneappleworldmodel already renders physics simulations into images and video with domain randomisation, and pinneappletwin3d shows a digital twin with sensors and operating envelopes in the browser. Together they can: \u00b7 generate labelled training data for a robot's perception (depth, flow, contact, deformation), with the physics known exactly; \u00b7 show the live robot next to its twin: the active dynamics model, \u2026"},{"n":333,"t":"Robotics: terrain traversability for field robots (vision + Bekker wheel-soil model)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Field robots (agriculture, mining, planetary rovers) get stuck because the soil changes. examples/usecases/terramechanics already has wheel-soil physics. Vision estimates the soil class and moisture ahead of the robot. The Bekker / Wong-Reece model predicts sinkage and slip for each patch, and the ensemble switches soil models when the measured slip leaves the predicted band. Steps 1. Terrain classification \u2026"},{"n":332,"t":"Robotics: system identification with Lagrangian and Hamiltonian networks, and transfer between robots","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Networks that learn a Lagrangian L(q, q\u0307) or a Hamiltonian H(q, p) respect energy and symmetries by construction. They learn dynamics from little data and extrapolate better than black-box networks. Transfer learning (pinneappleadaptation) then moves a model from one robot to a similar one with a few minutes of data. Steps 1. Pendulum, double pendulum and cart-pole with exact solutions; then MuJoCo arms. 2. \u2026"},{"n":331,"t":"Robotics: model predictive control with physics-verified model switching (MuJoCo)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea For a robot, knowing when its dynamics model stops being valid is a safety question: a new payload, contact, a slippery floor, a gust, or a failed sensor. The adaptive ensemble already does this for fields; here it does it for dynamics. \u00b7 Experts: \u00b7 the nominal rigid-body model; \u00b7 the same model with parameters identified online (mass, inertia, friction); \u00b7 a neural residual model trained on logged data; \u00b7 a \u2026"},{"n":330,"t":"Thermography inspection: inverse heat equation from IR images (defects, conductivity, thermal management)","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea An infrared camera sees a surface temperature over time. The heat equation links it to what is inside: a delamination, a void, a change of conductivity, or a hot spot in a power module or an advanced package. A PINN or inverse solver with the IR frames as data recovers a map of the hidden property with uncertainty. The forward model can then say when a measured frame is physically inconsistent (reflections, \u2026"},{"n":329,"t":"River discharge from smartphone video: surface PIV + PINN with uncertainty","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea Small rivers and streams have no gauging station. A short video from a bank or bridge already contains the surface velocity (large-scale PIV, LSPIV). A PINN that solves the open-channel flow completes the velocity below the surface and gives the discharge with an uncertainty. This matters for flood warning: the RS 2024 floods hit many ungauged streams. Steps 1. Surface velocity. pinneappleperception.videopiv \u2026"},{"n":328,"t":"Perception API: images and video as physical observations with uncertainty and provenance","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":327,"s":0,"a":false,"x":"Idea pinneappleperception already turns images, video and audio into physics: PIV velocity fields, geometry from images and modal frequencies from audio. What is missing is one contract that the rest of the library can consume: Scope \u00b7 A PhysicalObservation dataclass: value, standard uncertainty, coordinates and times, units, provenance, and the failed checks. \u00b7 Adapters for the existing PIV (video), image-geometry \u2026"},{"n":327,"t":"Roadmap: new application areas where physics tells when to trust the model","l":["priority: P3"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":27,"a":false,"x":"Why PINNeAPPle's edge is not only predicting, but saying when a prediction can be trusted. It has three parts: \u00b7 the PDE residual flags a model that left its domain (PhysicsEnsemble(residuallookahead=..., residualbaseline=...)); \u00b7 the useful horizon of every forecast (pinneapplephysics.weather.evaluate); \u00b7 the physics check of the reading itself (measurementcheck), which separates sensor noise from a real regime \u2026"},{"n":324,"t":"Weather forecasting: improvements after the first trained model","l":["priority: P2"],"m":null,"c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Ideas to pick up once #322 and #323 are done, in rough order of value. Measure each against the first trained model on the same 2020 cases. \u00b7 Finer grid. Use 128 x 64 (2.8 degrees), also on WeatherBench2. Events such as the 2024 RS floods and tropical cyclones are one or two cells wide on 64 x 32. It costs about 4x the training time; GPU recommended. \u00b7 Longer and richer rollouts. Add a 12-step phase (3 days) and \u2026"},{"n":323,"t":"Weather forecasting: evaluate the trained model, event GIFs and docs page","l":["priority: P1"],"m":"v0.9.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Context This follows #322 (trained model). examples/weatherforecasting/runusecases.py produces everything below from the trained checkpoint. It reuses data shipped in the repo, so nothing has to be fetched again: \u00b7 data/baselines2020.json: scores of persistence, climatology, IFS HRES, Pangu-Weather, Keisler and NeuralGCM on the 122 test forecasts of 2020. \u00b7 data/rsfloods202440.npy: ERA5 states of the 2024 Rio Grande \u2026"},{"n":322,"t":"Weather forecasting: finish training the ERA5 model (rollout phases 2, 4 and 8 steps)","l":["priority: P1"],"m":"v0.9.0","c":0,"cr":"2026-10-10","up":"2026-10-13","p":null,"s":0,"a":false,"x":"Context pinneapplephysics.weather (PR #321) trains a global forecast model on ERA5 (WeatherBench2, 64 x 32 grid, public bucket). Training is split into phases of growing rollout length: 1, 2, 4 and 8 steps of 6 hours. Only phase 1 ran: 15,000 steps, about 2 h on 4 CPU cores, 2-day validation error 0.098. The cloud session that trained it is recycled when idle, so the rollout phases never ran, and those phases carry \u2026"},{"n":316,"t":"Dyson swarm design study: radiation, orbits, statites, structures, mass budget, infrared signature, Pareto front and 3-D scene","l":["enhancement","roadmap","priority: P3","effort: L","area: apps"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context A Dyson sphere (Dyson 1960, Science 131:1667) is a set of structures around a star that captures a large share of its output. It is speculative, but it is a good design-study prototype for the library: it brings together orbital dynamics, radiation, heat transfer, structures, materials budgets, multi-objective optimisation, surrogates, uncertainty and 3-D visualisation, and the infrared waste-heat signature \u2026"},{"n":315,"t":"Spherical Fourier Neural Operator (SFNO) with a torch spherical-harmonic transform, benchmarked against FNO on the sphere","l":["enhancement","roadmap","priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context Planar FNOs on latitude-longitude grids distort near the poles and are not rotation-equivariant on the sphere. The Spherical Fourier Neural Operator (Bonev et al. 2023, \"Spherical Fourier Neural Operators: Learning Stable Dynamics on the Sphere\", ICML, arXiv:2306.03838) replaces the FFT with the spherical-harmonic transform and gives stable long autoregressive rollouts of weather-like dynamics. PINNeAPPle \u2026"},{"n":314,"t":"Differentiable domain decomposition for the geophysics solvers: halo exchange, parallel spectral transform, ensembles","l":["enhancement","roadmap","priority: P2","effort: L","area: core-api"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context 198 covers distribution in general (training, ensembles, sweeps). This issue is the solver side for the geophysics models: domain decomposition with halo exchange, kept differentiable so 4D-Var and training through the solver still work across processes. Scope 1. Decomposition: latitude bands (lat-lon and Gaussian grids), the 6 faces and sub-face tiles of the cubed sphere. 2. Halo exchange through \u2026"},{"n":313,"t":"GCM column physics behind one interface: gray radiation, moist convection, condensation, boundary layer, and learned parameterisations","l":["enhancement","roadmap","priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context A dynamical core alone runs dry, idealised climates. Realistic atmospheres need column physics: radiation, convection, condensation, boundary layer and surface fluxes. In Physics AI these schemes are also the main target for learned parameterisations (replacing or correcting a scheme with a network trained on high-resolution data), so they need a clean, swappable, differentiable interface. Scope 1. \u2026"},{"n":312,"t":"Dynamical cores for the 3-D atmosphere: hydrostatic spectral and cubed-sphere finite-volume, then non-hydrostatic","l":["enhancement","roadmap","priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-09","up":"2026-10-09","p":null,"s":0,"a":false,"x":"Context pinneapplesimulation.geophysics now has a spectral shallow-water model on the sphere with the Williamson et al. (1992) test cases. The next rung of the standard dynamical-core ladder is the 3-D atmosphere: hydrostatic primitive equations first, non-hydrostatic later. A differentiable 3-D core (PyTorch) is what makes the rest useful for Physics AI: 4D-Var through autograd \u2026"},{"n":305,"t":"Aircraft app: re-run the five airliner OpenFOAM cases with a stack of wake planes for the slice-position control","l":["priority: P3","effort: M","area: visualization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The studio viewer now steps through a stack of slices with a position slider (#281): slices that share a group form a stack, and pp.cfd.ExternalFlow samples cross-flow planes at 0.25, 0.5, 1.0 and 1.5 body lengths behind the body (wakeplanes=). The aircraft app (apps/aerooptimizer) uses the same viewer core, but its cached OpenFOAM results in model/cfd3d/.npz were produced before this change. They hold a \u2026"},{"n":299,"t":"When PINNs, when data-driven geometric surrogates: equal-budget benchmark and a method-choice guide","l":["priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-17","p":null,"s":0,"a":false,"x":"Context Physics-informed ML is often equated with PINNs. Industrial Physics-AI products mostly do something else: \u00b7 they generate many low-to-medium-fidelity simulations over a parameterised geometry; \u00b7 they train data-driven surrogates on meshes or point clouds; \u00b7 they optimise on top (MDO). PINNs have their own strong cases: inverse problems with sparse sensors (the Inverse Heat Lab), little or no simulation data, \u2026"},{"n":298,"t":"Generative inverse design: latent geometry models conditioned on target performance, checked by surrogate and solver","l":["priority: P3","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Beyond searching a fixed parameterisation, recent work learns the design space itself from a corpus of shapes: an autoencoder, or a diffusion model over point clouds, SDFs or meshes. New shapes are generated by sampling or optimising in that latent space, conditioned on target quantities (drag, lift, stress, volume). It needs a shape corpus, which the open-data issues provide (#267, #286, #282), and a fast \u2026"},{"n":297,"t":"Surrogate-in-the-loop optimisation with a verification budget: uncertainty-aware acquisition, high-fidelity re-runs and retraining","l":["priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-10","p":null,"s":0,"a":false,"x":"Context Optimising on a surrogate finds the surrogate's errors as readily as good designs. The industrial answer is a loop: \u00b7 search on the surrogate; \u00b7 send the most promising and most uncertain designs to the solver within a fixed budget; \u00b7 add the results to the training data; \u00b7 repeat until the verified optimum stops moving. apps/aerooptimizer does one round of this by hand (tools/verify.py: Pareto designs \u2026"},{"n":296,"t":"MDO with surrogates: OpenMDAO components with autograd derivatives, the airliner problem as reference","l":["priority: P1","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context In industry, design optimisation is multidisciplinary: aerodynamics, structures, weights, propulsion and mission are coupled, constraints come from several disciplines, and gradient-based optimisers are preferred whenever derivatives exist. OpenMDAO (NASA, Apache-2.0) is the open standard for that coupling. PINNeAPPle's optimisation today is NSGA-II with constraint domination, with evaluations from \u2026"},{"n":295,"t":"Simulation campaign runner: thousands of runs with a job queue, retries, caching by geometry hash and cluster backends","l":["priority: P1","effort: M","area: ecosystem"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The data behind a geometric surrogate is a campaign of hundreds to thousands of simulations. Today each app runs its own loop, for example apps/aerooptimizer/tools/generatedataset.py, which ran 436 OpenFOAM jobs in a local process pool. The simulation factory (#152) defines the interfaces (geometry, DOE, solver, dataset writer, QC). This issue is the execution layer underneath, which every campaign needs and \u2026"},{"n":294,"t":"Low-fidelity solver ladder for external flow: VLM/panel, coarse RANS and LBM, with a measured cost-accuracy table","l":["priority: P1","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Large design-space searches rarely use high-fidelity CFD for every sample. They use the cheapest solver that ranks designs correctly, and spend the expensive runs on the few candidates that matter. PINNeAPPle already has the rungs: \u00b7 a compressible vortex lattice with Korn wave drag, strip theory and a drag build-up (pinneappledesign.aero); \u00b7 coarse and medium RANS through pp.cfd.ExternalFlow (PR #240); \u00b7 an \u2026"},{"n":293,"t":"Geometry-agnostic field surrogates: Transolver, GINO and point-cloud baselines behind one interface with MeshGraphNet","l":["priority: P1","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The surrogates used in industrial aerodynamics and structures are learned directly on geometry: a point cloud or mesh of the surface (and sometimes the volume) goes in, and pressure, wall shear, stress or temperature at every point comes out, together with the integrated quantities (drag, lift, peak stress). They are trained on hundreds to thousands of simulations of different shapes, with different meshes \u2026"},{"n":292,"t":"Geometry parameterisation and morphing for design spaces: FFD, RBF morphing and shape modes on STL meshes","l":["priority: P1","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Industrial Physics-AI platforms spend most of their effort before any learning happens. They turn a baseline CAD or STL into a design space that can be sampled thousands of times without breaking the geometry, then run many cheap simulations over it. PINNeAPPle has parametric generators for specific families: \u00b7 CST airfoils and the airliner in pinneappledesign.aero; \u00b7 the Ahmed body and simple shapes in \u2026"},{"n":289,"t":"Patient-specific vessels: Vascular Model Repository geometry with haemodynamics CFD and a wall-shear-stress viewer","l":["priority: P3","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The Vascular Model Repository (Wilson et al. 2013, from the SimVascular project; simvascular.github.io) is an open collection of patient-derived 3D vessel models (aortas, coronaries, cerebral and pulmonary arteries), many with boundary conditions and some with simulation results. It is a rare case of open 3D geometry from a real application, and wall shear stress (WSS) is the quantity clinicians use. Check \u2026"},{"n":288,"t":"Ship hulls: KCS and KVLCC2 open geometries with resistance prediction, a hull-form surrogate and a wave-pattern viewer","l":["priority: P3","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The KRISO Container Ship (KCS) and the KRISO VLCC Tanker (KVLCC2) are open hull forms used in the Tokyo 2015 and Gothenburg 2010 CFD workshops and the SIMMAN benchmarks, with hull offsets and model-test data (resistance, wake, wave elevation) published. They are the equivalent of the Ahmed body for ships. Plan: 1. Rebuild the hulls from the offsets and check displacement and wetted surface against the \u2026"},{"n":287,"t":"Turbomachinery: NASA Rotor 37 transonic axial compressor in OpenFOAM, with blade-row viewer and a learned performance map","l":["priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Rotor 37 is the best-known open test case for transonic axial compressors: the geometry and the measured data (AGARD Advisory Report 355, with the original NASA Lewis test by Moore and Reid) are public, and it has been used in CFD validation for decades. It is the natural open case for fans and compressors, a customer area noted in our CFD notes. Confirm where the geometry tables are redistributed legally \u2026"},{"n":286,"t":"3D shape classification and segmentation benchmarks: ModelNet40, ShapeNet-Part, PartNet and MFCAD++ with overlay viewer","l":["priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Before relying on geometry encoders for physics, we should show they work on the standard 3D learning benchmarks, and keep the encoders consistent between experiments. Aircraft-specific segmentation is in #267; this issue covers the general benchmarks it builds on. \u00b7 ModelNet40 (Wu et al. 2015; Princeton): classification of 40 object categories, the standard point-cloud benchmark. Check the current terms of \u2026"},{"n":285,"t":"Stress fields on real CAD parts: ABC and Fusion 360 Gallery subsets with FE solutions, a surrogate and a stress viewer","l":["priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Most structural surrogates are trained on parametric shapes. Real CAD parts have fillets, holes, thin walls and defects that break those models. Open part collections exist and two are already catalogue entries (abc, fusion360gallery; also mfcad, mfcadpp, niststeppmi). \u00b7 ABC (Koch et al., CVPR 2019): one million CAD models with B-Rep, STEP and meshes. Check the terms of use. \u00b7 Fusion 360 Gallery (Autodesk; \u2026"},{"n":284,"t":"Terrain from NASA and Copernicus elevation data: 3D terrain meshes for wind-flow and flood-routing experiments","l":["priority: P2","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Digital elevation models are open 3D geometry at planetary scale, and they feed two physics problems we already plan: wind over terrain (neighbour of the buildings case, #248) and overland flood routing (the physical check in #262). \u00b7 NASADEM and SRTM (NASA, Earthdata, free login): about 30 m global. \u00b7 Copernicus DEM GLO-30 (ESA, open on the AWS registry): 30 m global, usually cleaner than SRTM. \u00b7 USGS 3DEP \u2026"},{"n":283,"t":"Wind turbine blades: NREL 5 MW and IEA 15 MW open geometry with BEM, OpenFOAM and a blade-surface 3D viewer","l":["priority: P2","effort: L","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Reference wind turbines are published with full geometry tables: the NREL 5 MW (Jonkman et al. 2009, NREL/TP-500-38060) and the IEA Wind Task 37 15 MW (Gaertner et al. 2020, NREL/TP-5000-75698; the IEA repositories hold blade chord, twist, airfoil-thickness and structural data under open licences). The airfoil polars (DU, FFA) are in the same documents. With those, a blade can be built from numbers alone. \u2026"},{"n":282,"t":"Cars at scale: DrivAerNet++ drag regression and surface-pressure prediction with 3D viewer","l":["priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context DrivAerNet++ (Elrefaie et al., NeurIPS 2024 Datasets & Benchmarks; already a catalogue entry, drivaernet) has about 8 000 parametric car designs in several body styles (fastback, notchback, estate), with surface meshes, point clouds, surface pressure and wall shear, drag coefficient, and volumetric fields from RANS runs. It is the largest open set of 3D car geometries with CFD labels. Confirm the licence on \u2026"},{"n":281,"t":"Shared 3D result viewer: extract the aero_optimizer glTF/Three.js viewer and Blender render tools into a reusable pp.viz layer","l":["priority: P1","effort: M","area: visualization"],"m":null,"c":2,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context apps/aerooptimizer (PR #240) has the best 3D result presentation we have: a Three.js viewer (static/viewer3d.js) that loads a glTF airliner and shows surface Cp and Cf, streamlines, symmetry-plane and wake slices, all on the jet scale with a colour bar; plus tools/rendergallery.py and tools/renderairliner.py that produce Blender Cycles renders from the same data (the CFD fields are stored as .npz). Every \u2026"},{"n":280,"t":"Time-series model suite: Monash forecasting repository, Jena weather and electricity data, and UCR classification","l":["priority: P1","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Before the physics-heavy time-series experiments, we need a general reference so that improvements from physics-aware components can be told apart from improvements from a better baseline. \u00b7 Monash Time Series Forecasting Repository (forecastingdata.org; mostly CC BY 4.0, check each dataset): 30 datasets including M3, M4, tourism, traffic, electricity and weather. \u00b7 Jena Climate (Max Planck Institute for \u2026"},{"n":279,"t":"Neural operator classics: FNO Darcy, Burgers and Navier-Stokes (Li et al.) and DeepONet benchmarks, with resolution transfer","l":["priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The Fourier Neural Operator paper (Li et al., ICLR 2021, arXiv:2010.08895; github.com/neuraloperator/neuraloperator) set the standard problems for operator learning: 1D Burgers, 2D Darcy flow on a rough coefficient, and 2D Navier-Stokes in vorticity form at viscosities 1e-3 to 1e-5. DeepONet (Lu et al. 2021, Nature Machine Intelligence) has its own set (antiderivative, diffusion-reaction, Burgers). Both \u2026"},{"n":278,"t":"PINN failure modes: convection, reaction and reaction-diffusion (Krishnapriyan et al.) and NTK-based diagnostics","l":["priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Krishnapriyan et al. (NeurIPS 2021, arXiv:2109.01050) showed that PINNs fail on simple PDEs once the coefficients get large (convection with beta above about 30, reaction, reaction-diffusion), even though the network can represent the solution. Wang, Yu and Perdikaris (arXiv:2007.14527) tied training failure to imbalanced neural-tangent-kernel eigenvalues. Both come with small, cheap, fully reproducible \u2026"},{"n":277,"t":"Reproduce the original PINN papers: Raissi et al. 2019 (Burgers, Schrodinger, Allen-Cahn, KdV, cylinder-wake inverse problem)","l":["priority: P2","effort: M","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Raissi, Perdikaris and Karniadakis (J. Comput. Phys. 378, 2019; arXiv:1711.10561) is the paper every PINN library gets compared with, and the authors' data and code are public (github.com/maziarraissi/PINNs, MIT). The experiments are: \u00b7 continuous-time and discrete-time Burgers (forward); \u00b7 Schrodinger equation (complex-valued, periodic boundary); \u00b7 Allen-Cahn (discrete-time, Runge-Kutta); \u00b7 Korteweg-de \u2026"},{"n":276,"t":"PINNacle: reproduce the 20-PDE PINN benchmark with our solvers and loss-balancing options","l":["priority: P1","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context PINNacle (Hao et al. 2023, arXiv:2306.08827; github.com/i207M/PINNacle) compares more than ten PINN variants on 20 PDEs in the classes Burgers, Poisson, heat, Navier-Stokes, wave, high-dimensional and inverse problems. It reports where adaptive losses, adaptive sampling, domain decomposition and architectural changes help, and where they do not. It is the benchmark that most directly tests the library's core \u2026"},{"n":275,"t":"The Well: run a small-footprint subset (shear flow, Rayleigh-Benard, turbulent radiative layer, active matter) with the reference baselines","l":["priority: P2","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The Well (Ohana et al., NeurIPS 2024 Datasets & Benchmarks, arXiv:2412.00568; github.com/PolymathicAI/thewell) is a collection of 16 physics datasets (about 15 TB in total) with a common HDF5 format and a loader, from biological systems to astrophysics, with FNO, U-Net and related baselines. Licences vary by dataset; check each dataset card before use. Most of it is far too large for our hardware, so this \u2026"},{"n":274,"t":"PDEBench on the real data: 1D Burgers, 2D Darcy, 2D shallow water and compressible Navier-Stokes with PINN, FNO and U-Net baselines","l":["priority: P1","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context PDEBench (Takamoto et al., NeurIPS 2022 Datasets & Benchmarks, arXiv:2210.07182; github.com/pdebench/PDEBench) is the main shared dataset suite for PDE surrogates, with HDF5 files hosted on DaRUS (University of Stuttgart). The catalogue already has the pdebench entry and pinneapplepdb/benchmarks.py re-implements three PDEBench equations against closed-form solutions, but the real datasets and the published \u2026"},{"n":273,"t":"Turbulence data from the Johns Hopkins Turbulence Databases: super-resolution and subgrid closure on isotropic and channel flow","l":["priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context The Johns Hopkins Turbulence Databases (JHTDB, turbulence.pha.jhu.edu) serve open DNS data: forced isotropic turbulence (1024^3), channel flow at several friction Reynolds numbers, boundary-layer transition, and magnetohydrodynamic turbulence. The data is queried through a web service (the pyJHTDB or givernylocal clients), so only the cutouts needed are downloaded. This is the usual ground truth for learned \u2026"},{"n":272,"t":"Classical CFD validation cases: lid-driven cavity (Ghia), backward-facing step (Armaly), pitzDaily and damBreak","l":["priority: P1","effort: M","area: solvers"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context A set of small, thoroughly documented cases with published reference data, to anchor every OpenFOAM and learned-model comparison before the larger benchmarks (#241 to #249). \u00b7 Lid-driven cavity: Ghia, Ghia and Shin (1982) centreline velocity tables at Re 100 to 10 000; the OpenFOAM icoFoam/cavity tutorial as the starting point. \u00b7 Backward-facing step: Armaly et al. (1983) reattachment length against Reynolds \u2026"},{"n":271,"t":"OpenFOAM tutorials as a corpus: benchmark for translating a problem statement into a correct, running case","l":["priority: P1","effort: L","area: benchmark-cost"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Getting from a physical problem description to a correct OpenFOAM case is the main manual cost in CFD. The OpenFOAM tutorials (shipped with OpenFOAM.org and OpenFOAM-ESI, GPL) form a graded, working corpus of several hundred cases across incompressible, compressible, multiphase, heat transfer, combustion and DNS solvers, each with 0/, constant/ and system/ dictionaries. Public work to compare against exists \u2026"},{"n":270,"t":"Small-UAV propeller performance: UIUC propeller database against BEMT and OpenFOAM rotating-frame runs","l":["priority: P3","effort: M","area: solvers"],"m":null,"c":1,"cr":"2026-10-08","up":"2026-10-10","p":null,"s":0,"a":false,"x":"Context The UIUC Propeller Data Site (m-selig.ae.illinois.edu/props/propDB.html) has measured thrust and power coefficients versus advance ratio for many small propellers, with the geometry (chord and pitch distribution) for most of them. It is open, measured and ideal for validating a rotor model. Plan: build three models of the same propeller and compare them with the wind-tunnel data: 1. blade-element momentum \u2026"},{"n":269,"t":"Turbofan prognostics: NASA C-MAPSS and N-CMAPSS remaining-useful-life, plus the IMS bearing run-to-failure data","l":["priority: P2","effort: M","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context Aircraft engines are the most-used open prognostics example, and the data comes from NASA's Prognostics Center of Excellence (PCoE data-set repository). \u00b7 C-MAPSS (Saxena et al. 2008): four sub-datasets of simulated run-to-failure turbofan trajectories with 21 sensors and different operating conditions and fault modes (FD001 to FD004). \u00b7 N-CMAPSS (Arias Chao et al. 2021, Data 6(1):5): a newer, \u2026"},{"n":268,"t":"OpenVSP to VSPAERO to OpenFOAM: multi-fidelity aerodynamic dataset for parametric aircraft","l":["priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c":0,"cr":"2026-10-08","up":"2026-10-08","p":null,"s":0,"a":false,"x":"Context OpenVSP (NASA, openvsp.org) builds parametric aircraft in a script, and ships VSPAERO, a fast vortex-lattice/panel solver. That gives three fidelities for the same geometry at very different cost: 1. analytic or empirical estimates (lifting-line, Raymer-style drag build-up); 2. VSPAERO (seconds per case); 3. OpenFOAM RANS through pp.cfd.ExternalFlow (hours per case). This is a natural test for multi-fidelity \u2026"},{"n":267,"t":"Open 3D aircraft CAD corpus: OpenVSP Hangar, AircraftVerse, ShapeNet airplanes and UIUC airfoils, with part segmentation","l":["priority: P2","effort: L","area: surrogates-optimization"],"m":null,"c"
