<style>
:root {
  --bg: #fbfaf5; --surface: #ffffff; --sunk: #f3f2ea; --fg: #1d2318; --muted: #5b6352; --faint: #8a8f80;
  --line: #e3e2d6; --accent: #c98a0b; --accent-ink: #7a5200; --accent-soft: #f6ead0; --leaf: #3f7d3a;
  --code-bg: #f4f3ea; --kw: #8a3ffc; --str: #2f7a3b; --num: #b0570b; --com: #8a8f80; --fn: #1f5fa8;
  --overlay: rgba(20, 24, 16, 0.35);
  --nav-w: 300px; --toc-w: 230px; --top-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12150f; --surface: #181c14; --sunk: #1d2219; --fg: #ecebdf; --muted: #a3a796; --faint: #7b8072;
    --line: #2b3124; --accent: #f0b43a; --accent-ink: #f6cf7c; --accent-soft: #3a2f14; --leaf: #8fcf7f;
    --code-bg: #1b2017; --kw: #c4a2ff; --str: #8fcf7f; --num: #f0b43a; --com: #7b8072; --fn: #8ab8f0;
    --overlay: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12150f; --surface: #181c14; --sunk: #1d2219; --fg: #ecebdf; --muted: #a3a796; --faint: #7b8072;
  --line: #2b3124; --accent: #f0b43a; --accent-ink: #f6cf7c; --accent-soft: #3a2f14; --leaf: #8fcf7f;
  --code-bg: #1b2017; --kw: #c4a2ff; --str: #8fcf7f; --num: #f0b43a; --com: #7b8072; --fn: #8ab8f0;
  --overlay: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top-h) + 12px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }

code, pre, .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
h1, h2, h3 { font-family: Fraunces, Georgia, serif; line-height: 1.2; text-wrap: balance; }
button { font: inherit; color: inherit; }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; height: var(--top-h); display: flex; align-items: center; gap: 10px;
  padding-inline: 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.burger { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.burger svg { width: 18px; height: 18px; }
.burger[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--fg); min-width: 0; white-space: nowrap; }
.brand b { font: 600 1.05rem Fraunces, Georgia, serif; }
.brand span { color: var(--muted); font-size: 0.85rem; }
.search { flex: 1; max-width: 460px; margin-left: auto; position: relative; min-width: 0; }
.search input { width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 12px 0 34px; font: inherit; color: var(--fg); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search svg { position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; color: var(--faint); }
.results { position: absolute; top: 44px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.12); max-height: 60vh; overflow: auto; padding: 6px; }
.results a { display: grid; gap: 1px; padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--fg); }
.results a:hover, .results a.on { background: var(--sunk); }
.results small { color: var(--muted); font-size: 0.78rem; overflow-wrap: anywhere; }
.results .none { padding: 10px; color: var(--muted); }

/* layout */
.layout { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--toc-w); }
.nav, .toc { position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; }
.nav { border-right: 1px solid var(--line); padding: 14px 10px 40px; background: var(--bg); }
.toc { border-left: 1px solid var(--line); padding: 20px 16px 40px; }
main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 80px; }
.page { max-width: 860px; margin: 0 auto; }
.overlay { display: none; }

/* left navigation */
.nav h4 { margin: 18px 8px 6px; font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.nav h4:first-child { margin-top: 2px; }
.nav details { margin: 0; }
.nav summary { list-style: none; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.nav summary::-webkit-details-marker { display: none; }
.nav summary .chev { width: 14px; flex: none; color: var(--faint); transition: transform .15s; }
.nav details[open] > summary .chev { transform: rotate(90deg); }
.nav .leaf { padding-left: 28px; }
.nav a.item { display: block; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); font-size: 0.92rem; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav summary a.item { padding: 0; }
.nav summary:hover, .nav a.item:hover { background: var(--sunk); }
.nav .on, .nav summary.on { background: var(--accent-soft); }
.nav .on > a.item, .nav a.item.on { color: var(--accent-ink); font-weight: 600; }
.nav .kids { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 4px; }
.nav .kids a.item { font-family: "JetBrains Mono", monospace; font-size: 0.8rem; }
.nav .kids > a.item { padding-left: 28px; }
.page p code, .page li code { background: var(--sunk); padding: 0 4px; border-radius: 4px; font-size: 0.86em; }

/* right toc */
.toc h4 { margin: 0 0 10px; font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.toc a { display: block; padding: 4px 0 4px 10px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; font-size: 0.86rem; line-height: 1.35; }
.toc a.l3 { padding-left: 22px; font-size: 0.8rem; }
.toc a:hover { color: var(--fg); }
.toc a.on { color: var(--accent-ink); border-left-color: var(--accent); }

/* content */
.crumbs { font-size: 0.82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.crumbs a { color: var(--muted); }
.eyebrow { font: 600 0.72rem Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); margin: 6px 0 6px; }
h1 code { font-size: 0.6em; font-weight: 500; color: var(--muted); display: block; margin-top: 6px; font-family: "JetBrains Mono", monospace; overflow-wrap: anywhere; }
.tagline { font-size: 1.12rem; color: var(--muted); margin: 0 0 18px; max-width: 40em; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }
h2 { font-size: 1.5rem; margin: 44px 0 12px; padding-top: 4px; }
h3 { font-size: 1.12rem; margin: 30px 0 10px; }
.page p { max-width: 68ch; }
.page > ul { max-width: 68ch; }
.use { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--leaf); border-radius: 8px; padding: 12px 16px 12px 34px; margin: 0; }
.use li + li { margin-top: 4px; }
.shim { background: var(--accent-soft); border-radius: 8px; padding: 12px 16px; }

.example { margin: 18px 0 30px; }
.example h3 { margin-top: 0; display: flex; gap: 10px; align-items: baseline; }
.example h3 .n { font: 500 0.8rem "JetBrains Mono", monospace; color: var(--accent-ink); flex: none; }
.codebox { position: relative; }
pre { margin: 0; overflow-x: auto; }
pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 0.82rem; line-height: 1.55; }
.copy { position: absolute; top: 8px; right: 8px; font-size: 0.75rem; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.out-label { font: 600 0.7rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 12px 0 4px; display: flex; justify-content: space-between; }
pre.out { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; font-size: 0.78rem; line-height: 1.5; white-space: pre; }
.figs { display: grid; gap: 12px; margin-top: 12px; }
.figs img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.k { color: var(--kw); } .s { color: var(--str); } .m { color: var(--num); } .c { color: var(--com); font-style: italic; } .f { color: var(--fn); }

.mods { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.mods a { display: grid; gap: 3px; align-content: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-decoration: none; color: var(--fg); min-width: 0; }
.mods a:hover { border-color: var(--accent); }
.mods code { font-size: 0.8rem; overflow-wrap: anywhere; }
.mods small { color: var(--muted); font-size: 0.8rem; line-height: 1.4; }
.mods .kind { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }

.sm-tree { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.sm-row { display: grid; grid-template-columns: minmax(120px, 15rem) 2.4rem minmax(0, 1fr); gap: 10px; align-items: baseline;
  padding: 7px 12px 7px calc(12px + var(--d) * 18px); border-top: 1px solid var(--line); text-decoration: none; color: var(--fg); }
.sm-tree > .sm-row:first-child, .sm-tree > .sm-group:first-child > summary > .sm-row { border-top: 0; }
.sm-row:hover { background: var(--sunk); }
.sm-row code { font-size: 0.8rem; overflow-wrap: anywhere; color: var(--accent-ink); }
.sm-kind { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); }
.sm-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.45; }
.sm-desc i { font-style: normal; font-size: 0.7rem; color: var(--faint); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; white-space: nowrap; }
.sm-group > summary { list-style: none; cursor: pointer; }
.sm-group > summary::-webkit-details-marker { display: none; }
.sm-group > summary .sm-row code::before { content: "▸ "; color: var(--faint); }
.sm-group[open] > summary .sm-row code::before { content: "▾ "; }
.note-sm { font-size: 0.85rem; color: var(--muted); margin: -4px 0 10px; }
@media (max-width: 640px) { .sm-row { grid-template-columns: minmax(0, 1fr) auto; } .sm-desc { grid-column: 1 / -1; } }
.sym { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 12px 0; overflow: hidden; }
.sym > header { padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sunk); }
.sym > header .tag { font: 600 0.66rem Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-right: 6px; }
.sym > header code { font-size: 0.84rem; overflow-wrap: anywhere; }
.sym > header code b { color: var(--fn); }
.sym .body { padding: 10px 14px; font-size: 0.9rem; }
.sym .body p { margin: 0 0 8px; }
.sym .meth { border-top: 1px solid var(--line); padding: 8px 0; }
.sym .meth code { font-size: 0.8rem; overflow-wrap: anywhere; }
.sym .meth div { color: var(--muted); font-size: 0.85rem; }
.doc pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; font-size: 0.8rem; margin: 8px 0; }
.doc h5 { margin: 12px 0 4px; font: 600 0.75rem Inter, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.doc code { background: var(--sunk); padding: 0 4px; border-radius: 4px; font-size: 0.86em; }
.doc ul { padding-left: 20px; margin: 6px 0; }
.fields { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
.filter { width: 100%; max-width: 320px; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--surface); color: var(--fg); font: inherit; font-size: 0.88rem; }

.home-groups { display: grid; gap: 22px; }
.grp h3 { margin: 0 0 8px; font-size: 1rem; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.cards a { display: grid; gap: 4px; align-content: start; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--fg); min-width: 0; }
.cards a:hover { border-color: var(--accent); }
.cards b { font-family: Fraunces, Georgia, serif; font-size: 1.02rem; }
.cards small { color: var(--muted); line-height: 1.45; }
.cards .meta { font-size: 0.75rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.loading { color: var(--muted); padding: 30px 0; }
.foot { margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--faint); font-size: 0.82rem; }

/* drawers */
@media (max-width: 1240px) {
  .layout { grid-template-columns: var(--nav-w) minmax(0, 1fr); }
  .toc { position: fixed; right: 0; top: var(--top-h); z-index: 25; width: min(300px, 86vw); background: var(--bg);
    transform: translateX(100%); transition: transform .2s ease, visibility .2s; visibility: hidden; }
  body.toc-open .toc { transform: none; visibility: visible; box-shadow: -12px 0 30px rgba(0,0,0,.12); }
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; left: 0; top: var(--top-h); z-index: 25; width: min(320px, 88vw); transform: translateX(-100%);
    transition: transform .2s ease, visibility .2s; visibility: hidden; }
  body.nav-open .nav { transform: none; visibility: visible; box-shadow: 12px 0 30px rgba(0,0,0,.12); }
  .brand span { display: none; }
}
@media (max-width: 1240px) {
  body.nav-open .overlay, body.toc-open .overlay { display: block; position: fixed; inset: var(--top-h) 0 0 0; z-index: 20; background: var(--overlay); }
}
@media (min-width: 901px) { body.nav-open .overlay { display: none; } body.nav-open.toc-open .overlay { display: block; } }
@media (min-width: 1241px) { #toc-btn { display: none; } }
@media (max-width: 560px) { .brand b { font-size: 0.95rem; } main { padding-top: 20px; } .search input { padding-left: 30px; } }
</style>

<script>
const INDEX = {"groups":[{"id":"foundations","title":"Foundations"},{"id":"physics","title":"Physics and simulation"},{"id":"learning","title":"Learning"},{"id":"trust","title":"Trust and analysis"},{"id":"data","title":"Data"},{"id":"systems","title":"Systems and design"},{"id":"show","title":"Visualisation"},{"id":"workflow","title":"Workflow and infrastructure"},{"id":"frontier","title":"Research modules"},{"id":"legacy","title":"Compatibility shims"}],"packages":[{"name":"pinneapple","group":"foundations","title":"pinneapple","tagline":"The short front door: one import for the most used entry points.","about":["`import pinneapple as pp` gives the shortcuts that most scripts need without remembering which subpackage holds them: solve and compare physics problems, run solvers, train models, render and export results, and `pp.fea` for CalculiX studies built in Python.","Everything it exposes lives in one of the packages below; the shortcut and the full path are the same object, so you can start short and move to the full path when you need the details."],"use_when":["You are writing a script or notebook and want the common entry points.","You want to see what the library covers before choosing a subpackage."],"shim":null,"examples":[{"title":"What the front door exposes","code":"import pinneapple as pp\n\nnames = [n for n in dir(pp) if not n.startswith(\"_\")]\nprint(len(names), \"public names, e.g.:\")\nprint(\", \".join(sorted(names)[:40]))\nprint(\"pp.fea ->\", pp.fea.__name__)","output":"197 public names, e.g.:\nAFNO, ActiveLearningConfig, AdaptiveCollocationTrainer, Backend, BenchmarkConfig, BenchmarkResult, BenchmarkTaskBase, BoxConstraint, CADToCFDPipeline, CFDMesh, CSGCircle, CSGDifference, CSGEllipse, CSGIntersection, CSGPolygon, CSGRectangle, CSGUnion, CauchyMisfit, CausalPINNTrainer, CausalWeightScheduler, ChannelDomain2D, ChannelWithObstacleDomain2D, CollocationConfig, CollocationSampler, Comparison, ComposedObsOperator, CompositeObjective, CompositeRegularizer, ConformalPredictor, ConstraintSet, ContinuousAdjointSolver, DDPPINNTrainer, DDPTrainerConfig, DEFAULT_MODELS, DesignOptConfig, DesignOptLoop, DesignOptResult, DesignOptimizerConfig, DigitalTwin, DigitalTwinConfig\npp.fea -> pinneapple_simulation.external_solvers.calculix.study","figures":[],"seconds":78.3}],"modules":1,"symbols":2,"outline":{"name":"pinneapple","kind":"package","summary":"Physics-Informed Neural Networks for Engineering and Research.","src":"doc","children":[]}},{"name":"pinneapple_core","group":"foundations","title":"Core primitives","tagline":"Domain, Geometry, Mesh and Field: one vocabulary for tensors, geometry and topology.","about":["Physics AI keeps passing the same things around: a region, points sampled in it, values on a grid, a mesh or a point cloud, and derivatives of those values. `pinneapple_core` gives them one interface.","A `Field` answers `gradient()`, `divergence()`, `interpolate(x)` and `integrate()` whatever it is stored on (regular grid, simplex mesh with exact P1 operators, or scattered points with local least squares). `FunctionField` gives the same interface to a torch callable such as a PINN, through autograd. The free functions in `operators` (`grad`, `div`, `curl`, `laplacian`, `integrate`, `flux`) work on all of them."],"use_when":["You need derivatives or integrals of a field and do not want to care how it is discretised.","You are writing a solver, loss or dataset that should accept grids, meshes and point clouds alike."],"shim":null,"examples":[{"title":"Gradient and integral of a field on a grid, checked against calculus","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_core import Field, Domain\n\nx = np.linspace(0, 1, 101); y = np.linspace(0, 1, 101)\nX, Y = np.meshgrid(x, y, indexing=\"ij\")\nu = np.sin(np.pi * X) * np.sin(np.pi * Y)\nf = Field.on_grid([x, y], u, name=\"u\")\n\ng = f.gradient().values.reshape(101, 101, 2)   # (points, component, dim) -> grid\nexact = np.pi * np.cos(np.pi * X) * np.sin(np.pi * Y)\nprint(\"max |du/dx - exact| =\", float(np.abs(g[..., 0] - exact).max()))\nprint(\"integral =\", float(f.integrate()), \" exact 4/pi^2 =\", 4 / np.pi ** 2)\n\nd = Domain.box([0, 0], [1, 1])\npts = d.sample_interior(5, seed=0)\nprint(\"u at random points:\", np.round(f.interpolate(pts), 4))\n\nfig, ax = plt.subplots(1, 2, figsize=(8, 3.4))\nfor a, val, t in [(ax[0], u, \"u = sin(pi x) sin(pi y)\"), (ax[1], np.hypot(g[..., 0], g[..., 1]), \"|grad u|\")]:\n    im = a.pcolormesh(X, Y, val, shading=\"auto\", cmap=\"viridis\"); a.set_title(t); a.set_aspect(\"equal\")\n    fig.colorbar(im, ax=a, shrink=0.85)","output":"max |du/dx - exact| = 0.0010331855701966042\nintegral = 0.405218069547683  exact 4/pi^2 = 0.4052847345693511\nu at random points: [0.6813 0.0067 0.1498 0.7093 0.2006]","figures":["figures/pinneapple_core__0_0.png"],"seconds":1.3}],"modules":14,"symbols":77,"outline":{"name":"pinneapple_core","kind":"package","summary":"Field, Mesh, Domain and Geometry as shared primitives.","src":"doc","children":[{"name":"pinneapple_core.backend","kind":"module","summary":"PhysicsBackend: one array/derivative/solve API over torch, jax and anything registered.","src":"doc","children":[]},{"name":"pinneapple_core.data","kind":"module","summary":"Physics-native data API: PhysicsDataset, DataLoader and the samplers.","src":"doc","children":[]},{"name":"pinneapple_core.domain","kind":"module","summary":"Domain: the region of space a problem lives on.","src":"doc","children":[]},{"name":"pinneapple_core.fem","kind":"module","summary":"Differentiable P1 finite elements on simplex meshes.","src":"doc","children":[]},{"name":"pinneapple_core.field","kind":"module","summary":"Field: values of a physical quantity on a grid, a mesh or a point cloud.","src":"doc","children":[]},{"name":"pinneapple_core.func","kind":"module","summary":"Pp.func: function transforms with scientific semantics, and implicit differentiation.","src":"doc","children":[]},{"name":"pinneapple_core.geometry","kind":"module","summary":"Geometry: a Domain plus named boundaries and a way to mesh it.","src":"doc","children":[]},{"name":"pinneapple_core.loss","kind":"module","summary":"Pp.loss: functional loss terms and a balancer selectable by name.","src":"doc","children":[]},{"name":"pinneapple_core.mesh","kind":"module","summary":"Mesh: simplex meshes (intervals, triangles, tetrahedra) with P1 calculus.","src":"doc","children":[]},{"name":"pinneapple_core.module","kind":"module","summary":"PhysicsModule: composable models and solvers, the nn.Module of physics.","src":"doc","children":[]},{"name":"pinneapple_core.operators","kind":"module","summary":"Physics operators: grad, div, curl, laplacian, jacobian, hessian, integrate, flux.","src":"doc","children":[]},{"name":"pinneapple_core.optim","kind":"module","summary":"PhysicsOptimizer(parameters, objective, constraints): one interface for several optimizer families.","src":"doc","children":[]},{"name":"pinneapple_core.transforms","kind":"module","summary":"Pp.transforms: composable, invertible transforms for tables, datasets and problems, with provenance.","src":"doc","children":[]}]}},{"name":"pinneapple_physics","group":"physics","title":"Physics problems and PINNs","tagline":"Define a physical problem once, solve it with a PINN, a solver or a closed form, and compare.","about":["`pde_environment` describes a problem as a `ProblemSpec`: the PDE terms, the boundary and initial conditions, data constraints and scales, with presets for Navier-Stokes, heat, wave, Burgers, elasticity, Helmholtz and RANS turbulence models. `pinn_solver` compiles a spec into differentiable losses, and `symbolic_pde` turns SymPy expressions into autograd residuals.","Not every engineering question needs a PDE. `closed_form` holds textbook models (fins, beams and fatigue, Helmholtz resonators, heat sinks, PCB thermal) as fast ground truth, and `tribology` solves sliding wear with contact-pressure redistribution. Domain packages (`weather`, `blackhole`, `pcb`) build on the same pieces."],"use_when":["You want a PINN for a known PDE with its boundary conditions written down once.","You need a quick, citable reference value to check a solver or a surrogate against."],"shim":null,"examples":[{"title":"Burgers' equation: a PINN against the Cole-Hopf solution, through one API","code":"import numpy as np\nimport matplotlib.pyplot as plt\nimport pinneapple as pp\n\npinn = pp.solve(\"burgers_1d\", method=\"pinn\", epochs=3000)\nexact = pp.solve(\"burgers_1d\", method=\"analytic\")\ndef trained_pinn(problem, **kw):            # compare() takes method names or callables returning a Solution\n    return pinn\nprint(pp.compare(\"burgers_1d\", methods=[trained_pinn], reference=exact))\n\nx = np.linspace(-1, 1, 400)\nfig, ax = plt.subplots(figsize=(7.5, 3))\nfor t in (0.0, 0.25, 0.5, 0.75):\n    X = np.column_stack([x, np.full_like(x, t)])\n    l, = ax.plot(x, exact.predict(X)[:, 0], lw=2.2, alpha=0.5)\n    ax.plot(x, pinn.predict(X)[:, 0], \"--\", c=l.get_color(), label=f\"t = {t}\")\nax.set_xlabel(\"x\"); ax.set_ylabel(\"u\"); ax.legend(fontsize=7); ax.set_title(\"PINN (dashed) vs Cole-Hopf (solid)\")","output":"Comparison on 'burgers_1d_default' against 'analytic' at 4096 points\nmethod          kind       status     train [s]  infer [us/pt]  ref sims  relL2(u)\ntrained_pinn    neural     ok               142          0.442         0  2.092e-03","figures":["figures/pinneapple_physics__0_0.png"],"seconds":147.9},{"title":"Closed-form engineering checks: cantilever fatigue and a Helmholtz port","code":"from pinneapple_physics.closed_form.cantilever_fatigue import (\n    cantilever_root_bending_stress_pa, basquin_fatigue_life_cycles)\nfrom pinneapple_physics.closed_form.helmholtz_resonator import helmholtz_resonant_frequency_hz, port_volume_m3\n\ns = cantilever_root_bending_stress_pa(width_m=0.02, thickness_m=0.004, load_n=60.0, length_m=0.15)\nprint(f\"root bending stress: {s / 1e6:.1f} MPa\")          # 6 F L / (b t^2)\nlife = basquin_fatigue_life_cycles(s, fatigue_strength_coeff_pa=900e6, fatigue_strength_exponent=-0.09)\nprint(f\"Basquin life at that amplitude: {life:.3g} cycles\")\nf = helmholtz_resonant_frequency_hz(port_radius_m=0.035, port_length_m=0.12, cabinet_volume_l=40.0)\nprint(f\"bass-reflex tuning of a 40 L box with a 70 mm x 120 mm port: {f:.1f} Hz\")","output":"root bending stress: 168.8 MPa\nBasquin life at that amplitude: 5.98e+07 cycles\nbass-reflex tuning of a 40 L box with a 70 mm x 120 mm port: 40.0 Hz","figures":[],"seconds":3.9},{"title":"Sliding wear of a bar end (Archard with pressure redistribution)","code":"import matplotlib.pyplot as plt\nfrom pinneapple_physics.tribology import BarWear, WEAR_MATERIALS\n\nbar = BarWear(WEAR_MATERIALS[\"60/40 brass\"], load_N=50.0)\nres = bar.run(distance_m=400.0, n_save=6)\nprint(f\"specific wear rate K = {bar.material.K:.2e} mm^3/(N m)\")\nprint(f\"worn volume {res['volume'][-1]:.3f} mm^3  vs  K F s = {bar.material.K * 50.0 * 400.0:.3f} mm^3\")\nprint(f\"peak pressure {res['p_max'][0]:.1f} -> {res['p_max'][-1]:.2f} MPa (flat punch F/A = {50 / 200:.2f} MPa)\")\n\nfig, ax = plt.subplots(1, 2, figsize=(8.5, 3.2))\nfor s, p in zip(res[\"s_saved\"], res[\"pressures\"]):\n    ax[0].plot(res[\"x\"], p, label=f\"s = {s:.0f} m\")\nax[0].set_xlabel(\"x along the bar end (mm)\"); ax[0].set_ylabel(\"contact pressure (MPa)\"); ax[0].legend(fontsize=7)\nax[1].plot(res[\"s\"], res[\"p_max\"]); ax[1].axhline(0.25, ls=\"--\", c=\"k\", lw=0.8)\nax[1].set_xlabel(\"sliding distance (m)\"); ax[1].set_ylabel(\"peak pressure (MPa)\"); ax[1].set_yscale(\"log\")\nax[1].set_title(\"running-in to the flat-punch pressure\")","output":"specific wear rate K = 6.32e-04 mm^3/(N m)\nworn volume 12.632 mm^3  vs  K F s = 12.632 mm^3\npeak pressure 6.2 -> 0.27 MPa (flat punch F/A = 0.25 MPa)","figures":["figures/pinneapple_physics__2_0.png"],"seconds":5.2}],"modules":102,"symbols":429,"outline":{"name":"pinneapple_physics 14 part of pinneapple_environment.","src":"doc","children":[]},{"name":"pinneapple_physics.pde_environment.condition_sampling","kind":"module","summary":"Sampling points for conditions whose region is given by a selector function.","src":"doc","children":[]},{"name":"pinneapple_physics.pde_environment.conditions","kind":"module","summary":"ConditionSpec: Generic constraint spec. (+6 more)","src":"auto","children":[]},{"name":"pinneapple_physics.pde_environment.environment_typing","kind":"module","summary":"No public classes or functions.","src":"auto","children":[]},{"name":"pinneapple_physics.pde_environment.presets","kind":"package","summary":"Ready-made problems: academic PDEs, CFD, solid mechanics, structures, industry, astrophysics, turbomachinery.","src":"note","children":[{"name":"pinneapple_physics.pde_environment.presets.academics","kind":"module","summary":"Defines laplace_2d_default, poisson_2d_default, burgers_1d_default.","src":"auto","children":[]},{"name":"pinneapple_physics.pde_environment.presets.astrophysics","kind":"module","summary":"Astrophysics and space-systems problem presets.","src":"doc","children":[]},{"name":"pinneapple_physics.pde_environment.presets.astropy_bridge","kind":"module","summary":"Astropy-backed unit handling and coordinate transforms for astrophysics.","src":"doc","children":[]},{"name":"pinneapple_physics.pde_environment.presets.cfd","kind":"module","summary":"lid_driven_cavity_3d: 3D Lid-Driven Cavity benchmark. (+4 more)","src":"auto","children":[]},{"name":"pinneapple_physics.pde_environment.presets.engineering","kind":"module","summary":"Engineering problem presets.","src":"doc","children":[]},{"name":"pinneapple_physics.pde_environment.presets.industry","kind":"module","summary":"Defines steady_heat_conduction_3d_default, transient_heat_3d_default, linear_elasticity_3d_default, darcy_pressure_only_3d_default and 3 more.","src":"auto","children":[]},{"name":"pinneapple_physics.pde_environment.presets.multidisciplinary",  running, and a skill strip that shows, at ...","src":"doc","children":[]}]}]}},{"name":"pinneapple_simulation","group":"physics","title":"Simulation","tagline":"Numerical solvers, particle dynamics and bridges to OpenFOAM, CalculiX, FEniCS, MATLAB and FMUs.","about":["`numerical_solvers` holds the in-house solvers: finite differences, finite volumes, lattice Boltzmann, spectral and FFT solvers, a 3-D finite-element solver with incompatible-mode hexahedra (`solid_fem`), internal pipe and mixer flow on OpenFOAM (`internal_flow`), DEM particles in a stirred tank (`particles`), and dataset generation for PINNs.","`external_solvers` drives real tools when they are installed (OpenFOAM, CalculiX through `pp.fea`, FEniCS, MATLAB, Modelica/FMU) and degrades gracefully when they are not. `particle_dynamics` has differentiable rigid bodies, MPM and SPH in PyTorch.","Every solver used in the lab is verified on a case with a known answer before its results are used."],"use_when":["You need reference fields or training data from a real solver.","You want an FEA, CFD or particle result scripted from Python."],"shim":null,"examples":[{"title":"3-D cantilever with C3D8I hexahedra, against beam theory","code":"import numpy as np\nfrom pinneapple_simulation.numerical_solvers.solid_fem import box_mesh, SolidFEM, fea_figure\n\nL, W, H, F, E = 2.0, 0.1, 0.2, 1e4, 210e9\nmesh = box_mesh(L, W, H, 40, 3, 6)\nfem = SolidFEM(mesh, E=E, nu=0.3)\nfem.fix(mesh.nodes_on(x=0.0))\nfem.load_face(mesh.face_nodes(\"x+\"), (0, 0, -F))\nres = fem.solve()\n\nI = W * H ** 3 / 12\nG = E / 2.6\ntheory = F * L ** 3 / (3 * E * I) + F * L / (5 / 6 * G * W * H)    # Euler-Bernoulli + shear (Timoshenko)\nprint(f\"tip deflection {res.max_displacement * 1e3:.3f} mm, Timoshenko {theory * 1e3:.3f} mm\")\nprint(f\"max von Mises {res.von_mises.max() / 1e6:.1f} MPa, beam theory at the root {F * L * H / 2 / I / 1e6:.1f} MPa\")\nfig = fea_figure(res, \"von_mises\")","output":"tip deflection 1.911 mm, Timoshenko 1.920 mm\nmax von Mises 31.0 MPa, beam theory at the root 30.0 MPa","figures":["figures/pinneapple_simulation__0_0.png"],"seconds":5.2},{"title":"Pipe-flow correlations used to check the CFD","code":"from pinneapple_simulation.numerical_solvers.internal_flow import colebrook, ito_bend_loss\nfrom pinneapple_simulation.numerical_solvers.particles import StirredTank, terminal_velocity, zwietering_njs\n\nfor Re in (1e4, 1e5, 1e6):\n    print(f\"Re {Re:8.0e}: Darcy f = {colebrook(Re):.4f}, 90 deg bend (R/r = 3) K = {ito_bend_loss(Re, 3.0):.3f}\")\nprint(f\"terminal velocity of a 3 mm, 1200 kg/m3 bead in water: {terminal_velocity(3e-3, 1200.0) * 100:.1f} cm/s\")\ntank = StirredTank(R=0.075, H=0.15)\nprint(f\"Zwietering just-suspended speed: {zwietering_njs(tank, 3e-3, 1200.0, 0.05):.0f} rpm\")","output":"Re    1e+04: Darcy f = 0.0309, 90 deg bend (R/r = 3) K = 0.336\nRe    1e+05: Darcy f = 0.0180, 90 deg bend (R/r = 3) K = 0.227\nRe    1e+06: Darcy f = 0.0116, 90 deg bend (R/r = 3) K = 0.154\nterminal velocity of a 3 mm, 1200 kg/m3 bead in water: 11.0 cm/s\nZwietering just-suspended speed: 336 rpm","figures":[],"seconds":3.4}],"modules":117,"symbols":334,"outline":{"name":"pinneapple_simulation","kind":"package","summary":"Physics simulation back-ends and data generation.","src":"doc","children":[{"name":"pinneapple_simulation.external_solvers","kind":"package","summary":"External tool integrations for PINNeAPPle.","src":"doc","children":[{"name":"pinneapple_simulation.external_solvers.ansys","kind":"package","summary":"ANSYS Fluent live-solver coupling: launches a real fluent batch-mode process (journal-file driven, fluent <precision> -g -i run.jou) and drives an actual simulation, then hands the result off to the ...","src":"doc","children":[{"name":"pinneapple_simulation.external_solvers.ansys.journal_builder","kind":"module","summary":"ANSYS Fluent batch-mode journal (.jou) generation.","src":"doc","children":[]},{"name":"pinneapple_simulation.external_solvers.ansys.runner"," kind":"module","summary":"STL: Seasonal-Trend decomposition using Loess.","src":"doc","children":[]},{"name":"pinneapple_simulation.numerical_solvers.thermal_channel_2d","kind":"module","summary":"Transient 2-D heated-channel CFD: incompressible Navier-Stokes + energy, with time-varying actuators (inlet velocity U_in(t), heater power Q_h(t)).","src":"doc","children":[]},{"name":"pinneapple_simulation.numerical_solvers.tvd_advection","kind":"module","summary":"Second-order TVD (Total Variation Diminishing) upwind scheme for 1D scalar advection, with a van Leer flux limiter.","src":"doc","children":[]},{"name":"pinneapple_simulation.numerical_solvers.vmd","kind":"module","summary":"VMD: Variational Mode Decomposition.","src":"doc","children":[]},{"name":"pinneapple_simulation.numerical_solvers.wavelet","kind":"module","summary":"Wavelet-based decomposition/denoising features.","src":"doc","children":[]},{"name":"pinneapple_simulation.numerical_solvers.xtfc_ivp","kind":"module","summary":"X-TFC (eXtreme Theory of Functional Connections) solver for systems of ODEs posed as initial-value problems: dy_i/dt = f_i(t, y_1, ..., y_n), y_i(t0) = y_i0, t in [t0, tf]","src":"doc","children":[]},{"name":"pinneapple_simulation.numerical_solvers.xtfc_pde","kind":"module","summary":"X-TFC (eXtreme Theory of Functional Connections) solver for 1D-space(+time) PDEs posed on a rectangle x in [x0, x1], t in [t0, tf], with one initial condition (at t=t0) and two Dirichlet boundary ...","src":"doc","children":[]},{"name":"pinneapple_simulation.numerical_solvers.xtfc_subdomain","kind":"module","summary":"Subdomain-chained X-TFC for extremely stiff ODE-IVP systems (target stiffness ratio -- max|eigenvalue(Jacobian)| / min|eigenvalue(Jacobian)| -- roughly 1e10 to 1e14), plus a generic \"extra scalar ...","src":"doc","children":[]}]},{"name":"pinneapple_simulation.particle_dynamics","kind":"package","summary":"Differentiable dynamics simulation for PINNeAPPle.","src":"doc","children":[{"name":"pinneapple_simulation.particle_dynamics.molecular_dynamics","kind":"module","summary":"Molecular dynamics: pairwise Lennard-Jones potential with velocity-Verlet time integration.","src":"doc","children":[]},{"name":"pinneapple_simulation.particle_dynamics.mpm","kind":"module","summary":"Material Point Method (MPM) for soft bodies and fluids.","src":"doc","children":[]},{"name":"pinneapple_simulation.particle_dynamics.particles","kind":"module","summary":"Particle-based simulations: SPH (Smoothed Particle Hydrodynamics) and DEM.","src":"doc","children":[]},{"name":"pinneapple_simulation.particle_dynamics.rigid_body","kind":"module","summary":"Differentiable rigid body dynamics for robot learning and physics coupling.","src":"doc","children":[]},{"name":"pinneapple_simulation.particle_dynamics.terramechanics","kind":"module","summary":"Terramechanics parameter dataclasses for Bekker-Wong wheel-soil interaction.","src":"doc","children":[]}]}]}},{"name":"pinneapple_neural","group":"learning","title":"Neural models","tagline":"Architectures, training and inference: PINNs, neural operators, GNNs and reduced-order models.","about":["`architectures` has the model families behind one registry (`ModelRegistry.build(name, ...)`): PINN networks (MLP, SIREN, modified MLP, Fourier features, hash grids, PINNsFormer), neural operators (FNO, AFNO, DeepONet and multi-scale DeepONet), graph networks (MeshGraphNet, equivariant GNNs) and reduced-order models (POD, DMD, Operator Inference, SINDy, HAVOK, Koopman, parametric POD-RBF/GPR).","`trainer` gives the training loops (two-phase Adam then L-BFGS, time marching, causal weighting, DDP and FSDP), loss balancing (GradNorm, NTK, self-adaptive weights) and callbacks. `predictor` evaluates trained models on grids and draws the results."],"use_when":["You want a surrogate of a solver, or a PINN for a PDE.","You want a reduced-order model of snapshot data with an honest baseline next to it."],"shim":null,"examples":[{"title":"POD + DMD of a travelling wave: compress, then forecast","code":"import numpy as np, torch\nimport matplotlib.pyplot as plt\nfrom pinneapple_neural.architectures.rom import POD, DynamicModeDecomposition\n\nx = np.linspace(0, 2 * np.pi, 256); t = np.arange(0, 12, 0.05)\nU = np.array([np.sin(x - 1.3 * s) + 0.5 * np.sin(3 * x + 2.1 * s) for s in t])   # (T, D)\nX = torch.tensor(U, dtype=torch.float64)\n\npod = POD(r=8).fit(X[:160])\nprint(\"POD energy in 4 modes:\", float(pod.explained_variance_ratio_[:4].sum()))\n\ndmd = DynamicModeDecomposition(r=4, center=False).fit(X[:160])\npred = dmd.rollout(X[159:160], steps=len(t) - 160)[0, 1:]\nerr = torch.linalg.norm(pred - X[160:]) / torch.linalg.norm(X[160:])\nprint(f\"DMD forecast error over {len(t) - 160} unseen steps: {float(err):.2e}\")\nprint(\"DMD frequencies (Hz):\", np.round(np.sort(np.abs(dmd.frequencies(dt=0.05).numpy())), 4))\n\nfig, ax = plt.subplots(1, 2, figsize=(8.5, 3.2), sharey=True)\nax[0].imshow(U[160:], aspect=\"auto\", cmap=\"RdBu_r\", extent=[0, 2 * np.pi, t[-1], t[160]]); ax[0].set_title(\"truth\")\nax[1].imshow(pred.numpy(), aspect=\"auto\", cmap=\"RdBu_r\", extent=[0, 2 * np.pi, t[-1], t[160]]); ax[1].set_title(\"DMD forecast\")\nax[0].set_ylabel(\"t (unseen)\"); [a.set_xlabel(\"x\") for a in ax]","output":"POD energy in 4 modes: 1.0\nDMD forecast error over 80 unseen steps: 1.57e-14\nDMD frequencies (Hz): [0.2069 0.2069 0.3342 0.3342]","figures":["figures/pinneapple_neural__0_0.png"],"seconds":4.6},{"title":"Parametric POD with Gaussian-process uncertainty, against the nearest-design baseline","code":"import numpy as np\nfrom pinneapple_neural.architectures.rom import ParametricPOD, latin_hypercube\n\nx = np.linspace(0, 1, 200)\ndef field(p):                                         # deflection-like response of two design parameters\n    a, b = p\n    return a * np.sin(np.pi * x) + b * x ** 2 * (1 - x)\n\nP, names = latin_hypercube(40, {\"a\": (0.5, 2.0), \"b\": (-1.0, 1.0)}, seed=0)\nXs = np.array([field(p) for p in P])\nPt, _ = latin_hypercube(20, {\"a\": (0.5, 2.0), \"b\": (-1.0, 1.0)}, seed=1)\nXt = np.array([field(p) for p in Pt])\n\ngpr = ParametricPOD(regressor=\"gpr\").fit(P, Xs)\nnear = ParametricPOD(regressor=\"nearest\").fit(P, Xs)\nprint(\"modes kept:\", gpr.rank, \" energy:\", round(gpr.energy_captured, 8))\nprint(f\"median error  POD-GPR {np.median(gpr.error(Pt, Xt)):.2e}   nearest design {np.median(near.error(Pt, Xt)):.2e}\")\n_, std = gpr.predict(Pt[:1], return_std=True)\nprint(\"predictive std available:\", std.shape)","output":"modes kept: 2  energy: 1.0\nmedian error  POD-GPR 4.77e-07   nearest design 7.08e-02\npredictive std available: (1, 200)","figures":[],"seconds":8.6},{"title":"DeepONet: branch net on sensor values, trunk net on query points","code":"import torch\nfrom pinneapple_neural.architectures.neural_operators.deeponet import DeepONet\n\ntorch.manual_seed(0)\nnet = DeepONet(branch_dim=32, trunk_dim=1, out_dim=1, hidden=64, modes=32, depth=3)\nu = torch.randn(8, 32)                        # 8 input functions sampled at 32 sensors\nxq = torch.linspace(0, 1, 100)[:, None]       # 100 query points shared by the batch\ny = net(u, xq).y\nprint(\"output:\", tuple(y.shape), \" parameters:\", sum(p.numel() for p in net.parameters()))","output":"output: (8, 100, 1)  parameters: 23041","figures":[],"seconds":5.0}],"modules":184,"symbols":439,"outline":{"name":"pinneapple_neural","kind":"package","summary":"Neural network architectures, training, and inference.","src":"doc","children":[{"name":"pinneapple_neural.architectures","kind":"package","summary":"Every model family behind one registry, with adapters that feed each one the data it needs.","src":"note","children":[{"name":"pinneapple_neural.architectures.adapters","kind":"package","summary":"Turn a dataset item into the input each model family expects (PINN, operator, GNN, conv, TS, AE).","src":"note","children":[{"name":"pinneapple_neural.architectures.adapters.ae","kind":"module","summary":"Auto ced automatic loss weight optimisation for PINNs.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.losses","kind":"module","summary":"Loss functions for supervised and physics-aware training.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.metrics","kind":"module","summary":"Metrics for evaluation (MSE, MAE, RMSE, R2, MetricBundle).","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.metrics_cfg","kind":"module","summary":"Build Metrics objects from YAML-driven configuration lists.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.multistart","kind":"module","summary":"Multi-restart PINN training with NaN watchdog and best-model selection.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.noether_trainer","kind":"module","summary":"Noether surrogate trainer for PINNeAPPle.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.normalizers","kind":"module","summary":"Normalizers \u2014 re-exported from pinneapple_data.transforms (single source of truth).","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.parallel","kind":"module","summary":"Parallelization and GPU optimization utilities for pinneapple training.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.preprocess","kind":"module","summary":"Preprocessing pipeline and preprocessing steps for training batches.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.self_scaled_qn","kind":"module","summary":"Self-scaled quasi-Newton optimizers: BFGS, SSBFGS and SSBroyden (dense inverse Hessian).","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.splits","kind":"module","summary":"Train/val/test split strategies \u2014 re-exported from pinneapple_data.splits.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.time_marching","kind":"module","summary":"Sequential time-marching for stiff/long-horizon PDE problems.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.trainer","kind":"module","summary":"Unified Trainer with physics-aware losses, callbacks, and audit logging.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.two_phase","kind":"module","summary":"Two-phase PINN trainer: supervised (Phase 1) \u2192 physics (Phase 2).","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.viz","kind":"module","summary":"Visualization utilities for training history.","src":"doc","children":[]},{"name":"pinneapple_neural.trainer.weight_scheduler","kind":"module","summary":"Automatic loss weight scheduling for PINN training.","src":"doc","children":[]}]},{"name":"pinneapple_neural.workflows","kind":"package","summary":"End-to-end train/predict workflows over PINNeAPPle's neural architectures -- reusable, product-facing entry points (as opposed to pinneapple_neural.architectures/trainer, which expose the lower-level ...","src":"doc","children":[{"name":"pinneapple_neural.workflows.dense_volume_operator","kind":"module","summary":"A reusable train/predict workflow for a grid-based neural operator (~pinneapple_neural.architectures.neural_operators.fno.FNO3d) trained on a DENSE-in-time real volume time series -- e.g. the output ...","src":"doc","children":[]},{"name":"pinneapple_neural.workflows.hybrid_surrogate_physics","kind":"module","summary":"Hybrid model: a data-driven surrogate for intermediate quantities + an explicit physics post-model.","src":"doc","children":[]},{"name":"pinneapple_neural.workflows.parametric_dense_volume_operator","kind":"module","summary":"A joint, multi-case extension of dense_volume_operator: one ~pinneapple_neural.architectures.neural_operators.fno.FNO3d trained across SEVERAL real dense-in-time volume time series that share the ...","src":"doc","children":[]}]}]}},{"name":"pinneapple_lab","group":"trust","title":"Lab","tagline":"Run experiments reproducibly, check them, and grow a database of results, datasets and trust cards.","about":["An experiment is a class with parameters and a `run(ctx)` method. The runner gives every run an id from the experiment, its version and its parameters, and records inputs, outputs, metrics, checks, figures and datasets in one folder indexed in SQLite.","Checks have a kind (physics, reference, baseline, sanity, generalisation, uncertainty), and curation turns them into a tier (A to D) and a six-stage trust card: data and geometry, model, physical constraints, benchmark, uncertainty and engineering decision. `uq` adds coverage of predictive intervals and grid convergence indices. `python -m pinneapple_lab site` writes the public catalogue."],"use_when":["A result will be shown to someone else, and its evidence should travel with it.","You run the same study over many parameters and want to query and compare the runs."],"shim":null,"examples":[{"title":"A minimal experiment with a reference check","code":"import json, math, os, tempfile\nfrom pinneapple_lab import Experiment, register, run\n\n@register\nclass Pendulum(Experiment):\n    name = \"pendulum_doc_example\"\n    params = {\"L\": 1.0, \"theta0\": 0.05}\n    def run(self, ctx):\n        L, th = ctx.params[\"L\"], ctx.params[\"theta0\"]\n        T = 2 * math.pi * math.sqrt(L / 9.81) * (1 + th ** 2 / 16)       # small-angle period + first correction\n        ctx.metric(\"period_s\", T)\n        ctx.check(\"period_matches_small_angle\", value=T / (2 * math.pi * math.sqrt(L / 9.81)),\n                  min=0.999, max=1.002, kind=\"reference\", detail=\"T vs 2 pi sqrt(L/g)\")\n\nroot = tempfile.mkdtemp()\nr = run(\"pendulum_doc_example\", {\"L\": 2.0}, root=root)\nprint(r.status, {k: round(v, 4) for k, v in r.metrics.items()})\nchecks = json.load(open(os.path.join(r.dir, \"validation.json\")))\nprint([(c[\"name\"], c[\"passed\"], c[\"kind\"]) for c in checks])\nprint(\"run folder:\", sorted(os.listdir(r.dir)))","output":"completed {'period_s': 2.8374}\n[('period_matches_small_angle', True, 'reference')]\nrun folder: ['code', 'datasets', 'figures', 'inputs', 'log.txt', 'metrics.json', 'metrics_log.jsonl', 'outputs', 'run.json', 'validation.json']","figures":[],"seconds":0.6},{"title":"Grid convergence index of a mesh study (Celik et al. 2008)","code":"from pinneapple_lab.uq import gci, coverage\nimport numpy as np\n\ng = gci([2.512, 2.571, 2.591], h=[4.0, 2.0, 1.0])          # coarse -> fine\nprint(f\"observed order {g['order']:.2f}, extrapolated {g['extrapolated']:.4f}, GCI {100 * g['gci']:.2f} %\")\n\nrng = np.random.default_rng(0)\ny = rng.normal(size=2000); mean = np.zeros(2000)\nprint(\"coverage of a calibrated 90 % interval:\", round(coverage(y, mean, np.ones(2000), 0.9), 3))\nprint(\"coverage of an over-confident one:     \", round(coverage(y, mean, 0.5 * np.ones(2000), 0.9), 3))","output":"observed order 1.56, extrapolated 2.6013, GCI 0.49 %\ncoverage of a calibrated 90 % interval: 0.904\ncoverage of an over-confident one:      0.593","figures":[],"seconds":0.6}],"modules":29,"symbols":74,"outline":{"name":"pinneapple_lab","kind":"package","summary":"PINNeAPPle Lab: run many experiments reproducibly and grow a database of results and datasets.","src":"doc","children":[{"name":"pinneapple_lab.context","kind":"module","summary":"What an experiment sees while it runs: parameters, and places to put everything it produces.","src":"doc","children":[]},{"name":"pinneapple_lab.curation","kind":"module","summary":"Experiment curation: which runs are good enough to become a product, a paper, marketing or training data.","src":"doc","children":[]},{"name":"pinneapple_lab.dataset","kind":"module","summary":"Datasets produced by experiment runs: samples written in shards, with a card describing them.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments","kind":"package","summary":"Built-in experiments.","src":"doc","children":[{"name":"pinneapple_lab.experiments.accretion","kind":"module","summary":"Black-hole hydrodynamics experiments (pinneapple_physics.blackhole).","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.blackhole_forecast","kind":"module","summary":"Black-hole weather forecasting (Duarte, Nemmen & Navarro 2022; #399) as a lab experiment.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.calculix_cases","kind":"module","summary":"CalculiX through pinneapple_simulation.external_solvers.calculix.study: CAD-like parts meshed by gmsh (C3D10), structured beams (C3D8I), and the analyses an engineer runs first, each against a ...","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.car","kind":"module","summary":"Road-vehicle aerodynamics with a parametric car body and a Physics AI surrogate.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.cylinder","kind":"module","summary":"Lattice-Boltzmann flow past a cylinder: regime, Strouhal number and labelled vorticity images.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.discovery","kind":"module","summary":"Discovering physical laws from data with PINNeAPPle.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.examples","kind":"module","summary":"Every example and use case of the repository as a lab experiment.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.landing","kind":"module","summary":"The cases on the PINNeAPPle Labs landing page that live in public companion repositories, as lab runs.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.ode","kind":"module","summary":"Damped harmonic oscillator: integrators against the exact solution.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.particles","kind":"module","summary":"Solids suspension in a stirred tank: Lagrangian particles (soft-sphere DEM, drag, buoyancy, turbulent dispersion) in an analytic stirred-tank flow (pinneapple_simulation.numerical_solvers.particles), ...","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.pde","kind":"module","summary":"PDE experiments solved with the library's solvers, checked against exact solutions.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.pipes","kind":"module","summary":"Internal flow in pipes and static mixers (OpenFOAM, pinneapple_simulation.numerical_solvers.internal_flow).","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.repo_results","kind":"module","summary":"Results already produced in this repository, imported into the lab as validated runs and datasets.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.rom","kind":"module","summary":"Reduced-order models on the lab's own solvers (pinneapple_neural.architectures.rom).","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.structures","kind":"module","summary":"3-D structural mechanics with the solid finite-element solver (pinneapple_simulation.numerical_solvers.solid_fem, 8-node hexahedra with incompatible modes), checked against closed-form beam and ...","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.vehicles3d","kind":"module","summary":"3-D vehicles in OpenFOAM with photoreal renders: a road car and a launch vehicle.","src":"doc","children":[]},{"name":"pinneapple_lab.experiments.wear","kind":"module","summary":"Sliding wear of bars of different materials (pinneapple_physics.tribology).","src":"doc","children":[]}]},{"name":"pinneapple_lab.html","kind":"module","summary":"A browsable catalogue of the lab: one self-contained HTML page (data and thumbnails embedded).","src":"doc","children":[]},{"name":"pinneapple_lab.reports","kind":"module","summary":"Reports from the lab: one experiment (or case), or many selected by a filter, as HTML, Markdown or PDF.","src":"doc","children":[]},{"name":"pinneapple_lab.runner","kind":"module","summary":"Run experiments: one run, or a sweep over a grid or random samples, optionally in parallel.","src":"doc","children":[]},{"name":"pinneapple_lab.server","kind":"module","summary":"Serve the lab catalogue over HTTP: the browsable page, every run's files, a JSON API and dataset downloads.","src":"doc","children":[]},{"name":"pinneapple_lab.spec","kind":"module","summary":"Experiment specification and registry.","src":"doc","children":[]},{"name":"pinneapple_lab.store","kind":"module","summary":"The lab's database: run folders plus a SQLite index, queries, dataset export and the catalogue.","src":"doc","children":[]},{"name":"pinneapple_lab.uq","kind":"module","summary":"Uncertainty evidence for lab runs: the checks that answer the trust card's \"where may the result not be reliable?\" with numbers instead of declared limitations.","src":"doc","children":[]}]}},{"name":"pinneapple_analysis","group":"trust","title":"Analysis","tagline":"Uncertainty, validation, inverse problems, equation discovery, state estimation and trust scores.","about":["`uncertainty` covers aleatoric heads, MC dropout, deep ensembles, conformal prediction, quantile regression and calibration metrics, behind one `uq_predict` entry point. `validation` checks physical consistency: conservation, boundary conditions, symmetry and agreement with analytical or solver references.","`inverse_problems` estimates parameters from observations (noise models, Tikhonov / TV regularisation with L-curve, local and Sobol sensitivity, ensemble Kalman inversion) and discovers missing terms with SINDy. `state_estimation` has extended and ensemble Kalman filters. `trust` scores a model's predictions before anyone consumes them."],"use_when":["A prediction needs an interval that actually holds its nominal coverage.","You have measurements and want the parameters or the missing physics behind them."],"shim":null,"examples":[{"title":"Conformal prediction: intervals with guaranteed coverage around any model","code":"import torch\nfrom pinneapple_analysis import ConformalPredictor\n\ntorch.manual_seed(0)\nx = torch.rand(3000, 1) * 6\ny = torch.sin(x) + 0.2 * torch.randn_like(x)\nmodel = lambda z: torch.sin(z) * 0.9                 # a slightly biased surrogate\n\ncp = ConformalPredictor(model, alpha=0.1)\ncp.calibrate(x[:1000], y[:1000])\npred, lo, hi = cp.predict(x[1000:])\nprint(f\"interval half-width {cp.quantile:.3f}\")\nprint(f\"empirical coverage on 2000 unseen points: {cp.coverage(x[1000:], y[1000:]):.3f}  (target 0.90)\")","output":"interval half-width 0.346\nempirical coverage on 2000 unseen points: 0.908  (target 0.90)","figures":[],"seconds":3.6},{"title":"SINDy: recover the missing term of a damped oscillator from data","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_analysis import CandidateLibrary, SINDyIdentifier\n\nt = np.linspace(0, 20, 2000)\nx = np.exp(-0.1 * t) * np.cos(2 * t)\nv = np.gradient(x, t, edge_order=2); a = np.gradient(v, t, edge_order=2)\nt, x, v, a = (z[5:-5] for z in (t, x, v, a))        # finite differences are least accurate at the ends\n# known part of the model: a = -4 x ; the residual holds what the model misses\nb = a + 4 * x\nTheta, names = CandidateLibrary(poly_order=2).build(np.column_stack([x, v]))\nnames = [n.replace(\"x0\", \"x\").replace(\"x1\", \"v\") for n in names]\nres = SINDyIdentifier(threshold=0.05).fit(Theta, b, names)\nprint(res.equation(\"a + 4x\"))\nprint(\"true:  a + 4x = -0.2 v - 0.01 x   (x = exp(-0.1 t) cos 2t solves x'' + 0.2 x' + 4.01 x = 0)\")\n\nfig, ax = plt.subplots(figsize=(7, 2.8))\nax.plot(t, b, lw=2, label=\"residual from data\"); ax.plot(t, Theta @ res.coefficients, \"--\", label=\"SINDy model\")\nax.set_xlabel(\"t\"); ax.legend(); ax.set_title(\"discovered damping term\")","output":"a + 4x = -0.009466 * x  -0.2 * v\ntrue:  a + 4x = -0.2 v - 0.01 x   (x = exp(-0.1 t) cos 2t solves x'' + 0.2 x' + 4.01 x = 0)","figures":["figures/pinneapple_analysis__1_0.png"],"seconds":3.5},{"title":"Extended Kalman filter tracking a pendulum from noisy angle readings","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_analysis.state_estimation.kalman import ExtendedKalmanFilter\n\ndt, g_L = 0.02, 9.81\nf = lambda s: np.array([s[0] + dt * s[1], s[1] - dt * g_L * np.sin(s[0])])\nh = lambda s: s[:1]\nrng = np.random.default_rng(1)\ntruth = [np.array([1.0, 0.0])]\nfor _ in range(400):\n    truth.append(f(truth[-1]))\ntruth = np.array(truth)\nobs = truth[:, :1] + rng.normal(0, 0.15, (len(truth), 1))\n\nekf = ExtendedKalmanFilter(2, 1, f, h, Q=np.eye(2) * 1e-5, R=np.eye(1) * 0.15 ** 2)\nekf.initialize(np.array([0.5, 0.0]), np.eye(2))\nest = []\nfor y in obs:\n    ekf.step(y); est.append(ekf.x.copy())\nest = np.array(est)\nprint(f\"angle RMS error: raw readings {np.sqrt(np.mean((obs[:, 0] - truth[:, 0]) ** 2)):.3f} rad,\"\n      f\" filter {np.sqrt(np.mean((est[100:, 0] - truth[100:, 0]) ** 2)):.3f} rad (after spin-up)\")\nprint(f\"angular velocity is never measured; filter RMS error {np.sqrt(np.mean((est[100:, 1] - truth[100:, 1]) ** 2)):.3f} rad/s\")\n\ntt = np.arange(len(truth)) * dt\nfig, ax = plt.subplots(figsize=(7, 2.8))\nax.plot(tt, obs[:, 0], \".\", ms=2, c=\"0.6\", label=\"readings\"); ax.plot(tt, truth[:, 0], label=\"truth\")\nax.plot(tt, est[:, 0], \"--\", label=\"EKF\"); ax.set_xlabel(\"t (s)\"); ax.set_ylabel(\"angle (rad)\"); ax.legend(ncol=3, fontsize=7)","output":"angle RMS error: raw readings 0.137 rad, filter 0.018 rad (after spin-up)\nangular velocity is never measured; filter RMS error 0.048 rad/s","figures":["figures/pinneapple_analysis__2_0.png"],"seconds":3.9}],"modules":70,"symbols":228,"outline":{"name":"pinneapple_analysis","kind":"package","summary":"Model analysis, validation, and inversion.","src":"doc","children":[{"name":"pinneapple_analysis.cost","kind":"package","summary":"Computational-cost validation per operation (time, memory, FLOPs, scaling, budgets, regressions).","src":"doc","children":[{"name":"pinneapple_analysis.cost.profiler","kind":"module","summary":"Computational-cost validation per operation: measure, fit scaling, check budgets, catch regressions.","src":"doc","children":[]},{"name":"pinneapple_analysis.cost.torch_ops","kind":"module","summary":"Cost per operation for PyTorch models: the PINN training step broken into its parts, and a per-operator table.","src":"doc","children":[]}]},{"name":"pinneapple_analysis.data_assimilation","kind":"package","summary":"Data assimilation: variational (4D-Var through autograd) on top of the ensemble methods in pinneapple_analysis.inverse_problems (EKI) and pinneapple_analysis.state_estimation (Kalman filters).","src":"doc","children":[{"name":"pinneapple_analysis.data_assimilation.models","kind":"module","summary":"Small chaotic models used to test data-assimilation methods, written in PyTorch so they are differentiable.","src":"doc","children":[]},{"name":"pinneapple_analysis.data_assimilation.var4d","kind":"module","summary":"Strong-constraint 4D-Var through any differentiable PyTorch model: the adjoint comes from autograd.","src":"doc","children":[]}]},{"name":"pinneapple_analysis.inspection","kind":"package","summary":"Non-Destructive Evaluation (NDE) / inspection PINN suite: synthetic signal generation + physics-informed training for six inspection modalities.","src":"doc","children":[{"name":"pinneapple_analysis.inspection.acoustic","kind":"module","summary":"Acoustic/vibration condition-spectrum synthetic generation (resonance/impact-echo style NDE) and physics-informed training.","src":"doc","children":[]},{"name":"pinneapple_analysis.inspection.base","kind":"module","summary":"Shared PINN backbone and generic training wrapper for the inspection/NDE modalities in this package.","src":"doc","children":[]},{"name":"pinneapple_analysis.inspection.eddy_current","kind":"module","summary":"Probe-scan synthetic signal generation and physics-informed training for eddy-current NDE, on top of the *existing* axisymmetric complex-Helmholtz FDM solver in ...","src":"doc","children":[]},{"name":"pinneapple_analysis.inspection.emat","kind":"module","summary":"A deliberately simplified Electromagnetic Acoustic Transducer (EMAT) synthetic signal generator and physics-informed training path.","src":"doc","children":[]},{"n ,"children":[]},{"name":"pinneapple_analysis.verification.tool_recommendation","kind":"module","summary":"External tool/player recommendation -- the sibling of solver_orchestration for tools OUTSIDE PINNeAPPle: given a physics problem, which real, named CFD/FEM/multiphysics/meshing/visualization/UQ ...","src":"doc","children":[]},{"name":"pinneapple_analysis.verification.uncertainty_inverse","kind":"module","summary":"Wiring PINNeAPPle's REAL uncertainty-quantification and inverse-problem machinery into the Physics Verification Engine pipeline -- roadmap points 13 (\"Inverse modelling\") and 14 (\"Uncertainty ...","src":"doc","children":[]}]}]}},{"name":"pinneapple_data","group":"data","title":"Data","tagline":"Physical samples, collocation, datasets, sharded storage, preflight and lineage.","about":["`PhysicalSample` and the UPD format keep fields together with their coordinates, units and metadata; Zarr stores and sharded iterables stream them to training. `CollocationSampler` draws PINN points (uniform, Latin hypercube, Sobol or residual-adaptive) inside boxes, SDF shapes, meshes or STL files, and `active_learning` refines them where the residual or the variance is high.","`cae` reads meshes and fields from CAE formats and measures mesh quality; `preflight` checks a case before it is solved; `lineage` records where every dataset came from; `datasets` is the registry of built-in and public datasets."],"use_when":["You need collocation points for a PINN in a non-trivial region.","You are building a training set from solver runs and want units, splits and provenance kept."],"shim":null,"examples":[{"title":"Collocation points in a box, Latin hypercube versus uniform random","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_data import CollocationSampler\n\nfig, ax = plt.subplots(1, 2, figsize=(7.5, 3.4))\nfor a, strategy in zip(ax, (\"uniform\", \"lhs\")):\n    s = CollocationSampler.from_bounds({\"x\": (0.0, 1.0), \"y\": (0.0, 1.0)}, strategy=strategy, seed=3)\n    batch = s.sample(n_col=200, n_bc=0)\n    pts = np.column_stack([batch[\"x_col\"][:, 0], batch[\"x_col\"][:, 1]]) if \"x_col\" in batch else None\n    if pts is None:\n        print(\"batch keys:\", list(batch.keys())); break\n    a.plot(pts[:, 0], pts[:, 1], \".\", ms=4); a.set_title(strategy); a.set_aspect(\"equal\")\n    # discrepancy proxy: largest empty cell of a 10 x 10 grid\n    H, _, _ = np.histogram2d(pts[:, 0], pts[:, 1], bins=10, range=[[0, 1], [0, 1]])\n    print(f\"{strategy:8s}: empty cells of a 10x10 grid = {(H == 0).sum()}\")","output":"uniform : empty cells of a 10x10 grid = 13\nlhs     : empty cells of a 10x10 grid = 12","figures":["figures/pinneapple_data__0_0.png"],"seconds":4.7}],"modules":100,"symbols":302,"outline":{"name":"pinneapple_data","kind":"package","summary":"Contains active_learning, adapters, augmentation, cache, cache_bytes.","src":"auto","children":[{"name":"pinneapple_data.active_learning","kind":"module","summary":"Active Learning for adaptive collocation in PINN training.","src":"doc","children":[]},{"name":"pinneapple_data.adapters","kind":"package","summary":"Bring geometry, solver bundles and archives into the unified physical data format and PINN batches.","src":"note","children":[{"name":"pinneapple_data.adapters.geom_adapter","kind":"module","summary":"Geometry loading and attachment utilities for PhysicalSample via pinneapple_geom.","src":"doc","children":[]},{"name":"pinneapple_data.adapters.pinn_batch_builders","kind":"module","summary":"PINN batch builders: convert various data sources into the unified dict-batch format.","src":"doc","children":[]},{"name":"pinneapple_data.adapters.splash_archive_adapter","kind":"module","summary":"Loader for a Splash-CFD .splash case (a zipped OpenFOAM case directory) into plain numpy arrays -- both a flat point-cloud form (for PINN-style training) and a dense structured-grid volume time ...","src":"doc","children":[]},{"name":"pinneapple_data.adapters.upd_ h background producer and optional GPU transfer.","src":"doc","children":[]},{"name":"pinneapple_data.zarr_shard_iterable","kind":"module","summary":"Shard-aware IterableDataset for balanced iteration over multi-shard Zarr UPD stores.","src":"doc","children":[]},{"name":"pinneapple_data.zarr_shards","kind":"module","summary":"Sharded Zarr writer for partitioning UPD samples by key with index-based discovery.","src":"doc","children":[]},{"name":"pinneapple_data.zarr_store","kind":"module","summary":"Zarr-backed UPD store for PhysicalSample persistence with columnar layout.","src":"doc","children":[]}]}},{"name":"pinneapple_design","group":"systems","title":"Design","tagline":"Geometry from signed distance functions, physics domains, airfoils, meshes and design optimisation.","about":["`geometry` builds shapes as signed distance functions (20+ primitives, Boolean and smooth Boolean operations, transforms), turns them into physics domains with named boundaries (channel, cavity, pipe, L-shape, annulus, T-junction, any SDF), meshes them and samples them for 3-D PINNs. It also generates NACA airfoils and imports STL / STEP.","`design_optimizer` closes the loop: shape parametrisation, adjoint gradients, surrogates, Bayesian and evolutionary optimisers, Pareto fronts and manufacturing constraints. `aero`, `thermal` and `qualitative` add domain models and a quick preview of how a geometry change should move the physics."],"use_when":["You need a domain with holes or blends for a PINN or a mesh.","You want to optimise a shape against a physics objective."],"shim":null,"examples":[{"title":"A bracket from signed distance functions","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_design import sdf2d_rectangle, sdf2d_circle, sdf_difference, sdf_smooth_union\n\nn = 300\nX, Y = np.meshgrid(np.linspace(-1.2, 1.2, n), np.linspace(-0.8, 0.8, n))\nP = np.column_stack([X.ravel(), Y.ravel()])\nplate = sdf2d_rectangle(P, (0.0, 0.0), (1.0, 0.25))\nboss = sdf2d_circle(P, (-0.8, 0.0), 0.45)\nbody = sdf_smooth_union(plate, boss, k=0.15)\nholes = np.minimum(sdf2d_circle(P, (-0.8, 0.0), 0.2), sdf2d_circle(P, (0.7, 0.0), 0.12))\nd = sdf_difference(body, holes).reshape(n, n)\n\narea = (d < 0).mean() * 2.4 * 1.6\nprint(f\"area of the part: {area:.3f}\")\nprint(f\"signed distance at the centre of the big hole: {d[n // 2, int((-0.8 + 1.2) / 2.4 * n)]:.3f} (radius 0.2 -> +0.2)\")\nfig, ax = plt.subplots(figsize=(7, 3.4))\nim = ax.contourf(X, Y, d, levels=30, cmap=\"RdBu\"); ax.contour(X, Y, d, levels=[0], colors=\"k\")\nax.set_aspect(\"equal\"); fig.colorbar(im, ax=ax, label=\"signed distance\"); ax.set_title(\"bracket = plate U boss - holes\")","output":"area of the part: 1.147\nsigned distance at the centre of the big hole: 0.193 (radius 0.2 -> +0.2)","figures":["figures/pinneapple_design__0_0.png"],"seconds":4.6},{"title":"NACA four-digit airfoils","code":"import matplotlib.pyplot as plt\nfrom pinneapple_design import naca_parametric\n\nfig, ax = plt.subplots(figsize=(7, 2.4))\nfor m, p, t, name in [(0, 0, 0.12, \"0012\"), (0.02, 0.4, 0.12, \"2412\"), (0.04, 0.4, 0.15, \"4415\")]:\n    xy = naca_parametric(m=m, p=p, t_c=t, n_pts=120).numpy()\n    ax.plot(xy[:, 0], xy[:, 1], label=f\"NACA {name}\")\n    print(f\"NACA {name}: {xy.shape[0]} points, max thickness {xy[:, 1].max() - xy[:, 1].min():.3f} c\")\nax.set_aspect(\"equal\"); ax.legend(fontsize=7); ax.set_xlabel(\"x / c\")","output":"NACA 0012: 120 points, max thickness 0.120 c\nNACA 2412: 120 points, max thickness 0.122 c\nNACA 4415: 120 points, max thickness 0.156 c","figures":["figures/pinneapple_design__1_0.png"],"seconds":4.8}],"modules":92,"symbols":372,"outline":{"name":"pinneapple_design","kind":"package","summary":"Geometry construction and physics-guided design optimization.","src":"doc","children":[{"name":"pinneapple_design.aero","kind":"package","summary":"Aerodynamic design: airfoil shapes, O-grid meshes, OpenFOAM cases, aircraft performance, surrogate-based sear zer","kind":"module","summary":"Sizing: requirements in, verified heat-sink designs out.","src":"doc","children":[]},{"name":"pinneapple_design.thermal.heatsink.surrogate","kind":"module","summary":"Neural surrogate of the physics engine, used only to *screen* designs.","src":"doc","children":[]},{"name":"pinneapple_design.thermal.heatsink.trust","kind":"module","summary":"Trust report for the heat-sink surrogates.","src":"doc","children":[]}]}]}]}},{"name":"pinneapple_systems","group":"systems","title":"Systems","tagline":"Time series, co-simulation, digital twins, component and process models.","about":["`time_series` forecasts physical signals with classical and neural models (LSTM, GRU, N-BEATS, TCN, TFT, gradient boosting, FFT and HHT hybrids), always next to naive, seasonal-naive and drift baselines, with rolling backtests, audits and plots.","`cosimulation` composes analytical nodes, PINNs and symbolic PDEs into a differentiable graph. `digital_twin` wraps a surrogate as a live twin with sensor streams (MQTT, Kafka, HTTP, files), Kalman assimilation and anomaly detection. `component_modeling`, `component_library` and `process_components` hold reusable equipment models."],"use_when":["You forecast a sensor signal and need to know whether you beat a naive forecast.","You couple several models (or a model and live data) into one system."],"shim":null,"examples":[{"title":"Baselines every forecaster must beat","code":"import numpy as np\nimport matplotlib.pyplot as plt\nfrom pinneapple_systems import NaiveForecaster, SeasonalNaiveForecaster, DriftForecaster\n\nrng = np.random.default_rng(0)\nt = np.arange(240)\ny = 20 + 0.03 * t + 3 * np.sin(2 * np.pi * t / 24) + rng.normal(0, 0.4, t.size)   # hourly temperature\ntrain, test = y[:216], y[216:]\nfig, ax = plt.subplots(figsize=(7.5, 2.8))\nax.plot(t[150:], y[150:], c=\"k\", lw=1, label=\"measured\")\nfor model in (NaiveForecaster(), SeasonalNaiveForecaster(season_length=24), DriftForecaster()):\n    p = model.fit(train).predict(24)\n    print(f\"{type(model).__name__:26s} MAE over 24 h: {np.mean(np.abs(p - test)):.2f}\")\n    ax.plot(t[216:], p, \"--\", label=type(model).__name__)\nax.axvline(216, c=\"0.5\", lw=0.8); ax.legend(fontsize=7); ax.set_xlabel(\"hour\")","output":"NaiveForecaster            MAE over 24 h: 1.98\nSeasonalNaiveForecaster    MAE over 24 h: 0.64\nDriftForecaster            MAE over 24 h: 2.11","figures":["figures/pinneapple_systems__0_0.png"],"seconds":5.8}],"modules":112,"symbols":327,"outline":{"name":"pinneapple_systems","kind":"package","summary":"Multi-component physical systems (time series, co-simulation, digital twins).","src":"doc","children":[{"name":"pinneapple_systems.component_library","kind":"package","summary":"The piece pinneapple_systems.component_modeling's own docstring says pinneapple deliberately did NOT build: a registry of NAMED PLANT COMPONENTS (keyed by component_type, e.g. \"pipe\"/\"pump\"/\"valve\"), ...","src":"doc","children":[{"name":"pinneapple_systems.component_library.base","kind":"module","summary":"ComponentModel: a BaseModel that additionally knows its physical constraint (a Physics) and offers single-call .fit()/.evaluate() convenience, closing the two real gaps found against a plain ...","src":"doc","children":[]},{"name":"pinneapple_systems.component_library.benchmark","kind":"module","summary":"Train every architecture registered under one component_type and rank by final validation loss (real numbers from ComponentModel.fit(), not a display placeholder).","src":"doc","children":[]},{"name":"pinneapple_systems.component_library.components","kind":"module","summary":"Six reference plant components.","src":"doc","children":[]},{"name":"pinneapple_systems.component_library.physics","kind":"module","summary":"Physics: the thin attachment layer between a named plant component and the constraint it must satisfy.","src":"doc","children":[]},{"name":"pinneapple_systems.component_library.registry","kind":"module","summary" = np.meshgrid(x, y)\nu = np.sin(X) * np.cos(Y); v = -np.cos(X) * np.sin(Y)\nw = compute_vorticity_2d(u, v, x, y)\nq = compute_q_criterion_2d(u, v, x, y)\nprint(f\"max |vorticity| {np.abs(w).max():.3f} (exact 2), Q > 0 in {100 * (q > 0).mean():.0f} % of the box\")\n\nfig, ax = plt.subplots(1, 2, figsize=(8.5, 3.6))\nax[0].contourf(X, Y, w, 40, cmap=\"RdBu_r\"); ax[0].streamplot(x, y, u, v, color=\"k\", density=0.8, linewidth=0.5)\nax[0].set_title(\"vorticity + streamlines\"); ax[1].contourf(X, Y, q, 40, cmap=\"viridis\"); ax[1].set_title(\"Q-criterion\")\n[a.set_aspect(\"equal\") for a in ax]","output":"max |vorticity| 1.999 (exact 2), Q > 0 in 51 % of the box","figures":["figures/pinneapple_tools__0_0.png"],"seconds":5.6},{"title":"Export a model to TorchScript and check it reproduces the outputs","code":"import os, tempfile, torch\nfrom pinneapple_tools import export_torchscript\n\nnet = torch.nn.Sequential(torch.nn.Linear(2, 32), torch.nn.Tanh(), torch.nn.Linear(32, 1))\nx = torch.rand(5, 2)\npath = os.path.join(tempfile.mkdtemp(), \"model.pt\")\nout = export_torchscript(net, path, example_input=x)\nloaded = torch.jit.load(out if isinstance(out, str) else path)\nprint(\"exported:\", os.path.basename(path), f\"{os.path.getsize(path) / 1024:.1f} kB\")\nprint(\"max difference after reload:\", float((loaded(x) - net(x)).abs().max()))","output":"exported: model.pt 7.4 kB\nmax difference after reload: 0.0","figures":[],"seconds":5.7}],"modules":108,"symbols":264,"outline":{"name":"pinneapple_tools","kind":"package","summary":"Visualization, model export, HPO, benchmarking, and compute backends.","src":"doc","children":[{"name":"pinneapple_tools.aero_coefficients","kind":"module","summary":"Shared aerodynamic-coefficient utilities (Cp, surface-force integration, CL/CD/CM).","src":"doc","children":[]},{"name":"pinneapple_tools.benchmark_suite","kind":"package","summary":"Benchmark runner: tasks, back-ends (native, DeepXDE, JAX, PhysicsNeMo), leaderboards and reports.","sr
