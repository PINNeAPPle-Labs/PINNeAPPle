<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PINNeAPPle Twin3D</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #5c6475; --line: #d9dde5;
    --accent: #2f6fde; --alarm: #d6453d; --ok: #1f9d55; --viewport: #e9ecf1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b5; --line: #2c3340;
      --accent: #6b9cff; --alarm: #ff6b62; --ok: #4cc983; --viewport: #0e1116;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b5; --line: #2c3340;
    --accent: #6b9cff; --alarm: #ff6b62; --ok: #4cc983; --viewport: #0e1116;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr auto; height: 100%; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  aside { overflow: auto; padding: 12px 16px; border-right: 1px solid var(--line); background: var(--panel); }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  #viewport { position: relative; background: var(--viewport); min-height: 0; }
  #viewport canvas { display: block; width: 100%; height: 100%; }
  footer { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    border-top: 1px solid var(--line); background: var(--panel); }
  footer input[type=range] { flex: 1; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; }
  select, input[type=number], button { font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .part-actions button { padding: 0 6px; font-size: 11px; margin-left: auto; }
  #legend { position: absolute; right: 16px; top: 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; min-width: 150px; }
  #legend .bar { height: 10px; border-radius: 3px; margin: 6px 0 2px; }
  #legend .ticks { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
  #probe { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font-variant-numeric: tabular-nums; display: none; }
  .sensor { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 3px 0; }
  .sensor .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .sensor.alarm .dot { background: var(--alarm); }
  .sensor.alarm .val { color: var(--alarm); font-weight: 600; }
  .val { font-variant-numeric: tabular-nums; }
  .tag { position: absolute; transform: translate(-50%, -130%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; font-size: 11px; white-space: nowrap; pointer-events: none; }
  .tag.alarm { border-color: var(--alarm); color: var(--alarm); }
  #status { color: var(--muted); }
  #error { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 45vh 1fr auto; }
    header, footer { grid-column: 1; }
    aside { order: 3; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">PINNeAPPle Twin3D</h1>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <span id="live" class="meta"></span>
    <button id="fit" title="Enquadrar tudo">Enquadrar</button>
    <button id="theme" title="Alternar tema">Tema</button>
  </header>
  <aside>
    <h2>Campo</h2>
    <select id="field" style="width:100%"></select>
    <div class="grid2" style="margin-top:6px">
      <select id="cmap"><option value="turbo">Turbo</option><option value="viridis">Viridis</option><option value="coolwarm">Coolwarm</option></select>
      <label class="row"><input type="checkbox" id="autorange" checked> Faixa auto</label>
      <input type="number" id="vmin" step="any" placeholder="mín">
      <input type="number" id="vmax" step="any" placeholder="máx">
    </div>
    <h2>Corte</h2>
    <div class="grid2">
      <select id="clipAxis"><option value="">Sem corte</option><option value="0">Plano X</option><option value="1">Plano Y</option><option value="2">Plano Z</option></select>
      <label class="row"><input type="checkbox" id="clipFlip"> Inverter</label>
    </div>
    <input type="range" id="clipPos" min="0" max="1000" value="500" style="width:100%">
    <h2>Peças</h2>
    <div id="parts"></div>
    <h2>Sensores</h2>
    <div id="sensors"></div>
  </aside>
  <main id="viewport">
    <div id="legend"><div id="legendName"></div><div class="bar" id="legendBar"></div><div class="ticks"><span id="lmin"></span><span id="lmax"></span></div></div>
    <div id="probe"></div>
    <div id="error"></div>
  </main>
  <footer>
    <button id="play">▶</button>
    <input type="range" id="time" min="0" max="0" value="0">
    <span id="timeLabel" class="val"></span>
    <span id="status"></span>
  </footer>
</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
